<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GATE CS 2027 preparation: the full 2027 syllabus, formula cards, revision sheets, mastery tracking and GATE-marked practice quizzes." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b1426" />
    <title>GATE Atlas · CS 2027</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        const saved = JSON.parse(localStorage.getItem('gate-atlas:prefs') || '{}').state?.theme;
        const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>GATE Atlas needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
