<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" font-family="sans-serif" font-size="12">
<title>Square table with Murali at the top, Rahul right, Srinivas bottom, Arul left; Srinivas sits opposite Murali</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="130" y="80" width="100" height="100" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="205" y="165" text-anchor="middle" fill="#222" font-size="12">table</text>
<rect x="140" y="32" width="80" height="34" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="180" y="54" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Murali</text>
<rect x="260" y="112" width="80" height="34" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="300" y="134" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Rahul</text>
<rect x="140" y="197" width="80" height="34" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="180" y="219" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Srinivas</text>
<rect x="20" y="112" width="80" height="34" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="134" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Arul</text>
<line x1="180" y1="68" x2="180" y2="197" stroke="#222" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="100" y1="130" x2="260" y2="130" stroke="#222" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="205" y="124" text-anchor="middle" fill="#222" font-size="10">opposite</text>
<text x="176" y="104" text-anchor="end" fill="#222" font-size="10">opposite</text>
<text x="180" y="16" text-anchor="middle" fill="#222" font-size="12">Murali faces the table: Rahul is on his left</text>
<text x="180" y="252" text-anchor="middle" fill="#222" font-size="12">Arul faces the table: Srinivas is on his right</text>
<text x="180" y="272" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Opposite: Murali-Srinivas and Rahul-Arul</text>
</svg>
