<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 334" font-family="sans-serif" font-size="12">
<title>Six seats round a table with two women both left-handed, each with a left-handed person to her right, and three right-handed men</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="200" cy="160" r="48" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="200" y="164" text-anchor="middle" fill="#222" font-size="12">table</text>
<circle cx="200.0" cy="60.0" r="25" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="200.0" y="59.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">M L</text>
<text x="200.0" y="72.0" text-anchor="middle" fill="#222" font-size="9">seat 1</text>
<circle cx="113.4" cy="110.0" r="25" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113.4" y="109.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">M R</text>
<text x="113.4" y="122.0" text-anchor="middle" fill="#222" font-size="9">seat 2</text>
<circle cx="113.4" cy="210.0" r="25" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113.4" y="209.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">M R</text>
<text x="113.4" y="222.0" text-anchor="middle" fill="#222" font-size="9">seat 3</text>
<circle cx="200.0" cy="260.0" r="25" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="200.0" y="259.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">M R</text>
<text x="200.0" y="272.0" text-anchor="middle" fill="#222" font-size="9">seat 4</text>
<circle cx="286.6" cy="210.0" r="25" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="286.6" y="209.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">W L</text>
<text x="286.6" y="222.0" text-anchor="middle" fill="#222" font-size="9">seat 5</text>
<circle cx="286.6" cy="110.0" r="25" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="286.6" y="109.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">W L</text>
<text x="286.6" y="122.0" text-anchor="middle" fill="#222" font-size="9">seat 6</text>
<line x1="176.6" y1="73.5" x2="138.5" y2="95.5" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="113.4" y1="137.0" x2="113.4" y2="181.0" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="136.8" y1="223.5" x2="174.9" y2="245.5" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="223.4" y1="246.5" x2="261.5" y2="224.5" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="286.6" y1="183.0" x2="286.6" y2="139.0" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="263.2" y1="96.5" x2="225.1" y2="74.5" stroke="#222" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="200" y="14" text-anchor="middle" fill="#222" font-size="12">Arrows point to each person's immediate right</text>
<text x="200" y="300" text-anchor="middle" fill="#222" font-size="12">M = man, W = woman (shaded), L = left-handed, R = right-handed</text>
<text x="200" y="320" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2 women, 3 right-handed (seats 2, 3, 4), 3 left-handed</text>
</svg>
