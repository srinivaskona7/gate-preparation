<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="sans-serif">
<title>Grid of four people against four shirts with the two forbidden cells crossed, and the count by Arun's choice: white gives 6, pink gives 4, blue gives 4, total 14</title>
<text x="150.0" y="56" text-anchor="middle" font-size="20" fill="#222">red</text>
<text x="230.0" y="56" text-anchor="middle" font-size="20" fill="#222">pink</text>
<text x="310.0" y="56" text-anchor="middle" font-size="20" fill="#222">blue</text>
<text x="390.0" y="56" text-anchor="middle" font-size="20" fill="#222">white</text>
<text x="98" y="105.0" text-anchor="end" font-size="20" fill="#222">Arun</text>
<rect x="110" y="70" width="80" height="56" fill="#f6b3b3" stroke="#222" stroke-width="1.5"/>
<line x1="124" y1="82" x2="176" y2="114" stroke="#222" stroke-width="3"/><line x1="176" y1="82" x2="124" y2="114" stroke="#222" stroke-width="3"/>
<rect x="190" y="70" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="270" y="70" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="350" y="70" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="98" y="161.0" text-anchor="end" font-size="20" fill="#222">Gulab</text>
<rect x="110" y="126" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="190" y="126" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="270" y="126" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="350" y="126" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="98" y="217.0" text-anchor="end" font-size="20" fill="#222">Neel</text>
<rect x="110" y="182" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="190" y="182" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="270" y="182" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="350" y="182" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="98" y="273.0" text-anchor="end" font-size="20" fill="#222">Shweta</text>
<rect x="110" y="238" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="190" y="238" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="270" y="238" width="80" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="350" y="238" width="80" height="56" fill="#f6b3b3" stroke="#222" stroke-width="1.5"/>
<line x1="364" y1="250" x2="416" y2="282" stroke="#222" stroke-width="3"/><line x1="416" y1="250" x2="364" y2="282" stroke="#222" stroke-width="3"/>
<text x="270" y="328" text-anchor="middle" font-size="18" fill="#222">crossed cell = disliked colour</text>
<text x="270" y="356" text-anchor="middle" font-size="18" fill="#222">one shirt each, no shirt repeated</text>
<text x="470" y="52" text-anchor="start" font-size="22" fill="#222" font-weight="bold">Count by Arun's shirt</text>
<text x="470" y="100" text-anchor="start" font-size="20" fill="#222" font-weight="bold">Arun white</text>
<text x="470" y="126" text-anchor="start" font-size="17" fill="#222">other three: 3! = 6</text>
<text x="800" y="112" text-anchor="end" font-size="28" fill="#222" font-weight="bold">6</text>
<text x="470" y="166" text-anchor="start" font-size="20" fill="#222" font-weight="bold">Arun pink</text>
<text x="470" y="192" text-anchor="start" font-size="17" fill="#222">Shweta not white: 2 choices x 2! = 4</text>
<text x="800" y="178" text-anchor="end" font-size="28" fill="#222" font-weight="bold">4</text>
<text x="470" y="232" text-anchor="start" font-size="20" fill="#222" font-weight="bold">Arun blue</text>
<text x="470" y="258" text-anchor="start" font-size="17" fill="#222">Shweta not white: 2 choices x 2! = 4</text>
<text x="800" y="244" text-anchor="end" font-size="28" fill="#222" font-weight="bold">4</text>
<line x1="470" y1="300" x2="800" y2="300" stroke="#222" stroke-width="2"/>
<text x="470" y="340" text-anchor="start" font-size="22" fill="#222" font-weight="bold">Total  6 + 4 + 4</text>
<text x="800" y="340" text-anchor="end" font-size="30" fill="#222" font-weight="bold">14</text>
<text x="470" y="380" text-anchor="start" font-size="18" fill="#222">Check: 24 - 6 - 6 + 2 = 14 (option D)</text>
</svg>
