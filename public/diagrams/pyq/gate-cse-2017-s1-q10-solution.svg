<circle cx="205.0" cy="40" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="205.0" y="45" text-anchor="middle" font-size="14" fill="#222">S</text>
<text x="40" y="108" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">a</text>
<text x="84" y="108" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">b</text>
<circle cx="194.0" cy="102" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="194.0" y="107" text-anchor="middle" font-size="14" fill="#222">S</text>
<text x="128" y="170" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">a</text>
