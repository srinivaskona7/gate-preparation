<circle cx="260.0" cy="164" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="260.0" y="169" text-anchor="middle" font-size="14" fill="#222">T</text>
<text x="260" y="232" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">b</text>
<text x="304" y="108" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">c</text>
<circle cx="370.0" cy="102" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="370.0" y="107" text-anchor="middle" font-size="14" fill="#222">T</text>
<text x="348" y="170" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">b</text>
<circle cx="392.0" cy="164" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="392.0" y="169" text-anchor="middle" font-size="14" fill="#222">T</text>
<text x="392" y="232" text-anchor="middle" font-size="18" fill="#222" font-weight="bold" font-family="monospace">b</text>
<text x="20" y="282" text-anchor="start" font-size="12" fill="#222">yield ababcbcbb = (ab)^2 c b c bb: n = 2 blocks, each T chooses its own b-length (1, then 2).</text>
<text x="20" y="304" text-anchor="start" font-size="12" fill="#222">So the blocks need not match each other: this is option B, not C or D.</text>
