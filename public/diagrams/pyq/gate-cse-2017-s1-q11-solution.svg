<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" font-family="sans-serif" font-size="13">
<title>Layout of struct data: marks occupies bytes 0 to 399, grade is at byte 400, so X(R1) with X = 400 reaches it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="60" width="300" height="36" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="170" y="83" text-anchor="middle" fill="#222" font-size="12">marks[100]: 400 bytes</text><rect x="320" y="60" width="60" height="36" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="350" y="83" text-anchor="middle" fill="#222" font-size="12">grade</text><rect x="380" y="60" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3"/><text x="415" y="83" text-anchor="middle" fill="#222" font-size="12">padding</text><rect x="450" y="60" width="80" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="490" y="83" text-anchor="middle" fill="#222" font-size="12">cnumber</text><text x="20" y="52" text-anchor="start" fill="#222" font-size="11">byte 0</text><text x="320" y="52" text-anchor="start" fill="#222" font-size="11">400</text><text x="450" y="52" text-anchor="start" fill="#222" font-size="11">404 (if aligned)</text><text x="20" y="135" text-anchor="start" fill="#222" font-size="12">R1 = base address of student; the address of grade is R1 + 400.</text><text x="20" y="158" text-anchor="start" fill="#222" font-size="12">Index mode X(R1) with X = 400 (fits a 16-bit signed offset) does it in one operand.</text>
</svg>
