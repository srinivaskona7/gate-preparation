<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif" font-size="13">
<title>Pointer x first points to heap block A holding 0, then the second malloc makes x point to block B holding 10 and block A is leaked</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Heap and stack before and after the second assignval call</text>
<text x="20" y="52" fill="#222" font-size="13" text-anchor="start" font-weight="bold">After x = assignval(x, 0)</text>
<text x="20" y="80" fill="#222" font-size="12" text-anchor="start">stack (main)</text>
<rect x="20" y="88" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="55" y="110" fill="#222" font-size="13" text-anchor="middle">x</text>
<text x="190" y="80" fill="#222" font-size="12" text-anchor="start">heap</text>
<rect x="210" y="88" width="120" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270" y="104" fill="#222" font-size="12" text-anchor="middle">block A</text>
<text x="270" y="118" fill="#222" font-size="11" text-anchor="middle">holds 0</text>
<path d="M90,105 L208,105" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="400" y="52" fill="#222" font-size="13" text-anchor="start" font-weight="bold">After x = assignval(x, 10)</text>
<text x="400" y="80" fill="#222" font-size="12" text-anchor="start">stack (main)</text>
<rect x="400" y="88" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="435" y="110" fill="#222" font-size="13" text-anchor="middle">x</text>
<text x="570" y="80" fill="#222" font-size="12" text-anchor="start">heap</text>
<rect x="590" y="88" width="120" height="34" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="650" y="104" fill="#222" font-size="12" text-anchor="middle">block A</text>
<text x="650" y="118" fill="#222" font-size="11" text-anchor="middle">holds 0</text>
<rect x="590" y="150" width="120" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="650" y="166" fill="#222" font-size="12" text-anchor="middle">block B</text>
<text x="650" y="180" fill="#222" font-size="11" text-anchor="middle">holds 10</text>
<path d="M470,115 L588,160" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="590" y="206" fill="#222" font-size="12" text-anchor="start">no pointer to A remains:</text>
<text x="590" y="222" fill="#222" font-size="12" text-anchor="start" font-weight="bold">A is never freed (memory leak)</text>
<text x="20" y="260" fill="#222" font-size="12" text-anchor="start">Why the second malloc runs: if (x) tests the pointer, and the pointer is not NULL (the value 0 is in *x, not in x).</text>
<text x="20" y="280" fill="#222" font-size="12" text-anchor="start" font-weight="bold">printf prints *x = 10; free(x) releases B only.  Option D.</text>
</svg>
