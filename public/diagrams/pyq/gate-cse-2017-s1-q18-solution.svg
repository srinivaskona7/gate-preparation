<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 388" font-family="sans-serif" font-size="13">
<title>Two threads in one process: global variables and the heap both lie in the shared address space; each thread has a private stack, registers and program counter</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="300" y="24" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Global variables and the heap are both shared</text>
<rect x="20" y="40" width="560" height="330" rx="6" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="30" y="58" text-anchor="start" fill="#222" font-size="12" font-weight="bold">one process = one address space</text>
<rect x="40" y="70" width="520" height="118" rx="6" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="300" y="90" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">SHARED by all threads</text>
<rect x="55" y="104" width="118" height="36" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="114" y="127" text-anchor="middle" fill="#222" font-size="12">code</text>
<rect x="183" y="104" width="118" height="36" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="242" y="127" text-anchor="middle" fill="#222" font-size="12">global variables</text>
<rect x="311" y="104" width="118" height="36" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="370" y="127" text-anchor="middle" fill="#222" font-size="12">heap</text>
<rect x="439" y="104" width="118" height="36" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="498" y="127" text-anchor="middle" fill="#222" font-size="12">open files (fd table)</text>
<text x="300" y="168" text-anchor="middle" fill="#222" font-size="12">the page table (address space) is the same for every thread</text>
<rect x="40" y="204" width="254" height="150" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="167" y="224" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T1: PRIVATE</text>
<rect x="52" y="236" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="167" y="256" text-anchor="middle" fill="#222" font-size="12">program counter</text>
<rect x="52" y="274" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="167" y="294" text-anchor="middle" fill="#222" font-size="12">registers (general purpose)</text>
<rect x="52" y="312" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="167" y="332" text-anchor="middle" fill="#222" font-size="12">stack pointer and own stack</text>
<rect x="306" y="204" width="254" height="150" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="433" y="224" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T2: PRIVATE</text>
<rect x="318" y="236" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="433" y="256" text-anchor="middle" fill="#222" font-size="12">program counter</text>
<rect x="318" y="274" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="433" y="294" text-anchor="middle" fill="#222" font-size="12">registers (general purpose)</text>
<rect x="318" y="312" width="230" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="433" y="332" text-anchor="middle" fill="#222" font-size="12">stack pointer and own stack</text>
</svg>
