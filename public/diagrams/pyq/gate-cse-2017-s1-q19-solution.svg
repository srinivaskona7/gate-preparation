<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="sans-serif">
<title>Distribution function of Y = max(X, 0): it is 0 for negative y, jumps to 0.5 at y = 0, then rises to 1; the median is the point 0 where it first reaches 0.5</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
