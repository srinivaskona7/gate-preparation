<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>Two small models of the sentence for all x there is y with R(x,y): one makes statement II false, the other makes statement III false</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="30" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Model 1: R = {(1,2), (2,1)}</text>
<text x="30" y="56" text-anchor="start" fill="#222" font-size="12" font-weight="bold">x</text>
<text x="140" y="56" text-anchor="start" fill="#222" font-size="12" font-weight="bold">y</text>
<line x1="50" y1="80" x2="120" y2="140" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="50" y1="140" x2="120" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="35" cy="80" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="35" y="84.5" text-anchor="middle" fill="#222" font-size="12">1</text>
<circle cx="135" cy="80" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="135" y="84.5" text-anchor="middle" fill="#222" font-size="12">1</text>
<circle cx="35" cy="140" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="35" y="144.5" text-anchor="middle" fill="#222" font-size="12">2</text>
<circle cx="135" cy="140" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="135" y="144.5" text-anchor="middle" fill="#222" font-size="12">2</text>
<text x="20" y="190" text-anchor="start" fill="#222" font-size="12">Every x has an arrow out, so F holds.</text>
<text x="20" y="210" text-anchor="start" fill="#222" font-size="12">Nobody receives from all x: II is false.</text>
<text x="340" y="30" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Model 2: R = {(1,1), (2,1)}</text>
<text x="350" y="56" text-anchor="start" fill="#222" font-size="12" font-weight="bold">x</text>
<text x="460" y="56" text-anchor="start" fill="#222" font-size="12" font-weight="bold">y</text>
<line x1="370" y1="80" x2="440" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="370" y1="140" x2="440" y2="80" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="355" cy="80" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="355" y="84.5" text-anchor="middle" fill="#222" font-size="12">1</text>
<circle cx="455" cy="80" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="455" y="84.5" text-anchor="middle" fill="#222" font-size="12">1</text>
<circle cx="355" cy="140" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="355" y="144.5" text-anchor="middle" fill="#222" font-size="12">2</text>
<circle cx="455" cy="140" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="455" y="144.5" text-anchor="middle" fill="#222" font-size="12">2</text>
<text x="340" y="190" text-anchor="start" fill="#222" font-size="12">Every x has an arrow out, so F holds.</text>
<text x="340" y="210" text-anchor="start" fill="#222" font-size="12">y = 2 receives no arrow: III is false.</text>
<text x="20" y="250" text-anchor="start" fill="#222" font-size="12" font-weight="bold">An arrow x to y means R(x,y). I and IV are true in every model of F (see steps).</text>
<text x="20" y="270" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Answer: I and IV only.</text>
</svg>
