<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif" font-size="13">
<title>A tree on 10 vertices with each vertex degree written beside it: the degrees add to 18, twice the 9 edges</title>
<line x1="60" y1="100" x2="140" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="140" y1="100" x2="220" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="220" y1="100" x2="300" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="300" y1="100" x2="380" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="380" y1="100" x2="460" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="220" y1="100" x2="220" y2="180" stroke="#222" stroke-width="1.8"/>
<line x1="220" y1="180" x2="220" y2="260" stroke="#222" stroke-width="1.8"/>
<line x1="380" y1="100" x2="380" y2="180" stroke="#222" stroke-width="1.8"/>
<line x1="380" y1="180" x2="380" y2="260" stroke="#222" stroke-width="1.8"/>
<circle cx="60" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="104.5" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="60" y="78" text-anchor="middle" fill="#222" font-size="11">deg 1</text>
<circle cx="140" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="140" y="104.5" text-anchor="middle" fill="#222" font-size="12">2</text>
<text x="140" y="78" text-anchor="middle" fill="#222" font-size="11">deg 2</text>
<circle cx="220" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="220" y="104.5" text-anchor="middle" fill="#222" font-size="12">3</text>
<text x="220" y="78" text-anchor="middle" fill="#222" font-size="11">deg 3</text>
<circle cx="300" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="300" y="104.5" text-anchor="middle" fill="#222" font-size="12">4</text>
<text x="300" y="78" text-anchor="middle" fill="#222" font-size="11">deg 2</text>
<circle cx="380" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="380" y="104.5" text-anchor="middle" fill="#222" font-size="12">5</text>
<text x="380" y="78" text-anchor="middle" fill="#222" font-size="11">deg 3</text>
<circle cx="460" cy="100" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="460" y="104.5" text-anchor="middle" fill="#222" font-size="12">6</text>
<text x="460" y="78" text-anchor="middle" fill="#222" font-size="11">deg 1</text>
<circle cx="220" cy="180" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="220" y="184.5" text-anchor="middle" fill="#222" font-size="12">7</text>
<text x="242" y="184" text-anchor="start" fill="#222" font-size="11">deg 2</text>
<circle cx="220" cy="260" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="220" y="264.5" text-anchor="middle" fill="#222" font-size="12">8</text>
<text x="242" y="264" text-anchor="start" fill="#222" font-size="11">deg 1</text>
<circle cx="380" cy="180" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="380" y="184.5" text-anchor="middle" fill="#222" font-size="12">9</text>
<text x="402" y="184" text-anchor="start" fill="#222" font-size="11">deg 2</text>
<circle cx="380" cy="260" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="380" y="264.5" text-anchor="middle" fill="#222" font-size="12">10</text>
<text x="402" y="264" text-anchor="start" fill="#222" font-size="11">deg 1</text>
<text x="520" y="150" text-anchor="start" fill="#222" font-size="13" font-weight="bold">9 edges (n - 1)</text>
<text x="520" y="175" text-anchor="start" fill="#222" font-size="12">Each edge adds 1 to</text>
<text x="520" y="192" text-anchor="start" fill="#222" font-size="12">the degree of both ends.</text>
<text x="520" y="225" text-anchor="start" fill="#222" font-size="11">1+2+3+2+3+1+2+1+2+1</text>
<text x="520" y="245" text-anchor="start" fill="#222" font-size="13" font-weight="bold">= 18 = 2 x 9</text>
</svg>
