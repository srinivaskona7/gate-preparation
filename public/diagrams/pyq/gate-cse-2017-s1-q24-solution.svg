<text x="30" y="154" text-anchor="start" fill="#222" font-size="12">Waiting = completion - arrival - burst: P1 12-0-7 = 5, P2 6-3-3 = 0, P3 17-5-5 = 7, P4 8-6-2 = 0</text>
