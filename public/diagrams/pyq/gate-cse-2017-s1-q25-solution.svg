<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 192" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Per 1000 instructions: 1400 accesses, 140 L1 misses reach L2, 7 L2 misses, local L2 miss rate 0.05</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">Follow 1000 instructions down the hierarchy</text><rect x="20" y="40" width="130" height="58" stroke-width="2"/><text x="85" y="64" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">1000</text><text x="85" y="82" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">instructions</text><rect x="200" y="40" width="130" height="58" stroke-width="2"/><text x="265" y="64" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">1400</text><text x="265" y="82" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">accesses (x 1.4)</text><rect x="380" y="40" width="130" height="58" stroke-width="2"/><text x="445" y="64" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">140</text><text x="445" y="82" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">L1 misses (x 0.1)</text><rect x="560" y="40" width="130" height="58" stroke-width="2"/><text x="625" y="64" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">7</text><text x="625" y="82" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">L2 misses (given)</text><line x1="150" y1="69" x2="192" y2="69"/><polygon points="200,69 192,65 192,73" fill="#1f2937" stroke="none"/><line x1="330" y1="69" x2="372" y2="69"/><polygon points="380,69 372,65 372,73" fill="#1f2937" stroke="none"/><line x1="510" y1="69" x2="552" y2="69"/><polygon points="560,69 552,65 552,73" fill="#1f2937" stroke="none"/><text x="445" y="120" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">these 140 are the accesses that reach L2</text><text x="10" y="156" fill="#1f2937" stroke="none" font-weight="bold">L2 miss rate = L2 misses / L2 accesses = 7 / 140 = 0.05.</text><text x="10" y="178" fill="#1f2937" stroke="none" font-size="11">Dividing by all 1400 accesses would give the global rate 7 / 1400 = 0.005.</text></svg>
