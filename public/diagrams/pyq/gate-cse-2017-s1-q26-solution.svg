<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" font-family="sans-serif">
<title>Cycle a b d c with distinct weights 1, 4, 2, 3: the minimum spanning tree is unique but the shortest paths from a to d tie at weight 5</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="70" cy="115" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="70" y="119.5" text-anchor="middle" font-size="13" fill="#222">a</text>
<circle cx="230" cy="45" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="230" y="49.5" text-anchor="middle" font-size="13" fill="#222">b</text>
<circle cx="230" cy="185" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="230" y="189.6" text-anchor="middle" font-size="13" fill="#222">c</text>
<circle cx="390" cy="115" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="390" y="119.5" text-anchor="middle" font-size="13" fill="#222">d</text>
<line x1="83.7" y1="109.0" x2="216.3" y2="51.0" stroke="#222" stroke-width="3"/>
<text x="140.0" y="74.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1</text>
<line x1="83.7" y1="121.0" x2="216.3" y2="179.0" stroke="#222" stroke-width="3"/>
<text x="140.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">2</text>
<line x1="243.7" y1="179.0" x2="376.3" y2="121.0" stroke="#222" stroke-width="3"/>
<text x="322.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">3</text>
<line x1="243.7" y1="51.0" x2="376.3" y2="109.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="322.0" y="74.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">4</text>
<text x="445" y="40" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Bold: the unique MST</text>
<text x="445" y="58" text-anchor="start" font-size="12" fill="#222">(1, 2, 3), weight 6</text>
<text x="445" y="95" text-anchor="start" font-size="12" font-weight="bold" fill="#222">a to d via b: 1 + 4 = 5</text>
<text x="445" y="115" text-anchor="start" font-size="12" font-weight="bold" fill="#222">a to d via c: 2 + 3 = 5</text>
<text x="445" y="135" text-anchor="start" font-size="12" fill="#222">two shortest paths</text>
<text x="20" y="222" text-anchor="start" font-size="12" fill="#222">Distinct weights make the MST unique, not the shortest path.</text>
</svg>
