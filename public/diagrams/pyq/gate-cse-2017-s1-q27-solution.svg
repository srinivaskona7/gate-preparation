<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="sans-serif" font-size="13">
<title>One thread and one non-reentrant lock: the thread locks l, then asks for l again, blocks on itself and can never release it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">x = 1 thread T, y = 1 lock l, and l is non-reentrant.</text>
<rect x="20" y="60" width="200" height="70" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="120.0" y="89.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">T runs lock(l)</text>
<text x="120.0" y="109.0" text-anchor="middle" fill="#222" font-size="12">l is free: T gets it</text>
<rect x="290" y="60" width="200" height="70" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="390.0" y="89.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">l is held by T</text>
<text x="390.0" y="109.0" text-anchor="middle" fill="#222" font-size="12">owner = T</text>
<rect x="560" y="60" width="200" height="70" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="660.0" y="89.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">T runs lock(l) again</text>
<text x="660.0" y="109.0" text-anchor="middle" fill="#222" font-size="12">l is held: T blocks</text>
<line x1="220.0" y1="95.0" x2="290.0" y2="95.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="490.0" y1="95.0" x2="560.0" y2="95.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 660 130 C 660 200, 390 200, 390 134" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="525" y="158" text-anchor="middle" fill="#222" font-size="12">T waits for l, which only T can release</text>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="12">T cannot reach its unlock, so l stays held forever: a deadlock with one thread and one lock.</text>
<text x="20" y="254" text-anchor="start" fill="#222" font-size="12">Every program has at least one thread and one lock, so (x, y) = (1, 1) is already the minimum.</text>
<text x="20" y="284" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Correct: D</text>
</svg>
