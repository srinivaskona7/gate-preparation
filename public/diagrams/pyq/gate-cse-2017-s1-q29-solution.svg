<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="sans-serif" font-size="13">
<title>Truth table over the three assignments where (p implies q) implies r is false, with the value of (r implies p) implies q in the last column</title>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Assignments that make (p ⇒ q) ⇒ r false: r = F and p ⇒ q = T</text>
<rect x="20" y="40" width="45" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="42.5" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">p</text>
<rect x="65" y="40" width="45" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="87.5" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">q</text>
<rect x="110" y="40" width="45" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="132.5" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">r</text>
<rect x="155" y="40" width="70" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="190.0" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">p ⇒ q</text>
<rect x="225" y="40" width="120" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(p ⇒ q) ⇒ r</text>
<rect x="345" y="40" width="70" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">r ⇒ p</text>
<rect x="415" y="40" width="120" height="30" fill="#eee" stroke="#222" stroke-width="1.2"/>
<text x="475.0" y="60" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(r ⇒ p) ⇒ q</text>
<rect x="20" y="70" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="42.5" y="90" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="65" y="70" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="87.5" y="90" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="110" y="70" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="132.5" y="90" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="155" y="70" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="190.0" y="90" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="225" y="70" width="120" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="90" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="345" y="70" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="90" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="415" y="70" width="120" height="30" fill="#ddd" stroke="#222" stroke-width="1.2"/>
<text x="475.0" y="90" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="20" y="100" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="42.5" y="120" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="65" y="100" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="87.5" y="120" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="110" y="100" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="132.5" y="120" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="155" y="100" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="190.0" y="120" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="225" y="100" width="120" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="120" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="345" y="100" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="120" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="415" y="100" width="120" height="30" fill="#ddd" stroke="#222" stroke-width="1.2"/>
<text x="475.0" y="120" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="20" y="130" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="42.5" y="150" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="65" y="130" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="87.5" y="150" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="110" y="130" width="45" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="132.5" y="150" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="155" y="130" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="190.0" y="150" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="225" y="130" width="120" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="150" text-anchor="middle" fill="#222" font-size="12">F</text>
<rect x="345" y="130" width="70" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="150" text-anchor="middle" fill="#222" font-size="12">T</text>
<rect x="415" y="130" width="120" height="30" fill="#ddd" stroke="#222" stroke-width="1.2"/>
<text x="475.0" y="150" text-anchor="middle" fill="#222" font-size="12">T</text>
<text x="20" y="185" text-anchor="start" fill="#222" font-size="12">A tautology? No, the last column has an F (row 1).</text>
<text x="20" y="205" text-anchor="start" fill="#222" font-size="12">A contradiction? No, it has T in rows 2 and 3.</text>
<text x="20" y="225" text-anchor="start" fill="#222" font-size="12">Always true when p is F? No, row 1 has p = F and value F.</text>
<text x="20" y="245" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Always true when q is T? Yes: rows 2 and 3 are the only rows with q = T. Answer D.</text>
</svg>
