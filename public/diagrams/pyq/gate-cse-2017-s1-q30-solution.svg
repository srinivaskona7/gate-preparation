<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="sans-serif">
<title>Rhombus with sides u and 2v of equal length 10: its diagonal w = u + 2v bisects the angle between u and v, so alpha = 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g stroke="#222" stroke-width="2" fill="none">
<line x1="80" y1="300" x2="278" y2="300" marker-end="url(#ah)"/>
<line x1="80" y1="300" x2="138" y2="222" stroke-width="3" marker-end="url(#ah)"/>
<line x1="138" y1="222" x2="198" y2="142" stroke-dasharray="6 5" stroke-width="1.6"/>
<line x1="80" y1="300" x2="398" y2="142" stroke-width="3" marker-end="url(#ah)"/>
<line x1="280" y1="300" x2="400" y2="140" stroke-dasharray="3 4" stroke-width="1.4"/>
<line x1="200" y1="140" x2="400" y2="140" stroke-dasharray="3 4" stroke-width="1.4"/>
<path d="M140,300 A60,60 0 0 0 133.7,273.2" stroke-width="1.6"/>
<path d="M133.7,273.2 A60,60 0 0 0 116,252" stroke-width="1.6"/>
</g>
<g fill="#222" font-size="14">
<text x="62" y="318">O</text>
<text x="170" y="320" font-weight="bold">u = (10, 0), |u| = 10</text>
<text x="86" y="212" font-weight="bold">v = (3, 4)</text>
<text x="86" y="228" font-size="12">|v| = 5</text>
<text x="132" y="128">2v, |2v| = 10</text>
<text x="404" y="136" font-weight="bold">w = u + 2v = (16, 8)</text>
<text x="146" y="287" font-size="12">θ</text>
<text x="124" y="262" font-size="12">θ</text>
<text x="316" y="228" font-size="12" transform="rotate(-53 316 228)">|2v| = |u| = 10</text>
</g>
<g fill="#222" font-size="13">
<text x="40" y="30" font-weight="bold">Why alpha = 2</text>
<text x="40" y="50">The diagonal of a rhombus bisects the angle at its corner.</text>
<text x="40" y="68">The sides u and αv from O form a rhombus only when |αv| = |u|.</text>
<text x="40" y="86">|u| = 2|v|, so α|v| = 2|v| gives α = 2 (α = -2 points the other way).</text>
</g>
</svg>
