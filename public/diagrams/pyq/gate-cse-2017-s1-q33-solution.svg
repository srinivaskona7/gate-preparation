<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="sans-serif" font-size="13">
<title>State graph of Q1Q0: starting at 11 the circuit goes 01, 10, 11, 01, so after the 3rd cycle it is 11 and after the 4th it is 01</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="260" cy="50" r="28" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="260" y="54.333333333333336" text-anchor="middle" fill="#222" font-size="13">11</text>
<circle cx="400" cy="200" r="28" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="400" y="204.33333333333334" text-anchor="middle" fill="#222" font-size="13">01</text>
<circle cx="120" cy="200" r="28" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="120" y="204.33333333333334" text-anchor="middle" fill="#222" font-size="13">10</text>
<path d="M279.1,70.5 Q330.0,125.0 378.2,176.6" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="377.31768174964" y="118.26894473175713" text-anchor="middle" fill="#222" font-size="12">clock 1, 4</text>
<path d="M372.0,200.0 Q260.0,200.0 152.0,200.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="261.0" y="218.0" text-anchor="middle" fill="#222" font-size="12">clock 2</text>
<path d="M139.1,179.5 Q190.0,125.0 238.2,73.4" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="149.31768174963997" y="119.73105526824287" text-anchor="middle" fill="#222" font-size="12">clock 3</text>
<text x="260" y="270" text-anchor="middle" fill="#222" font-size="12">00 would stay at 00 forever, but it is not reached from 11</text>
</svg>
