<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" font-family="sans-serif" font-size="13">
<title>T flip-flop with output Q1 feeding the D input of a D flip-flop, whose output Q0 is wired back to the T input; one common clock</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="110" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="132" y="104" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">T</text>
<polyline points="110,130 121,138 110,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="171" y="100" text-anchor="middle" fill="#222" font-size="12">Q</text>
<rect x="290" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="312" y="104" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">D</text>
<polyline points="290,130 301,138 290,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="351" y="100" text-anchor="middle" fill="#222" font-size="12">Q</text>
<line x1="180" y1="95" x2="290" y2="95" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="188" y="87" text-anchor="start" fill="#222" font-size="12">Q1</text>
<line x1="360" y1="95" x2="395" y2="95" stroke="#222" stroke-width="1.6"/>
<text x="366" y="87" text-anchor="start" fill="#222" font-size="12">Q0</text>
<polyline points="395,95 395,32 70,32 70,95 110,95" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="40,200 276,200" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="34" y="204" text-anchor="end" fill="#222" font-size="12">Clock</text>
<polyline points="96,200 96,138 110,138" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="276,200 276,138 290,138" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="240" y="222" text-anchor="middle" fill="#222" font-size="12">Initially Q1 = Q0 = 1</text>
</svg>
