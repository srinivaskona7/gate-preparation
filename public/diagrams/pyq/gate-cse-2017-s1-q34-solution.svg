<text x="20" y="344" text-anchor="start" font-size="12" fill="#222">abbaa = ab · baa.  S → SS;  the left S → aSb with S → ε;</text>
<text x="20" y="366" text-anchor="start" font-size="12" fill="#222">the right S → bSa, whose inner S → SaS has both S → ε.</text>
<text x="20" y="388" text-anchor="start" font-size="12" fill="#222">Every production keeps #a - #b ≥ 0, so babba (three b, two a) cannot be generated.</text>
