<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 438" font-family="sans-serif" font-size="13">
<title>Call chain of fun1(5) and fun2: values printed before each inner call and after it returns, giving 53423122233445</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Call chain of fun1(5): each call prints once before its inner call and once after it returns</text>
<text x="400" y="48" fill="#222" font-size="12" text-anchor="middle">prints before the call</text>
<text x="560" y="48" fill="#222" font-size="12" text-anchor="middle">n at the end</text>
<text x="660" y="48" fill="#222" font-size="12" text-anchor="middle">prints after</text>
<rect x="20" y="58" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="80" y="77" fill="#222" font-size="13" text-anchor="middle">fun1(5)</text>
<text x="400" y="77" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">5</text>
<text x="560" y="77" fill="#222" font-size="13" text-anchor="middle">5</text>
<text x="660" y="77" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">5</text>
<path d="M80,86 L102,98" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="42" y="98" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="102" y="117" fill="#222" font-size="13" text-anchor="middle">fun2(3)</text>
<text x="400" y="117" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">3</text>
<text x="560" y="117" fill="#222" font-size="13" text-anchor="middle">4</text>
<text x="660" y="117" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">4</text>
<text x="700" y="117" fill="#222" font-size="11" text-anchor="start">(++n made n 4)</text>
<path d="M102,126 L124,138" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="64" y="138" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="124" y="157" fill="#222" font-size="13" text-anchor="middle">fun1(4)</text>
<text x="400" y="157" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">4</text>
<text x="560" y="157" fill="#222" font-size="13" text-anchor="middle">4</text>
<text x="660" y="157" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">4</text>
<path d="M124,166 L146,178" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="86" y="178" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="146" y="197" fill="#222" font-size="13" text-anchor="middle">fun2(2)</text>
<text x="400" y="197" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">2</text>
<text x="560" y="197" fill="#222" font-size="13" text-anchor="middle">3</text>
<text x="660" y="197" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">3</text>
<text x="700" y="197" fill="#222" font-size="11" text-anchor="start">(++n made n 3)</text>
<path d="M146,206 L168,218" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="108" y="218" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="168" y="237" fill="#222" font-size="13" text-anchor="middle">fun1(3)</text>
<text x="400" y="237" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">3</text>
<text x="560" y="237" fill="#222" font-size="13" text-anchor="middle">3</text>
<text x="660" y="237" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">3</text>
<path d="M168,246 L190,258" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="130" y="258" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="190" y="277" fill="#222" font-size="13" text-anchor="middle">fun2(1)</text>
<text x="400" y="277" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">1</text>
<text x="560" y="277" fill="#222" font-size="13" text-anchor="middle">2</text>
<text x="660" y="277" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">2</text>
<text x="700" y="277" fill="#222" font-size="11" text-anchor="start">(++n made n 2)</text>
<path d="M190,286 L212,298" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="152" y="298" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="212" y="317" fill="#222" font-size="13" text-anchor="middle">fun1(2)</text>
<text x="400" y="317" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">2</text>
<text x="560" y="317" fill="#222" font-size="13" text-anchor="middle">2</text>
<text x="660" y="317" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">2</text>
<rect x="174" y="338" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="234" y="357" fill="#222" font-size="13" text-anchor="middle">fun2(0)</text>
<text x="400" y="357" fill="#222" font-size="12" text-anchor="middle">returns, nothing printed</text>
<text x="20" y="398" fill="#222" font-size="13" text-anchor="start">Printed on the way down: 5 3 4 2 3 1 2.   Printed on the way back (innermost first): 2 2 3 3 4 4 5.</text>
<text x="20" y="420" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Output: 5342312 2233445 = 53423122233445   (option A).  No call ever prints 0.</text>
</svg>
