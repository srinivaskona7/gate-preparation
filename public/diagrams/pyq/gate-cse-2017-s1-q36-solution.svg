<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 350" font-family="sans-serif" font-size="13">
<title>foo(3) repeats foo(3) forever and overflows the stack, bar(3) reaches bar(1) whose loop calls bar(0) forever at constant depth</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-size="13" text-anchor="start" font-weight="bold">foo(3) and bar(3): how each call chain behaves</text>
<text x="20" y="52" fill="#222" font-size="13" text-anchor="start" font-weight="bold">foo: foo(val--) passes the OLD val</text>
<rect x="30" y="64" width="230" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145" y="84" fill="#222" font-size="12" text-anchor="middle">foo(3)</text>
<path d="M145,94 L145,108" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="108" width="230" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145" y="128" fill="#222" font-size="12" text-anchor="middle">foo(3)  (inner, val still 3)</text>
<path d="M145,138 L145,152" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="152" width="230" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145" y="172" fill="#222" font-size="12" text-anchor="middle">foo(3)  (inner, val still 3)</text>
<path d="M145,182 L145,196" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="196" width="230" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145" y="216" fill="#222" font-size="12" text-anchor="middle">foo(3)  ...</text>
<text x="30" y="248" fill="#222" font-size="12" text-anchor="start">The same call repeats and never returns.</text>
<text x="30" y="266" fill="#222" font-size="12" text-anchor="start">Frames pile up until the stack overflows:</text>
<text x="30" y="284" fill="#222" font-size="12" text-anchor="start" font-weight="bold">abnormal termination.</text>
<text x="400" y="52" fill="#222" font-size="13" text-anchor="start" font-weight="bold">bar: bar(val-1) passes a smaller value</text>
<rect x="410" y="64" width="200" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="510" y="84" fill="#222" font-size="12" text-anchor="middle">bar(3)</text>
<path d="M510,94 L510,108" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="410" y="108" width="200" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="510" y="128" fill="#222" font-size="12" text-anchor="middle">bar(2)</text>
<path d="M510,138 L510,152" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="410" y="152" width="200" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="510" y="172" fill="#222" font-size="12" text-anchor="middle">bar(1)</text>
<path d="M510,182 L510,196" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="410" y="196" width="200" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="510" y="216" fill="#222" font-size="12" text-anchor="middle">bar(0)  returns 0</text>
<path d="M610,167 C680,167 680,211 612,211" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M410,211 C350,211 350,167 408,167" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="410" y="246" fill="#222" font-size="11" text-anchor="start">back in bar(1): val is still 1, so the while test is true again</text>
<text x="410" y="268" fill="#222" font-size="12" text-anchor="start">bar(1) calls bar(0) again and again; the depth stays at 4.</text>
<text x="410" y="286" fill="#222" font-size="12" text-anchor="start">The program loops forever without crashing:</text>
<text x="410" y="304" fill="#222" font-size="12" text-anchor="start" font-weight="bold">infinite loop.</text>
<text x="20" y="330" fill="#222" font-size="13" text-anchor="start" font-weight="bold">foo(3): abnormal termination.  bar(3): infinite loop.  Option C.</text>
</svg>
