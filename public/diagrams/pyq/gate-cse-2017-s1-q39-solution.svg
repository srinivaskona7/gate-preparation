<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="sans-serif" font-size="13">
<title>Two procedures: from a machine computing f build a decider for L_f by computing f(x) and comparing; from a decider for L_f build a machine computing f by trying every y until x#y is accepted</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="14" font-weight="bold">f computable gives L_f recursive</text>
<rect x="20" y="40" width="130" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="85" y="62" text-anchor="middle" fill="#222" font-size="12">input</text>
<text x="85" y="78" text-anchor="middle" fill="#222" font-size="13">x # y</text>
<line x1="150" y1="65" x2="195" y2="65" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="195" y="40" width="170" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="280" y="62" text-anchor="middle" fill="#222" font-size="12">run M on x</text>
<text x="280" y="78" text-anchor="middle" fill="#222" font-size="13">get f(x)</text>
<line x1="365" y1="65" x2="410" y2="65" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="410" y="40" width="170" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="495" y="62" text-anchor="middle" fill="#222" font-size="12">is y equal</text>
<text x="495" y="78" text-anchor="middle" fill="#222" font-size="13">to f(x)?</text>
<line x1="580" y1="55" x2="640" y2="45" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="612" y="40" text-anchor="middle" fill="#222" font-size="11">yes</text>
<rect x="640" y="30" width="120" height="30" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="700" y="50" text-anchor="middle" fill="#222" font-size="12">accept</text>
<line x1="580" y1="75" x2="640" y2="85" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="612" y="98" text-anchor="middle" fill="#222" font-size="11">no</text>
<rect x="640" y="75" width="120" height="30" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="700" y="95" text-anchor="middle" fill="#222" font-size="12">reject</text>
<text x="390" y="128" text-anchor="middle" fill="#222" font-size="12">both steps halt, so this is a decider for L_f</text>
<text x="20" y="170" text-anchor="start" fill="#222" font-size="14" font-weight="bold">L_f recursive gives f computable</text>
<rect x="20" y="190" width="130" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="85" y="212" text-anchor="middle" fill="#222" font-size="12">input</text>
<text x="85" y="228" text-anchor="middle" fill="#222" font-size="13">x</text>
<line x1="150" y1="215" x2="195" y2="215" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="195" y="190" width="170" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="280" y="212" text-anchor="middle" fill="#222" font-size="12">next y in order:</text>
<text x="280" y="228" text-anchor="middle" fill="#222" font-size="12">e, 0, 1, 00, 01 ...</text>
<line x1="365" y1="215" x2="410" y2="215" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="410" y="190" width="170" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="495" y="212" text-anchor="middle" fill="#222" font-size="12">run decider of</text>
<text x="495" y="228" text-anchor="middle" fill="#222" font-size="13">L_f on x#y</text>
<line x1="580" y1="205" x2="640" y2="195" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="612" y="190" text-anchor="middle" fill="#222" font-size="11">yes</text>
<rect x="640" y="180" width="120" height="30" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="700" y="200" text-anchor="middle" fill="#222" font-size="12">output y = f(x)</text>
<path d="M 495,240 C 495,270 280,270 280,242" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="390" y="278" text-anchor="middle" fill="#222" font-size="11">no: try the next y</text>
<text x="390" y="312" text-anchor="middle" fill="#222" font-size="12">f is total, so exactly one y is accepted, and the search reaches it after finitely many tries</text>
<text x="390" y="340" text-anchor="middle" fill="#222" font-size="12">A recogniser for L_f works too (try all y and step counts together), so (B) is also provable;</text>
<text x="390" y="358" text-anchor="middle" fill="#222" font-size="12">the official key lists (A) only</text>
</svg>
