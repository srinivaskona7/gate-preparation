<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" font-family="sans-serif" font-size="13">
<title>Waits-for edges always run from a younger to an older transaction</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="40" y1="80" x2="480" y2="80" stroke="#222" stroke-width="1.5"/><circle cx="80" cy="80" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="80" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">A</text><circle cx="200" cy="80" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="200" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">B</text><circle cx="320" cy="80" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="320" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">C</text><circle cx="440" cy="80" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="440" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">D</text><path d="M200,52 Q140,20 80,52" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><path d="M320,52 Q260,20 200,52" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><path d="M440,52 Q260,-10 80,52" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="80" y="135" text-anchor="middle" font-size="12" fill="#111">oldest</text><text x="440" y="135" text-anchor="middle" font-size="12" fill="#111">youngest</text><text x="260" y="160" text-anchor="middle" font-size="12" fill="#111">T waits only for an older holder: no cycle is possible; an older requester kills the holder</text>
</svg>