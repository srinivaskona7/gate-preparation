<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" fill="#1f2937"><title>Control-flow paths double with every if: two ifs give 4 paths, ten ifs give 2 to the power 10</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<text x="20" y="24" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">stmt -&gt; if expr then expr else expr ; stmt : the ifs follow one another, never inside each other</text>
<rect x="20" y="100" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="55.0" y="120" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 1</text>
<rect x="150" y="60" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="185.0" y="80" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">then 1</text>
<rect x="150" y="140" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="185.0" y="160" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">else 1</text>
<line x1="90" y1="108" x2="148" y2="76" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="90" y1="122" x2="148" y2="156" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="280" y="100" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="315.0" y="120" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 2</text>
<line x1="220" y1="76" x2="278" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="220" y1="156" x2="278" y2="122" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="410" y="60" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="445.0" y="80" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">then 2</text>
<rect x="410" y="140" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="445.0" y="160" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">else 2</text>
<line x1="350" y1="108" x2="408" y2="76" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="350" y1="122" x2="408" y2="156" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="540" y="100" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="575.0" y="120" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 3</text>
<line x1="480" y1="76" x2="538" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="480" y1="156" x2="538" y2="122" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="650" y="120" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f2937">...</text>
<line x1="612" y1="115" x2="632" y2="115" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="700" y="100" width="70" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="735.0" y="120" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">exit</text>
<line x1="668" y1="115" x2="698" y2="115" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="20" y="230" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">paths from the start to each point</text>
<text x="55" y="252" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 1: 1</text>
<text x="315" y="252" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 2: 2</text>
<text x="575" y="252" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">cond 3: 4</text>
<text x="735" y="252" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">exit: 2^10</text>
<text x="20" y="290" font-size="12" text-anchor="start" fill="#1f2937">Each if has two ways through (then or else) and both rejoin at the next cond, so every if doubles the count.</text>
<text x="20" y="312" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Ten ifs: 2 x 2 x ... x 2 (ten times) = 2^10 = 1024.</text>
</svg>
