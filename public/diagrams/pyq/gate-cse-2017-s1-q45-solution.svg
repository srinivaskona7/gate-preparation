<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256">
<title>Stop-and-wait cycle of 17.75 ms with 15.84 ms of frame transmission</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="102" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Sender</text>
<rect x="110.0" y="50" width="633.6" height="30" rx="0" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="426.8" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">send 1980 bytes = 15.84 ms (1960 data + 20 overhead)</text>
<rect x="743.6" y="50" width="76.4" height="30" rx="0" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="781.8" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">wait</text>
<text x="102" y="116" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Receiver</text>
<rect x="773.6" y="94" width="10.0" height="30" rx="0" fill="#fbe9a8" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="783.6" y="94" width="6.4" height="30" rx="0" fill="#cdebc9" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="110" y1="138" x2="880" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="138" x2="110.0" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<line x1="743.6" y1="138" x2="743.6" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="743.6" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">15.84</text>
<line x1="820.0" y1="138" x2="820.0" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820.0" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">17.75</text>
<line x1="820.0" y1="36" x2="820.0" y2="138" stroke="#b00020" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="820.0" y="32" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#b00020">ACK received</text>
<text x="10" y="188" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Yellow: receiver processes the frame, 0.25 ms. Green: receiver sends the 20-byte ACK, 0.16 ms.</text>
<text x="10" y="202" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Useful data time = 1960 bytes = 15.68 ms. Efficiency = 15.68 / 17.75 = 88.34 %</text>
</svg>
