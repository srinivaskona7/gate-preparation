<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif" font-size="13">
<title>Venn diagram of multiples of 3, 5 and 7 among 1 to 500 with the count in each region; the seven regions add to 271</title>
<circle cx="150" cy="125" r="95" fill="none" stroke="#222" stroke-width="1.8"/>
<circle cx="260" cy="125" r="95" fill="none" stroke="#222" stroke-width="1.8"/>
<circle cx="205" cy="215" r="95" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="15" y="28" text-anchor="start" fill="#222" font-size="12" font-weight="bold">multiples of 3</text>
<text x="300" y="28" text-anchor="start" fill="#222" font-size="12" font-weight="bold">multiples of 5</text>
<text x="205" y="330" text-anchor="start" fill="#222" font-size="12" font-weight="bold">multiples of 7</text>
<text x="100" y="100" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">114</text>
<text x="310" y="100" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">57</text>
<text x="205" y="265" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">38</text>
<text x="205" y="85" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">29</text>
<text x="150" y="185" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">19</text>
<text x="262" y="185" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">10</text>
<text x="205" y="150" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">4</text>
<text x="400" y="80" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Counts by inclusion-exclusion</text>
<text x="400" y="110" text-anchor="start" fill="#222" font-size="13">166 + 100 + 71 = 337</text>
<text x="400" y="134" text-anchor="start" fill="#222" font-size="13">- (33 + 23 + 14) = - 70</text>
<text x="400" y="158" text-anchor="start" fill="#222" font-size="13">+ 4</text>
<text x="400" y="182" text-anchor="start" fill="#222" font-size="13" font-weight="bold">= 271</text>
<text x="400" y="225" text-anchor="start" fill="#222" font-size="12">Regions: 114 + 57 + 38 + 29 + 19</text>
<text x="400" y="245" text-anchor="start" fill="#222" font-size="12">+ 10 + 4 = 271</text>
<text x="400" y="280" text-anchor="start" fill="#222" font-size="12">Outside all three circles: 229</text>
</svg>
