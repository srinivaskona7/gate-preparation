<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Candidate positions of the first 1 halve with every probe: 32, 16, 8, 4, 2, 1, so five probes in the worst case</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="150" y="16" text-anchor="start" font-size="12">candidate answers left (worst case, each probe halves them)</text>
<rect x="150" y="30" width="448" height="22" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="606" y="46" text-anchor="start" font-size="12">32 left</text>
<text x="140" y="46" text-anchor="end" font-size="12">start</text>
<rect x="150" y="66" width="224" height="22" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="382" y="82" text-anchor="start" font-size="12">16 left</text>
<text x="140" y="82" text-anchor="end" font-size="12">after probe 1</text>
<rect x="150" y="102" width="112" height="22" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="270" y="118" text-anchor="start" font-size="12">8 left</text>
<text x="140" y="118" text-anchor="end" font-size="12">after probe 2</text>
<rect x="150" y="138" width="56" height="22" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="214" y="154" text-anchor="start" font-size="12">4 left</text>
<text x="140" y="154" text-anchor="end" font-size="12">after probe 3</text>
<rect x="150" y="174" width="28" height="22" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="186" y="190" text-anchor="start" font-size="12">2 left</text>
<text x="140" y="190" text-anchor="end" font-size="12">after probe 4</text>
<rect x="150" y="210" width="14" height="22" rx="2" stroke="#1f2937" stroke-width="2.2" fill="#d1d5db"/>
<text x="172" y="226" text-anchor="start" font-size="12">1 left</text>
<text x="140" y="226" text-anchor="end" font-size="12">after probe 5</text>
<text x="12" y="262" text-anchor="start">32 = 2^5 outcomes, and one probe at most halves them, so 5 probes are needed and enough.</text>
<text x="12" y="284" text-anchor="start" font-weight="bold">Worst-case probes = ceil(log2 32) = 5 (and ceil(log2 31) = 5 if a 1 is guaranteed).</text>
</svg>
