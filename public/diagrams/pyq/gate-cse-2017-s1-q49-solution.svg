<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" font-family="sans-serif" font-size="13">
<title>Four 4-byte instructions at i, i+4, i+8, i+12; the next PC is i+16, so a branch back to i has offset -16</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="50" width="120" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="80" y="42" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">i</text><text x="80" y="73" text-anchor="middle" fill="#222" font-size="11">add R2,R3,R4</text><rect x="140" y="50" width="120" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="200" y="42" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">i+4</text><text x="200" y="73" text-anchor="middle" fill="#222" font-size="11">sub R5,R6,R7</text><rect x="260" y="50" width="120" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="320" y="42" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">i+8</text><text x="320" y="73" text-anchor="middle" fill="#222" font-size="11">cmp R1,R9,R10</text><rect x="380" y="50" width="120" height="36" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="440" y="42" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">i+12</text><text x="440" y="73" text-anchor="middle" fill="#222" font-size="11">beq R1,Offset</text><line x1="500" y1="40" x2="500" y2="95" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="32" text-anchor="middle" fill="#222" font-weight="bold" font-size="12">i+16</text><text x="500" y="112" text-anchor="middle" fill="#222" font-size="11">PC when beq runs</text><path d="M500,125 L500,165 L80,165 L80,90" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><text x="290" y="185" text-anchor="middle" fill="#222" font-weight="bold" font-size="13">Offset = target - next PC = i - (i + 16) = -16 bytes</text><text x="290" y="210" text-anchor="middle" fill="#222" font-size="12">4 instructions x 4 bytes = 16 bytes to step over</text>
</svg>
