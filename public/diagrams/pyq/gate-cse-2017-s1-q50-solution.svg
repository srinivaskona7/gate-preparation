<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 275" font-family="sans-serif" font-size="11">
<title>Stage delays of the naive and efficient pipelines with their clock cycles 22 ns and 14 ns</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="110" y="22" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">NP: 5 stages</text><text x="34" y="55" text-anchor="end" fill="#222" font-size="10">IF</text><rect x="40" y="42" width="55" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="99" y="56" text-anchor="start" fill="#222" font-size="10">5 ns</text><text x="34" y="83" text-anchor="end" fill="#222" font-size="10">ID</text><rect x="40" y="70" width="44" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="88" y="84" text-anchor="start" fill="#222" font-size="10">4 ns</text><text x="34" y="111" text-anchor="end" fill="#222" font-size="10">OF</text><rect x="40" y="98" width="220" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="264" y="112" text-anchor="start" fill="#222" font-size="10">20 ns</text><text x="34" y="139" text-anchor="end" fill="#222" font-size="10">EX</text><rect x="40" y="126" width="110" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="154" y="140" text-anchor="start" fill="#222" font-size="10">10 ns</text><text x="34" y="167" text-anchor="end" fill="#222" font-size="10">WB</text><rect x="40" y="154" width="33" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="77" y="168" text-anchor="start" fill="#222" font-size="10">3 ns</text><line x1="260" y1="34" x2="260" y2="184" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="40" y="200" text-anchor="start" fill="#222" font-size="11">cycle = slowest + 2 ns buffer = 22 ns</text><text x="440" y="22" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">EP: OF split in two</text><text x="364" y="55" text-anchor="end" fill="#222" font-size="10">IF</text><rect x="370" y="42" width="55" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="429" y="56" text-anchor="start" fill="#222" font-size="10">5 ns</text><text x="364" y="83" text-anchor="end" fill="#222" font-size="10">ID</text><rect x="370" y="70" width="44" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="418" y="84" text-anchor="start" fill="#222" font-size="10">4 ns</text><text x="364" y="111" text-anchor="end" fill="#222" font-size="10">OF1</text><rect x="370" y="98" width="132" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="506" y="112" text-anchor="start" fill="#222" font-size="10">12 ns</text><text x="364" y="139" text-anchor="end" fill="#222" font-size="10">OF2</text><rect x="370" y="126" width="88" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="462" y="140" text-anchor="start" fill="#222" font-size="10">8 ns</text><text x="364" y="167" text-anchor="end" fill="#222" font-size="10">EX</text><rect x="370" y="154" width="110" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="476" y="168" text-anchor="end" fill="#222" font-size="10">10 ns</text><text x="364" y="195" text-anchor="end" fill="#222" font-size="10">WB</text><rect x="370" y="182" width="33" height="20" fill="none" stroke="#222" stroke-width="1.2"/><text x="407" y="196" text-anchor="start" fill="#222" font-size="10">3 ns</text><line x1="502" y1="34" x2="502" y2="212" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="370" y="228" text-anchor="start" fill="#222" font-size="11">cycle = slowest + 2 ns buffer = 14 ns</text><text x="10" y="262" text-anchor="start" fill="#222" font-size="12" font-weight="bold">NP: (5 + 19) x 22 = 528 ns.   EP: (6 + 19) x 14 = 350 ns.   Speedup = 528 / 350 = 1.51</text>
</svg>
