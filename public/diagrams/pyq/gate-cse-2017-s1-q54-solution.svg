<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Direct mapped tag of 10 bits becomes 14 bits at 16 ways because 4 index bits move into the tag</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Cache of N words, B-word blocks: direct mapped against 16-way set associative</text><text x="20" y="52" fill="#1f2937" stroke="none">Direct mapped (N/B sets of 1 line)</text><rect x="20" y="70" width="207.3732718894009" height="44" stroke-width="2"/><text x="123.68663594470046" y="89" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="123.68663594470046" y="106" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">10 bits (given)</text><rect x="227.3732718894009" y="70" width="248.84792626728108" height="44" stroke-width="2"/><text x="351.7972350230415" y="89" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index</text><text x="351.7972350230415" y="106" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">log2 (N/B)</text><rect x="476.221198156682" y="70" width="143.77880184331798" height="44" stroke-width="2"/><text x="548.110599078341" y="89" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="548.110599078341" y="106" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">log2 B</text><text x="20" y="150" fill="#1f2937" stroke="none">16-way (N/(16B) sets)</text><rect x="20" y="168" width="290.3225806451613" height="44" stroke-width="2"/><text x="165.16129032258064" y="187" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="165.16129032258064" y="204" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">10 + 4 = 14 bits</text><rect x="310.3225806451613" y="168" width="165.89861751152074" height="44" stroke-width="2"/><text x="393.2718894009216" y="187" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index</text><text x="393.2718894009216" y="204" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">log2 (N/B) - 4</text><rect x="476.221198156682" y="168" width="143.77880184331798" height="44" stroke-width="2"/><text x="548.110599078341" y="187" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="548.110599078341" y="204" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">log2 B (same)</text><text x="20" y="238" fill="#1f2937" stroke="none">The address length and the offset do not change. Sixteen lines share a set, so the index loses log2 16 = 4 bits.</text><text x="20" y="258" fill="#1f2937" stroke="none" font-weight="bold">Those 4 bits move into the tag: 10 + 4 = 14 bits.</text><text x="20" y="278" fill="#1f2937" stroke="none" font-size="11">The bit counts drawn are illustrative; only the 4-bit move matters.</text></svg>
