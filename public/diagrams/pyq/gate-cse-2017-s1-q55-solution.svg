<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="sans-serif" font-size="13">
<title>Trace of total(5) down to total(1) with a static count: returns 2, 3, 5, 6, 7 and x accumulates to 23</title>

<text x="20" y="22" fill="#222" font-size="13" text-anchor="start" font-weight="bold">total(i) for i = 5, 4, 3, 2, 1: count is static, so it is never reset</text>
<text x="20" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">call</text>
<text x="110" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">i in binary</text>
<text x="240" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">1-bits added</text>
<text x="380" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">count after</text>
<text x="500" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">returned</text>
<text x="610" y="52" fill="#222" font-size="12" text-anchor="start" font-weight="bold">x = x + returned</text>
<rect x="14" y="60" width="730" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="20" y="79" fill="#222" font-size="13" text-anchor="start">total(5)</text>
<text x="110" y="79" fill="#222" font-size="13" text-anchor="start">101</text>
<text x="240" y="79" fill="#222" font-size="13" text-anchor="start">+2</text>
<text x="380" y="79" fill="#222" font-size="13" text-anchor="start">2</text>
<text x="500" y="79" fill="#222" font-size="13" text-anchor="start">2</text>
<text x="610" y="79" fill="#222" font-size="13" text-anchor="start">2</text>
<rect x="14" y="90" width="730" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="20" y="109" fill="#222" font-size="13" text-anchor="start">total(4)</text>
<text x="110" y="109" fill="#222" font-size="13" text-anchor="start">100</text>
<text x="240" y="109" fill="#222" font-size="13" text-anchor="start">+1</text>
<text x="380" y="109" fill="#222" font-size="13" text-anchor="start">3</text>
<text x="500" y="109" fill="#222" font-size="13" text-anchor="start">3</text>
<text x="610" y="109" fill="#222" font-size="13" text-anchor="start">5</text>
<rect x="14" y="120" width="730" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="20" y="139" fill="#222" font-size="13" text-anchor="start">total(3)</text>
<text x="110" y="139" fill="#222" font-size="13" text-anchor="start">011</text>
<text x="240" y="139" fill="#222" font-size="13" text-anchor="start">+2</text>
<text x="380" y="139" fill="#222" font-size="13" text-anchor="start">5</text>
<text x="500" y="139" fill="#222" font-size="13" text-anchor="start">5</text>
<text x="610" y="139" fill="#222" font-size="13" text-anchor="start">10</text>
<rect x="14" y="150" width="730" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="20" y="169" fill="#222" font-size="13" text-anchor="start">total(2)</text>
<text x="110" y="169" fill="#222" font-size="13" text-anchor="start">010</text>
<text x="240" y="169" fill="#222" font-size="13" text-anchor="start">+1</text>
<text x="380" y="169" fill="#222" font-size="13" text-anchor="start">6</text>
<text x="500" y="169" fill="#222" font-size="13" text-anchor="start">6</text>
<text x="610" y="169" fill="#222" font-size="13" text-anchor="start">16</text>
<rect x="14" y="180" width="730" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="20" y="199" fill="#222" font-size="13" text-anchor="start">total(1)</text>
<text x="110" y="199" fill="#222" font-size="13" text-anchor="start">001</text>
<text x="240" y="199" fill="#222" font-size="13" text-anchor="start">+1</text>
<text x="380" y="199" fill="#222" font-size="13" text-anchor="start">7</text>
<text x="500" y="199" fill="#222" font-size="13" text-anchor="start">7</text>
<text x="610" y="199" fill="#222" font-size="13" text-anchor="start">23</text>
<text x="20" y="250" fill="#222" font-size="13" text-anchor="start" font-weight="bold">count starts at 0 once for the whole run (static); x also starts at 0 once.  Final x = 2 + 3 + 5 + 6 + 7 = 23.</text>
</svg>
