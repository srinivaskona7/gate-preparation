<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
<title>An n-bit unsigned fixed-point number with i integer bits and f fraction bits runs from 0 to 2 to the i minus 2 to the minus f</title>
