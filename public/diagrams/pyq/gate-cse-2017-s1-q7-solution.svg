<text x="330" y="114" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">= 31 + 7/8 = 31.875 = 32 - 0.125 = 2^5 - 2^-3</text>
<text x="20" y="160" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Largest value: all integer bits set gives 2^i - 1, all fraction bits set gives 1 - 2^-f.</text>
<text x="20" y="182" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Sum: (2^i - 1) + (1 - 2^-f) = 2^i - 2^-f.</text>
<text x="20" y="218" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Range 0 to (2^i - 2^-f): option D. The top value 2^i itself would need one more integer bit.</text>
