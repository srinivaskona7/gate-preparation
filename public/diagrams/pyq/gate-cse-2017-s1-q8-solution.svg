<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="sans-serif" font-size="13">
<title>join(m, n): p walks to the last node of n and links it to m, giving 3, 4, 1, 2 for non-empty lists; when n is NULL the test p-&gt;next dereferences NULL</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">n = 3, 4 and m = 1, 2 (both non-empty)</text>
<rect x="60" y="60" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="95.64" y1="60" x2="95.64" y2="90" stroke="#222" stroke-width="1.4"/>
<text x="77.82" y="80.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">3</text>
<circle cx="104.82" cy="75.0" r="2.8" fill="#222"/>
<rect x="160" y="60" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="195.64" y1="60" x2="195.64" y2="90" stroke="#222" stroke-width="1.4"/>
<text x="177.82" y="80.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">4</text>
<circle cx="204.82" cy="75.0" r="2.8" fill="#222"/>
<line x1="104.82" y1="75.0" x2="160" y2="75.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="360" y="60" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="395.64" y1="60" x2="395.64" y2="90" stroke="#222" stroke-width="1.4"/>
<text x="377.82" y="80.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">1</text>
<circle cx="404.82" cy="75.0" r="2.8" fill="#222"/>
<rect x="460" y="60" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="495.64" y1="60" x2="495.64" y2="90" stroke="#222" stroke-width="1.4"/>
<text x="477.82" y="80.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">2</text>
<circle cx="504.82" cy="75.0" r="2.8" fill="#222"/>
<line x1="404.82" y1="75.0" x2="460" y2="75.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="504.82" y1="75.0" x2="532" y2="75.0" stroke="#222" stroke-width="1.6"/>
<line x1="532" y1="67.0" x2="532" y2="83.0" stroke="#222" stroke-width="1.6"/>
<text x="536" y="79.0" text-anchor="start" fill="#222" font-size="11">NULL</text>
<path d="M204.82,78.0 Q264.82,125.0 370,90" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="87.0" y="118" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">n</text>
<text x="187.0" y="118" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">p (last node)</text>
<text x="387.0" y="118" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">m</text>
<text x="10" y="160" text-anchor="start" fill="#222" font-size="13">p-&gt;next = m links the end of n to the head of m: n now reads 3, 4, 1, 2.  Nothing is copied.</text>
<line x1="8" y1="184" x2="692" y2="184" stroke="#6b7280" stroke-width="1"/>
<text x="10" y="212" text-anchor="start" fill="#b91c1c" font-size="13" font-weight="bold">n = NULL (an empty list is a valid NULL-terminated list)</text>
<text x="10" y="240" text-anchor="start" fill="#b91c1c" font-size="13">p = n = NULL, so the loop test p-&gt;next reads from address 0: null pointer dereference.</text>
<text x="10" y="282" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Answer (B): either a null dereference (n empty) or m appended to the end of n.</text>
</svg>
