<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif">
<title>The contour sketch with the gap between neighbouring contour lines marked at each region: smallest at R, moderate at P and S, widest at Q, so R changes pressure fastest</title>
<rect x="20" y="20" width="720" height="360" fill="none" stroke="#222" stroke-width="2"/>
<path d="M20 92 Q120 78 205 58 T340 20" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M20 112 Q120 90 205 67 T360 20" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="34" y="84" text-anchor="start" font-size="12" fill="#222">0.65</text>
<text x="34" y="108" text-anchor="start" font-size="12" fill="#222">0.7</text>
<ellipse cx="172" cy="232" rx="40" ry="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="172" y="198" text-anchor="middle" font-size="11" fill="#222">0.95</text>
<ellipse cx="172" cy="232" rx="68" ry="52" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="172" y="176" text-anchor="middle" font-size="11" fill="#222">0.9</text>
<ellipse cx="172" cy="232" rx="100" ry="76" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="608" cy="150" rx="26" ry="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="608" y="122" text-anchor="middle" font-size="11" fill="#222">0.95</text>
<ellipse cx="608" cy="150" rx="52" ry="46" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="608" y="100" text-anchor="middle" font-size="11" fill="#222">0.9</text>
<ellipse cx="608" cy="150" rx="80" ry="70" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M20 340 C160 352 260 332 330 292 C390 258 470 250 560 254 S700 264 740 264" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="100" y="338" text-anchor="start" font-size="12" fill="#222">0.8</text>
<text x="660" y="250" text-anchor="start" font-size="12" fill="#222">0.8</text>
<path d="M280 380 Q480 352 740 340" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="660" y="338" text-anchor="start" font-size="12" fill="#222">0.75</text>
<circle cx="205" cy="62" r="24" fill="#f6b3b3" fill-opacity="0.6" stroke="#888" stroke-width="2"/>
<text x="205" y="67" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">R</text>
<circle cx="140" cy="244" r="24" fill="#f6b3b3" fill-opacity="0.6" stroke="#888" stroke-width="2"/>
<text x="140" y="249" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">P</text>
<circle cx="608" cy="150" r="24" fill="#f6b3b3" fill-opacity="0.6" stroke="#888" stroke-width="2"/>
<text x="608" y="155" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">S</text>
<circle cx="430" cy="326" r="24" fill="#f6b3b3" fill-opacity="0.6" stroke="#888" stroke-width="2"/>
<text x="430" y="331" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Q</text>
<text x="300" y="64" text-anchor="start" font-size="12" fill="#c0392b" font-weight="bold">R: smallest gap</text>
<text x="172" y="140" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">P: moderate gap</text>
<text x="608" y="64" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">S: moderate gap</text>
<text x="430" y="296" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">Q: widest gap</text>
<text x="20" y="404" text-anchor="start" font-size="12" fill="#222">Pressure change per distance = 0.05 bar / gap. Every neighbouring pair of lines differs by 0.05, so the smallest gap is the steepest.</text>
<text x="20" y="424" text-anchor="start" font-size="12" fill="#222" font-weight="bold">R has the closest lines, so the pressure changes fastest there: option (C). Q has the widest gap: the calmest.</text>
<text x="20" y="444" text-anchor="start" font-size="11" fill="#222">Sketch, not to scale: the gaps compare relative spacing in the paper's plot.</text>
</svg>
