<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" font-family="sans-serif" font-size="12">
<title>Five buildings from west to east in the order X Z V W Y; V is in the middle</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="310" y="20" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">West  &lt;-  the row  -&gt;  East</text>
<rect x="30" y="40" width="70" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="65" y="76" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">X</text>
<text x="65" y="116" text-anchor="middle" fill="#222" font-size="11">place 1</text>
<rect x="142" y="40" width="70" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="177" y="76" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">Z</text>
<text x="177" y="116" text-anchor="middle" fill="#222" font-size="11">place 2</text>
<rect x="254" y="40" width="70" height="56" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="289" y="76" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">V</text>
<text x="289" y="116" text-anchor="middle" fill="#222" font-size="11">place 3</text>
<rect x="366" y="40" width="70" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="401" y="76" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">W</text>
<text x="401" y="116" text-anchor="middle" fill="#222" font-size="11">place 4</text>
<rect x="478" y="40" width="70" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="513" y="76" text-anchor="middle" fill="#222" font-size="22" font-weight="bold">Y</text>
<text x="513" y="116" text-anchor="middle" fill="#222" font-size="11">place 5</text>
<text x="289" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">middle</text>
<line x1="289" y1="136" x2="289" y2="122" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="310" y="176" text-anchor="middle" fill="#222" font-size="12">X &lt; Z (Z east of X), Z &lt; V, V &lt; W, W &lt; Y: one chain, so V is third of five</text>
</svg>
