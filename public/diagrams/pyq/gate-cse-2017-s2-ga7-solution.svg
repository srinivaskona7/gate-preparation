<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" font-family="sans-serif" font-size="12">
<title>Opening the box labelled Apples and Oranges and drawing one fruit fixes the contents of all three boxes</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="160" y="12" width="300" height="46" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="310" y="32" text-anchor="middle" fill="#222" font-size="12">Open the box labelled</text>
<text x="310" y="49" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">'Apples and Oranges' and take one fruit</text>
<line x1="250" y1="58" x2="140" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="370" y1="58" x2="480" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="168" y="86" text-anchor="end" fill="#222" font-size="12">an apple</text>
<text x="452" y="86" text-anchor="start" fill="#222" font-size="12">an orange</text>
<rect x="10" y="100" width="290" height="106" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="155" y="122" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">This box holds only apples</text>
<text x="155" y="146" text-anchor="middle" fill="#222" font-size="11">The label is wrong, so it cannot be the mixture.</text>
<text x="155" y="170" text-anchor="middle" fill="#222" font-size="12">The 'Oranges' box holds the mixture</text>
<text x="155" y="188" text-anchor="middle" fill="#222" font-size="12">The 'Apples' box holds oranges</text>
<rect x="320" y="100" width="290" height="106" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="465" y="122" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">This box holds only oranges</text>
<text x="465" y="146" text-anchor="middle" fill="#222" font-size="11">The label is wrong, so it cannot be the mixture.</text>
<text x="465" y="170" text-anchor="middle" fill="#222" font-size="12">The 'Apples' box holds the mixture</text>
<text x="465" y="188" text-anchor="middle" fill="#222" font-size="12">The 'Oranges' box holds apples</text>
</svg>
