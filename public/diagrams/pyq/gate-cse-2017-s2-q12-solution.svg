<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<title>Single-precision word 0 01111100 1101101 followed by zeros decodes to 1.8515625 times 2 to the minus 3, about 0.2314</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Split the 32 bits as 1 + 8 + 23</text>
<text x="20" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
<rect x="20" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="29.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">0</text>
<text x="44" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">exponent E (8 bits)</text>
<rect x="44" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="53.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="62" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="71.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="80" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="89.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="98" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="107.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="116" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="125.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="134" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="143.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="152" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="161.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="170" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="179.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<text x="194" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">fraction F (23 bits)</text>
<rect x="194" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="203.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="212" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="221.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="230" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="239.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="248" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="257.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="266" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="275.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="284" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="293.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="302" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="311.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="320" y="58" width="56" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="348.0" y="75.2" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0 ... 0</text>
<text x="20" y="112" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">S = 0: positive</text>
<text x="20" y="134" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">E = 01111100 = 64 + 32 + 16 + 8 + 4 = 124, power = 124 - 127 = -3</text>
<text x="20" y="158" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">F = 1101101 then zeros: 1/2 + 1/4 + 1/16 + 1/32 + 1/128 = 0.8515625</text>
<text x="20" y="192" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">value = 1.8515625 x 2^-3 = 1.8515625 / 8 = 0.2314453125</text>
<text x="20" y="226" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Compare with the options (distance from 0.2314):</text>
<text x="30" y="248" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">A  1.45 x 10^1 = 14.5</text>
<text x="300" y="248" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">distance 14.27</text>
<text x="30" y="264" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">B  1.45 x 10^-1 = 0.145</text>
<text x="300" y="264" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">distance 0.086</text>
<text x="30" y="280" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">C  2.27 x 10^-1 = 0.227</text>
<text x="300" y="280" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">distance 0.004</text>
<text x="30" y="296" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">D  2.27 x 10^1 = 22.7</text>
<text x="300" y="296" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">distance 22.47</text>
</svg>
