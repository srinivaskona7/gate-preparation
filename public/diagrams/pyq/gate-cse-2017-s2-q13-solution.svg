<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>A circular queue in a singly linked list with four nodes: the last node points back to the first; FRONT points to the first node and REAR to the last, so REAR-&gt;next is FRONT but FRONT-&gt;next is the second node</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="60" y="110" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="99.6" y1="110" x2="99.6" y2="140" stroke="#222" stroke-width="1.4"/>
<text x="79.8" y="130.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">1</text>
<circle cx="109.8" cy="125.0" r="2.8" fill="#222"/>
<rect x="200" y="110" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="239.6" y1="110" x2="239.6" y2="140" stroke="#222" stroke-width="1.4"/>
<text x="219.8" y="130.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">2</text>
<circle cx="249.8" cy="125.0" r="2.8" fill="#222"/>
<rect x="340" y="110" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="379.6" y1="110" x2="379.6" y2="140" stroke="#222" stroke-width="1.4"/>
<text x="359.8" y="130.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">3</text>
<circle cx="389.8" cy="125.0" r="2.8" fill="#222"/>
<rect x="480" y="110" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="519.6" y1="110" x2="519.6" y2="140" stroke="#222" stroke-width="1.4"/>
<text x="499.8" y="130.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">4</text>
<circle cx="529.8" cy="125.0" r="2.8" fill="#222"/>
<line x1="109.8" y1="125.0" x2="200" y2="125" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="249.8" y1="125.0" x2="340" y2="125" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="389.8" y1="125.0" x2="480" y2="125" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="529.8,122.0 529.8,70 80,70 80,108" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
<text x="294.9" y="60" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">REAR-&gt;next = FRONT (statement II)</text>
<line x1="80.0" y1="190" x2="80.0" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="80.0" y="208" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">FRONT</text>
<line x1="500.0" y1="190" x2="500.0" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="500.0" y="208" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">REAR</text>
<text x="10" y="248" text-anchor="start" fill="#b91c1c" font-size="13">FRONT-&gt;next is node 2, not REAR (statement I fails once there are 3 or more nodes).</text>
<text x="10" y="274" text-anchor="start" fill="#222" font-size="13" font-weight="bold">With REAR-&gt;next = FRONT: enqueue and dequeue are both O(1).  Answer (B): II only.</text>
<text x="10" y="24" text-anchor="start" fill="#6b7280" font-size="13">Enqueue at REAR, dequeue at FRONT.</text>
</svg>
