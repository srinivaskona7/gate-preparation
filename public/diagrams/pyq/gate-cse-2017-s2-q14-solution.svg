<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="sans-serif">
<title>In printxy(1,1) the variables x and y are local copies; ptr points to x, so y becomes 0 and then *ptr = 1 sets x to 1: output 1,0</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="14" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">statement</text>
<rect x="210" y="14" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">x</text>
<rect x="260" y="14" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">y</text>
<rect x="310" y="14" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">ptr</text>
<rect x="380" y="14" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">what happens</text>
<rect x="20" y="44" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">entry, printxy(1,1)</text>
<rect x="210" y="44" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="260" y="44" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="310" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">-</text>
<rect x="380" y="44" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">x, y are copies of the arguments</text>
<rect x="20" y="74" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">x = 0;</text>
<rect x="210" y="74" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="260" y="74" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="310" y="74" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">-</text>
<rect x="380" y="74" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">x overwritten</text>
<rect x="20" y="104" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="123.2" fill="#222" font-size="12" text-anchor="middle">ptr = &amp;x;</text>
<rect x="210" y="104" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="123.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="260" y="104" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="123.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="310" y="104" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="123.2" fill="#222" font-size="12" text-anchor="middle">-&gt; x</text>
<rect x="380" y="104" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="123.2" fill="#222" font-size="12" text-anchor="middle">ptr holds the address of x</text>
<rect x="20" y="134" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">y = *ptr;</text>
<rect x="210" y="134" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="260" y="134" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="310" y="134" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">-&gt; x</text>
<rect x="380" y="134" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">y gets the value of x, which is 0</text>
<rect x="20" y="164" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="183.2" fill="#222" font-size="12" text-anchor="middle">*ptr = 1;</text>
<rect x="210" y="164" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="183.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="260" y="164" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="183.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="310" y="164" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="183.2" fill="#222" font-size="12" text-anchor="middle">-&gt; x</text>
<rect x="380" y="164" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="183.2" fill="#222" font-size="12" text-anchor="middle">writing through ptr changes x</text>
<rect x="20" y="194" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="115.0" y="213.2" fill="#222" font-size="12" text-anchor="middle">printf("%d,%d", x, y)</text>
<rect x="210" y="194" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="235.0" y="213.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="260" y="194" width="50" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="213.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="310" y="194" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="345.0" y="213.2" fill="#222" font-size="12" text-anchor="middle">-&gt; x</text>
<rect x="380" y="194" width="280" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="520.0" y="213.2" fill="#222" font-size="12" text-anchor="middle">prints 1,0</text>
<text x="20" y="252" fill="#222" font-size="14" text-anchor="start" font-weight="bold">Output:  1,0</text>
</svg>
