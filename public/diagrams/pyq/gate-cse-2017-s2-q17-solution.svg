<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img">
<title>Relationship R many-to-one from A to B with total participation of A folds into the table of A</title>
<rect x="45.0" y="52.0" width="90" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="90" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">A</text>
<polygon points="300,45.0 345.0,70 300,95.0 255.0,70" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="300" y="73.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">R</text>
<rect x="465.0" y="52.0" width="90" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="510" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">B</text>
<line x1="135" y1="68" x2="255" y2="68" stroke="#1f2937" stroke-width="2.4"/>
<line x1="135" y1="72" x2="255" y2="72" stroke="#1f2937" stroke-width="2.4"/>
<line x1="345" y1="70" x2="465" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<text x="190" y="56" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">N</text>
<text x="420" y="56" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">1</text>
<text x="300" y="130" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Table A(a_id, a_attrs, b_id)   b_id references B, NOT NULL because A is total</text>
<text x="300" y="152" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Table B(b_id, b_attrs)</text>
<text x="300" y="190" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">If A were partial, b_id would hold NULL for A entities with no B partner,</text>
<text x="300" y="208" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">so the merge is clean only when A is total.</text>
</svg>
