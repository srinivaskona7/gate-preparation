<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="sans-serif" font-size="13">
<title>Deleting T1 row (3,8) only nulls S in T2 row (8,3); the cascade to T1 never fires</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="40" y="50" width="170" height="60" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="125" y="76" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">T1(P, Q)</text>
<text x="125" y="98" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">delete row (3, 8)</text>
<rect x="350" y="50" width="170" height="60" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="435" y="76" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">T2(R, S)</text>
<text x="435" y="98" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">row (8, 3)</text>
<line x1="210" y1="70" x2="350" y2="70" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="280" y="62" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">T2.S references T1.P</text>
<text x="280" y="86" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">ON DELETE SET NULL</text>
<line x1="350" y1="100" x2="210" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="280" y="118" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">T1.Q references T2.R</text>
<text x="280" y="134" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">ON DELETE CASCADE (needs a deleted T2 row)</text>
<rect x="350" y="160" width="170" height="40" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
<text x="435" y="185" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">row (8, 3) becomes (8, NULL)</text>
<line x1="435" y1="110" x2="435" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="40" y="230" text-anchor="start" fill="#222" font-size="13" font-weight="bold">No T2 row is deleted, so no T1 row is cascaded: 0 extra T1 deletions</text>
</svg>
