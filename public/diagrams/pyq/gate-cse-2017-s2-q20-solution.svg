<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 298" font-family="sans-serif" font-size="13">
<title>The 40-byte options area holds a 3-byte Record Route header and at most nine 4-byte router addresses</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">IPv4 header: at most 15 words of 4 bytes = 60 bytes</text>
<rect x="20" y="40" width="250.0" height="44" fill="#ccc" stroke="#222" stroke-width="1.5"/><text x="145.0" y="67" text-anchor="middle" fill="#222" font-size="12">fixed header 20 bytes</text>
<rect x="270.0" y="40" width="500.0" height="44" fill="none" stroke="#222" stroke-width="1.5"/><text x="520.0" y="67" text-anchor="middle" fill="#222" font-size="12">options field, at most 40 bytes (HLEN = 15)</text>
<text x="20" y="104" text-anchor="middle" fill="#222" font-size="11">0</text>
<text x="270.0" y="104" text-anchor="middle" fill="#222" font-size="11">20</text>
<text x="770.0" y="104" text-anchor="middle" fill="#222" font-size="11">60</text>
<text x="10" y="132" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Inside the 40-byte options field, the Record Route option:</text>
<rect x="270.0" y="150" width="12.5" height="40" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<rect x="282.5" y="150" width="12.5" height="40" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<rect x="295.0" y="150" width="12.5" height="40" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<text x="288.75" y="212" text-anchor="start" fill="#222" font-size="11">type, length, pointer (3 bytes)</text>
<rect x="307.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="332.5" y="175" text-anchor="middle" fill="#222" font-size="11">A1</text>
<rect x="357.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="382.5" y="175" text-anchor="middle" fill="#222" font-size="11">A2</text>
<rect x="407.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="432.5" y="175" text-anchor="middle" fill="#222" font-size="11">A3</text>
<rect x="457.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="482.5" y="175" text-anchor="middle" fill="#222" font-size="11">A4</text>
<rect x="507.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="532.5" y="175" text-anchor="middle" fill="#222" font-size="11">A5</text>
<rect x="557.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="582.5" y="175" text-anchor="middle" fill="#222" font-size="11">A6</text>
<rect x="607.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="632.5" y="175" text-anchor="middle" fill="#222" font-size="11">A7</text>
<rect x="657.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="682.5" y="175" text-anchor="middle" fill="#222" font-size="11">A8</text>
<rect x="707.5" y="150" width="50.0" height="40" fill="#dde" stroke="#222" stroke-width="1.5"/>
<text x="732.5" y="175" text-anchor="middle" fill="#222" font-size="11">A9</text>
<rect x="757.5" y="150" width="12.5" height="40" fill="#eee" stroke="#222" stroke-width="1.5"/>
<text x="532.5" y="212" text-anchor="middle" fill="#222" font-size="11">9 addresses x 4 bytes = 36 bytes</text>
<text x="763.8" y="144" text-anchor="middle" fill="#222" font-size="11">pad</text>
<text x="10" y="250" text-anchor="start" fill="#222" font-size="12">3 + 4k &lt;= 40 gives k &lt;= 37 / 4 = 9.25, so k = 9 addresses (3 + 36 = 39 bytes, one byte of padding left).</text>
<text x="10" y="270" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Answer: 9</text>
</svg>
