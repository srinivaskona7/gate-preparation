<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="sans-serif" font-size="13">
<title>Hasse diagram with the join and meet of the only incomparable pairs, showing the poset is already a lattice</title>
<line x1="130" y1="230" x2="60" y2="170" stroke="#222" stroke-width="1.8"/>
<line x1="60" y1="170" x2="60" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="60" y1="100" x2="130" y2="35" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="230" x2="200" y2="150" stroke="#222" stroke-width="1.8"/>
<line x1="200" y1="150" x2="130" y2="35" stroke="#222" stroke-width="1.8"/>
<circle cx="130" cy="230" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130" y="234.5" text-anchor="middle" fill="#222">a</text>
<circle cx="60" cy="170" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="174.5" text-anchor="middle" fill="#222">b</text>
<circle cx="60" cy="100" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="104.5" text-anchor="middle" fill="#222">c</text>
<circle cx="200" cy="150" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="200" y="154.5" text-anchor="middle" fill="#222">d</text>
<circle cx="130" cy="35" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130" y="39.5" text-anchor="middle" fill="#222">e</text>
<text x="290" y="40" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Incomparable pairs: only b,d and c,d</text>
<text x="290" y="70" text-anchor="start" fill="#222" font-size="12" font-weight="bold">pair</text><text x="360" y="70" text-anchor="start" fill="#222" font-size="12" font-weight="bold">join</text><text x="420" y="70" text-anchor="start" fill="#222" font-size="12" font-weight="bold">meet</text>
<text x="290" y="95" text-anchor="start" fill="#222" font-size="12">b , d</text><text x="360" y="95" text-anchor="start" fill="#222" font-size="12">e</text><text x="420" y="95" text-anchor="start" fill="#222" font-size="12">a</text>
<text x="290" y="120" text-anchor="start" fill="#222" font-size="12">c , d</text><text x="360" y="120" text-anchor="start" fill="#222" font-size="12">e</text><text x="420" y="120" text-anchor="start" fill="#222" font-size="12">a</text>
<text x="290" y="155" text-anchor="start" fill="#222" font-size="12">Every comparable pair x &lt;= y has</text>
<text x="290" y="175" text-anchor="start" fill="#222" font-size="12">join y and meet x, so each pair has both.</text>
<text x="290" y="210" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Already a lattice: 0 pairs to add.</text>
</svg>
