<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="sans-serif">
<title>Two by two table of probabilities for P and Q applying: both 1/12, only P 1/6, only Q 1/12, neither 2/3; given Q does not apply, P does not apply is 2/3 divided by 5/6, which is 4/5</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<text x="345" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Q applies</text>
<text x="475" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Q does not apply</text>
<text x="580" y="50" text-anchor="middle" font-size="12" font-style="italic" fill="#222">row total</text>
<text x="270" y="110" text-anchor="end" font-size="13" font-weight="bold" fill="#222">P applies</text>
<text x="270" y="180" text-anchor="end" font-size="13" font-weight="bold" fill="#222">P does not apply</text>
<rect x="280" y="70" width="130" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="345" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">1/12</text>
<text x="345" y="122" text-anchor="middle" font-size="11" fill="#222">P and Q</text>
<rect x="410" y="70" width="130" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="475" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">1/6</text>
<text x="475" y="122" text-anchor="middle" font-size="11" fill="#222">P, not Q</text>
<rect x="280" y="140" width="130" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="345" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">1/12</text>
<text x="345" y="192" text-anchor="middle" font-size="11" fill="#222">not P, Q</text>
<rect x="410" y="140" width="130" height="70" rx="0" fill="none" stroke="#b3261e" stroke-width="3"/>
<text x="475" y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#b3261e">2/3</text>
<text x="475" y="192" text-anchor="middle" font-size="11" fill="#222">not P, not Q</text>
<text x="580" y="110" text-anchor="middle" font-size="13" fill="#222">1/4</text>
<text x="580" y="180" text-anchor="middle" font-size="13" fill="#222">3/4</text>
<text x="345" y="234" text-anchor="middle" font-size="13" fill="#222">1/6</text>
<text x="475" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">5/6</text>
<text x="270" y="234" text-anchor="end" font-size="12" font-style="italic" fill="#222">column total</text>
<text x="310" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">P(not P | not Q) = (2/3) / (5/6) = 4/5</text>
<text x="310" y="300" text-anchor="middle" font-size="11" fill="#222">P(P and Q) = P(Q | P) P(P) = 1/12 fills the first cell; the totals fill the rest.</text>
</svg>
