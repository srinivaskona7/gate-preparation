<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 216" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>CPU, L1 at 1 cycle, L2 at 8 cycles and memory at 18 cycles; AMAT of 2 cycles gives miss rates 0.111 and 0.056</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">Local miss rates: L1 misses 2x of its accesses, L2 misses x of the accesses that reach it</text><rect x="20" y="50" width="90" height="56" stroke-width="2"/><text x="65" y="72" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">CPU</text><text x="65" y="90" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">every access</text><rect x="170" y="50" width="130" height="56" stroke-width="2"/><text x="235" y="72" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">L1</text><text x="235" y="90" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">1 cycle, miss 2x</text><rect x="360" y="50" width="130" height="56" stroke-width="2"/><text x="425" y="72" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">L2</text><text x="425" y="90" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">8 cycles, miss x</text><rect x="550" y="50" width="100" height="56" stroke-width="2"/><text x="600" y="72" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Memory</text><text x="600" y="90" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">18 cycles</text><line x1="110" y1="78" x2="162" y2="78"/><polygon points="170,78 162,74 162,82" fill="#1f2937" stroke="none"/><line x1="300" y1="78" x2="352" y2="78"/><polygon points="360,78 352,74 352,82" fill="#1f2937" stroke="none"/><line x1="490" y1="78" x2="542" y2="78"/><polygon points="550,78 542,74 542,82" fill="#1f2937" stroke="none"/><text x="330" y="70" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">misses</text><text x="520" y="70" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">misses</text><text x="10" y="160" fill="#1f2937" stroke="none">AMAT = 1 + (2x)(8 + 18x) = 2  =&gt;  1 = 16x + 36x^2  =&gt;  36x^2 + 16x - 1 = 0.</text><text x="10" y="180" fill="#1f2937" stroke="none">x = (-16 + sqrt(256 + 144)) / 72 = (-16 + 20) / 72 = 1/18 = 0.0556  (L2 miss rate).</text><text x="10" y="202" fill="#1f2937" stroke="none" font-weight="bold">L1 miss rate = 2x = 1/9 = 0.111. Option A: 0.111 and 0.056.</text></svg>
