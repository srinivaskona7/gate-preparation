<text x="12" y="266" text-anchor="start">Nodes with n &gt; 2 cost 1: 1 + 2 + 4 + 8 = 15. The 16 leaves (n = 2) cost 2 each: 32.</text>
<text x="12" y="288" text-anchor="start" font-weight="bold">T(2^16) = 15 + 32 = 47 = 3 log2 n - 1. Depth log2 log2 n = 4 but 2^4 = 16 = log2 n leaves: Theta(log n).</text>
