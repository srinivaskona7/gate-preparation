<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="sans-serif" font-size="13">
<title>Nine tape drives: P1 holds 3, P2 holds 1, P3 holds 3, two are free. P3 finishes, then P1, then P2, so the state is safe and nobody is waiting</title>
