<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="sans-serif" font-size="12">
<title>Transmission delay 400 ms to push the file onto the link, then propagation delay 50 ms across it</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="40" y="50" width="400" height="36"/><rect x="440" y="50" width="50" height="36" stroke-dasharray="4 3"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="240" y="73">transmission p = 400 ms</text><text x="465" y="43">q = 50 ms</text>
<text x="40" y="110">0</text><text x="440" y="110">400</text><text x="490" y="110">450 ms</text>
<text x="360" y="145">p = 50000 x 8 bits / 10^6 bit/s = 0.4 s</text>
<text x="360" y="168">q = 10^7 m / (2 x 10^8 m/s) = 0.05 s. Answer: (D)</text>
</g>
</svg>
