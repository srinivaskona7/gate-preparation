<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="sans-serif">
<title>Each option tried on a start state: options A, B and D fail on a counterexample; option C keeps x == y*q + r true and ends with it true</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="14" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">option</text>
<rect x="100" y="14" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="185.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">start (x, y, q, r)</text>
<rect x="270" y="14" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">loop runs</text>
<rect x="390" y="14" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="450.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">end (q, r)</text>
<rect x="510" y="14" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="33.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">x == y*q + r ?</text>
<rect x="20" y="44" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">A</text>
<rect x="100" y="44" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="185.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">(5, 1, 0, 0)</text>
<rect x="270" y="44" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">0 times</text>
<rect x="390" y="44" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="450.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">(0, 0)</text>
<rect x="510" y="44" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">no: 5 != 0</text>
<rect x="20" y="74" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">B</text>
<rect x="100" y="74" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="185.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">(1, 1, 1, 1)</text>
<rect x="270" y="74" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">1 time</text>
<rect x="390" y="74" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="450.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">(2, 0)</text>
<rect x="510" y="74" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="93.2" fill="#222" font-size="12" text-anchor="middle">no: 1 != 2</text>
<rect x="20" y="104" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="123.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">C</text>
<rect x="100" y="104" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="185.0" y="123.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">(7, 3, 0, 7)</text>
<rect x="270" y="104" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="123.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">2 times</text>
<rect x="390" y="104" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="450.0" y="123.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">(2, 1)</text>
<rect x="510" y="104" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="123.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">yes: 7 = 3*2 + 1</text>
<rect x="20" y="134" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">D</text>
<rect x="100" y="134" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="185.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">(0, 1, 0, 1)</text>
<rect x="270" y="134" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">1 time</text>
<rect x="390" y="134" width="120" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="450.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">(1, 0)</text>
<rect x="510" y="134" width="170" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="153.2" fill="#222" font-size="12" text-anchor="middle">no: 0 != 1</text>
<text x="20" y="190" fill="#222" font-size="12" text-anchor="start">Each pass does r = r - y and q = q + 1, so y*q + r is unchanged.  If it equals x before the loop</text>
<text x="20" y="210" fill="#222" font-size="12" text-anchor="start">(q = 0 and r = x gives y*0 + x = x), it still equals x when the loop ends.</text>
<text x="20" y="234" fill="#222" font-size="12" text-anchor="start">y &gt; 0 makes r shrink every pass, so the loop terminates.</text>
<text x="20" y="270" fill="#222" font-size="14" text-anchor="start" font-weight="bold">Answer: (C)</text>
</svg>
