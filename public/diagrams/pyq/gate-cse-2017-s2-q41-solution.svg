<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" font-family="sans-serif" font-size="13">
<title>Four decision problems: regular-expression membership and CFG emptiness are decidable, CFG universality and Turing machine acceptance are not</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Problem</text>
<text x="330" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Verdict</text>
<text x="450" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Reason</text>
<rect x="10" y="42" width="720" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="70" text-anchor="start" fill="#222" font-size="13">I. Is w in L(R)? (regex R)</text>
<text x="330" y="70" text-anchor="start" fill="#222" font-size="13" font-weight="bold">decidable</text>
<text x="450" y="62" text-anchor="start" fill="#222" font-size="12">run the finite automaton</text>
<text x="450" y="79" text-anchor="start" fill="#222" font-size="12">of R on w; it halts</text>
<rect x="10" y="96" width="720" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="124" text-anchor="start" fill="#222" font-size="13">II. Is L(G) empty? (CFG G)</text>
<text x="330" y="124" text-anchor="start" fill="#222" font-size="13" font-weight="bold">decidable</text>
<text x="450" y="116" text-anchor="start" fill="#222" font-size="12">fixpoint over variables</text>
<text x="450" y="133" text-anchor="start" fill="#222" font-size="12">that derive terminals</text>
<rect x="10" y="150" width="720" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="178" text-anchor="start" fill="#222" font-size="13">III. Is L(G) = all strings? (CFG G)</text>
<text x="330" y="178" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="170" text-anchor="start" fill="#222" font-size="12">complement of a CFL is not</text>
<text x="450" y="187" text-anchor="start" fill="#222" font-size="12">a CFL; no finite check</text>
<rect x="10" y="204" width="720" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="13">IV. Is w in L(M)? (TM M)</text>
<text x="330" y="232" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="224" text-anchor="start" fill="#222" font-size="12">this is the acceptance problem</text>
<text x="450" y="241" text-anchor="start" fill="#222" font-size="12">A_TM, the halting problem</text>
</svg>
