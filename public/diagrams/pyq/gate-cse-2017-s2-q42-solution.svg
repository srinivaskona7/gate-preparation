<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="sans-serif" font-size="13">
<title>Saturating up-counter 00, 01, 10, 11 and back to 11, with the T inputs T1 T0 that make each step: 01, 11, 01, 00</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="90" cy="110" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="90" y="114.33333333333333" text-anchor="middle" fill="#222" font-size="13">00</text>
<circle cx="250" cy="110" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="250" y="114.33333333333333" text-anchor="middle" fill="#222" font-size="13">01</text>
<circle cx="410" cy="110" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="410" y="114.33333333333333" text-anchor="middle" fill="#222" font-size="13">10</text>
<circle cx="560" cy="110" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="560" y="114.33333333333333" text-anchor="middle" fill="#222" font-size="13">11</text>
<path d="M120.0,110.0 Q170.0,110.0 216.0,110.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="169.0" y="98.0" text-anchor="middle" fill="#222" font-size="12">T1 T0 = 01</text>
<path d="M280.0,110.0 Q330.0,110.0 376.0,110.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="329.0" y="98.0" text-anchor="middle" fill="#222" font-size="12">T1 T0 = 11</text>
<path d="M440.0,110.0 Q485.0,110.0 526.0,110.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="484.0" y="98.0" text-anchor="middle" fill="#222" font-size="12">T1 T0 = 01</text>
<path d="M548,137 C530,178 590,178 572,137" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560" y="184" text-anchor="middle" fill="#222" font-size="12">T1 T0 = 00</text>
<text x="300" y="225" text-anchor="middle" fill="#222" font-size="14">T1 = Q1'Q0 ;  T0 = Q1' + Q0'</text>
</svg>
