<rect x="506" y="144" width="44" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="528.0" y="164.55" fill="#222" font-size="13" text-anchor="middle">2</text>
<rect x="550" y="144" width="44" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="572.0" y="164.55" fill="#222" font-size="13" text-anchor="middle">1</text>
