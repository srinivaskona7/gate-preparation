<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="sans-serif">
<title>Array after each forward and backward sweep: 3 5 1 4 6 2 becomes 5 3 4 6 2 1, then 6 5 3 4 2 1, then 6 5 4 3 2 1; array[3] is 3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
