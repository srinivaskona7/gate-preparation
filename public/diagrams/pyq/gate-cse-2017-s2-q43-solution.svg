<text x="20" y="166" fill="#222" font-size="12" text-anchor="start">pass 2, forward</text>
<rect x="330" y="144" width="44" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="352.0" y="164.55" fill="#222" font-size="13" text-anchor="middle">6</text>
<rect x="374" y="144" width="44" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="396.0" y="164.55" fill="#222" font-size="13" text-anchor="middle">5</text>
<rect x="418" y="144" width="44" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
