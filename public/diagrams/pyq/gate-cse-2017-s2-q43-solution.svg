<text x="572.0" y="240.55" fill="#222" font-size="13" text-anchor="middle">1</text>
<text x="20" y="280" fill="#222" font-size="12" text-anchor="start">Forward sweep swaps when a[i] &lt; a[i+1], pushing small values right.  Backward sweep swaps when</text>
<text x="20" y="298" fill="#222" font-size="12" text-anchor="start">a[i] &gt; a[i-1], pulling large values left.  Together they sort into descending order.</text>
<text x="20" y="320" fill="#222" font-size="12" text-anchor="start">Pass 3 swaps nothing, done stays 1, the loop exits.</text>
<text x="20" y="346" fill="#222" font-size="14" text-anchor="start" font-weight="bold">array[3] = 3</text>
