<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 276" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Instruction and data caches sharing an L2 and memory; average read time 0.6 x 5.4 + 0.4 x 3.7 = 4.72 ns</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">Two L1 caches share one L2; every L1 miss costs 8 + 0.1 x 90 = 17 ns</text><rect x="20" y="40" width="150" height="56" stroke-width="2"/><text x="95" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">instruction fetch</text><text x="95" y="80" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">60 % of reads</text><rect x="20" y="150" width="150" height="56" stroke-width="2"/><text x="95" y="172" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">operand fetch</text><text x="95" y="190" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">40 % of reads</text><rect x="240" y="40" width="150" height="56" stroke-width="2"/><text x="315" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">I-cache</text><text x="315" y="80" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">2 ns, hit 0.8</text><rect x="240" y="150" width="150" height="56" stroke-width="2"/><text x="315" y="172" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">D-cache</text><text x="315" y="190" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">2 ns, hit 0.9</text><rect x="460" y="90" width="150" height="70" stroke-width="2"/><text x="535" y="112" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">L2 cache</text><text x="535" y="130" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">8 ns, hit 0.9</text><rect x="650" y="90" width="110" height="70" stroke-width="2"/><text x="705" y="112" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Memory</text><text x="705" y="130" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">90 ns</text><line x1="170" y1="68" x2="232" y2="68"/><polygon points="240,68 232,64 232,72" fill="#1f2937" stroke="none"/><line x1="170" y1="178" x2="232" y2="178"/><polygon points="240,178 232,174 232,182" fill="#1f2937" stroke="none"/><polyline points="390,68 425,68 425,110 452,110"/><polygon points="460,110 452,106 452,114" fill="#1f2937" stroke="none"/><polyline points="390,178 425,178 425,140 452,140"/><polygon points="460,140 452,136 452,144" fill="#1f2937" stroke="none"/><line x1="610" y1="125" x2="642" y2="125"/><polygon points="650,125 642,121 642,129" fill="#1f2937" stroke="none"/><text x="10" y="240" fill="#1f2937" stroke="none">I path: 2 + 0.2 x 17 = 5.4 ns.   D path: 2 + 0.1 x 17 = 3.7 ns.</text><text x="10" y="262" fill="#1f2937" stroke="none" font-weight="bold">Average read time = 0.6 x 5.4 + 0.4 x 3.7 = 3.24 + 1.48 = 4.72 ns.</text></svg>
