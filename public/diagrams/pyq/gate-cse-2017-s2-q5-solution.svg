<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" font-family="sans-serif" font-size="12">
<title>Compiler phases in order with the input each phase consumes</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#222"/></marker></defs>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="10" y="45" width="130" height="40"/><rect x="170" y="45" width="130" height="40"/><rect x="330" y="45" width="130" height="40"/><rect x="490" y="45" width="130" height="40"/><rect x="650" y="45" width="120" height="40"/>
<path d="M140 65 H168" marker-end="url(#a)"/><path d="M300 65 H328" marker-end="url(#a)"/><path d="M460 65 H488" marker-end="url(#a)"/><path d="M620 65 H648" marker-end="url(#a)"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="75" y="70">(iv) Lexical analyzer</text><text x="235" y="70">(ii) Syntax analyzer</text><text x="395" y="70">(iii) Semantic analyzer</text><text x="555" y="70">(i) Code generator</text><text x="710" y="70">target code</text>
<text x="75" y="30">Q character stream</text><text x="235" y="30">S token stream</text><text x="395" y="30">P syntax tree</text><text x="555" y="30">R intermediate rep.</text>
<text x="390" y="120">Each phase consumes the output of the one before it: Q-iv, S-ii, P-iii, R-i.</text>
</g>
</svg>
