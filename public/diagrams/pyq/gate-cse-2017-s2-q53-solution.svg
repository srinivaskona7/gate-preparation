<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Address split for 512 direct-mapped lines of 32 bytes: 18 tag bits, 9 index bits, 5 offset bits</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Byte address of a direct-mapped cache: 512 lines, 32-byte blocks, 2^32 bytes of memory</text><rect x="20" y="62" width="318.2711198428291" height="44" stroke-width="2"/><text x="179.13555992141454" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="179.13555992141454" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">18 bits = 32 - 9 - 5</text><text x="23" y="56" fill="#1f2937" stroke="none" font-size="10">31</text><text x="335.2711198428291" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">14</text><rect x="338.2711198428291" y="62" width="159.13555992141454" height="44" stroke-width="2"/><text x="417.8388998035364" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index (line)</text><text x="417.8388998035364" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">9 bits: 512 lines</text><text x="341.2711198428291" y="56" fill="#1f2937" stroke="none" font-size="10">13</text><text x="494.4066797642436" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">5</text><rect x="497.4066797642436" y="62" width="122.59332023575638" height="44" stroke-width="2"/><text x="558.7033398821218" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="558.7033398821218" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">5 bits: 32 bytes</text><text x="500.4066797642436" y="56" fill="#1f2937" stroke="none" font-size="10">4</text><text x="617" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">0</text><text x="20" y="135" fill="#1f2937" stroke="none">Block size 32 = 2^5 gives 5 offset bits. 512 = 2^9 lines give 9 index bits.</text><text x="20" y="155" fill="#1f2937" stroke="none" font-weight="bold">Tag = 32 - 9 - 5 = 18 bits.</text></svg>
