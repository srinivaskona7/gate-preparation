<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="sans-serif">
<title>The string GATECSIT2017 with indices 0 to 12; 2[p] is T and 6[p] is I, so c + 84 - 73 - 1 = c + 10 points at 1 and strlen counts 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="45" y="24" fill="#222" font-size="11" text-anchor="middle">0</text>
<rect x="20" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="45.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">G</text>
<text x="95" y="24" fill="#222" font-size="11" text-anchor="middle">1</text>
<rect x="70" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="95.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">A</text>
<text x="145" y="24" fill="#222" font-size="11" text-anchor="middle">2</text>
<rect x="120" y="30" width="50" height="32" stroke="#222" stroke-width="3" fill="none"/>
<text x="145.0" y="50.9" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">T</text>
<text x="195" y="24" fill="#222" font-size="11" text-anchor="middle">3</text>
<rect x="170" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="195.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">E</text>
<text x="245" y="24" fill="#222" font-size="11" text-anchor="middle">4</text>
<rect x="220" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="245.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">C</text>
<text x="295" y="24" fill="#222" font-size="11" text-anchor="middle">5</text>
<rect x="270" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="295.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">S</text>
<text x="345" y="24" fill="#222" font-size="11" text-anchor="middle">6</text>
<rect x="320" y="30" width="50" height="32" stroke="#222" stroke-width="3" fill="none"/>
<text x="345.0" y="50.9" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">I</text>
<text x="395" y="24" fill="#222" font-size="11" text-anchor="middle">7</text>
<rect x="370" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="395.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">T</text>
<text x="445" y="24" fill="#222" font-size="11" text-anchor="middle">8</text>
<rect x="420" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="445.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">2</text>
<text x="495" y="24" fill="#222" font-size="11" text-anchor="middle">9</text>
<rect x="470" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="495.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">0</text>
<text x="545" y="24" fill="#222" font-size="11" text-anchor="middle">10</text>
<rect x="520" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="545.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">1</text>
<text x="595" y="24" fill="#222" font-size="11" text-anchor="middle">11</text>
<rect x="570" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">7</text>
<text x="645" y="24" fill="#222" font-size="11" text-anchor="middle">12</text>
<rect x="620" y="30" width="50" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="645.0" y="50.9" fill="#222" font-size="14" text-anchor="middle">\0</text>
<text x="145" y="82" fill="#222" font-size="11" text-anchor="middle">2[p] = p[2] = 'T' = 84</text>
<text x="345" y="100" fill="#222" font-size="11" text-anchor="middle">6[p] = p[6] = 'I' = 73</text>
<line x1="545" y1="150" x2="545" y2="66" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="545" y="168" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">c + 84 - 73 - 1</text>
<text x="545" y="184" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">= c + 10</text>
<text x="20" y="212" fill="#222" font-size="12" text-anchor="start">a[i] is *(a + i), so 2[p] is the same as p[2].  The letters T and I enter the sum as their ASCII codes, 84 and 73.</text>
<text x="20" y="236" fill="#222" font-size="14" text-anchor="start" font-weight="bold">strlen("17") = 2</text>
</svg>
