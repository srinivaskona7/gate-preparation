<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="sans-serif" fill="#1f2937"><title>Canonical LR(1) contains LALR(1) which contains SLR(1), with the grammars that separate the classes</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="760" height="360" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="22" y="30" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Canonical LR(1)  (statement I: more powerful than SLR, true)</text>
<rect x="30" y="46" width="720" height="238" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="42" y="66" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">LALR(1)  (statement II: SLR more powerful than LALR, false)</text>
<rect x="50" y="82" width="380" height="186" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="62" y="102" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">SLR(1)  (statement III: more powerful than canonical LR, false)</text>
<text x="62" y="130" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">E -&gt; E + T | T,  T -&gt; T * F | F,</text>
<text x="62" y="146" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">F -&gt; ( E ) | id</text>
<text x="62" y="166" font-size="12" text-anchor="start" fill="#1f2937">all four tables conflict-free</text>
<circle cx="480" cy="130" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="1.2"/>
<text x="496" y="126" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; L = R | R</text>
<text x="496" y="142" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">L -&gt; * R | id ;  R -&gt; L</text>
<text x="496" y="160" font-size="12" text-anchor="start" fill="#1f2937">SLR conflict, LALR and LR(1) clean</text>
<circle cx="480" cy="322" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="1.2"/>
<text x="496" y="318" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; Aa | bAc | Bc | bBa</text>
<text x="496" y="334" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">A -&gt; d ;  B -&gt; d</text>
<text x="496" y="352" font-size="12" text-anchor="start" fill="#1f2937">LALR conflict, LR(1) clean</text>
<text x="22" y="396" font-size="12" text-anchor="start" fill="#1f2937">The classes nest strictly: SLR(1) inside LALR(1) inside LR(1). Only statement I is true.</text>
<text x="22" y="416" font-size="12" text-anchor="start" fill="#1f2937">II and III turn the nesting upside down: a weaker parser cannot be more powerful.</text>
<text x="22" y="446" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Answer: (A) I only.</text>
</svg>
