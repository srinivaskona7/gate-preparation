<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif">
<title>A square of area d inside its circumscribed circle; the square diagonal is the circle diameter, so the radius squared is d over 2 and the circle area is pi d over 2</title>
<circle cx="150" cy="140" r="99" fill="#c9d6ee" fill-opacity="0.55" stroke="#222" stroke-width="2"/>
<rect x="80" y="70" width="140" height="140" fill="#fbe7a1" fill-opacity="0.8" stroke="#222" stroke-width="2"/>
<line x1="80" y1="210" x2="220" y2="70" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="182" y="196" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">area d</text>
<text x="150" y="64" text-anchor="middle" font-size="12" fill="#222">side s</text>
<text x="228" y="148" text-anchor="start" font-size="13" fill="#222">s</text>
<text x="98" y="104" text-anchor="start" font-size="11" fill="#222">diameter</text>
<text x="300" y="60" text-anchor="start" font-size="13" fill="#222">1. Square: s squared = d, so the diagonal squared</text>
<text x="300" y="78" text-anchor="start" font-size="13" fill="#222">is s squared + s squared = 2d.</text>
<text x="300" y="112" text-anchor="start" font-size="13" fill="#222">2. The diagonal is the diameter: (2r)^2 = 2d,</text>
<text x="300" y="130" text-anchor="start" font-size="13" fill="#222">so r^2 = d / 2.</text>
<text x="300" y="164" text-anchor="start" font-size="13" fill="#222" font-weight="bold">3. Circle area = pi x r^2 = pi x d / 2.</text>
<text x="300" y="198" text-anchor="start" font-size="12" fill="#222">Check with d = 2: side = 1.414, diagonal = 2, r = 1,</text>
<text x="300" y="216" text-anchor="start" font-size="12" fill="#222">area = 3.1416 = (1/2) x pi x 2. Option (D).</text>
<text x="150" y="268" text-anchor="middle" font-size="11" fill="#222">circle through the four corners of the square</text>
</svg>
