<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 500 597" font-family="sans-serif">
<title>The same figure with the angles at E, F, A, B, C and D marked, showing angle DEC plus angle BFC equals angle BCD minus angle BAD</title>
<polyline points="80.0,56.0 100.8,317.8" fill="none" stroke="#222" stroke-width="2.5"/>
<polyline points="80.0,56.0 285.5,263.9" fill="none" stroke="#222" stroke-width="2.5"/>
<polyline points="100.8,317.8 456.0,214.2" fill="none" stroke="#222" stroke-width="2.5"/>
<polyline points="91.4,200.0 456.0,214.2" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="74.0" y="48.0" text-anchor="end" font-size="18" fill="#222" font-weight="bold">E</text>
<text x="92.8" y="333.8" text-anchor="end" font-size="18" fill="#222" font-weight="bold">A</text>
<text x="466.0" y="220.2" text-anchor="start" font-size="18" fill="#222" font-weight="bold">F</text>
<text x="81.4" y="205.0" text-anchor="end" font-size="18" fill="#222" font-weight="bold">D</text>
<text x="291.5" y="281.9" text-anchor="start" font-size="18" fill="#222" font-weight="bold">B</text>
<text x="233.6" y="197.3" text-anchor="start" font-size="18" fill="#222" font-weight="bold">C</text>
<path d="M82.1 81.9 A26 26 0 0 0 98.3 74.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="97" y="96" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">e</text>
<path d="M396.5 231.6 A62 62 0 0 1 394.0 211.8" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="383" y="227" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">f</text>
<path d="M125.8 310.5 A26 26 0 0 0 98.7 291.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="124" y="289" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">a</text>
<path d="M270.0 248.3 A22 22 0 0 0 264.4 270.1" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="251" y="259" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">b</text>
<path d="M93.1 221.9 A22 22 0 0 0 113.4 200.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="117" y="229" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">d</text>
<path d="M240.3 218.1 A18 18 0 0 1 209.6 204.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="214" y="240" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">c</text>
<text x="0" y="377.8" text-anchor="start" font-size="13" fill="#222">Letters: e = DEC, f = BFC, a = BAD,</text>
<text x="0" y="403.8" text-anchor="start" font-size="13" fill="#222">b = CBA, d = ADC, c = BCD.</text>
<text x="0" y="429.8" text-anchor="start" font-size="13" fill="#222">Triangle EAB: e + a + b = 180</text>
<text x="0" y="455.8" text-anchor="start" font-size="13" fill="#222">Triangle BCF: f + (180 - c) + (180 - b) = 180,</text>
<text x="0" y="481.8" text-anchor="start" font-size="13" fill="#222">so f = b + c - 180.</text>
<text x="0" y="507.8" text-anchor="start" font-size="13" fill="#222">Add: e + f = (180 - a - b) + (c + b - 180)</text>
<text x="0" y="533.8" text-anchor="start" font-size="13" fill="#222" font-weight="bold">= c - a, that is BCD - BAD. Option (A).</text>
</svg>
