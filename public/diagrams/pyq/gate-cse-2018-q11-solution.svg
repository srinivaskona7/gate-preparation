<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img">
<title>Many-to-one relationship R from E1 to E2 with total participation: arrows from every E1 entity</title>
<text x="110" y="26" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">E1 (larger)</text>
<text x="400" y="26" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">E2 (smaller)</text>
<ellipse cx="110" cy="60" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="63.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e1</text>
<ellipse cx="110" cy="105" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="108.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e2</text>
<ellipse cx="110" cy="150" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="153.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e3</text>
<ellipse cx="110" cy="195" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="198.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e4</text>
<ellipse cx="400" cy="80" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="83.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">f1</text>
<ellipse cx="400" cy="170" rx="30.0" ry="14.0" fill="none" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="173.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">f2</text>
<line x1="140" y1="60" x2="370" y2="80" stroke="#1f2937" stroke-width="1.4"/>
<line x1="140" y1="105" x2="370" y2="80" stroke="#1f2937" stroke-width="1.4"/>
<line x1="140" y1="150" x2="370" y2="170" stroke="#1f2937" stroke-width="1.4"/>
<line x1="140" y1="195" x2="370" y2="170" stroke="#1f2937" stroke-width="1.4"/>
<text x="260" y="235" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">every e has exactly one arrow out; an f may receive several or, if partial, none</text>
</svg>
