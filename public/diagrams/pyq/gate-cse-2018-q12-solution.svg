<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif" font-size="13">
<title>Inner, left, right and full outer join as regions of unmatched Book rows, matched rows and unmatched Stock rows</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="40" y="50" width="140" height="70" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="110" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">LB: unmatched Book</text>
<rect x="180" y="50" width="200" height="70" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
<text x="280" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">M: matched rows</text>
<rect x="380" y="50" width="140" height="70" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">RS: unmatched Stock</text>
<line x1="180" y1="150" x2="380" y2="150" stroke="#222" stroke-width="1.5"/>
<text x="280" y="170" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Query 1 inner = M</text>
<line x1="40" y1="190" x2="380" y2="190" stroke="#222" stroke-width="1.5"/>
<text x="210" y="210" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Query 2 left = LB + M</text>
<line x1="180" y1="225" x2="520" y2="225" stroke="#222" stroke-width="1.5"/>
<text x="350" y="243" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Query 3 right = M + RS</text>
<text x="20" y="30" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Query 4 full outer = the whole row (LB + M + RS), a superset of all three</text>
</svg>
