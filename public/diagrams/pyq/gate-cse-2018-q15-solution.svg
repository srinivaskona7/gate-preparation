<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="sans-serif">
<title>Three trials in a row: trial 1 is a tie with probability 1/6, trial 2 is a tie with probability 1/6, trial 3 has a winner with probability 5/6; the product is 5/216, about 0.023</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<rect x="30" y="60" width="170" height="80" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Trial 1</text>
<text x="115" y="108" text-anchor="middle" font-size="13" fill="#222">tie</text>
<text x="115" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1/6</text>
<line x1="200" y1="100" x2="270" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="270" y="60" width="170" height="80" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="355" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Trial 2</text>
<text x="355" y="108" text-anchor="middle" font-size="13" fill="#222">tie</text>
<text x="355" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1/6</text>
<line x1="440" y1="100" x2="510" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="510" y="60" width="170" height="80" rx="6" fill="none" stroke="#b3261e" stroke-width="2.5"/>
<text x="595" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Trial 3</text>
<text x="595" y="108" text-anchor="middle" font-size="13" fill="#222">someone wins</text>
<text x="595" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3261e">5/6</text>
<text x="360" y="30" text-anchor="middle" font-size="12" fill="#222">Tie: both dice show the same number, 6 of 36 outcomes, so P(tie) = 1/6 and P(winner) = 5/6</text>
<text x="360" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">P = (1/6) x (1/6) x (5/6) = 5/216 = 0.0231</text>
<text x="360" y="205" text-anchor="middle" font-size="11" fill="#222">Trials are independent, so the three probabilities multiply.</text>
</svg>
