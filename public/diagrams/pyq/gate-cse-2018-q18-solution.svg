<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 325" font-family="sans-serif" font-size="13">
<title>The graph 3-coloured with classes {a,d}, {b,e}, {c,f}; triangle a-b-c forces at least 3 colours</title>
<line x1="60" y1="50" x2="330" y2="50" stroke="#222" stroke-width="1.8"/>
<line x1="60" y1="50" x2="130" y2="115" stroke="#222" stroke-width="3.2"/>
<line x1="60" y1="50" x2="60" y2="185" stroke="#222" stroke-width="3.2"/>
<line x1="330" y1="50" x2="130" y2="115" stroke="#222" stroke-width="1.8"/>
<line x1="330" y1="50" x2="330" y2="185" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="115" x2="250" y2="115" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="115" x2="60" y2="185" stroke="#222" stroke-width="3.2"/>
<line x1="60" y1="185" x2="250" y2="115" stroke="#222" stroke-width="1.8"/>
<line x1="60" y1="185" x2="330" y2="185" stroke="#222" stroke-width="1.8"/>
<line x1="250" y1="115" x2="330" y2="185" stroke="#222" stroke-width="1.8"/>
<circle cx="60" cy="50" r="17" fill="#ddd" stroke="#222" stroke-width="1.8"/><text x="60" y="54.5" text-anchor="middle" fill="#222">a:1</text>
<circle cx="330" cy="50" r="17" fill="#999" stroke="#222" stroke-width="1.8"/><text x="330" y="54.5" text-anchor="middle" fill="#222">e:2</text>
<circle cx="130" cy="115" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130" y="119.5" text-anchor="middle" fill="#222">c:3</text>
<circle cx="250" cy="115" r="17" fill="#ddd" stroke="#222" stroke-width="1.8"/><text x="250" y="119.5" text-anchor="middle" fill="#222">d:1</text>
<circle cx="60" cy="185" r="17" fill="#999" stroke="#222" stroke-width="1.8"/><text x="60" y="189.5" text-anchor="middle" fill="#222">b:2</text>
<circle cx="330" cy="185" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="330" y="189.5" text-anchor="middle" fill="#222">f:3</text>
<text x="195" y="272" text-anchor="middle" fill="#222" font-size="12">Label v:k means vertex v gets colour k. Triangle a-b-c (bold) needs 3.</text>
<text x="195" y="292" text-anchor="middle" fill="#222" font-size="12">colour 1 = {a, d}   colour 2 = {b, e}   colour 3 = {c, f}</text>
<text x="195" y="312" text-anchor="middle" fill="#222" font-size="12">No edge joins two vertices of the same class, so chi = 3.</text>
</svg>
