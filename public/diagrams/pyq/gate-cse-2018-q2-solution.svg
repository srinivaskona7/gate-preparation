<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="sans-serif">
<title>Struct Ournode has three chars at offsets 0, 1, 2 holding 1, 0 and c; casting q to char* makes q+1 the byte at offset 1 and q+2 the byte at offset 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="145" y="38" fill="#222" font-size="12" text-anchor="middle">offset 0 (x)</text>
<rect x="80" y="46" width="130" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145.0" y="70.55" fill="#222" font-size="13" text-anchor="middle">'1'</text>
<text x="145" y="106" fill="#222" font-size="11" text-anchor="middle">ASCII 49</text>
<text x="295" y="38" fill="#222" font-size="12" text-anchor="middle">offset 1 (y)</text>
<rect x="230" y="46" width="130" height="40" stroke="#222" stroke-width="3" fill="none"/>
<text x="295.0" y="70.55" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">'0'</text>
<text x="295" y="106" fill="#222" font-size="11" text-anchor="middle">ASCII 48</text>
<text x="445" y="38" fill="#222" font-size="12" text-anchor="middle">offset 2 (z)</text>
<rect x="380" y="46" width="130" height="40" stroke="#222" stroke-width="3" fill="none"/>
<text x="445.0" y="70.55" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">'a'+2 = 'c'</text>
<text x="445" y="106" fill="#222" font-size="11" text-anchor="middle">ASCII 99</text>
<line x1="145" y1="160" x2="145" y2="112" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="145" y="178" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">(char*)q</text>
<line x1="295" y1="160" x2="295" y2="112" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="295" y="178" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">(char*)q + 1</text>
<line x1="445" y1="160" x2="445" y2="112" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="445" y="178" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">(char*)q + 2</text>
<text x="20" y="210" fill="#222" font-size="12" text-anchor="start">The cast binds tighter than +, so the addition moves by whole chars, not by whole structs.</text>
<text x="20" y="234" fill="#222" font-size="14" text-anchor="start" font-weight="bold">printf("%c, %c") prints the bytes at offsets 1 and 2:  0, c</text>
</svg>
