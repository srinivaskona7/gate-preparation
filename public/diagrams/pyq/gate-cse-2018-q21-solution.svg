<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="sans-serif">
<title>calc(4,81) calls calc(4,27), calc(4,9) and calc(4,3); the counter is 4 when b == 3 stops the recursion</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="44" width="125" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="82.5" y="68.55" fill="#222" font-size="13" text-anchor="middle">calc(4, 81)</text>
<text x="82" y="106" fill="#222" font-size="12" text-anchor="middle">counter becomes 1</text>
<line x1="145" y1="64" x2="185" y2="64" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="165" y="56" fill="#222" font-size="11" text-anchor="middle">b/3</text>
<rect x="185" y="44" width="125" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="247.5" y="68.55" fill="#222" font-size="13" text-anchor="middle">calc(4, 27)</text>
<text x="247" y="106" fill="#222" font-size="12" text-anchor="middle">counter becomes 2</text>
<line x1="310" y1="64" x2="350" y2="64" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="330" y="56" fill="#222" font-size="11" text-anchor="middle">b/3</text>
<rect x="350" y="44" width="125" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="412.5" y="68.55" fill="#222" font-size="13" text-anchor="middle">calc(4, 9)</text>
<text x="412" y="106" fill="#222" font-size="12" text-anchor="middle">counter becomes 3</text>
<line x1="475" y1="64" x2="515" y2="64" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="495" y="56" fill="#222" font-size="11" text-anchor="middle">b/3</text>
<rect x="515" y="44" width="125" height="40" stroke="#222" stroke-width="3" fill="none"/>
<text x="577.5" y="68.55" fill="#222" font-size="13" text-anchor="middle" font-weight="bold">calc(4, 3)</text>
<text x="577" y="106" fill="#222" font-size="12" text-anchor="middle">counter becomes 4</text>
<text x="20" y="150" fill="#222" font-size="12" text-anchor="start">calc(4,3): b == 3 is true, so it returns 4*4*4 without another call.</text>
<text x="20" y="172" fill="#222" font-size="12" text-anchor="start">The cubing on the way back (c*c*c) changes the returned value, never the counter.</text>
<text x="20" y="212" fill="#222" font-size="14" text-anchor="start" font-weight="bold">counter = 4</text>
</svg>
