<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" font-family="sans-serif" font-size="13">
<title>Two positive-edge-triggered D flip-flops in series on one clock: in feeds the first D, its Q feeds the second D, and the second Q is out</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="90" y="40" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="112" y="74" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">D</text>
<polyline points="90,100 101,108 90,116" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="151" y="70" text-anchor="middle" fill="#222" font-size="12">Q</text>
<rect x="230" y="40" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="252" y="74" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">D</text>
<polyline points="230,100 241,108 230,116" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="291" y="70" text-anchor="middle" fill="#222" font-size="12">Q</text>
<line x1="35" y1="65" x2="90" y2="65" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="30" y="59" text-anchor="end" fill="#222" font-size="13">in</text>
<line x1="160" y1="65" x2="230" y2="65" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="300" y1="65" x2="345" y2="65" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="350" y="59" text-anchor="start" fill="#222" font-size="13">out</text>
<polyline points="40,160 216,160" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="34" y="164" text-anchor="end" fill="#222" font-size="12">clock</text>
<polyline points="76,160 76,108 90,108" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="216,160 216,108 230,108" fill="none" stroke="#222" stroke-width="1.6"/>
</svg>
