<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 218" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>A 2 ms refresh period split into 819.2 microseconds of refresh and 1180.8 microseconds available, 59.04 percent</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">One 2 ms refresh period for the whole memory</text><rect x="20" y="40" width="245.76000000000002" height="46" stroke-width="2.5"/><rect x="265.76" y="40" width="354.24" height="46" stroke-width="2.5"/><text x="142.88" y="60" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">refresh</text><text x="142.88" y="77" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">819.2 us = 40.96 %</text><text x="442.88" y="60" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">read / write time</text><text x="442.88" y="77" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">1180.8 us = 59.04 %</text><text x="20" y="106" fill="#1f2937" stroke="none">0</text><text x="620" y="106" fill="#1f2937" stroke="none" text-anchor="end">2000 us</text><text x="10" y="140" fill="#1f2937" stroke="none">Each chip has 2^14 rows and one refresh operation (one row) takes 50 ns.</text><text x="10" y="160" fill="#1f2937" stroke="none">All 2^14 rows must be refreshed once per period: 2^14 x 50 ns = 16384 x 50 ns = 819.2 us.</text><text x="10" y="180" fill="#1f2937" stroke="none">The 8 chips of the 32-bit word refresh the same row together, so the time is not multiplied by 8.</text><text x="10" y="204" fill="#1f2937" stroke="none" font-weight="bold">Free time = 100 % - 40.96 % = 59.04 %, which rounds to 59.</text></svg>
