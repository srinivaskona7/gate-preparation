<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>Four units shared by three processes: with K = 2 one unit is always free and someone finishes; with K = 3 the holding 2, 1, 1 uses all four units and every process is stuck</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Four identical units, three processes, each may claim K units, one at a time.</text>
<text x="20" y="76" text-anchor="start" fill="#222" font-size="13" font-weight="bold">K = 2</text>
<rect x="120" y="50" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="150.0" y="74.0" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="184" y="50" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="214.0" y="74.0" text-anchor="middle" fill="#222" font-size="12">P2</text>
<rect x="248" y="50" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="278.0" y="74.0" text-anchor="middle" fill="#222" font-size="12">P3</text>
<rect x="312" y="50" width="60" height="40" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="342.0" y="74.0" text-anchor="middle" fill="#222" font-size="12">free</text>
<text x="400" y="66" text-anchor="start" fill="#222" font-size="12">Worst case: every process holds 1 (3 units), 1 unit is free.</text>
<text x="400" y="84" text-anchor="start" fill="#222" font-size="12">P1 takes it, holds 2 = K, finishes, returns 2 units.</text>
<text x="400" y="102" text-anchor="start" fill="#222" font-size="12">Then P2 and P3 finish. Deadlock is impossible.</text>
<text x="20" y="176" text-anchor="start" fill="#222" font-size="13" font-weight="bold">K = 3</text>
<rect x="120" y="150" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="150.0" y="174.0" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="184" y="150" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="214.0" y="174.0" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="248" y="150" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="278.0" y="174.0" text-anchor="middle" fill="#222" font-size="12">P2</text>
<rect x="312" y="150" width="60" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="342.0" y="174.0" text-anchor="middle" fill="#222" font-size="12">P3</text>
<text x="400" y="166" text-anchor="start" fill="#222" font-size="12">Holding (2, 1, 1): all 4 units are held, none is free.</text>
<text x="400" y="184" text-anchor="start" fill="#222" font-size="12">Each holds fewer than K = 3, so each still wants one more.</text>
<text x="400" y="202" text-anchor="start" fill="#222" font-size="12">Nobody can finish and release: deadlock.</text>
<text x="20" y="262" text-anchor="start" fill="#222" font-size="12">Deadlock-free needs n(K - 1) + 1 &lt;= 4, that is 3(K - 1) + 1 &lt;= 4.</text>
<text x="20" y="284" text-anchor="start" fill="#222" font-size="12">K = 2 gives 4 &lt;= 4 (holds), K = 3 gives 7 &lt;= 4 (fails).</text>
<text x="20" y="312" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Largest K that always avoids deadlock: 2</text>
</svg>
