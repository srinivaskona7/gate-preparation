<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif">
<title>Plane picture of P = 2I + N: only the line through (1, 4) keeps its direction under P, so there is a single eigen-direction</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<g stroke="#222" fill="none">
<line x1="40" y1="280" x2="250" y2="280" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="80" y1="310" x2="80" y2="20" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="73" y1="308" x2="144.4" y2="22" stroke-width="1.6" stroke-dasharray="2 4"/>
<line x1="80" y1="280" x2="94" y2="224" stroke-width="3.2" marker-end="url(#ah)"/>
<line x1="80" y1="280" x2="108" y2="168" stroke-width="2" marker-end="url(#ah)"/>
<line x1="80" y1="280" x2="94" y2="280" stroke-width="3.2" marker-end="url(#ah)"/>
<line x1="80" y1="280" x2="164" y2="56" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
</g>
<g fill="#222" font-size="12">
<text x="232" y="296">x</text><text x="86" y="26">y</text>
<text x="150" y="190">v = (1, 4)</text>
<text x="150" y="206" font-size="11">line of the eigenvectors</text>
<text x="122" y="170" font-size="12">Pv = 2v = (2, 8)</text>
<text x="100" y="298" font-weight="bold">e = (1, 0)</text>
<text x="170" y="60">Pe = (6, 16)</text>
<text x="170" y="76" font-size="11">leaves the x-axis:</text>
<text x="170" y="90" font-size="11">e is not an eigenvector</text>
</g>
<g fill="#222" font-size="12">
<text x="330" y="40" font-weight="bold" font-size="13">One eigen-direction: (1, 4)</text>
<text x="330" y="66" font-family="monospace" font-size="11">N = [[4, -1], [16, -4]],  N² = 0</text>
<text x="330" y="86" font-family="monospace" font-size="11">P = 2I + N = [[6, -1], [16, -2]]</text>
<text x="330" y="116">trace P = 4, det P = 4: (λ - 2)² = 0</text>
<text x="330" y="146">II: repeated eigenvalue, forced (two different</text>
<text x="344" y="161">eigenvalues give two eigen-directions)</text>
<text x="330" y="186">III: not diagonalisable, forced (a basis of</text>
<text x="344" y="201">eigenvectors needs two directions)</text>
<text x="330" y="226">I: not forced. Here det P = 4, so P has an</text>
<text x="344" y="241">inverse; P = N (eigenvalue 0) has none</text>
<text x="330" y="282" font-weight="bold" font-size="13">Only II and III are necessarily true: D</text>
</g>
</svg>
