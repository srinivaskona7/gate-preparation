<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 222" font-family="sans-serif" font-size="13">
<title>A 7-element model with the three witnesses s,t,u boxed; restricting to them gives a model with at most 3 elements</title>
<rect x="20" y="20" width="360" height="70" rx="8" fill="none" stroke="#222" stroke-width="1.5"/><text x="200" y="14" text-anchor="middle" fill="#222" font-size="12">a model with 7 elements</text>
<circle cx="50" cy="55" r="15" fill="#fff" stroke="#222" stroke-width="2.6"/><text x="50" y="59.5" text-anchor="middle" fill="#222">s</text>
<circle cx="100" cy="55" r="15" fill="#fff" stroke="#222" stroke-width="2.6"/><text x="100" y="59.5" text-anchor="middle" fill="#222">t</text>
<circle cx="150" cy="55" r="15" fill="#fff" stroke="#222" stroke-width="2.6"/><text x="150" y="59.5" text-anchor="middle" fill="#222">u</text>
<circle cx="200" cy="55" r="15" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3"/><text x="200" y="59.5" text-anchor="middle" fill="#666" font-size="13">4</text>
<circle cx="250" cy="55" r="15" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3"/><text x="250" y="59.5" text-anchor="middle" fill="#666" font-size="13">5</text>
<circle cx="300" cy="55" r="15" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3"/><text x="300" y="59.5" text-anchor="middle" fill="#666" font-size="13">6</text>
<circle cx="350" cy="55" r="15" fill="#fff" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3"/><text x="350" y="59.5" text-anchor="middle" fill="#666" font-size="13">7</text>
<rect x="28" y="33" width="140" height="44" rx="10" fill="none" stroke="#222" stroke-width="2.4"/>
<text x="98" y="112" text-anchor="middle" fill="#222" font-size="12">witnesses s, t, u</text>
<text x="285" y="112" text-anchor="middle" fill="#555" font-size="12">the other four elements</text>
<text x="200" y="145" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">keep only {s, t, u}: at most 3 elements</text>
<text x="200" y="168" text-anchor="middle" fill="#222" font-size="11">psi has no function symbols, so {s,t,u} is a structure by itself</text>
<text x="200" y="188" text-anchor="middle" fill="#222" font-size="11">any v, w, x, y taken from {s,t,u} was also allowed in the 7: psi holds</text>
<text x="200" y="208" text-anchor="middle" fill="#222" font-size="12">so a model of size at most 3 exists: option A</text>
</svg>
