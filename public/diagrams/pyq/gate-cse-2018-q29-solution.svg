<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="sans-serif">
<title>fun1 swaps copies of the pointers so str1 and str2 are unchanged; fun2 swaps through the addresses, so str1 then points to Bye and str2 to Hi</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" fill="#222" font-size="13" text-anchor="start" font-weight="bold">After fun1(str1, str2)</text>
<rect x="20" y="50" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="55.0" y="70.2" fill="#222" font-size="12" text-anchor="middle">str1</text>
<rect x="20" y="110" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="55.0" y="130.2" fill="#222" font-size="12" text-anchor="middle">str2</text>
<rect x="210" y="50" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="255.0" y="70.2" fill="#222" font-size="12" text-anchor="middle">"Hi"</text>
<rect x="210" y="110" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="255.0" y="130.2" fill="#222" font-size="12" text-anchor="middle">"Bye"</text>
<line x1="90" y1="66" x2="210" y2="66" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="90" y1="126" x2="210" y2="126" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="176" fill="#222" font-size="12" text-anchor="start">s1 and s2 are copies of the two addresses.</text>
<text x="20" y="196" fill="#222" font-size="12" text-anchor="start">Swapping the copies leaves str1, str2 as they were.</text>
<text x="20" y="216" fill="#222" font-size="12" text-anchor="start">printf shows:  Hi Bye</text>
<text x="360" y="28" fill="#222" font-size="13" text-anchor="start" font-weight="bold">After fun2(&amp;str1, &amp;str2)</text>
<rect x="360" y="50" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="395.0" y="70.2" fill="#222" font-size="12" text-anchor="middle">str1</text>
<rect x="360" y="110" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="395.0" y="130.2" fill="#222" font-size="12" text-anchor="middle">str2</text>
<rect x="550" y="50" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="70.2" fill="#222" font-size="12" text-anchor="middle">"Hi"</text>
<rect x="550" y="110" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="595.0" y="130.2" fill="#222" font-size="12" text-anchor="middle">"Bye"</text>
<line x1="430" y1="66" x2="550" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="430" y1="126" x2="550" y2="72" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="360" y="176" fill="#222" font-size="12" text-anchor="start">s1 = &amp;str1 and s2 = &amp;str2, so *s1 and *s2 are</text>
<text x="360" y="196" fill="#222" font-size="12" text-anchor="start">the real pointers; swapping them swaps str1, str2.</text>
<text x="360" y="216" fill="#222" font-size="12" text-anchor="start">printf shows:  Bye Hi</text>
<text x="20" y="282" fill="#222" font-size="14" text-anchor="start" font-weight="bold">Whole output:  Hi Bye Bye Hi</text>
</svg>
