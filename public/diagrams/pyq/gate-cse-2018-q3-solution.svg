<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="13">
<title>Enqueue at the head is two pointer changes; dequeue at the tail needs the node before the tail, which a singly linked list only finds by walking n minus 1 links from the head</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">enqueue: new-&gt;next = head;  head = new.  O(1)</text>
<rect x="40" y="50" width="54" height="30" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="75.64" y1="50" x2="75.64" y2="80" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="57.82" y="70.0" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="bold">new</text>
<circle cx="84.82" cy="65.0" r="2.8" fill="#1d4ed8"/>
<rect x="150" y="50" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="185.64" y1="50" x2="185.64" y2="80" stroke="#222" stroke-width="1.4"/>
<text x="167.82" y="70.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x1</text>
<circle cx="194.82" cy="65.0" r="2.8" fill="#222"/>
<rect x="230" y="50" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="265.64" y1="50" x2="265.64" y2="80" stroke="#222" stroke-width="1.4"/>
<text x="247.82" y="70.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x2</text>
<circle cx="274.82" cy="65.0" r="2.8" fill="#222"/>
<rect x="310" y="50" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="345.64" y1="50" x2="345.64" y2="80" stroke="#222" stroke-width="1.4"/>
<text x="327.82" y="70.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x3</text>
<circle cx="354.82" cy="65.0" r="2.8" fill="#222"/>
<rect x="390" y="50" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="425.64" y1="50" x2="425.64" y2="80" stroke="#222" stroke-width="1.4"/>
<text x="407.82" y="70.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x4</text>
<circle cx="434.82" cy="65.0" r="2.8" fill="#222"/>
<line x1="194.82" y1="65.0" x2="230" y2="65.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="274.82" y1="65.0" x2="310" y2="65.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="354.82" y1="65.0" x2="390" y2="65.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="434.82" y1="65.0" x2="462" y2="65.0" stroke="#222" stroke-width="1.6"/>
<line x1="462" y1="57.0" x2="462" y2="73.0" stroke="#222" stroke-width="1.6"/>
<text x="466" y="69.0" text-anchor="start" fill="#222" font-size="11">NULL</text>
<line x1="84.82" y1="65.0" x2="150" y2="65" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="67" y="110" text-anchor="middle" fill="#1d4ed8" font-size="11">head moves here</text>
<text x="177" y="110" text-anchor="middle" fill="#6b7280" font-size="11">old head</text>
<text x="10" y="168" text-anchor="start" fill="#222" font-size="13" font-weight="bold">dequeue: delete at the tail, so the node before the tail is needed</text>
<rect x="60" y="225" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="95.64" y1="225" x2="95.64" y2="255" stroke="#222" stroke-width="1.4"/>
<text x="77.82" y="245.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x1</text>
<circle cx="104.82" cy="240.0" r="2.8" fill="#222"/>
<rect x="156" y="225" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="191.64" y1="225" x2="191.64" y2="255" stroke="#222" stroke-width="1.4"/>
<text x="173.82" y="245.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x2</text>
<circle cx="200.82" cy="240.0" r="2.8" fill="#222"/>
<rect x="252" y="225" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="287.64" y1="225" x2="287.64" y2="255" stroke="#222" stroke-width="1.4"/>
<text x="269.82" y="245.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x3</text>
<circle cx="296.82" cy="240.0" r="2.8" fill="#222"/>
<rect x="348" y="225" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="383.64" y1="225" x2="383.64" y2="255" stroke="#222" stroke-width="1.4"/>
<text x="365.82" y="245.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x4</text>
<circle cx="392.82" cy="240.0" r="2.8" fill="#222"/>
<rect x="444" y="225" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="479.64" y1="225" x2="479.64" y2="255" stroke="#222" stroke-width="1.4"/>
<text x="461.82" y="245.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">x5</text>
<circle cx="488.82" cy="240.0" r="2.8" fill="#222"/>
<line x1="104.82" y1="240.0" x2="156" y2="240.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="200.82" y1="240.0" x2="252" y2="240.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="296.82" y1="240.0" x2="348" y2="240.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="392.82" y1="240.0" x2="444" y2="240.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="488.82" y1="240.0" x2="516" y2="240.0" stroke="#222" stroke-width="1.6"/>
<line x1="516" y1="232.0" x2="516" y2="248.0" stroke="#222" stroke-width="1.6"/>
<text x="520" y="244.0" text-anchor="start" fill="#222" font-size="11">NULL</text>
<path d="M87,221 Q135.0,196 183,221" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
<text x="135.0" y="200" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">1</text>
<path d="M183,221 Q231.0,196 279,221" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
<text x="231.0" y="200" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">2</text>
<path d="M279,221 Q327.0,196 375,221" fill="none" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ab)"/>
<text x="327.0" y="200" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">3</text>
<text x="375.0" y="285" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">prev</text>
<text x="471.0" y="285" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">tail</text>
<text x="10" y="320" text-anchor="start" fill="#222" font-size="13">n = 5 nodes: n - 2 = 3 hops from head land on prev, then prev-&gt;next = NULL and tail = prev.</text>
<text x="10" y="344" text-anchor="start" fill="#222" font-size="13">There is no back pointer, so every dequeue walks Theta(n) links.</text>
<text x="10" y="368" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Answer (B): enqueue Theta(1), dequeue Theta(n).</text>
</svg>
