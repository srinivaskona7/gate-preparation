<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" font-family="sans-serif" font-size="13">
<title>Queue as a non-circular singly linked list: head points to the first node, the nodes are linked to the right, tail points to the last node whose next is NULL</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="40" y="30" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="75.64" y1="30" x2="75.64" y2="60" stroke="#222" stroke-width="1.4"/>
<text x="57.82" y="50.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold"></text>
<circle cx="84.82" cy="45.0" r="2.8" fill="#222"/>
<rect x="150" y="30" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="185.64" y1="30" x2="185.64" y2="60" stroke="#222" stroke-width="1.4"/>
<text x="167.82" y="50.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold"></text>
<circle cx="194.82" cy="45.0" r="2.8" fill="#222"/>
<line x1="84.82" y1="45.0" x2="150" y2="45" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="278" y="50" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">. . . . . .</text>
<line x1="194.82" y1="45.0" x2="250" y2="45" stroke="#222" stroke-width="1.6"/>
<line x1="305" y1="45" x2="420" y2="45" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="420" y="30" width="54" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="455.64" y1="30" x2="455.64" y2="60" stroke="#222" stroke-width="1.4"/>
<text x="437.82" y="50.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold"></text>
<circle cx="464.82" cy="45.0" r="2.8" fill="#222"/>
<line x1="464.82" y1="45.0" x2="500" y2="45" stroke="#222" stroke-width="1.6"/>
<line x1="500" y1="37" x2="500" y2="53" stroke="#222" stroke-width="1.6"/>
<text x="504" y="49" text-anchor="start" fill="#222" font-size="11">NULL</text>
<line x1="67" y1="110" x2="67" y2="78" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="67" y="128" text-anchor="middle" fill="#222" font-size="13">head</text>
<line x1="447" y1="110" x2="447" y2="78" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="447" y="128" text-anchor="middle" fill="#222" font-size="13">tail</text>
</svg>
