<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" font-family="sans-serif">
<title>Triangle s a b: BFS puts a and b both at depth 1, so edge a-b has depth difference 0; the DFS tree s a b has no cross edge</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<text x="130" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">BFS tree from s</text>
<circle cx="130" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="130" y="74.5" text-anchor="middle" font-size="13" fill="#222">s</text>
<circle cx="60" cy="170" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="174.6" text-anchor="middle" font-size="13" fill="#222">a</text>
<circle cx="200" cy="170" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="200" y="174.6" text-anchor="middle" font-size="13" fill="#222">b</text>
<line x1="121.4" y1="82.3" x2="68.6" y2="157.7" stroke="#222" stroke-width="2.6"/>
<line x1="138.6" y1="82.3" x2="191.4" y2="157.7" stroke="#222" stroke-width="2.6"/>
<line x1="75.0" y1="170.0" x2="185.0" y2="170.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="250" y="75" text-anchor="start" font-size="11" fill="#222">depth 0</text>
<text x="250" y="170" text-anchor="start" font-size="11" fill="#222">depth 1</text>
<text x="130" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">edge a-b: |1 - 1| = 0, not 1</text>
<text x="420" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">DFS tree from s</text>
<circle cx="420" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="420" y="64.5" text-anchor="middle" font-size="13" fill="#222">s</text>
<circle cx="420" cy="120" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="420" y="124.5" text-anchor="middle" font-size="13" fill="#222">a</text>
<circle cx="420" cy="180" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="420" y="184.6" text-anchor="middle" font-size="13" fill="#222">b</text>
<line x1="420.0" y1="75.0" x2="420.0" y2="105.0" stroke="#222" stroke-width="2.6"/>
<line x1="420.0" y1="135.0" x2="420.0" y2="165.0" stroke="#222" stroke-width="2.6"/>
<path d="M420.0 75.0 Q465.0 120.0 420.0 165.0" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="420" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">edge s-b joins ancestor and descendant</text>
</svg>
