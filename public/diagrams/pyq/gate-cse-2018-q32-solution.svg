<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="sans-serif">
<title>Loop 1 halves 2^40 down to 1 in 40 steps so j = 40; loop 2 halves j: 40, 20, 10, 5, 2 give sum 5, then j = 1 stops</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" fill="#222" font-size="12" text-anchor="start" font-weight="bold">Loop 1: i = 2^40, 2^39, ..., 2^1 each count once (i &gt; 1), then i = 2^0 = 1 stops.  So j = 40.</text>
<rect x="20" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="55.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">2^40</text>
<line x1="90" y1="59" x2="120" y2="59" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="120" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">2^39</text>
<line x1="190" y1="59" x2="220" y2="59" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="220" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
<text x="255.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">...</text>
<line x1="290" y1="59" x2="320" y2="59" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="320" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="355.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">2^2</text>
<line x1="390" y1="59" x2="420" y2="59" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="420" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="455.0" y="63.2" fill="#222" font-size="12" text-anchor="middle">2^1</text>
<line x1="490" y1="59" x2="520" y2="59" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520" y="44" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="555.0" y="63.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">1</text>
<text x="20" y="100" fill="#222" font-size="12" text-anchor="start">i / 2 each time: 40 halvings, j = 40</text>
<text x="20" y="142" fill="#222" font-size="12" text-anchor="start" font-weight="bold">Loop 2: j = 40 and sum counts every pass where j &gt; 1.</text>
<rect x="20" y="162" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="55.0" y="181.2" fill="#222" font-size="12" text-anchor="middle">j=40</text>
<text x="55" y="212" fill="#222" font-size="12" text-anchor="middle">sum 1</text>
<line x1="90" y1="177" x2="120" y2="177" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="105" y="170" fill="#222" font-size="11" text-anchor="middle">/2</text>
<rect x="120" y="162" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="181.2" fill="#222" font-size="12" text-anchor="middle">j=20</text>
<text x="155" y="212" fill="#222" font-size="12" text-anchor="middle">sum 2</text>
<line x1="190" y1="177" x2="220" y2="177" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="205" y="170" fill="#222" font-size="11" text-anchor="middle">/2</text>
<rect x="220" y="162" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="255.0" y="181.2" fill="#222" font-size="12" text-anchor="middle">j=10</text>
<text x="255" y="212" fill="#222" font-size="12" text-anchor="middle">sum 3</text>
<line x1="290" y1="177" x2="320" y2="177" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="305" y="170" fill="#222" font-size="11" text-anchor="middle">/2</text>
<rect x="320" y="162" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="355.0" y="181.2" fill="#222" font-size="12" text-anchor="middle">j=5</text>
<text x="355" y="212" fill="#222" font-size="12" text-anchor="middle">sum 4</text>
<line x1="390" y1="177" x2="420" y2="177" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="405" y="170" fill="#222" font-size="11" text-anchor="middle">/2</text>
<rect x="420" y="162" width="70" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="455.0" y="181.2" fill="#222" font-size="12" text-anchor="middle">j=2</text>
<text x="455" y="212" fill="#222" font-size="12" text-anchor="middle">sum 5</text>
<line x1="490" y1="177" x2="520" y2="177" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="505" y="170" fill="#222" font-size="11" text-anchor="middle">/2</text>
<rect x="520" y="162" width="70" height="30" stroke="#222" stroke-width="3" fill="none"/>
<text x="555.0" y="181.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">j=1</text>
<text x="555" y="212" fill="#222" font-size="12" text-anchor="middle">stop</text>
<text x="20" y="252" fill="#222" font-size="12" text-anchor="start">Integer division: 5/2 = 2 and 2/2 = 1.</text>
<text x="20" y="284" fill="#222" font-size="13" text-anchor="start" font-weight="bold">sum = 5, the number of halvings of 40 until it reaches 1: floor(log2 40) = 5.</text>
</svg>
