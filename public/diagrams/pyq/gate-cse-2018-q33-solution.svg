<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<title>Unsigned 8-bit fixed point with 5 integer bits and 3 fraction bits: 31.500 and 0.875 fit, 12.100 and 3.001 do not</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">b7 b6 b5 b4 b3 . b2 b1 b0 : five integer bits, three fraction bits</text>
<text x="154" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b7</text>
<rect x="130" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="154.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">16</text>
<text x="202" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b6</text>
<rect x="178" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="202.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">8</text>
<text x="250" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b5</text>
<rect x="226" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">4</text>
<text x="298" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b4</text>
<rect x="274" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="298.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">2</text>
<text x="346" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b3</text>
<rect x="322" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="346.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1</text>
<text x="376" y="74" font-size="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">.</text>
<text x="412" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b2</text>
<rect x="388" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="412.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/2</text>
<text x="460" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b1</text>
<rect x="436" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="460.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/4</text>
<text x="508" y="46" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">b0</text>
<rect x="484" y="54" width="48" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="508.0" y="71.2" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/8</text>
<text x="20" y="72" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">place value</text>
<text x="20" y="112" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Every stored value is a whole number of eighths: smallest step 1/8 = 0.125, largest 31.875.</text>
<text x="20" y="150" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">(i) 31.500</text>
<text x="130" y="150" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">11111.100</text>
<text x="290" y="150" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">31 + 1/2: needs only the 1/2 place</text>
<text x="620" y="150" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">fits</text>
<text x="20" y="178" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">(ii) 0.875</text>
<text x="130" y="178" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">00000.111</text>
<text x="290" y="178" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/2 + 1/4 + 1/8 = 7/8</text>
<text x="620" y="178" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">fits</text>
<text x="20" y="206" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">(iii) 12.100</text>
<text x="130" y="206" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">no finite pattern</text>
<text x="290" y="206" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0.1 = 1/10 is not a multiple of 1/8</text>
<text x="620" y="206" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">cannot</text>
<text x="20" y="234" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">(iv) 3.001</text>
<text x="130" y="234" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">no finite pattern</text>
<text x="290" y="234" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0.001 = 1/1000 is not a multiple of 1/8</text>
<text x="620" y="234" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">cannot</text>
<text x="20" y="280" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Only (iii) and (iv) cannot be represented exactly: option C.</text>
</svg>
