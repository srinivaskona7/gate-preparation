<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Tag, set index and offset widths of a K-way cache in terms of P, W, M, N and K</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Address of a K-way cache: 2^P-byte physical space, 2^W-byte words, 2^M-word blocks, 2^N-byte cache</text><rect x="20" y="62" width="262.5" height="44" stroke-width="2"/><text x="151.25" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="151.25" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">P - N + log2 K</text><rect x="282.5" y="62" width="187.5" height="44" stroke-width="2"/><text x="376.25" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">set index</text><text x="376.25" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">N - M - W - log2 K</text><rect x="470" y="62" width="150" height="44" stroke-width="2"/><text x="545" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">word offset</text><text x="545" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">M + W</text><text x="20" y="135" fill="#1f2937" stroke="none">Block = 2^M words x 2^W bytes = 2^(M+W) bytes, so offset = M + W bits.</text><text x="20" y="155" fill="#1f2937" stroke="none">Lines = 2^N / 2^(M+W) = 2^(N-M-W). Sets = lines / K, so index = N - M - W - log2 K bits.</text><text x="20" y="175" fill="#1f2937" stroke="none" font-weight="bold">Tag = P - (N - M - W - log2 K) - (M + W) = P - N + log2 K.</text><text x="20" y="195" fill="#1f2937" stroke="none">Check with P = 32, W = 2, M = 2, N = 15, K = 4: offset 4, lines 2^11, sets 2^9, index 9, tag 19 = 32 - 15 + 2.</text></svg>
