<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif" font-size="13">
<title>Matching arcs for languages I and II of the question: all arcs nest, so a pushdown automaton with one stack handles both</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="14" fill="#222" font-weight="bold">I:  m + p = n + q.  Example m = 3, n = 1, p = 1, q = 3: aaabcddd</text>
<text x="120" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="164" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="208" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="252" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="296" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="340" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<text x="384" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<text x="428" y="152" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<path d="M120,130 C120,17.439999999999998 428,17.439999999999998 428,130" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M164,130 C164,45.599999999999994 384,45.599999999999994 384,130" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M208,130 C208,101.92 252,101.92 252,130" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M296,130 C296,101.92 340,101.92 340,130" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="500" y="100" text-anchor="start" font-size="12" fill="#222">solid: surplus a matched with</text>
<text x="500" y="118" text-anchor="start" font-size="12" fill="#222">surplus d (here m - n = q - p = 2)</text>
<text x="500" y="140" text-anchor="start" font-size="12" fill="#222">dashed: a^n b^n and c^p d^p</text>
<text x="500" y="158" text-anchor="start" font-size="12" fill="#222">inner pairs, nested inside</text>
<text x="20" y="214" text-anchor="start" font-size="12" fill="#222">Grammar for m ≥ n:  S1 → a S1 d | X Y,  X → a X b | ε,  Y → c Y d | ε.  For m &lt; n the surplus pairs are b with c:</text>
<text x="20" y="234" text-anchor="start" font-size="12" fill="#222">S2 → X Z Y,  Z → b Z c | b c.   I = L(S1) ∪ L(S2), context-free.</text>
<text x="20" y="276" text-anchor="start" font-size="14" fill="#222" font-weight="bold">II:  m = n and p = q:  a^m b^m then c^p d^p, two separate nests, S → X Y.</text>
<text x="120" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="164" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="208" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="252" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="296" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="340" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="384" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<text x="428" y="382" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<path d="M120,360 C120,303.76 252,303.76 252,360" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M164,360 C164,331.92 208,331.92 208,360" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M296,360 C296,303.76 428,303.76 428,360" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M340,360 C340,331.92 384,331.92 384,360" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="20" y="420" text-anchor="start" font-size="12" fill="#222">III needs a = b = c and d different, IV needs the product m·n: both compare three counts or multiply, which one stack cannot do.</text>
</svg>
