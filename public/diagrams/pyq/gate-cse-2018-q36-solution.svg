<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>NFA for strings ending in ab, and the DFA from the subset construction whose states are sets of NFA states, so every NFA language has a deterministic machine</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="120" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">NFA N (accepts strings ending in ab)</text>
<circle cx="50" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="115" text-anchor="middle" fill="#222" font-size="13">q0</text>
<circle cx="150" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="150" y="115" text-anchor="middle" fill="#222" font-size="13">q1</text>
<circle cx="250" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="250" cy="110" r="20" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="250" y="115" text-anchor="middle" fill="#222" font-size="13">q2</text>
<line x1="10" y1="110" x2="26" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="74" y1="110" x2="126" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="100" y="102" text-anchor="middle" fill="#222" font-size="12">a</text>
<line x1="174" y1="110" x2="226" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="200" y="102" text-anchor="middle" fill="#222" font-size="12">b</text>
<path d="M 38,88 C 20,45 80,45 62,88" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="50" y="52" text-anchor="middle" fill="#222" font-size="12">a, b</text>
<text x="540" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">DFA from the subsets of {q0, q1, q2}</text>
<circle cx="420" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="420" y="115" text-anchor="middle" fill="#222" font-size="12">{0}</text>
<circle cx="540" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="540" y="115" text-anchor="middle" fill="#222" font-size="11">{0,1}</text>
<circle cx="660" cy="110" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="660" cy="110" r="20" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="660" y="115" text-anchor="middle" fill="#222" font-size="11">{0,2}</text>
<line x1="380" y1="110" x2="396" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="444" y1="110" x2="516" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="480" y="102" text-anchor="middle" fill="#222" font-size="12">a</text>
<line x1="564" y1="110" x2="636" y2="110" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="102" text-anchor="middle" fill="#222" font-size="12">b</text>
<path d="M 408,88 C 390,45 450,45 432,88" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="420" y="52" text-anchor="middle" fill="#222" font-size="12">b</text>
<path d="M 528,88 C 510,45 570,45 552,88" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="540" y="52" text-anchor="middle" fill="#222" font-size="12">a</text>
<path d="M 645,132 C 620,190 560,190 548,134" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="598" y="190" text-anchor="middle" fill="#222" font-size="12">a</text>
<path d="M 650,133 C 620,250 450,250 424,134" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="540" y="245" text-anchor="middle" fill="#222" font-size="12">b</text>
<text x="390" y="285" text-anchor="middle" fill="#222" font-size="13">The DFA is a DPDA that never touches its stack, so for every NFA the answer to (IV) is yes.</text>
<text x="390" y="307" text-anchor="middle" fill="#222" font-size="13">A question whose answer is always yes is decidable.</text>
</svg>
