<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif" font-size="13">
<title>Longest-prefix scan of bbaacabc: T3 matches bbaac, then T3 matches abc</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="40" y="50" width="40" height="30"/><rect x="80" y="50" width="40" height="30"/><rect x="120" y="50" width="40" height="30"/><rect x="160" y="50" width="40" height="30"/>
<rect x="200" y="50" width="40" height="30"/><rect x="240" y="50" width="40" height="30"/><rect x="280" y="50" width="40" height="30"/><rect x="320" y="50" width="40" height="30"/>
<path d="M40 100 H240 M40 96 V104 M240 96 V104"/><path d="M240 120 H360 M240 116 V124 M360 116 V124"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="60" y="70">b</text><text x="100" y="70">b</text><text x="140" y="70">a</text><text x="180" y="70">a</text><text x="220" y="70">c</text><text x="260" y="70">a</text><text x="300" y="70">b</text><text x="340" y="70">c</text>
<text x="140" y="118">T3 = bbaac (length 5)</text><text x="300" y="138">T3 = abc (length 3)</text>
</g>
<g fill="#222">
<text x="40" y="190">Start 0: T1 longest bba (3), T2 longest bb (2), T3 longest bbaac (5). T3 wins.</text>
<text x="40" y="210">Start 5: T1 longest a (1), T2 longest ab (2), T3 longest abc (3). T3 wins. Output T3 T3.</text>
</g>
<text x="40" y="38" fill="#222">positions 0 to 7</text>
</svg>
