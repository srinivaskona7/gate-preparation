<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif" fill="#1f2937"><title>The expression a#b$c$d#e#f with numbered brackets: $ groups first and to the left, # groups last and to the right</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<text x="20" y="24" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Read the tree as brackets, innermost first</text>
<text x="60" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">a</text>
<text x="110" y="60" font-size="18" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">#</text>
<text x="160" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">b</text>
<text x="210" y="60" font-size="18" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">$</text>
<text x="260" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">c</text>
<text x="310" y="60" font-size="18" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">$</text>
<text x="360" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">d</text>
<text x="410" y="60" font-size="18" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">#</text>
<text x="460" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">e</text>
<text x="510" y="60" font-size="18" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">#</text>
<text x="560" y="60" font-size="18" text-anchor="middle" font-family="monospace" fill="#1f2937">f</text>
<line x1="146" y1="64" x2="146" y2="72" stroke="#1f2937" stroke-width="1.2"/>
<line x1="146" y1="72" x2="274" y2="72" stroke="#1f2937" stroke-width="1.2"/>
<line x1="274" y1="64" x2="274" y2="72" stroke="#1f2937" stroke-width="1.2"/>
<circle cx="210.0" cy="84" r="10" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="210.0" y="88" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">1</text>
<line x1="146" y1="94" x2="146" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<line x1="146" y1="102" x2="374" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<line x1="374" y1="94" x2="374" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<circle cx="260.0" cy="114" r="10" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="260.0" y="118" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">2</text>
<line x1="446" y1="94" x2="446" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<line x1="446" y1="102" x2="574" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<line x1="574" y1="94" x2="574" y2="102" stroke="#1f2937" stroke-width="1.2"/>
<circle cx="510.0" cy="114" r="10" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="510.0" y="118" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">3</text>
<line x1="146" y1="124" x2="146" y2="132" stroke="#1f2937" stroke-width="1.2"/>
<line x1="146" y1="132" x2="574" y2="132" stroke="#1f2937" stroke-width="1.2"/>
<line x1="574" y1="124" x2="574" y2="132" stroke="#1f2937" stroke-width="1.2"/>
<circle cx="360.0" cy="144" r="10" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="360.0" y="148" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">4</text>
<line x1="46" y1="154" x2="46" y2="162" stroke="#1f2937" stroke-width="1.2"/>
<line x1="46" y1="162" x2="574" y2="162" stroke="#1f2937" stroke-width="1.2"/>
<line x1="574" y1="154" x2="574" y2="162" stroke="#1f2937" stroke-width="1.2"/>
<circle cx="310.0" cy="174" r="10" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="310.0" y="178" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">5</text>
<text x="20" y="232" font-size="12" text-anchor="start" fill="#1f2937">1  b$c:  a $ runs before the # around it, so $ has higher precedence.</text>
<text x="20" y="252" font-size="12" text-anchor="start" fill="#1f2937">2  (b$c)$d:  the left $ is grouped first, so $ is left associative.</text>
<text x="20" y="272" font-size="12" text-anchor="start" fill="#1f2937">3  e#f:  the right # is grouped first.</text>
<text x="20" y="292" font-size="12" text-anchor="start" fill="#1f2937">4  ((b$c)$d)#(e#f):  the middle # takes the group on its right, e#f, as its right operand.</text>
<text x="20" y="312" font-size="12" text-anchor="start" fill="#1f2937">5  a#(...):  the first # is grouped last, so # is right associative.</text>
<text x="20" y="346" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Answer: (A) $ higher precedence and left associative; # right associative.</text>
</svg>
