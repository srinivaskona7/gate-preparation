<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13">
<title>Safe sequence P0, P2, P1, P3: each process needs no more than what is available, runs to the end, and returns its allocation, so available grows from (3,3,0) to (8,4,6)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Need = Max - Allocation:  P0 (3,3,0)   P1 (1,0,2)   P2 (0,3,0)   P3 (3,4,1).   Start: Available (3,3,0), written (E,F,G).</text>
<rect x="20" y="60" width="165" height="130" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="102.5" y="79.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P0 runs</text>
<text x="102.5" y="99.0" text-anchor="middle" fill="#222" font-size="12">Need (3,3,0)</text>
<text x="102.5" y="119.0" text-anchor="middle" fill="#222" font-size="12">Available (3,3,0)</text>
<text x="102.5" y="139.0" text-anchor="middle" fill="#222" font-size="12">need &lt;= available</text>
<text x="102.5" y="159.0" text-anchor="middle" fill="#222" font-size="12">adds (1,0,1)</text>
<text x="102.5" y="179.0" text-anchor="middle" fill="#222" font-size="12">Available (4,3,1)</text>
<line x1="185.0" y1="125.0" x2="215.0" y2="125.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="215" y="60" width="165" height="130" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="297.5" y="79.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P2 runs</text>
<text x="297.5" y="99.0" text-anchor="middle" fill="#222" font-size="12">Need (0,3,0)</text>
<text x="297.5" y="119.0" text-anchor="middle" fill="#222" font-size="12">Available (4,3,1)</text>
<text x="297.5" y="139.0" text-anchor="middle" fill="#222" font-size="12">need &lt;= available</text>
<text x="297.5" y="159.0" text-anchor="middle" fill="#222" font-size="12">adds (1,0,3)</text>
<text x="297.5" y="179.0" text-anchor="middle" fill="#222" font-size="12">Available (5,3,4)</text>
<line x1="380.0" y1="125.0" x2="410.0" y2="125.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="410" y="60" width="165" height="130" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="492.5" y="79.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P1 runs</text>
<text x="492.5" y="99.0" text-anchor="middle" fill="#222" font-size="12">Need (1,0,2)</text>
<text x="492.5" y="119.0" text-anchor="middle" fill="#222" font-size="12">Available (5,3,4)</text>
<text x="492.5" y="139.0" text-anchor="middle" fill="#222" font-size="12">need &lt;= available</text>
<text x="492.5" y="159.0" text-anchor="middle" fill="#222" font-size="12">adds (1,1,2)</text>
<text x="492.5" y="179.0" text-anchor="middle" fill="#222" font-size="12">Available (6,4,6)</text>
<line x1="575.0" y1="125.0" x2="605.0" y2="125.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="605" y="60" width="165" height="130" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="687.5" y="79.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P3 runs</text>
<text x="687.5" y="99.0" text-anchor="middle" fill="#222" font-size="12">Need (3,4,1)</text>
<text x="687.5" y="119.0" text-anchor="middle" fill="#222" font-size="12">Available (6,4,6)</text>
<text x="687.5" y="139.0" text-anchor="middle" fill="#222" font-size="12">need &lt;= available</text>
<text x="687.5" y="159.0" text-anchor="middle" fill="#222" font-size="12">adds (2,0,0)</text>
<text x="687.5" y="179.0" text-anchor="middle" fill="#222" font-size="12">Available (8,4,6)</text>
<text x="20" y="224" text-anchor="start" fill="#222" font-size="12">Every need fits inside the available vector at its turn, so all four processes finish: the state is safe.</text>
<text x="20" y="246" text-anchor="start" fill="#222" font-size="12">Other safe orders exist (P2, P0, P1, P3 and more); one is enough.</text>
<text x="20" y="268" text-anchor="start" fill="#222" font-size="12">Options B, C and D each begin with "not in safe state", which is false.</text>
<text x="20" y="308" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Correct: A</text>
</svg>
