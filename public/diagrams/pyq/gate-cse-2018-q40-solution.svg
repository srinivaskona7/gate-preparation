<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif" font-size="13">
<title>Producer and consumer exchange two counting semaphores: the producer waits on full (free slots, starts N) and signals empty (items, starts 0); the consumer waits on empty and signals full</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">In this question "empty" counts items ready to read (starts 0); "full" counts free slots (starts N).</text>
<rect x="20" y="50" width="230" height="170" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="74.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Producer</text>
<text x="135.0" y="100.0" text-anchor="middle" fill="#222" font-size="12">wait(full)    take a free slot</text>
<text x="135.0" y="126.0" text-anchor="middle" fill="#222" font-size="12">wait(mutex)</text>
<text x="135.0" y="152.0" text-anchor="middle" fill="#222" font-size="12">add item to buffer</text>
<text x="135.0" y="178.0" text-anchor="middle" fill="#222" font-size="12">signal(mutex)</text>
<text x="135.0" y="204.0" text-anchor="middle" fill="#222" font-size="12">signal(empty)   one more item</text>
<rect x="530" y="50" width="230" height="170" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="645.0" y="74.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Consumer</text>
<text x="645.0" y="100.0" text-anchor="middle" fill="#222" font-size="12">wait(empty)    take an item</text>
<text x="645.0" y="126.0" text-anchor="middle" fill="#222" font-size="12">wait(mutex)</text>
<text x="645.0" y="152.0" text-anchor="middle" fill="#222" font-size="12">take item from buffer</text>
<text x="645.0" y="178.0" text-anchor="middle" fill="#222" font-size="12">signal(mutex)</text>
<text x="645.0" y="204.0" text-anchor="middle" fill="#222" font-size="12">signal(full)    one more free slot</text>
<rect x="300" y="90" width="180" height="70" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="390.0" y="121.5" text-anchor="middle" fill="#222" font-size="12">buffer of N slots</text>
<text x="390.0" y="136.5" text-anchor="middle" fill="#222" font-size="12">mutex guards it</text>
<line x1="250.0" y1="250.0" x2="530.0" y2="250.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="390" y="242" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">signal(empty): +1 item</text>
<line x1="530.0" y1="290.0" x2="250.0" y2="290.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="390" y="314" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">signal(full): +1 free slot</text>
<text x="20" y="346" text-anchor="start" fill="#222" font-size="12">Each side waits on the counter the other side refills: full on the producer side, empty on the consumer side.</text>
<text x="20" y="366" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P = full, Q = empty, R = empty, S = full</text>
<text x="20" y="388" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Correct: C</text>
</svg>
