<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="sans-serif" font-size="13">
<title>Graph of the six permutations of 1,2,3 where edges are adjacent swaps: one 6-cycle, every vertex has degree 2</title>
<line x1="200.0" y1="35.0" x2="269.3" y2="75.0" stroke="#222" stroke-width="1.8"/>
<line x1="269.3" y1="75.0" x2="269.3" y2="155.0" stroke="#222" stroke-width="1.8"/>
<line x1="269.3" y1="155.0" x2="200.0" y2="195.0" stroke="#222" stroke-width="1.8"/>
<line x1="200.0" y1="195.0" x2="130.7" y2="155.0" stroke="#222" stroke-width="1.8"/>
<line x1="130.7" y1="155.0" x2="130.7" y2="75.0" stroke="#222" stroke-width="1.8"/>
<line x1="130.7" y1="75.0" x2="200.0" y2="35.0" stroke="#222" stroke-width="1.8"/>
<circle cx="200.0" cy="35.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="200.0" y="39.5" text-anchor="middle" fill="#222" font-size="12">123</text>
<circle cx="269.3" cy="75.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="269.3" y="79.5" text-anchor="middle" fill="#222" font-size="12">213</text>
<circle cx="269.3" cy="155.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="269.3" y="159.5" text-anchor="middle" fill="#222" font-size="12">231</text>
<circle cx="200.0" cy="195.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="200.0" y="199.5" text-anchor="middle" fill="#222" font-size="12">321</text>
<circle cx="130.7" cy="155.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130.7" y="159.5" text-anchor="middle" fill="#222" font-size="12">312</text>
<circle cx="130.7" cy="75.0" r="19" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130.7" y="79.5" text-anchor="middle" fill="#222" font-size="12">132</text>
<text x="255.6" y="49.5" text-anchor="middle" fill="#222" font-size="10">swap 1,2</text>
<text x="297.9" y="118.3" text-anchor="middle" fill="#222" font-size="10">swap 2,3</text>
<text x="245.7" y="192.6" text-anchor="middle" fill="#222" font-size="10">swap 1,2</text>
<text x="132.3" y="192.6" text-anchor="middle" fill="#222" font-size="10">swap 2,3</text>
<text x="102.1" y="118.3" text-anchor="middle" fill="#222" font-size="10">swap 1,2</text>
<text x="144.4" y="49.5" text-anchor="middle" fill="#222" font-size="10">swap 2,3</text>
<text x="200" y="235" text-anchor="middle" fill="#222" font-size="12">n = 3: each vertex has 2 neighbours; the 6 vertices form one cycle</text>
<text x="200" y="255" text-anchor="middle" fill="#222" font-size="12">n = 100: degree 99, one component, so y + 10z = 99 + 10 = 109</text>
</svg>
