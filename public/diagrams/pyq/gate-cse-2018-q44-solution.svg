<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
<title>Probability tree for Guwahati and Delhi temperatures: the three paths that end in Delhi high have probabilities 0.08, 0.05 and 0.003, which total 0.133, so P(Guwahati high given Delhi high) is 0.08 over 0.133, about 0.60</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="70" cy="170" r="10" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="70" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Guwahati</text>
<line x1="79" y1="170" x2="248" y2="55" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="106.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.2</text>
<circle cx="270" cy="55" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="270" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">H</text>
<line x1="292" y1="55" x2="462" y2="55" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="378" y="47" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.40</text>
<text x="470" y="59" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Delhi H</text>
<text x="560" y="59" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">=  0.080</text>
<line x1="79" y1="170" x2="248" y2="145" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="151.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.5</text>
<circle cx="270" cy="145" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="270" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">M</text>
<line x1="292" y1="145" x2="462" y2="145" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="378" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.10</text>
<text x="470" y="149" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Delhi H</text>
<text x="560" y="149" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">=  0.050</text>
<line x1="79" y1="170" x2="248" y2="235" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="196.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.3</text>
<circle cx="270" cy="235" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="270" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">L</text>
<line x1="292" y1="235" x2="462" y2="235" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="378" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.01</text>
<text x="470" y="239" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Delhi H</text>
<text x="560" y="239" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">=  0.003</text>
<text x="320" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">P(HG | HD) = 0.080 / (0.080 + 0.050 + 0.003) = 0.080 / 0.133 = 0.6015</text>
</svg>
