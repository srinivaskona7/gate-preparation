<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="sans-serif">
<title>Count(1024,1024): each round prints 10 stars while x halves from 1024 to 1, then y drops by 1; 1023 rounds run before y == 1, so 10230 stars</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" fill="#222" font-size="12" text-anchor="start" font-weight="bold">One round at a fixed y (y != 1):  x goes 1024 -&gt; 512 -&gt; ... -&gt; 2 -&gt; 1; each step with x != 1 prints one star.</text>
<rect x="14" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="39.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">1024</text>
<line x1="64" y1="58" x2="74" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="39" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="74" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="99.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">512</text>
<line x1="124" y1="58" x2="134" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="99" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="134" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="159.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">256</text>
<line x1="184" y1="58" x2="194" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="159" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="194" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="219.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">128</text>
<line x1="244" y1="58" x2="254" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="219" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="254" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="279.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">64</text>
<line x1="304" y1="58" x2="314" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="279" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="314" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="339.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">32</text>
<line x1="364" y1="58" x2="374" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="339" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="374" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="399.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">16</text>
<line x1="424" y1="58" x2="434" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="399" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="434" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="459.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">8</text>
<line x1="484" y1="58" x2="494" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="459" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="494" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="519.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">4</text>
<line x1="544" y1="58" x2="554" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="519" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="554" y="44" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="579.0" y="61.85" fill="#222" font-size="11" text-anchor="middle">2</text>
<line x1="604" y1="58" x2="614" y2="58" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="579" y="98" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">*</text>
<rect x="614" y="44" width="50" height="28" stroke="#222" stroke-width="3" fill="none"/>
<text x="639.0" y="61.85" fill="#222" font-size="11" text-anchor="middle" font-weight="bold">1</text>
<text x="20" y="126" fill="#222" font-size="12" text-anchor="start">10 stars per round (x = 1024 down to 2 prints; x = 1 does not).</text>
<text x="20" y="154" fill="#222" font-size="12" text-anchor="start" font-weight="bold">At x = 1 the else branch runs:  y = y - 1  and  Count(1024, y)  starts the next round.</text>
<rect x="20" y="174" width="80" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="60.0" y="192.2" fill="#222" font-size="12" text-anchor="middle">y=1024</text>
<line x1="100" y1="188" x2="120" y2="188" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="120" y="174" width="80" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="160.0" y="192.2" fill="#222" font-size="12" text-anchor="middle">y=1023</text>
<line x1="200" y1="188" x2="220" y2="188" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="220" y="174" width="80" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="260.0" y="192.2" fill="#222" font-size="12" text-anchor="middle">y=1022</text>
<line x1="300" y1="188" x2="320" y2="188" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="320" y="174" width="80" height="28" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 3"/>
<text x="360.0" y="192.2" fill="#222" font-size="12" text-anchor="middle">...</text>
<line x1="400" y1="188" x2="420" y2="188" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="420" y="174" width="80" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="460.0" y="192.2" fill="#222" font-size="12" text-anchor="middle">y=2</text>
<line x1="500" y1="188" x2="520" y2="188" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="520" y="174" width="80" height="28" stroke="#222" stroke-width="3" fill="none"/>
<text x="560.0" y="192.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">y=1</text>
<text x="20" y="226" fill="#222" font-size="12" text-anchor="start">Rounds that print: y = 1024 down to 2, which is 1023 rounds.  At y = 1 the call does nothing.</text>
<text x="20" y="258" fill="#222" font-size="14" text-anchor="start" font-weight="bold">Stars = 10 x 1023 = 10230</text>
</svg>
