<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="sans-serif" font-size="13">
<title>Min-heap of 7 values: the root is 1, the other 6 values are split into a left group of 3 and a right group of 3 in C(6,3) = 20 ways, and each group of 3 forms a min-heap in 2 ways, 20 times 2 times 2 equals 80</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="250" cy="40" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="250" y="44.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<path d="M130,120 L75,190 L185,190 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M370,120 L315,190 L425,190 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="238.0" y1="55.0" x2="132.0" y2="118.0" stroke="#222" stroke-width="1.6"/>
<line x1="262.0" y1="55.0" x2="368.0" y2="118.0" stroke="#222" stroke-width="1.6"/>
<text x="130" y="160" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3 values</text>
<text x="130" y="176" text-anchor="middle" fill="#222" font-size="12">2 heaps</text>
<text x="370" y="160" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3 values</text>
<text x="370" y="176" text-anchor="middle" fill="#222" font-size="12">2 heaps</text>
<text x="540" y="60" text-anchor="start" fill="#222" font-size="12" font-weight="bold">3-node min-heap on {x&lt;y&lt;z}:</text>
<circle cx="580" cy="100" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="580" y="104.08" text-anchor="middle" fill="#222" font-size="12">x</text>
<circle cx="556" cy="148" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="556" y="152.08" text-anchor="middle" fill="#222" font-size="12">y</text>
<circle cx="604" cy="148" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="604" y="152.08" text-anchor="middle" fill="#222" font-size="12">z</text>
<line x1="574.2" y1="111.6" x2="561.8" y2="136.4" stroke="#222" stroke-width="1.6"/>
<line x1="585.8" y1="111.6" x2="598.2" y2="136.4" stroke="#222" stroke-width="1.6"/>
<circle cx="680" cy="100" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="680" y="104.08" text-anchor="middle" fill="#222" font-size="12">x</text>
<circle cx="656" cy="148" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="656" y="152.08" text-anchor="middle" fill="#222" font-size="12">z</text>
<circle cx="704" cy="148" r="13" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="704" y="152.08" text-anchor="middle" fill="#222" font-size="12">y</text>
<line x1="674.2" y1="111.6" x2="661.8" y2="136.4" stroke="#222" stroke-width="1.6"/>
<line x1="685.8" y1="111.6" x2="698.2" y2="136.4" stroke="#222" stroke-width="1.6"/>
<text x="630" y="184" text-anchor="middle" fill="#222" font-size="11">smallest on top,</text>
<text x="630" y="198" text-anchor="middle" fill="#222" font-size="11">other two in 2 orders</text>
<text x="360" y="236" text-anchor="middle" fill="#222" font-size="13">Choose which 3 of the 6 go left: C(6,3) = 20</text>
<text x="360" y="260" text-anchor="middle" fill="#222" font-size="13">Left group: 2 heaps.  Right group: 2 heaps.</text>
<text x="360" y="290" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">20 x 2 x 2 = 80</text>
</svg>
