<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" font-family="sans-serif">
<title>With x = 5 the edges of weight 1 and 3 are forced and two independent tie pairs give 2 times 2 = 4 minimum spanning trees</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="210" cy="40" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="210" y="44.5" text-anchor="middle" font-size="13" fill="#222">a</text>
<circle cx="80" cy="105" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="80" y="109.5" text-anchor="middle" font-size="13" fill="#222">b</text>
<circle cx="340" cy="105" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="340" y="109.5" text-anchor="middle" font-size="13" fill="#222">c</text>
<circle cx="130" cy="225" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="130" y="229.6" text-anchor="middle" font-size="13" fill="#222">d</text>
<circle cx="290" cy="225" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="290" y="229.6" text-anchor="middle" font-size="13" fill="#222">e</text>
<line x1="196.6" y1="46.7" x2="93.4" y2="98.3" stroke="#222" stroke-width="2.2"/>
<text x="135.0" y="66.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">4</text>
<line x1="223.4" y1="46.7" x2="326.6" y2="98.3" stroke="#222" stroke-width="2.2"/>
<text x="287.0" y="66.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">5</text>
<line x1="204.0" y1="53.8" x2="136.0" y2="211.2" stroke="#222" stroke-width="3.4"/>
<text x="161.0" y="136.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1</text>
<line x1="216.0" y1="53.8" x2="284.0" y2="211.2" stroke="#222" stroke-width="3.4"/>
<text x="260.0" y="134.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">3</text>
<line x1="85.8" y1="118.8" x2="124.2" y2="211.2" stroke="#222" stroke-width="2.2"/>
<text x="93.0" y="169.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">4</text>
<line x1="145.0" y1="225.0" x2="275.0" y2="225.0" stroke="#222" stroke-width="1" stroke-dasharray="6 4"/>
<text x="210.0" y="242.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">4</text>
<line x1="334.2" y1="118.8" x2="295.8" y2="211.2" stroke="#222" stroke-width="2.2"/>
<text x="327.0" y="169.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">5</text>
<text x="400" y="50" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Bold: forced (weights 1 and 3)</text>
<text x="400" y="75" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Medium: two tie pairs</text>
<text x="400" y="95" text-anchor="start" font-size="12" fill="#222">  b: a-b or b-d (both 4)</text>
<text x="400" y="115" text-anchor="start" font-size="12" fill="#222">  c: a-c or c-e (both 5)</text>
<text x="400" y="145" text-anchor="start" font-size="12" fill="#222">Dashed d-e (4): closes the</text>
<text x="400" y="163" text-anchor="start" font-size="12" fill="#222">cycle a-d-e, never used</text>
<text x="400" y="200" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Trees: 2 x 2 = 4</text>
</svg>
