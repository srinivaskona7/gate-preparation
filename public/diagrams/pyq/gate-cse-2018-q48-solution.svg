<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="sans-serif" font-size="13">
<title>Greedy by ratio packs items 4 and 3 for 44 while item 1 alone gives 60: difference 16</title>
<g fill="#222"><text x="30" y="30" font-weight="bold">Capacity 11 kg (each cell = 1 kg)</text><text x="30" y="70">Ratios: item 4 = 12, item 1 = 6, item 3 = 5, item 2 = 4</text><text x="30" y="110">Greedy picks</text></g><path d="M30 125 V135 H470 V125" stroke="#222" fill="none"/><rect x="30" y="145" width="80" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="70" y="167" text-anchor="middle" fill="#222">item 4: Rs 24</text><rect x="110" y="145" width="160" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="190" y="167" text-anchor="middle" fill="#222">item 3: Rs 20</text><text x="30" y="205" fill="#222">Item 1 (10 kg) no longer fits in the 9 kg left; item 2 (7 kg) does not fit in 5 kg. Vgreedy = 44.</text><text x="30" y="250" fill="#222">Optimal picks</text><rect x="30" y="260" width="400" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="230" y="282" text-anchor="middle" fill="#222">item 1: Rs 60</text><text x="30" y="320" fill="#222">Vopt = 60 (item 1 alone; the best pair 2+3 or 2+4 gives 48 or 52). Vopt - Vgreedy = 16.</text>
</svg>
