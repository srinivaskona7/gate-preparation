<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665 244" font-family="sans-serif" font-size="11">
<title>Pipeline chart of five instructions with PO times 3, 2, 1, 3, 1: the PO stage is busy in every cycle from 4 to 13</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="125" y="32" text-anchor="middle" fill="#222" font-size="10">1</text><text x="155" y="32" text-anchor="middle" fill="#222" font-size="10">2</text><text x="185" y="32" text-anchor="middle" fill="#222" font-size="10">3</text><text x="215" y="32" text-anchor="middle" fill="#222" font-size="10">4</text><text x="245" y="32" text-anchor="middle" fill="#222" font-size="10">5</text><text x="275" y="32" text-anchor="middle" fill="#222" font-size="10">6</text><text x="305" y="32" text-anchor="middle" fill="#222" font-size="10">7</text><text x="335" y="32" text-anchor="middle" fill="#222" font-size="10">8</text><text x="365" y="32" text-anchor="middle" fill="#222" font-size="10">9</text><text x="395" y="32" text-anchor="middle" fill="#222" font-size="10">10</text><text x="425" y="32" text-anchor="middle" fill="#222" font-size="10">11</text><text x="455" y="32" text-anchor="middle" fill="#222" font-size="10">12</text><text x="485" y="32" text-anchor="middle" fill="#222" font-size="10">13</text><text x="515" y="32" text-anchor="middle" fill="#222" font-size="10">14</text><text x="102" y="32" text-anchor="end" fill="#222" font-size="10">cycle</text><text x="102" y="57" text-anchor="end" fill="#222" font-size="10">I1 (PO 3)</text><rect x="110" y="42" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="125" y="57" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="140" y="42" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="155" y="57" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="170" y="42" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="185" y="57" text-anchor="middle" fill="#222" font-size="10">OF</text><rect x="200" y="42" width="90" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="245" y="57" text-anchor="middle" fill="#222" font-size="10">PO</text><rect x="290" y="42" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="305" y="57" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="102" y="83" text-anchor="end" fill="#222" font-size="10">I2 (PO 2)</text><rect x="140" y="68" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="155" y="83" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="170" y="68" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="185" y="83" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="200" y="68" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="215" y="83" text-anchor="middle" fill="#222" font-size="10">OF</text><rect x="230" y="68" width="60" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="260" y="83" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="290" y="68" width="60" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="320" y="83" text-anchor="middle" fill="#222" font-size="10">PO</text><rect x="350" y="68" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="365" y="83" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="102" y="109" text-anchor="end" fill="#222" font-size="10">I3 (PO 1)</text><rect x="170" y="94" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="185" y="109" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="200" y="94" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="215" y="109" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="230" y="94" width="60" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="260" y="109" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="290" y="94" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="305" y="109" text-anchor="middle" fill="#222" font-size="10">OF</text><rect x="320" y="94" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="335" y="109" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="350" y="94" width="30" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="365" y="109" text-anchor="middle" fill="#222" font-size="10">PO</text><rect x="380" y="94" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="395" y="109" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="102" y="135" text-anchor="end" fill="#222" font-size="10">I4 (PO 3)</text><rect x="200" y="120" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="215" y="135" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="230" y="120" width="60" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="260" y="135" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="290" y="120" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="305" y="135" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="320" y="120" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="335" y="135" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="350" y="120" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="365" y="135" text-anchor="middle" fill="#222" font-size="10">OF</text><rect x="380" y="120" width="90" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="425" y="135" text-anchor="middle" fill="#222" font-size="10">PO</text><rect x="470" y="120" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="485" y="135" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="102" y="161" text-anchor="end" fill="#222" font-size="10">I5 (PO 1)</text><rect x="290" y="146" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="305" y="161" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="320" y="146" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="335" y="161" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="350" y="146" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="365" y="161" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="380" y="146" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="395" y="161" text-anchor="middle" fill="#222" font-size="10">OF</text><rect x="410" y="146" width="60" height="22" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="440" y="161" text-anchor="middle" fill="#222" font-size="10">hold</text><rect x="470" y="146" width="30" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="485" y="161" text-anchor="middle" fill="#222" font-size="10">PO</text><rect x="500" y="146" width="30" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="515" y="161" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="10" y="192" text-anchor="start" fill="#222" font-size="11">Grey cells are PO. "hold" means the instruction has finished its stage but the next stage is still busy.</text><text x="10" y="210" text-anchor="start" fill="#222" font-size="11">PO runs back to back, so total = 3 (IF, ID, OF of I1) + sum of PO cycles + 1 (WB of last).</text><text x="10" y="228" text-anchor="start" fill="#222" font-size="11">For the 100 instructions: 3 + 215 + 1 = 219 cycles.</text>
</svg>
