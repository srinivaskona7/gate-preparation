" fill="#222" font-weight="bold">Type-3 (1R+1F): 6 + 10 = 16 bits</text><rect x="20" y="145" width="150" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="95" y="160" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="95" y="172" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="170" y="145" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="220" y="160" text-anchor="middle" fill="#222" font-size="12">R</text><text x="220" y="172" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="270" y="145" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="345" y="160" text-anchor="middle" fill="#222" font-size="12">F</text><text x="345" y="172" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="192" text-anchor="start" fill="#222" font-weight="bold">Type-4 (1F): 10 + 6 = 16 bits</text><rect x="20" y="200" width="250" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="145" y="215" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="145" y="227" text-anchor="middle" fill="#222" font-size="10">10 b</text><rect x="270" y="200" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="345" y="215" text-anchor="middle" fill="#222" font-size="12">F</text><text x="345" y="227" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="257" text-anchor="start" fill="#222" font-weight="bold">16 four-bit codes: 4 Type-1, 8 Type-2, 4 free</text><rect x="20" y="265" width="41" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="40.5" y="284" text-anchor="middle" fill="#222" font-size="11">T1</text><rect x="61" y="265" width="41" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="81.5" y="284" text-anchor="middle" fill="#222" font-size="11">T1</text><rect x="102" y="265" width="41" height="30" fill="#d9d9d9" stroke="#222" stroke-width=