<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="sans-serif" font-size="13">
<title>Opcode space of the 2-byte format: Type-1 and Type-2 use 12 of 16 four-bit codes, Type-3 uses 14 of 16 grown six-bit codes, 32 ten-bit codes remain</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
