<line x1="20" y1="274" x2="700" y2="274" stroke="#222" stroke-width="1"/>
<text x="20.0" y="298.0" text-anchor="start" font-size="13" font-weight="normal" fill="#222">L^1 is not L^2 (2 is missing), but L^2 = L^3 = every length. The smallest k with L^k = L^(k+1) is 2.</text>
<text x="20.0" y="318.0" text-anchor="start" font-size="12" font-weight="normal" fill="#222">Filled box = length in the set. L^1 holds 0 and the odd lengths; adding two odd lengths gives every even length.</text>
