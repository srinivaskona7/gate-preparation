<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="13">
<title>Lengths of the strings in L, L^0, L^1, L^2 and L^3 for Q52: L^1 differs from L^2, and L^2 equals L^3, so the order is 2</title>
