<text x="110.0" y="94.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">q0</text>
<circle cx="250" cy="90" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="250" cy="90" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
