<text x="390.0" y="94.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">q2</text>
<line x1="128.0" y1="90.0" x2="232.0" y2="90.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="180.0" y="105.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
