<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 433" font-family="sans-serif" font-size="13">
<title>SSTF from cylinder 80 moving up: 86, 72, 116, 134, 20, 16, with three direction reversals</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<path d="M40,34 L500,34" stroke="#222" stroke-width="1.4"/>
<path d="M40,29 L40,39" stroke="#222" stroke-width="1.2"/>
<text x="40" y="24" text-anchor="middle" fill="#222" font-size="11">0</text>
<path d="M92.5714,29 L92.5714,39" stroke="#222" stroke-width="1.2"/>
<text x="92.5714" y="24" text-anchor="middle" fill="#222" font-size="11">16</text>
<path d="M105.714,29 L105.714,39" stroke="#222" stroke-width="1.2"/>
<path d="M276.571,29 L276.571,39" stroke="#222" stroke-width="1.2"/>
<text x="276.571" y="24" text-anchor="middle" fill="#222" font-size="11">72</text>
<path d="M302.857,29 L302.857,39" stroke="#222" stroke-width="1.2"/>
<text x="302.857" y="24" text-anchor="middle" fill="#222" font-size="11">80</text>
<path d="M322.571,29 L322.571,39" stroke="#222" stroke-width="1.2"/>
<path d="M421.143,29 L421.143,39" stroke="#222" stroke-width="1.2"/>
<text x="421.143" y="24" text-anchor="middle" fill="#222" font-size="11">116</text>
<path d="M480.286,29 L480.286,39" stroke="#222" stroke-width="1.2"/>
<text x="480.286" y="24" text-anchor="middle" fill="#222" font-size="11">134</text>
<path d="M500,29 L500,39" stroke="#222" stroke-width="1.2"/>
<text x="270" y="11" text-anchor="middle" fill="#222" font-size="11">cylinder number</text>
<circle cx="302.857" cy="66" r="5" fill="#222"/>
<text x="302.857" y="56" text-anchor="middle" fill="#222" font-size="11">start 80</text>
<path d="M305.2,71.5 L319.8,105.6" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="322.571" cy="112" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="116" text-anchor="start" fill="#222" font-size="12">1. 86, move 6 up</text>
<path d="M318.3,116.2 L281.5,153.1" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="276.571" cy="158" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="162" text-anchor="start" fill="#222" font-size="12">2. 72, move 14 down</text>
<path d="M282.3,159.8 L414.5,201.9" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="421.143" cy="204" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="208" text-anchor="start" fill="#222" font-size="12">3. 116, move 44 up</text>
<path d="M425.9,207.7 L474.8,245.7" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="480.286" cy="250" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="254" text-anchor="start" fill="#222" font-size="12">4. 134, move 18 up</text>
<path d="M474.3,250.7 L112.7,295.1" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="105.714" cy="296" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="300" text-anchor="start" fill="#222" font-size="12">5. 20, move 114 down</text>
<path d="M104.1,301.8 L94.5,335.3" stroke="#222" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<circle cx="92.5714" cy="342" r="5" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520" y="346" text-anchor="start" fill="#222" font-size="12">6. 16, move 4 down</text>
<text x="40" y="376" text-anchor="start" fill="#222" font-size="12">Total movement 6 + 14 + 44 + 18 + 114 + 4 = 200 cylinders: 2 x 20 = 40 mW.</text>
<text x="40" y="393" text-anchor="start" fill="#222" font-size="12">Reversals: at 86 (up to down), at 72 (down to up), at 134 (up to down): 3 x 15 = 45 mW.</text>
<text x="40" y="410" text-anchor="start" fill="#222" font-size="12">Total power = 40 + 45 = 85 mW.</text>
</svg>
