<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" font-family="sans-serif" font-size="13">
<title>A 4480-byte payload cut into 576-byte fragments: the third starts at byte 1152, offset field 144</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Data bytes after the 20-byte IP header (headers not drawn): 4500 - 20 = 4480</text>
<rect x="20" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="71.2" y="61" text-anchor="middle" fill="#222" font-size="12">frag 1</text>
<text x="71.2" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="71.2" y="106" text-anchor="middle" fill="#222" font-size="12">offset 0</text>
<text x="71.2" y="122" text-anchor="middle" fill="#222" font-size="10">(0 / 8)</text>
<rect x="122.5" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="173.8" y="61" text-anchor="middle" fill="#222" font-size="12">frag 2</text>
<text x="173.8" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="173.8" y="106" text-anchor="middle" fill="#222" font-size="12">offset 72</text>
<text x="173.8" y="122" text-anchor="middle" fill="#222" font-size="10">(576 / 8)</text>
<rect x="225.0" y="44" width="102.5" height="40" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="276.2" y="61" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">frag 3</text>
<text x="276.2" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="276.2" y="106" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">offset 144</text>
<text x="276.2" y="122" text-anchor="middle" fill="#222" font-size="10">(1152 / 8)</text>
<rect x="327.5" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="378.8" y="61" text-anchor="middle" fill="#222" font-size="12">frag 4</text>
<text x="378.8" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="378.8" y="106" text-anchor="middle" fill="#222" font-size="12">offset 216</text>
<text x="378.8" y="122" text-anchor="middle" fill="#222" font-size="10">(1728 / 8)</text>
<rect x="430.0" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="481.2" y="61" text-anchor="middle" fill="#222" font-size="12">frag 5</text>
<text x="481.2" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="481.2" y="106" text-anchor="middle" fill="#222" font-size="12">offset 288</text>
<text x="481.2" y="122" text-anchor="middle" fill="#222" font-size="10">(2304 / 8)</text>
<rect x="532.5" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="583.8" y="61" text-anchor="middle" fill="#222" font-size="12">frag 6</text>
<text x="583.8" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="583.8" y="106" text-anchor="middle" fill="#222" font-size="12">offset 360</text>
<text x="583.8" y="122" text-anchor="middle" fill="#222" font-size="10">(2880 / 8)</text>
<rect x="635.0" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="686.2" y="61" text-anchor="middle" fill="#222" font-size="12">frag 7</text>
<text x="686.2" y="77" text-anchor="middle" fill="#222" font-size="11">576 B</text>
<text x="686.2" y="106" text-anchor="middle" fill="#222" font-size="12">offset 432</text>
<text x="686.2" y="122" text-anchor="middle" fill="#222" font-size="10">(3456 / 8)</text>
<rect x="737.5" y="44" width="102.5" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="788.8" y="61" text-anchor="middle" fill="#222" font-size="12">frag 8</text>
<text x="788.8" y="77" text-anchor="middle" fill="#222" font-size="11">448 B</text>
<text x="788.8" y="106" text-anchor="middle" fill="#222" font-size="12">offset 504</text>
<text x="788.8" y="122" text-anchor="middle" fill="#222" font-size="10">(4032 / 8)</text>
<text x="10" y="152" text-anchor="start" fill="#222" font-size="12">Largest data per fragment: MTU 600 - header 20 = 580; round down to a multiple of 8 = 576 (offset counts 8-byte units).</text>
<text x="10" y="172" text-anchor="start" fill="#222" font-size="12">Seven full fragments of 576 plus a last one of 448: 7 x 576 + 448 = 4480.</text>
<text x="10" y="192" text-anchor="start" fill="#222" font-size="12">Third fragment starts after 2 x 576 = 1152 data bytes, so its offset field is 1152 / 8 = 144.</text>
</svg>
