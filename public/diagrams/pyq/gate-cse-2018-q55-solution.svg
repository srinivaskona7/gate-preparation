<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 286" width="900" height="286">
<title>Q hears P exactly when its 5-unit carrier sense ends, at d = 50 m</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="102" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">P</text>
<rect x="110.0" y="50" width="562.9629629629629" height="30" rx="0" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="391.48148148148147" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">P transmits for 20 units</text>
<text x="102" y="116" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Q</text>
<rect x="110.0" y="94" width="140.74074074074073" height="30" rx="0" fill="#fbe9a8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="180.37037037037038" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Q senses 5 units</text>
<text x="102" y="160" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">P's signal at Q</text>
<rect x="110.0" y="138" width="140.74074074074073" height="30" rx="0" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="180.37037037037038" y="158" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">d/10 = 5</text>
<rect x="250.74074074074073" y="138" width="562.9629629629629" height="30" rx="0" fill="#cdebc9" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="532.2222222222222" y="158" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">present at Q</text>
<line x1="110" y1="182" x2="880" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="182" x2="110.0" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="204" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<line x1="250.74074074074073" y1="182" x2="250.74074074074073" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.74074074074073" y="204" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">5</text>
<line x1="672.9629629629629" y1="182" x2="672.9629629629629" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="672.9629629629629" y="204" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">20</text>
<line x1="813.7037037037037" y1="182" x2="813.7037037037037" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="813.7037037037037" y="204" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">25</text>
<line x1="250.74074074074073" y1="36" x2="250.74074074074073" y2="182" stroke="#b00020" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="250.74074074074073" y="32" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#b00020">sense ends</text>
<text x="10" y="232" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">The signal reaches Q at t = d / 10. Q avoids a collision only if that is at most 5, so d &lt;= 50 m.</text>
</svg>
