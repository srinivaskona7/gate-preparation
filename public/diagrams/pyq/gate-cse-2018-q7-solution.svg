<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="sans-serif" font-size="13">
<title>Languages nested as recursive inside recursively enumerable inside all languages; two RE languages overlap in a set that is still RE</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<ellipse cx="230" cy="200" rx="215" ry="175" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="230" cy="200" rx="160" ry="115" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="230" cy="200" rx="95" ry="60" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="230" y="50" text-anchor="middle" fill="#222" font-size="12">all languages</text>
<text x="230" y="72" text-anchor="middle" fill="#222" font-size="12">complement of HALT: not RE</text>
<text x="230" y="108" text-anchor="middle" fill="#222" font-size="12">RE languages</text>
<text x="230" y="130" text-anchor="middle" fill="#222" font-size="12">HALT: RE, not recursive</text>
<text x="230" y="196" text-anchor="middle" fill="#222" font-size="12">recursive</text>
<text x="230" y="213" text-anchor="middle" fill="#222" font-size="12">languages</text>
<circle cx="580" cy="100" r="50" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="650" cy="100" r="50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="555" y="104" text-anchor="middle" fill="#222" font-size="13">L1</text>
<text x="675" y="104" text-anchor="middle" fill="#222" font-size="13">L2</text>
<text x="615" y="104" text-anchor="middle" fill="#222" font-size="12">both</text>
<text x="615" y="34" text-anchor="middle" fill="#222" font-size="12">two RE languages</text>
<text x="615" y="176" text-anchor="middle" fill="#222" font-size="12">(B) true: run M1 and M2 on w,</text>
<text x="615" y="193" text-anchor="middle" fill="#222" font-size="12">accept when both accept; the</text>
<text x="615" y="210" text-anchor="middle" fill="#222" font-size="12">overlap stays inside RE</text>
<text x="615" y="244" text-anchor="middle" fill="#222" font-size="12">(A) false: complement of HALT</text>
<text x="615" y="261" text-anchor="middle" fill="#222" font-size="12">falls outside RE</text>
<text x="615" y="295" text-anchor="middle" fill="#222" font-size="12">(C) false: HALT is RE, not recursive</text>
<text x="615" y="329" text-anchor="middle" fill="#222" font-size="12">(D) false: RE languages are</text>
<text x="615" y="346" text-anchor="middle" fill="#222" font-size="12">countable, not uncountable</text>
</svg>
