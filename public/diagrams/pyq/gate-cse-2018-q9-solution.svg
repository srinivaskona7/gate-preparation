<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150">
<title>Interrupt sequence Q P T R S</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="320" y="20" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Order of events after the device raises the interrupt</text>
<g stroke="#1a1a1a" stroke-width="1.5" fill="none">
<rect x="10" y="40" width="108" height="60"/><rect x="140" y="40" width="108" height="60"/><rect x="270" y="40" width="108" height="60"/><rect x="400" y="40" width="108" height="60"/><rect x="530" y="40" width="100" height="60"/>
<line x1="118" y1="70" x2="138" y2="70" marker-end="url(#ah)"/><line x1="248" y1="70" x2="268" y2="70" marker-end="url(#ah)"/><line x1="378" y1="70" x2="398" y2="70" marker-end="url(#ah)"/><line x1="508" y1="70" x2="528" y2="70" marker-end="url(#ah)"/></g>
<g font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
<text x="64" y="62" font-weight="bold">Q</text><text x="64" y="80">finish current</text><text x="64" y="94">instruction</text>
<text x="194" y="62" font-weight="bold">P</text><text x="194" y="80">push status of L</text><text x="194" y="94">on control stack</text>
<text x="324" y="62" font-weight="bold">T</text><text x="324" y="80">load new PC</text><text x="324" y="94">from interrupt</text>
<text x="454" y="62" font-weight="bold">R</text><text x="454" y="80">run the ISR</text>
<text x="580" y="62" font-weight="bold">S</text><text x="580" y="80">pop status of L</text><text x="580" y="94">resume</text></g>
<text x="320" y="130" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Answer: Q P T R S, option A</text>
</svg>
