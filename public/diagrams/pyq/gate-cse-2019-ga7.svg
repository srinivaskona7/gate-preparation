<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 30 820 540" font-family="sans-serif">
<title>Venn-style figure: teachers triangle holds 70 alone and 10 shared with administrators; administrators rectangle holds 20 alone and 20 shared with researchers; researchers circle holds 40 alone</title>
<rect x="498" y="90" width="127" height="342" fill="none" fill-opacity="0.7" stroke="none"/>
<polygon points="88,90 625,90 355,290" fill="none" stroke="#222" stroke-width="2.5"/>
<circle cx="565" cy="432" r="118" fill="none" stroke="#222" stroke-width="2.5"/>
<rect x="498" y="90" width="127" height="342" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="105" y="70" text-anchor="start" font-size="28" fill="#222" font-weight="bold">Teachers</text>
<text x="650" y="250" text-anchor="start" font-size="28" fill="#222" font-weight="bold">Administrators</text>
<text x="230" y="470" text-anchor="start" font-size="28" fill="#222" font-weight="bold">Researchers</text>
<text x="340" y="175" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">70</text>
<text x="562" y="125" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">10</text>
<text x="562" y="250" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">20</text>
<text x="562" y="395" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">20</text>
<text x="562" y="500" text-anchor="middle" font-size="30" fill="#222" font-weight="bold">40</text>
</svg>
