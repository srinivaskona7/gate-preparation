<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="sans-serif">
<title>Venn diagram of three clubs: Drama only 60, Dance only 80, Maths only 30, Drama and Dance only 38, Dance and Maths only 10, Drama and Maths only 5, all three 2; 225 students in clubs are 25 percent so the college has 900</title>
<rect x="10" y="10" width="620" height="430" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="22" y="30" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Whole college = 900</text>
<circle cx="190" cy="150" r="100" fill="#c9d6ee" fill-opacity="0.55" stroke="#222" stroke-width="2"/>
<circle cx="330" cy="150" r="100" fill="#fbe7a1" fill-opacity="0.55" stroke="#222" stroke-width="2"/>
<circle cx="260" cy="250" r="100" fill="#cfe8cf" fill-opacity="0.55" stroke="#222" stroke-width="2"/>
<text x="110" y="52" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Drama</text>
<text x="410" y="52" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Dance</text>
<text x="260" y="372" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Maths</text>
<text x="130" y="125" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">60</text>
<text x="130" y="139" text-anchor="middle" font-size="10" fill="#222">Drama only</text>
<text x="385" y="125" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">80</text>
<text x="385" y="139" text-anchor="middle" font-size="10" fill="#222">Dance only</text>
<text x="260" y="322" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">30</text>
<text x="260" y="336" text-anchor="middle" font-size="10" fill="#222">Maths only</text>
<text x="260" y="112" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">38</text>
<text x="260" y="126" text-anchor="middle" font-size="10" fill="#222">D and Dn</text>
<text x="200" y="222" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">5</text>
<text x="200" y="236" text-anchor="middle" font-size="10" fill="#222">D and M</text>
<text x="322" y="222" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">10</text>
<text x="322" y="236" text-anchor="middle" font-size="10" fill="#222">Dn and M</text>
<text x="260" y="178" text-anchor="middle" font-size="18" fill="#222" font-weight="bold">2</text>
<text x="260" y="192" text-anchor="middle" font-size="10" fill="#222">all three</text>
<text x="500" y="300" text-anchor="start" font-size="13" fill="#222" font-weight="bold">In no club</text>
<text x="500" y="330" text-anchor="start" font-size="22" fill="#222" font-weight="bold">675</text>
<text x="500" y="350" text-anchor="start" font-size="11" fill="#222">= 75 % of 900</text>
<text x="22" y="402" text-anchor="start" font-size="12" fill="#222">In some club = 60 + 80 + 30 + 38 + 10 + 5 + 2 = 225, which is 25 % of the college.</text>
<text x="22" y="422" text-anchor="start" font-size="12" fill="#222">225 = 0.25 x total, so total = 900: option (C). The question's 40, 12, 7 include the 2 in all three clubs.</text>
</svg>
