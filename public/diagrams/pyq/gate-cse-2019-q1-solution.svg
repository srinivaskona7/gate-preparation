<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Fully associative address split: 28 tag bits, 0 index bits, 4 offset bits</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Byte address of a fully associative cache: 16 KB, 16-byte blocks, 32-bit address</text><rect x="20" y="62" width="422.8187919463087" height="44" stroke-width="2"/><text x="231.40939597315435" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="231.40939597315435" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">28 bits = 32 - 0 - 4</text><text x="23" y="56" fill="#1f2937" stroke="none" font-size="10">31</text><text x="439.8187919463087" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">4</text><rect x="442.8187919463087" y="62" width="88.59060402684564" height="44" stroke-width="2"/><text x="487.1140939597315" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index</text><text x="487.1140939597315" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">0 bits: one set</text><rect x="531.4093959731543" y="62" width="88.59060402684564" height="44" stroke-width="2"/><text x="575.7046979865771" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="575.7046979865771" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">4 bits: 16 bytes</text><text x="534.4093959731543" y="56" fill="#1f2937" stroke="none" font-size="10">3</text><text x="617" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">0</text><text x="20" y="135" fill="#1f2937" stroke="none">Lines = 16 KB / 16 B = 1024. Fully associative: every line is in the same single set, 2^0 = 1.</text><text x="20" y="155" fill="#1f2937" stroke="none">Nothing selects a line by address, so the index has 0 bits and the tag is the whole block number.</text><text x="20" y="175" fill="#1f2937" stroke="none" font-weight="bold">Tag = 32 - 4 = 28 bits, index = 0 bits.</text></svg>
