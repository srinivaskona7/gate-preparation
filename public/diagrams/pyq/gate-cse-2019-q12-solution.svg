<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 210" font-family="sans-serif" font-size="13">
<title>K4 drawn three times, each with a different Hamiltonian cycle in bold: 1-2-3-4, 1-2-4-3, 1-3-2-4</title>
<line x1="80.0" y1="30.0" x2="130.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="80.0" y1="30.0" x2="80.0" y2="130.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="80.0" y1="30.0" x2="30.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="130.0" y1="80.0" x2="80.0" y2="130.0" stroke="#222" stroke-width="3"/>
<line x1="130.0" y1="80.0" x2="30.0" y2="80.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="80.0" y1="130.0" x2="30.0" y2="80.0" stroke="#222" stroke-width="3"/>
<circle cx="80.0" cy="30.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="80.0" y="34.5" text-anchor="middle" fill="#222">1</text>
<circle cx="130.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130.0" y="84.5" text-anchor="middle" fill="#222">2</text>
<circle cx="80.0" cy="130.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="80.0" y="134.5" text-anchor="middle" fill="#222">3</text>
<circle cx="30.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="30.0" y="84.5" text-anchor="middle" fill="#222">4</text>
<text x="80" y="165" text-anchor="middle" fill="#222" font-size="12">1-2-3-4-1</text>
<line x1="250.0" y1="30.0" x2="300.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="250.0" y1="30.0" x2="250.0" y2="130.0" stroke="#222" stroke-width="3"/>
<line x1="250.0" y1="30.0" x2="200.0" y2="80.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="300.0" y1="80.0" x2="250.0" y2="130.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="300.0" y1="80.0" x2="200.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="250.0" y1="130.0" x2="200.0" y2="80.0" stroke="#222" stroke-width="3"/>
<circle cx="250.0" cy="30.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="250.0" y="34.5" text-anchor="middle" fill="#222">1</text>
<circle cx="300.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="300.0" y="84.5" text-anchor="middle" fill="#222">2</text>
<circle cx="250.0" cy="130.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="250.0" y="134.5" text-anchor="middle" fill="#222">3</text>
<circle cx="200.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="200.0" y="84.5" text-anchor="middle" fill="#222">4</text>
<text x="250" y="165" text-anchor="middle" fill="#222" font-size="12">1-2-4-3-1</text>
<line x1="420.0" y1="30.0" x2="470.0" y2="80.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="420.0" y1="30.0" x2="420.0" y2="130.0" stroke="#222" stroke-width="3"/>
<line x1="420.0" y1="30.0" x2="370.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="470.0" y1="80.0" x2="420.0" y2="130.0" stroke="#222" stroke-width="3"/>
<line x1="470.0" y1="80.0" x2="370.0" y2="80.0" stroke="#222" stroke-width="3"/>
<line x1="420.0" y1="130.0" x2="370.0" y2="80.0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="420.0" cy="30.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="420.0" y="34.5" text-anchor="middle" fill="#222">1</text>
<circle cx="470.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="470.0" y="84.5" text-anchor="middle" fill="#222">2</text>
<circle cx="420.0" cy="130.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="420.0" y="134.5" text-anchor="middle" fill="#222">3</text>
<circle cx="370.0" cy="80.0" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="370.0" y="84.5" text-anchor="middle" fill="#222">4</text>
<text x="420" y="165" text-anchor="middle" fill="#222" font-size="12">1-3-2-4-1</text>
<text x="255" y="195" text-anchor="middle" fill="#222" font-size="12">K4: (4-1)!/2 = 3 different Hamiltonian cycles; reverse direction is the same cycle</text>
</svg>
