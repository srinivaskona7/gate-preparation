<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="sans-serif" font-size="13">
<title>Process count doubles only at the five even values of i, ending at 32 processes and 31 children</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="51" y="80" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">i = 0</text>
<text x="51" y="98" text-anchor="middle" fill="#222" font-size="11">fork()</text>
<text x="51" y="112" text-anchor="middle" fill="#222" font-size="11">1 to 2</text>
<text x="51" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">2</text>
<rect x="88" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="119" y="80" text-anchor="middle" fill="#222" font-size="12">i = 1</text>
<text x="119" y="98" text-anchor="middle" fill="#222" font-size="11">no fork</text>
<text x="119" y="112" text-anchor="middle" fill="#222" font-size="11">2 to 2</text>
<text x="119" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">2</text>
<rect x="156" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="187" y="80" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">i = 2</text>
<text x="187" y="98" text-anchor="middle" fill="#222" font-size="11">fork()</text>
<text x="187" y="112" text-anchor="middle" fill="#222" font-size="11">2 to 4</text>
<text x="187" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">4</text>
<rect x="224" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="255" y="80" text-anchor="middle" fill="#222" font-size="12">i = 3</text>
<text x="255" y="98" text-anchor="middle" fill="#222" font-size="11">no fork</text>
<text x="255" y="112" text-anchor="middle" fill="#222" font-size="11">4 to 4</text>
<text x="255" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">4</text>
<rect x="292" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="323" y="80" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">i = 4</text>
<text x="323" y="98" text-anchor="middle" fill="#222" font-size="11">fork()</text>
<text x="323" y="112" text-anchor="middle" fill="#222" font-size="11">4 to 8</text>
<text x="323" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">8</text>
<rect x="360" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="391" y="80" text-anchor="middle" fill="#222" font-size="12">i = 5</text>
<text x="391" y="98" text-anchor="middle" fill="#222" font-size="11">no fork</text>
<text x="391" y="112" text-anchor="middle" fill="#222" font-size="11">8 to 8</text>
<text x="391" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">8</text>
<rect x="428" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="459" y="80" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">i = 6</text>
<text x="459" y="98" text-anchor="middle" fill="#222" font-size="11">fork()</text>
<text x="459" y="112" text-anchor="middle" fill="#222" font-size="11">8 to 16</text>
<text x="459" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">16</text>
<rect x="496" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="527" y="80" text-anchor="middle" fill="#222" font-size="12">i = 7</text>
<text x="527" y="98" text-anchor="middle" fill="#222" font-size="11">no fork</text>
<text x="527" y="112" text-anchor="middle" fill="#222" font-size="11">16 to 16</text>
<text x="527" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">16</text>
<rect x="564" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="595" y="80" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">i = 8</text>
<text x="595" y="98" text-anchor="middle" fill="#222" font-size="11">fork()</text>
<text x="595" y="112" text-anchor="middle" fill="#222" font-size="11">16 to 32</text>
<text x="595" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">32</text>
<rect x="632" y="60" width="62" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="663" y="80" text-anchor="middle" fill="#222" font-size="12">i = 9</text>
<text x="663" y="98" text-anchor="middle" fill="#222" font-size="11">no fork</text>
<text x="663" y="112" text-anchor="middle" fill="#222" font-size="11">32 to 32</text>
<text x="663" y="150" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">32</text>
<text x="350" y="28" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Processes alive after each loop iteration (all of them execute the loop)</text>
<text x="10" y="154" text-anchor="start" fill="#222" font-size="11">count</text>
<text x="350" y="190" text-anchor="middle" fill="#222" font-size="12">Even i: 5 values (0, 2, 4, 6, 8), so 5 doublings: 1 x 2^5 = 32 processes.</text>
<text x="350" y="210" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Children = 32 - 1 = 31.</text>
</svg>
