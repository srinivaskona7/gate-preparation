<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif">
<title>Two calls of jumble: each works on copies, so only the assignments in main change x and y; the second call returns 26</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" fill="#222" font-size="12" text-anchor="start" font-weight="bold">Start of main: x = 2, y = 5. The parameters of jumble are copies, so its own x and y are separate boxes.</text>
<text x="20" y="56" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Call 1:  y = jumble(y, x)</text>
<text x="20" y="78" fill="#222" font-size="12" text-anchor="start">main before:</text>
<rect x="110" y="62" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="78.2" fill="#222" font-size="12" text-anchor="middle">x = 2</text>
<rect x="205" y="62" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="250.0" y="78.2" fill="#222" font-size="12" text-anchor="middle">y = 5</text>
<line x1="160" y1="90" x2="160" y2="118" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="170" y="108" fill="#222" font-size="11" text-anchor="start">values copied in</text>
<rect x="20" y="120" width="130" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="85.0" y="137.2" fill="#222" font-size="12" text-anchor="middle">param x = 5</text>
<rect x="160" y="120" width="130" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="225.0" y="137.2" fill="#222" font-size="12" text-anchor="middle">param y = 2</text>
<rect x="20" y="158" width="270" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="176.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">x = 2*x + y = 2*5 + 2 = 12</text>
<line x1="155" y1="190" x2="155" y2="214" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="165" y="208" fill="#222" font-size="11" text-anchor="start">return 12</text>
<rect x="20" y="218" width="270" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="235.2" fill="#222" font-size="12" text-anchor="middle">main assigns the result 12 to y</text>
<text x="20" y="266" fill="#222" font-size="12" text-anchor="start">main after:</text>
<rect x="110" y="250" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="155.0" y="266.2" fill="#222" font-size="12" text-anchor="middle">x = 2</text>
<rect x="205" y="250" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="250.0" y="266.2" fill="#222" font-size="12" text-anchor="middle">y = 12</text>
<text x="345" y="56" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Call 2:  x = jumble(y, x)</text>
<text x="345" y="78" fill="#222" font-size="12" text-anchor="start">main before:</text>
<rect x="435" y="62" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="480.0" y="78.2" fill="#222" font-size="12" text-anchor="middle">x = 2</text>
<rect x="530" y="62" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="575.0" y="78.2" fill="#222" font-size="12" text-anchor="middle">y = 12</text>
<line x1="485" y1="90" x2="485" y2="118" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="495" y="108" fill="#222" font-size="11" text-anchor="start">values copied in</text>
<rect x="345" y="120" width="130" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="410.0" y="137.2" fill="#222" font-size="12" text-anchor="middle">param x = 12</text>
<rect x="485" y="120" width="130" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="550.0" y="137.2" fill="#222" font-size="12" text-anchor="middle">param y = 2</text>
<rect x="345" y="158" width="270" height="28" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="480.0" y="176.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">x = 2*x + y = 2*12 + 2 = 26</text>
<line x1="480" y1="190" x2="480" y2="214" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="490" y="208" fill="#222" font-size="11" text-anchor="start">return 26</text>
<rect x="345" y="218" width="270" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="480.0" y="235.2" fill="#222" font-size="12" text-anchor="middle">main assigns the result 26 to x</text>
<text x="345" y="266" fill="#222" font-size="12" text-anchor="start">main after:</text>
<rect x="435" y="250" width="90" height="24" stroke="#222" stroke-width="3" fill="none"/>
<text x="480.0" y="266.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">x = 26</text>
<rect x="530" y="250" width="90" height="24" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="575.0" y="266.2" fill="#222" font-size="12" text-anchor="middle">y = 12</text>
<text x="20" y="306" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Call 2 uses the new y = 12 and the unchanged x = 2, so printf prints 26.</text>
</svg>
