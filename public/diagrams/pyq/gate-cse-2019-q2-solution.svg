<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 232" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Address pattern 11001 followed by 11 free bits gives the range C800 to CFFF</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">CS is 1 only when the five top address bits are 1 1 0 0 1; A10 to A0 are free</text><text x="10" y="62" fill="#1f2937" stroke="none" font-size="11">line</text><text x="10" y="98" fill="#1f2937" stroke="none" font-size="11">needed</text><text x="117" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A15</text><rect x="100" y="72" width="34" height="36" stroke-width="2.5"/><text x="117" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">1</text><text x="151" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A14</text><rect x="134" y="72" width="34" height="36" stroke-width="2.5"/><text x="151" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">1</text><text x="185" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A13</text><rect x="168" y="72" width="34" height="36" stroke-width="2.5"/><text x="185" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">0</text><text x="219" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A12</text><rect x="202" y="72" width="34" height="36" stroke-width="2.5"/><text x="219" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">0</text><text x="253" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A11</text><rect x="236" y="72" width="34" height="36" stroke-width="2.5"/><text x="253" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">1</text><text x="287" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A10</text><rect x="270" y="72" width="34" height="36" stroke-width="1"/><text x="287" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="321" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A9</text><rect x="304" y="72" width="34" height="36" stroke-width="1"/><text x="321" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="355" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A8</text><rect x="338" y="72" width="34" height="36" stroke-width="1"/><text x="355" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="389" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A7</text><rect x="372" y="72" width="34" height="36" stroke-width="1"/><text x="389" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="423" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A6</text><rect x="406" y="72" width="34" height="36" stroke-width="1"/><text x="423" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="457" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A5</text><rect x="440" y="72" width="34" height="36" stroke-width="1"/><text x="457" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="491" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A4</text><rect x="474" y="72" width="34" height="36" stroke-width="1"/><text x="491" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="525" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A3</text><rect x="508" y="72" width="34" height="36" stroke-width="1"/><text x="525" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="559" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A2</text><rect x="542" y="72" width="34" height="36" stroke-width="1"/><text x="559" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="593" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A1</text><rect x="576" y="72" width="34" height="36" stroke-width="1"/><text x="593" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><text x="627" y="62" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">A0</text><rect x="610" y="72" width="34" height="36" stroke-width="1"/><text x="627" y="96" fill="#1f2937" stroke="none" text-anchor="middle">x</text><line x1="270" y1="66" x2="270" y2="140" stroke-dasharray="5 3"/><text x="185" y="130" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">fixed: 11001</text><text x="457" y="130" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">11 free bits: 2^11 = 2048 addresses</text><text x="10" y="172" fill="#1f2937" stroke="none">Lowest : 1100 1000 0000 0000 = C800</text><text x="10" y="194" fill="#1f2937" stroke="none">Highest: 1100 1111 1111 1111 = CFFF</text><text x="10" y="218" fill="#1f2937" stroke="none" font-weight="bold">Range C800 to CFFF, option A. (B and C are only parts of this range; D has A12 = 1.)</text></svg>
