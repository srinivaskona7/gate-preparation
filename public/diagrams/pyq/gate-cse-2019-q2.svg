<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 232" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Five-input AND gate with inputs A15, A14, inverted A13, inverted A12 and A11 producing CS</title>
<text x="10" y="18" fill="#1f2937" stroke="none" font-weight="bold">Chip select logic: one 5-input AND gate, two inputs inverted</text><text x="120" y="54" fill="#1f2937" stroke="none" text-anchor="end">A15</text><line x1="130" y1="50" x2="240" y2="50"/><text x="120" y="82" fill="#1f2937" stroke="none" text-anchor="end">A14</text><line x1="130" y1="78" x2="240" y2="78"/><text x="120" y="110" fill="#1f2937" stroke="none" text-anchor="end">A13</text><line x1="130" y1="106" x2="225" y2="106"/><circle cx="232" cy="106" r="6"/><text x="120" y="138" fill="#1f2937" stroke="none" text-anchor="end">A12</text><line x1="130" y1="134" x2="225" y2="134"/><circle cx="232" cy="134" r="6"/><text x="120" y="166" fill="#1f2937" stroke="none" text-anchor="end">A11</text><line x1="130" y1="162" x2="240" y2="162"/><path d="M240,36 H300 A64,64 0 0 1 300,176 H240 Z"/><line x1="364" y1="106" x2="440" y2="106"/><text x="450" y="110" fill="#1f2937" stroke="none" font-weight="bold">CS</text><text x="20" y="205" fill="#1f2937" stroke="none" font-size="11">The small circles on A13 and A12 are inverters, so CS = A15 . A14 . (not A13) . (not A12) . A11.</text><text x="20" y="222" fill="#1f2937" stroke="none" font-size="11">The memory system has address lines A15 to A0.</text></svg>
