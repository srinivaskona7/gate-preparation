<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="sans-serif">
<title>Numbers 1 to 13 with their 4-bit values: 1 to 7 have most significant bit 0 (seven numbers) and 8 to 13 have it 1 (six numbers); same bit probability is (7 squared + 6 squared) over 169 = 85/169</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<rect x="30" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="53" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1</text>
<text x="53" y="112" text-anchor="middle" font-size="12" fill="#222">0001</text>
<rect x="76" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="99" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">2</text>
<text x="99" y="112" text-anchor="middle" font-size="12" fill="#222">0010</text>
<rect x="122" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="145" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3</text>
<text x="145" y="112" text-anchor="middle" font-size="12" fill="#222">0011</text>
<rect x="168" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="191" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">4</text>
<text x="191" y="112" text-anchor="middle" font-size="12" fill="#222">0100</text>
<rect x="214" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="237" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">5</text>
<text x="237" y="112" text-anchor="middle" font-size="12" fill="#222">0101</text>
<rect x="260" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="283" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">6</text>
<text x="283" y="112" text-anchor="middle" font-size="12" fill="#222">0110</text>
<rect x="306" y="60" width="46" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="329" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">7</text>
<text x="329" y="112" text-anchor="middle" font-size="12" fill="#222">0111</text>
<rect x="352" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="375" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">8</text>
<text x="375" y="112" text-anchor="middle" font-size="12" fill="#222">1000</text>
<rect x="398" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="421" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">9</text>
<text x="421" y="112" text-anchor="middle" font-size="12" fill="#222">1001</text>
<rect x="444" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="467" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">10</text>
<text x="467" y="112" text-anchor="middle" font-size="12" fill="#222">1010</text>
<rect x="490" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="513" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">11</text>
<text x="513" y="112" text-anchor="middle" font-size="12" fill="#222">1011</text>
<rect x="536" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="559" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">12</text>
<text x="559" y="112" text-anchor="middle" font-size="12" fill="#222">1100</text>
<rect x="582" y="60" width="46" height="70" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="605" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">13</text>
<text x="605" y="112" text-anchor="middle" font-size="12" fill="#222">1101</text>
<line x1="30" y1="150" x2="352" y2="150" stroke="#222" stroke-width="2"/>
<text x="191" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">MSB = 0: 7 numbers</text>
<line x1="352" y1="150" x2="628" y2="150" stroke="#b3261e" stroke-width="2"/>
<text x="490" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">MSB = 1: 6 numbers</text>
<text x="330" y="36" text-anchor="middle" font-size="12" font-style="italic" fill="#222">Each number is chosen with probability 1/13</text>
<text x="330" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">P(same MSB) = (7/13)^2 + (6/13)^2 = (49 + 36) / 169 = 85/169 = 0.503</text>
</svg>
