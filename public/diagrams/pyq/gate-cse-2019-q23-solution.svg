<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif" font-size="13">
<title>Two schedules of D = D + 20, D = D - 50, D = D + 10 starting from 100: the smallest result is 50 and the largest is 130</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="30" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Minimum, X = 50: P2 loads 100 first, the others run, P2 overwrites last</text>
<rect x="20" y="42" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="90.0" y="58.5" text-anchor="middle" fill="#222" font-size="11">P2 loads 100</text>
<text x="90.0" y="73.5" text-anchor="middle" fill="#222" font-size="11">D = 100</text>
<line x1="160.0" y1="62.0" x2="172.0" y2="62.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="172" y="42" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="242.0" y="58.5" text-anchor="middle" fill="#222" font-size="11">P1: 100 to 120</text>
<text x="242.0" y="73.5" text-anchor="middle" fill="#222" font-size="11">D = 120</text>
<line x1="312.0" y1="62.0" x2="324.0" y2="62.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="324" y="42" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="394.0" y="58.5" text-anchor="middle" fill="#222" font-size="11">P3: 120 to 130</text>
<text x="394.0" y="73.5" text-anchor="middle" fill="#222" font-size="11">D = 130</text>
<line x1="464.0" y1="62.0" x2="476.0" y2="62.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="476" y="42" width="140" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="546.0" y="58.5" text-anchor="middle" fill="#222" font-size="11">P2 stores 100-50</text>
<text x="546.0" y="73.5" text-anchor="middle" fill="#222" font-size="11">D = 50</text>
<text x="20" y="104" text-anchor="start" fill="#222" font-size="12">P1 and P3 are both lost.</text>
<text x="20" y="170" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Maximum, Y = 130: P2 loads 100, P3 loads 120 after P1, P2 stores 50, P3 stores last</text>
<rect x="20" y="182" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="90.0" y="198.5" text-anchor="middle" fill="#222" font-size="11">P2 loads 100</text>
<text x="90.0" y="213.5" text-anchor="middle" fill="#222" font-size="11">D = 100</text>
<line x1="160.0" y1="202.0" x2="172.0" y2="202.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="172" y="182" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="242.0" y="198.5" text-anchor="middle" fill="#222" font-size="11">P1: 100 to 120</text>
<text x="242.0" y="213.5" text-anchor="middle" fill="#222" font-size="11">D = 120</text>
<line x1="312.0" y1="202.0" x2="324.0" y2="202.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="324" y="182" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="394.0" y="198.5" text-anchor="middle" fill="#222" font-size="11">P3 loads 120</text>
<text x="394.0" y="213.5" text-anchor="middle" fill="#222" font-size="11">D = 120</text>
<line x1="464.0" y1="202.0" x2="476.0" y2="202.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="476" y="182" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="546.0" y="198.5" text-anchor="middle" fill="#222" font-size="11">P2 stores 50</text>
<text x="546.0" y="213.5" text-anchor="middle" fill="#222" font-size="11">D = 50</text>
<line x1="616.0" y1="202.0" x2="628.0" y2="202.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="628" y="182" width="140" height="40" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="698.0" y="198.5" text-anchor="middle" fill="#222" font-size="11">P3 stores 120+10</text>
<text x="698.0" y="213.5" text-anchor="middle" fill="#222" font-size="11">D = 130</text>
<text x="20" y="244" text-anchor="start" fill="#222" font-size="12">P2 is lost.</text>
<text x="20" y="300" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Y - X = 130 - 50 = 80.  Reachable values: 50, 60, 70, 80, 110, 120, 130.</text>
</svg>
