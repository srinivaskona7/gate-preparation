<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="sans-serif" font-size="13">
<title>Divide and conquer on the 14 element array: the crossing subarray indices 2 to 11 has the maximum sum 29</title>
<g stroke="#222" stroke-width="1.5" fill="none"><rect x="30" y="70" width="44" height="34"/><rect x="74" y="70" width="44" height="34"/><rect x="118" y="70" width="44" height="34"/><rect x="162" y="70" width="44" height="34"/><rect x="206" y="70" width="44" height="34"/><rect x="250" y="70" width="44" height="34"/><rect x="294" y="70" width="44" height="34"/><rect x="338" y="70" width="44" height="34"/><rect x="382" y="70" width="44" height="34"/><rect x="426" y="70" width="44" height="34"/><rect x="470" y="70" width="44" height="34"/><rect x="514" y="70" width="44" height="34"/><rect x="558" y="70" width="44" height="34"/><rect x="602" y="70" width="44" height="34"/></g><g fill="#222" text-anchor="middle"><text x="52" y="92">-5</text><text x="52" y="124" font-size="11">0</text><text x="96" y="92">-10</text><text x="96" y="124" font-size="11">1</text><text x="140" y="92">6</text><text x="140" y="124" font-size="11">2</text><text x="184" y="92">3</text><text x="184" y="124" font-size="11">3</text><text x="228" y="92">-1</text><text x="228" y="124" font-size="11">4</text><text x="272" y="92">-2</text><text x="272" y="124" font-size="11">5</text><text x="316" y="92">13</text><text x="316" y="124" font-size="11">6</text><text x="360" y="92">4</text><text x="360" y="124" font-size="11">7</text><text x="404" y="92">-9</text><text x="404" y="124" font-size="11">8</text><text x="448" y="92">-1</text><text x="448" y="124" font-size="11">9</text><text x="492" y="92">4</text><text x="492" y="124" font-size="11">10</text><text x="536" y="92">12</text><text x="536" y="124" font-size="11">11</text><text x="580" y="92">-3</text><text x="580" y="124" font-size="11">12</text><text x="624" y="92">0</text><text x="624" y="124" font-size="11">13</text></g><path d="M30 150 H338 M30 144 V156 M338 144 V156" stroke="#222" fill="none"/><path d="M338 150 H646 M646 144 V156" stroke="#222" fill="none"/><path d="M118 55 H558 M118 61 V49 M558 61 V49" stroke="#222" stroke-width="2.5" fill="none"/><g fill="#222"><text x="130" y="38">Best crossing subarray: indices 2 to 11, sum 29</text><text x="60" y="172">left half 0..6: best inside 19</text><text x="380" y="172">right half 7..13: best inside 16</text><text x="30" y="205">Crossing: best suffix of the left half = 6+3-1-2+13 = 19 (starts at index 2);</text><text x="30" y="227">best prefix of the right half = 4-9-1+4+12 = 10 (ends at index 11).</text><text x="30" y="252">Answer = max(19, 16, 19+10) = 29.</text></g>
</svg>
