<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="sans-serif">
<title>convert(6) calls convert(3), convert(1), convert(0), convert(0) and so on: n/2 never becomes negative, so the base case is never reached</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" fill="#222" font-size="12" text-anchor="start" font-weight="bold">Calls started by convert(6). Each box waits for the next call before its own printf.</text>
<rect x="20" y="50" width="108" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="74.0" y="71.2" fill="#222" font-size="12" text-anchor="middle">convert(6)</text>
<text x="74" y="104" fill="#222" font-size="11" text-anchor="middle">n/2 = 3</text>
<line x1="128" y1="67" x2="148" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="148" y="50" width="108" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="202.0" y="71.2" fill="#222" font-size="12" text-anchor="middle">convert(3)</text>
<text x="202" y="104" fill="#222" font-size="11" text-anchor="middle">n/2 = 1</text>
<line x1="256" y1="67" x2="276" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="276" y="50" width="108" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330.0" y="71.2" fill="#222" font-size="12" text-anchor="middle">convert(1)</text>
<text x="330" y="104" fill="#222" font-size="11" text-anchor="middle">n/2 = 0</text>
<line x1="384" y1="67" x2="404" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="404" y="50" width="108" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="458.0" y="71.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">convert(0)</text>
<text x="458" y="104" fill="#222" font-size="11" text-anchor="middle">n/2 = 0</text>
<line x1="512" y1="67" x2="532" y2="67" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="532" y="50" width="108" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="586.0" y="71.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">convert(0)</text>
<text x="586" y="104" fill="#222" font-size="11" text-anchor="middle">n/2 = 0</text>
<text x="655" y="72" fill="#222" font-size="18" text-anchor="middle" font-weight="bold">...</text>
<text x="20" y="140" fill="#222" font-size="12" text-anchor="start">Base case is n &lt; 0.  6, 3, 1, 0, 0, 0, ... are never negative, because integer division by 2 stops at 0.</text>
<text x="20" y="164" fill="#222" font-size="12" text-anchor="start">The printf(n%2) after each recursive call is never reached: every call is still waiting for convert(n/2) to return.</text>
<text x="20" y="188" fill="#222" font-size="12" text-anchor="start">The frames pile up until the stack overflows.  Nothing is printed and the function never terminates.</text>
<text x="20" y="226" fill="#222" font-size="13" text-anchor="start" font-weight="bold">Answer: (D) It will not print anything and will not terminate.</text>
</svg>
