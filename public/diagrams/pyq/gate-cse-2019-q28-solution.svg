<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="sans-serif" font-size="13">
<title>Last octet 0 to 11 split into /30 blocks of four addresses: M is in 0 to 3, N and P share 4 to 7</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="30" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Subnets of 100.10.5.x with mask 255.255.255.252 (block size 4)</text>
<text x="10" y="64" text-anchor="start" fill="#222" font-size="12">100.10.5.0/30 : 0 to 3</text>
<rect x="230.0" y="44" width="166.7" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">100.10.5.4/30 : 4 to 7</text>
<rect x="396.7" y="82" width="166.7" height="28" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="10" y="140" text-anchor="start" fill="#222" font-size="12">100.10.5.8/30 : 8 to 11</text>
<rect x="563.3" y="120" width="166.7" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="230.0" y1="40" x2="230.0" y2="158" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="230.0" y="172" text-anchor="middle" fill="#222" font-size="11">0</text>
<line x1="396.7" y1="40" x2="396.7" y2="158" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="396.7" y="172" text-anchor="middle" fill="#222" font-size="11">4</text>
<line x1="563.3" y1="40" x2="563.3" y2="158" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="563.3" y="172" text-anchor="middle" fill="#222" font-size="11">8</text>
<line x1="688.3" y1="40" x2="688.3" y2="158" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="688.3" y="172" text-anchor="middle" fill="#222" font-size="11">11</text>
<line x1="334.1" y1="36" x2="334.1" y2="160" stroke="#222" stroke-width="2.5"/>
<text x="334.1" y="188" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">M = .2</text>
<line x1="459.1" y1="36" x2="459.1" y2="160" stroke="#222" stroke-width="2.5"/>
<text x="459.1" y="188" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">N = .5</text>
<line x1="500.8" y1="36" x2="500.8" y2="160" stroke="#222" stroke-width="2.5"/>
<text x="500.8" y="188" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P = .6</text>
<text x="10" y="214" text-anchor="start" fill="#222" font-size="12">N and P fall in the same block (4 to 7); M is in 0 to 3. Only N and P share a subnet.</text>
</svg>
