<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif" fill="#1f2937"><title>A rightmost derivation read downward and the LR parser reductions read upward are the same list of rules in opposite orders</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<text x="20" y="24" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Grammar: E -&gt; E + T | T,  T -&gt; id.  Input: id + id</text>
<text x="20" y="52" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Rightmost derivation</text>
<text x="20" y="70" font-size="12" text-anchor="start" fill="#1f2937">rewrite the rightmost nonterminal, read downward</text>
<text x="437" y="52" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">LR parser</text>
<text x="437" y="70" font-size="12" text-anchor="start" fill="#1f2937">reduce the handle, read upward</text>
<rect x="250" y="90" width="160" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="111" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">E</text>
<rect x="250" y="146" width="160" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="167" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">E + T</text>
<rect x="250" y="202" width="160" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="223" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">E + id</text>
<rect x="250" y="258" width="160" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="279" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">T + id</text>
<rect x="250" y="314" width="160" height="30" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="335" font-size="14" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">id + id</text>
<line x1="235" y1="120" x2="235" y2="146" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="225" y="142" font-size="12" text-anchor="end" font-family="monospace" fill="#1f2937">E -&gt; E + T</text>
<line x1="425" y1="146" x2="425" y2="120" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="437" y="142" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">E -&gt; E + T</text>
<line x1="235" y1="176" x2="235" y2="202" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="225" y="198" font-size="12" text-anchor="end" font-family="monospace" fill="#1f2937">T -&gt; id</text>
<line x1="425" y1="202" x2="425" y2="176" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="437" y="198" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">T -&gt; id</text>
<line x1="235" y1="232" x2="235" y2="258" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="225" y="254" font-size="12" text-anchor="end" font-family="monospace" fill="#1f2937">E -&gt; T</text>
<line x1="425" y1="258" x2="425" y2="232" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="437" y="254" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">E -&gt; T</text>
<line x1="235" y1="288" x2="235" y2="314" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="225" y="310" font-size="12" text-anchor="end" font-family="monospace" fill="#1f2937">T -&gt; id</text>
<line x1="425" y1="314" x2="425" y2="288" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="437" y="310" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">T -&gt; id</text>
<text x="20" y="376" font-size="12" text-anchor="start" fill="#1f2937">Same four rules, opposite orders: the parser undoes a rightmost derivation.</text>
<text x="20" y="400" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Answer: (D) rightmost in reverse.</text>
</svg>
