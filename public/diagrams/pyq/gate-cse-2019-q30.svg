<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 170" width="500" height="170">
<title>Circuit: f1 AND f2 feeds an XOR gate together with f3, output f</title>
<g stroke="#1a1a1a" stroke-width="1.6" fill="none"><path d="M150,30 h35 a35,30 0 0 1 0,60 h-35 z"/><path d="M330,80 C361.5,80 386,86 400,110 C386,134 361.5,140 330,140 C347.5,122 347.5,98 330,80 Z"/><path d="M322,80 C341.9,98 341.9,122 322,140"/><polyline points="60,48 150,48"/><polyline points="60,72 150,72"/><polyline points="220,60 290,60 290,95 334,95"/><polyline points="60,140 300,140 300,125 334,125"/><polyline points="400,110 470,110"/></g><text x="40" y="52" font-size="13" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" >f1</text><text x="40" y="76" font-size="13" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" >f2</text><text x="40" y="144" font-size="13" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" >f3</text><text x="478" y="114" font-size="13" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">f</text><text x="168" y="66" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-size="12">AND</text><text x="348" y="114" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-size="12">XOR</text>
</svg>
