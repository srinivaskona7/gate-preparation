<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 458" font-family="sans-serif" font-size="13">
<title>Matching arcs for the strings of options C and B: in C the arcs between w and its reverse cross the arcs between the a block and the b block, in B they nest</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="14" fill="#222" font-weight="bold">(C)  w a^n w^R b^n  with w = abb, n = 2: s = abbaabbabb</text>
<text x="80" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="120" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="160" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="200" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="240" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="280" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="320" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="360" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="400" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="440" y="162" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<path d="M80,140 C80,36.39999999999999 360,36.39999999999999 360,140" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M120,140 C120,62.0 320,62.0 320,140" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M160,140 C160,87.6 280,87.6 280,140" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M200,140 C200,62.0 400,62.0 400,140" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M240,140 C240,62.0 440,62.0 440,140" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="500" y="110" text-anchor="start" font-size="12" fill="#222">solid: w matched with w^R</text>
<text x="500" y="130" text-anchor="start" font-size="12" fill="#222">dashed: a^n matched with b^n</text>
<text x="500" y="150" text-anchor="start" font-size="12" fill="#222">the two kinds of arc cross, so no</text>
<text x="500" y="168" text-anchor="start" font-size="12" fill="#222">single stack can follow both</text>
<text x="20" y="238" text-anchor="start" font-size="14" fill="#222" font-weight="bold">(B)  w a^n b^n w^R  with w = abb, n = 2: s = abbaabbbba</text>
<text x="80" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="120" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="160" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="200" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="240" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="280" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="320" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="360" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="400" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="440" y="372" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<path d="M80,350 C80,220.8 440,220.8 440,350" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M120,350 C120,246.39999999999998 400,246.39999999999998 400,350" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M160,350 C160,272.0 360,272.0 360,350" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M200,350 C200,297.6 320,297.6 320,350" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M240,350 C240,323.2 280,323.2 280,350" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="500" y="320" text-anchor="start" font-size="12" fill="#222">solid arcs enclose the dashed ones:</text>
<text x="500" y="340" text-anchor="start" font-size="12" fill="#222">fully nested, so a stack works</text>
<text x="20" y="420" text-anchor="start" font-size="12" fill="#222">Intersect (C) with the regular set a b+ a+ b+ a b+. What is left is { a b^p a^q b^p a b^n : n ≤ q, q - n even }:</text>
<text x="20" y="440" text-anchor="start" font-size="12" fill="#222">the two b^p blocks must match across a^q, while a^q must also match b^n. Pumping a b^N a^N b^N a b^N breaks both links.</text>
</svg>
