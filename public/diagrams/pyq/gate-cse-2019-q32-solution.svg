<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img">
<title>Decomposition of X into Y and Z in GATE CSE 2019 Q32</title>
<g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111" stroke="#111" stroke-width="1">
<rect x="20" y="20" width="760" height="50" fill="none" stroke-width="1"/>
<text x="400" y="42" font-size="14" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">X = (P, Q, R, S)     F = { QR to S,  R to P,  S to Q }</text>
<text x="400" y="60" font-size="12" text-anchor="middle" stroke="none" fill="#111">keys of X: QR and RS.  R to P has R not a superkey of X, so X is not in BCNF.</text>
<rect x="60" y="120" width="260" height="130" fill="none" stroke-width="1"/>
<text x="190" y="142" font-size="14" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">Y = (P, R)</text>
<text x="190" y="170" font-size="13" text-anchor="middle" stroke="none" fill="#111">holds R to P</text>
<text x="190" y="194" font-size="13" text-anchor="middle" stroke="none" fill="#111">key: R   (R+ = PR)</text>
<text x="190" y="218" font-size="13" text-anchor="middle" stroke="none" fill="#111">only FD has a key on the left: BCNF</text>
<text x="190" y="238" font-size="11" text-anchor="middle" stroke="none" fill="#111">(statement I needs both pieces BCNF)</text>
<rect x="480" y="120" width="260" height="130" fill="none" stroke-width="1"/>
<text x="610" y="142" font-size="14" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">Z = (Q, R, S)</text>
<text x="610" y="170" font-size="13" text-anchor="middle" stroke="none" fill="#111">holds QR to S and S to Q</text>
<text x="610" y="194" font-size="13" text-anchor="middle" stroke="none" fill="#111">keys: QR and RS</text>
<text x="610" y="218" font-size="13" text-anchor="middle" stroke="none" fill="#111">S to Q: S+ = SQ, not a key: NOT BCNF</text>
<text x="610" y="238" font-size="12" text-anchor="middle" stroke="none" fill="#111">so statement I is false</text>
<line x1="320" y1="185" x2="480" y2="185" stroke-width="2"/>
<text x="400" y="177" font-size="13" text-anchor="middle" stroke="none" fill="#111">common: R</text>
<text x="400" y="205" font-size="12" text-anchor="middle" stroke="none" fill="#111">R is a key of Y: lossless</text>
<rect x="60" y="290" width="680" height="70" fill="none" stroke-width="1" stroke-dasharray="5 3"/>
<text x="400" y="312" font-size="13" text-anchor="middle" stroke="none" fill="#111">Dependency preserving: R to P lives in Y; QR to S and S to Q live in Z.</text>
<text x="400" y="334" font-size="13" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">All three FDs are kept, so statement II is true. Answer: II only (C).</text>
<text x="400" y="352" font-size="12" text-anchor="middle" stroke="none" fill="#111"></text>
</g>
</svg>
