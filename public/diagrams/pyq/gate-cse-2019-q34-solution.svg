<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
<title>Four sets sorted by size: recursively enumerable languages and C programs are countable; all languages and non-regular languages are uncountable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="15" y="30" width="170" height="180" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="100" y="56" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">S1</text>
<text x="100" y="78" text-anchor="middle" fill="#222" font-size="12">RE languages</text>
<text x="100" y="112" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">countable</text>
<text x="100" y="145" text-anchor="middle" fill="#222" font-size="12">one machine per</text>
<text x="100" y="162" text-anchor="middle" fill="#222" font-size="12">language, machines</text>
<text x="100" y="179" text-anchor="middle" fill="#222" font-size="12">are finite strings</text>
<rect x="200" y="30" width="170" height="180" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="285" y="56" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">S2</text>
<text x="285" y="78" text-anchor="middle" fill="#222" font-size="12">valid C programs</text>
<text x="285" y="112" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">countable</text>
<text x="285" y="145" text-anchor="middle" fill="#222" font-size="12">each program is a</text>
<text x="285" y="162" text-anchor="middle" fill="#222" font-size="12">finite string over</text>
<text x="285" y="179" text-anchor="middle" fill="#222" font-size="12">a fixed alphabet</text>
<rect x="385" y="30" width="170" height="180" rx="8" fill="none" stroke="#222" stroke-width="2.8"/>
<text x="470" y="56" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">S3</text>
<text x="470" y="78" text-anchor="middle" fill="#222" font-size="12">all languages</text>
<text x="470" y="112" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">UNCOUNTABLE</text>
<text x="470" y="145" text-anchor="middle" fill="#222" font-size="12">Cantor diagonal:</text>
<text x="470" y="162" text-anchor="middle" fill="#222" font-size="12">subsets of {0,1}*</text>
<text x="470" y="179" text-anchor="middle" fill="#222" font-size="12">outnumber strings</text>
<rect x="570" y="30" width="170" height="180" rx="8" fill="none" stroke="#222" stroke-width="2.8"/>
<text x="655" y="56" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">S4</text>
<text x="655" y="78" text-anchor="middle" fill="#222" font-size="12">non-regular languages</text>
<text x="655" y="112" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">UNCOUNTABLE</text>
<text x="655" y="145" text-anchor="middle" fill="#222" font-size="12">all languages minus</text>
<text x="655" y="162" text-anchor="middle" fill="#222" font-size="12">countably many</text>
<text x="655" y="179" text-anchor="middle" fill="#222" font-size="12">regular ones</text>
<text x="380" y="245" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Uncountable sets: S3 and S4</text>
<text x="380" y="270" text-anchor="middle" fill="#222" font-size="13">Answer (B)</text>
</svg>
