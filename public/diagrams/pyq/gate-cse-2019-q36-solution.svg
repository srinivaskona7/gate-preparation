<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
<title>Parse tree of int a, b with the type flowing from T to L to L1 (GATE 2019 CS Q36)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<ellipse cx="280" cy="30" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="280" y="34.5" font-size="13" text-anchor="middle" fill="#222">D</text>
<ellipse cx="160" cy="110" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="160" y="114.5" font-size="13" text-anchor="middle" fill="#222">T</text>
<ellipse cx="400" cy="110" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="400" y="114.5" font-size="13" text-anchor="middle" fill="#222">L</text>
<ellipse cx="160" cy="190" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="160" y="194.5" font-size="13" text-anchor="middle" fill="#222">int</text>
<ellipse cx="300" cy="190" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="194.5" font-size="13" text-anchor="middle" fill="#222">L1</text>
<ellipse cx="400" cy="190" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="400" y="194.5" font-size="13" text-anchor="middle" fill="#222">,</text>
<ellipse cx="500" cy="190" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500" y="194.5" font-size="13" text-anchor="middle" fill="#222">id b</text>
<ellipse cx="300" cy="270" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="274.5" font-size="13" text-anchor="middle" fill="#222">id a</text>
<line x1="280" y1="46" x2="160" y2="94" stroke="#222" stroke-width="1.5"/>
<line x1="280" y1="46" x2="400" y2="94" stroke="#222" stroke-width="1.5"/>
<line x1="160" y1="126" x2="160" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="400" y1="126" x2="300" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="400" y1="126" x2="400" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="400" y1="126" x2="500" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="300" y1="206" x2="300" y2="254" stroke="#222" stroke-width="1.5"/>
<path d="M198,104 C260,70 320,70 366,102" fill="none" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
<text x="282" y="128" font-size="12" text-anchor="middle" fill="#b3261e">L.type = T.type</text>
<path d="M372,122 C350,138 340,150 330,174" fill="none" stroke="#b3261e" stroke-width="1.5" marker-end="url(#r)"/>
<text x="326" y="156" font-size="12" text-anchor="end" fill="#b3261e">L1.type = L.type</text>
<text x="20" y="318" font-size="12" text-anchor="start" fill="#222">The type moves left to right (T to L) and top to bottom (L to L1): both are inherited.</text>
<text x="20" y="342" font-size="12" text-anchor="start" fill="#b3261e" font-weight="bold">X1 = L, X2 = T, X3 = L1, X4 = L</text>
