<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 322" font-family="sans-serif" font-size="13" fill="#1f2937"><title>n arrays each reduced to a median in linear time, then one more median over the n medians: total order n squared</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<rect x="26" y="30" width="88" height="36" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="70" y="46" text-anchor="middle" font-weight="bold">A1</text>
<text x="70" y="60" text-anchor="middle" font-size="10">n elements</text>
<line x1="70" y1="68" x2="70" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="76" y="92" text-anchor="start" font-size="11">O(n)</text>
<rect x="42" y="112" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="70" y="131" text-anchor="middle">m1</text>
<line x1="70" y1="142" x2="70" y2="178" stroke="#1f2937" stroke-width="1.2"/>
<rect x="146" y="30" width="88" height="36" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="190" y="46" text-anchor="middle" font-weight="bold">A2</text>
<text x="190" y="60" text-anchor="middle" font-size="10">n elements</text>
<line x1="190" y1="68" x2="190" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="196" y="92" text-anchor="start" font-size="11">O(n)</text>
<rect x="162" y="112" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="190" y="131" text-anchor="middle">m2</text>
<line x1="190" y1="142" x2="190" y2="178" stroke="#1f2937" stroke-width="1.2"/>
<rect x="266" y="30" width="88" height="36" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="310" y="46" text-anchor="middle" font-weight="bold">A3</text>
<text x="310" y="60" text-anchor="middle" font-size="10">n elements</text>
<line x1="310" y1="68" x2="310" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="316" y="92" text-anchor="start" font-size="11">O(n)</text>
<rect x="282" y="112" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="310" y="131" text-anchor="middle">m3</text>
<line x1="310" y1="142" x2="310" y2="178" stroke="#1f2937" stroke-width="1.2"/>
<text x="425" y="52" text-anchor="middle" font-size="18">...</text>
<rect x="496" y="30" width="88" height="36" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="540" y="46" text-anchor="middle" font-weight="bold">An</text>
<text x="540" y="60" text-anchor="middle" font-size="10">n elements</text>
<line x1="540" y1="68" x2="540" y2="108" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="546" y="92" text-anchor="start" font-size="11">O(n)</text>
<rect x="512" y="112" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="540" y="131" text-anchor="middle">mn</text>
<line x1="540" y1="142" x2="540" y2="178" stroke="#1f2937" stroke-width="1.2"/>
<line x1="70" y1="178" x2="540" y2="178" stroke="#1f2937" stroke-width="1.2"/>
<line x1="305" y1="178" x2="305" y2="194" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="205" y="196" width="200" height="32" rx="3" stroke="#1f2937" stroke-width="2" fill="none"/>
<text x="305" y="217" text-anchor="middle">median of m1, ..., mn: O(n)</text>
<text x="12" y="262" text-anchor="start">n medians, each found in O(n) by linear-time selection: n x O(n) = O(n^2).</text>
<text x="12" y="284" text-anchor="start" font-weight="bold">One more selection on n numbers adds O(n). The total is O(n^2).</text>
<text x="12" y="306" text-anchor="start">Each of the n arrays needs a pass over its n elements, so Omega(n^2) too.</text>
</svg>
