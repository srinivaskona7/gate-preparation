<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="sans-serif" font-size="13">
<title>Number line of freed instances: p and q release Xp + Xq, and another process can finish only if its extra request Yk is at most that sum</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">All instances are in use, so nothing is free until p and q (which need no more) finish.</text>
<rect x="40" y="50" width="140" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="72.0" text-anchor="middle" fill="#222" font-size="12">Xp</text>
<rect x="180" y="50" width="100" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="230.0" y="72.0" text-anchor="middle" fill="#222" font-size="12">Xq</text>
<text x="40" y="118" text-anchor="start" fill="#222" font-size="12">0</text>
<text x="280" y="140" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Xp + Xq</text>
<line x1="40.0" y1="98.0" x2="680.0" y2="98.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="280.0" y1="40.0" x2="280.0" y2="126.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="380" cy="98" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="380" y="120" text-anchor="middle" fill="#222" font-size="11">Y of k1</text>
<circle cx="480" cy="98" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="480" y="120" text-anchor="middle" fill="#222" font-size="11">Y of k2</text>
<circle cx="590" cy="98" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="590" y="120" text-anchor="middle" fill="#222" font-size="11">Y of k3</text>
<text x="20" y="170" text-anchor="start" fill="#222" font-size="12">Every other Yk lies to the right of Xp + Xq: none of them can be satisfied, so no other process finishes.</text>
<text x="20" y="194" text-anchor="start" fill="#222" font-size="12">If one Yk were at or left of Xp + Xq, that process would finish. So the condition is Xp + Xq &lt; min Yk (option A).</text>
<text x="20" y="228" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Correct: A</text>
</svg>
