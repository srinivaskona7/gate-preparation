<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="sans-serif" font-size="13">
<title>Max-heap with root 50, children 30 and 40, then 10, 20, 35, 25: the smallest value 10 is at a leaf and the second largest 40 is a child of the root; statements I, II and III are true and IV is false</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="215.1" y1="44.2" x2="124.9" y2="93.8" stroke="#222" stroke-width="1.6"/>
<line x1="98.6" y1="114.6" x2="61.4" y2="155.4" stroke="#222" stroke-width="1.6"/>
<line x1="121.4" y1="114.6" x2="158.6" y2="155.4" stroke="#222" stroke-width="1.6"/>
<line x1="244.9" y1="44.2" x2="335.1" y2="93.8" stroke="#222" stroke-width="1.6"/>
<line x1="338.6" y1="114.6" x2="301.4" y2="155.4" stroke="#222" stroke-width="1.6"/>
<line x1="361.4" y1="114.6" x2="398.6" y2="155.4" stroke="#222" stroke-width="1.6"/>
<circle cx="230" cy="36" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="230" y="40.42" text-anchor="middle" fill="#222" font-size="13">50</text>
<circle cx="110" cy="102" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="110" y="106.42" text-anchor="middle" fill="#222" font-size="13">30</text>
<circle cx="50" cy="168" r="17" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="50" y="172.42" text-anchor="middle" fill="#222" font-size="13">10</text>
<circle cx="170" cy="168" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="170" y="172.42" text-anchor="middle" fill="#222" font-size="13">20</text>
<circle cx="350" cy="102" r="17" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="350" y="106.42" text-anchor="middle" fill="#222" font-size="13">40</text>
<circle cx="290" cy="168" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="290" y="172.42" text-anchor="middle" fill="#222" font-size="13">35</text>
<circle cx="410" cy="168" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="410" y="172.42" text-anchor="middle" fill="#222" font-size="13">25</text>
<text x="370" y="260" text-anchor="middle" fill="#222" font-size="12">I: the smallest (10, thick) is a leaf.   II: the second largest (40, thick) is a child of the root.</text>
<text x="370" y="284" text-anchor="middle" fill="#222" font-size="12">III: BST to max-heap in Theta(n): inorder gives ascending order, reverse it.</text>
<text x="370" y="308" text-anchor="middle" fill="#222" font-size="12">IV: heap to BST in Theta(n) would sort in o(n log n) comparisons: impossible.</text>
<text x="370" y="330" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">True: I, II, III   (option A)</text>
</svg>
