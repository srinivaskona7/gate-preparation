<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 438 194" font-family="sans-serif" font-size="13">
<title>SRTF Gantt chart with Z = 2: P1 0 to 1, P2 1 to 2, P1 2 to 4, P4 4 to 6, P3 6 to 9</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="30" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">SRTF with Z = 2</text>
<text x="30" y="44" text-anchor="middle" fill="#222" font-size="11">P1</text>
<path d="M30,48 L30,74" stroke="#222" stroke-width="1" marker-end="url(#ah)" fill="none"/>
<text x="72" y="44" text-anchor="middle" fill="#222" font-size="11">P2</text>
<path d="M72,48 L72,74" stroke="#222" stroke-width="1" marker-end="url(#ah)" fill="none"/>
<text x="156" y="44" text-anchor="middle" fill="#222" font-size="11">P3</text>
<path d="M156,48 L156,74" stroke="#222" stroke-width="1" marker-end="url(#ah)" fill="none"/>
<text x="198" y="44" text-anchor="middle" fill="#222" font-size="11">P4</text>
<path d="M198,48 L198,74" stroke="#222" stroke-width="1" marker-end="url(#ah)" fill="none"/>
<rect x="30" y="78" width="42" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="51" y="100" text-anchor="middle" fill="#222" font-size="13">P1</text>
<rect x="72" y="78" width="42" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="93" y="100" text-anchor="middle" fill="#222" font-size="13">P2</text>
<rect x="114" y="78" width="84" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="156" y="100" text-anchor="middle" fill="#222" font-size="13">P1</text>
<rect x="198" y="78" width="84" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="240" y="100" text-anchor="middle" fill="#222" font-size="13">P4</text>
<rect x="282" y="78" width="126" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="345" y="100" text-anchor="middle" fill="#222" font-size="13">P3</text>
<path d="M30,112 L30,119" stroke="#222" stroke-width="1"/>
<text x="30" y="133" text-anchor="middle" fill="#222" font-size="11">0</text>
<path d="M72,112 L72,119" stroke="#222" stroke-width="1"/>
<text x="72" y="133" text-anchor="middle" fill="#222" font-size="11">1</text>
<path d="M114,112 L114,119" stroke="#222" stroke-width="1"/>
<text x="114" y="133" text-anchor="middle" fill="#222" font-size="11">2</text>
<path d="M198,112 L198,119" stroke="#222" stroke-width="1"/>
<text x="198" y="133" text-anchor="middle" fill="#222" font-size="11">4</text>
<path d="M282,112 L282,119" stroke="#222" stroke-width="1"/>
<text x="282" y="133" text-anchor="middle" fill="#222" font-size="11">6</text>
<path d="M408,112 L408,119" stroke="#222" stroke-width="1"/>
<text x="408" y="133" text-anchor="middle" fill="#222" font-size="11">9</text>
<text x="30" y="154" text-anchor="start" fill="#222" font-size="12">Waiting times: P1 1, P2 0, P3 3, P4 0. Sum 4, mean 1</text>
<text x="30" y="171" text-anchor="start" fill="#222" font-size="12">For Z = 2 the mean is 1, and no other Z gives 1.</text>
</svg>
