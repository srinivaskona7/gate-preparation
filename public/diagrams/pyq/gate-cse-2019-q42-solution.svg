<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Inode with 12 direct, one single-indirect and one double-indirect pointer: 1024 addresses per 4 kB index block, 1049612 data blocks, about 4.0 GB</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<g fill="none" stroke-width="1.5">
<rect x="10" y="30" width="130" height="102"/><path d="M10 64 H140 M10 98 H140"/>
<rect x="260" y="30" width="130" height="34"/>
<rect x="260" y="81" width="110" height="34"/><rect x="450" y="81" width="150" height="34"/>
<rect x="260" y="132" width="110" height="34"/><rect x="450" y="132" width="150" height="34"/><rect x="450" y="190" width="150" height="34"/>
<path d="M140 47 H260" marker-end="url(#a)"/><path d="M140 81 H200 V98 H260" marker-end="url(#a)"/><path d="M140 115 H210 V149 H260" marker-end="url(#a)"/>
<path d="M370 98 H450" marker-end="url(#a)"/><path d="M370 149 H450" marker-end="url(#a)"/><path d="M525 166 V190" marker-end="url(#a)"/>
</g>
<g stroke="none">
<text x="14" y="22" font-weight="bold">inode</text>
<text x="20" y="52">12 direct</text><text x="20" y="86">single-indirect</text><text x="20" y="120">double-indirect</text>
<text x="272" y="52">12 data blocks</text>
<text x="268" y="103">index block</text><text x="458" y="103">1024 data blocks</text>
<text x="268" y="154">index block</text><text x="458" y="154">1024 index blocks</text>
<text x="458" y="212">1024 data each</text><text x="458" y="242">= 1024^2 data blocks</text>
<text x="10" y="258">N = 4096 / 4 = 1024 addresses per block</text>
<text x="10" y="278">blocks = 12 + 1024 + 1024^2 = 1,049,612</text>
<text x="10" y="298">size = 1,049,612 x 4096 B = 4,299,210,752 B</text>
<text x="10" y="322" font-weight="bold">4,299,210,752 / 2^30 = 4.004 GB, which is 4.0</text>
</g>
</svg>
