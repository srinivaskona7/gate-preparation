<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" font-family="sans-serif" fill="#1f2937"><title>LR(0) state I0 and GOTO(I0, &lt;) with its 5 items: the kernel item S to &lt; dot L &gt; plus four closure items</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="230" height="120" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I0</text>
<line x1="10" y1="34" x2="240" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="54" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S' -&gt; .S</text>
<text x="20" y="72" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .&lt;L&gt;</text>
<text x="20" y="90" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .id</text>
<line x1="246" y1="70" x2="316" y2="70" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="281" y="62" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">&lt;</text>
<rect x="322" y="10" width="280" height="132" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="330" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">GOTO(I0, &lt;)</text>
<line x1="322" y1="34" x2="602" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="332" y="54" font-size="12" text-anchor="start" font-weight="bold" font-family="monospace" fill="#1f2937">S -&gt; &lt;.L&gt;</text>
<text x="332" y="72" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">L -&gt; .L,S</text>
<text x="332" y="90" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">L -&gt; .S</text>
<text x="332" y="108" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .&lt;L&gt;</text>
<text x="332" y="126" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .id</text>
<text x="450" y="54" font-size="11" text-anchor="start" font-style="italic" fill="#1f2937">kernel: dot moved over &lt;</text>
<text x="450" y="72" font-size="11" text-anchor="start" font-style="italic" fill="#1f2937">closure of L: 2 items</text>
<text x="450" y="108" font-size="11" text-anchor="start" font-style="italic" fill="#1f2937">closure of S: 2 items</text>
<text x="10" y="176" font-size="12" text-anchor="start" fill="#1f2937">Only S -&gt; .&lt;L&gt; in I0 has &lt; after the dot. Move it, then close: the dot stands before L, so add both L-rules;</text>
<text x="10" y="194" font-size="12" text-anchor="start" fill="#1f2937">L -&gt; .S puts the dot before S, so add both S-rules.   1 kernel + 4 closure = 5 items.</text>
</svg>
