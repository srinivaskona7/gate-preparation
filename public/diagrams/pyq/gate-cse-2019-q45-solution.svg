<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 186" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Timeline of a cache miss: 1 address cycle, 3 fetch cycles and 8 transfer cycles, 12 in all</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">One block read: 8 words x 4 bytes = 32 bytes, 12 clock cycles at 60 MHz</text><text x="52.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">1</text><text x="97.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">2</text><text x="142.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">3</text><text x="187.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">4</text><text x="232.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">5</text><text x="277.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">6</text><text x="322.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">7</text><text x="367.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">8</text><text x="412.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">9</text><text x="457.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">10</text><text x="502.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">11</text><text x="547.5" y="52" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">12</text><rect x="30" y="60" width="45" height="36" stroke-width="2.5"/><text x="52.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">addr</text><rect x="75" y="60" width="135" height="36" stroke-width="2.5"/><text x="142.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">fetch all 8 words</text><rect x="210" y="60" width="45" height="36" stroke-width="2.5"/><text x="232.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w1</text><rect x="255" y="60" width="45" height="36" stroke-width="2.5"/><text x="277.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w2</text><rect x="300" y="60" width="45" height="36" stroke-width="2.5"/><text x="322.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w3</text><rect x="345" y="60" width="45" height="36" stroke-width="2.5"/><text x="367.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w4</text><rect x="390" y="60" width="45" height="36" stroke-width="2.5"/><text x="412.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w5</text><rect x="435" y="60" width="45" height="36" stroke-width="2.5"/><text x="457.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w6</text><rect x="480" y="60" width="45" height="36" stroke-width="2.5"/><text x="502.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w7</text><rect x="525" y="60" width="45" height="36" stroke-width="2.5"/><text x="547.5" y="83" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">w8</text><text x="390" y="118" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">transmit: 1 word per cycle, 8 cycles</text><text x="10" y="150" fill="#1f2937" stroke="none">Cycles = 1 + 3 + 8 = 12.  Time = 12 / 60 MHz = 0.2 microsecond.</text><text x="10" y="172" fill="#1f2937" stroke="none" font-weight="bold">Bandwidth = 32 bytes / 0.2 microsecond = 160 x 10^6 bytes per second.</text></svg>
