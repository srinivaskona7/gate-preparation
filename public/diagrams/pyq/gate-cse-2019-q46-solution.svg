<text x="380" y="300" text-anchor="middle" fill="#222" font-size="12">Distance from L1: sibling 2, next two leaves 4, last four leaves 6.</text>
<text x="380" y="322" text-anchor="middle" fill="#222" font-size="12">Sum over the 8 choices of b = 0 + 2 + 2*4 + 4*6 = 34, the same for every a.</text>
<text x="380" y="352" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">E = 34 / 8 = 4.25</text>
<text x="380" y="376" text-anchor="middle" fill="#222" font-size="12">a and b are independent, so b = a (distance 0) is allowed, each of the 8 leaves has probability 1/8.</text>
