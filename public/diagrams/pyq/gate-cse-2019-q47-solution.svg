<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="sans-serif">
<title>Number line for Y uniform on 1 to 6: real roots need Y at least 2 or at most minus 1, so only Y from 2 to 6 works, length 4 out of 5, probability 0.8</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<line x1="40" y1="120" x2="620" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="50" y1="115" x2="50" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="50" y="142" text-anchor="middle" font-size="12" fill="#222">-1</text>
<line x1="120" y1="115" x2="120" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="120" y="142" text-anchor="middle" font-size="12" fill="#222">0</text>
<line x1="190" y1="115" x2="190" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="190" y="142" text-anchor="middle" font-size="12" fill="#222">1</text>
<line x1="260" y1="115" x2="260" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="260" y="142" text-anchor="middle" font-size="12" fill="#222">2</text>
<line x1="330" y1="115" x2="330" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="330" y="142" text-anchor="middle" font-size="12" fill="#222">3</text>
<line x1="400" y1="115" x2="400" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="400" y="142" text-anchor="middle" font-size="12" fill="#222">4</text>
<line x1="470" y1="115" x2="470" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="470" y="142" text-anchor="middle" font-size="12" fill="#222">5</text>
<line x1="540" y1="115" x2="540" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="540" y="142" text-anchor="middle" font-size="12" fill="#222">6</text>
<line x1="610" y1="115" x2="610" y2="125" stroke="#222" stroke-width="1.5"/>
<text x="610" y="142" text-anchor="middle" font-size="12" fill="#222">7</text>
<text x="636" y="142" text-anchor="middle" font-size="12" font-style="italic" fill="#222">Y</text>
<rect x="190" y="80" width="350" height="30" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="260" y="80" width="280" height="30" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="0"/>
<rect x="190" y="80" width="350" height="30" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<line x1="260" y1="76" x2="260" y2="125" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="225" y="100" text-anchor="middle" font-size="12" fill="#222">no</text>
<text x="400" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">real roots</text>
<text x="225" y="66" text-anchor="middle" font-size="11" fill="#222">length 1</text>
<text x="400" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">length 4</text>
<text x="40" y="82" text-anchor="start" font-size="11" fill="#222">Y &lt;= -1 also works</text>
<text x="40" y="96" text-anchor="start" font-size="11" font-style="italic" fill="#222">(outside the interval)</text>
<text x="300" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Discriminant 36Y^2 - 36Y - 72 &gt;= 0  &lt;=&gt;  (Y - 2)(Y + 1) &gt;= 0</text>
<text x="300" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">P = 4 / 5 = 0.8</text>
</svg>
