<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
<title>Three 8-port switches in a chain connect 15 machines</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="40" y="100" width="140" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110" y="130" font-size="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Switch 1</text>
<text x="110" y="172" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">7 machines</text>
<line x1="70" y1="100" x2="70" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="64" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="110" y1="100" x2="110" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="104" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="150" y1="100" x2="150" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="144" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="110" y="44" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">7 machines on 7 ports</text>
<rect x="250" y="100" width="140" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="320" y="130" font-size="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Switch 2</text>
<text x="320" y="172" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">6 machines</text>
<line x1="280" y1="100" x2="280" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="274" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="320" y1="100" x2="320" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="314" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="360" y1="100" x2="360" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="354" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="320" y="44" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">6 machines on 6 ports</text>
<rect x="460" y="100" width="140" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="530" y="130" font-size="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Switch 3</text>
<text x="530" y="172" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">2 machines</text>
<line x1="490" y1="100" x2="490" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="484" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="530" y1="100" x2="530" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="524" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="570" y1="100" x2="570" y2="70" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="564" y="56" width="12" height="14" rx="0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="530" y="44" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">2 machines on 2 ports</text>
<line x1="180" y1="125" x2="250" y2="125" stroke="#1a1a1a" stroke-width="3"/>
<line x1="390" y1="125" x2="460" y2="125" stroke="#1a1a1a" stroke-width="3"/>
<text x="215" y="115" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">link</text>
<text x="425" y="115" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">link</text>
<text x="320" y="215" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Ports used: 7+1, 6+2, 2+1 = 19 of 24.   Machines: 7 + 6 + 2 = 15.</text>
<text x="320" y="238" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Two switches give 16 ports - 2 for the link = 14 machines, one short.</text>
</svg>
