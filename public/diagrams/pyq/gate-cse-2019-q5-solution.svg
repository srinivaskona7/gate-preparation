<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 269" font-family="sans-serif" font-size="13">
<title>For n=3 the 7 non-empty subsets of U grouped by size, with the number of pairs (x,X) each group gives: 3, 6 and 3, total 12 = 3 times 2 squared</title>
<text x="200" y="20" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">n = 3, U = {1,2,3}: subsets X grouped by size</text>
<text x="20" y="54" text-anchor="start" fill="#222" font-size="12">|X| = 1</text>
<rect x="110" y="34" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="149" y="52" text-anchor="middle" fill="#222" font-size="12">{1}</text>
<rect x="198" y="34" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="237" y="52" text-anchor="middle" fill="#222" font-size="12">{2}</text>
<rect x="286" y="34" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="325" y="52" text-anchor="middle" fill="#222" font-size="12">{3}</text>
<text x="20" y="74" text-anchor="start" fill="#222" font-size="11">1 x 3 subsets = 3 pairs</text>
<text x="20" y="112" text-anchor="start" fill="#222" font-size="12">|X| = 2</text>
<rect x="110" y="92" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="149" y="110" text-anchor="middle" fill="#222" font-size="12">{1,2}</text>
<rect x="198" y="92" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="237" y="110" text-anchor="middle" fill="#222" font-size="12">{1,3}</text>
<rect x="286" y="92" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="325" y="110" text-anchor="middle" fill="#222" font-size="12">{2,3}</text>
<text x="20" y="132" text-anchor="start" fill="#222" font-size="11">2 x 3 subsets = 6 pairs</text>
<text x="20" y="170" text-anchor="start" fill="#222" font-size="12">|X| = 3</text>
<rect x="110" y="150" width="78" height="26" rx="5" fill="none" stroke="#222" stroke-width="1.4"/><text x="149" y="168" text-anchor="middle" fill="#222" font-size="12">{1,2,3}</text>
<text x="20" y="190" text-anchor="start" fill="#222" font-size="11">3 x 1 subsets = 3 pairs</text>
<text x="200" y="228" text-anchor="middle" fill="#222" font-size="12">each subset of size k holds k choices of x</text>
<text x="200" y="252" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">3 + 6 + 3 = 12 = 3 x 2^2 = n 2^(n-1)</text>
</svg>
