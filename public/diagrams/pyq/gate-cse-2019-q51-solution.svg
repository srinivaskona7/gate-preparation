<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif" font-size="13">
<title>Cross product of 5 students with 5 Performance rows above 84 gives 5 groups of sum 452</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="13" font-weight="bold">No join condition: every student pairs with every kept Performance row</text>
<text x="80" y="50" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Student</text>
<text x="450" y="50" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Performance with Marks > 84</text>
<rect x="30" y="60" width="100" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="77" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Amit</text>
<rect x="30" y="90" width="100" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="107" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Priya</text>
<rect x="30" y="120" width="100" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="137" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Vinit</text>
<rect x="30" y="150" width="100" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="167" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Rohan</text>
<rect x="30" y="180" width="100" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="197" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Smita</text>
<rect x="380" y="60" width="140" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="77" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">(1,A)  86</text>
<rect x="380" y="90" width="140" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="107" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">(1,B)  95</text>
<rect x="380" y="120" width="140" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="137" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">(1,C)  90</text>
<rect x="380" y="150" width="140" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="167" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">(2,A)  89</text>
<rect x="380" y="180" width="140" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="450" y="197" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">(2,C)  92</text>
<rect x="200" y="75" width="110" height="105" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="255" y="125" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">every pair</text>
<text x="255" y="142" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">5 x 5 = 25</text>
<line x1="130" y1="100" x2="200" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="310" y1="120" x2="380" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="220" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Group by name: 5 groups, each sum = 86+95+90+89+92 = 452. Rows returned: 5</text>
</svg>
