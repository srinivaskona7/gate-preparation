<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif">
<title>Array 2 4 6 8 10 with b at index 4; the term (*b - i) - *(b - i) equals i for each i, so the sum is 0+1+2+3+4 = 10</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="75" y="24" fill="#222" font-size="11" text-anchor="middle">a[0]</text>
<rect x="40" y="30" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="75.0" y="51.9" fill="#222" font-size="14" text-anchor="middle">2</text>
<text x="145" y="24" fill="#222" font-size="11" text-anchor="middle">a[1]</text>
<rect x="110" y="30" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="145.0" y="51.9" fill="#222" font-size="14" text-anchor="middle">4</text>
<text x="215" y="24" fill="#222" font-size="11" text-anchor="middle">a[2]</text>
<rect x="180" y="30" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="215.0" y="51.9" fill="#222" font-size="14" text-anchor="middle">6</text>
<text x="285" y="24" fill="#222" font-size="11" text-anchor="middle">a[3]</text>
<rect x="250" y="30" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="285.0" y="51.9" fill="#222" font-size="14" text-anchor="middle">8</text>
<text x="355" y="24" fill="#222" font-size="11" text-anchor="middle">a[4]</text>
<rect x="320" y="30" width="70" height="34" stroke="#222" stroke-width="3" fill="none"/>
<text x="355.0" y="51.9" fill="#222" font-size="14" text-anchor="middle" font-weight="bold">10</text>
<line x1="355" y1="100" x2="355" y2="68" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="355" y="116" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">b = a + 4</text>
<text x="400" y="48" fill="#222" font-size="12" text-anchor="start">*b is 10, an int value.  So *b - i is 10 - i,</text>
<text x="400" y="66" fill="#222" font-size="12" text-anchor="start">while *(b - i) moves the pointer back i places.</text>
<rect x="20" y="130" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="147.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">i</text>
<rect x="80" y="130" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="147.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">*b - i</text>
<rect x="190" y="130" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="147.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">b - i points at</text>
<rect x="350" y="130" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="147.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">*(b - i)</text>
<rect x="460" y="130" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="147.2" fill="#222" font-size="12" text-anchor="middle" font-weight="bold">term</text>
<rect x="20" y="156" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="173.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="80" y="156" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="173.2" fill="#222" font-size="12" text-anchor="middle">10</text>
<rect x="190" y="156" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="173.2" fill="#222" font-size="12" text-anchor="middle">a[4]</text>
<rect x="350" y="156" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="173.2" fill="#222" font-size="12" text-anchor="middle">10</text>
<rect x="460" y="156" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="173.2" fill="#222" font-size="12" text-anchor="middle">0</text>
<rect x="20" y="182" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="199.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="80" y="182" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="199.2" fill="#222" font-size="12" text-anchor="middle">9</text>
<rect x="190" y="182" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="199.2" fill="#222" font-size="12" text-anchor="middle">a[3]</text>
<rect x="350" y="182" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="199.2" fill="#222" font-size="12" text-anchor="middle">8</text>
<rect x="460" y="182" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="199.2" fill="#222" font-size="12" text-anchor="middle">1</text>
<rect x="20" y="208" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="225.2" fill="#222" font-size="12" text-anchor="middle">2</text>
<rect x="80" y="208" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="225.2" fill="#222" font-size="12" text-anchor="middle">8</text>
<rect x="190" y="208" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="225.2" fill="#222" font-size="12" text-anchor="middle">a[2]</text>
<rect x="350" y="208" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="225.2" fill="#222" font-size="12" text-anchor="middle">6</text>
<rect x="460" y="208" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="225.2" fill="#222" font-size="12" text-anchor="middle">2</text>
<rect x="20" y="234" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="251.2" fill="#222" font-size="12" text-anchor="middle">3</text>
<rect x="80" y="234" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="251.2" fill="#222" font-size="12" text-anchor="middle">7</text>
<rect x="190" y="234" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="251.2" fill="#222" font-size="12" text-anchor="middle">a[1]</text>
<rect x="350" y="234" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="251.2" fill="#222" font-size="12" text-anchor="middle">4</text>
<rect x="460" y="234" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="251.2" fill="#222" font-size="12" text-anchor="middle">3</text>
<rect x="20" y="260" width="60" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="50.0" y="277.2" fill="#222" font-size="12" text-anchor="middle">4</text>
<rect x="80" y="260" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="135.0" y="277.2" fill="#222" font-size="12" text-anchor="middle">6</text>
<rect x="190" y="260" width="160" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="270.0" y="277.2" fill="#222" font-size="12" text-anchor="middle">a[0]</text>
<rect x="350" y="260" width="110" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="405.0" y="277.2" fill="#222" font-size="12" text-anchor="middle">2</text>
<rect x="460" y="260" width="80" height="26" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="500.0" y="277.2" fill="#222" font-size="12" text-anchor="middle">4</text>
<text x="20" y="312" fill="#222" font-size="14" text-anchor="start" font-weight="bold">sum = 0 + 1 + 2 + 3 + 4 = 10</text>
</svg>
