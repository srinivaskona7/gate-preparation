<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img">
<title>Set difference of the two projections leaves X2</title>
<text x="150" y="30" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">left: P join R on Y, V = V2</text>
<text x="450" y="30" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">right: Q join R on Y, T &gt; 2</text>
<text x="150" y="62" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">P(X2,Y2,Z2) with R(Y2,V2)</text>
<text x="150" y="82" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">P(X1,Y1,*) has R(Y1,V1) only: no</text>
<text x="150" y="102" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">P(X2,Y4,Z4): no R tuple</text>
<text x="150" y="130" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">projection on X:  {X2}</text>
<text x="450" y="62" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Q(X1,Y2,5) with R(Y2,V3), R(Y2,V2)</text>
<text x="450" y="82" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Q(X1,Y1,6) with R(Y1,V1)</text>
<text x="450" y="102" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Q(X2,Y1,2) fails T &gt; 2; Q(X3,Y3,1) fails</text>
<text x="450" y="130" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">projection on X:  {X1}</text>
<text x="300" y="190" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">{X2} - {X1} = {X2}</text>
<text x="300" y="215" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">1 tuple</text>
</svg>
