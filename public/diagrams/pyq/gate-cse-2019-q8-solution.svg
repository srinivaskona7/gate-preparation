<text x="40.0" y="154" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">-15</text>
<text x="58.66666666666667" y="168" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">-14</text>
<text x="189.33333333333334" y="154" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">-7</text>
<text x="320.0" y="154" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<text x="450.6666666666667" y="154" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">7</text>
<text x="581.3333333333334" y="168" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">14</text>
<text x="600.0" y="154" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">15</text>
<line x1="189.33333333333334" y1="100" x2="450.6666666666667" y2="100" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="320.0" y="92" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">4-bit sign-magnitude: -7 to +7</text>
<line x1="58.66666666666667" y1="70" x2="581.3333333333334" y2="70" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="320.0" y="62" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">X - Y: from -7 - 7 = -14 up to 7 - (-7) = +14</text>
<line x1="40.0" y1="200" x2="600.0" y2="200" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="320.0" y="222" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">5-bit sign-magnitude: -15 to +15 holds all of X - Y</text>
<text x="20" y="262" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">General n: X - Y runs from -(2^n - 2) to +(2^n - 2); n magnitude bits reach 2^n - 1, so n + 1 bits in all. Option C.</text>
<text x="20" y="282" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">n - 1 and n bits are too narrow; n + 2 bits would also hold it, but the question asks for the minimum.</text>
</svg>
