<line x1="469.3333333333333" y1="126" x2="469.3333333333333" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="488.0" y1="126" x2="488.0" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="506.6666666666667" y1="122" x2="506.6666666666667" y2="138" stroke="#1a1a1a" stroke-width="1"/>
