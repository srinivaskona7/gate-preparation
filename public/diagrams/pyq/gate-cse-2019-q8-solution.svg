<line x1="338.6666666666667" y1="126" x2="338.6666666666667" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="357.3333333333333" y1="126" x2="357.3333333333333" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="376.0" y1="126" x2="376.0" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="394.6666666666667" y1="126" x2="394.6666666666667" y2="134" stroke="#1a1a1a" stroke-width="1"/>
<line x1="413.3333333333333" y1="122" x2="413.3333333333333" y2="138" stroke="#1a1a1a" stroke-width="1"/>
<line x1="432.0" y1="126" x2="432.0" y2="134" stroke="#1a1a1a" stroke-width="1"/>
