<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<title>Number line for n equals 4: X and Y range over minus 7 to 7, X minus Y reaches minus 14 to 14, which needs 5 bits in sign-magnitude</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Example n = 4: a sign-magnitude number has 1 sign bit and 3 magnitude bits, so X, Y in [-7, +7]</text>
<line x1="40" y1="130" x2="600" y2="130" stroke="#1a1a1a" stroke-width="1.6"/>
