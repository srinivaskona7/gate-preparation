<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 176" font-family="sans-serif" font-size="12">
<title>Letters P to T as a chain that multiplies by 3 each step: 3 9 27 81 243, so Q plus S is 9 plus 81 equals 90</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="30" y="64" width="66" height="58" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="63" y="86" text-anchor="middle" fill="#222" font-size="13">P</text>
<text x="63" y="110" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">3</text>
<line x1="100" y1="93" x2="138" y2="93" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="119" y="86" text-anchor="middle" fill="#222" font-size="12">x3</text>
<rect x="142" y="64" width="66" height="58" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="175" y="86" text-anchor="middle" fill="#222" font-size="13">Q</text>
<text x="175" y="110" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">9</text>
<line x1="212" y1="93" x2="250" y2="93" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="231" y="86" text-anchor="middle" fill="#222" font-size="12">x3</text>
<rect x="254" y="64" width="66" height="58" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="287" y="86" text-anchor="middle" fill="#222" font-size="13">R</text>
<text x="287" y="110" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">27</text>
<line x1="324" y1="93" x2="362" y2="93" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="343" y="86" text-anchor="middle" fill="#222" font-size="12">x3</text>
<rect x="366" y="64" width="66" height="58" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="399" y="86" text-anchor="middle" fill="#222" font-size="13">S</text>
<text x="399" y="110" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">81</text>
<line x1="436" y1="93" x2="474" y2="93" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="455" y="86" text-anchor="middle" fill="#222" font-size="12">x3</text>
<rect x="478" y="64" width="66" height="58" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="511" y="86" text-anchor="middle" fill="#222" font-size="13">T</text>
<text x="511" y="110" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">243</text>
<text x="300" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Each letter is the previous one times 3: 3, 9, 27, 81, 243</text>
<path d="M63,58 L63,48 L287,48 L287,58" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M287,58 L287,48 L511,48 L511,58" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="175.0" y="42" text-anchor="middle" fill="#222" font-size="11">two steps: x9</text>
<text x="399.0" y="42" text-anchor="middle" fill="#222" font-size="11">two steps: x9</text>
<text x="300" y="160" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">Q + S = 9 + 81 = 90</text>
</svg>
