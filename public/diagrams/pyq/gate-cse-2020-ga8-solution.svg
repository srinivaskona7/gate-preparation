<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 336" font-family="sans-serif">
<title>Annulus with one blue circle highlighted: its diameter b minus a spans the ring width, so each circle has area pi times (b minus a) squared over 4</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs>
<circle cx="150" cy="150" r="112" fill="none" stroke="#222" stroke-width="2"/><circle cx="150" cy="150" r="50" fill="none" stroke="#222" stroke-width="2"/><circle cx="224.8" cy="181.0" r="31.0" fill="#c4c4c4" stroke="#222" stroke-width="2.5"/><circle cx="181.0" cy="224.8" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="119.0" cy="224.8" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="75.2" cy="181.0" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="75.2" cy="119.0" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="119.0" cy="75.2" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="181.0" cy="75.2" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="224.8" cy="119.0" r="31.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/><circle cx="150" cy="150" r="2.5" fill="#222" stroke="#222" stroke-width="1.5"/><line x1="150" y1="150" x2="70.8" y2="70.8" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/><line x1="150" y1="150" x2="100" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/><text x="125.0" y="144" font-size="14" text-anchor="middle" fill="#222" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">a</text><text x="58.8" y="64.8" font-size="14" text-anchor="middle" fill="#222" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke">b</text><line x1="196.19397662556435" y1="169.1341716182545" x2="253.4745076412641" y2="192.86054442489007" stroke="#222" stroke-width="2.5"/><text x="259.5" y="208.9" font-size="12" text-anchor="start" fill="#222" font-weight="bold">b − a</text><text x="150" y="290" font-size="11" text-anchor="middle" fill="#222">Each circle has diameter b − a,</text><text x="150" y="304" font-size="11" text-anchor="middle" fill="#222">so radius (b − a)/2 and area π(b − a)²/4.</text><text x="150" y="324" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Unpainted = π(b² − a²) − n·π(b − a)²/4</text>
</svg>
