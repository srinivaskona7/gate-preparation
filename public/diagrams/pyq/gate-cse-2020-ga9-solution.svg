<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 298" font-family="sans-serif">
<title>Two perpendicular lines crossing at the origin: the acute angle alpha with the X-axis on the right and beta on the left satisfy alpha plus 90 degrees plus beta equals 180 degrees</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs>
<line x1="20" y1="135" x2="380" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/><line x1="200" y1="240" x2="200" y2="16" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/><text x="386" y="139" font-size="12" text-anchor="start" fill="#222">X</text><text x="206" y="16" font-size="12" text-anchor="start" fill="#222">Y</text><line x1="105.79751490676594" y1="200.9612901803703" x2="294.20248509323403" y2="69.0387098196297" stroke="#222" stroke-width="2.5"/><line x1="265.96129018037027" y1="229.20248509323406" x2="134.0387098196297" y2="40.79751490676594" stroke="#222" stroke-width="2.5"/><path d="M 260 135 A 60 60 0 0 0 249.1 100.6" fill="none" stroke="#222" stroke-width="1.5"/><text x="268" y="125" font-size="14" text-anchor="start" fill="#222">α</text><path d="M 140 135 A 60 60 0 0 1 165.6 85.9" fill="none" stroke="#222" stroke-width="1.5"/><text x="132" y="125" font-size="14" text-anchor="end" fill="#222">β</text><text x="200" y="266" font-size="11" text-anchor="middle" fill="#222">The lines meet at 90°. The acute angles with the X-axis are α on one side</text><text x="200" y="284" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">and β on the other. Along the X-axis: α + 90° + β = 180°, so α + β = 90°.</text>
</svg>
