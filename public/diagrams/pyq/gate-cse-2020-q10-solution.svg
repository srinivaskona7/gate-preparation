<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" font-family="sans-serif" font-size="13">
<title>Deterministic PDA for a^n union a^n b^n: state A final after only a, B pops on b, F final when the bottom marker shows</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="60" y1="130" x2="176" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="80" y="122" text-anchor="middle" font-size="12" fill="#222">start</text>
<circle cx="200" cy="130" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="200" cy="130" r="19" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="200" y="135" text-anchor="middle" font-size="14" fill="#222">A</text>
<circle cx="400" cy="130" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="400" y="135" text-anchor="middle" font-size="14" fill="#222">B</text>
<circle cx="600" cy="130" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="600" cy="130" r="19" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="600" y="135" text-anchor="middle" font-size="14" fill="#222">F</text>
<line x1="224" y1="130" x2="376" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="300.0" y="122" text-anchor="middle" font-size="12" fill="#222">b, a → ε</text>
<line x1="424" y1="130" x2="576" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="500.0" y="122" text-anchor="middle" font-size="12" fill="#222">ε, Z → Z</text>
<path d="M190,108 C176,72 224,72 210,108" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="200" y="66" text-anchor="middle" font-size="12" fill="#222">a, X → aX</text>
<path d="M390,108 C376,72 424,72 410,108" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="400" y="66" text-anchor="middle" font-size="12" fill="#222">b, a → ε</text>
<text x="380" y="215" text-anchor="middle" font-size="12" fill="#222">Z = bottom marker, X is Z or a. Every configuration has at most one move, so the machine is deterministic.</text>
<text x="380" y="240" text-anchor="middle" font-size="12" fill="#222">a^n: stays in A, which is final.   a^n b^n: pops every a, reaches Z on top, takes ε to F, which is final.</text>
<text x="380" y="265" text-anchor="middle" font-size="12" fill="#222">a^n b^m with m ≠ n, m ≥ 1: B ends with an a on top (m &lt; n) or has no move (m &gt; n), so it is rejected.</text>
</svg>
