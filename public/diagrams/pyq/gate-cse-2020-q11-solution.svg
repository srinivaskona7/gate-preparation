<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" font-family="sans-serif" font-size="13">
<title>First, best, worst and next fit placing a 15 KB request into holes of 40, 20, 60 and 25 KB: remainders 25, 5, 45 and 45 KB; best fit leaves the smallest</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" fill="#222" font-weight="bold">Holes in memory order, request 15 KB, no hole equals 15 KB</text>
<text x="20" y="44" fill="#222" font-size="12">Dark block = the 15 KB given to the process; the rest of that hole stays free.</text>
<text x="20" y="88" fill="#222" font-weight="bold">First fit</text>
<text x="20" y="104" fill="#222" font-size="11">first hole that fits</text>
<rect x="150" y="66" width="160" height="30" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="150" y="66" width="60" height="30" stroke="#222" stroke-width="1.5" fill="#222" fill-opacity="0.35"/>
<text x="230" y="86" fill="#222" text-anchor="middle" font-size="12">H1: 40</text>
<text x="230" y="114" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">leaves 25 KB</text>
<rect x="326" y="66" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="366" y="86" fill="#222" text-anchor="middle" font-size="12">H2: 20</text>
<rect x="422" y="66" width="240" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="542" y="86" fill="#222" text-anchor="middle" font-size="12">H3: 60</text>
<rect x="678" y="66" width="100" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="728" y="86" fill="#222" text-anchor="middle" font-size="12">H4: 25</text>
<text x="20" y="166" fill="#222" font-weight="bold">Best fit</text>
<text x="20" y="182" fill="#222" font-size="11">smallest hole that fits</text>
<rect x="150" y="144" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="230" y="164" fill="#222" text-anchor="middle" font-size="12">H1: 40</text>
<rect x="326" y="144" width="80" height="30" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="326" y="144" width="60" height="30" stroke="#222" stroke-width="1.5" fill="#222" fill-opacity="0.35"/>
<text x="366" y="164" fill="#222" text-anchor="middle" font-size="12">H2: 20</text>
<text x="366" y="192" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">leaves 5 KB</text>
<rect x="422" y="144" width="240" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="542" y="164" fill="#222" text-anchor="middle" font-size="12">H3: 60</text>
<rect x="678" y="144" width="100" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="728" y="164" fill="#222" text-anchor="middle" font-size="12">H4: 25</text>
<text x="20" y="244" fill="#222" font-weight="bold">Worst fit</text>
<text x="20" y="260" fill="#222" font-size="11">largest hole</text>
<rect x="150" y="222" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="230" y="242" fill="#222" text-anchor="middle" font-size="12">H1: 40</text>
<rect x="326" y="222" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="366" y="242" fill="#222" text-anchor="middle" font-size="12">H2: 20</text>
<rect x="422" y="222" width="240" height="30" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="422" y="222" width="60" height="30" stroke="#222" stroke-width="1.5" fill="#222" fill-opacity="0.35"/>
<text x="542" y="242" fill="#222" text-anchor="middle" font-size="12">H3: 60</text>
<text x="542" y="270" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">leaves 45 KB</text>
<rect x="678" y="222" width="100" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="728" y="242" fill="#222" text-anchor="middle" font-size="12">H4: 25</text>
<text x="20" y="322" fill="#222" font-weight="bold">Next fit</text>
<text x="20" y="338" fill="#222" font-size="11">scan starts at H3</text>
<rect x="150" y="300" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="230" y="320" fill="#222" text-anchor="middle" font-size="12">H1: 40</text>
<rect x="326" y="300" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="366" y="320" fill="#222" text-anchor="middle" font-size="12">H2: 20</text>
<rect x="422" y="300" width="240" height="30" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="422" y="300" width="60" height="30" stroke="#222" stroke-width="1.5" fill="#222" fill-opacity="0.35"/>
<text x="542" y="320" fill="#222" text-anchor="middle" font-size="12">H3: 60</text>
<text x="542" y="348" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">leaves 45 KB</text>
<rect x="678" y="300" width="100" height="30" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="728" y="320" fill="#222" text-anchor="middle" font-size="12">H4: 25</text>
<text x="20" y="384" fill="#222" font-size="12">Best fit leaves 5 KB, the least possible, so it is never larger than the hole first fit leaves (25 KB).</text>
<text x="20" y="402" fill="#222" font-size="12">Other starts: next fit from H2 leaves 5 KB (smaller than first fit), and from H3 leaves 45 KB (larger than best fit).</text>
</svg>
