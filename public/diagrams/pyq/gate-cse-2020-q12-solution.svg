<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" font-family="sans-serif" font-size="13">
<title>Five-state diagram with statements I to IV placed on their arrows: I, II and IV are solid, III (Waiting to Running) is dashed and impossible</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="28" y="28" width="104" height="44" rx="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="80" y="55" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">New</text>
<rect x="98" y="148" width="104" height="44" rx="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="150" y="175" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Ready</text>
<rect x="488" y="148" width="104" height="44" rx="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="540" y="175" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Running</text>
<rect x="598" y="38" width="104" height="44" rx="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="650" y="65" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Terminated</text>
<rect x="293" y="298" width="104" height="44" rx="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="345" y="325" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Waiting</text>
<path d="M95,72 L130,148" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="80" y="112" text-anchor="end" fill="#222" font-size="12">admit</text>
<path d="M202,160 L488,160" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="345" y="150" text-anchor="middle" fill="#222" font-size="12">dispatch (II)</text>
<path d="M488,182 L202,182" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="345" y="202" text-anchor="middle" fill="#222" font-size="12">preempt (I)</text>
<path d="M512,192 L380,298" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="418" y="252" text-anchor="end" fill="#222" font-size="12">block</text>
<path d="M310,298 L178,194" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="268" y="232" text-anchor="start" fill="#222" font-size="12">wake-up (IV)</text>
<path d="M570,148 L628,82" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="618" y="132" text-anchor="start" fill="#222" font-size="12">exit</text>
<path d="M402,308 L560,194" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="481" y="258" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">X</text>
<text x="500" y="300" text-anchor="start" fill="#222" font-size="12">Waiting to Running (III)</text>
<path d="M120,194 L292,310" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="206" y="258" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">X</text>
<text x="20" y="296" text-anchor="start" fill="#222" font-size="12">Ready to Waiting</text>
<text x="360" y="26" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Statements I, II and IV are arrows of the diagram; III is not</text>
<text x="360" y="372" text-anchor="middle" fill="#222" font-size="12">Solid arrows can happen. Dashed arrows marked X never happen.</text>
</svg>
