<text x="90" y="150" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">weak entity set: double rectangle</text>
<text x="280" y="150" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">identifying relationship:</text>
<text x="280" y="166" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">double diamond</text>
<text x="470" y="150" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">owner (strong) entity set</text>
<text x="280" y="200" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">The weak set joins its double diamond with a double line: every weak entity has an owner.</text>
