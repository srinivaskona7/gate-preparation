<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 314" font-family="sans-serif" font-size="13">
<title>Worst case for sorted insertion: keys arrive in increasing order, each new key is compared with every key already in the list, so insertion k costs k minus 1 comparisons and six insertions cost 15</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Keys 1, 2, 3, ... arrive in increasing order. Each new key goes to the end.</text>
<text x="10" y="63" text-anchor="start" fill="#222" font-size="12">insert 1</text>
<rect x="100" y="46" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="113" y="63" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">1</text>
<text x="330" y="63" text-anchor="start" fill="#222" font-size="12">0 comparisons</text>
<text x="10" y="97" text-anchor="start" fill="#222" font-size="12">insert 2</text>
<rect x="100" y="80" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113" y="97" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1</text>
<rect x="130" y="80" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="143" y="97" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">2</text>
<text x="330" y="97" text-anchor="start" fill="#222" font-size="12">1 comparison</text>
<text x="10" y="131" text-anchor="start" fill="#222" font-size="12">insert 3</text>
<rect x="100" y="114" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113" y="131" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1</text>
<rect x="130" y="114" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="143" y="131" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2</text>
<rect x="160" y="114" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="173" y="131" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">3</text>
<text x="330" y="131" text-anchor="start" fill="#222" font-size="12">2 comparisons</text>
<text x="10" y="165" text-anchor="start" fill="#222" font-size="12">insert 4</text>
<rect x="100" y="148" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113" y="165" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1</text>
<rect x="130" y="148" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="143" y="165" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2</text>
<rect x="160" y="148" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="173" y="165" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3</text>
<rect x="190" y="148" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="203" y="165" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">4</text>
<text x="330" y="165" text-anchor="start" fill="#222" font-size="12">3 comparisons</text>
<text x="10" y="199" text-anchor="start" fill="#222" font-size="12">insert 5</text>
<rect x="100" y="182" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113" y="199" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1</text>
<rect x="130" y="182" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="143" y="199" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2</text>
<rect x="160" y="182" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="173" y="199" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3</text>
<rect x="190" y="182" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="203" y="199" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">4</text>
<rect x="220" y="182" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="233" y="199" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">5</text>
<text x="330" y="199" text-anchor="start" fill="#222" font-size="12">4 comparisons</text>
<text x="10" y="233" text-anchor="start" fill="#222" font-size="12">insert 6</text>
<rect x="100" y="216" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="113" y="233" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1</text>
<rect x="130" y="216" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="143" y="233" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2</text>
<rect x="160" y="216" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="173" y="233" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3</text>
<rect x="190" y="216" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="203" y="233" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">4</text>
<rect x="220" y="216" width="26" height="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="233" y="233" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">5</text>
<rect x="250" y="216" width="26" height="24" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="263" y="233" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="bold">6</text>
<text x="330" y="233" text-anchor="start" fill="#222" font-size="12">5 comparisons</text>
<text x="10" y="264" text-anchor="start" fill="#222" font-size="13">Total = 0 + 1 + 2 + 3 + 4 + 5 = 15 = n(n - 1)/2 for n = 6, which grows as n squared.</text>
<text x="10" y="290" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Answer (C): Theta(n^2).</text>
</svg>
