<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Chain n, n^(1/a), n^(1/a^2) down to the base value b: the number of steps is log base a of log base b of n</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="12" y="18" text-anchor="start" font-size="12">a = 2, b = 2, n = 2^64: each step replaces n by n^(1/2)</text>
<rect x="14" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="47" y="55" text-anchor="middle">2^64</text>
<text x="47" y="92" text-anchor="middle" font-size="11">log_b n = 64</text>
<text x="47" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="82" y1="50" x2="98" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="100" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="133" y="55" text-anchor="middle">2^32</text>
<text x="133" y="92" text-anchor="middle" font-size="11">log_b n = 32</text>
<text x="133" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="168" y1="50" x2="184" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="186" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="219" y="55" text-anchor="middle">2^16</text>
<text x="219" y="92" text-anchor="middle" font-size="11">log_b n = 16</text>
<text x="219" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="254" y1="50" x2="270" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="272" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="305" y="55" text-anchor="middle">2^8</text>
<text x="305" y="92" text-anchor="middle" font-size="11">log_b n = 8</text>
<text x="305" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="340" y1="50" x2="356" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="358" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="391" y="55" text-anchor="middle">2^4</text>
<text x="391" y="92" text-anchor="middle" font-size="11">log_b n = 4</text>
<text x="391" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="426" y1="50" x2="442" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="444" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="477" y="55" text-anchor="middle">2^2</text>
<text x="477" y="92" text-anchor="middle" font-size="11">log_b n = 2</text>
<text x="477" y="112" text-anchor="middle" font-size="11">cost 1</text>
<line x1="512" y1="50" x2="528" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="530" y="34" width="66" height="32" rx="3" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<text x="563" y="55" text-anchor="middle">2^1</text>
<text x="563" y="92" text-anchor="middle" font-size="11">log_b n = 1</text>
<text x="563" y="112" text-anchor="middle" font-size="11">cost 1</text>
<text x="12" y="150" text-anchor="start">Dividing log_b n by a each step: log_b n / a^k &lt;= 1 after k = ceil(log_a log_b n) steps.</text>
<text x="12" y="174" text-anchor="start">Here k = log2 64 = 6 steps, then the base case T(b) = 1 adds one more: 7 costs of 1.</text>
<text x="12" y="200" text-anchor="start" font-weight="bold">T(n) = log_a log_b n + 1 = Theta(log_a log_b n)</text>
</svg>
