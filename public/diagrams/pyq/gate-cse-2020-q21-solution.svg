<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Hit path of 3 ns against a miss path of 3 ns lookup plus 175 ns block fetch, average 13.5 ns</title>
<text x="10" y="20" fill="#1f2937" stroke="none" font-weight="bold">Cost of one access in a direct mapped cache (block 256 B = 32 words of 8 B)</text><text x="10" y="58" fill="#1f2937" stroke="none">hit, 94 %</text><rect x="110" y="42" width="70" height="24" stroke-width="2.5"/><text x="145" y="59" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">3 ns</text><text x="10" y="112" fill="#1f2937" stroke="none">miss, 6 %</text><rect x="110" y="96" width="70" height="24" stroke-width="2.5"/><text x="145" y="113" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">lookup 3</text><rect x="180" y="96" width="130" height="24" stroke-width="2.5"/><text x="245" y="113" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">first word 20</text><rect x="310" y="96" width="300" height="24" stroke-width="2.5"/><text x="460" y="113" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">31 more words x 5 = 155 ns</text><polyline points="180,130 180,138 610,138 610,130"/><text x="395" y="154" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">miss penalty = 20 + 155 = 175 ns</text><text x="10" y="190" fill="#1f2937" stroke="none" font-weight="bold">Average = hit time + miss rate x penalty = 3 + 0.06 x 175 = 3 + 10.5 = 13.5 ns.</text><text x="10" y="212" fill="#1f2937" stroke="none" font-size="11">If the lookup overlaps the memory start-up: 0.94 x 3 + 0.06 x 175 = 13.32, which rounds to 13.3 (also accepted).</text></svg>
