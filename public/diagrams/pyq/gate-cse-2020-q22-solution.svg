<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" font-family="sans-serif" font-size="13">
<title>The 4 by 5 array with values 1 to 20; a plus 3 selects the row 16 to 20 and offset 3 in that row selects 19</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">*(*(a + **a + 2) + 3): a points to row 0; **a = a[0][0] = 1</text>
<text x="20" y="62" fill="#222" font-size="12" font-family="monospace">a + 0</text>
<rect x="90" y="42" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="118" y="63" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">1</text>
<rect x="146" y="42" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="174" y="63" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">2</text>
<rect x="202" y="42" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="230" y="63" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">3</text>
<rect x="258" y="42" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="286" y="63" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">4</text>
<rect x="314" y="42" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="342" y="63" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">5</text>
<text x="20" y="94" fill="#222" font-size="12" font-family="monospace">a + 1</text>
<rect x="90" y="74" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="118" y="95" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">6</text>
<rect x="146" y="74" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="174" y="95" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">7</text>
<rect x="202" y="74" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="230" y="95" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">8</text>
<rect x="258" y="74" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="286" y="95" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">9</text>
<rect x="314" y="74" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="342" y="95" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">10</text>
<text x="20" y="126" fill="#222" font-size="12" font-family="monospace">a + 2</text>
<rect x="90" y="106" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="118" y="127" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">11</text>
<rect x="146" y="106" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="174" y="127" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">12</text>
<rect x="202" y="106" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="230" y="127" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">13</text>
<rect x="258" y="106" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="286" y="127" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">14</text>
<rect x="314" y="106" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="342" y="127" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">15</text>
<text x="20" y="158" fill="#222" font-size="12" font-family="monospace">a + 3</text>
<rect x="90" y="138" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="118" y="159" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">16</text>
<rect x="146" y="138" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="174" y="159" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">17</text>
<rect x="202" y="138" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="230" y="159" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">18</text>
<rect x="258" y="138" width="56" height="32" stroke="#222" stroke-width="3" fill="#d9d9d9"/>
<text x="286" y="159" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">19</text>
<rect x="314" y="138" width="56" height="32" stroke="#222" stroke-width="1" fill="none"/>
<text x="342" y="159" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">20</text>
<text x="380" y="62" fill="#222" font-size="12">a + **a + 2 = a + 1 + 2 = a + 3</text>
<text x="380" y="82" fill="#222" font-size="12">adding to a row pointer skips whole rows:</text>
<text x="380" y="102" fill="#222" font-size="12">it points to row 3 (16 17 18 19 20)</text>
<text x="380" y="132" fill="#222" font-size="12">*(a + 3) is that row, as a pointer to 16</text>
<text x="380" y="152" fill="#222" font-size="12">+ 3 moves 3 ints to column 3</text>
<text x="380" y="178" fill="#222" font-size="14" font-weight="bold">value = 19</text>
</svg>
