<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
<title>Rice test for four languages of machine encodings: L1, L3 and L4 ask about L(M) and are undecidable; L2 asks about a 100-step run and is decidable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Language</text>
<text x="300" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">What it asks about</text>
<text x="520" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Verdict</text>
<rect x="10" y="40" width="740" height="54" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="72" text-anchor="start" fill="#222" font-size="13">L1: L(M) is empty</text>
<text x="300" y="72" text-anchor="start" fill="#222" font-size="13">the language L(M)</text>
<text x="520" y="64" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="520" y="82" text-anchor="start" fill="#222" font-size="11">some machines pass, some fail</text>
<rect x="10" y="102" width="740" height="54" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="134" text-anchor="start" fill="#222" font-size="13">L2: M reaches q in exactly 100 steps</text>
<text x="300" y="134" text-anchor="start" fill="#222" font-size="13">a 100-step run</text>
<text x="520" y="126" text-anchor="start" fill="#222" font-size="13" font-weight="bold">decidable</text>
<text x="520" y="144" text-anchor="start" fill="#222" font-size="11">simulate 100 steps, then stop</text>
<rect x="10" y="164" width="740" height="54" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="196" text-anchor="start" fill="#222" font-size="13">L3: L(M) is not recursive</text>
<text x="300" y="196" text-anchor="start" fill="#222" font-size="13">the language L(M)</text>
<text x="520" y="188" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="520" y="206" text-anchor="start" fill="#222" font-size="11">some machines pass, some fail</text>
<rect x="10" y="226" width="740" height="54" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="258" text-anchor="start" fill="#222" font-size="13">L4: L(M) has at least 21 members</text>
<text x="300" y="258" text-anchor="start" fill="#222" font-size="13">the language L(M)</text>
<text x="520" y="250" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="520" y="268" text-anchor="start" fill="#222" font-size="11">some machines pass, some fail</text>
<text x="380" y="308" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Answer: L1, L3 and L4 are undecidable</text>
</svg>
