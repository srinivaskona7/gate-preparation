<text x="179.0" y="207.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<text x="194" y="180" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">fraction F (23 bits)</text>
