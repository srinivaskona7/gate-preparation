<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
<title>R1 decodes to 40, R2 decodes to minus 10, and 40 divided by minus 10 is minus 4, stored as 0xC0800000</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Decode each register: value = (-1)^S x 1.F x 2^(E - 127)</text>
<text x="20" y="48" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">R1 = 0x42200000</text>
<text x="20" y="74" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
<rect x="20" y="84" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="29.0" y="101.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">0</text>
<text x="44" y="74" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">exponent E (8 bits)</text>
