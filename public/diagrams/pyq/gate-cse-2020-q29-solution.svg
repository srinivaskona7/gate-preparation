<text x="258.0" y="101.2" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0 ... 0</text>
<text x="302" y="101" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">+1.25 x 2^5 = +40</text>
<text x="20" y="130" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">E = 132, power 5, 1.01 = 1.25</text>
<text x="20" y="154" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">R2 = 0xC1200000</text>
<text x="20" y="180" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
