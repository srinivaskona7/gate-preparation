<text x="179.0" y="101.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<text x="194" y="74" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">fraction F (23 bits)</text>
<rect x="194" y="84" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="203.0" y="101.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="212" y="84" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="221.0" y="101.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
