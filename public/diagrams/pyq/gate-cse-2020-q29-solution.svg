<text x="221.0" y="207.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="230" y="190" width="56" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="258.0" y="207.2" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0 ... 0</text>
<text x="302" y="207" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">-1.25 x 2^3 = -10</text>
<text x="20" y="236" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">E = 130, power 3, 1.01 = 1.25</text>
<text x="20" y="268" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">R3 = R1 / R2 = 40 / (-10) = -4 = -1.0 x 2^2</text>
<text x="20" y="298" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">S = 1, E = 2 + 127 = 129 = 10000001, F = all 0</text>
<text x="20" y="326" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
