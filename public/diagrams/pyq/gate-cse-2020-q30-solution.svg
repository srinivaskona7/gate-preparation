<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Tag, set index and offset of four addresses; A2 and A3 share set 40, A1 and A4 share set 8</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">24-bit address of a 64 KB 4-way cache with 256-byte blocks: 64 sets</text><rect x="20" y="60" width="250" height="44" stroke-width="2"/><text x="145" y="79" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="145" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">10 bits</text><text x="23" y="54" fill="#1f2937" stroke="none" font-size="10">23</text><text x="267" y="54" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">14</text><rect x="270" y="60" width="150" height="44" stroke-width="2"/><text x="345" y="79" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">set index</text><text x="345" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">6 bits: 64 sets</text><text x="273" y="54" fill="#1f2937" stroke="none" font-size="10">13</text><text x="417" y="54" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">8</text><rect x="420" y="60" width="200" height="44" stroke-width="2"/><text x="520" y="79" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="520" y="96" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">8 bits: 256 bytes</text><text x="423" y="54" fill="#1f2937" stroke="none" font-size="10">7</text><text x="617" y="54" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">0</text><text x="20" y="130" fill="#1f2937" stroke="none" font-weight="bold">Address</text><text x="130" y="130" fill="#1f2937" stroke="none" font-weight="bold">tag</text><text x="270" y="130" fill="#1f2937" stroke="none" font-weight="bold">set bits</text><text x="380" y="130" fill="#1f2937" stroke="none" font-weight="bold">set</text><text x="440" y="130" fill="#1f2937" stroke="none" font-weight="bold">offset</text><line x1="20" y1="136" x2="620" y2="136" stroke-width="1"/><text x="20" y="156" fill="#1f2937" stroke="none">A1 = 0x42C8A4</text><text x="130" y="156" fill="#1f2937" stroke="none">0100001011</text><text x="270" y="156" fill="#1f2937" stroke="none">001000</text><text x="380" y="156" fill="#1f2937" stroke="none">8</text><text x="440" y="156" fill="#1f2937" stroke="none">10100100</text><text x="20" y="178" fill="#1f2937" stroke="none">A2 = 0x546888</text><text x="130" y="178" fill="#1f2937" stroke="none">0101010001</text><text x="270" y="178" fill="#1f2937" stroke="none">101000</text><text x="380" y="178" fill="#1f2937" stroke="none">40</text><text x="440" y="178" fill="#1f2937" stroke="none">10001000</text><text x="20" y="200" fill="#1f2937" stroke="none">A3 = 0x6A289C</text><text x="130" y="200" fill="#1f2937" stroke="none">0110101000</text><text x="270" y="200" fill="#1f2937" stroke="none">101000</text><text x="380" y="200" fill="#1f2937" stroke="none">40</text><text x="440" y="200" fill="#1f2937" stroke="none">10011100</text><text x="20" y="222" fill="#1f2937" stroke="none">A4 = 0x5E4880</text><text x="130" y="222" fill="#1f2937" stroke="none">0101111001</text><text x="270" y="222" fill="#1f2937" stroke="none">001000</text><text x="380" y="222" fill="#1f2937" stroke="none">8</text><text x="440" y="222" fill="#1f2937" stroke="none">10000000</text><text x="20" y="262" fill="#1f2937" stroke="none" font-weight="bold">A2 and A3 both land in set 40. A1 and A4 share set 8, so option A is false.</text><text x="20" y="282" fill="#1f2937" stroke="none">A1 against A3 (8 against 40) and A3 against A4 (40 against 8) differ.</text></svg>
