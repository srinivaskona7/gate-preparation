<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="sans-serif" font-size="13">
<title>String of length 8 split into two halves with positions 2 and 6 different, and split again into two odd-length blocks centred on those positions</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="14" fill="#222" font-weight="bold">z = x y with |x| = |y| = 4, x ≠ y: positions 2 and 6 differ</text>
<rect x="96" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="120" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">a</text>
<text x="120" y="98" text-anchor="middle" font-size="11" fill="#222">1</text>
<rect x="156" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="180" y="135" text-anchor="middle" font-size="20" fill="#222" font-weight="bold" font-family="monospace">b</text>
<text x="180" y="98" text-anchor="middle" font-size="11" fill="#222">2</text>
<rect x="216" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="240" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">a</text>
<text x="240" y="98" text-anchor="middle" font-size="11" fill="#222">3</text>
<rect x="276" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="300" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">a</text>
<text x="300" y="98" text-anchor="middle" font-size="11" fill="#222">4</text>
<rect x="336" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="360" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">a</text>
<text x="360" y="98" text-anchor="middle" font-size="11" fill="#222">5</text>
<rect x="396" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="2.5"/>
<text x="420" y="135" text-anchor="middle" font-size="20" fill="#222" font-weight="bold" font-family="monospace">a</text>
<text x="420" y="98" text-anchor="middle" font-size="11" fill="#222">6</text>
<rect x="456" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="480" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">b</text>
<text x="480" y="98" text-anchor="middle" font-size="11" fill="#222">7</text>
<rect x="516" y="106" width="48" height="40" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="540" y="135" text-anchor="middle" font-size="20" fill="#222" font-family="monospace">a</text>
<text x="540" y="98" text-anchor="middle" font-size="11" fill="#222">8</text>
<path d="M96,164 L96,174 L324,174 L324,164" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="210.0" y="192" text-anchor="middle" font-size="13" fill="#222">x</text>
<path d="M336,164 L336,174 L564,174 L564,164" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="450.0" y="192" text-anchor="middle" font-size="13" fill="#222">y</text>
<path d="M180,84 C180,46 420,46 420,84" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="300" y="54" text-anchor="middle" font-size="12" fill="#222">b ≠ a, and the gap between them is |x| = 4</text>
<line x1="96" y1="230" x2="264" y2="230" stroke="#222" stroke-width="3"/>
<text x="180" y="248" text-anchor="middle" font-size="12" fill="#222">block 1: odd length 3, centre b (position 2)</text>
<line x1="276" y1="230" x2="564" y2="230" stroke="#222" stroke-width="3"/>
<text x="420" y="248" text-anchor="middle" font-size="12" fill="#222">block 2: odd length 5, centre a (position 6)</text>
<text x="20" y="282" text-anchor="start" font-size="12" fill="#222">Grammar: S → AB | BA,  A → XAX | a,  B → XBX | b,  X → a | b.   B makes block 1 (centre b), A makes block 2 (centre a).</text>
<text x="20" y="302" text-anchor="start" font-size="12" fill="#222">Centres are always |x| apart, because each block has equal stretches on both sides of its centre.</text>
</svg>
