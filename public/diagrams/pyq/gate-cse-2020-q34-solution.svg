<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>Barrier built from two semaphores: count reaches n under lock a, the last arrival signals b, and the gate b lets each process through in turn</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Example with n = 3 processes (count starts at 0, a = 1, b = 0)</text>
<text x="20" y="72" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P1</text>
<rect x="60" y="50" width="170" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="145.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">CODE SECTION P</text>
<line x1="230.0" y1="68.0" x2="250.0" y2="68.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="250" y="50" width="150" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="325.0" y="64.5" text-anchor="middle" fill="#222" font-size="10">wait(a); count++;</text>
<text x="325.0" y="79.5" text-anchor="middle" fill="#222" font-size="10">count = 1; signal(a)</text>
<rect x="570" y="50" width="90" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="615.0" y="64.5" text-anchor="middle" fill="#222" font-size="11">wait(b)</text>
<text x="615.0" y="79.5" text-anchor="middle" fill="#222" font-size="11">signal(b)</text>
<rect x="690" y="50" width="80" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="730.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">SECTION Q</text>
<line x1="660.0" y1="68.0" x2="690.0" y2="68.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="132" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P2</text>
<rect x="60" y="110" width="170" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="145.0" y="132.0" text-anchor="middle" fill="#222" font-size="11">CODE SECTION P</text>
<line x1="230.0" y1="128.0" x2="290.0" y2="128.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="290" y="110" width="150" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="365.0" y="124.5" text-anchor="middle" fill="#222" font-size="10">wait(a); count++;</text>
<text x="365.0" y="139.5" text-anchor="middle" fill="#222" font-size="10">count = 2; signal(a)</text>
<rect x="570" y="110" width="90" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="615.0" y="124.5" text-anchor="middle" fill="#222" font-size="11">wait(b)</text>
<text x="615.0" y="139.5" text-anchor="middle" fill="#222" font-size="11">signal(b)</text>
<rect x="690" y="110" width="80" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="730.0" y="132.0" text-anchor="middle" fill="#222" font-size="11">SECTION Q</text>
<line x1="660.0" y1="128.0" x2="690.0" y2="128.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="192" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P3</text>
<rect x="60" y="170" width="170" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="145.0" y="192.0" text-anchor="middle" fill="#222" font-size="11">CODE SECTION P</text>
<line x1="230.0" y1="188.0" x2="330.0" y2="188.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="330" y="170" width="150" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="405.0" y="184.5" text-anchor="middle" fill="#222" font-size="10">wait(a); count++ (3);</text>
<text x="405.0" y="199.5" text-anchor="middle" fill="#222" font-size="10">signal(b); signal(a)</text>
<rect x="570" y="170" width="90" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="615.0" y="184.5" text-anchor="middle" fill="#222" font-size="11">wait(b)</text>
<text x="615.0" y="199.5" text-anchor="middle" fill="#222" font-size="11">signal(b)</text>
<rect x="690" y="170" width="80" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="730.0" y="192.0" text-anchor="middle" fill="#222" font-size="11">SECTION Q</text>
<line x1="660.0" y1="188.0" x2="690.0" y2="188.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="500.0" y1="40.0" x2="500.0" y2="222.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500" y="240" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">count == 3: signal(b), gate opens (b = 1)</text>
<text x="20" y="280" text-anchor="start" fill="#222" font-size="11">Before count == n, b = 0 and every process waits at wait(b). So no process reaches Q before all have finished P: option A.</text>
<text x="20" y="302" text-anchor="start" fill="#222" font-size="11">After that the gate is open to all (up to n in Q), and P has no lock (all n can be in P): B, C, D are false.</text>
</svg>
