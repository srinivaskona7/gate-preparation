<text x="40" y="330" text-anchor="start" fill="#222" font-size="12">Each step goes to the nearest pending cylinder; the head reverses after T (up to down) and after S (down to up).</text>
<text x="40" y="347" text-anchor="start" fill="#222" font-size="12">Statement B is false: Q is serviced before S and after T.</text>
