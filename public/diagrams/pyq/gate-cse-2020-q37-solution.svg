<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" font-family="sans-serif" font-size="13">
<title>Conflicting pairs of the schedule of T1 and T2 and the choice of option A</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<path d="M152,99 Q200,120 242,99" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="200" y="120" text-anchor="middle" font-size="12" fill="#111">C</text><path d="M248,81 Q200,60 158,81" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="200" y="68" text-anchor="middle" font-size="12" fill="#111">B, D</text><circle cx="130" cy="90" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="130" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><circle cx="270" cy="90" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="270" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><text x="235" y="160" text-anchor="middle" font-size="12" fill="#111">Each conflicting pair must keep its order in an equivalent schedule:</text><text x="235" y="180" text-anchor="middle" font-size="12" fill="#111">RC(T1) before WC(T2); RB, WB, RD (T2) before WB, WD (T1)</text><text x="235" y="205" text-anchor="middle" font-size="12" fill="#111">Only option A keeps all four. B reverses the B and D pairs,</text><text x="235" y="225" text-anchor="middle" font-size="12" fill="#111">C reverses the D pair, D reverses the C pair</text>
</svg>