<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="sans-serif" font-size="13">
<title>Third octet 0 to 255 of 202.61.x.0: the ISP owns 0 to 127; only 64 and 104 are aligned /21 blocks inside it</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="30" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Each /21 block spans 8 values of the third octet and starts at a multiple of 8</text>
<text x="10" y="64" text-anchor="start" fill="#222" font-size="12">ISP block 202.61.0.0/17 : 0 to 127</text>
<rect x="340.0" y="44" width="424.0" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">I   202.61.84.0/21 : not aligned (80 to 87)</text>
<rect x="605.0" y="82" width="26.5" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="140" text-anchor="start" fill="#222" font-size="12">II  202.61.104.0/21 : 104 to 111</text>
<rect x="684.5" y="120" width="26.5" height="28" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="10" y="178" text-anchor="start" fill="#222" font-size="12">III 202.61.64.0/21 : 64 to 71</text>
<rect x="552.0" y="158" width="26.5" height="28" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="10" y="216" text-anchor="start" fill="#222" font-size="12">IV  202.61.144.0/21 : 144 to 151, outside</text>
<rect x="817.0" y="196" width="26.5" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="340.0" y1="40" x2="340.0" y2="234" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="340.0" y="248" text-anchor="middle" fill="#222" font-size="11">0</text>
<line x1="552.0" y1="40" x2="552.0" y2="234" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="552.0" y="248" text-anchor="middle" fill="#222" font-size="11">64</text>
<line x1="764.0" y1="40" x2="764.0" y2="234" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="764.0" y="248" text-anchor="middle" fill="#222" font-size="11">128</text>
<line x1="866.7" y1="40" x2="866.7" y2="234" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="866.7" y="248" text-anchor="middle" fill="#222" font-size="11">159</text>
<text x="10" y="274" text-anchor="start" fill="#222" font-size="12">II and III are valid /21 blocks (2048 addresses, enough for 1500) inside the /17. I is not a block; IV is outside.</text>
</svg>
