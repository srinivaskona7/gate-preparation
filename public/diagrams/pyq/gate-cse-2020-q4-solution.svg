<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5">
<title>Order of the five micro-steps for R0 = R1 + R2: fetch 3, decode 5, then 2, 1, 4</title>
<g fill="#222" stroke="none"><text x="10" y="20" font-weight="bold">Time</text><text x="70" y="20" font-weight="bold">Step</text><text x="130" y="20" font-weight="bold">Micro-operations</text><text x="400" y="20" font-weight="bold">Phase</text></g>
<path d="M5 28H550"/>
<g fill="#222" stroke="none">
<text x="10" y="55">t1</text><text x="70" y="55">3</text><text x="130" y="55">PC_r, MAR_w, MEM_r</text><text x="400" y="55">fetch</text>
<text x="10" y="95">t2</text><text x="70" y="95">5</text><text x="130" y="95">MDR_r, IR_w</text><text x="400" y="95">fetch (IR loaded)</text>
<text x="10" y="135">t3</text><text x="70" y="135">2</text><text x="130" y="135">R1_r, TEMP1_w</text><text x="400" y="135">execute</text>
<text x="10" y="175">t4</text><text x="70" y="175">1</text><text x="130" y="175">R2_r, TEMP1_r, ALU_add, TEMP2_w</text><text x="400" y="175">execute</text>
<text x="10" y="215">t5</text><text x="70" y="215">4</text><text x="130" y="215">TEMP2_r, R0_w</text><text x="400" y="215">write back</text>
<text x="10" y="270">Answer: 3, 5, 2, 1, 4 = option (C)</text></g>
<path d="M30 60V80M30 100V120M30 140V160M30 180V200" stroke-dasharray="3 3"/>
</svg>
