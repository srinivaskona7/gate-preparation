<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="sans-serif" font-size="12" fill="none" stroke="#222" stroke-width="1.5">
<title>Single-bus data path: MAR, MDR, IR, PC and registers R0 to R7 on one bus, with TEMP1, TEMP2 and the ALU</title>
<path d="M10 40H510"/><text x="250" y="30" text-anchor="middle" fill="#222" stroke="none">BUS</text>
<rect x="20" y="90" width="50" height="30"/><text x="45" y="110" text-anchor="middle" fill="#222" stroke="none">MAR</text>
<rect x="75" y="90" width="50" height="30"/><text x="100" y="110" text-anchor="middle" fill="#222" stroke="none">MDR</text>
<rect x="130" y="90" width="50" height="30"/><text x="155" y="110" text-anchor="middle" fill="#222" stroke="none">IR</text>
<rect x="185" y="90" width="50" height="30"/><text x="210" y="110" text-anchor="middle" fill="#222" stroke="none">PC</text>
<rect x="245" y="90" width="50" height="30"/><text x="270" y="110" text-anchor="middle" fill="#222" stroke="none">R0..R7</text>
<rect x="440" y="60" width="60" height="26"/><text x="470" y="78" text-anchor="middle" fill="#222" stroke="none">TEMP1</text>
<rect x="330" y="120" width="60" height="26"/><text x="360" y="138" text-anchor="middle" fill="#222" stroke="none">TEMP2</text>
<path d="M410 110H500L480 170H430Z"/><text x="455" y="145" text-anchor="middle" fill="#222" stroke="none">ALU</text>
<path d="M45 40V90M100 40V90M155 40V90M210 40V90M270 40V90M360 40V120M470 40V60M470 86V110M360 146V190H455V170M420 40V110"/>
<path d="M45 120V160M100 120V160"/><text x="20" y="180" fill="#222" stroke="none">To Memory</text>
<text x="20" y="240" fill="#222" stroke="none">Every register-to-register move uses the single bus, one value per step.</text>
<text x="20" y="260" fill="#222" stroke="none">R1 + R2: R1 into TEMP1, then R2 on the bus into the left ALU input with TEMP1 on the right, result to TEMP2.</text>
</svg>
