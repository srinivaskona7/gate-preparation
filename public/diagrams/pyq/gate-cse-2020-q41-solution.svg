<text x="20" y="284" text-anchor="start" fill="#222" font-size="13" font-weight="bold">query range [a, b] = [5, 11]</text>
<text x="20" y="306" text-anchor="start" fill="#222" font-size="12">thick: reported (k = 7 keys)</text>
<text x="20" y="326" text-anchor="start" fill="#222" font-size="12">dashed: visited, not reported (4 and 12)</text>
<text x="20" y="346" text-anchor="start" fill="#222" font-size="12">thin: never visited (pruned)</text>
<text x="400" y="306" text-anchor="start" fill="#222" font-size="12">visited nodes = 7 + 2 = 9</text>
<text x="400" y="326" text-anchor="start" fill="#222" font-size="12">Two boundary paths of length about log n,</text>
<text x="400" y="346" text-anchor="start" fill="#222" font-size="12">plus every reported node: Theta(log n + k).</text>
<text x="380" y="392" text-anchor="middle" fill="#222" font-size="12">Each visited node is either reported or on the path to a or to b, so visits &lt;= k + 2 * height.</text>
