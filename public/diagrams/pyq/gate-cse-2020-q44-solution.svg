<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="sans-serif" font-size="13">
<title>Opcode space of the 16-bit format: 8 six-bit I-type opcodes use 2 of 16 four-bit prefixes, 14 remain for R-type</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="#222" font-weight="bold">I-type: 6 + 6 + 4 = 16 bits</text><rect x="20" y="40" width="150" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="95" y="55" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="95" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="170" y="40" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="245" y="55" text-anchor="middle" fill="#222" font-size="12">register</text><text x="245" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="320" y="40" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="370" y="55" text-anchor="middle" fill="#222" font-size="12">imm</text><text x="370" y="67" text-anchor="middle" fill="#222" font-size="10">4 b</text><text x="20" y="92" text-anchor="start" fill="#222" font-weight="bold">R-type: 4 + 6 + 6 = 16 bits</text><rect x="20" y="100" width="100" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="70" y="115" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="70" y="127" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="120" y="100" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="195" y="115" text-anchor="middle" fill="#222" font-size="12">register</text><text x="195" y="127" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="270" y="100" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="345" y="115" text-anchor="middle" fill="#222" font-size="12">register</text><text x="345" y="127" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="157" text-anchor="start" fill="#222" font-weight="bold">The 16 four-bit prefixes</text><rect x="20" y="165" width="41" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="40.5" y="184" text-anchor="middle" fill="#222" font-size="11">0000</text><rect x="61" y="165" width="41" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="81.5" y="184" text-anchor="middle" fill="#222" font-size="11">0001</text><rect x="102" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="122.5" y="184" text-anchor="middle" fill="#222" font-size="11">0010</text><rect x="143" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="163.5" y="184" text-anchor="middle" fill="#222" font-size="11">0011</text><rect x="184" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="204.5" y="184" text-anchor="middle" fill="#222" font-size="11">0100</text><rect x="225" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="245.5" y="184" text-anchor="middle" fill="#222" font-size="11">0101</text><rect x="266" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="286.5" y="184" text-anchor="middle" fill="#222" font-size="11">0110</text><rect x="307" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="327.5" y="184" text-anchor="middle" fill="#222" font-size="11">0111</text><rect x="348" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="368.5" y="184" text-anchor="middle" fill="#222" font-size="11">1000</text><rect x="389" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="409.5" y="184" text-anchor="middle" fill="#222" font-size="11">1001</text><rect x="430" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="450.5" y="184" text-anchor="middle" fill="#222" font-size="11">1010</text><rect x="471" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="491.5" y="184" text-anchor="middle" fill="#222" font-size="11">1011</text><rect x="512" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="532.5" y="184" text-anchor="middle" fill="#222" font-size="11">1100</text><rect x="553" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="573.5" y="184" text-anchor="middle" fill="#222" font-size="11">1101</text><rect x="594" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="614.5" y="184" text-anchor="middle" fill="#222" font-size="11">1110</text><rect x="635" y="165" width="41" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="655.5" y="184" text-anchor="middle" fill="#222" font-size="11">1111</text><text x="20" y="220" text-anchor="start" fill="#222" font-size="12">Each prefix grows to 4 six-bit codes, so 8 I-type opcodes use 2 prefixes (shaded). 14 prefixes are free for R-type.</text>
</svg>
