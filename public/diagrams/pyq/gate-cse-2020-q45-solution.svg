<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif">
<title>For n = 3 and a = (1, 0, 1), the eight strings x pair up by flipping x1; each pair holds one string with x1 + x3 even and one with it odd, so exactly half are odd</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<text x="330" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">n = 3, a = (1, 0, 1): the sum is x1 + x3. Flip the bit x1 (where a1 = 1) to pair the strings.</text>
<rect x="30" y="60" width="140" height="130" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="75" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">000</text>
<text x="130" y="95" text-anchor="middle" font-size="13" fill="#222">even</text>
<text x="75" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">100</text>
<text x="130" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">odd</text>
<line x1="100" y1="108" x2="100" y2="128" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="100" y="207" text-anchor="middle" font-size="11" fill="#222">one even, one odd</text>
<rect x="185" y="60" width="140" height="130" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="230" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">001</text>
<text x="285" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">odd</text>
<text x="230" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">101</text>
<text x="285" y="150" text-anchor="middle" font-size="13" fill="#222">even</text>
<line x1="255" y1="108" x2="255" y2="128" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="255" y="207" text-anchor="middle" font-size="11" fill="#222">one even, one odd</text>
<rect x="340" y="60" width="140" height="130" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="385" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">010</text>
<text x="440" y="95" text-anchor="middle" font-size="13" fill="#222">even</text>
<text x="385" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">110</text>
<text x="440" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">odd</text>
<line x1="410" y1="108" x2="410" y2="128" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="410" y="207" text-anchor="middle" font-size="11" fill="#222">one even, one odd</text>
<rect x="495" y="60" width="140" height="130" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="540" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">011</text>
<text x="595" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">odd</text>
<text x="540" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">111</text>
<text x="595" y="150" text-anchor="middle" font-size="13" fill="#222">even</text>
<line x1="565" y1="108" x2="565" y2="128" stroke="#222" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="565" y="207" text-anchor="middle" font-size="11" fill="#222">one even, one odd</text>
<text x="330" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Every pair has exactly one odd string, so 4 of the 8 strings are odd.</text>
<text x="330" y="285" text-anchor="middle" font-size="13" fill="#222">P(odd) = 4/8 = 1/2 for any non-zero a, because some a_j = 1 exists to flip.</text>
</svg>
