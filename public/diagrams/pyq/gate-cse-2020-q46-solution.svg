<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 284" font-family="sans-serif" font-size="13">
<title>Table of the five calls fun2(5) to fun2(1): fun1 returns 5, 9, 12, 14, 15 and fun2 accumulates 5, 14, 26, 40, 55</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">fun1 has its own static i1 that only grows; fun2 adds fun1(n) into its own static i2</text>
<rect x="20" y="40" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">call</text>
<rect x="130" y="40" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">fun1(n) raises i1 by n</text>
<rect x="290" y="40" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">fun1 returns i1</text>
<rect x="440" y="40" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">i2 = i2 + fun1(n)</text>
<rect x="20" y="70" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="89" fill="#222" text-anchor="middle" font-size="12">fun2(5)</text>
<rect x="130" y="70" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="89" fill="#222" text-anchor="middle" font-size="12">i1: 0 -&gt; 5</text>
<rect x="290" y="70" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="89" fill="#222" text-anchor="middle" font-size="12">5</text>
<rect x="440" y="70" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="89" fill="#222" text-anchor="middle" font-size="12">0 + 5 = 5</text>
<rect x="20" y="100" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="119" fill="#222" text-anchor="middle" font-size="12">fun2(4)</text>
<rect x="130" y="100" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="119" fill="#222" text-anchor="middle" font-size="12">i1: 5 -&gt; 9</text>
<rect x="290" y="100" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="119" fill="#222" text-anchor="middle" font-size="12">9</text>
<rect x="440" y="100" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="119" fill="#222" text-anchor="middle" font-size="12">5 + 9 = 14</text>
<rect x="20" y="130" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="149" fill="#222" text-anchor="middle" font-size="12">fun2(3)</text>
<rect x="130" y="130" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="149" fill="#222" text-anchor="middle" font-size="12">i1: 9 -&gt; 12</text>
<rect x="290" y="130" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="149" fill="#222" text-anchor="middle" font-size="12">12</text>
<rect x="440" y="130" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="149" fill="#222" text-anchor="middle" font-size="12">14 + 12 = 26</text>
<rect x="20" y="160" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="179" fill="#222" text-anchor="middle" font-size="12">fun2(2)</text>
<rect x="130" y="160" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="179" fill="#222" text-anchor="middle" font-size="12">i1: 12 -&gt; 14</text>
<rect x="290" y="160" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="179" fill="#222" text-anchor="middle" font-size="12">14</text>
<rect x="440" y="160" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="179" fill="#222" text-anchor="middle" font-size="12">26 + 14 = 40</text>
<rect x="20" y="190" width="110" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">fun2(1)</text>
<rect x="130" y="190" width="160" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">i1: 14 -&gt; 15</text>
<rect x="290" y="190" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="365" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">15</text>
<rect x="440" y="190" width="190" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">40 + 15 = 55</text>
<text x="20" y="246" fill="#222" font-size="12">fun1(n) calls itself n times, each ++i, so i1 grows by n per call. fun2(0) does nothing and returns i2.</text>
<text x="20" y="268" fill="#222" font-size="13" font-weight="bold">fun2(5) returns 5 + 9 + 12 + 14 + 15 = 55.</text>
</svg>
