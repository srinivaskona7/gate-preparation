<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 224" font-family="sans-serif" font-size="13">
<title>Trace of pp(3,4): bits 0, 0, 1; ex goes 3, 9, 81 and tot becomes 81 at the bit that is 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">pp(3, 4): tob stores the bits of b = 4 least significant first: arr = [0, 0, 1], len = 3</text>
<rect x="20" y="40" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="50" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">i</text>
<rect x="80" y="40" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="120" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">arr[i]</text>
<rect x="160" y="40" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="270" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">tot</text>
<rect x="380" y="40" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="490" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">ex after the pass</text>
<rect x="20" y="70" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="50" y="89" fill="#222" text-anchor="middle" font-size="12">0</text>
<rect x="80" y="70" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="120" y="89" fill="#222" text-anchor="middle" font-size="12">0</text>
<rect x="160" y="70" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="270" y="89" fill="#222" text-anchor="middle" font-size="12">skip: tot = 1</text>
<rect x="380" y="70" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="490" y="89" fill="#222" text-anchor="middle" font-size="12">3 * 3 = 9</text>
<rect x="20" y="100" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="50" y="119" fill="#222" text-anchor="middle" font-size="12">1</text>
<rect x="80" y="100" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="120" y="119" fill="#222" text-anchor="middle" font-size="12">0</text>
<rect x="160" y="100" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="270" y="119" fill="#222" text-anchor="middle" font-size="12">skip: tot = 1</text>
<rect x="380" y="100" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="490" y="119" fill="#222" text-anchor="middle" font-size="12">9 * 9 = 81</text>
<rect x="20" y="130" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="50" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">2</text>
<rect x="80" y="130" width="80" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="120" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">1</text>
<rect x="160" y="130" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="270" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">tot = 1 * 81 = 81</text>
<rect x="380" y="130" width="220" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="490" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">81 * 81 (unused)</text>
<text x="20" y="186" fill="#222" font-size="12">ex runs through a, a^2, a^4: the powers of a for the bit positions. tot multiplies in ex where the bit is 1.</text>
<text x="20" y="208" fill="#222" font-size="13" font-weight="bold">Here tot = ex at i = 2 = a^4 = 3^4 = 81.</text>
</svg>
