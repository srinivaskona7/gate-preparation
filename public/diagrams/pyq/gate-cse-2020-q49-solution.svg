<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="sans-serif">
<title>Path v1 v2 v3 ... v99 v100 with every edge of weight 1: the minimum spanning tree has weight 99</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="50" cy="90" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="50" y="94.2" text-anchor="middle" font-size="12" fill="#222">v1</text>
<circle cx="140" cy="90" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="140" y="94.2" text-anchor="middle" font-size="12" fill="#222">v2</text>
<circle cx="230" cy="90" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="230" y="94.2" text-anchor="middle" font-size="12" fill="#222">v3</text>
<circle cx="380" cy="90" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="380" y="94.2" text-anchor="middle" font-size="12" fill="#222">v99</text>
<circle cx="470" cy="90" r="18" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="470" y="94.2" text-anchor="middle" font-size="12" fill="#222">v100</text>
<line x1="68.0" y1="90.0" x2="122.0" y2="90.0" stroke="#222" stroke-width="1.5"/>
<text x="95.0" y="83.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1</text>
<line x1="158.0" y1="90.0" x2="212.0" y2="90.0" stroke="#222" stroke-width="1.5"/>
<text x="185.0" y="83.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1</text>
<line x1="398.0" y1="90.0" x2="452.0" y2="90.0" stroke="#222" stroke-width="1.5"/>
<text x="425.0" y="83.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1</text>
<text x="305" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">...</text>
<line x1="248" y1="90" x2="285" y2="90" stroke="#222" stroke-width="1.5"/><line x1="325" y1="90" x2="362" y2="90" stroke="#222" stroke-width="1.5"/>
<path d="M68.0 90.0 Q140.0 140.0 212.0 90.0" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="140" y="148" text-anchor="middle" font-size="11" fill="#222">(v1,v3): weight 2</text>
<text x="20" y="170" text-anchor="start" font-size="12" fill="#222">Solid: 99 edges of weight 1 = 99. Dashed: weight j - i is the sum of the unit edges it skips.</text>
</svg>
