<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 390" font-family="sans-serif" font-size="13">
<title>Probability tree for the average access time: TLB hit 0.95 costs 120 ns, a miss with a valid page costs 220 ns, a miss with a page fault costs 6220 ns; weighted sum 114.0 + 9.9 + 31.1 = 155.0 ns</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Cost of one memory reference, in ns (t = 20, m = 100, page transfer 5000)</text>
<rect x="20" y="150" width="110" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="75" y="168" fill="#222" text-anchor="middle" font-size="12">reference</text>
<text x="75" y="184" fill="#222" text-anchor="middle" font-size="12">TLB lookup 20</text>
<rect x="250" y="50" width="250" height="44" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="375" y="68" fill="#222" text-anchor="middle" font-size="12">TLB hit, 0.95</text>
<text x="375" y="84" fill="#222" text-anchor="middle" font-size="12">cost 20 + 100 = 120</text>
<text x="520" y="76" fill="#222" font-size="12" font-weight="bold">0.95 x 120 = 114.0</text>
<rect x="250" y="150" width="250" height="44" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="375" y="168" fill="#222" text-anchor="middle" font-size="12">TLB miss, 0.05</text>
<text x="375" y="184" fill="#222" text-anchor="middle" font-size="12">page-table read: 20 + 100</text>
<rect x="560" y="150" width="230" height="44" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="675" y="168" fill="#222" text-anchor="middle" font-size="12">page valid, 0.90</text>
<text x="675" y="184" fill="#222" text-anchor="middle" font-size="12">then data read: 220</text>
<text x="560" y="214" fill="#222" font-size="12" font-weight="bold">0.05 x 0.90 x 220 = 9.9</text>
<rect x="560" y="250" width="230" height="62" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="675" y="268" fill="#222" text-anchor="middle" font-size="12">page fault, 0.10</text>
<text x="675" y="284" fill="#222" text-anchor="middle" font-size="12">220 + service 6000 = 6220</text>
<text x="675" y="300" fill="#222" text-anchor="middle" font-size="12">clean 5000 (0.8), dirty 10000 (0.2)</text>
<text x="560" y="332" fill="#222" font-size="12" font-weight="bold">0.05 x 0.10 x 6220 = 31.1</text>
<path d="M130,160 L250,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M130,175 L250,172" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M500,172 L560,172" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M500,185 L560,281" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="20" y="372" fill="#222" font-size="12" font-weight="bold">Expected cost = 114.0 + 9.9 + 31.1 = 155.0 ns. A TLB hit means the page is resident, so only a miss can fault.</text>
</svg>
