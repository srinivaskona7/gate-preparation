<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 215" width="480" height="215" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Unfolded disc with two wide bars above and below and two tall rectangles left and right</title>
<circle cx="110" cy="110" r="90"/><line x1="110" y1="20" x2="110" y2="200" stroke-dasharray="6 3"/><line x1="20" y1="110" x2="200" y2="110" stroke-dasharray="6 3"/><rect x="80" y="40" width="60" height="10" fill="#222"/><rect x="80" y="170" width="60" height="10" fill="#222"/><rect x="48" y="94" width="10" height="32" fill="#222"/><rect x="162" y="94" width="10" height="32" fill="#222"/><text x="230" y="80" fill="#222" stroke="none" font-size="12">Bar on the vertical crease: mirrors</text><text x="230" y="98" fill="#222" stroke="none" font-size="12">to top and bottom, still wide.</text><text x="230" y="130" fill="#222" stroke="none" font-size="12">Square on the horizontal crease: mirrors</text><text x="230" y="148" fill="#222" stroke="none" font-size="12">into a tall rectangle, left and right.</text><text x="230" y="180" fill="#222" stroke="none" font-size="12" font-weight="bold">Result: option (A).</text>
</svg>
