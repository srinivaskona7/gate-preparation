<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 215" width="420" height="215" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>GATE CSE 2021 Set 1 GA 4: circular sheet folded twice and punched</title>
<circle cx="60" cy="70" r="45"/><line x1="60" y1="25" x2="60" y2="115" stroke-width="1"/><path d="M88 112 Q60 132 36 114" stroke-width="1.2"/><polygon points="32,111 42,110 38,119" fill="#222" stroke="none"/>
<path d="M190 25 A45 45 0 0 0 190 115 Z"/><path d="M190 25 A45 45 0 0 1 190 115" stroke-dasharray="4 3" stroke-width="1"/><line x1="145" y1="70" x2="190" y2="70" stroke-width="1"/><path d="M158 92 Q148 80 160 62" stroke-width="1.2"/><polygon points="156,60 164,66 157,69" fill="#222" stroke="none"/>
<path d="M340 100 L340 40 A60 60 0 0 0 280 100 Z"/><path d="M340 88 A12 12 0 0 0 328 100 L340 100 Z" fill="#222"/><rect x="318" y="50" width="22" height="7" fill="#222"/><rect x="298" y="92" width="8" height="8" fill="#222"/>
<text x="60" y="140" fill="#222" stroke="none" text-anchor="middle" font-size="11">1: right half folds</text><text x="60" y="154" fill="#222" stroke="none" text-anchor="middle" font-size="11">onto the left half</text>
<text x="180" y="140" fill="#222" stroke="none" text-anchor="middle" font-size="11">2: lower half folds up</text><text x="180" y="154" fill="#222" stroke="none" text-anchor="middle" font-size="11">on the horizontal diameter</text>
<text x="335" y="140" fill="#222" stroke="none" text-anchor="middle" font-size="11">3: punch the quarter disc</text><text x="335" y="154" fill="#222" stroke="none" text-anchor="middle" font-size="11">(its corner is the centre)</text>
<text x="10" y="180" fill="#222" stroke="none" font-size="11">Punches: quarter circle at the corner, wide bar touching the</text><text x="10" y="195" fill="#222" stroke="none" font-size="11">vertical edge near its top, small square on the horizontal edge.</text>
