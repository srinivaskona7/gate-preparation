<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 276" font-family="sans-serif">
<title>Sheet M rolled into a cylinder of radius 3 over pi and height 1 with volume 9 over pi, beside sheet N cut into six unit squares forming a cube of volume 1</title>
<text x="20" y="20" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Sheet M: 6 cm by 1 cm</text><rect x="20" y="28" width="180" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="110" y="48" font-size="12" text-anchor="middle" fill="#222">6</text><text x="208" y="48" font-size="12" text-anchor="start" fill="#222">1</text><text x="20" y="80" font-size="11" text-anchor="start" fill="#222">short edges (1 cm) meet: the 6 cm edge</text><text x="20" y="94" font-size="11" text-anchor="start" fill="#222">becomes the circle around the tube</text><ellipse cx="110" cy="128" rx="48" ry="14" fill="#efefef" stroke="#222" stroke-width="1.5"/><line x1="62" y1="128" x2="62" y2="178" stroke="#222" stroke-width="1.5"/><line x1="158" y1="128" x2="158" y2="178" stroke="#222" stroke-width="1.5"/><path d="M 62 178 A 48 14 0 0 0 158 178" fill="none" stroke="#222" stroke-width="1.5"/><path d="M 62 178 A 48 14 0 0 1 158 178" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="4 3"/><line x1="110" y1="128" x2="158" y2="128" stroke="#222" stroke-width="1.2"/><text x="134" y="125" font-size="11" text-anchor="middle" fill="#222">r</text><line x1="168" y1="128" x2="168" y2="178" stroke="#222" stroke-width="1"/><text x="174" y="157.0" font-size="11" text-anchor="start" fill="#222">h = 1</text><text x="20" y="210" font-size="12" text-anchor="start" fill="#222">2πr = 6, so r = 3/π</text><text x="20" y="228" font-size="12" text-anchor="start" fill="#222" font-weight="bold">V = πr²h = π(9/π²)(1) = 9/π</text><text x="290" y="20" font-size="12" text-anchor="start" fill="#222" font-weight="bold">Sheet N: 6 cm by 1 cm</text><rect x="290" y="28" width="30" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><rect x="320" y="28" width="30" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><rect x="350" y="28" width="30" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><rect x="380" y="28" width="30" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><rect x="410" y="28" width="30" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><rect x="440" y="28" width="30" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="380" y="76" font-size="11" text-anchor="middle" fill="#222">six squares of side 1 cm</text><rect x="330" y="126" width="64" height="64" fill="#efefef" stroke="#222" stroke-width="1.5"/><polygon points="330,126 356,100 420,100 394,126" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><polygon points="394,126 420,100 420,164 394,190" fill="#c4c4c4" stroke="#222" stroke-width="1.5"/><text x="362.0" y="162.0" font-size="12" text-anchor="middle" fill="#222">1</text><text x="290" y="228" font-size="12" text-anchor="start" fill="#222">cube: 6 faces of area 1, side 1, V = 1</text><text x="260" y="262" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">ratio = (9/π) / 1 = 9/π</text>
</svg>
