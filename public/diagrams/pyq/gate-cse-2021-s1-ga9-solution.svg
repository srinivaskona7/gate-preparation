<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 284" font-family="sans-serif" font-size="12">
<title>Five Venn pictures of bacteria and pathogens inside microorganisms with the truth of each conclusion; one of I or II holds in all</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="325" y="18" text-anchor="middle" fill="#222" font-size="12">Both circles stay inside Microorganisms. B = bacteria, Pa = pathogens.</text>
<rect x="8" y="30" width="118" height="100" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="67" y="44" text-anchor="middle" fill="#222" font-size="9">Microorganisms</text>
<circle cx="44" cy="88" r="22" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="90" cy="88" r="22" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="44" y="93" text-anchor="middle" fill="#222" font-size="12">B</text>
<text x="90" y="93" text-anchor="middle" fill="#222" font-size="12">Pa</text>
<text x="67" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(a) apart</text>
<text x="67" y="170" text-anchor="middle" fill="#222" font-size="12">I: false</text>
<text x="67" y="188" text-anchor="middle" fill="#222" font-size="12">II none: true</text>
<text x="67" y="206" text-anchor="middle" fill="#222" font-size="12">II not all: true</text>
<rect x="138" y="30" width="118" height="100" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="197" y="44" text-anchor="middle" fill="#222" font-size="9">Microorganisms</text>
<circle cx="182" cy="88" r="26" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="212" cy="88" r="26" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="170" y="93" text-anchor="middle" fill="#222" font-size="12">B</text>
<text x="224" y="93" text-anchor="middle" fill="#222" font-size="12">Pa</text>
<text x="197" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(b) overlap</text>
<text x="197" y="170" text-anchor="middle" fill="#222" font-size="12">I: true</text>
<text x="197" y="188" text-anchor="middle" fill="#222" font-size="12">II none: false</text>
<text x="197" y="206" text-anchor="middle" fill="#222" font-size="12">II not all: true</text>
<rect x="268" y="30" width="118" height="100" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="327" y="44" text-anchor="middle" fill="#222" font-size="9">Microorganisms</text>
<circle cx="327" cy="88" r="34" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="327" cy="98" r="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="327" y="70" text-anchor="middle" fill="#222" font-size="12">B</text>
<text x="327" y="102" text-anchor="middle" fill="#222" font-size="11">Pa</text>
<text x="327" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(c) Pa inside B</text>
<text x="327" y="170" text-anchor="middle" fill="#222" font-size="12">I: true</text>
<text x="327" y="188" text-anchor="middle" fill="#222" font-size="12">II none: false</text>
<text x="327" y="206" text-anchor="middle" fill="#222" font-size="12">II not all: false</text>
<rect x="398" y="30" width="118" height="100" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="457" y="44" text-anchor="middle" fill="#222" font-size="9">Microorganisms</text>
<circle cx="457" cy="88" r="34" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="457" cy="98" r="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="457" y="70" text-anchor="middle" fill="#222" font-size="12">Pa</text>
<text x="457" y="102" text-anchor="middle" fill="#222" font-size="11">B</text>
<text x="457" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(d) B inside Pa</text>
<text x="457" y="170" text-anchor="middle" fill="#222" font-size="12">I: true</text>
<text x="457" y="188" text-anchor="middle" fill="#222" font-size="12">II none: false</text>
<text x="457" y="206" text-anchor="middle" fill="#222" font-size="12">II not all: true</text>
<rect x="528" y="30" width="118" height="100" rx="8" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="587" y="44" text-anchor="middle" fill="#222" font-size="9">Microorganisms</text>
<circle cx="587" cy="88" r="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="587" y="93" text-anchor="middle" fill="#222" font-size="12">B = Pa</text>
<text x="587" y="150" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">(e) B = Pa</text>
<text x="587" y="170" text-anchor="middle" fill="#222" font-size="12">I: true</text>
<text x="587" y="188" text-anchor="middle" fill="#222" font-size="12">II none: false</text>
<text x="587" y="206" text-anchor="middle" fill="#222" font-size="12">II not all: false</text>
<text x="325" y="232" text-anchor="middle" fill="#222" font-size="11">I = some pathogens are bacteria.  II none = no pathogen is a bacterium.</text>
<text x="325" y="248" text-anchor="middle" fill="#222" font-size="11">II not all = some pathogen is not a bacterium.</text>
<text x="325" y="270" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Neither conclusion holds in every picture; in every picture at least one of I and II holds.</text>
</svg>
