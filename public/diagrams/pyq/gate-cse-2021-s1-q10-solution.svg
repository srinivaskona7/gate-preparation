<circle cx="106" cy="72" r="22" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="242" y="200" text-anchor="start" fill="#222" font-size="11" font-weight="bold">max</text>
<text x="150" y="26" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">root has a right child</text>
<text x="150" y="250" text-anchor="middle" fill="#222" font-size="12">return the root: 50 &lt; max</text>
<line x1="583.1" y1="80.2" x2="500.9" y2="125.8" stroke="#222" stroke-width="1.6"/>
<line x1="474.6" y1="146.6" x2="441.4" y2="183.4" stroke="#222" stroke-width="1.6"/>
