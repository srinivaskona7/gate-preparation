<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif" font-size="13">
<title>Left: BST whose root 50 has a right child, so 50 is smaller than the maximum 70 and the answer is the root; right: BST whose root 90 has no right child, so 90 is the maximum and its left child 40 is smaller</title>
