<text x="486" y="138.42" text-anchor="middle" fill="#222" font-size="13">40</text>
<circle cx="430" cy="196" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="430" y="200.42" text-anchor="middle" fill="#222" font-size="13">20</text>
<circle cx="542" cy="196" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="542" y="200.42" text-anchor="middle" fill="#222" font-size="13">60</text>
<text x="622" y="76" text-anchor="start" fill="#222" font-size="11" font-weight="bold">max</text>
