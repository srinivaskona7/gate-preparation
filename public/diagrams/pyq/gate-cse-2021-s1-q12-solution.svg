<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="sans-serif" font-size="13">
<title>Grid of four problems: emptiness and universality for DFAs and for PDAs; only PDA universality is not recursive</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="255" y="28" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">L(M) is empty</text>
<text x="535" y="28" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">L(M) is all strings</text>
<text x="20" y="100" text-anchor="start" fill="#222" font-size="13" font-weight="bold">M is a DFA</text>
<text x="20" y="195" text-anchor="start" fill="#222" font-size="13" font-weight="bold">M is a PDA</text>
<rect x="130" y="40" width="250" height="80" rx="6" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="255.0" y="74" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">(A) recursive</text>
<text x="255.0" y="96" text-anchor="middle" fill="#222" font-size="12">empty iff no accepting state reachable</text>
<rect x="410" y="40" width="250" height="80" rx="6" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="535.0" y="74" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">(B) recursive</text>
<text x="535.0" y="96" text-anchor="middle" fill="#222" font-size="12">all iff every reachable state accepts</text>
<rect x="130" y="135" width="250" height="80" rx="6" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="255.0" y="169" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">(C) recursive</text>
<text x="255.0" y="191" text-anchor="middle" fill="#222" font-size="12">empty iff start variable derives nothing</text>
<rect x="410" y="135" width="250" height="80" rx="6" fill="none" stroke="#222" stroke-width="3"/>
<text x="535.0" y="169" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">(D) NOT recursive</text>
<text x="535.0" y="191" text-anchor="middle" fill="#222" font-size="12">no algorithm exists</text>
</svg>
