<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Linear directory list foo: create and rename scan every entry, delete and open stop at the match</title>
<text x="10" y="22" font-weight="bold" stroke="none">Directory foo as a linear list of (name, metadata) nodes</text>
<g fill="none" stroke-width="1.5"><rect x="10" y="34" width="90" height="34"/><rect x="110" y="34" width="90" height="34"/><rect x="210" y="34" width="90" height="34"/><rect x="310" y="34" width="90" height="34"/><rect x="410" y="34" width="90" height="34"/></g>
<g stroke="none" text-anchor="middle"><text x="55" y="56">f1</text><text x="155" y="56">f2</text><text x="255" y="56">f3</text><text x="355" y="56">f4</text><text x="455" y="56">...fn</text></g>
<path d="M10 90 H500" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<text x="510" y="94" stroke="none">full scan</text>
<text x="10" y="124" stroke="none">A  Create: must prove the name is absent, so reads f1 to fn. Full scan.</text>
<text x="10" y="146" stroke="none">B  Delete: stops once the name is found (f2 above). Early exit.</text>
<text x="10" y="168" stroke="none">C  Rename: must find the old name and prove the new one absent. Full scan.</text>
<text x="10" y="190" stroke="none">D  Open: stops once the name is found. Early exit.</text>
<text x="10" y="216" font-weight="bold" stroke="none">Answer: A and C</text>
</svg>
