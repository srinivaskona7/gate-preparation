<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="sans-serif" font-size="13">
<title>Six jobs J1 easiest to J6 toughest and three computers fast, middle and slow: J6 goes to the fast computer, J1 to the slow one, and each of J2 to J5 has 3 choices, 81 ways, minus 16 ways that leave the middle computer empty, 65</title>
<circle cx="60" cy="50" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="54.6" text-anchor="middle" fill="#222" font-size="13">J6</text>
<circle cx="60" cy="95" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="99.6" text-anchor="middle" fill="#222" font-size="13">J5</text>
<circle cx="60" cy="140" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="144.6" text-anchor="middle" fill="#222" font-size="13">J4</text>
<circle cx="60" cy="185" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="189.6" text-anchor="middle" fill="#222" font-size="13">J3</text>
<circle cx="60" cy="230" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="234.6" text-anchor="middle" fill="#222" font-size="13">J2</text>
<circle cx="60" cy="275" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="279.6" text-anchor="middle" fill="#222" font-size="13">J1</text>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="12">Jobs (toughest at the top)</text>
<rect x="420" y="48" width="130" height="44" rx="6" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="485" y="75" text-anchor="middle" fill="#222" font-size="12">fast computer</text>
<rect x="420" y="138" width="130" height="44" rx="6" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="485" y="165" text-anchor="middle" fill="#222" font-size="12">middle computer</text>
<rect x="420" y="228" width="130" height="44" rx="6" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="485" y="255" text-anchor="middle" fill="#222" font-size="12">slow computer</text>
<line x1="77.0" y1="50.0" x2="420.0" y2="66.0" stroke="#222" stroke-width="2.8"/>
<polygon points="420.0,66.0 410.8,70.1 411.2,61.1" fill="#222"/>
<line x1="77.0" y1="275.0" x2="420.0" y2="250.0" stroke="#222" stroke-width="2.8"/>
<polygon points="420.0,250.0 411.4,255.1 410.7,246.2" fill="#222"/>
<line x1="77.0" y1="95.0" x2="420.0" y2="70.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="95.0" x2="420.0" y2="160.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="95.0" x2="420.0" y2="250.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="140.0" x2="420.0" y2="70.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="140.0" x2="420.0" y2="160.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="140.0" x2="420.0" y2="250.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="185.0" x2="420.0" y2="70.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="185.0" x2="420.0" y2="160.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="185.0" x2="420.0" y2="250.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="230.0" x2="420.0" y2="70.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="230.0" x2="420.0" y2="160.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<line x1="77.0" y1="230.0" x2="420.0" y2="250.0" stroke="#222" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="570" y="70" text-anchor="start" fill="#222" font-size="12">J6 only</text>
<text x="570" y="250" text-anchor="start" fill="#222" font-size="12">J1 only</text>
<text x="570" y="160" text-anchor="start" fill="#222" font-size="12">needs at least</text>
<text x="570" y="176" text-anchor="start" fill="#222" font-size="12">one of J2 to J5</text>
<text x="20" y="330" text-anchor="start" fill="#222" font-size="12">J2..J5 each pick any of 3 computers: 3^4 = 81. Remove those that skip the middle computer: 2^4 = 16.</text>
<text x="20" y="356" text-anchor="start" fill="#222" font-size="13" font-weight="bold">81 - 16 = 65</text>
</svg>
