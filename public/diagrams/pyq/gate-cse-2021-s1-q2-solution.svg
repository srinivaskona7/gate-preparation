<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 298" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Pairing method for the minimum and maximum of eight numbers: 4 pair comparisons, 3 for the maximum, 3 for the minimum, 10 in all</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="12" y="16" text-anchor="start" font-size="12">array: 4 pairs, 1 comparison each, the larger of a pair goes up, the smaller goes down</text>
<rect x="27" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="55" y="43" text-anchor="middle">7</text>
<rect x="91" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="119" y="43" text-anchor="middle">2</text>
<rect x="155" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="183" y="43" text-anchor="middle">9</text>
<rect x="219" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="247" y="43" text-anchor="middle">4</text>
<rect x="283" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="311" y="43" text-anchor="middle">1</text>
<rect x="347" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="375" y="43" text-anchor="middle">8</text>
<rect x="411" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="439" y="43" text-anchor="middle">3</text>
<rect x="475" y="24" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="503" y="43" text-anchor="middle">6</text>
<line x1="55" y1="56" x2="55" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="55" y1="62" x2="117" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="117" y1="62" x2="117" y2="56" stroke="#1f2937" stroke-width="1.2"/>
<line x1="86" y1="62" x2="86" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="183" y1="56" x2="183" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="183" y1="62" x2="245" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="245" y1="62" x2="245" y2="56" stroke="#1f2937" stroke-width="1.2"/>
<line x1="214" y1="62" x2="214" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="311" y1="56" x2="311" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="311" y1="62" x2="373" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="373" y1="62" x2="373" y2="56" stroke="#1f2937" stroke-width="1.2"/>
<line x1="342" y1="62" x2="342" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<line x1="439" y1="56" x2="439" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="439" y1="62" x2="501" y2="62" stroke="#1f2937" stroke-width="1.2"/><line x1="501" y1="62" x2="501" y2="56" stroke="#1f2937" stroke-width="1.2"/>
<line x1="470" y1="62" x2="470" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<rect x="58" y="102" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="86" y="121" text-anchor="middle">7</text>
<rect x="186" y="102" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="214" y="121" text-anchor="middle">9</text>
<rect x="314" y="102" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="342" y="121" text-anchor="middle">8</text>
<rect x="442" y="102" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="#d1d5db"/><text x="470" y="121" text-anchor="middle">6</text>
<text x="12" y="160" text-anchor="start">max of the winners: 7 vs 9, 8 vs 6, then 9 vs 8 = 3 comparisons, max = 9</text>
<text x="12" y="186" text-anchor="start">the smaller of each pair:</text>
<rect x="58" y="200" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="86" y="219" text-anchor="middle">2</text>
<rect x="186" y="200" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="214" y="219" text-anchor="middle">4</text>
<rect x="314" y="200" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="342" y="219" text-anchor="middle">1</text>
<rect x="442" y="200" width="56" height="28" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="470" y="219" text-anchor="middle">3</text>
<text x="12" y="252" text-anchor="start">min of the losers: 2 vs 4, 1 vs 3, then 2 vs 1 = 3 comparisons, min = 1</text>
<text x="12" y="280" text-anchor="start" font-weight="bold">Total 4 + 3 + 3 = 10 = 3n/2 - 2 for n = 8; the plain method needs 2n - 2 = 14.</text>
</svg>
