<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="13">
<title>Stack and queue contents after each operation: the stack gives s = 62 and the queue gives q = 24, so s + q = 86</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Stack (bottom to top)</text>
<text x="10" y="63" text-anchor="start" fill="#222" font-size="12">push(54)</text>
<rect x="106" y="46" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="64.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<text x="10" y="101" text-anchor="start" fill="#222" font-size="12">push(52)</text>
<rect x="106" y="84" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="102.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<rect x="140" y="84" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="157.0" y="102.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">52</text>
<text x="10" y="139" text-anchor="start" fill="#222" font-size="12">pop()</text>
<rect x="106" y="122" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="140.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<text x="216" y="140" text-anchor="start" fill="#6b7280" font-size="11">returns 52, dropped</text>
<text x="10" y="177" text-anchor="start" fill="#222" font-size="12">push(55)</text>
<rect x="106" y="160" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="178.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<rect x="140" y="160" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="157.0" y="178.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">55</text>
<text x="10" y="215" text-anchor="start" fill="#222" font-size="12">push(62)</text>
<rect x="106" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<rect x="140" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="157.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">55</text>
<rect x="174" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="191.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">62</text>
<text x="10" y="253" text-anchor="start" fill="#222" font-size="12">s = pop()</text>
<rect x="106" y="236" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="123.0" y="254.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">54</text>
<rect x="140" y="236" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="157.0" y="254.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">55</text>
<text x="216" y="254" text-anchor="start" fill="#1d4ed8" font-size="11" font-weight="bold">s = 62</text>
<text x="380" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Queue (front to back)</text>
<text x="380" y="63" text-anchor="start" fill="#222" font-size="12">enqueue(21)</text>
<rect x="476" y="46" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="64.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">21</text>
<text x="380" y="101" text-anchor="start" fill="#222" font-size="12">enqueue(24)</text>
<rect x="476" y="84" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="102.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">21</text>
<rect x="510" y="84" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="527.0" y="102.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">24</text>
<text x="380" y="139" text-anchor="start" fill="#222" font-size="12">dequeue()</text>
<rect x="476" y="122" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="140.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">24</text>
<text x="586" y="140" text-anchor="start" fill="#6b7280" font-size="11">returns 21, dropped</text>
<text x="380" y="177" text-anchor="start" fill="#222" font-size="12">enqueue(28)</text>
<rect x="476" y="160" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="178.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">24</text>
<rect x="510" y="160" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="527.0" y="178.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">28</text>
<text x="380" y="215" text-anchor="start" fill="#222" font-size="12">enqueue(32)</text>
<rect x="476" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">24</text>
<rect x="510" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="527.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">28</text>
<rect x="544" y="198" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="561.0" y="216.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">32</text>
<text x="380" y="253" text-anchor="start" fill="#222" font-size="12">q = dequeue()</text>
<rect x="476" y="236" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="493.0" y="254.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">28</text>
<rect x="510" y="236" width="34" height="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="527.0" y="254.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">32</text>
<text x="586" y="254" text-anchor="start" fill="#1d4ed8" font-size="11" font-weight="bold">q = 24</text>
<text x="10" y="290" text-anchor="start" fill="#222" font-size="15" font-weight="bold">s + q = 62 + 24 = 86</text>
</svg>
