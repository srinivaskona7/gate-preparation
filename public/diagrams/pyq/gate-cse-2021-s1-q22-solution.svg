<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Address split for a 32 KB direct-mapped cache with 64-byte blocks: 17 tag bits, 9 index bits, 6 offset bits</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Byte address of a direct-mapped cache: 32 KB cache, 64-byte blocks, 2^32 bytes of memory</text><rect x="20" y="62" width="309.71659919028343" height="44" stroke-width="2"/><text x="174.85829959514172" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="174.85829959514172" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">17 bits = 32 - 9 - 6</text><text x="23" y="56" fill="#1f2937" stroke="none" font-size="10">31</text><text x="326.71659919028343" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">15</text><rect x="329.71659919028343" y="62" width="163.9676113360324" height="44" stroke-width="2"/><text x="411.70040485829963" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index (line)</text><text x="411.70040485829963" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">9 bits: 512 lines</text><text x="332.71659919028343" y="56" fill="#1f2937" stroke="none" font-size="10">14</text><text x="490.68421052631584" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">6</text><rect x="493.68421052631584" y="62" width="126.3157894736842" height="44" stroke-width="2"/><text x="556.8421052631579" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="556.8421052631579" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">6 bits: 64 bytes</text><text x="496.68421052631584" y="56" fill="#1f2937" stroke="none" font-size="10">5</text><text x="617" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">0</text><text x="20" y="135" fill="#1f2937" stroke="none">Lines = 32 KB / 64 B = 2^15 / 2^6 = 2^9 = 512, so 9 index bits.</text><text x="20" y="155" fill="#1f2937" stroke="none">Offset = log2 64 = 6 bits. Address = log2 2^32 = 32 bits.</text><text x="20" y="175" fill="#1f2937" stroke="none" font-weight="bold">Tag = 32 - 9 - 6 = 17 bits.</text></svg>
