<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
<title>Decoding sign 1, exponent 10000001 and fraction 1111 as a single-precision number gives minus 7.75</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">The three fields as printed</text>
<text x="20" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
<rect x="20" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="29.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">1</text>
<text x="44" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">exponent E (8 bits)</text>
<rect x="44" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="53.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="62" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="71.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="80" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="89.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="98" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="107.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="116" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="125.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="134" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="143.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="152" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="161.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0</text>
<rect x="170" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="179.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<text x="194" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">fraction F (23 bits)</text>
<rect x="194" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="203.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="212" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="221.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="230" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="239.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="248" y="58" width="18" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="257.0" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1</text>
<rect x="266" y="58" width="56" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="294.0" y="75.2" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0 ... 0</text>
<text x="20" y="112" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">S = 1</text>
<text x="110" y="112" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">E = 10000001 = 129, so the power is 129 - 127 = 2</text>
<text x="20" y="144" font-size="13" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">F = 1111 followed by zeros, so the significand is 1.1111 in binary:</text>
<text x="20" y="170" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">1 + 1/2 + 1/4 + 1/8 + 1/16 = 1.9375</text>
<text x="20" y="206" font-size="15" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">value = (-1)^1 x 1.9375 x 2^2 = -7.75</text>
<text x="20" y="238" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Shift check: 1.1111 binary shifted left twice is 111.11 binary = 4 + 2 + 1 + 0.5 + 0.25 = 7.75, sign negative.</text>
</svg>
