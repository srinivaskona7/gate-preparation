<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img">
<title>Self join with age &gt; age1: everyone who is older than someone</title>
<rect x="30.0" y="52.0" width="80" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="70" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e5  18</text>
<rect x="135.0" y="52.0" width="80" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="175" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e2  25</text>
<rect x="240.0" y="52.0" width="80" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="280" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e3  25</text>
<rect x="345.0" y="52.0" width="80" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="385" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e1  30</text>
<rect x="450.0" y="52.0" width="80" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="490" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e4  40</text>
<line x1="110" y1="70" x2="135" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<line x1="215" y1="70" x2="240" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<line x1="320" y1="70" x2="345" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<line x1="425" y1="70" x2="450" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<text x="280" y="28" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">age grows left to right (ties e2, e3 are not older than each other)</text>
<text x="70" y="115" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">minimum:</text>
<text x="70" y="132" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">never older</text>
<text x="70" y="149" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">than anyone</text>
<text x="350" y="150" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">e2, e3, e1, e4 appear in the output; e5 does not</text>
</svg>
