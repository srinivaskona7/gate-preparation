<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="sans-serif" font-size="13">
<title>Three T flip-flops P, Q, R on one clock pulse line: T of P is R, T of Q is P', T of R is Q'</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="110" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="132" y="104" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">P</text>
<polyline points="110,130 121,138 110,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="171" y="100" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="171" y="140" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<rect x="260" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="282" y="104" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">Q</text>
<polyline points="260,130 271,138 260,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="321" y="100" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="321" y="140" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<rect x="410" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="432" y="104" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">R</text>
<polyline points="410,130 421,138 410,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="471" y="100" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="471" y="140" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<polyline points="480,95 510,95 510,30 70,30 70,95 110,95" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="486" y="89" text-anchor="start" fill="#222" font-size="12">R</text>
<polyline points="180,135 200,135 200,115 240,115 240,95 260,95" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="184" y="130" text-anchor="start" fill="#222" font-size="12">P'</text>
<polyline points="330,135 350,135 350,115 390,115 390,95 410,95" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="334" y="130" text-anchor="start" fill="#222" font-size="12">Q'</text>
<text x="184" y="90" text-anchor="start" fill="#222" font-size="12">P</text>
<text x="334" y="90" text-anchor="start" fill="#222" font-size="12">Q</text>
<line x1="180" y1="95" x2="194" y2="95" stroke="#222" stroke-width="1.6"/>
<line x1="330" y1="95" x2="344" y2="95" stroke="#222" stroke-width="1.6"/>
<polyline points="100,225 396,225" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="94" y="229" text-anchor="end" fill="#222" font-size="12">Clock pulse</text>
<polyline points="96,225 96,138 110,138" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="246,225 246,138 260,138" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="396,225 396,138 410,138" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="280" y="262" text-anchor="middle" fill="#222" font-size="12">Initial PQR = 000</text>
</svg>
