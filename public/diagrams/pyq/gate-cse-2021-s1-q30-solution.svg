<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Recursion tree for T(n) = T(n/2) + T(2n/5) + 7n: level costs 7n, 6.3n, 5.67n form a geometric series dominated by the root</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="500" y="16" text-anchor="middle" font-size="12">size sum</text><text x="600" y="16" text-anchor="middle" font-size="12">level cost</text>
<rect x="199" y="29" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="230" y="49" text-anchor="middle">n</text>
<rect x="99" y="105" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="130" y="125" text-anchor="middle">n/2</text>
<rect x="299" y="105" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="330" y="125" text-anchor="middle">2n/5</text>
<rect x="49" y="181" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="80" y="201" text-anchor="middle">n/4</text>
<rect x="149" y="181" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="180" y="201" text-anchor="middle">n/5</text>
<rect x="249" y="181" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="280" y="201" text-anchor="middle">n/5</text>
<rect x="349" y="181" width="62" height="30" rx="3" stroke="#1f2937" stroke-width="1.2" fill="none"/><text x="380" y="201" text-anchor="middle">4n/25</text>
<line x1="230" y1="59" x2="130" y2="105" stroke="#1f2937" stroke-width="1.2"/><line x1="230" y1="59" x2="330" y2="105" stroke="#1f2937" stroke-width="1.2"/>
<line x1="130" y1="135" x2="80" y2="181" stroke="#1f2937" stroke-width="1.2"/><line x1="130" y1="135" x2="180" y2="181" stroke="#1f2937" stroke-width="1.2"/><line x1="330" y1="135" x2="280" y2="181" stroke="#1f2937" stroke-width="1.2"/><line x1="330" y1="135" x2="380" y2="181" stroke="#1f2937" stroke-width="1.2"/>
<text x="80" y="232" text-anchor="middle" font-size="14">...</text>
<text x="180" y="232" text-anchor="middle" font-size="14">...</text>
<text x="280" y="232" text-anchor="middle" font-size="14">...</text>
<text x="380" y="232" text-anchor="middle" font-size="14">...</text>
<text x="500" y="49" text-anchor="middle">n</text>
<text x="600" y="49" text-anchor="middle">7n</text>
<text x="500" y="125" text-anchor="middle">9n/10</text>
<text x="600" y="125" text-anchor="middle">6.3n</text>
<text x="500" y="201" text-anchor="middle">81n/100</text>
<text x="600" y="201" text-anchor="middle">5.67n</text>
<text x="500" y="252" text-anchor="middle">(9/10)^k n</text>
<text x="600" y="252" text-anchor="middle">7n (9/10)^k</text>
<line x1="450" y1="30" x2="450" y2="262" stroke="#1f2937" stroke-width="1" stroke-dasharray="3 3"/>
<text x="12" y="290" text-anchor="start">Sizes shrink by the factor 1/2 + 2/5 = 9/10 per level, so level costs fall geometrically.</text>
<text x="12" y="312" text-anchor="start" font-weight="bold">Total &lt;= 7n (1 + 0.9 + 0.81 + ...) = 7n / (1 - 0.9) = 70n, and &gt;= 7n, so T(n) = Theta(n).</text>
</svg>
