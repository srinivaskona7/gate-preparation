<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="sans-serif" fill="#1f2937"><title>LL(1) table for S to daT or Rf: cells 1 and 2 are S to Rf, cells 3 and 4 are T to epsilon</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<text x="20" y="24" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Step 1: R and T can vanish, so use FIRST and FOLLOW</text>
<text x="20" y="46" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">FIRST(Rf) = {c, f}     FIRST(daT) = {d}</text>
<text x="20" y="64" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">FOLLOW(R) = {f}     FOLLOW(S) = FOLLOW(T) = {$, c, f}</text>
<text x="20" y="82" font-size="12" text-anchor="start" fill="#1f2937">S is the start symbol, so $ is in FOLLOW(S). R -&gt; caTR puts c = FIRST(R) and f = FOLLOW(R) after T.</text>
<text x="20" y="100" font-size="12" text-anchor="start" fill="#1f2937">S -&gt; daT and T -&gt; aS tie FOLLOW(S) and FOLLOW(T) together, so both are {$, c, f}.</text>
<text x="20" y="122" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Step 2: the table</text>
<rect x="60" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="116.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">a</text>
<rect x="172" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="228.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">b</text>
<rect x="284" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="340.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">c</text>
<rect x="396" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="452.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">d</text>
<rect x="508" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="564.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">f</text>
<rect x="620" y="130" width="112" height="30" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="676.0" y="150" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">$</text>
<rect x="20" y="160" width="40" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="40" y="187" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">S</text>
<rect x="60" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="172" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="284" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="340.0" y="187" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">(1) S-&gt;Rf</text>
<rect x="396" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="452.0" y="187" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">S-&gt;daT</text>
<rect x="508" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="564.0" y="187" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">(2) S-&gt;Rf</text>
<rect x="620" y="160" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="20" y="204" width="40" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="40" y="231" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">T</text>
<rect x="60" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="116.0" y="231" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">T-&gt;aS</text>
<rect x="172" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="228.0" y="231" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">T-&gt;baT</text>
<rect x="284" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="340.0" y="231" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">(3) T-&gt;eps</text>
<rect x="396" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="508" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="564.0" y="231" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">T-&gt;eps</text>
<rect x="620" y="204" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="676.0" y="231" font-size="12" text-anchor="middle" font-weight="bold" font-family="monospace" fill="#1f2937">(4) T-&gt;eps</text>
<rect x="20" y="248" width="40" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="40" y="275" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">R</text>
<rect x="60" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="172" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="284" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="340.0" y="275" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">R-&gt;caTR</text>
<rect x="396" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<rect x="508" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="564.0" y="275" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">R-&gt;eps</text>
<rect x="620" y="248" width="112" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="20" y="320" font-size="12" text-anchor="start" fill="#1f2937">Cell (1): c is in FIRST(Rf), so S -&gt; Rf.   Cell (2): f is in FIRST(Rf) as well, so S -&gt; Rf.</text>
<text x="20" y="340" font-size="12" text-anchor="start" fill="#1f2937">Cells (3) and (4): c and $ are in FOLLOW(T), and T can vanish, so T -&gt; eps goes under every symbol of FOLLOW(T).</text>
<text x="20" y="368" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Matches option (A): (1) S -&gt; Rf, (2) S -&gt; Rf, (3) T -&gt; eps, (4) T -&gt; eps.</text>
</svg>
