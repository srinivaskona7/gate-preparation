<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="sans-serif" font-size="13">
<title>Precedence graphs of S1 (cycle) and S2 (acyclic)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="100" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">S1: cycle, not serializable</text><text x="400" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">S2: acyclic, serializable</text><path d="M82,108.4 Q120,128 152,108.4" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="120" y="129" text-anchor="middle" font-size="12" fill="#111">y</text><path d="M158,91.6 Q120,72 88,91.6" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="120" y="79" text-anchor="middle" font-size="12" fill="#111">x</text><circle cx="60" cy="100" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><circle cx="180" cy="100" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="180" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><path d="M422,100 Q460,100 492,100" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="460" y="94" text-anchor="middle" font-size="12" fill="#111">x and y</text><circle cx="520" cy="100" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="520" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><circle cx="400" cy="100" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="400" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><text x="140" y="178" text-anchor="middle" font-size="12" fill="#111">r1(y) before w2(y): T1 to T2</text><text x="140" y="196" text-anchor="middle" font-size="12" fill="#111">r2(x) before w1(x): T2 to T1</text><text x="410" y="190" text-anchor="middle" font-size="12" fill="#111">serial order T2, T1</text>
</svg>