<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif" font-size="13">
<title>Subgroup diagrams of the two groups of order 6: Z6 is cyclic with subgroups of order 1, 2, 3 and 6, all cyclic; S3 is not cyclic but its subgroups of order 2 and 3 are all cyclic</title>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">G = Z6 (cyclic)</text>
<line x1="170.0" y1="94.0" x2="100.0" y2="156.0" stroke="#222" stroke-width="1.4"/>
<line x1="170.0" y1="94.0" x2="240.0" y2="156.0" stroke="#222" stroke-width="1.4"/>
<line x1="100.0" y1="184.0" x2="170.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<line x1="240.0" y1="184.0" x2="170.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<rect x="122.0" y="66" width="96" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="170" y="84.5" text-anchor="middle" fill="#222" font-size="12">Z6, order 6</text>
<rect x="45.0" y="156" width="110" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="100" y="174.5" text-anchor="middle" fill="#222" font-size="12">{0,3}, order 2</text>
<rect x="185.0" y="156" width="110" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="240" y="174.5" text-anchor="middle" fill="#222" font-size="12">{0,2,4}, order 3</text>
<rect x="122.0" y="256" width="96" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="170" y="274.5" text-anchor="middle" fill="#222" font-size="12">{0}, order 1</text>
<text x="170" y="312" text-anchor="middle" fill="#222" font-size="12">every subgroup is cyclic</text>
<text x="330" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">G = S3 (not cyclic)</text>
<line x1="519.0" y1="94.0" x2="372.0" y2="176.0" stroke="#222" stroke-width="1.4"/>
<line x1="519.0" y1="94.0" x2="470.0" y2="176.0" stroke="#222" stroke-width="1.4"/>
<line x1="519.0" y1="94.0" x2="568.0" y2="176.0" stroke="#222" stroke-width="1.4"/>
<line x1="519.0" y1="94.0" x2="666.0" y2="176.0" stroke="#222" stroke-width="1.4"/>
<line x1="372.0" y1="204.0" x2="519.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<line x1="470.0" y1="204.0" x2="519.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<line x1="568.0" y1="204.0" x2="519.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<line x1="666.0" y1="204.0" x2="519.0" y2="256.0" stroke="#222" stroke-width="1.4"/>
<rect x="471.0" y="66" width="96" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="519" y="84.5" text-anchor="middle" fill="#222" font-size="12">S3, order 6</text>
<rect x="330.0" y="176" width="84" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="372" y="194.5" text-anchor="middle" fill="#222" font-size="12">{e,(12)}</text>
<rect x="428.0" y="176" width="84" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="470" y="194.5" text-anchor="middle" fill="#222" font-size="12">{e,(13)}</text>
<rect x="526.0" y="176" width="84" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="568" y="194.5" text-anchor="middle" fill="#222" font-size="12">{e,(23)}</text>
<rect x="624.0" y="176" width="84" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="666" y="194.5" text-anchor="middle" fill="#222" font-size="12">{e,r,r2}</text>
<rect x="471.0" y="256" width="96" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="1.6"/>
<text x="519" y="274.5" text-anchor="middle" fill="#222" font-size="12">{e}, order 1</text>
<text x="519" y="312" text-anchor="middle" fill="#222" font-size="12">orders 2 and 3: cyclic, but S3 has no element of order 6</text>
<text x="20" y="346" text-anchor="start" fill="#222" font-size="12">H of order 2 or 3 is cyclic in both groups; G need not be cyclic.</text>
</svg>
