<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>Path graph on seven vertices v0 to v6 with diameter 6, and its square graph G2 which adds an edge between vertices two apart; the shortest G2 path v0, v2, v4, v6 has 3 edges, which is ceil(6/2)</title>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">G: path v0 ... v6, diam(G) = 6</text>
<line x1="50.0" y1="60.0" x2="140.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<line x1="140.0" y1="60.0" x2="230.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<line x1="230.0" y1="60.0" x2="320.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<line x1="320.0" y1="60.0" x2="410.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<line x1="410.0" y1="60.0" x2="500.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<line x1="500.0" y1="60.0" x2="590.0" y2="60.0" stroke="#222" stroke-width="1.8"/>
<circle cx="50" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="50" y="64.6" text-anchor="middle" fill="#222" font-size="13">v0</text>
<circle cx="140" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="64.6" text-anchor="middle" fill="#222" font-size="13">v1</text>
<circle cx="230" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="230" y="64.6" text-anchor="middle" fill="#222" font-size="13">v2</text>
<circle cx="320" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="320" y="64.6" text-anchor="middle" fill="#222" font-size="13">v3</text>
<circle cx="410" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="410" y="64.6" text-anchor="middle" fill="#222" font-size="13">v4</text>
<circle cx="500" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="500" y="64.6" text-anchor="middle" fill="#222" font-size="13">v5</text>
<circle cx="590" cy="60" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="590" y="64.6" text-anchor="middle" fill="#222" font-size="13">v6</text>
<text x="20" y="130" text-anchor="start" fill="#222" font-size="13" font-weight="bold">G2: keep those edges and add an edge for every pair two steps apart (dashed)</text>
<line x1="50.0" y1="200.0" x2="140.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<line x1="140.0" y1="200.0" x2="230.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<line x1="230.0" y1="200.0" x2="320.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<line x1="320.0" y1="200.0" x2="410.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<line x1="410.0" y1="200.0" x2="500.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<line x1="500.0" y1="200.0" x2="590.0" y2="200.0" stroke="#222" stroke-width="1.2"/>
<path d="M 50 184 Q 140.0 128 230 184" fill="none" stroke="#222" stroke-width="3.2"/>
<path d="M 140 184 Q 230.0 128 320 184" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 230 184 Q 320.0 128 410 184" fill="none" stroke="#222" stroke-width="3.2"/>
<path d="M 320 184 Q 410.0 128 500 184" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M 410 184 Q 500.0 128 590 184" fill="none" stroke="#222" stroke-width="3.2"/>
<circle cx="50" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="50" y="204.6" text-anchor="middle" fill="#222" font-size="13">v0</text>
<circle cx="140" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="140" y="204.6" text-anchor="middle" fill="#222" font-size="13">v1</text>
<circle cx="230" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="230" y="204.6" text-anchor="middle" fill="#222" font-size="13">v2</text>
<circle cx="320" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="320" y="204.6" text-anchor="middle" fill="#222" font-size="13">v3</text>
<circle cx="410" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="410" y="204.6" text-anchor="middle" fill="#222" font-size="13">v4</text>
<circle cx="500" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="500" y="204.6" text-anchor="middle" fill="#222" font-size="13">v5</text>
<circle cx="590" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="590" y="204.6" text-anchor="middle" fill="#222" font-size="13">v6</text>
<text x="20" y="258" text-anchor="start" fill="#222" font-size="12">Bold: v0 -&gt; v2 -&gt; v4 -&gt; v6, three edges. Distance in G2 = ceil(distance in G / 2).</text>
<text x="20" y="280" text-anchor="start" fill="#222" font-size="12">So diam(G2) = ceil(6/2) = 3, which meets option A with equality.</text>
</svg>
