<rect x="580" y="40" width="70" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="615" y="58" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">count</text>
<rect x="20" y="68" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="45" y="86" fill="#222" text-anchor="middle" font-size="12">-3</text>
