<rect x="300" y="40" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="355" y="58" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">value of i++</text>
<rect x="410" y="40" width="60" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="440" y="58" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">i</text>
