<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 308" font-family="sans-serif" font-size="13">
<title>Table over j from -3 to 3: i++ runs only when j &gt;= 0; its value is 0 at j = 0, so count adds 1, 2, 3 for j = 1, 2, 3; final count 6 plus i 4 is 10</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">if ((j &gt;= 0) &amp;&amp; (i++)) count = count + j;   &amp;&amp; stops at the first false</text>
<rect x="20" y="40" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="45" y="58" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">j</text>
<rect x="70" y="40" width="90" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="115" y="58" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">j &gt;= 0</text>
