<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="sans-serif" font-size="13">
<title>Tape cells 0 to 2021: in 2021 steps the head reads only cells 0 to 2020, so only the first 2021 symbols of an input can matter</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="40" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="75" y="87" text-anchor="middle" fill="#222" font-size="14">0</text>
<rect x="114" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="149" y="87" text-anchor="middle" fill="#222" font-size="14">1</text>
<rect x="188" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="223" y="87" text-anchor="middle" fill="#222" font-size="14">2</text>
<rect x="262" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="297" y="87" text-anchor="middle" fill="#222" font-size="14">3</text>
<rect x="336" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="371" y="87" text-anchor="middle" fill="#222" font-size="14">...</text>
<rect x="410" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="445" y="87" text-anchor="middle" fill="#222" font-size="14">2019</text>
<rect x="484" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="519" y="87" text-anchor="middle" fill="#222" font-size="14">2020</text>
<rect x="558" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="593" y="87" text-anchor="middle" fill="#222" font-size="14">2021</text>
<rect x="632" y="60" width="70" height="44" rx="2" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="667" y="87" text-anchor="middle" fill="#222" font-size="14">2022</text>
<text x="75" y="125" text-anchor="middle" fill="#222" font-size="11">cell index</text>
<path d="M 40,50 L 40,40 L 554,40 L 554,50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="297" y="32" text-anchor="middle" fill="#222" font-size="12">read within 2021 steps: cells 0 to 2020</text>
<path d="M 562,50 L 562,40 L 702,40 L 702,50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="632" y="32" text-anchor="middle" fill="#222" font-size="12">never read</text>
<text x="380" y="160" text-anchor="middle" fill="#222" font-size="13">A head moves one cell per step, so step k reads a cell with index at most k - 1.</text>
<text x="380" y="182" text-anchor="middle" fill="#222" font-size="13">Two inputs that agree on their first 2021 symbols behave the same for 2021 steps.</text>
<text x="380" y="212" text-anchor="middle" fill="#222" font-size="13">Decider for L1 and for L2: run M for 2021 steps on every string of length at most 2021</text>
<text x="380" y="232" text-anchor="middle" fill="#222" font-size="13">(2^2022 - 1 strings, a finite list) and check: did every / did some run still go on?</text>
<text x="380" y="256" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Finite work, always halts: both L1 and L2 are decidable.</text>
</svg>
