<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif">
<title>Activation tree: calls visit nodes in preorder, returns leave them in postorder (GATE 2021 CS1 Q4)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<ellipse cx="230" cy="40" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="230" y="44.5" font-size="13" text-anchor="middle" fill="#222">main</text>
<ellipse cx="130" cy="130" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="130" y="134.5" font-size="13" text-anchor="middle" fill="#222">f</text>
<ellipse cx="330" cy="130" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="330" y="134.5" font-size="13" text-anchor="middle" fill="#222">g</text>
<ellipse cx="50" cy="220" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="50" y="224.5" font-size="13" text-anchor="middle" fill="#222">h</text>
<ellipse cx="210" cy="220" rx="36" ry="16" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="210" y="224.5" font-size="13" text-anchor="middle" fill="#222">k</text>
<line x1="230" y1="56" x2="130" y2="114" stroke="#222" stroke-width="1.5"/>
<line x1="230" y1="56" x2="330" y2="114" stroke="#222" stroke-width="1.5"/>
<line x1="130" y1="146" x2="50" y2="204" stroke="#222" stroke-width="1.5"/>
<line x1="130" y1="146" x2="210" y2="204" stroke="#222" stroke-width="1.5"/>
<text x="270" y="36" font-size="12" text-anchor="start" fill="#222">call 1</text>
<text x="270" y="52" font-size="12" text-anchor="start" fill="#b3261e">return 5</text>
<text x="170" y="126" font-size="12" text-anchor="start" fill="#222">call 2</text>
<text x="170" y="142" font-size="12" text-anchor="start" fill="#b3261e">return 3</text>
<text x="370" y="126" font-size="12" text-anchor="start" fill="#222">call 5</text>
<text x="370" y="142" font-size="12" text-anchor="start" fill="#b3261e">return 4</text>
<text x="90" y="216" font-size="12" text-anchor="start" fill="#222">call 3</text>
<text x="90" y="232" font-size="12" text-anchor="start" fill="#b3261e">return 1</text>
<text x="250" y="216" font-size="12" text-anchor="start" fill="#222">call 4</text>
<text x="250" y="232" font-size="12" text-anchor="start" fill="#b3261e">return 2</text>
<text x="20" y="275" font-size="13" text-anchor="start" fill="#222">Calls in order:   main, f, h, k, g      (preorder of the tree)</text>
<text x="20" y="300" font-size="13" text-anchor="start" fill="#b3261e">Returns in order: h, k, f, g, main      (postorder of the tree)</text>
</svg>
