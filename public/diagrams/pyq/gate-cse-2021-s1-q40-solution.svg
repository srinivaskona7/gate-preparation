<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" font-family="sans-serif" font-size="13">
<title>Rod cutting table R0 to R7 and the three cuttings of length 7 that earn 18</title>
<g stroke="#222" stroke-width="1.5" fill="none"><rect x="40" y="60" width="60" height="34"/><rect x="100" y="60" width="60" height="34"/><rect x="160" y="60" width="60" height="34"/><rect x="220" y="60" width="60" height="34"/><rect x="280" y="60" width="60" height="34"/><rect x="340" y="60" width="60" height="34"/><rect x="400" y="60" width="60" height="34"/><rect x="460" y="60" width="60" height="34"/></g><g fill="#222" text-anchor="middle"><text x="70" y="52">n=0</text><text x="70" y="82">0</text><text x="130" y="52">n=1</text><text x="130" y="82">1</text><text x="190" y="52">n=2</text><text x="190" y="82">5</text><text x="250" y="52">n=3</text><text x="250" y="82">8</text><text x="310" y="52">n=4</text><text x="310" y="82">10</text><text x="370" y="52">n=5</text><text x="370" y="82">13</text><text x="430" y="52">n=6</text><text x="430" y="82">17</text><text x="490" y="52">n=7</text><text x="490" y="82">18</text></g><g fill="#222"><text x="40" y="38" font-weight="bold">R[n] = max over i of p[i] + R[n-i]</text><text x="40" y="140" font-weight="bold">Ways to reach R7 = 18</text><text x="40" y="170">7 (one piece) = 18</text><text x="40" y="195">6 + 1 = 17 + 1 = 18</text><text x="40" y="220">3 + 2 + 2 = 8 + 5 + 5 = 18 (three pieces)</text><text x="40" y="250">Every other split of 7 is worth 17 or less, so R7 = 18, never 19.</text></g>
</svg>
