<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 260" font-family="sans-serif">
<title>DFS tree r, u, y, z: u is an articulation point, but y has a back edge to r that avoids u</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="110" cy="40" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="110" y="44.5" text-anchor="middle" font-size="13" fill="#222">r</text>
<circle cx="110" cy="120" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="110" y="124.5" text-anchor="middle" font-size="13" fill="#222">u</text>
<circle cx="230" cy="120" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="230" y="124.5" text-anchor="middle" font-size="13" fill="#222">y</text>
<circle cx="110" cy="205" r="15" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="110" y="209.6" text-anchor="middle" font-size="13" fill="#222">z</text>
<line x1="110.0" y1="55.0" x2="110.0" y2="103.0" stroke="#222" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="125.0" y1="120.0" x2="213.0" y2="120.0" stroke="#222" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="110.0" y1="135.0" x2="110.0" y2="188.0" stroke="#222" stroke-width="2.4" marker-end="url(#ar)"/>
<line x1="217.5" y1="111.7" x2="122.5" y2="48.3" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="260" y="48" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Solid arrows: DFS tree T</text>
<text x="260" y="66" text-anchor="start" font-size="12" fill="#222">Dashed: back edge y-r</text>
<text x="260" y="150" text-anchor="start" font-size="12" fill="#222">u separates z from the rest,</text>
<text x="260" y="168" text-anchor="start" font-size="12" fill="#222">so u is an articulation point</text>
<text x="260" y="198" text-anchor="start" font-size="12" fill="#222">Path r-y avoids u: option (D)</text>
<text x="260" y="216" text-anchor="start" font-size="12" fill="#222">is false</text>
<text x="10" y="36" text-anchor="start" font-size="11" fill="#222">root</text>
<text x="10" y="53" text-anchor="start" font-size="11" fill="#222">1 child</text>
</svg>
