<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif" font-size="13">
<title>Relation on three elements 0, 1, 2 with loops at each and two-way edges 0 to 2 and 1 to 2: it is reflexive and symmetric, but 0S2 and 2S1 without 0S1, so it is not transitive and not an equivalence relation</title>
<path d="M 101 184 C 80 148 140 148 119 184" fill="none" stroke="#222" stroke-width="1.4"/>
<path d="M 251 54 C 230 18 290 18 269 54" fill="none" stroke="#222" stroke-width="1.4"/>
<path d="M 401 184 C 380 148 440 148 419 184" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="127.5" y1="192.7" x2="250.3" y2="86.3" stroke="#222" stroke-width="1.6"/>
<polygon points="250.3,86.3 246.5,95.6 240.6,88.8" fill="#222"/>
<line x1="242.5" y1="77.3" x2="119.7" y2="183.7" stroke="#222" stroke-width="1.6"/>
<polygon points="119.7,183.7 123.5,174.4 129.4,181.2" fill="#222"/>
<line x1="400.3" y1="183.7" x2="277.5" y2="77.3" stroke="#222" stroke-width="1.6"/>
<polygon points="277.5,77.3 287.3,79.7 281.4,86.5" fill="#222"/>
<line x1="269.7" y1="86.3" x2="392.5" y2="192.7" stroke="#222" stroke-width="1.6"/>
<polygon points="392.5,192.7 382.7,190.3 388.6,183.5" fill="#222"/>
<line x1="130.0" y1="200.0" x2="390.0" y2="200.0" stroke="#222" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="260" y="225" text-anchor="middle" fill="#222" font-size="12">0 S 1 is missing</text>
<circle cx="110" cy="200" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="110" y="204.6" text-anchor="middle" fill="#222" font-size="13">0</text>
<circle cx="260" cy="70" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="260" y="74.6" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="410" cy="200" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="410" y="204.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="12">S = {(0,0),(1,1),(2,2),(0,2),(2,0),(1,2),(2,1)}</text>
<text x="20" y="260" text-anchor="start" fill="#222" font-size="12">Reflexive and symmetric, but 0 S 2 and 2 S 1 do not give 0 S 1.</text>
<text x="20" y="280" text-anchor="start" fill="#222" font-size="12">So reflexive + symmetric does not force transitivity (option A is false).</text>
</svg>
