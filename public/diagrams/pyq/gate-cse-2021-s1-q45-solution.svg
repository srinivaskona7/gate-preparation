<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 278" font-family="sans-serif" font-size="13">
<title>Segment of 1400 bytes split by R (MTU 820) into fragments of 820 and 620 bytes; only the first carries the TCP header</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Datagram sizes in bytes (IP header + data). Shaded = IP header.</text>
<text x="10" y="62" text-anchor="start" fill="#222" font-size="12" font-weight="bold">At P</text>
<rect x="140" y="40" width="27.0" height="34" fill="#ccc" stroke="#222" stroke-width="1.5"/><text x="153.5" y="62" text-anchor="middle" fill="#222" font-size="12">20</text>
<rect x="167.0" y="40" width="630.0" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="482.0" y="62" text-anchor="middle" fill="#222" font-size="12">TCP segment 1400</text>
<text x="805.0" y="62" text-anchor="start" fill="#222" font-size="11">total 1420, fits MTU 1500</text>
<text x="10" y="122" text-anchor="start" fill="#222" font-size="12" font-weight="bold">At R, frag 1</text>
<rect x="140" y="100" width="27.0" height="34" fill="#ccc" stroke="#222" stroke-width="1.5"/><text x="153.5" y="122" text-anchor="middle" fill="#222" font-size="12">20</text>
<rect x="167.0" y="100" width="360.0" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="347.0" y="122" text-anchor="middle" fill="#222" font-size="12">data 800 (offset 0, MF = 1)</text>
<text x="535.0" y="122" text-anchor="start" fill="#222" font-size="11">total 820 = MTU</text>
<text x="10" y="172" text-anchor="start" fill="#222" font-size="12" font-weight="bold">At R, frag 2</text>
<rect x="140" y="150" width="27.0" height="34" fill="#ccc" stroke="#222" stroke-width="1.5"/><text x="153.5" y="172" text-anchor="middle" fill="#222" font-size="12">20</text>
<rect x="167.0" y="150" width="270.0" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="302.0" y="172" text-anchor="middle" fill="#222" font-size="12">data 600 (offset 100, MF = 0)</text>
<text x="445.0" y="172" text-anchor="start" fill="#222" font-size="11">total 620</text>
<text x="10" y="210" text-anchor="start" fill="#222" font-size="12">Data per fragment: 820 - 20 = 800, already a multiple of 8. Offset of fragment 2 = 800 / 8 = 100.</text>
<text x="10" y="230" text-anchor="start" fill="#222" font-size="12">The TCP header (ports) sits in the first 20 bytes of the segment, so only fragment 1 carries it.</text>
<text x="10" y="250" text-anchor="start" fill="#222" font-size="12">Both fragments are rebuilt only at Q; R never resends a lost fragment.</text>
</svg>
