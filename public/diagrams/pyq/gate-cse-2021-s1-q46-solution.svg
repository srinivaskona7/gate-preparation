<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="sans-serif" font-size="13">
<title>Left: all five threads pass the first wait and block on the second, so S = 0 and nobody moves. Right: a lost update leaves counter = 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Deadlock: S starts at 5, each thread runs wait(S) once</text>
<rect x="20" y="40" width="62" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="51.0" y="57.0" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">T1</text>
<text x="51.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">holds 1</text>
<text x="51.0" y="87.0" text-anchor="middle" fill="#222" font-size="11">at line 6</text>
<rect x="90" y="40" width="62" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="121.0" y="57.0" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">T2</text>
<text x="121.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">holds 1</text>
<text x="121.0" y="87.0" text-anchor="middle" fill="#222" font-size="11">at line 6</text>
<rect x="160" y="40" width="62" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="191.0" y="57.0" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">T3</text>
<text x="191.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">holds 1</text>
<text x="191.0" y="87.0" text-anchor="middle" fill="#222" font-size="11">at line 6</text>
<rect x="230" y="40" width="62" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="261.0" y="57.0" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">T4</text>
<text x="261.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">holds 1</text>
<text x="261.0" y="87.0" text-anchor="middle" fill="#222" font-size="11">at line 6</text>
<rect x="300" y="40" width="62" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="331.0" y="57.0" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">T5</text>
<text x="331.0" y="72.0" text-anchor="middle" fill="#222" font-size="11">holds 1</text>
<text x="331.0" y="87.0" text-anchor="middle" fill="#222" font-size="11">at line 6</text>
<rect x="20" y="110" width="342" height="34" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="191.0" y="131.0" text-anchor="middle" fill="#222" font-size="12">S = 5 - 5 = 0: every second wait(S) blocks</text>
<text x="20" y="176" text-anchor="start" fill="#222" font-size="12">Option D is possible: a deadlock involving all five.</text>
<text x="400" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Lost update: counter ends at 1</text>
<rect x="400" y="40" width="175" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="487.5" y="54.5" text-anchor="middle" fill="#222" font-size="11">Ta loads 0</text>
<text x="487.5" y="69.5" text-anchor="middle" fill="#222" font-size="11">counter = 0</text>
<rect x="590" y="40" width="175" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="677.5" y="54.5" text-anchor="middle" fill="#222" font-size="11">Tb loads 0, stores 1</text>
<text x="677.5" y="69.5" text-anchor="middle" fill="#222" font-size="11">counter = 1</text>
<rect x="400" y="102" width="175" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="487.5" y="116.5" text-anchor="middle" fill="#222" font-size="11">Tc: 1 to 2</text>
<text x="487.5" y="131.5" text-anchor="middle" fill="#222" font-size="11">counter = 2</text>
<rect x="590" y="102" width="175" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="677.5" y="116.5" text-anchor="middle" fill="#222" font-size="11">Td: 2 to 3</text>
<text x="677.5" y="131.5" text-anchor="middle" fill="#222" font-size="11">counter = 3</text>
<rect x="400" y="164" width="175" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="487.5" y="178.5" text-anchor="middle" fill="#222" font-size="11">Te: 3 to 4</text>
<text x="487.5" y="193.5" text-anchor="middle" fill="#222" font-size="11">counter = 4</text>
<rect x="590" y="164" width="175" height="36" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="677.5" y="178.5" text-anchor="middle" fill="#222" font-size="11">Ta stores 0+1</text>
<text x="677.5" y="193.5" text-anchor="middle" fill="#222" font-size="11">counter = 1</text>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="12">A: five threads one after another give counter = 5.</text>
<text x="20" y="254" text-anchor="start" fill="#222" font-size="12">B: the schedule at right gives counter = 1.</text>
<text x="20" y="276" text-anchor="start" fill="#222" font-size="12">C: counter = 0 is impossible: every store writes (value read) + 1, at least 1.</text>
<text x="20" y="298" text-anchor="start" fill="#222" font-size="12">D: the deadlock at left.</text>
<text x="20" y="330" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Possible: A, B and D</text>
</svg>
