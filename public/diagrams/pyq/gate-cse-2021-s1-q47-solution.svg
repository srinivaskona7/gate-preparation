<line x1="440" y1="70" x2="440" y2="94" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="440" cy="102" r="8" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="434" y1="108" x2="410" y2="144" stroke="#222" stroke-width="1.6"/>
<text x="418" y="122" text-anchor="end" fill="#222" font-size="13">0</text>
<circle cx="405" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
