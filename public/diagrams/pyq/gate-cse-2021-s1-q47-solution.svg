<text x="100" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">00</text>
<rect x="185" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="270" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">01</text>
<rect x="355" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="440" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">10</text>
