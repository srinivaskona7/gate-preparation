<circle cx="610" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<text x="220" y="172" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">9 = 1001</text>
<text x="285" y="218" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">5 = 0101</text>
<text x="355" y="218" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">13 = 1101</text>
<text x="405" y="172" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">10 = 1010</text>
<text x="475" y="172" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">6 = 0110</text>
<text x="610" y="172" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">7 = 0111</text>
<text x="355.0" y="258" text-anchor="middle" fill="#222" font-size="12">Option C in order 10, 9, 6, 7, 5, 13: 6 collides with 10 (split on bit 3), 5 collides with 9 (split on bit 3),</text>
<text x="355.0" y="275" text-anchor="middle" fill="#222" font-size="12">then 13 collides with 5 inside the bit-3 = 1 branch (split on bit 4). No key ends in 00.</text>
