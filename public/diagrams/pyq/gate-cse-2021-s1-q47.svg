<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 262" font-family="sans-serif" font-size="13">
<title>Dynamic hash table with four main entries 00, 01, 10, 11 and a binary tree of keys under each: 00 empty, 01 a three-leaf tree, 10 a two-leaf tree, 11 a single leaf</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="15" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="100" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">00</text>
<rect x="185" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="270" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">01</text>
<rect x="355" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="440" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">10</text>
<rect x="525" y="40" width="170" height="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="610" y="60" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">11</text>
<text x="100" y="102" text-anchor="middle" fill="#222" font-size="13">empty</text>
<line x1="100" y1="70" x2="100" y2="84" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="270" y1="70" x2="270" y2="94" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="270" cy="102" r="8" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="264" y1="108" x2="226" y2="144" stroke="#222" stroke-width="1.6"/>
<text x="235" y="122" text-anchor="end" fill="#222" font-size="13">0</text>
<circle cx="220" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<line x1="276" y1="108" x2="314" y2="144" stroke="#222" stroke-width="1.6"/>
<text x="305" y="122" text-anchor="start" fill="#222" font-size="13">1</text>
<circle cx="320" cy="150" r="8" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="315" y1="157" x2="292" y2="190" stroke="#222" stroke-width="1.6"/>
<text x="298" y="170" text-anchor="end" fill="#222" font-size="13">0</text>
<circle cx="285" cy="196" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<line x1="325" y1="157" x2="348" y2="190" stroke="#222" stroke-width="1.6"/>
<text x="342" y="170" text-anchor="start" fill="#222" font-size="13">1</text>
<circle cx="355" cy="196" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<line x1="440" y1="70" x2="440" y2="94" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="440" cy="102" r="8" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="434" y1="108" x2="410" y2="144" stroke="#222" stroke-width="1.6"/>
<text x="418" y="122" text-anchor="end" fill="#222" font-size="13">0</text>
<circle cx="405" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<line x1="446" y1="108" x2="470" y2="144" stroke="#222" stroke-width="1.6"/>
<text x="462" y="122" text-anchor="start" fill="#222" font-size="13">1</text>
<circle cx="475" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<line x1="610" y1="70" x2="610" y2="138" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="610" cy="150" r="6" fill="#222" stroke="#222" stroke-width="1.6"/>
<text x="355.0" y="228" text-anchor="middle" fill="#222" font-size="12">Main entry = the 2 low bits. First split of a tree = 3rd low bit, second split = 4th low bit.</text>
<text x="355.0" y="245" text-anchor="middle" fill="#222" font-size="12">Edge label 0 goes left, 1 goes right. Black dots are keys; open circles are splits.</text>
</svg>
