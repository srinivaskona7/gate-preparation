<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" font-family="sans-serif" font-size="13">
<title>Values of total after each of 9 passes: 1, 3, 7, 15, 31, 63, 127, 255, 511, 1023</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">total = x * total + Y[k] with x = 2 and every Y[k] = 1, for k = 1..9</text>
<rect x="20" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="43" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">1</text>
<text x="48" y="110" fill="#222" text-anchor="middle" font-size="10">Y[0]</text>
<path d="M66,76 L82,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="82" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="105" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">3</text>
<text x="110" y="110" fill="#222" text-anchor="middle" font-size="10">pass 1</text>
<path d="M128,76 L144,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="144" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="167" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">7</text>
<text x="172" y="110" fill="#222" text-anchor="middle" font-size="10">pass 2</text>
<path d="M190,76 L206,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="206" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="229" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">15</text>
<text x="234" y="110" fill="#222" text-anchor="middle" font-size="10">pass 3</text>
<path d="M252,76 L268,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="268" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="291" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">31</text>
<text x="296" y="110" fill="#222" text-anchor="middle" font-size="10">pass 4</text>
<path d="M314,76 L330,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="330" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="353" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">63</text>
<text x="358" y="110" fill="#222" text-anchor="middle" font-size="10">pass 5</text>
<path d="M376,76 L392,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="392" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="415" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">127</text>
<text x="420" y="110" fill="#222" text-anchor="middle" font-size="10">pass 6</text>
<path d="M438,76 L454,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="454" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="477" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">255</text>
<text x="482" y="110" fill="#222" text-anchor="middle" font-size="10">pass 7</text>
<path d="M500,76 L516,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="516" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="539" y="80" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">511</text>
<text x="544" y="110" fill="#222" text-anchor="middle" font-size="10">pass 8</text>
<path d="M562,76 L578,76" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="578" y="60" width="46" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="601" y="80" fill="#222" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace">1023</text>
<text x="606" y="110" fill="#222" text-anchor="middle" font-size="10">pass 9</text>
<text x="20" y="150" fill="#222" font-size="12">Each pass: total -&gt; 2 * total + 1, so total + 1 doubles: 2, 4, 8, ...</text>
<text x="20" y="172" fill="#222" font-size="13" font-weight="bold">After 9 passes total + 1 = 2^10 = 1024, so total = 1023.</text>
</svg>
