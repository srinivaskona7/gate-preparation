<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 212" width="900" height="212">
<title>Sliding window at 50 percent utilization needs about 50.5 frames in flight</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="102" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Sender</text>
<rect x="110.0" y="50" width="348.92636363636365" height="30" rx="0" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="284.46318181818185" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">busy: W x 2 ms = 101.005 ms, W = 50.5025</text>
<rect x="458.92636363636365" y="50" width="348.92636363636365" height="30" rx="0" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="633.3895454545454" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">idle until ACK 1 arrives</text>
<line x1="110" y1="94" x2="880" y2="94" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="94" x2="110.0" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<line x1="458.92636363636365" y1="94" x2="458.92636363636365" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="458.92636363636365" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">101.005</text>
<line x1="807.8527272727273" y1="94" x2="807.8527272727273" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="807.8527272727273" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">202.01 ms</text>
<line x1="807.8527272727273" y1="36" x2="807.8527272727273" y2="94" stroke="#b00020" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="807.8527272727273" y="32" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#b00020">ACK of frame 1</text>
<text x="10" y="144" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Cycle = 2 (send) + 100 (propagate) + 0.01 (ACK send) + 100 (propagate) = 202.01 ms.</text>
<text x="10" y="158" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Busy fraction 0.5 needs W x 2 = 101.005, W = 50.5025, rounded to 51.</text>
</svg>
