<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif" fill="#1f2937"><title>Grammar classes nested: LR(0) in SLR(1) in LALR(1) in LR(1) in unambiguous in all context-free, with the L = R grammar marked</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="760" height="360" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="22" y="30" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">All context-free grammars: CYK or Earley parse any of them in O(n^3) time (statement S2)</text>
<rect x="30" y="46" width="720" height="304" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="42" y="66" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Unambiguous grammars (every string has one parse tree)</text>
<rect x="50" y="82" width="680" height="252" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="62" y="102" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">LR(1) grammars</text>
<rect x="70" y="116" width="640" height="202" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="82" y="136" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">LALR(1) grammars</text>
<rect x="90" y="150" width="380" height="154" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="102" y="170" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">SLR(1) grammars: every one is unambiguous (S1, first half)</text>
<rect x="106" y="190" width="200" height="96" rx="6" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="116" y="210" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">LR(0) grammars</text>
<circle cx="590" cy="240" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="1.2"/>
<text x="590" y="262" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">S -&gt; L = R | R</text>
<text x="590" y="278" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">L -&gt; * R | id ;  R -&gt; L</text>
<text x="590" y="296" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">unambiguous, but not SLR(1)</text>
<text x="22" y="394" font-size="12" text-anchor="start" fill="#1f2937">S1: SLR(1) sits inside the unambiguous box, and the dot is unambiguous yet outside SLR(1). True.</text>
<text x="22" y="414" font-size="12" text-anchor="start" fill="#1f2937">S2: a parser for any context-free grammar runs in at most O(n^3) (CYK on Chomsky normal form). True.</text>
<text x="22" y="434" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Both true: option (C).</text>
</svg>
