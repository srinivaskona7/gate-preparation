<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="sans-serif" font-size="13">
<title>PDA with states q0 to q3: push #, loop on a pushing A, move to q2, loop on b popping A, then check an A is on top and go to q3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="40" y1="120" x2="106" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="60" y="112" text-anchor="middle" font-size="12" fill="#222">start</text>
<circle cx="130" cy="120" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="130" y="125" text-anchor="middle" font-size="14" fill="#222">q0</text>
<circle cx="300" cy="120" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="125" text-anchor="middle" font-size="14" fill="#222">q1</text>
<circle cx="480" cy="120" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="480" y="125" text-anchor="middle" font-size="14" fill="#222">q2</text>
<circle cx="650" cy="120" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="650" cy="120" r="19" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="650" y="125" text-anchor="middle" font-size="14" fill="#222">q3</text>
<line x1="154" y1="120" x2="276" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="215.0" y="112" text-anchor="middle" font-size="12" fill="#222">ε, ε → #</text>
<line x1="324" y1="120" x2="456" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="390.0" y="112" text-anchor="middle" font-size="12" fill="#222">ε, ε → ε</text>
<line x1="504" y1="120" x2="626" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="565.0" y="112" text-anchor="middle" font-size="12" fill="#222">ε, A → A</text>
<path d="M290,98 C276,62 324,62 310,98" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="300" y="56" text-anchor="middle" font-size="12" fill="#222">a, ε → A</text>
<path d="M470,98 C456,62 504,62 490,98" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="480" y="56" text-anchor="middle" font-size="12" fill="#222">b, A → ε</text>
<text x="380" y="215" text-anchor="middle" font-size="12" fill="#222">label  input, pop → push   (ε = nothing read, popped or pushed)</text>
<text x="380" y="235" text-anchor="middle" font-size="12" fill="#222">Σ = {a, b}   Γ = {#, A}   accepts by final state q3</text>
</svg>
