<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif">
<title>Probability tree for the channel: sent H then received H has probability 0.03, sent L then received H has 0.72, so P(sent H given received H) is 0.03 over 0.75, which is 0.04</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="70" cy="115" r="10" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="70" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Sent</text>
<line x1="79" y1="115" x2="248" y2="55" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.1</text>
<circle cx="270" cy="55" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="270" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">H</text>
<line x1="292" y1="55" x2="462" y2="55" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="378" y="47" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.3</text>
<text x="470" y="59" text-anchor="start" font-size="12" font-weight="bold" fill="#222">received H</text>
<text x="560" y="59" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">=  0.03</text>
<line x1="79" y1="115" x2="248" y2="145" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="160" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.9</text>
<circle cx="270" cy="145" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="270" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">L</text>
<line x1="292" y1="145" x2="462" y2="145" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="378" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">0.8</text>
<text x="470" y="149" text-anchor="start" font-size="12" font-weight="bold" fill="#222">received H</text>
<text x="560" y="149" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">=  0.72</text>
<text x="320" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">P(sent H | received H) = 0.03 / (0.03 + 0.72) = 0.03 / 0.75 = 0.04</text>
</svg>
