<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif">
<title>Channel diagram: sender H or L on the left, receiver H or L on the right, edge weights H to H 0.3, H to L 0.7, L to H 0.8, L to L 0.2</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="120" cy="70" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="120" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">H</text>
<circle cx="120" cy="180" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="120" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">L</text>
<circle cx="440" cy="70" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="440" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">H</text>
<circle cx="440" cy="180" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="440" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">L</text>
<text x="120" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">S (sender)</text>
<text x="440" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R (receiver)</text>
<text x="90" y="75" text-anchor="end" font-size="12" fill="#222">0.1</text>
<text x="90" y="185" text-anchor="end" font-size="12" fill="#222">0.9</text>
<text x="90" y="50" text-anchor="end" font-size="11" font-style="italic" fill="#222">P(sent)</text>
<line x1="136" y1="70" x2="424" y2="70" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">0.3</text>
<line x1="136" y1="180" x2="424" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="280" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">0.2</text>
<line x1="134" y1="78" x2="426" y2="172" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="235" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">0.7</text>
<line x1="134" y1="172" x2="426" y2="78" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="335" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">0.8</text>
<text x="280" y="240" text-anchor="middle" font-size="11" fill="#222">Edge (u, v) is the probability of receiving v when u was sent.</text>
</svg>
