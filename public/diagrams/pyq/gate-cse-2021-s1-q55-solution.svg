<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="sans-serif" font-size="13">
<title>Program layout from address 1000 with the loop from BNZ back to 1004, which runs 10 times</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="20" width="300" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="30" y="40" text-anchor="start" fill="#222" font-weight="bold">1000</text><text x="85" y="40" text-anchor="start" fill="#222">MOV R1,(5000)</text><text x="285" y="40" text-anchor="end" fill="#222">4 B</text><rect x="20" y="54" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="74" text-anchor="start" fill="#222" font-weight="bold">1004</text><text x="85" y="74" text-anchor="start" fill="#222">MOV R2,(R3)</text><text x="285" y="74" text-anchor="end" fill="#222">4 B</text><rect x="20" y="88" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="108" text-anchor="start" fill="#222" font-weight="bold">1008</text><text x="85" y="108" text-anchor="start" fill="#222">ADD R2,R1</text><text x="285" y="108" text-anchor="end" fill="#222">2 B</text><rect x="20" y="122" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="142" text-anchor="start" fill="#222" font-weight="bold">1010</text><text x="85" y="142" text-anchor="start" fill="#222">MOV (R3),R2</text><text x="285" y="142" text-anchor="end" fill="#222">4 B</text><rect x="20" y="156" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="176" text-anchor="start" fill="#222" font-weight="bold">1014</text><text x="85" y="176" text-anchor="start" fill="#222">INC R3</text><text x="285" y="176" text-anchor="end" fill="#222">2 B</text><rect x="20" y="190" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="210" text-anchor="start" fill="#222" font-weight="bold">1016</text><text x="85" y="210" text-anchor="start" fill="#222">DEC R1</text><text x="285" y="210" text-anchor="end" fill="#222">2 B</text><rect x="20" y="224" width="300" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="30" y="244" text-anchor="start" fill="#222" font-weight="bold">1018</text><text x="85" y="244" text-anchor="start" fill="#222">BNZ 1004</text><text x="285" y="244" text-anchor="end" fill="#222">2 B</text><rect x="20" y="258" width="300" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="30" y="278" text-anchor="start" fill="#222" font-weight="bold">1020</text><text x="85" y="278" text-anchor="start" fill="#222">HALT</text><text x="285" y="278" text-anchor="end" fill="#222">1 B</text><path d="M320,239 L350,239 L350,69 L320,69" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><text x="358" y="160" text-anchor="start" fill="#222" font-size="12">loop</text><text x="400" y="40" text-anchor="start" fill="#222" font-weight="bold">Pass k = 0..9 (shaded body):</text><text x="400" y="62" text-anchor="start" fill="#222" font-size="12">R1 = 10 - k, R3 = 3000 + k</text><text x="400" y="82" text-anchor="start" fill="#222" font-size="12">MEM[3000+k] becomes 50 + (10 - k)</text><text x="400" y="112" text-anchor="start" fill="#222" font-size="12">DEC R1 gives 9, 8, ..., 0.</text><text x="400" y="132" text-anchor="start" fill="#222" font-size="12">BNZ jumps back while R1 != 0;</text><text x="400" y="152" text-anchor="start" fill="#222" font-size="12">after pass 9, R1 = 0 and R3 = 3010.</text><text x="400" y="182" text-anchor="start" fill="#222" font-size="12">Writes reached 3000..3009 only.</text><text x="400" y="202" text-anchor="start" fill="#222" font-weight="bold" font-size="12">MEM[3010] is never written: 50.</text><text x="400" y="232" text-anchor="start" fill="#222" font-size="12">Steps: 1 + 10 x 6 + HALT = 62 run,</text><text x="400" y="252" text-anchor="start" fill="#222" font-size="12">the final BNZ falls through to HALT.</text>
</svg>
