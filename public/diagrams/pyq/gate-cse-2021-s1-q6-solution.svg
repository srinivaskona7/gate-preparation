<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
<title>Base 3 number 210 equals 21 in decimal, which is 15 in hexadecimal</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Step 1: base 3 to decimal, weights 9, 3, 1</text>
<rect x="130" y="44" width="50" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="155.0" y="63.25" font-size="15" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">2</text>
<text x="155" y="94" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">3^2 = 9</text>
<text x="155" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">2 x 9 = 18</text>
<rect x="260" y="44" width="50" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="285.0" y="63.25" font-size="15" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">1</text>
<text x="285" y="94" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">3^1 = 3</text>
<text x="285" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1 x 3 = 3</text>
<rect x="390" y="44" width="50" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="415.0" y="63.25" font-size="15" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">0</text>
<text x="415" y="94" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">3^0 = 1</text>
<text x="415" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0 x 1 = 0</text>
<text x="20" y="62" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">(210) base 3</text>
<text x="20" y="142" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">18 + 3 + 0 = 21</text>
<text x="20" y="178" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Step 2: decimal to hexadecimal, weights 16 and 1</text>
<rect x="130" y="192" width="50" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="155.0" y="211.25" font-size="15" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">1</text>
<rect x="190" y="192" width="50" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="215.0" y="211.25" font-size="15" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">5</text>
<text x="155" y="238" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1 x 16</text>
<text x="215" y="238" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">5 x 1</text>
<text x="290" y="212" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">16 + 5 = 21, so 21 = (15) hex: option A</text>
</svg>
