<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 275" font-family="sans-serif" font-size="13">
<title>ARP request goes to the broadcast MAC address; the reply goes straight back to the requester</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">ARP on one Ethernet: who has IP 10.0.0.9?</text>
<rect x="50" y="36" width="140" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="120" y="56" text-anchor="middle" fill="#222" font-size="12">Host A (asks)</text>
<line x1="120" y1="66" x2="120" y2="215" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="490" y="36" width="140" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="560" y="56" text-anchor="middle" fill="#222" font-size="12">Host B (owns 10.0.0.9)</text>
<line x1="560" y1="66" x2="560" y2="215" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="120" y1="110" x2="560" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="340" y="100" text-anchor="middle" fill="#222" font-size="12">ARP request: destination MAC ff:ff:ff:ff:ff:ff (broadcast)</text>
<text x="340" y="126" text-anchor="middle" fill="#222" font-size="11">every host on the segment receives it</text>
<line x1="560" y1="180" x2="120" y2="180" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="340" y="170" text-anchor="middle" fill="#222" font-size="12">ARP reply: destination MAC = A's own MAC (unicast)</text>
<text x="340" y="196" text-anchor="middle" fill="#222" font-size="11">only A receives it; B learned A's MAC from the request</text>
<text x="10" y="240" text-anchor="start" fill="#222" font-size="12">S1 (reply is broadcast): false.</text>
<text x="10" y="258" text-anchor="start" fill="#222" font-size="12" font-weight="bold">S2 (request is broadcast): true. Option (C).</text>
</svg>
