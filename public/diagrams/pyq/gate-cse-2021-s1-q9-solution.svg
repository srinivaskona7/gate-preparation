<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Bar chart of comparisons on a sorted array of 8: selection 28, merge sort 12, insertion sort 7, quicksort with last pivot 28</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="12" y="18" text-anchor="start" font-size="12">comparisons on 23 32 45 69 72 73 89 97 (already sorted, n = 8)</text>
<text x="240" y="62" text-anchor="end">Selection sort</text>
<rect x="250" y="44" width="280" height="26" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="538" y="62" text-anchor="start">28</text>
<text x="240" y="104" text-anchor="end">Mergesort</text>
<rect x="250" y="86" width="120" height="26" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="378" y="104" text-anchor="start">12</text>
<text x="240" y="146" text-anchor="end">Insertion sort</text>
<rect x="250" y="128" width="70" height="26" rx="2" stroke="#1f2937" stroke-width="2.4" fill="#d1d5db"/>
<text x="328" y="146" text-anchor="start" font-weight="bold">7</text>
<text x="240" y="188" text-anchor="end">Quicksort, last element as pivot</text>
<rect x="250" y="170" width="280" height="26" rx="2" stroke="#1f2937" stroke-width="1.2" fill="none"/>
<text x="538" y="188" text-anchor="start">28</text>
<text x="12" y="228" text-anchor="start">Insertion sort makes one comparison per element after the first: n - 1 = 7, the fewest.</text>
</svg>
