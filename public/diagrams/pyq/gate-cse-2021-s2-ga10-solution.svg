<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" font-family="sans-serif" font-size="12">
<title>Six bars from shortest to tallest in the order Q U R S T P; three are taller than R and three are shorter than S</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="40" y="184" width="52" height="36" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="66.0" y="208.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">Q</text>
<text x="66.0" y="236" text-anchor="middle" fill="#222" font-size="11">0 shorter</text>
<rect x="122" y="160" width="52" height="60" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="148.0" y="196.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">U</text>
<text x="148.0" y="236" text-anchor="middle" fill="#222" font-size="11">1 shorter</text>
<rect x="204" y="136" width="52" height="84" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="230.0" y="184.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">R</text>
<text x="230.0" y="236" text-anchor="middle" fill="#222" font-size="11">2 shorter</text>
<rect x="286" y="112" width="52" height="108" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="312.0" y="172.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">S</text>
<text x="312.0" y="236" text-anchor="middle" fill="#222" font-size="11">3 shorter</text>
<rect x="368" y="88" width="52" height="132" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="394.0" y="160.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">T</text>
<text x="394.0" y="236" text-anchor="middle" fill="#222" font-size="11">4 shorter</text>
<rect x="450" y="64" width="52" height="156" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="476.0" y="148.0" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">P</text>
<text x="476.0" y="236" text-anchor="middle" fill="#222" font-size="11">5 shorter</text>
<text x="280" y="18" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Shortest to tallest: Q &lt; U &lt; R &lt; S &lt; T &lt; P</text>
<path d="M286,54 L286,46 L502,46 L502,54" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="394.0" y="40" text-anchor="middle" fill="#222" font-size="12">taller than R: S, T, P = 3</text>
<path d="M40,248 L40,256 L256,256 L256,248" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="148.0" y="274" text-anchor="middle" fill="#222" font-size="12">shorter than S: Q, U, R = 3</text>
</svg>
