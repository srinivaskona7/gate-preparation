<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296" font-family="sans-serif">
<title>Unit cube with edge OP, long diagonal OG and face diagonal PG forming a right triangle at P with sides 1, root 2 and root 3, so cos theta is 1 over root 3</title>
<line x1="40" y1="220" x2="140" y2="220" stroke="#222" stroke-width="1.5"/><line x1="40" y1="220" x2="40" y2="120" stroke="#222" stroke-width="1.5"/><line x1="40" y1="220" x2="90" y2="180" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="90" y1="180" x2="190" y2="180" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="90" y1="180" x2="90" y2="80" stroke="#777" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="40" y1="120" x2="140" y2="120" stroke="#222" stroke-width="1.5"/><line x1="40" y1="120" x2="90" y2="80" stroke="#222" stroke-width="1.5"/><line x1="90" y1="80" x2="190" y2="80" stroke="#222" stroke-width="1.5"/><line x1="140" y1="220" x2="140" y2="120" stroke="#222" stroke-width="1.5"/><line x1="140" y1="220" x2="190" y2="180" stroke="#222" stroke-width="1.5"/><line x1="190" y1="180" x2="190" y2="80" stroke="#222" stroke-width="1.5"/><line x1="140" y1="120" x2="190" y2="80" stroke="#222" stroke-width="1.5"/><line x1="40" y1="220" x2="190" y2="80" stroke="#222" stroke-width="3.5"/><line x1="40" y1="220" x2="140" y2="220" stroke="#222" stroke-width="3.5"/><line x1="140" y1="220" x2="190" y2="80" stroke="#222" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="40" cy="220" r="4" fill="#222" stroke="#222" stroke-width="1.5"/><circle cx="140" cy="220" r="4" fill="#222" stroke="#222" stroke-width="1.5"/><circle cx="190" cy="80" r="4" fill="#222" stroke="#222" stroke-width="1.5"/><text x="26" y="236" font-size="13" text-anchor="start" fill="#222">O</text><text x="144" y="236" font-size="13" text-anchor="start" fill="#222">P</text><text x="198" y="76" font-size="13" text-anchor="start" fill="#222">G</text><text x="64" y="212" font-size="13" text-anchor="start" fill="#222">θ</text><text x="10" y="262" font-size="11" text-anchor="start" fill="#222">edge OP, diagonal OG, face diagonal PG</text><polygon points="300,220 380,220 380,106.9" fill="#efefef" stroke="#222" stroke-width="2"/><rect x="370" y="210" width="10" height="10" fill="none" stroke="#222" stroke-width="1"/><text x="288" y="236" font-size="13" text-anchor="start" fill="#222">O</text><text x="384" y="236" font-size="13" text-anchor="start" fill="#222">P</text><text x="386" y="104.86291501015239" font-size="13" text-anchor="start" fill="#222">G</text><text x="340.0" y="238" font-size="12" text-anchor="middle" fill="#222">1</text><text x="388" y="167.4314575050762" font-size="12" text-anchor="start" fill="#222">√2</text><text x="322" y="151.4314575050762" font-size="12" text-anchor="end" fill="#222">√3</text><text x="326" y="214" font-size="13" text-anchor="start" fill="#222">θ</text><text x="340" y="262" font-size="11" text-anchor="middle" fill="#222">right angle at P: OG² = OP² + PG² = 1 + 2 = 3</text><text x="340" y="282" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">cos θ = OP / OG = 1/√3</text>
</svg>
