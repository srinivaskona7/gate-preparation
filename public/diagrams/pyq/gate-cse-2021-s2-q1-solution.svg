<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="sans-serif">
<title>Triangle with three equal weights has three minimum spanning trees, each omitting a different edge, so no edge is in all of them</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="40" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="40" y="154.6" text-anchor="middle" font-size="13" fill="#222">x</text>
<circle cx="150" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="150" y="154.6" text-anchor="middle" font-size="13" fill="#222">y</text>
<circle cx="95" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="95" y="54.5" text-anchor="middle" font-size="13" fill="#222">z</text>
<line x1="54.0" y1="150.0" x2="136.0" y2="150.0" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="143.3" y1="137.7" x2="101.7" y2="62.3" stroke="#222" stroke-width="3.2"/>
<line x1="46.7" y1="137.7" x2="88.3" y2="62.3" stroke="#222" stroke-width="3.2"/>
<text x="95" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">MST 1: omit x-y</text>
<circle cx="225" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="225" y="154.6" text-anchor="middle" font-size="13" fill="#222">x</text>
<circle cx="335" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="335" y="154.6" text-anchor="middle" font-size="13" fill="#222">y</text>
<circle cx="280" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="280" y="54.5" text-anchor="middle" font-size="13" fill="#222">z</text>
<line x1="239.0" y1="150.0" x2="321.0" y2="150.0" stroke="#222" stroke-width="3.2"/>
<line x1="328.3" y1="137.7" x2="286.7" y2="62.3" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="231.7" y1="137.7" x2="273.3" y2="62.3" stroke="#222" stroke-width="3.2"/>
<text x="280" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">MST 2: omit y-z</text>
<circle cx="410" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="410" y="154.6" text-anchor="middle" font-size="13" fill="#222">x</text>
<circle cx="520" cy="150" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="520" y="154.6" text-anchor="middle" font-size="13" fill="#222">y</text>
<circle cx="465" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="465" y="54.5" text-anchor="middle" font-size="13" fill="#222">z</text>
<line x1="424.0" y1="150.0" x2="506.0" y2="150.0" stroke="#222" stroke-width="3.2"/>
<line x1="513.3" y1="137.7" x2="471.7" y2="62.3" stroke="#222" stroke-width="3.2"/>
<line x1="416.7" y1="137.7" x2="458.3" y2="62.3" stroke="#222" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="465" y="15" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">MST 3: omit x-z</text>
<text x="20" y="190" text-anchor="start" font-size="12" fill="#222">All weights 1. The three MSTs share no edge, so statement S1 fails.</text>
