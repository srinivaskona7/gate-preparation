<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 228" font-family="sans-serif" font-size="13">
<title>A 4 by 5 grid with values 10*i + j and flat indexes; the pointer starts at flat 5 (value 10) and moves 9 cells to flat 14 (row 2, column 4, value 24)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">arr[4][5] stores 10*i + j. arr[1] points to the start of row 1; +9 moves 9 ints</text>
<text x="88" y="48" fill="#222" text-anchor="middle" font-size="11">j=0</text>
<text x="144" y="48" fill="#222" text-anchor="middle" font-size="11">j=1</text>
<text x="200" y="48" fill="#222" text-anchor="middle" font-size="11">j=2</text>
<text x="256" y="48" fill="#222" text-anchor="middle" font-size="11">j=3</text>
<text x="312" y="48" fill="#222" text-anchor="middle" font-size="11">j=4</text>
<text x="20" y="76" fill="#222" font-size="11">i=0</text>
<rect x="60" y="56" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="88" y="71" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">0</text>
<text x="88" y="85" fill="#222" text-anchor="middle" font-size="9">flat 0</text>
<rect x="116" y="56" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="144" y="71" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">1</text>
<text x="144" y="85" fill="#222" text-anchor="middle" font-size="9">flat 1</text>
<rect x="172" y="56" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="200" y="71" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">2</text>
<text x="200" y="85" fill="#222" text-anchor="middle" font-size="9">flat 2</text>
<rect x="228" y="56" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="256" y="71" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">3</text>
<text x="256" y="85" fill="#222" text-anchor="middle" font-size="9">flat 3</text>
<rect x="284" y="56" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="312" y="71" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">4</text>
<text x="312" y="85" fill="#222" text-anchor="middle" font-size="9">flat 4</text>
<text x="20" y="110" fill="#222" font-size="11">i=1</text>
<rect x="60" y="90" width="56" height="34" stroke="#222" stroke-width="2.8" fill="#d9d9d9"/>
<text x="88" y="105" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">10</text>
<text x="88" y="119" fill="#222" text-anchor="middle" font-size="9">flat 5</text>
<rect x="116" y="90" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="144" y="105" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">11</text>
<text x="144" y="119" fill="#222" text-anchor="middle" font-size="9">flat 6</text>
<rect x="172" y="90" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="200" y="105" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">12</text>
<text x="200" y="119" fill="#222" text-anchor="middle" font-size="9">flat 7</text>
<rect x="228" y="90" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="256" y="105" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">13</text>
<text x="256" y="119" fill="#222" text-anchor="middle" font-size="9">flat 8</text>
<rect x="284" y="90" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="312" y="105" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">14</text>
<text x="312" y="119" fill="#222" text-anchor="middle" font-size="9">flat 9</text>
<text x="20" y="144" fill="#222" font-size="11">i=2</text>
<rect x="60" y="124" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="88" y="139" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">20</text>
<text x="88" y="153" fill="#222" text-anchor="middle" font-size="9">flat 10</text>
<rect x="116" y="124" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="144" y="139" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">21</text>
<text x="144" y="153" fill="#222" text-anchor="middle" font-size="9">flat 11</text>
<rect x="172" y="124" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="200" y="139" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">22</text>
<text x="200" y="153" fill="#222" text-anchor="middle" font-size="9">flat 12</text>
<rect x="228" y="124" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="256" y="139" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">23</text>
<text x="256" y="153" fill="#222" text-anchor="middle" font-size="9">flat 13</text>
<rect x="284" y="124" width="56" height="34" stroke="#222" stroke-width="2.8" fill="#d9d9d9"/>
<text x="312" y="139" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">24</text>
<text x="312" y="153" fill="#222" text-anchor="middle" font-size="9">flat 14</text>
<text x="20" y="178" fill="#222" font-size="11">i=3</text>
<rect x="60" y="158" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="88" y="173" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">30</text>
<text x="88" y="187" fill="#222" text-anchor="middle" font-size="9">flat 15</text>
<rect x="116" y="158" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="144" y="173" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">31</text>
<text x="144" y="187" fill="#222" text-anchor="middle" font-size="9">flat 16</text>
<rect x="172" y="158" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="200" y="173" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">32</text>
<text x="200" y="187" fill="#222" text-anchor="middle" font-size="9">flat 17</text>
<rect x="228" y="158" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="256" y="173" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">33</text>
<text x="256" y="187" fill="#222" text-anchor="middle" font-size="9">flat 18</text>
<rect x="284" y="158" width="56" height="34" stroke="#222" stroke-width="1" fill="none"/>
<text x="312" y="173" fill="#222" text-anchor="middle" font-size="13" font-family="monospace">34</text>
<text x="312" y="187" fill="#222" text-anchor="middle" font-size="9">flat 19</text>
<text x="360" y="74" fill="#222" font-size="12">arr[1]: flat 5, value 10</text>
<text x="360" y="100" fill="#222" font-size="12">arr[1] + 9: flat 5 + 9 = 14</text>
<text x="360" y="126" fill="#222" font-size="12">flat 14 = row 2, column 4</text>
<text x="360" y="152" fill="#222" font-size="12" font-weight="bold">*(arr[1] + 9) = 10*2 + 4 = 24</text>
<text x="20" y="212" fill="#222" font-size="12" font-weight="bold">The pointer runs on through the rows in memory order, so it crosses into row 2: option (C).</text>
</svg>
