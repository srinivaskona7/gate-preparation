<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Each option simplified using L1 regular and L2 context-free: B equals L1 intersect L2, C equals all strings, D equals L2, A can leave the context-free class</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" text-anchor="start" font-size="13" fill="#222" font-weight="bold">L1 regular, L2 context-free</text>
<line x1="15" y1="38" x2="645" y2="38" stroke="#222" stroke-width="1.4"/>
<text x="24" y="72" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(A)</text>
<text x="70" y="72" text-anchor="start" font-size="13" fill="#222" font-family="monospace">L1 ∩ ¬L2</text>
<text x="70" y="92" text-anchor="start" font-size="12" fill="#222">complement of a CFL is not always a CFL</text>
<rect x="540" y="52" width="100" height="30" rx="4" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="590" y="72" text-anchor="middle" font-size="12" fill="#222">not always CFL</text>
<text x="24" y="122" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(B)</text>
<text x="70" y="122" text-anchor="start" font-size="13" fill="#222" font-family="monospace">¬(¬L1 ∪ ¬L2)</text>
<text x="70" y="142" text-anchor="start" font-size="12" fill="#222">= L1 ∩ L2   (De Morgan), regular ∩ CFL</text>
<rect x="540" y="102" width="100" height="30" rx="4" fill="none" stroke="#222" stroke-width="2.2"/>
<text x="590" y="122" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">CFL</text>
<text x="24" y="172" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(C)</text>
<text x="70" y="172" text-anchor="start" font-size="13" fill="#222" font-family="monospace">L1 ∪ (L2 ∪ ¬L2)</text>
<text x="70" y="192" text-anchor="start" font-size="12" fill="#222">= L1 ∪ Σ*  =  Σ*   (a regular language)</text>
<rect x="540" y="152" width="100" height="30" rx="4" fill="none" stroke="#222" stroke-width="2.2"/>
<text x="590" y="172" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">CFL</text>
<text x="24" y="222" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(D)</text>
<text x="70" y="222" text-anchor="start" font-size="13" fill="#222" font-family="monospace">(L1 ∩ L2) ∪ (¬L1 ∩ L2)</text>
<text x="70" y="242" text-anchor="start" font-size="12" fill="#222">= (L1 ∪ ¬L1) ∩ L2  =  Σ* ∩ L2  =  L2</text>
<rect x="540" y="202" width="100" height="30" rx="4" fill="none" stroke="#222" stroke-width="2.2"/>
<text x="590" y="222" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">CFL</text>
<line x1="15" y1="268" x2="645" y2="268" stroke="#222" stroke-width="1.4"/>
<text x="20" y="292" text-anchor="start" font-size="12" fill="#222">Counterexample for (A): L1 = Σ*, L2 = complement of a^n b^n c^n (a CFL). Then L1 ∩ ¬L2 = a^n b^n c^n, not a CFL.</text>
<text x="20" y="314" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Context-free: (B), (C), (D).</text>
</svg>
