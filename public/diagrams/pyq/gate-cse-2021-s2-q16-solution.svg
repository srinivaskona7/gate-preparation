<circle cx="290" cy="188" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="290" y="192.42" text-anchor="middle" fill="#222" font-size="13">7</text>
<text x="530" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">DFS: first 3 visited</text>
<line x1="517.0" y1="63.0" x2="463.0" y2="109.0" stroke="#222" stroke-width="1.6"/>
<line x1="543.0" y1="63.0" x2="597.0" y2="109.0" stroke="#222" stroke-width="1.6"/>
