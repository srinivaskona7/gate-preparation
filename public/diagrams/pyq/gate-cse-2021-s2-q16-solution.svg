<circle cx="530" cy="52" r="17" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="530" y="56.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<text x="556" y="44" text-anchor="start" fill="#222" font-size="11">#1</text>
