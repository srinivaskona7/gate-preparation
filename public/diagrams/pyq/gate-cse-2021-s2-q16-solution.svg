<text x="350" y="250" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">A = {1, 2, 3}     B = {1, 2, 4}     A - B = {3}     |A - B| = 1</text>
<text x="350" y="274" text-anchor="middle" fill="#222" font-size="12">If DFS goes right first, B = {1, 3, 7} and A - B = {2}: the size is still 1.</text>
</svg>
