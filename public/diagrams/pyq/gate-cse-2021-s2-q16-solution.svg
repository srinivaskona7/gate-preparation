<text x="196" y="44" text-anchor="start" fill="#222" font-size="11">#1</text>
<circle cx="90" cy="120" r="17" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="90" y="124.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<text x="116" y="112" text-anchor="start" fill="#222" font-size="11">#2</text>
<circle cx="250" cy="120" r="17" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="250" y="124.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="276" y="112" text-anchor="start" fill="#222" font-size="11">#3</text>
<circle cx="50" cy="188" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
