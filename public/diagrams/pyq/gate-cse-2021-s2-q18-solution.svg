<text x="240" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/4</text>
<text x="240" y="134" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0.25</text>
<rect x="310" y="48" width="40" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="330.0" y="65.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">0</text>
<text x="330" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/8</text>
<text x="330" y="134" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<rect x="400" y="48" width="40" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="420.0" y="65.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">1</text>
<text x="420" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/16</text>
<text x="420" y="134" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0.0625</text>
<line x1="150" y1="142" x2="150" y2="152" stroke="#777777" stroke-width="1.2"/>
<text x="20" y="168" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">0.5 + 0.25 + 0 + 0.0625 = 0.8125</text>
<text x="20" y="204" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Step 2: line the digits up with 0.8 x y 5</text>
<text x="20" y="238" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">0.8125</text>
