<rect x="130" y="48" width="40" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="150.0" y="65.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">1</text>
<text x="150" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1/2</text>
<text x="150" y="134" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0.5</text>
<rect x="220" y="48" width="40" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
