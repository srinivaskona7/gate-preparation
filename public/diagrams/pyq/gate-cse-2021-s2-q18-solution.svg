<text x="352" y="262" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#777777">5</text>
<text x="20" y="262" font-size="13" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#777777">0.8xy5</text>
<text x="430" y="238" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">x = 1, y = 2, x + y = 3</text>
