<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
<title>Binary 0.1101 equals 0.8125, matching 0.8xy5 when x is 1 and y is 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Step 1: value of (0.1101) in binary, each place after the point halves</text>
