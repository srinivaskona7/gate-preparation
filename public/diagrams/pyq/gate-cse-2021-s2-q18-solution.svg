<text x="232" y="262" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#777777">x</text>
<rect x="270" y="220" width="44" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
