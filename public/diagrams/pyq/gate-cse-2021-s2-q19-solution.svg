<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Address split with a 22-bit tag: 4 index bits give 16 sets, so 32 lines are 2-way</title>
<text x="320" y="20" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">Byte address of a 2 KB set-associative cache with 64-byte blocks, 32-bit address</text><rect x="20" y="62" width="368.02973977695166" height="44" stroke-width="2"/><text x="204.01486988847583" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">tag</text><text x="204.01486988847583" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">22 bits (given)</text><text x="23" y="56" fill="#1f2937" stroke="none" font-size="10">31</text><text x="385.02973977695166" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">10</text><rect x="388.02973977695166" y="62" width="115.98513011152417" height="44" stroke-width="2"/><text x="446.02230483271376" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">index (set)</text><text x="446.02230483271376" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">32 - 22 - 6 = 4 bits</text><text x="391.02973977695166" y="56" fill="#1f2937" stroke="none" font-size="10">9</text><text x="501.0148698884758" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">6</text><rect x="504.0148698884758" y="62" width="115.98513011152417" height="44" stroke-width="2"/><text x="562.0074349442378" y="81" fill="#1f2937" stroke="none" text-anchor="middle" font-weight="bold">offset</text><text x="562.0074349442378" y="98" fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">6 bits: 64 bytes</text><text x="507.0148698884758" y="56" fill="#1f2937" stroke="none" font-size="10">5</text><text x="617" y="56" fill="#1f2937" stroke="none" text-anchor="end" font-size="10">0</text><text x="20" y="135" fill="#1f2937" stroke="none">Offset = log2 64 = 6.  Index = 32 - 22 - 6 = 4, so 2^4 = 16 sets.</text><text x="20" y="155" fill="#1f2937" stroke="none">Lines = 2 KB / 64 B = 2^11 / 2^6 = 32.</text><text x="20" y="175" fill="#1f2937" stroke="none" font-weight="bold">Lines per set = 32 / 16 = 2, so the cache is 2-way set associative.</text></svg>
