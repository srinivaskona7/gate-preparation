<line x1="79.8" y1="180.8" x2="94.6" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="175.2" y1="180.8" x2="160.4" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="187.3" y1="180.8" x2="202.1" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="282.7" y1="180.8" x2="267.9" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="294.8" y1="180.8" x2="309.6" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="390.2" y1="180.8" x2="375.4" y2="217.2" stroke="#222" stroke-width="1.6"/>
<line x1="402.3" y1="180.8" x2="417.1" y2="217.2" stroke="#222" stroke-width="1.6"/>
<circle cx="235" cy="34" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="235" y="38.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="127.5" cy="100" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="127.5" y="104.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<circle cx="342.5" cy="100" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="342.5" y="104.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="73.75" cy="166" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="73.75" y="170.42" text-anchor="middle" fill="#222" font-size="13">7</text>
<circle cx="181.25" cy="166" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="181.25" y="170.42" text-anchor="middle" fill="#222" font-size="13">4</text>
<circle cx="288.75" cy="166" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="288.75" y="170.42" text-anchor="middle" fill="#222" font-size="13">6</text>
<circle cx="396.25" cy="166" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="396.25" y="170.42" text-anchor="middle" fill="#222" font-size="13">5</text>
<circle cx="46.875" cy="232" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="46.875" y="236.42" text-anchor="middle" fill="#222" font-size="13">15</text>
<circle cx="100.625" cy="232" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="100.625" y="236.42" text-anchor="middle" fill="#222" font-size="13">9</text>
<circle cx="154.375" cy="232" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="154.375" y="236.42" text-anchor="middle" fill="#222" font-size="13">8</text>
<circle cx="208.125" cy="232" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
