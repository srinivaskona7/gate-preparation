<circle cx="423.125" cy="232" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="423.125" y="236.42" text-anchor="middle" fill="#222" font-size="13">13</text>
<text x="470" y="60" text-anchor="start" fill="#222" font-size="12">thin: internal (positions 1 to 7)</text>
<text x="470" y="80" text-anchor="start" fill="#222" font-size="12">thick: leaves (positions 8 to 15)</text>
<text x="470" y="114" text-anchor="start" fill="#222" font-size="12">An internal node has a larger child,</text>
<text x="470" y="132" text-anchor="start" fill="#222" font-size="12">so it cannot be the maximum.</text>
<text x="470" y="166" text-anchor="start" fill="#222" font-size="12">The maximum is one of the 8 leaves,</text>
<text x="470" y="184" text-anchor="start" fill="#222" font-size="12">and the leaves are not ordered among</text>
<text x="470" y="202" text-anchor="start" fill="#222" font-size="12">themselves: all must be compared.</text>
<text x="350" y="300" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">n elements: about n/2 leaves, n/2 - 1 comparisons at least, so Theta(n)  (option C).</text>
</svg>
