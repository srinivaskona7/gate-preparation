<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif" font-size="13">
<title>Binary min-heap of 15 values in array positions 1 to 15: every parent is smaller than its children, so the maximum 15 is at a leaf; positions 8 to 15 are the 8 leaves (thick), and any leaf could hold the maximum</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
