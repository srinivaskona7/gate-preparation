<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140">
<title>Cycle stealing: 0.5 percent of cycles</title>
<text x="320" y="20" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">2 MHz clock: 2,000,000 cycles per second, 1 in 200 stolen</text>
<g stroke="#1a1a1a" stroke-width="1.5" fill="none">
<rect x="20" y="40" width="600" height="36"/>
<line x1="80" y1="40" x2="80" y2="76"/><line x1="140" y1="40" x2="140" y2="76"/><line x1="200" y1="40" x2="200" y2="76"/><line x1="260" y1="40" x2="260" y2="76"/><line x1="320" y1="40" x2="320" y2="76"/><line x1="380" y1="40" x2="380" y2="76"/><line x1="440" y1="40" x2="440" y2="76"/><line x1="500" y1="40" x2="500" y2="76"/><line x1="560" y1="40" x2="560" y2="76"/>
<rect x="320" y="40" width="60" height="36" fill="#cccccc"/></g>
<g font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
<text x="350" y="64">DMA</text><text x="170" y="64" font-size="10">CPU cycles</text><text x="530" y="64" font-size="10">CPU cycles</text>
<text x="320" y="105">10,000 DMA cycles per second x 8 bits = 80,000 bits per second</text></g>
</svg>
