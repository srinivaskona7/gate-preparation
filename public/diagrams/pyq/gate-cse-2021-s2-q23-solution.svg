<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 178" font-family="sans-serif" font-size="13">
<title>Chain of calls from (15,255) subtracting 15 each time to (15,15), which returns 15</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">SomeFunction subtracts the smaller from the larger until both are equal</text>
<rect x="20" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="60" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">(15, 255)</text>
<path d="M100,68 L110,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="110" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="150" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">(15, 240)</text>
<path d="M190,68 L200,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="200" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="240" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">(15, 225)</text>
<path d="M280,68 L290,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="290" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="330" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">...</text>
<path d="M370,68 L380,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="380" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="420" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">(15, 45)</text>
<path d="M460,68 L470,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="470" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="510" y="72" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">(15, 30)</text>
<path d="M550,68 L560,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="560" y="50" width="80" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="600" y="72" fill="#222" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace">(15, 15)</text>
<text x="20" y="116" fill="#222" font-size="12">Every step: y &gt; x, so call (x, y - x), i.e. y loses 15. Steps from 255 down to 15: 255 = 17 * 15, so 16 steps.</text>
<text x="20" y="138" fill="#222" font-size="12">At (15, 15): x == y, return x = 15. Neither argument is ever 1, so the first test never fires.</text>
<text x="20" y="162" fill="#222" font-size="13" font-weight="bold">The result is gcd(15, 255) = 15.</text>
</svg>
