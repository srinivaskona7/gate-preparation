<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" font-family="sans-serif" font-size="13">
<title>Graph over -3 to 3: the line of slope 2 through (-3, 7) is the upper bound, reaching 19 at x = 3</title>
<line x1="30" y1="230" x2="480" y2="230" stroke="#222" stroke-width="1.2"/>
<line x1="270" y1="20" x2="270" y2="240" stroke="#222" stroke-width="1.2"/>
<line x1="60" y1="167" x2="480" y2="59" stroke="#222" stroke-width="2.2"/>
<circle cx="60" cy="167" r="4" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="54" y="159" text-anchor="start" fill="#222" font-size="12">(-3, 7)</text>
<circle cx="480" cy="59" r="5" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="476" y="49" text-anchor="end" fill="#222" font-size="12">f(3) = 19 at most</text>
<text x="278" y="129" text-anchor="start" fill="#222" font-size="12">slope 2: the steepest allowed</text>
<text x="280" y="167" text-anchor="start" fill="#222" font-size="11">a graph with slope at most 2 stays under the line</text>
<text x="60" y="248" text-anchor="middle" fill="#222" font-size="12">-3</text>
<text x="480" y="248" text-anchor="middle" fill="#222" font-size="12">3</text>
</svg>
