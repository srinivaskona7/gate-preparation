<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif" font-size="13">
<title>Two-state Mealy machine: state s remembers the previous input bit; an edge b / y has t = b and y = s AND b</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="150" cy="120" r="36" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="150" y="124.33333333333333" text-anchor="middle" fill="#222" font-size="13">s = 0</text>
<circle cx="370" cy="120" r="36" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="370" y="124.33333333333333" text-anchor="middle" fill="#222" font-size="13">s = 1</text>
<path d="M186.0,109.5 Q260.0,90.0 330.0,109.5" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="259.0" y="95.75" text-anchor="middle" fill="#222" font-size="12">b=1 / y=0</text>
<path d="M334.0,130.5 Q260.0,150.0 190.0,130.5" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="261.0" y="156.25" text-anchor="middle" fill="#222" font-size="12">b=0 / y=0</text>
<path d="M138,87 C120,46 180,46 162,87" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="150" y="50" text-anchor="middle" fill="#222" font-size="12">b=0 / y=0</text>
<path d="M358,87 C340,46 400,46 382,87" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370" y="50" text-anchor="middle" fill="#222" font-size="12">b=1 / y=1</text>
<text x="260" y="235" text-anchor="middle" fill="#222" font-size="12">t = b (next state = bit just read) ;  y = s b (1 only on the second 1 of a run)</text>
</svg>
