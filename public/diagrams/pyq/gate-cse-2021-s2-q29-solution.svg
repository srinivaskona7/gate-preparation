<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif">
<title>Two decision trees: attempting QuesA first gives 0.8 times (10 plus 0.5 times 20) = 16; attempting QuesB first gives 0.5 times (20 plus 0.8 times 10) = 14</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<text x="160" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#b3261e">QuesA first, then QuesB</text>
<circle cx="30" cy="150" r="8" fill="#222" stroke="#222" stroke-width="1.5"/>
<line x1="36" y1="156" x2="150" y2="260" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="70" y="225" text-anchor="end" font-size="11" fill="#222">wrong 0.2</text>
<text x="160" y="275" text-anchor="start" font-size="12" fill="#222">marks 0</text>
<line x1="36" y1="144" x2="150" y2="90" stroke="#b3261e" stroke-width="2" marker-end="url(#ar)"/>
<text x="60" y="100" text-anchor="end" font-size="11" font-weight="bold" fill="#222">right 0.8</text>
<circle cx="160" cy="90" r="8" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="160" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">+10</text>
<line x1="168" y1="96" x2="260" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="210" y="136" text-anchor="end" font-size="11" fill="#222">wrong 0.5</text>
<text x="266" y="140" text-anchor="start" font-size="12" fill="#222">marks 10</text>
<line x1="168" y1="84" x2="260" y2="50" stroke="#b3261e" stroke-width="2" marker-end="url(#ar)"/>
<text x="215" y="56" text-anchor="end" font-size="11" font-weight="bold" fill="#222">right 0.5</text>
<text x="266" y="54" text-anchor="start" font-size="12" fill="#222">marks 30</text>
<text x="160" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#b3261e">E = 0.8 (10 + 0.5 x 20) = 16</text>
<text x="510" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">QuesB first, then QuesA</text>
<circle cx="380" cy="150" r="8" fill="#222" stroke="#222" stroke-width="1.5"/>
<line x1="386" y1="156" x2="500" y2="260" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="420" y="225" text-anchor="end" font-size="11" fill="#222">wrong 0.5</text>
<text x="510" y="275" text-anchor="start" font-size="12" fill="#222">marks 0</text>
<line x1="386" y1="144" x2="500" y2="90" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
<text x="410" y="100" text-anchor="end" font-size="11" font-weight="bold" fill="#222">right 0.5</text>
<circle cx="510" cy="90" r="8" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="510" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">+20</text>
<line x1="518" y1="96" x2="610" y2="135" stroke="#222" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="560" y="136" text-anchor="end" font-size="11" fill="#222">wrong 0.2</text>
<text x="616" y="140" text-anchor="start" font-size="12" fill="#222">marks 20</text>
<line x1="518" y1="84" x2="610" y2="50" stroke="#222" stroke-width="2" marker-end="url(#ar)"/>
<text x="565" y="56" text-anchor="end" font-size="11" font-weight="bold" fill="#222">right 0.8</text>
<text x="616" y="54" text-anchor="start" font-size="12" fill="#222">marks 30</text>
<text x="510" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">E = 0.5 (20 + 0.8 x 10) = 14</text>
</svg>
