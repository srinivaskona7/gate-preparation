<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" font-family="sans-serif" font-size="13">
<title>Precedence graph of the three-transaction schedule S</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<path d="M80.99855951677065,83.43795015100918 Q140,65 193.27456061501917,48.35169980780651" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="137.01725006864052" y="59.455200219649704" text-anchor="middle" font-size="12" fill="#111">Y</text><path d="M240.99855951677065,46.562049848990824 Q300,65 353.2745606150192,81.64830019219349" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="302.9827499313595" y="59.455200219649704" text-anchor="middle" font-size="12" fill="#111">Z</text><path d="M82,90 Q220,90 352,90" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="220" y="84" text-anchor="middle" font-size="12" fill="#111">X</text><circle cx="60" cy="90" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><circle cx="220" cy="40" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="220" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><circle cx="380" cy="90" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="380" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T3</text><text x="220" y="170" text-anchor="middle" font-size="12" fill="#111">Acyclic, so P is true. T3 reads X written by T1: T3 must not commit before T1.</text>
