<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" font-family="sans-serif" font-size="13">
<title>Linked list of four nodes holding 0 to 3; the next pointer of node 3 is never set and the second loop dereferences it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">The first loop builds head -&gt; 0 -&gt; 1 -&gt; 2 -&gt; 3 and never sets the last next</text>
<rect x="70" y="50" width="90" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M115,50 L115,90" stroke="#222" fill="none"/>
<text x="92" y="75" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">0</text>
<text x="137" y="75" fill="#222" text-anchor="middle" font-size="11">next</text>
<path d="M160,70 L200,70" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="115" y="110" fill="#222" text-anchor="middle" font-size="11">node 0</text>
<rect x="200" y="50" width="90" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M245,50 L245,90" stroke="#222" fill="none"/>
<text x="222" y="75" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">1</text>
<text x="267" y="75" fill="#222" text-anchor="middle" font-size="11">next</text>
<path d="M290,70 L330,70" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="245" y="110" fill="#222" text-anchor="middle" font-size="11">node 1</text>
<rect x="330" y="50" width="90" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M375,50 L375,90" stroke="#222" fill="none"/>
<text x="352" y="75" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">2</text>
<text x="397" y="75" fill="#222" text-anchor="middle" font-size="11">next</text>
<path d="M420,70 L460,70" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="375" y="110" fill="#222" text-anchor="middle" font-size="11">node 2</text>
<rect x="460" y="50" width="90" height="40" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M505,50 L505,90" stroke="#222" fill="none"/>
<text x="482" y="75" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">3</text>
<text x="527" y="75" fill="#222" text-anchor="middle" font-size="11">?</text>
<text x="505" y="110" fill="#222" text-anchor="middle" font-size="11">node 3</text>
<rect x="590" y="50" width="90" height="40" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="635" y="75" fill="#222" text-anchor="middle" font-size="11">garbage</text>
<path d="M550,70 L590,70" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="20" y="150" fill="#222" font-size="12">Second loop: at index k it prints head-&gt;value, moves head one node, prints head-&gt;value again.</text>
<text x="20" y="172" fill="#222" font-size="12">Index 0: prints 0, 1.   Index 1: prints 1, 2.   Index 2: prints 2, 3.   Index 3: prints 3, then head = node 3 next = garbage,</text>
<text x="20" y="194" fill="#222" font-size="12">and head-&gt;value reads through a pointer that was never initialised: a possible run-time error.</text>
<text x="20" y="224" fill="#222" font-size="12" font-weight="bold">Four nodes (not five), a bounded loop, and a legal main: only option (D) is correct.</text>
</svg>
