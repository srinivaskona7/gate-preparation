<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="sans-serif">
<title>Live-variable sets around a two-statement block S1 then S2 (GATE 2021 CS2 Q38)</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs>
<rect x="120" y="70" width="150" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="195" y="100" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">S1</text>
<rect x="370" y="70" width="150" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="445" y="100" font-size="15" text-anchor="middle" fill="#222" font-weight="bold">S2</text>
<line x1="270" y1="95" x2="370" y2="95" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="60" y1="95" x2="120" y2="95" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="520" y1="95" x2="590" y2="95" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="60" y="60" font-size="13" text-anchor="middle" fill="#222">IN(S1)</text>
<text x="320" y="58" font-size="13" text-anchor="middle" fill="#b3261e" font-weight="bold">OUT(S1) = IN(S2)</text>
<text x="590" y="60" font-size="13" text-anchor="middle" fill="#222">OUT(S2)</text>
<text x="320" y="150" font-size="12" text-anchor="middle" fill="#222">S1 has one successor, S2, so what is live after S1 is exactly what is live before S2.</text>
<text x="320" y="175" font-size="12" text-anchor="middle" fill="#222">IN(S) = USE(S) union (OUT(S) minus DEF(S)).   OUT(S1) = IN(S2), nothing added, nothing removed.</text>
</svg>
