<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262">
<title>Single-precision layout and the four options: only exponent 00000001 with fraction all zero is the smallest normalised number</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">IEEE 754 single precision: 1 + 8 + 23 = 32 bits</text>
<text x="20" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">sign</text>
<rect x="20" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="28.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a" font-weight="bold">S</text>
<text x="43" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">exponent E (8 bits)</text>
<rect x="43" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="51.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="60" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="68.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="77" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="85.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="94" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="102.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="111" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="119.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="128" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="136.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="145" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="153.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<rect x="162" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="170.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E</text>
<text x="185" y="48" font-size="11" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">fraction F (23 bits)</text>
<rect x="185" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="193.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">F</text>
<rect x="202" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="210.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">F</text>
<rect x="219" y="58" width="17" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="227.5" y="75.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">F</text>
<rect x="236" y="58" width="56" height="26" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="264.0" y="75.2" font-size="12" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">...</text>
<text x="20" y="112" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Normalised number: value = (-1)^S x 1.F x 2^(E - 127), allowed for E = 1 to 254 only</text>
<text x="20" y="130" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">E = 0 is reserved for zero and subnormals, E = 255 for infinity and NaN</text>
<rect x="20" y="153" width="24" height="22" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="32.0" y="168.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">A</text>
<text x="54" y="168" font-size="12" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E = 00000000, F = all 0</text>
<text x="262" y="168" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">zero: not a normalised number</text>
<rect x="20" y="179" width="24" height="22" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="32.0" y="194.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">B</text>
<text x="54" y="194" font-size="12" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E = 00000000, F = 0...01</text>
<text x="262" y="194" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">subnormal 2^-149: not normalised</text>
<rect x="20" y="205" width="24" height="22" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="32.0" y="220.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">C</text>
<text x="54" y="220" font-size="12" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E = 00000001, F = all 0</text>
<text x="262" y="220" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">1.0 x 2^(1-127) = 2^-126: smallest normalised</text>
<text x="620" y="220" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">correct</text>
<rect x="20" y="231" width="24" height="22" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="32.0" y="246.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">D</text>
<text x="54" y="246" font-size="12" text-anchor="start" font-family="Courier New, Courier, monospace" fill="#1a1a1a">E = 00000001, F = 0...01</text>
<text x="262" y="246" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">(1 + 2^-23) x 2^-126: larger than C</text>
</svg>
