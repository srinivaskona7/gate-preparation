<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="sans-serif" font-size="13">
<title>Two processes P1 and P2, each with its own global x ending at 2 and two threads whose local y is 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="360" y="24" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">P1 and P2 are two processes, so each has its own copy of x</text>
<rect x="20" y="40" width="330" height="270" rx="6" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="185" y="60" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Process P1 (own address space)</text>
<rect x="35" y="72" width="300" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="185" y="92" text-anchor="middle" fill="#222" font-size="12">global x (shared by T1 and T2 of P1)</text>
<text x="185" y="110" text-anchor="middle" fill="#222" font-size="12">x: 0, then 1, then 2 under lock L1</text>
<rect x="35" y="150" width="147" height="100" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="108" y="170" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T1</text>
<text x="108" y="192" text-anchor="middle" fill="#222" font-size="12">local y (own stack)</text>
<text x="108" y="212" text-anchor="middle" fill="#222" font-size="12">y = 0, then y = 1</text>
<text x="108" y="236" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">prints y = 1</text>
<rect x="188" y="150" width="147" height="100" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="261" y="170" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T2</text>
<text x="261" y="192" text-anchor="middle" fill="#222" font-size="12">local y (own stack)</text>
<text x="261" y="212" text-anchor="middle" fill="#222" font-size="12">y = 0, then y = 1</text>
<text x="261" y="236" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">prints y = 1</text>
<text x="185" y="280" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">main waits for both, prints x = 2</text>
<text x="185" y="298" text-anchor="middle" fill="#222" font-size="12">the lock makes both increments count</text>
<rect x="370" y="40" width="330" height="270" rx="6" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="535" y="60" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Process P2 (own address space)</text>
<rect x="385" y="72" width="300" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="535" y="92" text-anchor="middle" fill="#222" font-size="12">global x (shared by T1 and T2 of P2)</text>
<text x="535" y="110" text-anchor="middle" fill="#222" font-size="12">x: 0, then 1, then 2 under lock L1</text>
<rect x="385" y="150" width="147" height="100" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="458" y="170" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T1</text>
<text x="458" y="192" text-anchor="middle" fill="#222" font-size="12">local y (own stack)</text>
<text x="458" y="212" text-anchor="middle" fill="#222" font-size="12">y = 0, then y = 1</text>
<text x="458" y="236" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">prints y = 1</text>
<rect x="538" y="150" width="147" height="100" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="611" y="170" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Thread T2</text>
<text x="611" y="192" text-anchor="middle" fill="#222" font-size="12">local y (own stack)</text>
<text x="611" y="212" text-anchor="middle" fill="#222" font-size="12">y = 0, then y = 1</text>
<text x="611" y="236" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">prints y = 1</text>
<text x="535" y="280" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">main waits for both, prints x = 2</text>
<text x="535" y="298" text-anchor="middle" fill="#222" font-size="12">the lock makes both increments count</text>
<text x="360" y="336" text-anchor="middle" fill="#222" font-size="12">No variable crosses the dashed boundary between P1 and P2.</text>
</svg>
