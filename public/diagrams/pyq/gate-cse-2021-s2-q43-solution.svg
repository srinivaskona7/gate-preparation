<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>Live-lock cycle of the preempting scheme: P needs R1 then R2, Q needs R2 then R1, and each keeps terminating the other before it can finish</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">P needs R1 then R2.  Q needs R2 then R1.  A request for a resource someone owns terminates the owner, which restarts.</text>
<rect x="20" y="60" width="230" height="80" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="135.0" y="89.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">State 0</text>
<text x="135.0" y="104.0" text-anchor="middle" fill="#222" font-size="12">P owns R1, R2 (about to finish)</text>
<text x="135.0" y="119.0" text-anchor="middle" fill="#222" font-size="12">Q owns nothing</text>
<rect x="520" y="60" width="240" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="640.0" y="89.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">State 1</text>
<text x="640.0" y="104.0" text-anchor="middle" fill="#222" font-size="12">P restarted, owns nothing</text>
<text x="640.0" y="119.0" text-anchor="middle" fill="#222" font-size="12">Q owns R2</text>
<rect x="270" y="200" width="240" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="390.0" y="229.0" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">State 2</text>
<text x="390.0" y="244.0" text-anchor="middle" fill="#222" font-size="12">P owns R1</text>
<text x="390.0" y="259.0" text-anchor="middle" fill="#222" font-size="12">Q owns R2</text>
<line x1="250.0" y1="100.0" x2="520.0" y2="100.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="385" y="92" text-anchor="middle" fill="#222" font-size="11">Q requests R2, P terminated</text>
<line x1="640.0" y1="140.0" x2="520.0" y2="200.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="650" y="178" text-anchor="start" fill="#222" font-size="11">P requests R1 (free)</text>
<line x1="300.0" y1="200.0" x2="170.0" y2="140.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="190" text-anchor="start" fill="#222" font-size="11">P requests R2,</text>
<text x="20" y="204" text-anchor="start" fill="#222" font-size="11">Q terminated</text>
<text x="20" y="310" text-anchor="start" fill="#222" font-size="12">The three moves return to State 0, so a process can be cut off forever: live-lock and starvation, yet no process ever blocks.</text>
</svg>
