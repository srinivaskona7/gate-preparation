<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
<title>Two bytes in memory read as little endian and as big endian: options A and D differ by 255, options B and C by minus 255</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="14" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Same two bytes in memory, read two ways: LE value minus BE value must be +255</text>
<rect x="20" y="56" width="24" height="24" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="32.0" y="72.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">A</text>
<text x="56" y="52" font-size="10" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">address</text>
<text x="72" y="94" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">0</text>
<text x="122" y="94" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">1</text>
<rect x="52" y="56" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="72.0" y="72.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">65</text>
<rect x="102" y="56" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="122.0" y="72.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">66</text>
<text x="170" y="72" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE: byte at address 1 is the high byte -&gt; 0x6665 = 26213</text>
<text x="170" y="90" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">BE: byte at address 0 is the high byte -&gt; 0x6566 = 25958</text>
<text x="620" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">LE - BE = +255</text>
<text x="620" y="90" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">fits</text>
<rect x="20" y="122" width="24" height="24" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="32.0" y="138.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">D</text>
<text x="56" y="118" font-size="10" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">address</text>
<text x="72" y="160" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">0</text>
<text x="122" y="160" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">1</text>
<rect x="52" y="122" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="72.0" y="138.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">00</text>
<rect x="102" y="122" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="122.0" y="138.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">01</text>
<text x="170" y="138" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE: byte at address 1 is the high byte -&gt; 0x0100 = 256</text>
<text x="170" y="156" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">BE: byte at address 0 is the high byte -&gt; 0x0001 = 1</text>
<text x="620" y="138" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">LE - BE = +255</text>
<text x="620" y="156" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">fits</text>
<rect x="20" y="188" width="24" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="32.0" y="204.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">B</text>
<text x="56" y="184" font-size="10" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">address</text>
<text x="72" y="226" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">0</text>
<text x="122" y="226" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">1</text>
<rect x="52" y="188" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="72.0" y="204.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">01</text>
<rect x="102" y="188" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="122.0" y="204.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">00</text>
<text x="170" y="204" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE: byte at address 1 is the high byte -&gt; 0x0001 = 1</text>
<text x="170" y="222" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">BE: byte at address 0 is the high byte -&gt; 0x0100 = 256</text>
<text x="620" y="204" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE - BE = -255</text>
<text x="620" y="222" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">does not fit</text>
<rect x="20" y="254" width="24" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="32.0" y="270.55" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">C</text>
<text x="56" y="250" font-size="10" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#777777">address</text>
<text x="72" y="292" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">0</text>
<text x="122" y="292" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#777777">1</text>
<rect x="52" y="254" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="72.0" y="270.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">43</text>
<rect x="102" y="254" width="40" height="24" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="122.0" y="270.55" font-size="13" text-anchor="middle" font-family="Courier New, Courier, monospace" fill="#1a1a1a">42</text>
<text x="170" y="270" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE: byte at address 1 is the high byte -&gt; 0x4243 = 16963</text>
<text x="170" y="288" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">BE: byte at address 0 is the high byte -&gt; 0x4342 = 17218</text>
<text x="620" y="270" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">LE - BE = -255</text>
<text x="620" y="288" font-size="12" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">does not fit</text>
<text x="20" y="320" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Rule: with high byte H and low byte L, LE - BE = (256H + L) - (256L + H) = 255(H - L), so H - L must be 1.</text>
</svg>
