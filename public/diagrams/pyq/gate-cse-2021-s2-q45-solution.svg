<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 215" font-family="sans-serif" font-size="13">
<title>Distance vector update at R: best route to P is 8 via Y and best route to Q is 7 via X</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Cost of reaching each destination = link cost R to neighbour + neighbour's advertised distance</text>
<rect x="20" y="44" width="130" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="85.0" y="64" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">via</text>
<rect x="150" y="44" width="140" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="220.0" y="64" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">X (link 3)</text>
<rect x="290" y="44" width="140" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="360.0" y="64" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Y (link 2)</text>
<rect x="430" y="44" width="140" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="500.0" y="64" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Z (link 5)</text>
<rect x="570" y="44" width="150" height="30" fill="#eee" stroke="#222" stroke-width="1.5"/><text x="645.0" y="64" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Best</text>
<rect x="20" y="74" width="130" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="85.0" y="99" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">To P</text>
<rect x="150" y="74" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="220.0" y="99" text-anchor="middle" fill="#222" font-size="12">3 + 7 = 10</text>
<rect x="290" y="74" width="140" height="40" fill="#dde" stroke="#222" stroke-width="2.5"/><text x="360.0" y="99" text-anchor="middle" fill="#222" font-size="12">2 + 6 = 8</text>
<rect x="430" y="74" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="500.0" y="99" text-anchor="middle" fill="#222" font-size="12">5 + 5 = 10</text>
<rect x="570" y="74" width="150" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="645.0" y="99" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Y, cost 8</text>
<rect x="20" y="114" width="130" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="85.0" y="139" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">To Q</text>
<rect x="150" y="114" width="140" height="40" fill="#dde" stroke="#222" stroke-width="2.5"/><text x="220.0" y="139" text-anchor="middle" fill="#222" font-size="12">3 + 4 = 7</text>
<rect x="290" y="114" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="360.0" y="139" text-anchor="middle" fill="#222" font-size="12">2 + 6 = 8</text>
<rect x="430" y="114" width="140" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="500.0" y="139" text-anchor="middle" fill="#222" font-size="12">5 + 8 = 13</text>
<rect x="570" y="114" width="150" height="40" fill="none" stroke="#222" stroke-width="1.5"/><text x="645.0" y="139" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">X, cost 7</text>
<text x="20" y="180" text-anchor="start" fill="#222" font-size="12">New table at R: P is 8 away through Y; Q is 7 away through X.</text>
<text x="20" y="200" text-anchor="start" fill="#222" font-size="12">So (B) Q = 7 and (C) next hop to P is Y are correct; (A) 10 and (D) next hop Z are not.</text>
</svg>
