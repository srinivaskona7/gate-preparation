<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" font-family="sans-serif" font-size="13">
<title>Router R with neighbours X, Y and Z, and the network below leading to routers Q and P</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<circle cx="250" cy="40" r="11" fill="#222" stroke="#222" stroke-width="1.5"/><text x="268" y="36" text-anchor="start" fill="#222" font-size="14" font-weight="bold">R</text>
<line x1="250" y1="40" x2="130" y2="110" stroke="#222" stroke-width="1.5"/>
<circle cx="130" cy="110" r="10" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="110" y="106" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">X</text>
<line x1="130" y1="120" x2="112" y2="150" stroke="#222" stroke-width="1.5"/>
<line x1="130" y1="120" x2="148" y2="150" stroke="#222" stroke-width="1.5"/>
<text x="130" y="175" text-anchor="middle" fill="#222" font-size="16">...</text>
<line x1="250" y1="40" x2="250" y2="110" stroke="#222" stroke-width="1.5"/>
<circle cx="250" cy="110" r="10" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="230" y="106" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Y</text>
<line x1="250" y1="120" x2="232" y2="150" stroke="#222" stroke-width="1.5"/>
<line x1="250" y1="120" x2="268" y2="150" stroke="#222" stroke-width="1.5"/>
<text x="250" y="175" text-anchor="middle" fill="#222" font-size="16">...</text>
<line x1="250" y1="40" x2="370" y2="110" stroke="#222" stroke-width="1.5"/>
<circle cx="370" cy="110" r="10" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="390" y="106" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Z</text>
<line x1="370" y1="120" x2="352" y2="150" stroke="#222" stroke-width="1.5"/>
<line x1="370" y1="120" x2="388" y2="150" stroke="#222" stroke-width="1.5"/>
<text x="370" y="175" text-anchor="middle" fill="#222" font-size="16">...</text>
<line x1="190" y1="190" x2="190" y2="240" stroke="#222" stroke-width="1.5"/>
<circle cx="190" cy="252" r="10" fill="#222" stroke="#222" stroke-width="1.5"/><text x="172" y="258" text-anchor="end" fill="#222" font-size="14" font-weight="bold">Q</text>
<line x1="380" y1="190" x2="380" y2="240" stroke="#222" stroke-width="1.5"/>
<circle cx="380" cy="252" r="10" fill="#222" stroke="#222" stroke-width="1.5"/><text x="398" y="258" text-anchor="start" fill="#222" font-size="14" font-weight="bold">P</text>
<text x="10" y="295" text-anchor="start" fill="#222" font-size="11">Partial topology: R has three neighbours X, Y, Z; the network continues below them (dots) to P and Q.</text>
</svg>
