<text x="48" y="335" text-anchor="start" font-size="15" font-weight="bold" fill="#222">S</text>
<text x="115" y="269" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">A</text>
<text x="295" y="269" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">B</text>
<text x="205" y="99" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">C</text>
<text x="410" y="60" text-anchor="start" font-size="12" fill="#222">Bold: edges of a directed 4-cycle</text>
<text x="410" y="80" text-anchor="start" font-size="12" fill="#222">Dashed: back edge found by DFS</text>
<text x="410" y="120" text-anchor="start" font-size="12" font-weight="bold" fill="#222">Cycles A, B and C each close once,</text>
<text x="410" y="140" text-anchor="start" font-size="12" font-weight="bold" fill="#222">so DFS finds 3 back edges in all</text>
<text x="410" y="180" text-anchor="start" font-size="12" fill="#222">A cycle means no topological order</text>
<text x="410" y="200" text-anchor="start" font-size="12" fill="#222">(a DAG has none).</text>
<text x="410" y="230" text-anchor="start" font-size="12" fill="#222">A, B, C are the only SCCs of size 4;</text>
<text x="410" y="250" text-anchor="start" font-size="12" fill="#222">the other 4 vertices are SCCs alone,</text>
<text x="410" y="270" text-anchor="start" font-size="12" fill="#222">so the graph is not strongly connected.</text>
</svg>
