<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
<title>Three-state DFA for binary numbers divisible by three: state r is the remainder so far, bit b moves r to (2r+b) mod 3, and the loops at state 0 give 0 and 1(01*0)*1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="120" cy="120" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="120" cy="120" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="68" y1="120" x2="101" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="120.0" y="124.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<circle cx="320" cy="120" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="320.0" y="124.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<circle cx="520" cy="120" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="520.0" y="124.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">2</text>
<path d="M135.7,111.2 Q220.0,64.0 304.3,111.2" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="220.0" y="80.6" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<path d="M304.3,128.8 Q220.0,176.0 135.7,128.8" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="220.0" y="167.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<path d="M335.7,111.2 Q420.0,64.0 504.3,111.2" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="420.0" y="80.6" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M504.3,128.8 Q420.0,176.0 335.7,128.8" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="420.0" y="167.4" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M110,104 C86,62 154,62 130,104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="120.0" y="66.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M510,104 C486,62 554,62 530,104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="520.0" y="66.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<text x="320.0" y="225.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Next remainder = (2r + bit) mod 3. Circle r = remainder r. Start and accept: 0 (the empty string).</text>
<text x="320.0" y="250.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Loops that leave state 0 and return: 0, and 1(01*0)*1 through states 1 and 2.</text>
<text x="320.0" y="275.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Route through state 2 instead: 11, and 10(1+00)*01.</text>
<text x="320.0" y="305.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Test 1001 (nine): states 0, 1, 2, 1, 0. Accepted, but option D cannot generate it.</text>
</svg>
