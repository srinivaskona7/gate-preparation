<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="sans-serif" font-size="13">
<title>Page tables needed for 2 GB: 1 level-1 table, 2 level-2 tables, 1024 level-3 tables, 1027 tables of 4 KB each, 4108 KB</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="215" y="15" width="130" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="280" y="33" text-anchor="middle" fill="#222">Level 1: 1 table</text><text x="280" y="48" text-anchor="middle" fill="#222" font-size="11">2 of 512 entries used</text>
<rect x="75" y="100" width="130" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="140" y="118" text-anchor="middle" fill="#222">Level 2: table A</text><text x="140" y="133" text-anchor="middle" fill="#222" font-size="11">512 entries used</text>
<rect x="355" y="100" width="130" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="420" y="118" text-anchor="middle" fill="#222">Level 2: table B</text><text x="420" y="133" text-anchor="middle" fill="#222" font-size="11">512 entries used</text>
<path d="M250,55 L160,98" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M310,55 L400,98" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="30" y="195" width="220" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="140" y="213" text-anchor="middle" fill="#222">512 level-3 tables</text><text x="140" y="228" text-anchor="middle" fill="#222" font-size="11">each maps 512 pages</text>
<rect x="310" y="195" width="220" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="420" y="213" text-anchor="middle" fill="#222">512 level-3 tables</text><text x="420" y="228" text-anchor="middle" fill="#222" font-size="11">each maps 512 pages</text>
<path d="M140,140 L140,193" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M420,140 L420,193" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="280" y="260" text-anchor="middle" fill="#222">(1 + 2 + 1024) tables x 4 KB = 4108 KB</text>
</svg>
