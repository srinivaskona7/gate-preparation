<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" font-family="sans-serif" font-size="13">
<title>39-bit virtual address split into Level 1 offset 9 bits, Level 2 offset 9 bits, Level 3 offset 9 bits and page offset 12 bits</title>
<text x="260" y="22" text-anchor="middle" fill="#222">39-bit virtual address</text>
<path d="M20,32 L500,32" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M20,28 L20,36 M500,28 L500,36" stroke="#222" stroke-width="1.5" fill="none"/>
<rect x="20" y="50" width="120" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="140" y="50" width="120" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="260" y="50" width="120" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="380" y="50" width="120" height="44" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="80" y="70" text-anchor="middle" fill="#222">Level 1</text><text x="80" y="86" text-anchor="middle" fill="#222">offset</text>
<text x="200" y="70" text-anchor="middle" fill="#222">Level 2</text><text x="200" y="86" text-anchor="middle" fill="#222">offset</text>
<text x="320" y="70" text-anchor="middle" fill="#222">Level 3</text><text x="320" y="86" text-anchor="middle" fill="#222">offset</text>
<text x="440" y="70" text-anchor="middle" fill="#222">Page</text><text x="440" y="86" text-anchor="middle" fill="#222">offset</text>
<text x="80" y="116" text-anchor="middle" fill="#222">9 bits</text><text x="200" y="116" text-anchor="middle" fill="#222">9 bits</text><text x="320" y="116" text-anchor="middle" fill="#222">9 bits</text><text x="440" y="116" text-anchor="middle" fill="#222">12 bits</text>
<text x="260" y="140" text-anchor="middle" fill="#222" font-size="12">page = 4 KB, entry = 8 bytes at every level</text>
</svg>
