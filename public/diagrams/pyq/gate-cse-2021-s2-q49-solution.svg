<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" font-family="sans-serif" font-size="13">
<title>Three by three grid of pending calls with path counts 1, 1, 1 / 1, 2, 3 / 1, 3, 6; six paths reach the base case and each returns 10, giving 60</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">foo(15, 15, 10): steps of 10 left in x and in y (ceil(15/10) = 2 each). Number = paths to (0, 0)</text>
<path d="M112,84 L188,84" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M90,104 L90,134" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="90" cy="84" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="90" y="89" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">1</text>
<path d="M232,84 L308,84" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M210,104 L210,134" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="210" cy="84" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="210" y="89" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">1</text>
<path d="M330,104 L330,134" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="330" cy="84" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330" y="89" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">1</text>
<path d="M112,154 L188,154" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M90,174 L90,204" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="90" cy="154" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="90" y="159" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">1</text>
<path d="M232,154 L308,154" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M210,174 L210,204" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="210" cy="154" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="210" y="159" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">2</text>
<path d="M330,174 L330,204" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="330" cy="154" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330" y="159" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">3</text>
<path d="M112,224 L188,224" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="90" cy="224" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="90" y="229" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">1</text>
<path d="M232,224 L308,224" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<circle cx="210" cy="224" r="20" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="210" y="229" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">3</text>
<circle cx="330" cy="224" r="20" stroke="#222" stroke-width="3" fill="none"/>
<text x="330" y="229" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">6</text>
<text x="70" y="48" fill="#222" font-size="11">x: 15</text>
<text x="190" y="48" fill="#222" font-size="11">x: 5</text>
<text x="310" y="48" fill="#222" font-size="11">x &lt;= 0</text>
<text x="10" y="88" fill="#222" font-size="11">y: 15</text>
<text x="10" y="158" fill="#222" font-size="11">y: 5</text>
<text x="10" y="228" fill="#222" font-size="11">y &lt;= 0</text>
<text x="370" y="100" fill="#222" font-size="12">Circle = pending call; the number is how many</text>
<text x="370" y="120" fill="#222" font-size="12">call paths reach it from the start (top left).</text>
<text x="370" y="150" fill="#222" font-size="12">Right arrow: foo(x - q, y, q).</text>
<text x="370" y="170" fill="#222" font-size="12">Down arrow: foo(x, y - q, q).</text>
<text x="370" y="200" fill="#222" font-size="12">Bottom right (0, 0): 6 paths, each returns q = 10.</text>
<text x="370" y="222" fill="#222" font-size="13" font-weight="bold">Result: 6 * 10 = 60  (C(4, 2) = 6).</text>
<text x="20" y="276" fill="#222" font-size="12">When x &lt;= 0 only y moves, and when y &lt;= 0 only x moves, so the extra edges along the border do not branch.</text>
</svg>
