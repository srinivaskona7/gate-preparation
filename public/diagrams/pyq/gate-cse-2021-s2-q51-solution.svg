<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" font-family="sans-serif" fill="#1f2937"><title>LR(0) states I0, GOTO(I0,&lt;) and GOTO(GOTO(I0,&lt;),&lt;) for the grammar with brackets and hash c</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="200" height="158" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I0</text>
<line x1="10" y1="34" x2="210" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S' -&gt; .S</text>
<text x="20" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S#cS</text>
<text x="20" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .SS</text>
<text x="20" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S@</text>
<text x="20" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .&lt;S&gt;</text>
<text x="20" y="132" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .a</text>
<text x="20" y="148" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .b</text>
<text x="20" y="164" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .c</text>
<line x1="215" y1="100" x2="265" y2="100" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="240" y="92" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">&lt;</text>
<rect x="270" y="10" width="200" height="158" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="278" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I1 = GOTO(I0,&lt;)</text>
<line x1="270" y1="34" x2="470" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="280" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; &lt;.S&gt;</text>
<text x="280" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S#cS</text>
<text x="280" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .SS</text>
<text x="280" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S@</text>
<text x="280" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .&lt;S&gt;</text>
<text x="280" y="132" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .a</text>
<text x="280" y="148" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .b</text>
<text x="280" y="164" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .c</text>
<line x1="475" y1="100" x2="525" y2="100" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="500" y="92" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">&lt;</text>
<rect x="530" y="10" width="200" height="158" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="538" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">GOTO(I1,&lt;) = I1</text>
<line x1="530" y1="34" x2="730" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="540" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; &lt;.S&gt;</text>
<text x="540" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S#cS</text>
<text x="540" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .SS</text>
<text x="540" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .S@</text>
<text x="540" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .&lt;S&gt;</text>
<text x="540" y="132" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .a</text>
<text x="540" y="148" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .b</text>
<text x="540" y="164" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .c</text>
<text x="10" y="190" font-size="12" text-anchor="start" fill="#1f2937">Reading &lt; moves the dot in S -&gt; .&lt;S&gt; to S -&gt; &lt;.S&gt;.</text>
<text x="10" y="210" font-size="12" text-anchor="start" fill="#1f2937">The dot then sits before S, so closure adds all 7 S-rules with the dot at the start.</text>
<text x="10" y="230" font-size="12" text-anchor="start" fill="#1f2937">Reading a second &lt; from I1 uses only S -&gt; .&lt;S&gt;, which gives the same 8 items.</text>
<text x="10" y="256" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Answer: 1 kernel item + 7 closure items = 8.</text>
</svg>
