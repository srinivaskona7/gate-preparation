<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" width="600" height="306">
<title>Handshake between P and Q</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="150" y="30" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">P</text>
<text x="450" y="30" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Q</text>
<line x1="150" y1="42" x2="150" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="450" y1="42" x2="450" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="150" y1="92" x2="450" y2="92" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="300" y="73" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">SYN=1, seq=X</text>
<text x="300" y="86" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">P1</text>
<line x1="450" y1="154" x2="150" y2="154" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="300" y="135" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">SYN=1, ACK=1, seq=Y, ack=X+1</text>
<text x="300" y="148" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">P2 (asked)</text>
<line x1="150" y1="216" x2="450" y2="216" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="300" y="197" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">ACK=1, ack=Y+1</text>
<text x="300" y="210" font-size="11" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">P3</text>
</svg>
