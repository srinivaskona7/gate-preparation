<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" font-family="sans-serif" font-size="13" fill="#1f2937"><title>Recursive binary search on 15 cells: the range halves each call, so there are about log n calls of constant cost</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
<text x="12" y="45" text-anchor="start">call 1</text>
<rect x="140" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="166" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="192" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="218" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="244" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="270" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="296" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="322" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<rect x="348" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="374" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="400" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="426" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="452" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="478" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="504" y="27" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<text x="542" y="45" text-anchor="start">size 15</text>
<text x="12" y="91" text-anchor="start">call 2</text>
<rect x="348" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="374" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="400" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
