<rect x="452" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="478" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="504" y="73" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<text x="542" y="91" text-anchor="start">size 7</text>
<text x="12" y="137" text-anchor="start">call 3</text>
<rect x="452" y="119" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<rect x="478" y="119" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<rect x="504" y="119" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="1" fill="none"/>
<text x="542" y="137" text-anchor="start">size 3</text>
<text x="12" y="183" text-anchor="start">call 4</text>
<rect x="504" y="165" width="24" height="26" rx="3" stroke="#1f2937" stroke-width="2" fill="#d1d5db"/>
<text x="542" y="183" text-anchor="start">size 1</text>
<text x="140" y="16" text-anchor="start" font-size="12">search range (shaded = mid, computed with a constant c of additions and divisions)</text>
<text x="12" y="222" text-anchor="start">Each call keeps at most half of the range: 15, 7, 3, 1. Four calls, c operations each.</text>
<text x="12" y="244" text-anchor="start">Calls = floor(log2 n) + 1, so arithmetic operations = c (floor(log2 n) + 1) = Theta(log n).</text>
