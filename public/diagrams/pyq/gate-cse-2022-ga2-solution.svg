<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 260" font-family="sans-serif">
<title>Step function y(x) on [0,1]: three rectangles of heights 2, 3, 1 over widths 1/3, 5/12, 1/4 with areas 2/3, 5/4, 1/4 adding to 13/6</title>
<rect x="60.0" y="110" width="120.0" height="100" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/><text x="120.0" y="158.0" font-size="11" text-anchor="middle" fill="#222">h 2, w 1/3</text><text x="120.0" y="174.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">area 2/3</text><rect x="180.0" y="60" width="150.0" height="150" fill="#cfcfcf" stroke="#222" stroke-width="1.5"/><text x="255.0" y="131.0" font-size="12" text-anchor="middle" fill="#222">height 3, width 5/12</text><text x="255.0" y="149.0" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">area 5/4</text><rect x="330.0" y="160" width="90.0" height="50" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/><text x="375.0" y="183.0" font-size="11" text-anchor="middle" fill="#222">h 1, w 1/4</text><text x="375.0" y="199.0" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">area 1/4</text><line x1="60" y1="210" x2="430" y2="210" stroke="#222" stroke-width="1.5"/><line x1="60" y1="210" x2="60" y2="45" stroke="#222" stroke-width="1.5"/><line x1="56" y1="160" x2="60" y2="160" stroke="#222" stroke-width="1"/><text x="52" y="164" font-size="11" text-anchor="end" fill="#222">1</text><line x1="56" y1="110" x2="60" y2="110" stroke="#222" stroke-width="1"/><text x="52" y="114" font-size="11" text-anchor="end" fill="#222">2</text><line x1="56" y1="60" x2="60" y2="60" stroke="#222" stroke-width="1"/><text x="52" y="64" font-size="11" text-anchor="end" fill="#222">3</text><line x1="60.0" y1="210" x2="60.0" y2="215" stroke="#222" stroke-width="1"/><text x="60.0" y="229" font-size="11" text-anchor="middle" fill="#222">0</text><line x1="180.0" y1="210" x2="180.0" y2="215" stroke="#222" stroke-width="1"/><text x="180.0" y="229" font-size="11" text-anchor="middle" fill="#222">1/3</text><line x1="330.0" y1="210" x2="330.0" y2="215" stroke="#222" stroke-width="1"/><text x="330.0" y="229" font-size="11" text-anchor="middle" fill="#222">3/4</text><line x1="420.0" y1="210" x2="420.0" y2="215" stroke="#222" stroke-width="1"/><text x="420.0" y="229" font-size="11" text-anchor="middle" fill="#222">1</text><text x="428.0" y="229" font-size="12" text-anchor="start" fill="#222">x</text><text x="52" y="40" font-size="12" text-anchor="end" fill="#222">y</text><text x="240" y="248" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">Area = 2/3 + 5/4 + 1/4 = 8/12 + 15/12 + 3/12 = 26/12 = 13/6</text>
</svg>
