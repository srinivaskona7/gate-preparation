<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 276" font-family="sans-serif" font-size="12">
<title>Small classes showing which pairs of statements can be true together; only statements 1 and 3 cannot</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="310" y="22" text-anchor="middle" fill="#222" font-size="12">A class has at least one student. Filled circle = inquisitive, empty circle = not inquisitive.</text>
<text x="20" y="66" text-anchor="start" fill="#222" font-size="13">Statements 1 and 2</text>
<circle cx="205" cy="62" r="14" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="243" cy="62" r="14" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="281" cy="62" r="14" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="300" y="66" text-anchor="start" fill="#222" font-size="13">All three inquisitive: 1 and 2 are both true</text>
<text x="20" y="118" text-anchor="start" fill="#222" font-size="13">Statements 2 and 4</text>
<circle cx="205" cy="114" r="14" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="243" cy="114" r="14" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="281" cy="114" r="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="118" text-anchor="start" fill="#222" font-size="13">Mixed class: 2 and 4 are both true</text>
<text x="20" y="170" text-anchor="start" fill="#222" font-size="13">Statements 3 and 4</text>
<circle cx="205" cy="166" r="14" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="243" cy="166" r="14" fill="none" stroke="#222" stroke-width="1.5"/>
<circle cx="281" cy="166" r="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="170" text-anchor="start" fill="#222" font-size="13">Nobody inquisitive: 3 and 4 are both true</text>
<text x="20" y="222" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Statements 1 and 3</text>
<circle cx="205" cy="218" r="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="205" y="223" text-anchor="middle" fill="#222" font-size="14">?</text>
<text x="300" y="222" text-anchor="start" fill="#222" font-size="13" font-weight="bold">No class works: a student cannot be both</text>
<text x="310" y="262" text-anchor="middle" fill="#222" font-size="12">Statements 1 and 3 are the only offered pair with no witness class: option A</text>
</svg>
