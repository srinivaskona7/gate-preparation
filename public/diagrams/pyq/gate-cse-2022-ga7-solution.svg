<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 228" font-family="sans-serif" font-size="12">
<title>Appeared bar is 65 percent boys; qualified bar is 60 percent girls; so fewer boys than girls qualified</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="330" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Two different groups, each drawn as 100%</text>
<text x="110" y="78" text-anchor="end" fill="#222" font-size="13" font-weight="bold">Appeared</text>
<rect x="120" y="50" width="325" height="46" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="282.5" y="78" text-anchor="middle" fill="#222" font-size="13">boys 65%</text>
<rect x="445" y="50" width="175" height="46" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="532.5" y="78" text-anchor="middle" fill="#222" font-size="13">girls 35%</text>
<text x="110" y="148" text-anchor="end" fill="#222" font-size="13" font-weight="bold">Qualified</text>
<rect x="120" y="120" width="200" height="46" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="220.0" y="148" text-anchor="middle" fill="#222" font-size="13">boys 40%</text>
<rect x="320" y="120" width="300" height="46" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="470.0" y="148" text-anchor="middle" fill="#222" font-size="13">girls 60%</text>
<text x="445" y="112" text-anchor="middle" fill="#222" font-size="11">given: boys 65%, girls the rest</text>
<text x="320" y="182" text-anchor="middle" fill="#222" font-size="11">given: girls 60%, so boys 40%</text>
<text x="330" y="214" text-anchor="middle" fill="#222" font-size="12">Appeared: boys more. Qualified: girls more. The two bars are different groups.</text>
</svg>
