<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" font-family="sans-serif">
<title>Probability tree: first draw green with 3/5 then orange with 2/4 gives 3/10; first draw orange with 2/5 then orange with 2/5 gives 4/25; total 23/50</title>
<circle cx="40" cy="130" r="6" fill="#222" stroke="#222" stroke-width="1.5"/><text x="40" y="152" font-size="12" text-anchor="middle" fill="#222">1st draw</text><line x1="46" y1="127" x2="200" y2="62" stroke="#222" stroke-width="1.5"/><line x1="46" y1="133" x2="200" y2="198" stroke="#222" stroke-width="1.5"/><text x="110" y="86" font-size="12" text-anchor="end" fill="#222" transform="rotate(-23 110 86)">green: 3/5</text><text x="96" y="176" font-size="12" text-anchor="middle" fill="#222" transform="rotate(23 96 176)">orange: 2/5</text><rect x="200" y="38" width="150" height="50" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="275" y="58" font-size="12" text-anchor="middle" fill="#222">green kept out</text><text x="275" y="76" font-size="11" text-anchor="middle" fill="#222">bag: 2 green, 2 orange</text><rect x="200" y="174" width="150" height="50" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="275" y="194" font-size="11" text-anchor="middle" fill="#222">orange replaced by orange</text><text x="275" y="212" font-size="11" text-anchor="middle" fill="#222">bag: 3 green, 2 orange</text><line x1="350" y1="63" x2="430" y2="63" stroke="#222" stroke-width="1.5"/><line x1="350" y1="199" x2="430" y2="199" stroke="#222" stroke-width="1.5"/><text x="390" y="55" font-size="11" text-anchor="middle" fill="#222">2nd draw</text><text x="390" y="57" font-size="11" text-anchor="start" fill="#222"></text><text x="390" y="80" font-size="12" text-anchor="middle" fill="#222">orange: 2/4</text><text x="390" y="216" font-size="12" text-anchor="middle" fill="#222">orange: 2/5</text><rect x="430" y="45" width="160" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="510" y="60" font-size="12" text-anchor="middle" fill="#222">3/5 x 2/4</text><text x="510" y="75" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">= 3/10 = 15/50</text><rect x="430" y="181" width="160" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="510" y="196" font-size="12" text-anchor="middle" fill="#222">2/5 x 2/5</text><text x="510" y="211" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">= 4/25 = 8/50</text><text x="310" y="258" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">P(2nd ball orange) = 15/50 + 8/50 = 23/50</text>
</svg>
