<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 304" font-family="sans-serif">
<title>Triangle ABC with midpoints D, E, F: if S sat at corner A, U would be forced to D, yet both midsegments F-D and E-D that could be parallel to a side need D</title>
<polygon points="210,30 60,230 360,230" fill="none" stroke="#222" stroke-width="2"/><line x1="135.0" y1="130.0" x2="210.0" y2="230" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/><line x1="285.0" y1="130.0" x2="210.0" y2="230" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/><circle cx="210" cy="30" r="5" fill="#222" stroke="#222" stroke-width="1.5"/><circle cx="60" cy="230" r="5" fill="#222" stroke="#222" stroke-width="1.5"/><circle cx="360" cy="230" r="5" fill="#222" stroke="#222" stroke-width="1.5"/><circle cx="210.0" cy="230" r="5" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="285.0" cy="130.0" r="5" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="135.0" cy="130.0" r="5" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="210" cy="30" r="11" fill="none" stroke="#222" stroke-width="1.5"/><circle cx="210.0" cy="230" r="11" fill="none" stroke="#222" stroke-width="1.5"/><text x="210" y="14" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">A  (S is here)</text><text x="52" y="248" font-size="13" text-anchor="end" fill="#222">B</text><text x="368" y="248" font-size="13" text-anchor="start" fill="#222">C</text><text x="210.0" y="254" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">D  (U is forced here)</text><text x="297.0" y="134.0" font-size="13" text-anchor="start" fill="#222">E</text><text x="123.0" y="134.0" font-size="13" text-anchor="end" fill="#222">F</text><text x="178" y="198" font-size="11" text-anchor="end" fill="#222">F-D is parallel</text><text x="178" y="211" font-size="11" text-anchor="end" fill="#222">to AC</text><text x="242" y="198" font-size="11" text-anchor="start" fill="#222">E-D is parallel</text><text x="242" y="211" font-size="11" text-anchor="start" fill="#222">to AB</text><text x="210" y="272" font-size="12" text-anchor="middle" fill="#222">Points sharing a side with A: B, F, C, E. Only D does not, so U = D.</text><text x="210" y="290" font-size="12" text-anchor="middle" fill="#222">Every parallel pair needs the midsegment F-D or E-D, and both use D.</text>
</svg>
