<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" font-family="sans-serif" font-size="13">
<title>GATE CSE 2022 question 12 solved: loops at S are a b* b through A and b a* a through B; the run ends in A or B after a b* or b a*</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="80" cy="130" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="28" y1="130" x2="61" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="80" y="134" text-anchor="middle" font-size="12" fill="#222">S</text>
<circle cx="280" cy="60" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="280" cy="60" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="280" y="64" text-anchor="middle" font-size="12" fill="#222">A</text>
<circle cx="280" cy="200" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="280" cy="200" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="280" y="204" text-anchor="middle" font-size="12" fill="#222">B</text>
<path d="M97.9,128.6 Q189.2,121.4 264.3,70.7" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="188.6" y="123.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">a</text>
<path d="M262.1,61.4 Q170.8,68.6 95.7,119.3" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="171.4" y="74.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">b</text>
<path d="M271,43 C250,8 310,8 289,43" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="280" y="12" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">b</text>
<path d="M97.9,131.4 Q189.2,138.6 264.3,189.3" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="188.6" y="144.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">b</text>
<path d="M262.1,198.6 Q170.8,191.4 95.7,140.7" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="171.4" y="193.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">a</text>
<path d="M271,217 C250,252 310,252 289,217" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="280" y="256" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">a</text>
<text x="210" y="282" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Loops S to S:  a b* b   or   b a* a</text>
<text x="210" y="302" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Last stretch, ending in A or B:  a b*   or   b a*</text>
<text x="210" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">(a b* b + b a* a)* (a b* + b a*)</text>
</svg>
