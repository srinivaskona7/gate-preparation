<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="sans-serif" font-size="13">
<title>Three threads in a ring: T2 prints B and signals S3, T1 prints C and signals S2, T3 prints A and signals S1; only S1 starts at 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="260" y="60" width="120" height="80" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="320.0" y="81.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">T2</text>
<text x="320.0" y="96.5" text-anchor="middle" fill="#222" font-size="12">wait(S1)</text>
<text x="320.0" y="111.5" text-anchor="middle" fill="#222" font-size="12">print B</text>
<text x="320.0" y="126.5" text-anchor="middle" fill="#222" font-size="12">signal(S3)</text>
<rect x="440" y="220" width="120" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="241.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">T1</text>
<text x="500.0" y="256.5" text-anchor="middle" fill="#222" font-size="12">wait(S3)</text>
<text x="500.0" y="271.5" text-anchor="middle" fill="#222" font-size="12">print C</text>
<text x="500.0" y="286.5" text-anchor="middle" fill="#222" font-size="12">signal(S2)</text>
<rect x="80" y="220" width="120" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="140.0" y="241.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">T3</text>
<text x="140.0" y="256.5" text-anchor="middle" fill="#222" font-size="12">wait(S2)</text>
<text x="140.0" y="271.5" text-anchor="middle" fill="#222" font-size="12">print A</text>
<text x="140.0" y="286.5" text-anchor="middle" fill="#222" font-size="12">signal(S1)</text>
<line x1="380.0" y1="120.0" x2="450.0" y2="210.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="430" y="158" text-anchor="start" fill="#222" font-size="13" font-weight="bold">S3</text>
<line x1="440.0" y1="272.0" x2="200.0" y2="272.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="320" y="292" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">S2</text>
<line x1="190.0" y1="212.0" x2="262.0" y2="122.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="206" y="158" text-anchor="start" fill="#222" font-size="13" font-weight="bold">S1</text>
<text x="20" y="30" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Initial values chosen: S1 = 1, S2 = 0, S3 = 0</text>
<text x="20" y="336" text-anchor="start" fill="#222" font-size="12">Output: B C A B C A B C A ...   Only T2 can start, then each thread hands the single token on.</text>
</svg>
