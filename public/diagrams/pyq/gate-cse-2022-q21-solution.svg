<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif" font-size="13">
<title>Memory of x, z[0], z[1] before and after the pointer writes: x becomes 10 through p, then z[1] becomes 14, printing 10, 10, 14</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Three snapshots: which variable does p point to, and what does each write change?</text>
<text x="20" y="74" fill="#222" font-size="12" font-weight="bold">start</text>
<rect x="250" y="56" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="285" y="76" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">x = 1</text>
<rect x="340" y="56" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="385" y="76" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">z[0] = 10</text>
<rect x="430" y="56" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="475" y="76" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">z[1] = 11</text>
<text x="285" y="108" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">p = NULL</text>
<text x="20" y="154" fill="#222" font-size="12" font-weight="bold">p = &amp;x; *p = 10</text>
<rect x="250" y="136" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="285" y="156" fill="#222" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace">x = 10</text>
<rect x="340" y="136" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="385" y="156" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">z[0] = 10</text>
<rect x="430" y="136" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="475" y="156" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">z[1] = 11</text>
<text x="285" y="188" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">p</text>
<path d="M285,178 L285,168" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="20" y="234" fill="#222" font-size="12" font-weight="bold">p = &amp;z[1]; *(&amp;z[0]+1) += 3</text>
<rect x="250" y="216" width="70" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="285" y="236" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">x = 10</text>
<rect x="340" y="216" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="385" y="236" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">z[0] = 10</text>
<rect x="430" y="216" width="90" height="32" stroke="#222" stroke-width="1.5" fill="none"/><text x="475" y="236" fill="#222" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace">z[1] = 14</text>
<text x="475" y="268" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">p</text>
<path d="M475,258 L475,248" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="20" y="290" fill="#222" font-size="12">&amp;z[0] + 1 is the address of z[1] (the next int), so the += 3 changes z[1], not z[0].</text>
<text x="20" y="312" fill="#222" font-size="12" font-weight="bold">printf prints x, z[0], z[1] = 10, 10, 14: option (D).</text>
</svg>
