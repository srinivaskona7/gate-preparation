<circle cx="530" cy="208" r="11" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="530" y="212" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">6</text>
<text x="22" y="92" text-anchor="start" fill="#222" font-size="10">outside link,</text>
<text x="22" y="105" text-anchor="start" fill="#222" font-size="10">not counted</text>
<text x="660" y="100" text-anchor="start" fill="#222" font-size="12">Each numbered link or</text>
<text x="660" y="118" text-anchor="start" fill="#222" font-size="12">segment is one subnet:</text>
<text x="660" y="142" text-anchor="start" fill="#222" font-size="12">1 firewall - left router</text>
<text x="660" y="160" text-anchor="start" fill="#222" font-size="12">2 firewall - top router</text>
<text x="660" y="178" text-anchor="start" fill="#222" font-size="12">3 top router - web server</text>
<text x="660" y="196" text-anchor="start" fill="#222" font-size="12">4 top router - right router</text>
<text x="660" y="214" text-anchor="start" fill="#222" font-size="12">5 left router - Ethernet</text>
<text x="660" y="232" text-anchor="start" fill="#222" font-size="12">6 right router - Ethernet</text>
<text x="660" y="262" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Total: 6 subnets</text>
