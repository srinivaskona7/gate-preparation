<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif" font-size="13">
<title>Nested language classes: regular inside deterministic context-free inside context-free inside context-sensitive inside recursive inside recursively enumerable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<ellipse cx="360" cy="150" rx="70" ry="22" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="360" cy="150" rx="130" ry="44" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="360" cy="150" rx="190" ry="66" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="360" cy="150" rx="250" ry="88" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="360" cy="150" rx="300" ry="110" fill="none" stroke="#222" stroke-width="1.6"/>
<ellipse cx="360" cy="150" rx="340" ry="132" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="360" y="155" text-anchor="middle" fill="#222" font-size="13">Regular</text>
<text x="360" y="123" text-anchor="middle" fill="#222" font-size="12">DCFL</text>
<text x="360" y="101" text-anchor="middle" fill="#222" font-size="12">CFL</text>
<text x="360" y="79" text-anchor="middle" fill="#222" font-size="12">CSL</text>
<text x="360" y="57" text-anchor="middle" fill="#222" font-size="12">Recursive</text>
<text x="360" y="35" text-anchor="middle" fill="#222" font-size="12">RE</text>
<text x="360" y="424" text-anchor="middle" fill="#222" font-size="11">RE = recursively enumerable, CSL = context-sensitive, DCFL = deterministic context-free</text>
<text x="360" y="308" text-anchor="middle" fill="#222" font-size="12">(A) false: the whole set {0,1}* is recursive, yet it has subsets outside the recursive ring</text>
<text x="360" y="330" text-anchor="middle" fill="#222" font-size="12">(B) true: L and its complement both RE means L is recursive (RE intersected with co-RE)</text>
<text x="360" y="352" text-anchor="middle" fill="#222" font-size="12">(C) true: a CFL lies in the recursive ring, and that ring is closed under complement</text>
<text x="360" y="374" text-anchor="middle" fill="#222" font-size="12">(D) true: the intersection of two regular languages is regular, and regular lies inside DCFL</text>
<text x="360" y="400" text-anchor="middle" fill="#222" font-size="13">Answer: B, C, D</text>
</svg>
