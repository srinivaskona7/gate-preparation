<text x="290" y="64.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">x</text>
<text x="400" y="64" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">yes</text>
