<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img">
<title>Own as a grid: an employee owns all brands if the whole row of brand columns is marked</title>
<text x="60" y="30" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">eId</text>
