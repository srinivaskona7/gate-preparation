<text x="290" y="104.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">x</text>
<text x="400" y="104" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">no</text>
<text x="60" y="144" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">e3</text>
