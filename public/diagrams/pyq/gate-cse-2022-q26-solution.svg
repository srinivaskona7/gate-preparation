<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>Resource allocation graph with two instances each of R1 and R2: a cycle through P1, R1, P3, R2 exists but there is no deadlock</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="80" cy="165" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="80" y="169" text-anchor="middle" fill="#222" font-size="12">P1</text>
<circle cx="430" cy="165" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="430" y="169" text-anchor="middle" fill="#222" font-size="12">P3</text>
<circle cx="430" cy="50" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="430" y="54" text-anchor="middle" fill="#222" font-size="12">P2</text>
<circle cx="430" cy="280" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="430" y="284" text-anchor="middle" fill="#222" font-size="12">P4</text>
<rect x="190" y="105" width="100" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="240.0" y="129.0" text-anchor="middle" fill="#222" font-size="12">R1</text>
<rect x="190" y="185" width="100" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="240.0" y="209.0" text-anchor="middle" fill="#222" font-size="12">R2</text>
<circle cx="220" cy="133" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="260" cy="133" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="220" cy="213" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="260" cy="213" r="5" fill="#222" stroke="#222" stroke-width="1.5"/>
<line x1="100.0" y1="155.0" x2="190.0" y2="128.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="290.0" y1="118.0" x2="410.0" y2="156.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="280.0" y1="105.0" x2="412.0" y2="60.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="410.0" y1="178.0" x2="290.0" y2="205.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="190.0" y1="205.0" x2="98.0" y2="178.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="290.0" y1="222.0" x2="412.0" y2="270.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="500" y="60" text-anchor="start" fill="#222" font-size="12">solid arrow R to P: an instance is assigned</text>
<text x="500" y="80" text-anchor="start" fill="#222" font-size="12">dashed arrow P to R: waiting for an instance</text>
<text x="500" y="130" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Cycle: P1, R1, P3, R2, P1</text>
<text x="500" y="160" text-anchor="start" fill="#222" font-size="12">P2 and P4 request nothing, so they</text>
<text x="500" y="180" text-anchor="start" fill="#222" font-size="12">finish and free one R1 and one R2.</text>
<text x="500" y="200" text-anchor="start" fill="#222" font-size="12">Then P1 and P3 get what they wait for</text>
<text x="500" y="220" text-anchor="start" fill="#222" font-size="12">and finish: a cycle without deadlock.</text>
<text x="20" y="312" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Option B is false for multi-instance resources.</text>
</svg>
