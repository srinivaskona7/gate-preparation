<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" font-family="sans-serif" font-size="13">
<title>Complete binary tree with 1000 nodes in a 0-indexed array: the right spine is 0, 2, 6, 14, 30, 62, 126, 254, 510 and node 510 is the largest key; its parent 254 is next; the last node before 254 in inorder is 509, the rightmost node of the left subtree of 254, so the third largest is at index 509</title>
