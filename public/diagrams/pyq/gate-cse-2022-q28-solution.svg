<text x="560" y="70" text-anchor="start" fill="#222" font-size="12">Right spine: each node is the</text>
<text x="560" y="88" text-anchor="start" fill="#222" font-size="12">RIGHT child (2i + 2) of the last.</text>
<text x="560" y="118" text-anchor="start" fill="#222" font-size="12">1st largest: 510 (end of the spine,</text>
<text x="560" y="136" text-anchor="start" fill="#222" font-size="12">2*510+1 = 1021 &gt; 999: a leaf)</text>
<text x="560" y="166" text-anchor="start" fill="#222" font-size="12">2nd largest: 254 (its parent)</text>
<text x="560" y="196" text-anchor="start" fill="#222" font-size="12">3rd largest: 509 = left child of 254,</text>
<text x="560" y="214" text-anchor="start" fill="#222" font-size="12">a leaf (2*509+1 = 1019 &gt; 999);</text>
<text x="560" y="232" text-anchor="start" fill="#222" font-size="12">it is the last node of the left</text>
<text x="560" y="250" text-anchor="start" fill="#222" font-size="12">subtree of 254 in inorder.</text>
<text x="380" y="456" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Sorted order near the top: ... 509 &lt; 254 &lt; 510  (inorder = ascending). Index of the 3rd largest = 509.</text>
<text x="380" y="478" text-anchor="middle" fill="#222" font-size="12">Levels 0 to 8 are full (511 nodes); level 9 holds the other 489 nodes, indices 511 to 999.</text>
