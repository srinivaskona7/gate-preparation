<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="sans-serif" fill="#1f2937"><title>goto of the two-item LR(0) set on plus gives 5 items</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="200" height="62" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">closure(I0)</text>
<line x1="10" y1="34" x2="210" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S' -&gt; S.</text>
<text x="20" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; S.+R</text>
<line x1="215" y1="50" x2="255" y2="50" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="235" y="42" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">+</text>
<rect x="260" y="10" width="290" height="110" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="268" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">goto(closure(I0), +): 5 items</text>
<line x1="260" y1="34" x2="550" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="270" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; S+.R</text>
<text x="270" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">R -&gt; .R*P</text>
<text x="270" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">R -&gt; .P</text>
<text x="270" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">P -&gt; .(S)</text>
<text x="270" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">P -&gt; .id</text>
<text x="10" y="150" font-size="12" text-anchor="start" fill="#1f2937">Only S -&gt; S.+R has the dot before +; moving it gives S -&gt; S+.R.</text>
<text x="10" y="170" font-size="12" text-anchor="start" fill="#1f2937">The dot now precedes R, so closure adds R's 2 rules, then P's 2 rules.</text>
<text x="10" y="190" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">1 + 2 + 2 = 5.</text>
</svg>
