<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Iterative resolution of www.gate.org.in: four query-response pairs</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222" stroke="none"/></marker></defs><rect x="20" y="10" width="120" height="258" rx="4"/><text x="80" y="143" fill="#222" stroke="none" text-anchor="middle" >Resolver</text><rect x="240" y="10" width="120" height="48" rx="4"/><text x="300" y="39" fill="#222" stroke="none" text-anchor="middle" >root</text><line x1="140" y1="26" x2="238" y2="26" marker-end="url(#a)"/><text x="190" y="21" fill="#222" stroke="none" text-anchor="middle" >query 1</text><line x1="240" y1="44" x2="142" y2="44" stroke-dasharray="5 3" marker-end="url(#a)"/><text x="190" y="56" fill="#222" stroke="none" text-anchor="middle" >reply 1</text><text x="375" y="39" fill="#222" stroke="none" text-anchor="start" >refers to .in</text><rect x="240" y="80" width="120" height="48" rx="4"/><text x="300" y="109" fill="#222" stroke="none" text-anchor="middle" >.in TLD</text><line x1="140" y1="96" x2="238" y2="96" marker-end="url(#a)"/><text x="190" y="91" fill="#222" stroke="none" text-anchor="middle" >query 2</text><line x1="240" y1="114" x2="142" y2="114" stroke-dasharray="5 3" marker-end="url(#a)"/><text x="190" y="126" fill="#222" stroke="none" text-anchor="middle" >reply 2</text><text x="375" y="109" fill="#222" stroke="none" text-anchor="start" >refers to org.in</text><rect x="240" y="150" width="120" height="48" rx="4"/><text x="300" y="179" fill="#222" stroke="none" text-anchor="middle" >org.in</text><line x1="140" y1="166" x2="238" y2="166" marker-end="url(#a)"/><text x="190" y="161" fill="#222" stroke="none" text-anchor="middle" >query 3</text><line x1="240" y1="184" x2="142" y2="184" stroke-dasharray="5 3" marker-end="url(#a)"/><text x="190" y="196" fill="