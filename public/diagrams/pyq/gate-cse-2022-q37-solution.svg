<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="sans-serif" font-size="13">
<title>Triangle on vertices a, b, c: from each vertex there are two closed walks of length 3, one per direction, so trace of A cubed is 6 times the number of triangles</title>
<line x1="130" y1="60" x2="60" y2="190" stroke="#222" stroke-width="1.5"/>
<line x1="60" y1="190" x2="200" y2="190" stroke="#222" stroke-width="1.5"/>
<line x1="200" y1="190" x2="130" y2="60" stroke="#222" stroke-width="1.5"/>
<circle cx="130" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="130" y="64.6" text-anchor="middle" fill="#222" font-size="13">a</text>
<circle cx="60" cy="190" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="60" y="194.6" text-anchor="middle" fill="#222" font-size="13">b</text>
<circle cx="200" cy="190" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="200" y="194.6" text-anchor="middle" fill="#222" font-size="13">c</text>
<text x="130" y="240" text-anchor="middle" fill="#222" font-size="13">one triangle, K3</text>
<text x="300" y="50" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Closed walks of length 3 starting at each vertex:</text>
<text x="300" y="82" text-anchor="start" fill="#222" font-size="13">a b c a</text>
<text x="420" y="82" text-anchor="start" fill="#222" font-size="13">a c b a</text>
<text x="300" y="106" text-anchor="start" fill="#222" font-size="13">b c a b</text>
<text x="420" y="106" text-anchor="start" fill="#222" font-size="13">b a c b</text>
<text x="300" y="130" text-anchor="start" fill="#222" font-size="13">c a b c</text>
<text x="420" y="130" text-anchor="start" fill="#222" font-size="13">c b a c</text>
<text x="300" y="175" text-anchor="start" fill="#222" font-size="13">trace(A^3) = 2 + 2 + 2 = 6 for K3</text>
<text x="300" y="200" text-anchor="start" fill="#222" font-size="12">Each triangle is counted 3 starting points x 2 directions.</text>
<text x="300" y="224" text-anchor="start" fill="#222" font-size="13" font-weight="bold">triangles = trace(A^3) / 6</text>
</svg>
