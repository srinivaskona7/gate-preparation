<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="13">
<title>Hashed page table with a collision chain: V1 is found after 1 read, V2 after 2 reads; an inverted table searched by hash or by scan also takes different times for different addresses, so statement C is false</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="20" fill="#222" font-weight="bold">Hashed table: V1 and V2 hash to the same bucket</text>
<text x="20" y="50" fill="#222" font-size="12">hash(V1) = hash(V2) = 3</text>
<rect x="190" y="35" width="90" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="54" text-anchor="middle" fill="#222">bucket 3</text>
<rect x="340" y="35" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="395" y="54" text-anchor="middle" fill="#222">V1 -> frame</text>
<rect x="500" y="35" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="555" y="54" text-anchor="middle" fill="#222">V2 -> frame</text>
<path d="M280,49 L338,49" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M450,49 L498,49" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="395" y="82" text-anchor="middle" fill="#222" font-size="12">V1: 1 chain element read</text>
<text x="555" y="82" text-anchor="middle" fill="#222" font-size="12">V2: 2 chain elements read</text>
<text x="20" y="108" fill="#222" font-size="12">Statement D is true: the two lookups cost different numbers of reads.</text>
<text x="20" y="145" fill="#222" font-weight="bold">Inverted table: one entry per frame, entry holds (pid, page)</text>
<rect x="190" y="160" width="60" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="220" y="179" text-anchor="middle" fill="#222" font-size="12">frame 0</text>
<rect x="250" y="160" width="60" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="280" y="179" text-anchor="middle" fill="#222" font-size="12">frame 1</text>
<rect x="310" y="160" width="60" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="340" y="179" text-anchor="middle" fill="#222" font-size="12">frame 2</text>
<text x="400" y="179" text-anchor="middle" fill="#222">...</text>
<rect x="430" y="160" width="60" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="460" y="179" text-anchor="middle" fill="#222" font-size="12">frame n-1</text>
<text x="20" y="179" fill="#222" font-size="12">scan from frame 0:</text>
<text x="20" y="212" fill="#222" font-size="12">A match in frame 0 costs 1 read, a match in frame n-1 costs n reads. With hashing the cost</text>
<text x="20" y="230" fill="#222" font-size="12">is the chain length. Either way the time varies, so statement C ("always the same") is false.</text>
</svg>
