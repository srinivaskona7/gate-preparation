<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="sans-serif" font-size="13">
<title>Q40 worked: P is a 10 to 1024 decoder, Q is a 5 to 32 decoder, T is a 2:1 multiplexer driven by M</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="60" y="30" width="340" height="32" fill="none" stroke="#222" stroke-width="1.5"/>
<line x1="120" y1="30" x2="120" y2="62" stroke="#222" stroke-width="1.5"/>
<line x1="260" y1="30" x2="260" y2="62" stroke="#222" stroke-width="1.5"/>
<text x="90" y="51" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">M</text>
<text x="190" y="51" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">S-address</text>
<text x="330" y="51" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">R-address</text>
<text x="230" y="24" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Code word (16 bits)</text>
<rect x="125" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="190" y="111" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">P: 10:2^10 decoder</text>
<rect x="265" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="330" y="111" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">Q: 5:2^5 decoder</text>
<line x1="190" y1="62" x2="190" y2="90" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="330" y1="62" x2="330" y2="90" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="140" y="150" width="100" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="190" y="179" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">S (1024 words)</text>
<rect x="280" y="150" width="100" height="50" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="330" y="179" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">R (32 words)</text>
<line x1="190" y1="124" x2="190" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="330" y1="124" x2="330" y2="150" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="150" y="230" width="200" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="250" y="251" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">T: 2:1 multiplexer</text>
<line x1="190" y1="200" x2="190" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="330" y1="200" x2="330" y2="230" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="90" y1="62" x2="90" y2="247" stroke="#222" stroke-width="1.5"/>
<line x1="90" y1="247" x2="150" y2="247" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="250" y1="264" x2="250" y2="300" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="215" y="300" width="70" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="250" y="321" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">X</text>
<rect x="285" y="300" width="70" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="320" y="321" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">DDS</text>
<text x="196" y="80" text-anchor="start" fill="#222" font-size="11" font-weight="normal">10 bits</text>
<text x="196" y="140" text-anchor="start" fill="#222" font-size="11" font-weight="normal">1024 lines</text>
<text x="336" y="80" text-anchor="start" fill="#222" font-size="11" font-weight="normal">5 bits</text>
<text x="336" y="140" text-anchor="start" fill="#222" font-size="11" font-weight="normal">32 lines</text>
<text x="96" y="160" text-anchor="start" fill="#222" font-size="11" font-weight="normal">M (1 bit)</text>
<text x="20" y="345" text-anchor="start" fill="#222" font-size="12" font-weight="bold">1 + 10 + 5 = 16 bits</text>
</svg>
