<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" font-family="sans-serif" font-size="13">
<title>Bit patterns of P and x with their AND, OR and XOR, the constants added, and the printed characters z, K and S</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">a = 'P' = 80 and b = 'x' = 120, as 7-bit patterns</text>
<rect x="20" y="40" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">expression</text>
<rect x="170" y="40" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">bits</text>
<rect x="300" y="40" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">value</text>
<rect x="390" y="40" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">then</text>
<rect x="520" y="40" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="59" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">char</text>
<rect x="20" y="70" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="89" fill="#222" text-anchor="middle" font-size="12">a  =  P</text>
<rect x="170" y="70" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="89" fill="#222" text-anchor="middle" font-size="12">1010000</text>
<rect x="300" y="70" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="89" fill="#222" text-anchor="middle" font-size="12">80</text>
<rect x="390" y="70" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="89" fill="#222" text-anchor="middle" font-size="12"></text>
<rect x="520" y="70" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="89" fill="#222" text-anchor="middle" font-size="12"></text>
<rect x="20" y="100" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="119" fill="#222" text-anchor="middle" font-size="12">b  =  x</text>
<rect x="170" y="100" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="119" fill="#222" text-anchor="middle" font-size="12">1111000</text>
<rect x="300" y="100" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="119" fill="#222" text-anchor="middle" font-size="12">120</text>
<rect x="390" y="100" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="119" fill="#222" text-anchor="middle" font-size="12"></text>
<rect x="520" y="100" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="119" fill="#222" text-anchor="middle" font-size="12"></text>
<rect x="20" y="130" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">a &amp; b (both 1)</text>
<rect x="170" y="130" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">1010000</text>
<rect x="300" y="130" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">80</text>
<rect x="390" y="130" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">+ 42 = 122</text>
<rect x="520" y="130" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="149" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">z</text>
<rect x="20" y="160" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="179" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">a | b (either 1)</text>
<rect x="170" y="160" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="179" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">1111000</text>
<rect x="300" y="160" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="179" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">120</text>
<rect x="390" y="160" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="179" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">- 45 = 75</text>
<rect x="520" y="160" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="179" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">K</text>
<rect x="20" y="190" width="150" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">a ^ b (differ)</text>
<rect x="170" y="190" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">0101000</text>
<rect x="300" y="190" width="90" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">40</text>
<rect x="390" y="190" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">+ 43 = 83</text>
<rect x="520" y="190" width="130" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="585" y="209" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">S</text>
<text x="20" y="246" fill="#222" font-size="12">Constants from the paper's table: '*' = 42, '+' = 43, '-' = 45, 'z' = 122; 'K' = 75 and 'S' = 83 follow from 'A' = 65.</text>
<text x="20" y="268" fill="#222" font-size="12" font-weight="bold">%c prints the characters: z K S, option (A).</text>
</svg>
