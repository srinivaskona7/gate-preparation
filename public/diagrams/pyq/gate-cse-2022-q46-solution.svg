<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" font-family="sans-serif" font-size="13">
<title>Four questions about Turing machines: three undecidable, the step-bounded one decidable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Problem</text>
<text x="330" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Verdict</text>
<text x="450" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Reason</text>
<rect x="10" y="42" width="740" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="70" text-anchor="start" fill="#222" font-size="13">(A) L(M1) = L(M2)?</text>
<text x="330" y="70" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="62" text-anchor="start" fill="#222" font-size="12">property of two languages;</text>
<text x="450" y="79" text-anchor="start" fill="#222" font-size="12">with L(M2) empty it is emptiness</text>
<rect x="10" y="96" width="740" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="124" text-anchor="start" fill="#222" font-size="13">(B) Is L(M) regular?</text>
<text x="330" y="124" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="116" text-anchor="start" fill="#222" font-size="12">Rice: non-trivial property</text>
<text x="450" y="133" text-anchor="start" fill="#222" font-size="12">of L(M)</text>
<rect x="10" y="150" width="740" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="178" text-anchor="start" fill="#222" font-size="13">(C) Does M accept all strings?</text>
<text x="330" y="178" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="170" text-anchor="start" fill="#222" font-size="12">Rice: non-trivial property</text>
<text x="450" y="187" text-anchor="start" fill="#222" font-size="12">of L(M)</text>
<rect x="10" y="204" width="740" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="13">(D) More than 1073 steps on every string?</text>
<text x="330" y="232" text-anchor="start" fill="#222" font-size="13" font-weight="bold">decidable</text>
<text x="450" y="224" text-anchor="start" fill="#222" font-size="12">only strings of length &lt;= 1073</text>
<text x="450" y="241" text-anchor="start" fill="#222" font-size="12">matter for 1073 steps</text>
</svg>
