<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="sans-serif" font-size="13">
<title>The string aabbcc with the a-b arcs of L2 above and the b-c arcs of L3 below: the b letters are used twice, so L2 intersect L3 is a^n b^n c^n</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="13" fill="#222" font-weight="bold">L2 = a^n b^n c^m  (arcs a–b above)   ∩   L3 = a^m b^n c^n  (arcs b–c below)</text>
<text x="180" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="236" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="292" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="348" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="404" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="460" y="150" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<path d="M236,126 C236,96.52 292,96.52 292,126" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M180,126 C180,67.03999999999999 348,67.03999999999999 348,126" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M348,160 C348,189.48 404,189.48 404,160" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M292,160 C292,218.96 460,218.96 460,160" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="500" y="90" text-anchor="start" font-size="12" fill="#222">solid: L2 matches</text>
<text x="500" y="108" text-anchor="start" font-size="12" fill="#222">a with b</text>
<text x="500" y="200" text-anchor="start" font-size="12" fill="#222">dashed: L3 matches</text>
<text x="500" y="218" text-anchor="start" font-size="12" fill="#222">b with c</text>
<text x="20" y="250" text-anchor="start" font-size="12" fill="#222">A string in both languages has #a = #b and #b = #c, which is a^n b^n c^n. Each b is matched twice,</text>
<text x="20" y="268" text-anchor="start" font-size="12" fill="#222">so one stack cannot hold both comparisons; the pumping lemma confirms a^n b^n c^n is not context-free.</text>
<line x1="20" y1="286" x2="640" y2="286" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="312" text-anchor="start" font-size="12" fill="#222">(A) L1 = ww is not a CFL; L2, L3 are deterministic CFLs: TRUE statement</text>
<text x="20" y="332" text-anchor="start" font-size="12" fill="#222">(B) "neither L1 nor L2 is context-free": L2 is context-free, so the statement is FALSE</text>
<text x="20" y="352" text-anchor="start" font-size="12" fill="#222">(C) "L2, L3 and L2 ∩ L3 all context-free": a^n b^n c^n is not, so FALSE</text>
<text x="20" y="372" text-anchor="start" font-size="12" fill="#222">(D) "neither L1 nor its complement is context-free": the complement of ww is context-free, so FALSE</text>
<text x="20" y="404" text-anchor="start" font-size="13" fill="#222" font-weight="bold">False statements: (B), (C), (D).</text>
</svg>
