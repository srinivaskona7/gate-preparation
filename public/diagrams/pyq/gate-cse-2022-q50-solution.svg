<text x="20" y="285" text-anchor="start" fill="#222" font-size="12">Colour 2 is used on four pairwise non-adjacent vertices (a1, a3, b0, b4): an independent set of size 4, so D is false.</text>
<text x="20" y="305" text-anchor="start" fill="#222" font-size="12">The nine-ring of C becomes a Peterson graph under the labels shown: every one of its 15 edges lands on an edge of the Peterson graph.</text>
<text x="20" y="325" text-anchor="start" fill="#222" font-size="12">Ten vertices on one path but no closed tour: the Peterson graph has a Hamiltonian path and no Hamiltonian cycle.</text>
