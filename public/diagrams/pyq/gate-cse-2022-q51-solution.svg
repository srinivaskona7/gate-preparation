<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="sans-serif" font-size="13">
<title>Values of f(n) for n from 1 to 16: f is 1 at every power of 2 and then climbs by 2 until the next power of 2</title>
<line x1="45" y1="230" x2="503" y2="230" stroke="#222" stroke-width="1.2"/>
<rect x="53" y="220" width="22" height="10" rx="0" fill="#ccc" stroke="#222" stroke-width="1.4"/>
<text x="64" y="215" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="64" y="246" text-anchor="middle" fill="#222" font-size="12">1</text>
<rect x="81" y="220" width="22" height="10" rx="0" fill="#ccc" stroke="#222" stroke-width="1.4"/>
<text x="92" y="215" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="92" y="246" text-anchor="middle" fill="#222" font-size="12">2</text>
<rect x="109" y="200" width="22" height="30" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="120" y="195" text-anchor="middle" fill="#222" font-size="12">3</text>
<text x="120" y="246" text-anchor="middle" fill="#222" font-size="12">3</text>
<rect x="137" y="220" width="22" height="10" rx="0" fill="#ccc" stroke="#222" stroke-width="1.4"/>
<text x="148" y="215" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="148" y="246" text-anchor="middle" fill="#222" font-size="12">4</text>
<rect x="165" y="200" width="22" height="30" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="176" y="195" text-anchor="middle" fill="#222" font-size="12">3</text>
<text x="176" y="246" text-anchor="middle" fill="#222" font-size="12">5</text>
<rect x="193" y="180" width="22" height="50" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="204" y="175" text-anchor="middle" fill="#222" font-size="12">5</text>
<text x="204" y="246" text-anchor="middle" fill="#222" font-size="12">6</text>
<rect x="221" y="160" width="22" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="232" y="155" text-anchor="middle" fill="#222" font-size="12">7</text>
<text x="232" y="246" text-anchor="middle" fill="#222" font-size="12">7</text>
<rect x="249" y="220" width="22" height="10" rx="0" fill="#ccc" stroke="#222" stroke-width="1.4"/>
<text x="260" y="215" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="260" y="246" text-anchor="middle" fill="#222" font-size="12">8</text>
<rect x="277" y="200" width="22" height="30" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="288" y="195" text-anchor="middle" fill="#222" font-size="12">3</text>
<text x="288" y="246" text-anchor="middle" fill="#222" font-size="12">9</text>
<rect x="305" y="180" width="22" height="50" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="316" y="175" text-anchor="middle" fill="#222" font-size="12">5</text>
<text x="316" y="246" text-anchor="middle" fill="#222" font-size="12">10</text>
<rect x="333" y="160" width="22" height="70" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="344" y="155" text-anchor="middle" fill="#222" font-size="12">7</text>
<text x="344" y="246" text-anchor="middle" fill="#222" font-size="12">11</text>
<rect x="361" y="140" width="22" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="372" y="135" text-anchor="middle" fill="#222" font-size="12">9</text>
<text x="372" y="246" text-anchor="middle" fill="#222" font-size="12">12</text>
<rect x="389" y="120" width="22" height="110" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="400" y="115" text-anchor="middle" fill="#222" font-size="12">11</text>
<text x="400" y="246" text-anchor="middle" fill="#222" font-size="12">13</text>
<rect x="417" y="100" width="22" height="130" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="428" y="95" text-anchor="middle" fill="#222" font-size="12">13</text>
<text x="428" y="246" text-anchor="middle" fill="#222" font-size="12">14</text>
<rect x="445" y="80" width="22" height="150" rx="0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="456" y="75" text-anchor="middle" fill="#222" font-size="12">15</text>
<text x="456" y="246" text-anchor="middle" fill="#222" font-size="12">15</text>
<rect x="473" y="220" width="22" height="10" rx="0" fill="#ccc" stroke="#222" stroke-width="1.4"/>
<text x="484" y="215" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="484" y="246" text-anchor="middle" fill="#222" font-size="12">16</text>
<text x="50" y="268" text-anchor="start" fill="#222" font-size="12">Grey bars: n = 2^k, where f(n) = 1. A: f(2^n - 1) = 2^n - 1, so f(3) = 3, f(7) = 7, f(15) = 15.</text>
<text x="50" y="287" text-anchor="start" fill="#222" font-size="12">D: f(2^n + 1) = 3 for n &gt;= 1, so f(5) = f(9) = 3: not 2^n + 1 for n &gt;= 2 (f(5) would be 5).</text>
<text x="50" y="22" text-anchor="start" fill="#222" font-size="13">f(1)=1, f(2n)=2f(n)-1, f(2n+1)=2f(n)+1</text>
</svg>
