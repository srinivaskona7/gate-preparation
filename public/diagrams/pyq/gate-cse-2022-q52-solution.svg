<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="sans-serif" font-size="13">
<title>Counterexamples for statements B, C and D: a path on 3 vertices, a triangle plus an isolated vertex, and two disjoint edges</title>
<text x="120" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">B: connected, n = 3</text>
<line x1="55" y1="100" x2="120" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="120" y1="100" x2="185" y2="100" stroke="#222" stroke-width="1.8"/>
<circle cx="55" cy="100" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="55" y="104.6" text-anchor="middle" fill="#222" font-size="13">x</text>
<circle cx="120" cy="100" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="120" y="104.6" text-anchor="middle" fill="#222" font-size="13">y</text>
<circle cx="185" cy="100" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="185" y="104.6" text-anchor="middle" fill="#222" font-size="13">z</text>
<text x="120" y="150" text-anchor="middle" fill="#222" font-size="12">A^2 + I has a zero at (x, y):</text>
<text x="120" y="168" text-anchor="middle" fill="#222" font-size="12">no walk of length 2 from x to y</text>
<text x="385" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C: entry sum 6 = 2(n-1), n = 4</text>
<line x1="350" y1="70" x2="320" y2="125" stroke="#222" stroke-width="1.8"/>
<line x1="320" y1="125" x2="390" y2="125" stroke="#222" stroke-width="1.8"/>
<line x1="390" y1="125" x2="350" y2="70" stroke="#222" stroke-width="1.8"/>
<circle cx="350" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="350" y="74.6" text-anchor="middle" fill="#222" font-size="13">a</text>
<circle cx="320" cy="125" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="320" y="129.6" text-anchor="middle" fill="#222" font-size="13">b</text>
<circle cx="390" cy="125" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="390" y="129.6" text-anchor="middle" fill="#222" font-size="13">c</text>
<circle cx="450" cy="100" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="450" y="104.6" text-anchor="middle" fill="#222" font-size="13">d</text>
<text x="385" y="170" text-anchor="middle" fill="#222" font-size="12">a triangle is a cycle</text>
<text x="630" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">D: no zero row, n = 4</text>
<circle cx="580" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="580" y="74.6" text-anchor="middle" fill="#222" font-size="13">a</text>
<circle cx="580" cy="135" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="580" y="139.6" text-anchor="middle" fill="#222" font-size="13">b</text>
<line x1="580" y1="85" x2="580" y2="120" stroke="#222" stroke-width="1.8"/>
<circle cx="670" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="670" y="74.6" text-anchor="middle" fill="#222" font-size="13">c</text>
<circle cx="670" cy="135" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="670" y="139.6" text-anchor="middle" fill="#222" font-size="13">d</text>
<line x1="670" y1="85" x2="670" y2="120" stroke="#222" stroke-width="1.8"/>
<text x="630" y="170" text-anchor="middle" fill="#222" font-size="12">two components, not connected</text>
<text x="20" y="215" text-anchor="start" fill="#222" font-size="12">A is true: (A^2)[i][i] = sum over j of A[i][j] A[j][i] = number of neighbours of i = degree of i.</text>
<text x="20" y="238" text-anchor="start" fill="#222" font-size="12">Sum of all entries of A = 2 x edges. The triangle plus an isolated vertex has 3 edges,</text>
<text x="20" y="256" text-anchor="start" fill="#222" font-size="12">so the sum is 6 = 2(n-1), and the graph still has a cycle.</text>
</svg>
