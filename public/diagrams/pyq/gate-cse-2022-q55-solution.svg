<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" font-family="sans-serif" font-size="13">
<title>Third octet 160 to 175 of 12.20.x.0: the four subnets fill 164 to 171, which two /22 blocks cover exactly</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="30" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Subnets of the router (third octet ranges)</text>
<text x="10" y="64" text-anchor="start" fill="#222" font-size="12">12.20.164.0/22 : 164 to 167</text>
<rect x="472.5" y="44" width="132.5" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">12.20.166.0/23 : 166 to 167</text>
<rect x="538.8" y="82" width="66.2" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="140" text-anchor="start" fill="#222" font-size="12">12.20.168.0/23 : 168 to 169</text>
<rect x="605.0" y="120" width="66.2" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="178" text-anchor="start" fill="#222" font-size="12">12.20.170.0/23 : 170 to 171</text>
<rect x="671.2" y="158" width="66.2" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="340.0" y1="40" x2="340.0" y2="196" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="340.0" y="210" text-anchor="middle" fill="#222" font-size="11">160</text>
<line x1="472.5" y1="40" x2="472.5" y2="196" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="472.5" y="210" text-anchor="middle" fill="#222" font-size="11">164</text>
<line x1="605.0" y1="40" x2="605.0" y2="196" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="605.0" y="210" text-anchor="middle" fill="#222" font-size="11">168</text>
<line x1="737.5" y1="40" x2="737.5" y2="196" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="737.5" y="210" text-anchor="middle" fill="#222" font-size="11">172</text>
<line x1="836.9" y1="40" x2="836.9" y2="196" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="836.9" y="210" text-anchor="middle" fill="#222" font-size="11">175</text>
<text x="10" y="254" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Aggregate prefixes</text>
<text x="10" y="288" text-anchor="start" fill="#222" font-size="12">12.20.164.0/22 : 164 to 167  (B)</text>
<rect x="472.5" y="268" width="132.5" height="28" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="10" y="326" text-anchor="start" fill="#222" font-size="12">12.20.168.0/22 : 168 to 171  (D)</text>
<rect x="605.0" y="306" width="132.5" height="28" fill="#dde" stroke="#222" stroke-width="2.5"/>
<text x="10" y="364" text-anchor="start" fill="#222" font-size="12">/20 would be 12.20.160.0 : 160 to 175 (A)</text>
<rect x="340.0" y="344" width="530.0" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="402" text-anchor="start" fill="#222" font-size="12">/21 would be 12.20.160.0 : 160 to 167 (C)</text>
<rect x="340.0" y="382" width="265.0" height="28" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="340.0" y1="264" x2="340.0" y2="420" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="340.0" y="434" text-anchor="middle" fill="#222" font-size="11">160</text>
<line x1="472.5" y1="264" x2="472.5" y2="420" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="472.5" y="434" text-anchor="middle" fill="#222" font-size="11">164</text>
<line x1="605.0" y1="264" x2="605.0" y2="420" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="605.0" y="434" text-anchor="middle" fill="#222" font-size="11">168</text>
<line x1="737.5" y1="264" x2="737.5" y2="420" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="737.5" y="434" text-anchor="middle" fill="#222" font-size="11">172</text>
<line x1="836.9" y1="264" x2="836.9" y2="420" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="836.9" y="434" text-anchor="middle" fill="#222" font-size="11">175</text>
<text x="10" y="460" text-anchor="start" fill="#222" font-size="12">B and D together cover 164 to 171 exactly. 164.0/20 and 164.0/21 are not valid prefixes:</text>
<text x="10" y="478" text-anchor="start" fill="#222" font-size="12">their network addresses are 160.0, so the written 164 has nonzero host bits.</text>
</svg>
