<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="sans-serif" font-size="13">
<title>Which students registered for both D01 courses C11 and C12: only S01 and S04</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="normal">Courses of D01: C11, C12. A student is returned only when both columns are marked.</text>
<text x="190" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C11</text>
<text x="290" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C12</text>
<text x="380" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">both?</text>
<rect x="20" y="70" width="440" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
<text x="40" y="90" text-anchor="start" fill="#222" font-size="13" font-weight="normal">S01</text>
<text x="190" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="290" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="380" y="90" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">yes: returned</text>
<rect x="20" y="104" width="440" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="40" y="124" text-anchor="start" fill="#222" font-size="13" font-weight="normal">S02</text>
<text x="190" y="124" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="290" y="124" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">-</text>
<text x="380" y="124" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">no</text>
<rect x="20" y="138" width="440" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="40" y="158" text-anchor="start" fill="#222" font-size="13" font-weight="normal">S03</text>
<text x="190" y="158" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">-</text>
<text x="290" y="158" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">-</text>
<text x="380" y="158" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">no</text>
<rect x="20" y="172" width="440" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/>
<text x="40" y="192" text-anchor="start" fill="#222" font-size="13" font-weight="normal">S04</text>
<text x="190" y="192" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="290" y="192" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="380" y="192" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">yes: returned</text>
<rect x="20" y="206" width="440" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="40" y="226" text-anchor="start" fill="#222" font-size="13" font-weight="normal">S05</text>
<text x="190" y="226" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">registered</text>
<text x="290" y="226" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">-</text>
<text x="380" y="226" text-anchor="middle" fill="#222" font-size="12" font-weight="normal">no</text>
<text x="20" y="262" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Result: S01, S04 = 2 rows</text>
</svg>
