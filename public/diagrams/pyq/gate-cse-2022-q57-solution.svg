<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="sans-serif" font-size="13">
<title>Two orders of the first routing update after Q-R fails: P first makes a loop, Q first does not</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">After Q-R fails: Q knows R is unreachable (cost infinity). P still holds "R at cost 2 via Q".</text>
<text x="10" y="56" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Case 1: P sends its update first</text>
<rect x="10" y="66" width="420" height="120" fill="none" stroke="#222" stroke-width="1.2"/>
<rect x="30" y="78" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="65" y="101" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">P</text>
<rect x="160" y="78" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="195" y="101" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Q</text>
<rect x="290" y="78" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="325" y="101" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">R</text>
<line x1="100" y1="96" x2="160" y2="96" stroke="#222" stroke-width="1.5"/>
<line x1="230" y1="96" x2="290" y2="96" stroke="#222" stroke-width="1.5"/>
<text x="130" y="90" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="260" y="90" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="65" y1="128" x2="195" y2="128" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="205" y="132" text-anchor="start" fill="#222" font-size="11">P tells Q: "R = 2"</text>
<text x="30" y="160" text-anchor="start" fill="#222" font-size="11">Q accepts R = 3 via P. P still routes R via Q. Q and P now point at each other.</text>
<text x="30" y="176" text-anchor="start" fill="#222" font-size="11">Loop: the cost climbs 3, 4, 5 ... (count to infinity).</text>
<text x="445" y="130" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Loop forms</text>
<text x="10" y="218" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Case 2: Q sends its update first</text>
<rect x="10" y="228" width="420" height="120" fill="none" stroke="#222" stroke-width="1.2"/>
<rect x="30" y="240" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="65" y="263" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">P</text>
<rect x="160" y="240" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="195" y="263" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Q</text>
<rect x="290" y="240" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="325" y="263" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">R</text>
<line x1="100" y1="258" x2="160" y2="258" stroke="#222" stroke-width="1.5"/>
<line x1="230" y1="258" x2="290" y2="258" stroke="#222" stroke-width="1.5"/>
<text x="130" y="252" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="260" y="252" text-anchor="middle" fill="#222" font-size="12">1</text>
<line x1="195" y1="290" x2="65" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="205" y="294" text-anchor="start" fill="#222" font-size="11">Q tells P: "R = inf"</text>
<text x="30" y="320" text-anchor="start" fill="#222" font-size="11">P marks R unreachable, because its route to R goes through Q.</text>
<text x="30" y="336" text-anchor="start" fill="#222" font-size="11">Later P sends "R = inf" back to Q. No false route exists.</text>
<text x="445" y="292" text-anchor="start" fill="#222" font-size="13" font-weight="bold">No loop</text>
<text x="10" y="380" text-anchor="start" fill="#222" font-size="12">The two update times are random with the same rate, so each order has probability 1/2.</text>
<text x="10" y="398" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P(loop) = P(P sends before Q) = 1/2 = 0.5</text>
</svg>
