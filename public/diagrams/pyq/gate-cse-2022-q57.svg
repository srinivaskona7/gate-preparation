<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" font-family="sans-serif" font-size="13">
<title>Routers P, Q and R in a line, each link of cost 1</title>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<rect x="40" y="30" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="75" y="53" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">P</text>
<rect x="170" y="30" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="205" y="53" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">Q</text>
<rect x="300" y="30" width="70" height="36" fill="none" stroke="#222" stroke-width="1.5"/><text x="335" y="53" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">R</text>
<line x1="110" y1="48" x2="170" y2="48" stroke="#222" stroke-width="1.5"/>
<line x1="240" y1="48" x2="300" y2="48" stroke="#222" stroke-width="1.5"/>
<text x="140" y="42" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="270" y="42" text-anchor="middle" fill="#222" font-size="12">1</text>
<text x="40" y="100" text-anchor="start" fill="#222" font-size="12">Every link has cost 1. The link Q-R is the one that fails.</text>
</svg>
