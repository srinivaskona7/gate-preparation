<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="sans-serif" font-size="13">
<title>Directed graph on vertices 5, 4, 3, 2, 1 with an edge from i to j whenever j is less than i; each of vertices 4, 3, 2, 1 chooses one incoming parent from the larger vertices, giving 4 x 3 x 2 x 1 = 24 trees rooted at 5; one such tree is drawn in bold</title>
