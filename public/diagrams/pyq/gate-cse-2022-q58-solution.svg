<text x="20" y="24" text-anchor="start" fill="#222" font-size="12">Edge i -&gt; j exists exactly when j &lt;= i. Self-loops are never in a tree. Dashed: all other edges.</text>
<text x="20" y="44" text-anchor="start" fill="#222" font-size="12">Bold: one spanning tree rooted at 5 (parents: 4 from 5, 3 from 4, 2 from 5, 1 from 3).</text>
<text x="20" y="312" text-anchor="start" fill="#222" font-size="12">Vertex j needs exactly one parent among {j+1, ..., 5}: 4 choices for 1, 3 for 2, 2 for 3, 1 for 4. Total 4! = 24.</text>
