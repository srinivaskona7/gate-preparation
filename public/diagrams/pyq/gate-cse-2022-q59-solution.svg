<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="sans-serif" font-size="12">
<title>Time line of one 1000-byte packet: 0.08 ms to send plus 7 ms to travel gives 7.08 ms</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<path d="M60 80 H660"/><rect x="60" y="60" width="30" height="40"/><path d="M90 130 H640" marker-end="url(#a)"/>
<path d="M60 50 V110"/><path d="M640 50 V110"/>
</g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#222"/></marker></defs>
<g fill="#222" text-anchor="middle">
<text x="60" y="40">Earth station</text><text x="640" y="40">Satellite</text>
<text x="75" y="125">0.08 ms</text><text x="365" y="122">last bit travels 2100 km: 7 ms</text>
<text x="360" y="75">sender transmits the packet (8000 bits / 100 Mbps = 0.08 ms)</text>
<text x="360" y="170">Total = 0.08 + 7 = 7.08 ms</text>
</g>
</svg>
