<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Inserting a block after block 50: contiguous allocation A costs 101 accesses, linked allocation B costs 52</title>
<text x="10" y="22" font-weight="bold" stroke="none">A: contiguous, 100 blocks in a row</text>
<g fill="none" stroke-width="1.5">
<rect x="10" y="34" width="60" height="34"/><rect x="70" y="34" width="60" height="34"/>
<rect x="150" y="34" width="60" height="34"/><rect x="210" y="34" width="60" height="34" stroke-dasharray="4 3"/>
<rect x="290" y="34" width="60" height="34"/><rect x="350" y="34" width="60" height="34"/>
<rect x="430" y="34" width="60" height="34"/><rect x="490" y="34" width="60" height="34" stroke-dasharray="4 3"/>
</g>
<g stroke="none" text-anchor="middle"><text x="40" y="56">1</text><text x="100" y="56">2</text><text x="180" y="56">50</text><text x="240" y="56">new</text><text x="320" y="56">51</text><text x="380" y="56">52</text><text x="460" y="56">100</text><text x="520" y="56">free</text></g>
<text x="135" y="56" stroke="none">...</text><text x="415" y="56" stroke="none">...</text>
<path d="M460 72 Q490 92 520 72" fill="none" stroke-width="1.5"/>
<text x="10" y="104" stroke="none">Shift blocks 51 to 100 one place right: 50 blocks, each 1 read + 1 write = 100 accesses.</text>
<text x="10" y="122" stroke="none">Write the new block into the gap: 1 access.  nA = 100 + 1 = 101</text>
<text x="10" y="156" font-weight="bold" stroke="none">B: linked, each block holds a pointer to the next</text>
<g fill="none" stroke-width="1.5">
<rect x="10" y="168" width="60" height="34"/><rect x="150" y="168" width="60" height="34"/>
<rect x="290" y="168" width="60" height="34" stroke-dasharray="4 3"/><rect x="430" y="168" width="60" height="34"/>
<path d="M70 185 H150 M210 185 H290 M350 185 H430" marker-end="url(#a)"/>
<path d="M180 202 V222 H460 V204" stroke-dasharray="2 3"/>
</g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<g stroke="none" text-anchor="middle"><text x="40" y="190">1</text><text x="180" y="190">50</text><text x="320" y="190">new</text><text x="460" y="190">51</text></g>
<text x="10" y="248" stroke="none">Read blocks 1 to 50 to reach block 50: 50 accesses.</text>
<text x="10" y="266" stroke="none">Write new block (pointing to 51): 1.  Rewrite block 50 (pointing to new): 1.  nB = 52</text>
<text x="10" y="288" font-weight="bold" stroke="none">nA + nB = 101 + 52 = 153</text>
</svg>
