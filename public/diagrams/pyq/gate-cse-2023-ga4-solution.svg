<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="sans-serif" font-size="12">
<title>One bar of 100 pregnant women: 54 saw a doctor, 36 other providers, 10 no care; 54 exceeds half</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="320" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">100 pregnant women, drawn to scale (1 woman = 1 unit)</text>
<rect x="40" y="50" width="280.8" height="56" fill="#e8e8e8" stroke="#222" stroke-width="1.5"/>
<text x="180.4" y="83" text-anchor="middle" fill="#222" font-size="13">Doctor care: 54</text>
<rect x="320.8" y="50" width="187.20000000000002" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="414.40000000000003" y="83" text-anchor="middle" fill="#222" font-size="13">Other providers: 36</text>
<rect x="508.0" y="50" width="52.0" height="56" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="534.0" y="83" text-anchor="middle" fill="#222" font-size="11">none 10</text>
<text x="180.4" y="126" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">54% of everyone</text>
<line x1="300.0" y1="40" x2="300.0" y2="116" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="300.0" y="38" text-anchor="middle" fill="#222" font-size="12">half = 50</text>
<path d="M40,138 L40,146 L508.0,146 L508.0,138" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="274.0" y="164" text-anchor="middle" fill="#222" font-size="12">90 received care: 60% of 90 = 54 doctor, 40% of 90 = 36 other</text>
<text x="320" y="188" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">54 &gt; 50, so more than half saw a doctor at least once</text>
</svg>
