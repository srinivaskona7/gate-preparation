<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif" font-size="13">
<title>Deleting node X: in a singly linked list the predecessor must be found by walking from the head, up to n minus 2 hops when X is last; in a doubly linked list X has a prev pointer, so two pointer writes suffice</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="10" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">SLLdel: singly linked, worst case X is the last node</text>
<rect x="50" y="80" width="56" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="86.96000000000001" y1="80" x2="86.96000000000001" y2="110" stroke="#222" stroke-width="1.4"/>
<text x="68.48" y="100.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">a</text>
<circle cx="96.48" cy="95.0" r="2.8" fill="#222"/>
<rect x="160" y="80" width="56" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="196.96" y1="80" x2="196.96" y2="110" stroke="#222" stroke-width="1.4"/>
<text x="178.48" y="100.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">b</text>
<circle cx="206.48000000000002" cy="95.0" r="2.8" fill="#222"/>
<rect x="270" y="80" width="56" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="306.96" y1="80" x2="306.96" y2="110" stroke="#222" stroke-width="1.4"/>
<text x="288.48" y="100.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">c</text>
<circle cx="316.48" cy="95.0" r="2.8" fill="#222"/>
<rect x="380" y="80" width="56" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="416.96" y1="80" x2="416.96" y2="110" stroke="#222" stroke-width="1.4"/>
<text x="398.48" y="100.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">d</text>
<circle cx="426.48" cy="95.0" r="2.8" fill="#222"/>
<rect x="490" y="80" width="56" height="30" fill="none" stroke="#1d4ed8" stroke-width="3"/>
<line x1="526.96" y1="80" x2="526.96" y2="110" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="508.48" y="100.0" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="bold">X</text>
<circle cx="536.48" cy="95.0" r="2.8" fill="#1d4ed8"/>
<line x1="96.48" y1="95.0" x2="160" y2="95.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="206.48000000000002" y1="95.0" x2="270" y2="95.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="316.48" y1="95.0" x2="380" y2="95.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="426.48" y1="95.0" x2="490" y2="95.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="536.48" y1="95.0" x2="564" y2="95.0" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="564" y1="87.0" x2="564" y2="103.0" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="568" y="99.0" text-anchor="start" fill="#1d4ed8" font-size="11">NULL</text>
<path d="M78,76 Q133.0,52 188,76" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M188,76 Q243.0,52 298,76" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M298,76 Q353.0,52 408,76" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="408.0" y="138" text-anchor="middle" fill="#b91c1c" font-size="12" font-weight="bold">pred</text>
<text x="50" y="44" text-anchor="start" fill="#b91c1c" font-size="12">walk from head: n - 2 = 3 hops to reach pred</text>
<text x="10" y="170" text-anchor="start" fill="#222" font-size="13">then pred-&gt;next = X-&gt;next.  The walk is Theta(n) in the worst case.</text>
<text x="10" y="214" text-anchor="start" fill="#222" font-size="13" font-weight="bold">DLLdel: doubly linked, X anywhere</text>
<rect x="50" y="270" width="56" height="32" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="64" y1="270" x2="64" y2="302" stroke="#222" stroke-width="1.2"/>
<line x1="92" y1="270" x2="92" y2="302" stroke="#222" stroke-width="1.2"/>
<text x="78" y="292" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">a</text>
<rect x="160" y="270" width="56" height="32" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="174" y1="270" x2="174" y2="302" stroke="#222" stroke-width="1.2"/>
<line x1="202" y1="270" x2="202" y2="302" stroke="#222" stroke-width="1.2"/>
<text x="188" y="292" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">b</text>
<rect x="270" y="270" width="56" height="32" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="284" y1="270" x2="284" y2="302" stroke="#222" stroke-width="1.2"/>
<line x1="312" y1="270" x2="312" y2="302" stroke="#222" stroke-width="1.2"/>
<text x="298" y="292" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">c</text>
<rect x="380" y="270" width="56" height="32" fill="none" stroke="#1d4ed8" stroke-width="3"/>
<line x1="394" y1="270" x2="394" y2="302" stroke="#1d4ed8" stroke-width="1.2"/>
<line x1="422" y1="270" x2="422" y2="302" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="408" y="292" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="bold">X</text>
<rect x="490" y="270" width="56" height="32" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="504" y1="270" x2="504" y2="302" stroke="#222" stroke-width="1.2"/>
<line x1="532" y1="270" x2="532" y2="302" stroke="#222" stroke-width="1.2"/>
<text x="518" y="292" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">e</text>
<line x1="106" y1="280" x2="160" y2="280" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="160" y1="292" x2="106" y2="292" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="216" y1="280" x2="270" y2="280" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="270" y1="292" x2="216" y2="292" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="326" y1="280" x2="380" y2="280" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="380" y1="292" x2="326" y2="292" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="436" y1="280" x2="490" y2="280" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="490" y1="292" x2="436" y2="292" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M319,268 Q418,232 497,268" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="418" y="238" text-anchor="middle" fill="#1d4ed8" font-size="11">X-&gt;prev-&gt;next = X-&gt;next</text>
<path d="M497,304 Q408,336 319,304" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ab)"/>
<text x="408" y="344" text-anchor="middle" fill="#1d4ed8" font-size="11">X-&gt;next-&gt;prev = X-&gt;prev</text>
<text x="10" y="376" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Two pointer writes, no walk: O(1).   Answer (D): SLLdel O(n), DLLdel O(1).</text>
</svg>
