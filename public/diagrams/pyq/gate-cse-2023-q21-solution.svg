<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="sans-serif" font-size="13">
<title>Timing of the multiplexer loop: while S is 1, Q copies D; while S is 0, Q holds the last value</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<polyline points="40,70 60,70 60,44 180,44 180,70 300,70 300,44 400,44 400,70 500,70" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="32" y="64" text-anchor="end" fill="#222" font-size="13">S</text>
<polyline points="40,130 100,130 100,104 140,104 140,130 220,130 220,104 260,104 260,130 330,130 330,104 370,104 370,130 440,130 440,104 500,104" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="32" y="124" text-anchor="end" fill="#222" font-size="13">D</text>
<polyline points="40,190 100,190 100,164 140,164 140,190 330,190 330,164 370,164 370,190 500,190" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="32" y="184" text-anchor="end" fill="#222" font-size="13">Q</text>
<line x1="60" y1="25" x2="60" y2="200" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="180" y1="25" x2="180" y2="200" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="300" y1="25" x2="300" y2="200" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="400" y1="25" x2="400" y2="200" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<text x="120" y="22" text-anchor="middle" fill="#222" font-size="11">S = 1: transparent</text>
<text x="240" y="22" text-anchor="middle" fill="#222" font-size="11">S = 0: hold</text>
<text x="350" y="22" text-anchor="middle" fill="#222" font-size="11">S = 1</text>
<text x="450" y="22" text-anchor="middle" fill="#222" font-size="11">hold</text>
</svg>
