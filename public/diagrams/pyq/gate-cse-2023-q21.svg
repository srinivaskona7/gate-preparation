<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" font-family="sans-serif" font-size="13">
<title>A 2-input multiplexer: data input 1 is the external input, select S is the second external input, and the output Q is wired back to data input 0</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="150" y="70" width="100" height="100" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="200" y="100" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">MUX</text>
<text x="160" y="100" text-anchor="start" fill="#222" font-size="12">0</text>
<text x="160" y="134" text-anchor="start" fill="#222" font-size="12">1</text>
<text x="215" y="164" text-anchor="middle" fill="#222" font-size="12">S</text>
<text x="240" y="100" text-anchor="end" fill="#222" font-size="12">Q</text>
<line x1="250" y1="100" x2="330" y2="100" stroke="#222" stroke-width="1.6"/>
<circle cx="330" cy="100" r="3" fill="#222"/>
<text x="340" y="104" text-anchor="start" fill="#222" font-size="12">Q (output)</text>
<polyline points="290,100 290,30 110,30 110,95 150,95" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="290" cy="100" r="3" fill="#222"/>
<line x1="70" y1="134" x2="150" y2="134" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="70" cy="134" r="3" fill="#222"/>
<text x="60" y="138" text-anchor="end" fill="#222" font-size="12">D</text>
<line x1="200" y1="200" x2="200" y2="170" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="200" cy="200" r="3" fill="#222"/>
<text x="200" y="218" text-anchor="middle" fill="#222" font-size="12">S (enable)</text>
</svg>
