<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" font-family="sans-serif" font-size="13">
<title>User mode above and kernel mode below; a page fault and a system call always cross, a function call never does, malloc only when the heap must grow</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="40" width="640" height="130" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="30" y="58" text-anchor="start" fill="#222" font-size="13" font-weight="bold">USER MODE</text>
<rect x="20" y="240" width="640" height="110" rx="6" fill="none" stroke="#222" stroke-width="2.2"/>
<text x="30" y="258" text-anchor="start" fill="#222" font-size="13" font-weight="bold">KERNEL MODE</text>
<rect x="30" y="76" width="145" height="60" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="102" y="100" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">function call</text>
<text x="102" y="120" text-anchor="middle" fill="#222" font-size="11">a jump, stays in user mode</text>
<rect x="185" y="76" width="145" height="60" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="257" y="100" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">absent-page access</text>
<text x="257" y="120" text-anchor="middle" fill="#222" font-size="11">the MMU raises an exception</text>
<rect x="340" y="76" width="145" height="60" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="412" y="100" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">malloc</text>
<text x="412" y="120" text-anchor="middle" fill="#222" font-size="11">usually served in user space</text>
<rect x="495" y="76" width="145" height="60" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="567" y="100" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">syscall instruction</text>
<text x="567" y="120" text-anchor="middle" fill="#222" font-size="11">read, write, exit, ...</text>
<rect x="150" y="280" width="215" height="50" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="257" y="300" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">page fault handler</text>
<text x="257" y="318" text-anchor="middle" fill="#222" font-size="12">entered by exception</text>
<rect x="450" y="280" width="190" height="50" rx="4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="545" y="300" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">system call handler</text>
<text x="545" y="318" text-anchor="middle" fill="#222" font-size="12">entered by trap</text>
<path d="M257,136 L257,278" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="267" y="212" text-anchor="start" fill="#222" font-size="12">always</text>
<path d="M567,136 L567,278" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="577" y="212" text-anchor="start" fill="#222" font-size="12">always</text>
<path d="M412,136 L500,278" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#ah)"/>
<text x="430" y="205" text-anchor="end" fill="#222" font-size="11">only if</text>
<text x="430" y="218" text-anchor="end" fill="#222" font-size="11">the heap grows</text>
<text x="340" y="370" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">Only exceptions and traps guarantee a switch to kernel mode: C and D.</text>
</svg>
