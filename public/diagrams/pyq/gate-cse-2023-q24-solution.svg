<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Closure under intersection for regular, context-free, recursive and recursively enumerable languages, with the reason for each</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Class</text>
<text x="230" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Closed under ∩ ?</text>
<text x="310" y="28" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Why</text>
<line x1="15" y1="40" x2="645" y2="40" stroke="#222" stroke-width="1.4"/>
<text x="20" y="74" text-anchor="start" font-size="13" fill="#222">(A) Regular</text>
<rect x="200" y="54" width="62" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="231" y="74" text-anchor="middle" font-size="13" fill="#222">yes</text>
<text x="310" y="74" text-anchor="start" font-size="12" fill="#222">product of the two DFAs, accept if both accept</text>
<text x="20" y="118" text-anchor="start" font-size="13" fill="#222">(B) Context-free</text>
<rect x="200" y="98" width="62" height="30" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="231" y="118" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">NO</text>
<text x="310" y="118" text-anchor="start" font-size="12" fill="#222">a^n b^n c^m  ∩  a^m b^n c^n  =  a^n b^n c^n, not a CFL</text>
<text x="20" y="162" text-anchor="start" font-size="13" fill="#222">(C) Recursive</text>
<rect x="200" y="142" width="62" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="231" y="162" text-anchor="middle" font-size="13" fill="#222">yes</text>
<text x="310" y="162" text-anchor="start" font-size="12" fill="#222">run both deciders; both always halt; accept if both accept</text>
<text x="20" y="206" text-anchor="start" font-size="13" fill="#222">(D) Recursively enumerable</text>
<rect x="200" y="186" width="62" height="30" rx="4" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="231" y="206" text-anchor="middle" font-size="13" fill="#222">yes</text>
<text x="310" y="206" text-anchor="start" font-size="12" fill="#222">run both recognisers in turn; accept if both accept</text>
<line x1="15" y1="244" x2="645" y2="244" stroke="#222" stroke-width="1.4"/>
<text x="20" y="272" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Correct statements: (A), (C), (D). Statement (B) is the false one.</text>
<text x="20" y="296" text-anchor="start" font-size="12" fill="#222">Both a^n b^n c^m and a^m b^n c^n are context-free, yet their common strings need three equal counts.</text>
</svg>
