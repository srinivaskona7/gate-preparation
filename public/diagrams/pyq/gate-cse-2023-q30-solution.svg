<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="sans-serif">
<title>Self-loops at vertices 3 and 4 give ones on the diagonal of the adjacency matrix, so the trace and the eigenvalue sum are 2</title>
<line x1="340" y1="120" x2="270" y2="120" stroke="#222" stroke-width="1.8"/>
<line x1="270" y1="120" x2="200" y2="65" stroke="#222" stroke-width="1.8"/>
<line x1="270" y1="120" x2="200" y2="175" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="120" x2="200" y2="65" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="120" x2="200" y2="175" stroke="#222" stroke-width="1.8"/>
<ellipse cx="200" cy="36" rx="11" ry="16" fill="none" stroke="#222" stroke-width="3.5"/>
<ellipse cx="200" cy="204" rx="11" ry="16" fill="none" stroke="#222" stroke-width="3.5"/>
<g fill="#fff" stroke="#222" stroke-width="1.8"><circle cx="340" cy="120" r="14"/><circle cx="270" cy="120" r="14"/><circle cx="200" cy="65" r="14"/><circle cx="200" cy="175" r="14"/><circle cx="130" cy="120" r="14"/></g>
<g fill="#222" font-size="14" text-anchor="middle" font-weight="bold"><text x="340" y="125">1</text><text x="270" y="125">2</text><text x="200" y="70">3</text><text x="200" y="180">4</text><text x="130" y="125">5</text></g>
<text x="205" y="14" font-size="12" fill="#222">loop: a33 = 1</text>
<text x="215" y="232" font-size="12" fill="#222">loop: a44 = 1</text>
<text x="470" y="40" font-size="13" text-anchor="middle" fill="#222">adjacency matrix (rows 1 to 5)</text>
<g font-size="15" fill="#222" text-anchor="middle" font-family="monospace">
<text x="420" y="75">0 1 0 0 0</text><text x="420" y="100">1 0 1 1 0</text>
<text x="420" y="125" font-weight="bold">0 1 1 0 1</text><text x="420" y="150" font-weight="bold">0 1 0 1 1</text><text x="420" y="175">0 0 1 1 0</text></g>
<text x="470" y="210" font-size="13" text-anchor="middle" fill="#222">trace = 0+0+1+1+0 = 2 = sum of eigenvalues</text>
</svg>
