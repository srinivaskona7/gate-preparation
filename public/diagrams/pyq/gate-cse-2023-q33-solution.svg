<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 634 200" font-family="sans-serif" font-size="11">
<title>Space-time chart of a 3-stage pipeline with 20 ns cycles: instruction n finishes at cycle n+2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="143" y="32" text-anchor="middle" fill="#222" font-size="10">1</text><text x="189" y="32" text-anchor="middle" fill="#222" font-size="10">2</text><text x="235" y="32" text-anchor="middle" fill="#222" font-size="10">3</text><text x="281" y="32" text-anchor="middle" fill="#222" font-size="10">4</text><text x="327" y="32" text-anchor="middle" fill="#222" font-size="10">5</text><text x="373" y="32" text-anchor="middle" fill="#222" font-size="10">6</text><text x="112" y="32" text-anchor="end" fill="#222" font-size="10">cycle</text><text x="112" y="57" text-anchor="end" fill="#222" font-size="10">I1</text><rect x="120" y="42" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="143" y="57" text-anchor="middle" fill="#222" font-size="10">S1</text><rect x="166" y="42" width="46" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="189" y="57" text-anchor="middle" fill="#222" font-size="10">S2</text><rect x="212" y="42" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="235" y="57" text-anchor="middle" fill="#222" font-size="10">S3</text><text x="112" y="83" text-anchor="end" fill="#222" font-size="10">I2</text><rect x="166" y="68" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="189" y="83" text-anchor="middle" fill="#222" font-size="10">S1</text><rect x="212" y="68" width="46" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="235" y="83" text-anchor="middle" fill="#222" font-size="10">S2</text><rect x="258" y="68" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="281" y="83" text-anchor="middle" fill="#222" font-size="10">S3</text><text x="112" y="109" text-anchor="end" fill="#222" font-size="10">I3</text><rect x="212" y="94" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="235" y="109" text-anchor="middle" fill="#222" font-size="10">S1</text><rect x="258" y="94" width="46" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="281" y="109" text-anchor="middle" fill="#222" font-size="10">S2</text><rect x="304" y="94" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="327" y="109" text-anchor="middle" fill="#222" font-size="10">S3</text><text x="112" y="135" text-anchor="end" fill="#222" font-size="10">I4</text><rect x="258" y="120" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="281" y="135" text-anchor="middle" fill="#222" font-size="10">S1</text><rect x="304" y="120" width="46" height="22" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="327" y="135" text-anchor="middle" fill="#222" font-size="10">S2</text><rect x="350" y="120" width="46" height="22" fill="none" stroke="#222" stroke-width="1.2"/><text x="373" y="135" text-anchor="middle" fill="#222" font-size="10">S3</text><text x="10" y="166" text-anchor="start" fill="#222" font-size="11">Every cycle is 20 ns, the slowest stage (S2), so S1 (10 ns) and S3 (14 ns) idle part of each cycle.</text><text x="10" y="184" text-anchor="start" fill="#222" font-size="11">100 instructions: 3 + 99 = 102 cycles, 102 x 20 ns = 2040 ns.</text>
</svg>
