<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" font-family="sans-serif" font-size="13">
<title>Static x in funcp goes 1, 2, 3 across two calls; main stores x = 2 and y = 3 + 2 = 5, so x + y = 7</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">The static x lives in the static segment: one copy for the whole run</text>
<rect x="20" y="40" width="280" height="110" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="30" y="58" fill="#222" font-size="12" font-weight="bold">static segment</text>
<text x="30" y="80" fill="#222" font-size="12" font-family="monospace">funcp::x</text>
<rect x="30" y="92" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="60" y="111" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">1</text>
<text x="60" y="140" fill="#222" text-anchor="middle" font-size="11">start</text>
<path d="M90,107 L120,107" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="120" y="92" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="150" y="111" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">2</text>
<text x="150" y="140" fill="#222" text-anchor="middle" font-size="11">after call 1</text>
<path d="M180,107 L210,107" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="210" y="92" width="60" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="240" y="111" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">3</text>
<text x="240" y="140" fill="#222" text-anchor="middle" font-size="11">after call 2</text>
<rect x="340" y="40" width="280" height="110" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="350" y="58" fill="#222" font-size="12" font-weight="bold">main frame (stack)</text>
<rect x="350" y="66" width="120" height="42" stroke="#222" stroke-width="1.5" fill="none"/><text x="410" y="83" fill="#222" text-anchor="middle" font-size="12">x = funcp()</text><text x="410" y="99" fill="#222" text-anchor="middle" font-size="12">x = 2</text>
<rect x="490" y="66" width="120" height="42" stroke="#222" stroke-width="1.5" fill="none"/><text x="550" y="83" fill="#222" text-anchor="middle" font-size="11">y = funcp() + x</text><text x="550" y="99" fill="#222" text-anchor="middle" font-size="11">y = 3 + 2 = 5</text>
<text x="350" y="130" fill="#222" font-size="13" font-weight="bold">printf x + y = 2 + 5 = 7</text>
<text x="20" y="180" fill="#222" font-size="12">Each call runs x++ on the same static x and returns it: first 2, then 3. The initialiser = 1 runs once.</text>
</svg>
