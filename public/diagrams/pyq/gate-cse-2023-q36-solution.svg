<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif">
<title>Activation tree of main with call order numbers, GATE 2023 Q36</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="280" y1="48" x2="120" y2="94" stroke="#222" stroke-width="1.5"/>
<line x1="280" y1="48" x2="280" y2="94" stroke="#222" stroke-width="1.5"/>
<line x1="280" y1="48" x2="480" y2="94" stroke="#222" stroke-width="1.5"/>
<line x1="280" y1="118" x2="210" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="280" y1="118" x2="350" y2="174" stroke="#222" stroke-width="1.5"/>
<line x1="350" y1="198" x2="290" y2="254" stroke="#222" stroke-width="1.5"/>
<line x1="350" y1="198" x2="430" y2="254" stroke="#222" stroke-width="1.5"/>
<text x="280" y="40" font-size="14" text-anchor="middle" fill="#222">main</text>
<text x="120" y="110" font-size="14" text-anchor="middle" fill="#222">f1 (1)</text>
<text x="280" y="110" font-size="14" text-anchor="middle" fill="#222">f2(2) (2)</text>
<text x="480" y="110" font-size="14" text-anchor="middle" fill="#222">f3 (7)</text>
<text x="210" y="190" font-size="14" text-anchor="middle" fill="#222">f3 (3)</text>
<text x="350" y="190" font-size="14" text-anchor="middle" fill="#222">f2(1) (4)</text>
<text x="290" y="270" font-size="14" text-anchor="middle" fill="#222">f3 (5)</text>
<text x="430" y="270" font-size="14" text-anchor="middle" fill="#222">f1 (6)</text>
<text x="10" y="306" font-size="11" text-anchor="start" fill="#b3261e">Numbers show the order in which the calls begin.</text>
<text x="10" y="322" font-size="11" text-anchor="start" fill="#b3261e">f2 with X = 2 calls f3, then f2 with X = 1, which calls f3 and then f1.</text>
</svg>
