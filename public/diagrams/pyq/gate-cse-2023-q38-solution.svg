<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13">
<title>With a counting semaphore of 2 two threads share the section: D1 loads 10, five increments run meanwhile, then D1 overwrites with 9, D2 and D3 decrement to 7</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12" font-weight="bold">I-2 (counting semaphore, value 2): two threads are inside at once. Schedule that reaches X = 7.</text>
<text x="20" y="62" text-anchor="start" fill="#222" font-size="12">slot 1</text>
<rect x="70" y="44" width="430" height="34" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="285.0" y="65.0" text-anchor="middle" fill="#222" font-size="12">D1 loads X = 10 ... (waits to run) ... stores 10 - 1 = 9</text>
<text x="20" y="112" text-anchor="start" fill="#222" font-size="12">slot 2</text>
<rect x="70" y="94" width="80" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">I1</text>
<text x="110.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">X = 11</text>
<rect x="156" y="94" width="80" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="196.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">I2</text>
<text x="196.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">X = 12</text>
<rect x="242" y="94" width="80" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="282.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">I3</text>
<text x="282.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">X = 13</text>
<rect x="328" y="94" width="80" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="368.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">I4</text>
<text x="368.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">X = 14</text>
<rect x="414" y="94" width="80" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="454.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">I5</text>
<text x="454.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">X = 15</text>
<rect x="520" y="44" width="90" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="565.0" y="57.5" text-anchor="middle" fill="#222" font-size="11">D1 store</text>
<text x="565.0" y="72.5" text-anchor="middle" fill="#222" font-size="11">X = 9</text>
<rect x="520" y="94" width="120" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="580.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">D2: load 9</text>
<text x="580.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">store X = 8</text>
<rect x="660" y="94" width="120" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="720.0" y="107.5" text-anchor="middle" fill="#222" font-size="11">D3: load 8</text>
<text x="720.0" y="122.5" text-anchor="middle" fill="#222" font-size="11">store X = 7</text>
<line x1="500.0" y1="61.0" x2="520.0" y2="61.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="565.0" y1="78.0" x2="565.0" y2="94.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="640.0" y1="111.0" x2="660.0" y2="111.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="196" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Value of X over time:</text>
<rect x="20" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="50.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">10</text>
<line x1="80.0" y1="223.0" x2="104.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="104" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="134.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">11</text>
<line x1="164.0" y1="223.0" x2="188.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="188" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="218.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">12</text>
<line x1="248.0" y1="223.0" x2="272.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="272" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="302.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">13</text>
<line x1="332.0" y1="223.0" x2="356.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="356" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="386.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">14</text>
<line x1="416.0" y1="223.0" x2="440.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="440" y="208" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="470.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">15</text>
<line x1="500.0" y1="223.0" x2="524.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="524" y="208" width="60" height="30" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="554.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">9</text>
<line x1="584.0" y1="223.0" x2="608.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="608" y="208" width="60" height="30" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="638.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">8</text>
<line x1="668.0" y1="223.0" x2="692.0" y2="223.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="692" y="208" width="60" height="30" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="722.0" y="227.0" text-anchor="middle" fill="#222" font-size="13">7</text>
<text x="20" y="266" text-anchor="start" fill="#222" font-size="12">The five increments are lost when D1 stores 9. V2 (minimum) = 7. With a binary semaphore only one thread is inside,</text>
<text x="20" y="288" text-anchor="start" fill="#222" font-size="12">no update is lost, and X = 10 + 5 - 3 = 12 in every order, so V1 = 12.  Answer (12, 7).</text>
</svg>
