<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="sans-serif" font-size="13">
<title>Derivation of aabbb in S -&gt; aSb | X, X -&gt; aX | Xb | a | b, showing which rule produces each letter</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" text-anchor="start" font-size="15" fill="#222" font-weight="bold" font-family="monospace">S ⇒ aSb ⇒ aXb ⇒ aaXb ⇒ aaXbb ⇒ aabbb</text>
<text x="20" y="46" text-anchor="start" font-size="12" fill="#222">rules used in order: S→aSb, S→X, X→aX, X→Xb, X→b</text>
<text x="130" y="110" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="210" y="110" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="290" y="110" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="370" y="110" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="450" y="110" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="130" y="136" text-anchor="middle" font-size="12" fill="#222">S → aSb</text>
<text x="210" y="136" text-anchor="middle" font-size="12" fill="#222">X → aX</text>
<text x="290" y="136" text-anchor="middle" font-size="12" fill="#222">X → b</text>
<text x="370" y="136" text-anchor="middle" font-size="12" fill="#222">X → Xb</text>
<text x="450" y="136" text-anchor="middle" font-size="12" fill="#222">S → aSb</text>
<line x1="106" y1="158" x2="234" y2="158" stroke="#222" stroke-width="1.6"/>
<text x="170" y="178" text-anchor="middle" font-size="13" fill="#222">a^p,  p = 2</text>
<line x1="266" y1="158" x2="314" y2="158" stroke="#222" stroke-width="2.6"/>
<text x="290" y="178" text-anchor="middle" font-size="13" fill="#222">centre</text>
<line x1="346" y1="158" x2="474" y2="158" stroke="#222" stroke-width="1.6"/>
<text x="410" y="178" text-anchor="middle" font-size="13" fill="#222">b^q,  q = 2</text>
<text x="20" y="218" text-anchor="start" font-size="12" fill="#222">S → aSb adds one a on the far left and one b on the far right.</text>
<text x="20" y="240" text-anchor="start" font-size="12" fill="#222">X → aX grows the left block and X → Xb grows the right block; here the first and last letters come from S.</text>
<text x="20" y="272" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Every string is  a^p (a+b) b^q  with p, q ≥ 0:  p = n + i, q = n + j for any n, i, j ≥ 0.  Option (B).</text>
</svg>
