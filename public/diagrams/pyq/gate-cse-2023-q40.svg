<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 412" font-family="sans-serif" font-size="13">
<title>Pushdown automaton with states s, p and q: s loops on a, goes to p on b, and s, p go to q on epsilon; q pops everything</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="110" cy="130" r="22" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="110" y="135" text-anchor="middle" font-size="16" fill="#222" font-style="italic">s</text>
<circle cx="350" cy="130" r="22" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="350" y="135" text-anchor="middle" font-size="16" fill="#222" font-style="italic">p</text>
<circle cx="230" cy="260" r="22" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="230" y="265" text-anchor="middle" font-size="16" fill="#222" font-style="italic">q</text>
<line x1="50" y1="130" x2="88" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M99,110 C66,52 154,52 121,110" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M339,110 C306,52 394,52 361,110" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M219,280 C186,338 274,338 241,280" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="110" y="18" text-anchor="middle" font-size="12" fill="#222">a/⊥/A⊥</text>
<text x="110" y="34" text-anchor="middle" font-size="12" fill="#222">a/A/AA</text>
<text x="350" y="34" text-anchor="middle" font-size="12" fill="#222">b/A/ε</text>
<text x="230" y="352" text-anchor="middle" font-size="12" fill="#222">ε/A/ε</text>
<text x="230" y="368" text-anchor="middle" font-size="12" fill="#222">ε/⊥/ε</text>
<line x1="132" y1="130" x2="328" y2="130" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="122" text-anchor="middle" font-size="12" fill="#222">b/A/ε</text>
<line x1="122" y1="150" x2="216" y2="240" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="124" y="208" text-anchor="end" font-size="12" fill="#222">ε/A/ε</text>
<line x1="338" y1="150" x2="244" y2="240" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="336" y="208" text-anchor="start" font-size="12" fill="#222">ε/A/ε</text>
<text x="240" y="402" text-anchor="middle" font-size="11" fill="#222">transition label c/X/γ: read c, pop X, push γ    ·    accepts by empty stack, start state s</text>
</svg>
