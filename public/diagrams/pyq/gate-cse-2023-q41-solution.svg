<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" font-family="sans-serif" font-size="13">
<title>Array b in memory: int elements are 4 bytes apart, so r4 and r3 must advance by 4 per iteration</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="60" width="100" height="34" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="70" y="82" text-anchor="middle" fill="#222" font-size="12">b[0]</text><text x="20" y="52" text-anchor="start" fill="#222" font-size="11">r4 + 0</text><rect x="120" y="60" width="100" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="170" y="82" text-anchor="middle" fill="#222" font-size="12">b[1]</text><text x="120" y="52" text-anchor="start" fill="#222" font-size="11">r4 + 4</text><rect x="220" y="60" width="100" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="270" y="82" text-anchor="middle" fill="#222" font-size="12">b[2]</text><text x="220" y="52" text-anchor="start" fill="#222" font-size="11">r4 + 8</text><rect x="320" y="60" width="100" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="370" y="82" text-anchor="middle" fill="#222" font-size="12">b[3]</text><text x="320" y="52" text-anchor="start" fill="#222" font-size="11">r4 + 12</text><rect x="420" y="60" width="100" height="34" fill="none" stroke="#222" stroke-width="1.5"/><text x="470" y="82" text-anchor="middle" fill="#222" font-size="12">b[4]</text><text x="420" y="52" text-anchor="start" fill="#222" font-size="11">r4 + 16</text><text x="540" y="82" text-anchor="start" fill="#222" font-size="14">...</text><path d="M70,110 C110,140 130,140 160,112" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><text x="115" y="155" text-anchor="middle" fill="#222" font-size="12">add r4, r4, 4</text><text x="20" y="180" text-anchor="start" fill="#222" font-size="12">Each pass: load b[i], shift left by 3 (x 8), store a[i], step both pointers 4 bytes, i + 1, jump to L01.</text>
</svg>
