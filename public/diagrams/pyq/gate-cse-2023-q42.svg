<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Four 1 KB memory blocks with a 2-to-4 decoder on address lines IA4 and IA3 driving the chip selects</title>
<text x="10" y="22" fill="#1f2937" stroke="none">IA11..IA5 and IA2..IA0 (10 bits) go to the Addr port of every block</text>
<line x1="10" y1="32" x2="540" y2="32" stroke-width="3"/>
<line x1="75" y1="32" x2="75" y2="70" stroke-width="3"/><line x1="210" y1="32" x2="210" y2="70" stroke-width="3"/><line x1="345" y1="32" x2="345" y2="70" stroke-width="3"/><line x1="480" y1="32" x2="480" y2="70" stroke-width="3"/>
<rect x="30" y="70" width="90" height="110"/><rect x="165" y="70" width="90" height="110"/><rect x="300" y="70" width="90" height="110"/><rect x="435" y="70" width="90" height="110"/>
<g fill="#1f2937" stroke="none" text-anchor="middle">
<text x="75" y="105">1KB memory</text><text x="210" y="105">1KB memory</text><text x="345" y="105">1KB memory</text><text x="480" y="105">1KB memory</text>
<text x="75" y="135">Addr</text><text x="210" y="135">Addr</text><text x="345" y="135">Addr</text><text x="480" y="135">Addr</text>
<text x="75" y="172">X1 (CS)</text><text x="210" y="172">X2 (CS)</text><text x="345" y="172">X3 (CS)</text><text x="480" y="172">X4 (CS)</text>
</g>
<rect x="60" y="205" width="90" height="96"/>
<g fill="#1f2937" stroke="none"><text x="105" y="222" text-anchor="middle">Decoder</text><text x="66" y="256">A1</text><text x="66" y="280">A0</text>
<text x="12" y="256">IA4</text><text x="12" y="280">IA3</text></g>
<g fill="#1f2937" stroke="none" font-size="11" text-anchor="end"><text x="144" y="244">Q0</text><text x="144" y="261">Q1</text><text x="144" y="278">Q2</text><text x="144" y="295">Q3</text></g>
<line x1="34" y1="252" x2="60" y2="252"/><line x1="34" y1="276" x2="60" y2="276"/>
<polyline points="150,240 165,240 165,195 75,195 75,180"/>
<polyline points="150,257 210,257 210,180"/>
<polyline points="150,274 345,274 345,180"/>
<polyline points="150,291 480,291 480,180"/>
</svg>
