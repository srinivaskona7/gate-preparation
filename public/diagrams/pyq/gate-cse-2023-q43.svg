<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" font-family="sans-serif" font-size="13">
<title>Three flip-flops T, D, T on a common clock CLKIN: Q1 feeds D, Q2 feeds the last T, and Q3 through an inverter feeds the first T</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="80" y="80" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="102" y="114" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">T</text>
<polyline points="80,140 91,148 80,156" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="141" y="110" text-anchor="middle" fill="#222" font-size="12">Q</text>
<rect x="230" y="80" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="252" y="114" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">D</text>
<polyline points="230,140 241,148 230,156" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="291" y="110" text-anchor="middle" fill="#222" font-size="12">Q</text>
<rect x="380" y="80" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="402" y="114" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">T</text>
<polyline points="380,140 391,148 380,156" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="441" y="110" text-anchor="middle" fill="#222" font-size="12">Q</text>
<line x1="150" y1="105" x2="230" y2="105" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="156" y="99" text-anchor="start" fill="#222" font-size="12">Q1</text>
<line x1="300" y1="105" x2="380" y2="105" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="306" y="99" text-anchor="start" fill="#222" font-size="12">Q2</text>
<line x1="450" y1="105" x2="480" y2="105" stroke="#222" stroke-width="1.6"/>
<text x="453" y="99" text-anchor="start" fill="#222" font-size="12">Q3</text>
<path d="M480,97 L480,113 L496,105 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="500" cy="105" r="3.5" fill="none" stroke="#222" stroke-width="1.4"/>
<polyline points="504,105 520,105 520,34 55,34 55,105 80,105" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="75,205 366,205" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="69" y="209" text-anchor="end" fill="#222" font-size="12">CLKIN</text>
<polyline points="66,205 66,148 80,148" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="216,205 216,148 230,148" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="366,205 366,148 380,148" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="270" y="248" text-anchor="middle" fill="#222" font-size="12">Initial (Q1, Q2, Q3) = (0, 1, 1)</text>
</svg>
