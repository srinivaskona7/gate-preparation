<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif" font-size="13">
<title>The same tree with the value foo returns at each node and the order of the printf calls: 3 prints first, then 8, 16, 13, 24 and 50</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="263.9" y1="48.0" x2="156.1" y2="102.0" stroke="#222" stroke-width="1.6"/>
<line x1="127.3" y1="122.7" x2="82.7" y2="167.3" stroke="#222" stroke-width="1.6"/>
<line x1="152.7" y1="122.7" x2="197.3" y2="167.3" stroke="#222" stroke-width="1.6"/>
<line x1="292.7" y1="52.7" x2="337.3" y2="97.3" stroke="#222" stroke-width="1.6"/>
<line x1="362.7" y1="122.7" x2="407.3" y2="167.3" stroke="#222" stroke-width="1.6"/>
<circle cx="280" cy="40" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="280" y="44.76" text-anchor="middle" fill="#222" font-size="14">10</text>
<circle cx="140" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="140" y="114.76" text-anchor="middle" fill="#222" font-size="14">5</text>
<circle cx="70" cy="180" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="70" y="184.76" text-anchor="middle" fill="#222" font-size="14">3</text>
<circle cx="210" cy="180" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="210" y="184.76" text-anchor="middle" fill="#222" font-size="14">8</text>
<circle cx="350" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="350" y="114.76" text-anchor="middle" fill="#222" font-size="14">11</text>
<circle cx="420" cy="180" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="420" y="184.76" text-anchor="middle" fill="#222" font-size="14">13</text>
<text x="304" y="44" text-anchor="start" fill="#222" font-size="11">returns 50  (print #6)</text>
<text x="164" y="114" text-anchor="start" fill="#222" font-size="11">returns 16  (print #3)</text>
<text x="70" y="214" text-anchor="middle" fill="#222" font-size="11">returns 3</text>
<text x="70" y="228" text-anchor="middle" fill="#222" font-size="11">print #1</text>
<text x="210" y="214" text-anchor="middle" fill="#222" font-size="11">returns 8</text>
<text x="210" y="228" text-anchor="middle" fill="#222" font-size="11">print #2</text>
<text x="374" y="114" text-anchor="start" fill="#222" font-size="11">returns 24  (print #5)</text>
<text x="420" y="214" text-anchor="middle" fill="#222" font-size="11">returns 13</text>
<text x="420" y="228" text-anchor="middle" fill="#222" font-size="11">print #4</text>
<text x="320" y="290" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">print order: 3  8  16  13  24  50   (option C)</text>
<text x="320" y="314" text-anchor="middle" fill="#222" font-size="12">A child prints before its parent (postorder), and each value is the sum of its subtree.</text>
</svg>
