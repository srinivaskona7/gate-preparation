<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="sans-serif" font-size="13">
<title>Permutations of 9 positions that separate A from B when k is 2: choose 4 positions for the members of A and B, put all of A before all of B or all of B before all of A, then order each group and the remaining elements</title>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="12">Example n = 9, k = 2. Cells are positions in the permutation; "." is an element of neither A nor B.</text>
<text x="20" y="83" text-anchor="start" fill="#222" font-size="13" font-weight="bold">A first</text>
<rect x="100" y="55" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="122" y="81" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="150" y="55" width="44" height="40" rx="0" fill="#ddd" stroke="#222" stroke-width="1.5"/>
<text x="172" y="81" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">A</text>
<rect x="200" y="55" width="44" height="40" rx="0" fill="#ddd" stroke="#222" stroke-width="1.5"/>
<text x="222" y="81" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">A</text>
<rect x="250" y="55" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="272" y="81" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="300" y="55" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="322" y="81" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="350" y="55" width="44" height="40" rx="0" fill="#999" stroke="#222" stroke-width="1.5"/>
<text x="372" y="81" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">B</text>
<rect x="400" y="55" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="422" y="81" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="450" y="55" width="44" height="40" rx="0" fill="#999" stroke="#222" stroke-width="1.5"/>
<text x="472" y="81" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">B</text>
<rect x="500" y="55" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="522" y="81" text-anchor="middle" fill="#222" font-size="15">.</text>
<text x="100" y="117" text-anchor="start" fill="#222" font-size="11">the 4 chosen positions: the first 2 hold one set, the last 2 hold the other</text>
<text x="20" y="163" text-anchor="start" fill="#222" font-size="13" font-weight="bold">B first</text>
<rect x="100" y="135" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="122" y="161" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="150" y="135" width="44" height="40" rx="0" fill="#999" stroke="#222" stroke-width="1.5"/>
<text x="172" y="161" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">B</text>
<rect x="200" y="135" width="44" height="40" rx="0" fill="#999" stroke="#222" stroke-width="1.5"/>
<text x="222" y="161" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">B</text>
<rect x="250" y="135" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="272" y="161" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="300" y="135" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="322" y="161" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="350" y="135" width="44" height="40" rx="0" fill="#ddd" stroke="#222" stroke-width="1.5"/>
<text x="372" y="161" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">A</text>
<rect x="400" y="135" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="422" y="161" text-anchor="middle" fill="#222" font-size="15">.</text>
<rect x="450" y="135" width="44" height="40" rx="0" fill="#ddd" stroke="#222" stroke-width="1.5"/>
<text x="472" y="161" text-anchor="middle" fill="#222" font-size="15" font-weight="bold">A</text>
<rect x="500" y="135" width="44" height="40" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="522" y="161" text-anchor="middle" fill="#222" font-size="15">.</text>
<text x="100" y="197" text-anchor="start" fill="#222" font-size="11">the 4 chosen positions: the first 2 hold one set, the last 2 hold the other</text>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="13">Count = C(n, 2k) ways to pick the positions  x  2 choices of which set goes first</text>
<text x="20" y="254" text-anchor="start" fill="#222" font-size="13">        x  (k!)^2 orders inside A and inside B  x  (n - 2k)! orders of the other elements</text>
<text x="20" y="278" text-anchor="start" fill="#222" font-size="14" font-weight="bold">= 2 C(n, 2k) (k!)^2 (n - 2k)!</text>
</svg>
