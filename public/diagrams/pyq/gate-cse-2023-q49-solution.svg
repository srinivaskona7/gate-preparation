<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
<title>A onto function f from A to B factors through its equivalence classes: A maps to the set of classes, and the induced map F from classes to B pairs each class with exactly one element of B, so F is well defined, onto and one-to-one</title>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="12">Example: A = {1,...,6}, B = {x, y, z}, f(1) = f(2) = x, f(3) = y, f(4) = f(5) = f(6) = z</text>
<text x="70" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">A</text>
<text x="300" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">E = classes of ~</text>
<text x="540" y="58" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">B</text>
<circle cx="70" cy="80" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="84.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="70" cy="116" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="120.6" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="70" cy="152" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="156.6" text-anchor="middle" fill="#222" font-size="13">3</text>
<circle cx="70" cy="188" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="192.6" text-anchor="middle" fill="#222" font-size="13">4</text>
<circle cx="70" cy="224" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="228.6" text-anchor="middle" fill="#222" font-size="13">5</text>
<circle cx="70" cy="260" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="264.6" text-anchor="middle" fill="#222" font-size="13">6</text>
<rect x="235" y="84" width="130" height="28" rx="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="103" text-anchor="middle" fill="#222" font-size="12">[1] = {1,2}</text>
<line x1="84" y1="80" x2="227" y2="97.2" stroke="#222" stroke-width="1.2"/>
<polygon points="234,98 226.7,100.3 227.4,94" fill="#222"/>
<line x1="84" y1="116" x2="227" y2="98.8" stroke="#222" stroke-width="1.2"/>
<polygon points="234,98 227.4,102 226.7,95.7" fill="#222"/>
<circle cx="540" cy="98" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="540" y="102.6" text-anchor="middle" fill="#222" font-size="13">x</text>
<line x1="366" y1="98" x2="516" y2="98" stroke="#222" stroke-width="2.2"/>
<polygon points="525,98 516,102.1 516,94" fill="#222"/>
<rect x="235" y="138" width="130" height="28" rx="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="157" text-anchor="middle" fill="#222" font-size="12">[3] = {3}</text>
<line x1="84" y1="152" x2="227" y2="152" stroke="#222" stroke-width="1.2"/>
<polygon points="234,152 227,155.2 227,148.9" fill="#222"/>
<circle cx="540" cy="152" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="540" y="156.6" text-anchor="middle" fill="#222" font-size="13">y</text>
<line x1="366" y1="152" x2="516" y2="152" stroke="#222" stroke-width="2.2"/>
<polygon points="525,152 516,156.1 516,148" fill="#222"/>
<rect x="235" y="210" width="130" height="28" rx="14" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="300" y="229" text-anchor="middle" fill="#222" font-size="12">[4] = {4,5,6}</text>
<line x1="84" y1="188" x2="227.2" y2="222.4" stroke="#222" stroke-width="1.2"/>
<polygon points="234,224 226.5,225.4 227.9,219.3" fill="#222"/>
<line x1="84" y1="224" x2="227" y2="224" stroke="#222" stroke-width="1.2"/>
<polygon points="234,224 227,227.2 227,220.9" fill="#222"/>
<line x1="84" y1="260" x2="227.2" y2="225.6" stroke="#222" stroke-width="1.2"/>
<polygon points="234,224 227.9,228.7 226.5,222.6" fill="#222"/>
<circle cx="540" cy="224" r="14" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="540" y="228.6" text-anchor="middle" fill="#222" font-size="13">z</text>
<line x1="366" y1="224" x2="516" y2="224" stroke="#222" stroke-width="2.2"/>
<polygon points="525,224 516,228.1 516,220" fill="#222"/>
<text x="185" y="296" text-anchor="middle" fill="#222" font-size="12">x ~ y when f(x) = f(y)</text>
<text x="420" y="186" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">F([a]) = f(a)</text>
<text x="420" y="204" text-anchor="middle" fill="#222" font-size="12">one class per element of B</text>
<text x="20" y="320" text-anchor="start" fill="#222" font-size="11">Well defined: f is constant on a class. Onto: f is onto. One-to-one: F([a]) = F([b]) means f(a) = f(b), so [a] = [b].</text>
</svg>
