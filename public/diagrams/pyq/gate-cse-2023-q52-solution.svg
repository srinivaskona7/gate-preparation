<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Persistent HTTP with pipelining: 6 RTTs</title><text x="10" y="36" fill="#222" stroke="none" text-anchor="start" >DNS root</text><rect x="230" y="20" width="60" height="24" fill="#cfd8dc"/><text x="10" y="70" fill="#222" stroke="none" text-anchor="start" >DNS TLD</text><rect x="290" y="54" width="60" height="24" fill="#cfd8dc"/><text x="10" y="104" fill="#222" stroke="none" text-anchor="start" >DNS authoritative</text><rect x="350" y="88" width="60" height="24" fill="#cfd8dc"/><text x="10" y="138" fill="#222" stroke="none" text-anchor="start" >TCP handshake</text><rect x="410" y="122" width="60" height="24" fill="#cfd8dc"/><text x="10" y="172" fill="#222" stroke="none" text-anchor="start" >GET html + response</text><rect x="470" y="156" width="60" height="24" fill="#cfd8dc"/><text x="10" y="206" fill="#222" stroke="none" text-anchor="start" >10 objects, one pipelined round</text><rect x="530" y="190" width="60" height="24" fill="#cfd8dc"/><line x1="230" y1="220" x2="230" y2="230"/><text x="230" y="244" fill="#222" stroke="none" text-anchor="middle" >0</text><line x1="290" y1="220" x2="290" y2="230"/><text x="290" y="244" fill="#222" stroke="none" text-anchor="middle" >1</text><line x1="350" y1="220" x2="350" y2="230"/><text x="350" y="244" fill="#222" stroke="none" text-anchor="middle" >2</text><line x1="410" y1="220" x2="410" y2="230"/><text x="410" y="244" fill="#222" stroke="none" text-anchor="middle" >3</text><line x1="470" y1="220" x2="470" y2="230"/><text x="470" y="244" fill="#222" stroke="none" text-anchor="middle" >4</text><line x1="530" y1="220" x2="530" y2="230"/><text x="530" y="244" fill="#222" stroke="none" text-anchor="middle" >5</text><line x1="590" y1="220" x2="590" y2="230"/><text x="590" y="244" fill="#222" stroke="none" text-anchor="middle" >6</text><line x1="230" y1="225" x2="590" y2="225"/><text x="410" y="264" fill="#222" stroke="none" text-anchor="middle" >elapsed RTTs: persistent HTTP with pipelining = 6</text></svg>
