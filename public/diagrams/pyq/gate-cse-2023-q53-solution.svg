<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif">
<title>Four equally likely outcomes HH, HT, TH, TT with events A = HH, B = first is head = HH or HT, C = second is head = HH or TH; the table compares P(X and Y) with P(X) P(Y): A and B fail, A and C fail, B and C pass</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<rect x="40" y="50" width="100" height="80" rx="0" fill="#cfd8dc" stroke="#222" stroke-width="1.5"/>
<text x="90" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">HH</text>
<text x="90" y="108" text-anchor="middle" font-size="12" fill="#222">A, B, C</text>
<text x="90" y="124" text-anchor="middle" font-size="10" fill="#222">prob 1/4</text>
<rect x="140" y="50" width="100" height="80" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="190" y="86" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">HT</text>
<text x="190" y="108" text-anchor="middle" font-size="12" fill="#222">B</text>
<text x="190" y="124" text-anchor="middle" font-size="10" fill="#222">prob 1/4</text>
<rect x="40" y="130" width="100" height="80" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="90" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">TH</text>
<text x="90" y="188" text-anchor="middle" font-size="12" fill="#222">C</text>
<text x="90" y="204" text-anchor="middle" font-size="10" fill="#222">prob 1/4</text>
<rect x="140" y="130" width="100" height="80" rx="0" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="190" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">TT</text>
<text x="190" y="188" text-anchor="middle" font-size="12" fill="#222">-</text>
<text x="190" y="204" text-anchor="middle" font-size="10" fill="#222">prob 1/4</text>
<text x="140" y="34" text-anchor="middle" font-size="12" font-style="italic" fill="#222">each outcome 1/4</text>
<text x="140" y="234" text-anchor="middle" font-size="12" fill="#222">A = {HH}   B = {HH, HT}   C = {HH, TH}</text>
<text x="290" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#222">pair</text>
<text x="350" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#222">P(X and Y)</text>
<text x="450" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#222">P(X) P(Y)</text>
<text x="550" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#222">independent?</text>
<line x1="284" y1="70" x2="690" y2="70" stroke="#222" stroke-width="1"/>
<text x="290" y="98" text-anchor="start" font-size="12" fill="#222">A, B</text>
<text x="350" y="98" text-anchor="start" font-size="12" fill="#222">1/4</text>
<text x="450" y="98" text-anchor="start" font-size="12" fill="#222">1/4 x 1/2 = 1/8</text>
<text x="550" y="98" text-anchor="start" font-size="12" fill="#222">no</text>
<text x="290" y="134" text-anchor="start" font-size="12" fill="#222">A, C</text>
<text x="350" y="134" text-anchor="start" font-size="12" fill="#222">1/4</text>
<text x="450" y="134" text-anchor="start" font-size="12" fill="#222">1/4 x 1/2 = 1/8</text>
<text x="550" y="134" text-anchor="start" font-size="12" fill="#222">no</text>
<text x="290" y="170" text-anchor="start" font-size="12" font-weight="bold" fill="#222">B, C</text>
<text x="350" y="170" text-anchor="start" font-size="12" font-weight="bold" fill="#222">1/4</text>
<text x="450" y="170" text-anchor="start" font-size="12" font-weight="bold" fill="#222">1/2 x 1/2 = 1/4</text>
<text x="550" y="170" text-anchor="start" font-size="12" font-weight="bold" fill="#b3261e">yes</text>
<text x="290" y="235" text-anchor="start" font-size="12" font-weight="bold" fill="#222">P(B | C) = P(B and C) / P(C) = (1/4) / (1/2) = 1/2 = P(B)</text>
<text x="290" y="262" text-anchor="start" font-size="13" font-weight="bold" fill="#222">True statements: (C) B and C independent, (D) P(B | C) = P(B)</text>
</svg>
