<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>Greedy colouring on a path with four vertices processed in the order p4, p3, p1, p2 uses 3 colours although 2 suffice, and on a triangle it uses 3 colours although the maximum degree is 2</title>
<text x="150" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Path p1 - p2 - p3 - p4</text>
<line x1="50" y1="100" x2="130" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="130" y1="100" x2="210" y2="100" stroke="#222" stroke-width="1.8"/>
<line x1="210" y1="100" x2="290" y2="100" stroke="#222" stroke-width="1.8"/>
<circle cx="50" cy="100" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="50" y="104.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<text x="50" y="142" text-anchor="middle" fill="#222" font-size="12">p1</text>
<text x="50" y="160" text-anchor="middle" fill="#222" font-size="12">step 3</text>
<circle cx="130" cy="100" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="130" y="104.6" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="130" y="142" text-anchor="middle" fill="#222" font-size="12">p2</text>
<text x="130" y="160" text-anchor="middle" fill="#222" font-size="12">step 4</text>
<circle cx="210" cy="100" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="210" y="104.6" text-anchor="middle" fill="#222" font-size="13">2</text>
<text x="210" y="142" text-anchor="middle" fill="#222" font-size="12">p3</text>
<text x="210" y="160" text-anchor="middle" fill="#222" font-size="12">step 2</text>
<circle cx="290" cy="100" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="290" y="104.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<text x="290" y="142" text-anchor="middle" fill="#222" font-size="12">p4</text>
<text x="290" y="160" text-anchor="middle" fill="#222" font-size="12">step 1</text>
<text x="150" y="192" text-anchor="middle" fill="#222" font-size="12">Number in circle = colour given</text>
<text x="150" y="212" text-anchor="middle" fill="#222" font-size="12">p2 sees colours 1 (p1) and 2 (p3), takes 3</text>
<text x="150" y="232" text-anchor="middle" fill="#222" font-size="12">Two colours would do: 1, 2, 1, 2</text>
<text x="480" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Triangle</text>
<line x1="480" y1="60" x2="440" y2="130" stroke="#222" stroke-width="1.8"/>
<line x1="440" y1="130" x2="520" y2="130" stroke="#222" stroke-width="1.8"/>
<line x1="520" y1="130" x2="480" y2="60" stroke="#222" stroke-width="1.8"/>
<circle cx="480" cy="60" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="480" y="64.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="440" cy="130" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="440" y="134.6" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="520" cy="130" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="520" y="134.6" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="480" y="168" text-anchor="middle" fill="#222" font-size="12">max degree 2, colours used 3</text>
<text x="480" y="188" text-anchor="middle" fill="#222" font-size="12">3 = max degree + 1</text>
<text x="20" y="268" text-anchor="start" fill="#222" font-size="12">A and B hold: the colour is the least not used by a neighbour (proper), and a vertex has at most</text>
<text x="20" y="286" text-anchor="start" fill="#222" font-size="12">max-degree neighbours, so a colour in 1..max-degree+1 is always free. C and D fail on the two graphs above.</text>
</svg>
