<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="sans-serif">
<title>The empty set is adjacent to all seven other subsets of {1,2,3}, so a BFS from it sees them in any of 7 factorial orders</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<circle cx="240" cy="165" r="22" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="240" y="169.6" text-anchor="middle" font-size="13" fill="#222">{}</text>
<circle cx="240" cy="50" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="240" y="53.9" text-anchor="middle" font-size="11" fill="#222">{1}</text>
<line x1="240.0" y1="143.0" x2="240.0" y2="70.0" stroke="#222" stroke-width="1.6"/>
<circle cx="338" cy="93" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="338" y="96.8" text-anchor="middle" font-size="11" fill="#222">{2}</text>
<line x1="257.7" y1="152.0" x2="321.9" y2="104.8" stroke="#222" stroke-width="1.6"/>
<circle cx="362" cy="191" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="362" y="194.8" text-anchor="middle" font-size="11" fill="#222">{3}</text>
<line x1="261.5" y1="169.6" x2="342.4" y2="186.8" stroke="#222" stroke-width="1.6"/>
<circle cx="294" cy="269" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="294" y="272.9" text-anchor="middle" font-size="11" fill="#222">{1,2}</text>
<line x1="250.1" y1="184.5" x2="284.8" y2="251.3" stroke="#222" stroke-width="1.6"/>
<circle cx="186" cy="269" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="186" y="272.9" text-anchor="middle" font-size="11" fill="#222">{1,3}</text>
<line x1="229.9" y1="184.5" x2="195.2" y2="251.3" stroke="#222" stroke-width="1.6"/>
<circle cx="118" cy="191" r="20" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="118" y="194.8" text-anchor="middle" font-size="11" fill="#222">{2,3}</text>
<line x1="218.5" y1="169.6" x2="137.6" y2="186.8" stroke="#222" stroke-width="1.6"/>
<circle cx="142" cy="93" r="24" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="142" y="96.8" text-anchor="middle" font-size="11" fill="#222">{1,2,3}</text>
<line x1="222.3" y1="152.0" x2="161.3" y2="107.2" stroke="#222" stroke-width="1.6"/>
<text x="10" y="320" text-anchor="start" font-size="12" font-weight="bold" fill="#222">All 7 are layer 1: any order is a valid BFS, so 7! = 5040</text>
</svg>
