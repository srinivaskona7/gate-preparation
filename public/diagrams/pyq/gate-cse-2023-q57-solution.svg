<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Column-wise walk of a 128 by 128 array on 30 LRU frames: each column visits pages P0 to P31 in order, 32 pages do not fit in 30 frames, so every first touch of a page faults: 32 faults per column, 4096 in total</title>
<text x="330" y="20" text-anchor="middle" fill="#222" font-weight="bold">Array D in memory: 4 rows per page, 32 pages</text>
<rect x="20" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="60" y="45" text-anchor="middle" fill="#222">P0</text><text x="60" y="59" text-anchor="middle" fill="#222" font-size="10">rows 0-3</text>
<rect x="100" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="140" y="45" text-anchor="middle" fill="#222">P1</text><text x="140" y="59" text-anchor="middle" fill="#222" font-size="10">rows 4-7</text>
<rect x="180" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="220" y="45" text-anchor="middle" fill="#222">P2</text><text x="220" y="59" text-anchor="middle" fill="#222" font-size="10">rows 8-11</text>
<text x="330" y="52" text-anchor="middle" fill="#222">. . .</text>
<rect x="400" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="440" y="45" text-anchor="middle" fill="#222">P29</text><text x="440" y="59" text-anchor="middle" fill="#222" font-size="10">rows 116-119</text>
<rect x="480" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="520" y="45" text-anchor="middle" fill="#222">P30</text><text x="520" y="59" text-anchor="middle" fill="#222" font-size="10">rows 120-123</text>
<rect x="560" y="30" width="80" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="600" y="45" text-anchor="middle" fill="#222">P31</text><text x="600" y="59" text-anchor="middle" fill="#222" font-size="10">rows 124-127</text>
<text x="330" y="92" text-anchor="middle" fill="#222">Column i of the loop touches rows 0, 1, 2, ..., 127: P0 four times, then P1 four times, ... then P31</text>
<text x="20" y="124" fill="#222" font-weight="bold">The 30 frames, least recently used on the left</text>
<text x="20" y="150" fill="#222" font-size="12">Column 0 ends:</text>
<rect x="130" y="134" width="270" height="22" stroke="#222" stroke-width="1.5" fill="none"/><text x="265" y="150" text-anchor="middle" fill="#222" font-size="12">P2  P3  P4  ...  P29  P30  P31</text>
<text x="410" y="150" fill="#222" font-size="11">P0, P1 were evicted by P30, P31</text>
<text x="20" y="184" fill="#222" font-size="12">Column 1, P0:</text>
<rect x="130" y="168" width="270" height="22" stroke="#222" stroke-width="1.5" fill="none"/><text x="265" y="184" text-anchor="middle" fill="#222" font-size="12">P3  P4  P5  ...  P30  P31  P0</text>
<text x="410" y="184" fill="#222" font-size="11">fault, P2 evicted (oldest)</text>
<text x="20" y="218" fill="#222" font-size="12">Column 1, P1:</text>
<rect x="130" y="202" width="270" height="22" stroke="#222" stroke-width="1.5" fill="none"/><text x="265" y="218" text-anchor="middle" fill="#222" font-size="12">P4  P5  P6  ...  P31  P0  P1</text>
<text x="410" y="218" fill="#222" font-size="11">fault, P3 evicted (oldest)</text>
<text x="330" y="252" text-anchor="middle" fill="#222">Each page is evicted just before it is needed again, so no revisit finds its page in memory.</text>
<text x="330" y="278" text-anchor="middle" fill="#222">The first row of each page faults, the other 3 rows hit: 128 / 4 = 32 faults per column</text>
<text x="330" y="310" text-anchor="middle" fill="#222" font-weight="bold">32 faults x 128 columns = 4096</text>
</svg>
