<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" font-family="sans-serif" font-size="13">
<title>57-bit virtual address: 12 offset bits and 45 bits split into five 9-bit level indexes, so L is 5</title>
<text x="320" y="20" text-anchor="middle" fill="#222">57 bits = 5 x 9 + 12</text>
<rect x="20" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="120" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="220" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="320" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="420" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/><rect x="520" y="35" width="100" height="44" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="70" y="62" text-anchor="middle" fill="#222">L1: 9</text><text x="170" y="62" text-anchor="middle" fill="#222">L2: 9</text><text x="270" y="62" text-anchor="middle" fill="#222">L3: 9</text><text x="370" y="62" text-anchor="middle" fill="#222">L4: 9</text><text x="470" y="62" text-anchor="middle" fill="#222">L5: 9</text><text x="570" y="62" text-anchor="middle" fill="#222">offset: 12</text>
<text x="320" y="110" text-anchor="middle" fill="#222">one table = 4 KB / 8 B = 512 entries = 2^9, so 9 index bits per level</text>
<text x="320" y="130" text-anchor="middle" fill="#222">45 index bits / 9 = 5 levels</text>
</svg>
