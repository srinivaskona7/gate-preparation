<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" font-family="sans-serif"><title>Primary index of 50 blocks searched by binary search in 6 block reads</title>
<text x="20" y="22" text-anchor="start" font-size="14" fill="#1f2937">Index file: 50 blocks, 51 entries each (20 bytes per entry)</text><rect x="20" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="55" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 1</text><rect x="100" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="135" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 2</text><rect x="180" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="215" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 3</text><rect x="260" y="35" width="70" height="30" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/><text x="295" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 4</text><rect x="340" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="375" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 5</text><rect x="420" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="455" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 6</text><rect x="500" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="535" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 7</text><rect x="580" y="35" width="70" height="30" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="615" y="55" text-anchor="middle" font-size="13" fill="#1f2937">blk 8...</text><text x="20" y="95" text-anchor="start" font-size="13" fill="#1f2937">Binary search halves the 50 blocks: 50, 25, 13, 7, 4, 2, 1</text><text x="20" y="115" text-anchor="start" font-size="13" fill="#1f2937">Blocks left after each read: 25, 12, 6, 3, 1, 0 so the worst case is 6 reads</text><text x="20" y="150" text-anchor="start" font-size="13" fill="#1f2937">Data file: 2500 blocks, 10 records each. The matching anchor entry names one data block.</text>
</svg>
