<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 215" font-family="sans-serif"><title>Primary index: one anchor key and block pointer per data block, over an ordered data file</title>
<text x="20" y="22" text-anchor="start" font-size="14" fill="#1f2937">Index file (one entry per data block)</text><text x="420" y="22" text-anchor="start" font-size="14" fill="#1f2937">Data file (ordered, 10 records per block)</text><rect x="20" y="40" width="200" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="140" y1="40" x2="140" y2="74" stroke="#1f2937"/><text x="80" y="62" text-anchor="middle" font-size="13" fill="#1f2937">anchor key</text><text x="180" y="62" text-anchor="middle" font-size="13" fill="#1f2937">block ptr</text><rect x="420" y="40" width="250" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="500" y1="40" x2="500" y2="74" stroke="#1f2937"/><text x="460" y="62" text-anchor="middle" font-size="13" fill="#1f2937">key 15 B</text><text x="585" y="62" text-anchor="middle" font-size="13" fill="#1f2937">other fields 85 B</text><line x1="220" y1="57" x2="420" y2="57" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="20" y="90" width="200" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="140" y1="90" x2="140" y2="124" stroke="#1f2937"/><text x="80" y="112" text-anchor="middle" font-size="13" fill="#1f2937">anchor key</text><text x="180" y="112" text-anchor="middle" font-size="13" fill="#1f2937">block ptr</text><rect x="420" y="90" width="250" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="500" y1="90" x2="500" y2="124" stroke="#1f2937"/><text x="460" y="112" text-anchor="middle" font-size="13" fill="#1f2937">key 15 B</text><text x="585" y="112" text-anchor="middle" font-size="13" fill="#1f2937">other fields 85 B</text><line x1="220" y1="107" x2="420" y2="107" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="20" y="140" width="200" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="140" y1="140" x2="140" y2="174" stroke="#1f2937"/><text x="80" y="162" text-anchor="middle" font-size="13" fill="#1f2937">anchor key</text><text x="180" y="162" text-anchor="middle" font-size="13" fill="#1f2937">block ptr</text><rect x="420" y="140" width="250" height="34" fill="none" stroke="#1f2937" stroke-width="1.5"/><line x1="500" y1="140" x2="500" y2="174" stroke="#1f2937"/><text x="460" y="162" text-anchor="middle" font-size="13" fill="#1f2937">key 15 B</text><text x="585" y="162" text-anchor="middle" font-size="13" fill="#1f2937">other fields 85 B</text><line x1="220" y1="157" x2="420" y2="157" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="4 3"/><text x="20" y="200" text-anchor="start" font-size="13" fill="#1f2937">Entry = 15 B key + 5 B pointer. Block = 1024 B. Record = 100 B.</text>
</svg>
