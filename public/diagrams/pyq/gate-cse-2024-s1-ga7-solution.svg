<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="sans-serif" font-size="13">
<title>A 54 cm by 4 cm sheet rolled along its long edges becomes a tube of height 54 cm and circumference 4 cm, radius 2 over pi, volume 216 over pi; the cube of surface 216 square cm has side 6 cm and volume 216; ratio 1 over pi (not to scale)</title>
<text x="20" y="24" fill="#222" font-weight="bold">1. Sheet 54 x 4</text>
<rect x="20" y="40" width="270" height="20" fill="#c9d6ee" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<text x="155" y="78" text-anchor="middle" fill="#222" font-size="12">long edges (54 cm) get joined</text>
<text x="155" y="94" text-anchor="middle" fill="#222" font-size="12">short edges (4 cm) become the two circles</text>
<text x="300" y="55" fill="#222" font-size="12">4</text>
<text x="155" y="34" text-anchor="middle" fill="#222" font-size="12">54</text>
<text x="20" y="140" fill="#222" font-weight="bold">2. Tube</text>
<ellipse cx="90" cy="165" rx="40" ry="12" fill="none" stroke="#222" stroke-width="2"/>
<line x1="50" y1="165" x2="50" y2="290" stroke="#222" stroke-width="2"/>
<line x1="130" y1="165" x2="130" y2="290" stroke="#222" stroke-width="2"/>
<path d="M50 290 A40 12 0 0 0 130 290" fill="none" stroke="#222" stroke-width="2"/>
<path d="M50 290 A40 12 0 0 1 130 290" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="140" y="232" fill="#222" font-size="12">height h = 54</text>
<text x="140" y="152" fill="#222" font-size="12">circle: 2 pi r = 4</text>
<text x="175" y="262" fill="#222" font-size="12">r = 2 / pi</text>
<text x="175" y="280" fill="#222" font-size="12">V = pi r^2 h = 216 / pi</text>
<text x="420" y="140" fill="#222" font-weight="bold">3. Cube</text>
<polygon points="440,170 540,170 540,270 440,270" fill="#fbe7a1" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<polygon points="440,170 470,150 570,150 540,170" fill="#fbe7a1" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<polygon points="540,170 570,150 570,250 540,270" fill="#fbe7a1" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<text x="490" y="292" text-anchor="middle" fill="#222" font-size="12">side a = 6</text>
<text x="590" y="200" fill="#222" font-size="12">6 a^2 = 216</text>
<text x="590" y="218" fill="#222" font-size="12">V = a^3 = 216</text>
<text x="420" y="316" fill="#222" font-weight="bold">Ratio = (216 / pi) / 216 = 1 / pi</text>
<text x="680" y="40" text-anchor="end" fill="#222" font-size="11">drawings not to scale</text>
</svg>
