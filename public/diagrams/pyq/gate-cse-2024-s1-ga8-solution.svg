<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="sans-serif" font-size="13">
<title>Fat energy is 20 plus 20 plus 5 equals 45 percent of 2000 kcal, which is 900 kcal; at 9 kcal per gram that is 100 grams</title>
<rect x="20" y="40" width="560" height="44" fill="none" stroke="#222" stroke-width="1.5"/>
<rect x="20" y="40" width="196" height="44" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<rect x="216" y="40" width="112" height="44" fill="#f5cdb0" stroke="#222" stroke-width="1.5"/>
<rect x="328" y="40" width="112" height="44" fill="#d4d0d0" stroke="#222" stroke-width="1.5"/>
<rect x="440" y="40" width="112" height="44" fill="#ffc000" stroke="#222" stroke-width="1.5"/>
<rect x="552" y="40" width="28" height="44" fill="#c9d6ee" stroke="#222" stroke-width="1.5"/>
<text x="118" y="68" text-anchor="middle" fill="#222">Carbs 35%</text>
<text x="272" y="68" text-anchor="middle" fill="#222">Protein 20%</text>
<text x="384" y="68" text-anchor="middle" fill="#222">Unsat 20%</text>
<text x="496" y="68" text-anchor="middle" fill="#222">Sat 20%</text>
<text x="566" y="34" text-anchor="middle" fill="#222" font-size="11">Trans 5%</text>
<path d="M328 94 L328 108 L580 108 L580 94" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="454" y="126" text-anchor="middle" fill="#222">Fat = 20 + 20 + 5 = 45% of 2000 kcal = 900 kcal</text>
<text x="320" y="164" text-anchor="middle" fill="#222" font-weight="bold">Grams of fat = 900 kcal / (9 kcal per g) = 100 g</text>
<text x="320" y="190" text-anchor="middle" fill="#222" font-size="12">(Carbohydrate and protein are the other 55% and are not asked.)</text>
</svg>
