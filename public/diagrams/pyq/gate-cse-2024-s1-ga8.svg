<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="13">
<title>Macronutrient energy contribution of a 2000 kcal diet: carbohydrates 35, proteins 20, unsaturated fat 20, saturated fat 20, trans fat 5 percent, with energy densities 4, 4, 9, 9, 9 kcal per gram</title>
<text x="250" y="24" text-anchor="middle" fill="#222" font-size="14">Macronutrient energy contribution (2000 kcal diet)</text>
<text x="580" y="98" text-anchor="middle" fill="#222" font-size="12">Energy density (kcal/g)</text>
<path d="M250,190 L250.0,90.0 A100,100 0 0 1 330.9,248.8 Z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
<line x1="339.1" y1="144.6" x2="353.4" y2="137.3" stroke="#222"/><text x="357.4" y="135.3" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Carbohydrates</text><text x="357.4" y="149.3" text-anchor="start" fill="#222" font-size="12">35%</text>
<path d="M250,190 L330.9,248.8 A100,100 0 0 1 219.1,285.1 Z" fill="#f5cdb0" stroke="#222" stroke-width="1.5"/>
<line x1="280.9" y1="285.1" x2="285.8" y2="300.3" stroke="#222"/><text x="289.8" y="298.3" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Proteins</text><text x="289.8" y="312.3" text-anchor="start" fill="#222" font-size="12">20%</text>
<path d="M250,190 L219.1,285.1 A100,100 0 0 1 150.0,190.0 Z" fill="#d4d0d0" stroke="#222" stroke-width="1.5"/>
<line x1="169.1" y1="248.8" x2="156.2" y2="258.2" stroke="#222"/><text x="152.2" y="256.2" text-anchor="end" fill="#222" font-size="12" font-weight="bold">Unsaturated fat</text><text x="152.2" y="270.2" text-anchor="end" fill="#222" font-size="12">20%</text>
<path d="M250,190 L150.0,190.0 A100,100 0 0 1 219.1,94.9 Z" fill="#ffc000" stroke="#222" stroke-width="1.5"/>
<line x1="169.1" y1="131.2" x2="156.2" y2="121.8" stroke="#222"/><text x="152.2" y="119.8" text-anchor="end" fill="#222" font-size="12" font-weight="bold">Saturated fat</text><text x="152.2" y="133.8" text-anchor="end" fill="#222" font-size="12">20%</text>
<path d="M250,190 L219.1,94.9 A100,100 0 0 1 250.0,90.0 Z" fill="#c9d6ee" stroke="#222" stroke-width="1.5"/>
<line x1="234.4" y1="91.2" x2="231.9" y2="75.4" stroke="#222"/><text x="227.9" y="73.4" text-anchor="end" fill="#222" font-size="12" font-weight="bold">Trans fat</text><text x="227.9" y="87.4" text-anchor="end" fill="#222" font-size="12">5%</text>
<rect x="470" y="110" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="110" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="130" fill="#222" font-size="12" font-weight="bold">Macronutrient</text><text x="645" y="130" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">kcal per g</text>
<rect x="470" y="140" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="140" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="160" fill="#222" font-size="12">Carbohydrates</text><text x="645" y="160" text-anchor="middle" fill="#222" font-size="12">4</text>
<rect x="470" y="170" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="170" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="190" fill="#222" font-size="12">Proteins</text><text x="645" y="190" text-anchor="middle" fill="#222" font-size="12">4</text>
<rect x="470" y="200" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="200" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="220" fill="#222" font-size="12">Unsaturated fat</text><text x="645" y="220" text-anchor="middle" fill="#222" font-size="12">9</text>
<rect x="470" y="230" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="230" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="250" fill="#222" font-size="12">Saturated fat</text><text x="645" y="250" text-anchor="middle" fill="#222" font-size="12">9</text>
<rect x="470" y="260" width="130" height="30" fill="none" stroke="#222"/><rect x="600" y="260" width="90" height="30" fill="none" stroke="#222"/><text x="478" y="280" fill="#222" font-size="12">Trans fat</text><text x="645" y="280" text-anchor="middle" fill="#222" font-size="12">9</text>
<text x="580" y="315" text-anchor="middle" fill="#222" font-size="12">Pie slices run clockwise from the top</text>
</svg>
