<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 180" width="510" height="180" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Rectangle 20 by 8 folded three times ends as 5 by 4</title>
<text x="10" y="20" fill="#222" stroke="none" font-weight="bold">Fold across the current long edge (cm)</text><rect x="10" y="40" width="200" height="80" fill="#eef"/><text x="110" y="84" fill="#222" stroke="none" text-anchor="middle" font-size="11">20 x 8</text><text x="110" y="135" fill="#222" stroke="none" text-anchor="middle">start</text><rect x="230" y="40" width="100" height="80" fill="#eef"/><text x="280" y="84" fill="#222" stroke="none" text-anchor="middle" font-size="11">10 x 8</text><text x="280" y="135" fill="#222" stroke="none" text-anchor="middle">fold 1</text><rect x="350" y="40" width="50" height="80" fill="#eef"/><text x="375" y="84" fill="#222" stroke="none" text-anchor="middle" font-size="11">5 x 8</text><text x="375" y="135" fill="#222" stroke="none" text-anchor="middle">fold 2</text><rect x="420" y="40" width="50" height="40" fill="#eef"/><text x="445" y="64" fill="#222" stroke="none" text-anchor="middle" font-size="11">5 x 4</text><text x="445" y="135" fill="#222" stroke="none" text-anchor="middle">fold 3</text><text x="420" y="100" fill="#222" stroke="none" font-size="11">long edge now 8</text><text x="10" y="165" fill="#222" stroke="none" font-weight="bold">Perimeter = 2 (5 + 4) = 18 cm</text>
</svg>
