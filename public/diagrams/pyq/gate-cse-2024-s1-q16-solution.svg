<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Packet order leaving the browser: DNS, SYN, GET index, GET image</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222" stroke="none"/></marker></defs><text x="80" y="30" fill="#222" stroke="none" text-anchor="middle" >Browser</text><text x="260" y="30" fill="#222" stroke="none" text-anchor="middle" >DNS server</text><text x="440" y="30" fill="#222" stroke="none" text-anchor="middle" >Web server</text><line x1="80" y1="40" x2="80" y2="300"/><line x1="260" y1="40" x2="260" y2="300"/><line x1="440" y1="40" x2="440" y2="300"/><line x1="80" y1="70" x2="254" y2="70" marker-end="url(#a)"/><text x="90" y="64" fill="#222" stroke="none" text-anchor="start" >1. (ii) DNS request</text><line x1="80" y1="130" x2="434" y2="130" marker-end="url(#a)"/><text x="90" y="124" fill="#222" stroke="none" text-anchor="start" >2. (iv) TCP SYN</text><line x1="80" y1="190" x2="434" y2="190" marker-end="url(#a)"/><text x="90" y="184" fill="#222" stroke="none" text-anchor="start" >3. (i) GET index page</text><line x1="80" y1="250" x2="434" y2="250" marker-end="url(#a)"/><text x="90" y="244" fill="#222" stroke="none" text-anchor="start" >4. (iii) GET image object</text></svg>
