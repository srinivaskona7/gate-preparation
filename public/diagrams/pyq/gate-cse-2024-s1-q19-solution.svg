<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 394" font-family="sans-serif" font-size="13">
<title>Five nested calls of fX read 1, 2, 3, 4 and newline going down, then print 4, 3, 2, 1 on the way back up, so the output is 4321</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Input 1234 then newline: reads go down the call stack, prints come back up</text>
<rect x="20" y="46" width="150" height="38" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="61" fill="#222" text-anchor="middle" font-size="12">fX call 1</text><text x="95" y="77" fill="#222" text-anchor="middle" font-size="12">a = '1'</text>
<path d="M95,84 L95,98" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="190" y="68" fill="#222" font-size="12">a != \n: calls fX again</text>
<rect x="20" y="98" width="150" height="38" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="113" fill="#222" text-anchor="middle" font-size="12">fX call 2</text><text x="95" y="129" fill="#222" text-anchor="middle" font-size="12">a = '2'</text>
<path d="M95,136 L95,150" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="190" y="120" fill="#222" font-size="12">a != \n: calls fX again</text>
<rect x="20" y="150" width="150" height="38" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="165" fill="#222" text-anchor="middle" font-size="12">fX call 3</text><text x="95" y="181" fill="#222" text-anchor="middle" font-size="12">a = '3'</text>
<path d="M95,188 L95,202" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="190" y="172" fill="#222" font-size="12">a != \n: calls fX again</text>
<rect x="20" y="202" width="150" height="38" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="217" fill="#222" text-anchor="middle" font-size="12">fX call 4</text><text x="95" y="233" fill="#222" text-anchor="middle" font-size="12">a = '4'</text>
<path d="M95,240 L95,254" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="190" y="224" fill="#222" font-size="12">a != \n: calls fX again</text>
<rect x="20" y="254" width="150" height="38" stroke="#222" stroke-width="1.5" fill="none"/><text x="95" y="269" fill="#222" text-anchor="middle" font-size="12">fX call 5</text><text x="95" y="285" fill="#222" text-anchor="middle" font-size="12">a = '\n'</text>
<text x="190" y="276" fill="#222" font-size="12">a == \n: no recursive call, no print</text>
<text x="20" y="320" fill="#222" font-size="12">After the call returns, each frame runs: if (a != \n) putchar(a)</text>
<text x="20" y="342" fill="#222" font-size="12">Frame order of the prints (innermost first):</text>
<rect x="290" y="326" width="120" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="350" y="344" fill="#222" text-anchor="middle" font-size="12" font-family="monospace">\n: no print</text>
<rect x="430" y="326" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="455" y="344" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">4</text>
<rect x="490" y="326" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="515" y="344" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">3</text>
<rect x="550" y="326" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="575" y="344" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">2</text>
<rect x="610" y="326" width="50" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="635" y="344" fill="#222" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace">1</text>
<text x="20" y="376" fill="#222" font-size="12" font-weight="bold">The output is 4321, option (C): the print comes after the recursive call, so the order reverses.</text>
</svg>
