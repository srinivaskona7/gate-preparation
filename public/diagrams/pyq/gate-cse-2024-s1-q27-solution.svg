<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="sans-serif" font-size="13" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Venn diagram of A and B with region probabilities 0.2, 0.1, 0.4 and outside 0.3</title>
<rect x="10" y="10" width="380" height="200"/>
<circle cx="165" cy="110" r="70"/><circle cx="235" cy="110" r="70"/>
<g fill="#1f2937" stroke="none" text-anchor="middle">
<text x="130" y="31">A = 0.3</text><text x="270" y="31">B = 0.5</text>
<text x="128" y="105">A only</text><text x="128" y="123">0.2</text>
<text x="200" y="105">both</text><text x="200" y="123">0.1</text>
<text x="272" y="105">B only</text><text x="272" y="123">0.4</text>
<text x="105" y="199">outside both: 0.3</text>
</g>
</svg>
