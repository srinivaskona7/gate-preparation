<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="sans-serif" font-size="13">
<title>Timing diagram for Q28: when X rises the NOT output falls one delay later, so Y shows a short pulse of 1; when X falls there is no pulse</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="68" text-anchor="start" fill="#222" font-size="13" font-weight="bold">X</text>
<polyline points="90,70 150,70 150,70 210,70 210,40 270,40 270,40 330,40 330,40 390,40 390,40 450,40 450,70 510,70 510,70 570,70 570,70 630,70" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="20" y="138" text-anchor="start" fill="#222" font-size="13" font-weight="bold">X'</text>
<polyline points="90,110 150,110 150,110 210,110 210,110 270,110 270,140 330,140 330,140 390,140 390,140 450,140 450,140 510,140 510,110 570,110 570,110 630,110" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="20" y="208" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Y</text>
<polyline points="90,210 150,210 150,210 210,210 210,180 270,180 270,210 330,210 330,210 390,210 390,210 450,210 450,210 510,210 510,210 570,210 570,210 630,210" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="210" y1="30" x2="210" y2="230" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="270" y1="30" x2="270" y2="230" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="450" y1="30" x2="450" y2="230" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="510" y1="30" x2="510" y2="230" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="240" y="24" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">glitch window</text>
<text x="480" y="24" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">no overlap</text>
<text x="20" y="262" text-anchor="start" fill="#222" font-size="12" font-weight="normal">X rises: for one NOT delay both AND inputs are 1, so Y pulses to 1 (option C).</text>
<text x="20" y="284" text-anchor="start" fill="#222" font-size="12" font-weight="normal">X falls: X drops first, the NOT output is still 0, so Y stays 0 (option D is false).</text>
<text x="20" y="306" text-anchor="start" fill="#222" font-size="12" font-weight="normal">With zero delay X and X' are never 1 together, so Y is always 0 (A true, B false).</text>
</svg>
