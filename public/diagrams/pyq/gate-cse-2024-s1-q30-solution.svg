<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 482 168" font-family="sans-serif" font-size="11">
<title>Load followed by a dependent add: the loaded value is forwarded from the end of MEM to the start of EX, but one stall cycle remains</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="163" y="32" text-anchor="middle" fill="#222" font-size="10">1</text><text x="209" y="32" text-anchor="middle" fill="#222" font-size="10">2</text><text x="255" y="32" text-anchor="middle" fill="#222" font-size="10">3</text><text x="301" y="32" text-anchor="middle" fill="#222" font-size="10">4</text><text x="347" y="32" text-anchor="middle" fill="#222" font-size="10">5</text><text x="393" y="32" text-anchor="middle" fill="#222" font-size="10">6</text><text x="439" y="32" text-anchor="middle" fill="#222" font-size="10">7</text><text x="132" y="32" text-anchor="end" fill="#222" font-size="10">cycle</text><text x="132" y="62" text-anchor="end" fill="#222" font-size="10">I1: LW R1,0(R2)</text><rect x="140" y="42" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="163" y="62" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="186" y="42" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="209" y="62" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="232" y="42" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="255" y="62" text-anchor="middle" fill="#222" font-size="10">EX</text><rect x="278" y="42" width="46" height="32" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="301" y="62" text-anchor="middle" fill="#222" font-size="10">MEM</text><rect x="324" y="42" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="347" y="62" text-anchor="middle" fill="#222" font-size="10">WB</text><text x="132" y="98" text-anchor="end" fill="#222" font-size="10">I2: ADD R4,R1,R3</text><rect x="186" y="78" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="209" y="98" text-anchor="middle" fill="#222" font-size="10">IF</text><rect x="232" y="78" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="255" y="98" text-anchor="middle" fill="#222" font-size="10">ID</text><rect x="278" y="78" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="301" y="98" text-anchor="middle" fill="#222" font-size="10">stall</text><rect x="324" y="78" width="46" height="32" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="347" y="98" text-anchor="middle" fill="#222" font-size="10">EX</text><rect x="370" y="78" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="393" y="98" text-anchor="middle" fill="#222" font-size="10">MEM</text><rect x="416" y="78" width="46" height="32" fill="none" stroke="#222" stroke-width="1.2"/><text x="439" y="98" text-anchor="middle" fill="#222" font-size="10">WB</text><line x1="305" y1="68" x2="333.20000000000005" y2="80" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><text x="10" y="134" text-anchor="start" fill="#222" font-size="11">The loaded value exists only at the end of cycle 4 (MEM),</text><text x="10" y="152" text-anchor="start" fill="#222" font-size="11">so I2 cannot enter EX before cycle 5: forwarding leaves one stall.</text>
</svg>
