<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>For |A| = |B| = n the union has between n and 2n elements, while A times A has n squared elements; the two sizes can match only for n = 1 and n = 2</title>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="12">Allowed sizes of A union B (segment from n to 2n) against the size of A x A (dot at n^2)</text>
<line x1="60" y1="54" x2="60" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="60" y="266" text-anchor="middle" fill="#222" font-size="11">0</text>
<line x1="104" y1="54" x2="104" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="104" y="266" text-anchor="middle" fill="#222" font-size="11">2</text>
<line x1="148" y1="54" x2="148" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="148" y="266" text-anchor="middle" fill="#222" font-size="11">4</text>
<line x1="192" y1="54" x2="192" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="192" y="266" text-anchor="middle" fill="#222" font-size="11">6</text>
<line x1="236" y1="54" x2="236" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="236" y="266" text-anchor="middle" fill="#222" font-size="11">8</text>
<line x1="280" y1="54" x2="280" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="280" y="266" text-anchor="middle" fill="#222" font-size="11">10</text>
<line x1="324" y1="54" x2="324" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="324" y="266" text-anchor="middle" fill="#222" font-size="11">12</text>
<line x1="368" y1="54" x2="368" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="368" y="266" text-anchor="middle" fill="#222" font-size="11">14</text>
<line x1="412" y1="54" x2="412" y2="248" stroke="#222" stroke-width="0.6" stroke-dasharray="2 4"/>
<text x="412" y="266" text-anchor="middle" fill="#222" font-size="11">16</text>
<text x="20" y="84" text-anchor="start" fill="#222" font-size="13">n = 1</text>
<line x1="82" y1="80" x2="104" y2="80" stroke="#222" stroke-width="5"/>
<circle cx="82" cy="80" r="6" fill="#222" stroke="#222" stroke-width="2"/>
<rect x="92" y="56" width="48" height="15" fill="#fff"/>
<text x="94" y="67" text-anchor="start" fill="#222" font-size="12">n^2 = 1</text>
<text x="500" y="84" text-anchor="start" fill="#222" font-size="13" font-weight="bold">possible</text>
<text x="20" y="130" text-anchor="start" fill="#222" font-size="13">n = 2</text>
<line x1="104" y1="126" x2="148" y2="126" stroke="#222" stroke-width="5"/>
<circle cx="148" cy="126" r="6" fill="#222" stroke="#222" stroke-width="2"/>
<rect x="158" y="102" width="48" height="15" fill="#fff"/>
<text x="160" y="113" text-anchor="start" fill="#222" font-size="12">n^2 = 4</text>
<text x="500" y="130" text-anchor="start" fill="#222" font-size="13" font-weight="bold">possible</text>
<text x="20" y="176" text-anchor="start" fill="#222" font-size="13">n = 3</text>
<line x1="126" y1="172" x2="192" y2="172" stroke="#222" stroke-width="5"/>
<circle cx="258" cy="172" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="268" y="148" width="48" height="15" fill="#fff"/>
<text x="270" y="159" text-anchor="start" fill="#222" font-size="12">n^2 = 9</text>
<text x="500" y="176" text-anchor="start" fill="#222" font-size="13">impossible</text>
<text x="20" y="222" text-anchor="start" fill="#222" font-size="13">n = 4</text>
<line x1="148" y1="218" x2="236" y2="218" stroke="#222" stroke-width="5"/>
<circle cx="412" cy="218" r="6" fill="#fff" stroke="#222" stroke-width="2"/>
<rect x="422" y="194" width="54" height="15" fill="#fff"/>
<text x="424" y="205" text-anchor="start" fill="#222" font-size="12">n^2 = 16</text>
<text x="500" y="222" text-anchor="start" fill="#222" font-size="13">impossible</text>
<text x="20" y="285" text-anchor="start" fill="#222" font-size="12">n^2 &lt;= 2n forces n &lt;= 2. At n = 2 take A, B disjoint (|A u B| = 4); at n = 1 take A = B (|A u B| = 1).</text>
</svg>
