<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" font-family="sans-serif" fill="#1f2937"><title>Collapsing the expression operator by operator: plus, then minus, then star, then slash, to the value 6</title>
<text x="10" y="22" font-size="13" font-weight="bold">Start</text>
<text x="120" y="22" font-size="13" font-family="monospace">3 + 1 + 5 * 2 / 7 + 2 - 4 - 7 - 6 / 2</text>
<text x="10" y="64" font-size="13" font-weight="bold">1. plus (left)</text>
<text x="120" y="64" font-size="13" font-family="monospace">(3+1+5) * 2 / (7+2) - 4 - 7 - 6 / 2</text>
<text x="120" y="82" font-size="12" font-family="monospace">=  9 * 2 / 9 - 4 - 7 - 6 / 2</text>
<text x="10" y="124" font-size="13" font-weight="bold">2. minus (right)</text>
<text x="120" y="124" font-size="13" font-family="monospace">9 * 2 / (9 - (4 - (7 - 6))) / 2</text>
<text x="120" y="142" font-size="12" font-family="monospace">7-6=1, 4-1=3, 9-3=6   gives   9 * 2 / 6 / 2</text>
<text x="10" y="184" font-size="13" font-weight="bold">3. star, slash</text>
<text x="120" y="184" font-size="13" font-family="monospace">(9*2) / (6 / 2) = 18 / 3 = 6</text>
<rect x="116" y="196" width="150" height="26" rx="4" fill="none" stroke="#1f2937" stroke-width="1.4"/>
<text x="191" y="214" font-size="14" font-weight="bold" text-anchor="middle">value = 6</text>
</svg>
