<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="sans-serif" font-size="13">
<title>The 16 spanning trees of the complete graph on vertices A, B, C, D: 4 stars, one centred at each vertex, and 12 paths, one for each ordering of the four vertices up to reversal</title>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">4 stars (centre bold)</text>
<line x1="70" y1="85" x2="70" y2="127" stroke="#222" stroke-width="1.6"/>
<line x1="70" y1="85" x2="33.6" y2="64" stroke="#222" stroke-width="1.6"/>
<line x1="70" y1="85" x2="106.4" y2="64" stroke="#222" stroke-width="1.6"/>
<circle cx="70" cy="127" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="70" y="130.9" text-anchor="middle" fill="#222" font-size="11">B</text>
<circle cx="33.6" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="33.6" y="67.9" text-anchor="middle" fill="#222" font-size="11">C</text>
<circle cx="106.4" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="106.4" y="67.9" text-anchor="middle" fill="#222" font-size="11">D</text>
<circle cx="70" cy="85" r="14" fill="#fff" stroke="#222" stroke-width="3.4"/>
<text x="70" y="89.2" text-anchor="middle" fill="#222" font-size="12">A</text>
<line x1="200" y1="85" x2="200" y2="127" stroke="#222" stroke-width="1.6"/>
<line x1="200" y1="85" x2="163.6" y2="64" stroke="#222" stroke-width="1.6"/>
<line x1="200" y1="85" x2="236.4" y2="64" stroke="#222" stroke-width="1.6"/>
<circle cx="200" cy="127" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="200" y="130.9" text-anchor="middle" fill="#222" font-size="11">A</text>
<circle cx="163.6" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="163.6" y="67.9" text-anchor="middle" fill="#222" font-size="11">C</text>
<circle cx="236.4" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="236.4" y="67.9" text-anchor="middle" fill="#222" font-size="11">D</text>
<circle cx="200" cy="85" r="14" fill="#fff" stroke="#222" stroke-width="3.4"/>
<text x="200" y="89.2" text-anchor="middle" fill="#222" font-size="12">B</text>
<line x1="330" y1="85" x2="330" y2="127" stroke="#222" stroke-width="1.6"/>
<line x1="330" y1="85" x2="293.6" y2="64" stroke="#222" stroke-width="1.6"/>
<line x1="330" y1="85" x2="366.4" y2="64" stroke="#222" stroke-width="1.6"/>
<circle cx="330" cy="127" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="330" y="130.9" text-anchor="middle" fill="#222" font-size="11">A</text>
<circle cx="293.6" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="293.6" y="67.9" text-anchor="middle" fill="#222" font-size="11">B</text>
<circle cx="366.4" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="366.4" y="67.9" text-anchor="middle" fill="#222" font-size="11">D</text>
<circle cx="330" cy="85" r="14" fill="#fff" stroke="#222" stroke-width="3.4"/>
<text x="330" y="89.2" text-anchor="middle" fill="#222" font-size="12">C</text>
<line x1="460" y1="85" x2="460" y2="127" stroke="#222" stroke-width="1.6"/>
<line x1="460" y1="85" x2="423.6" y2="64" stroke="#222" stroke-width="1.6"/>
<line x1="460" y1="85" x2="496.4" y2="64" stroke="#222" stroke-width="1.6"/>
<circle cx="460" cy="127" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="460" y="130.9" text-anchor="middle" fill="#222" font-size="11">A</text>
<circle cx="423.6" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="423.6" y="67.9" text-anchor="middle" fill="#222" font-size="11">B</text>
<circle cx="496.4" cy="64" r="12" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="496.4" y="67.9" text-anchor="middle" fill="#222" font-size="11">C</text>
<circle cx="460" cy="85" r="14" fill="#fff" stroke="#222" stroke-width="3.4"/>
<text x="460" y="89.2" text-anchor="middle" fill="#222" font-size="12">D</text>
<text x="20" y="175" text-anchor="start" fill="#222" font-size="13" font-weight="bold">12 paths: 4!/2 orderings of the vertices, a path and its reverse being the same tree</text>
<text x="30" y="205" text-anchor="start" fill="#222" font-size="14">A-B-C-D</text>
<text x="190" y="205" text-anchor="start" fill="#222" font-size="14">A-B-D-C</text>
<text x="350" y="205" text-anchor="start" fill="#222" font-size="14">A-C-B-D</text>
<text x="510" y="205" text-anchor="start" fill="#222" font-size="14">A-C-D-B</text>
<text x="30" y="233" text-anchor="start" fill="#222" font-size="14">A-D-B-C</text>
<text x="190" y="233" text-anchor="start" fill="#222" font-size="14">A-D-C-B</text>
<text x="350" y="233" text-anchor="start" fill="#222" font-size="14">B-A-C-D</text>
<text x="510" y="233" text-anchor="start" fill="#222" font-size="14">B-A-D-C</text>
<text x="30" y="261" text-anchor="start" fill="#222" font-size="14">B-C-A-D</text>
<text x="190" y="261" text-anchor="start" fill="#222" font-size="14">B-D-A-C</text>
<text x="350" y="261" text-anchor="start" fill="#222" font-size="14">C-A-B-D</text>
<text x="510" y="261" text-anchor="start" fill="#222" font-size="14">C-B-A-D</text>
<text x="20" y="320" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Total 4 + 12 = 16 = 4^(4-2), which is the Cayley formula n^(n-2) for n = 4.</text>
<text x="20" y="345" text-anchor="start" fill="#222" font-size="12">Each tree has 3 edges out of the 6 edges of K4 and no cycle; every other 3-edge choice contains a triangle.</text>
</svg>
