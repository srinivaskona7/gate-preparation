<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" font-size="12">
<title>Pipelined chunks over P to Q to R: the last chunk finishes at Q at 8.000 s and at R at 8.008 s</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="80" y="45" width="560" height="30"/><rect x="88" y="115" width="560" height="30" stroke-dasharray="4 3"/>
<rect x="640" y="45" width="0.6" height="30"/><rect x="648" y="115" width="0.6" height="30"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="40" y="65">P to Q</text><text x="40" y="135">Q to R</text>
<text x="360" y="64">chunks 1 to 1000, back to back, 8 ms each</text>
<text x="368" y="134">same chunks, each starts 8 ms later</text>
<text x="80" y="35">0</text><text x="640" y="35">8.000 s</text><text x="88" y="165">8 ms</text><text x="650" y="165">8.008 s</text>
<text x="360" y="200">Chunk: 1000 bytes = 8000 bits; at 10^6 bit/s it takes 8 ms</text>
<text x="360" y="222">R has everything at 8.000 + 0.008 = 8.008 s. Answer: (B)</text>
</g>
</svg>
