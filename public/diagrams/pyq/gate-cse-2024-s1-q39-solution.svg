<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 552" font-family="sans-serif">
<title>Seven basic blocks of the pseudo-code in GATE 2024 CS1 Q39, the largest has 6 instructions</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="80" y="20" width="450" height="54" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="34" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B1</text>
<text x="95" y="42" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L1: t1 = -1</text>
<text x="95" y="62" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L2: t2 = 0</text>
<rect x="80" y="88" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="102" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B2</text>
<text x="95" y="110" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L3: t3 = 0</text>
<rect x="80" y="136" width="450" height="134" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="150" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B3</text>
<text x="95" y="158" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L4: t4 = 4 * t3</text>
<text x="95" y="178" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L5: t5 = 4 * t2</text>
<text x="95" y="198" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L6: t6 = t5 * M</text>
<text x="95" y="218" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L7: t7 = t4 + t6</text>
<text x="95" y="238" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L8: t8 = a[t7]</text>
<text x="95" y="258" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L9: if t8 &lt;= max goto L11</text>
<rect x="80" y="284" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="298" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B4</text>
<text x="95" y="306" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L10: t1 = t8</text>
<rect x="80" y="332" width="450" height="54" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="346" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B5</text>
<text x="95" y="354" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L11: t3 = t3 + 1</text>
<text x="95" y="374" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L12: if t3 &lt; M goto L4</text>
<rect x="80" y="400" width="450" height="54" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="414" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B6</text>
<text x="95" y="422" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L13: t2 = t2 + 1</text>
<text x="95" y="442" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L14: if t2 &lt; N goto L3</text>
<rect x="80" y="468" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="482" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B7</text>
<text x="95" y="490" font-size="13" text-anchor="start" fill="#222" font-family="monospace">L15: max = t1</text>
<text x="10" y="540" font-size="12" text-anchor="start" fill="#b3261e">Leaders: L1, L3, L4, L11 (jump targets), L10, L13, L15 (follow a jump). Sizes 2, 1, 6, 1, 2, 2, 1.</text>
</svg>
