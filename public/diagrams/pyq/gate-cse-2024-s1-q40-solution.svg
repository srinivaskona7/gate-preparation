<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="sans-serif" font-size="13">
<title>Six interleavings of T1 (statements 1, 2) and T2 (statements 3, 4) with the values of a and b after each step; only three final pairs occur</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" text-anchor="start" fill="#222" font-size="12">1: a = a+1;  2: b = b+1;  3: b = 2*b;  4: a = 2*a.  Start a = 1, b = 1.  Inside a thread the order is fixed: 1 before 2, 3 before 4.</text>
<text x="20" y="62" text-anchor="start" fill="#222" font-size="12">order 1 2 3 4</text>
<rect x="130" y="40" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="55.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="180.0" y="70.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=1</text>
<line x1="230.0" y1="59.0" x2="245.0" y2="59.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="40" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="55.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="295.0" y="70.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="59.0" x2="360.0" y2="59.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="40" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="55.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="410.0" y="70.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=4</text>
<line x1="460.0" y1="59.0" x2="475.0" y2="59.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="40" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="55.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="525.0" y="70.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=4</text>
<text x="610" y="64" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (4, 4)</text>
<text x="20" y="110" text-anchor="start" fill="#222" font-size="12">order 1 3 2 4</text>
<rect x="130" y="88" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="103.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="180.0" y="118.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=1</text>
<line x1="230.0" y1="107.0" x2="245.0" y2="107.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="88" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="103.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="295.0" y="118.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="107.0" x2="360.0" y2="107.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="88" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="103.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="410.0" y="118.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=3</text>
<line x1="460.0" y1="107.0" x2="475.0" y2="107.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="88" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="103.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="525.0" y="118.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=3</text>
<text x="610" y="112" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (4, 3)</text>
<text x="20" y="158" text-anchor="start" fill="#222" font-size="12">order 1 3 4 2</text>
<rect x="130" y="136" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="151.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="180.0" y="166.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=1</text>
<line x1="230.0" y1="155.0" x2="245.0" y2="155.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="136" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="151.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="295.0" y="166.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="155.0" x2="360.0" y2="155.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="136" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="151.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="410.0" y="166.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=2</text>
<line x1="460.0" y1="155.0" x2="475.0" y2="155.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="136" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="151.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="525.0" y="166.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=3</text>
<text x="610" y="160" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (4, 3)</text>
<text x="20" y="206" text-anchor="start" fill="#222" font-size="12">order 3 1 2 4</text>
<rect x="130" y="184" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="199.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="180.0" y="214.5" text-anchor="middle" fill="#222" font-size="11">a=1, b=2</text>
<line x1="230.0" y1="203.0" x2="245.0" y2="203.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="184" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="199.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="295.0" y="214.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="203.0" x2="360.0" y2="203.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="184" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="199.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="410.0" y="214.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=3</text>
<line x1="460.0" y1="203.0" x2="475.0" y2="203.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="184" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="199.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="525.0" y="214.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=3</text>
<text x="610" y="208" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (4, 3)</text>
<text x="20" y="254" text-anchor="start" fill="#222" font-size="12">order 3 1 4 2</text>
<rect x="130" y="232" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="247.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="180.0" y="262.5" text-anchor="middle" fill="#222" font-size="11">a=1, b=2</text>
<line x1="230.0" y1="251.0" x2="245.0" y2="251.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="232" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="247.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="295.0" y="262.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="251.0" x2="360.0" y2="251.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="232" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="247.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="410.0" y="262.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=2</text>
<line x1="460.0" y1="251.0" x2="475.0" y2="251.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="232" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="247.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="525.0" y="262.5" text-anchor="middle" fill="#222" font-size="11">a=4, b=3</text>
<text x="610" y="256" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (4, 3)</text>
<text x="20" y="302" text-anchor="start" fill="#222" font-size="12">order 3 4 1 2</text>
<rect x="130" y="280" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="180.0" y="295.5" text-anchor="middle" fill="#222" font-size="11">step 3</text>
<text x="180.0" y="310.5" text-anchor="middle" fill="#222" font-size="11">a=1, b=2</text>
<line x1="230.0" y1="299.0" x2="245.0" y2="299.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="245" y="280" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="295.0" y="295.5" text-anchor="middle" fill="#222" font-size="11">step 4</text>
<text x="295.0" y="310.5" text-anchor="middle" fill="#222" font-size="11">a=2, b=2</text>
<line x1="345.0" y1="299.0" x2="360.0" y2="299.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="360" y="280" width="100" height="38" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="410.0" y="295.5" text-anchor="middle" fill="#222" font-size="11">step 1</text>
<text x="410.0" y="310.5" text-anchor="middle" fill="#222" font-size="11">a=3, b=2</text>
<line x1="460.0" y1="299.0" x2="475.0" y2="299.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="475" y="280" width="100" height="38" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="525.0" y="295.5" text-anchor="middle" fill="#222" font-size="11">step 2</text>
<text x="525.0" y="310.5" text-anchor="middle" fill="#222" font-size="11">a=3, b=3</text>
<text x="610" y="304" text-anchor="start" fill="#222" font-size="12" font-weight="bold">final (3, 3)</text>
<text x="20" y="336" text-anchor="start" fill="#222" font-size="11">Final pairs: (4,4), (4,3), (3,3). (3,4) needs step 2 before step 3 and step 4 before step 1, which contradicts 1 before 2 and 3 before 4.</text>
</svg>
