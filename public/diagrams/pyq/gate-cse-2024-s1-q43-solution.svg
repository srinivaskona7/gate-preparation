<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" font-family="sans-serif" font-size="13">
<title>Array positions 1 to 105 of a min-heap with 105 elements: positions 1 to 52 are internal nodes and positions 53 to 105 are the 53 leaves, and the maximum must sit on a leaf, so k has 53 possible values</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="50" y="60" width="316.952" height="36" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="366.952" y="60" width="323.048" height="36" rx="0" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="208.476" y="83" text-anchor="middle" fill="#222" font-size="12">internal nodes 1 to 52</text>
<text x="528.476" y="83" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">leaves 53 to 105</text>
<text x="50" y="50" text-anchor="middle" fill="#222" font-size="11">1</text>
<text x="366.952" y="50" text-anchor="middle" fill="#222" font-size="11">52|53</text>
<text x="690" y="50" text-anchor="middle" fill="#222" font-size="11">105</text>
<text x="370" y="28" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Array of the heap, positions 1 to 105</text>
<text x="50" y="128" text-anchor="start" fill="#222" font-size="12">Last internal node = floor(105 / 2) = 52 (children 104 and 105).</text>
<text x="50" y="150" text-anchor="start" fill="#222" font-size="12">A node that has a child is smaller than that child, so it is not the maximum.</text>
<text x="50" y="172" text-anchor="start" fill="#222" font-size="12">The maximum is therefore a leaf: k in {53, ..., 105}, which is 105 - 52 = 53 values.</text>
<text x="50" y="204" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Every leaf position is possible: put 105 there, fill the rest in heap order.</text>
</svg>
