<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" font-family="sans-serif">
<title>A tree that is both a DFS and a BFS tree can still have back and cross edges but no forward edge</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#222"/></marker></defs>
<line x1="187.50609904891152" y1="49.99512076087079" x2="112.49390095108849" y2="110.00487923912921" stroke="#222" stroke-width="3" marker-end="url(#ar)"/>
<line x1="212.49390095108848" y1="49.99512076087079" x2="287.5060990489115" y2="110.00487923912921" stroke="#222" stroke-width="3" marker-end="url(#ar)"/>
<line x1="100.0" y1="136.0" x2="100.0" y2="184.0" stroke="#222" stroke-width="3" marker-end="url(#ar)"/>
<path d="M84 106 Q40 60 184 42" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="284.0" y1="120.0" x2="116.0" y2="120.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="191.52001695994912" y1="53.567972864081405" x2="108.47998304005088" y2="186.4320271359186" stroke="#222" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#ar)"/>
<text x="171" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">X</text>
<circle cx="200" cy="40" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="200" y="44" text-anchor="middle" font-size="13" fill="#222">v</text>
<circle cx="100" cy="120" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="100" y="124" text-anchor="middle" font-size="13" fill="#222">a</text>
<circle cx="300" cy="120" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="300" y="124" text-anchor="middle" font-size="13" fill="#222">b</text>
<circle cx="100" cy="200" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="100" y="204" text-anchor="middle" font-size="13" fill="#222">c</text>
<text x="20" y="50" text-anchor="start" font-size="12" fill="#222">back edge a to v</text>
<text x="250" y="70" text-anchor="start" font-size="12" fill="#222">tree edges (thick)</text>
<text x="300" y="150" text-anchor="middle" font-size="12" fill="#222">cross edge b to a</text>
<text x="215" y="195" text-anchor="start" font-size="12" fill="#222">forward edge v to c: impossible</text>
<text x="215" y="213" text-anchor="start" font-size="12" fill="#222">(it would put c at BFS depth 1,</text>
<text x="215" y="229" text-anchor="start" font-size="12" fill="#222">but the tree puts c at depth 2)</text>
</svg>
