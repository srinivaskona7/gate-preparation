<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" font-family="sans-serif" font-size="13">
<title>Precedence graph of the read-write schedule S over T1, T2, T3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<path d="M212,60 Q255,60 292,60" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/><text x="255" y="54" text-anchor="middle" font-size="12" fill="#111">y</text><circle cx="60" cy="60" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><circle cx="190" cy="60" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="190" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T3</text><circle cx="320" cy="60" r="22" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="320" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><text x="220" y="120" text-anchor="middle" font-size="12" fill="#111">T1 conflicts with nobody (it alone touches z), so it may sit anywhere.</text><text x="220" y="140" text-anchor="middle" font-size="12" fill="#111">Valid serial orders: T1 T3 T2, T3 T1 T2, T3 T2 T1 (options B, C, D)</text>
