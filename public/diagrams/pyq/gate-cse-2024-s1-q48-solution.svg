<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 314" font-family="sans-serif" font-size="13">
<title>Closed form x after i passes is 2^i times x plus y, minus y; the table compares f(20,10), f(20,20) and f(10,20) with 2^20 and 2^10</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">x = x + x + y adds y after doubling: x + y doubles every pass</text>
<text x="20" y="46" fill="#222" font-size="13" font-family="monospace">After i passes: x_i = 2^i (x_0 + y) - y</text>
<text x="20" y="76" fill="#222" font-size="12" font-weight="bold">f(20, 10): x after pass 0 to 10</text>
<rect x="20" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="49" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">20</text>
<rect x="80" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="109" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">50</text>
<rect x="140" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="169" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">110</text>
<rect x="200" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="229" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">230</text>
<rect x="260" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="289" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">470</text>
<rect x="320" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="349" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">950</text>
<rect x="380" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="409" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">1910</text>
<rect x="440" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="469" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">3830</text>
<rect x="500" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="529" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">7670</text>
<rect x="560" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="589" y="104" fill="#222" text-anchor="middle" font-size="11" font-family="monospace">15350</text>
<rect x="620" y="86" width="58" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="649" y="104" fill="#222" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace">30710</text>
<rect x="20" y="140" width="190" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="115" y="158" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">inputs (x, y)</text>
<rect x="210" y="140" width="230" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="325" y="158" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">return value</text>
<rect x="440" y="140" width="130" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="505" y="158" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">2^20 = 1048576</text>
<rect x="570" y="140" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="625" y="158" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">statement</text>
<rect x="20" y="168" width="190" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="115" y="186" fill="#222" text-anchor="middle" font-size="12">(20, 10)</text>
<rect x="210" y="168" width="230" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="325" y="186" fill="#222" text-anchor="middle" font-size="12">2^10 * 30 - 10 = 30710</text>
<rect x="440" y="168" width="130" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="505" y="186" fill="#222" text-anchor="middle" font-size="12">30710 &lt; 2^20</text>
<rect x="570" y="168" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="625" y="186" fill="#222" text-anchor="middle" font-size="12">A false, C false</text>
<rect x="20" y="196" width="190" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="115" y="214" fill="#222" text-anchor="middle" font-size="12">(20, 20)</text>
<rect x="210" y="196" width="230" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="325" y="214" fill="#222" text-anchor="middle" font-size="12">2^20 * 40 - 20 = 41943020</text>
<rect x="440" y="196" width="130" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="505" y="214" fill="#222" text-anchor="middle" font-size="12">&gt; 2^20</text>
<rect x="570" y="196" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="625" y="214" fill="#222" text-anchor="middle" font-size="12">B true</text>
<rect x="20" y="224" width="190" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="115" y="242" fill="#222" text-anchor="middle" font-size="12">(10, 20)</text>
<rect x="210" y="224" width="230" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="325" y="242" fill="#222" text-anchor="middle" font-size="12">2^20 * 30 - 20 = 31457260</text>
<rect x="440" y="224" width="130" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="505" y="242" fill="#222" text-anchor="middle" font-size="12">&gt; 2^20</text>
<rect x="570" y="224" width="110" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="625" y="242" fill="#222" text-anchor="middle" font-size="12">D true</text>
<text x="20" y="276" fill="#222" font-size="12">30710 is also above 2^10 = 1024, so C is false. Both big values fit in a 32-bit int (below 2^31).</text>
<text x="20" y="298" fill="#222" font-size="12" font-weight="bold">True statements: B and D.</text>
</svg>
