<text x="235" y="320" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Merged state = (n0 - n1) mod 3:  1 is 0,  2,5 is 1,  3,4 is 2</text>
<text x="235" y="342" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0 adds 1, 1 subtracts 1; accept when the difference is 0 mod 3</text>
