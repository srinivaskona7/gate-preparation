<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif" font-size="13">
<title>Counterexamples: the 5-cycle has chromatic number 3 but contains no triangle, which defeats statement A; the complete graph K4 has chromatic number 4 and every vertex has degree 3, which defeats statement D</title>
<text x="150" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C5: chromatic number 3</text>
<line x1="150" y1="50" x2="216.6" y2="98.4" stroke="#222" stroke-width="1.8"/>
<line x1="216.6" y1="98.4" x2="191.1" y2="176.6" stroke="#222" stroke-width="1.8"/>
<line x1="191.1" y1="176.6" x2="108.9" y2="176.6" stroke="#222" stroke-width="1.8"/>
<line x1="108.9" y1="176.6" x2="83.4" y2="98.4" stroke="#222" stroke-width="1.8"/>
<line x1="83.4" y1="98.4" x2="150" y2="50" stroke="#222" stroke-width="1.8"/>
<circle cx="150" cy="50" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="150" y="54.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="216.6" cy="98.4" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="216.6" y="102.9" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="191.1" cy="176.6" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="191.1" y="181.2" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="108.9" cy="176.6" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="108.9" y="181.2" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="83.4" cy="98.4" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="83.4" y="102.9" text-anchor="middle" fill="#222" font-size="13">3</text>
<text x="150" y="218" text-anchor="middle" fill="#222" font-size="12">No triangle, so no K3 inside: A fails</text>
<text x="150" y="236" text-anchor="middle" fill="#222" font-size="12">Two colours cannot colour an odd cycle</text>
<text x="500" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">K4: chromatic number 4</text>
<line x1="450" y1="70" x2="550" y2="70" stroke="#222" stroke-width="1.5"/>
<line x1="450" y1="70" x2="550" y2="170" stroke="#222" stroke-width="1.5"/>
<line x1="450" y1="70" x2="450" y2="170" stroke="#222" stroke-width="1.5"/>
<line x1="550" y1="70" x2="550" y2="170" stroke="#222" stroke-width="1.5"/>
<line x1="550" y1="70" x2="450" y2="170" stroke="#222" stroke-width="1.5"/>
<line x1="550" y1="170" x2="450" y2="170" stroke="#222" stroke-width="1.5"/>
<circle cx="450" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="450" y="74.6" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="550" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="550" y="74.6" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="550" cy="170" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="550" y="174.6" text-anchor="middle" fill="#222" font-size="13">3</text>
<circle cx="450" cy="170" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="450" y="174.6" text-anchor="middle" fill="#222" font-size="13">4</text>
<text x="500" y="218" text-anchor="middle" fill="#222" font-size="12">Largest degree 3 &lt; k = 4: D fails</text>
<text x="500" y="236" text-anchor="middle" fill="#222" font-size="12">Edges 6 = k(k-1)/2, the minimum C allows</text>
<text x="20" y="275" text-anchor="start" fill="#222" font-size="12">B: the k colour classes cover n vertices, so one class has at least n/k vertices, and a colour class is independent.</text>
</svg>
