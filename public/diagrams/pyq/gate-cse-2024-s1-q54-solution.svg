<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>A cylinder is the same track on each of the 32 surfaces: 2^27 bytes, so a 2^39 byte disk has 2^12 = 4096 cylinders</title>
<g fill="none" stroke-width="1.5">
<ellipse cx="130" cy="60" rx="100" ry="22"/><ellipse cx="130" cy="60" rx="60" ry="13" stroke-dasharray="4 3"/>
<ellipse cx="130" cy="110" rx="100" ry="22"/><ellipse cx="130" cy="110" rx="60" ry="13" stroke-dasharray="4 3"/>
<ellipse cx="130" cy="190" rx="100" ry="22"/><ellipse cx="130" cy="190" rx="60" ry="13" stroke-dasharray="4 3"/>
<path d="M190 60 V190 M70 60 V190" stroke-dasharray="2 3"/>
</g>
<g stroke="none" text-anchor="middle"><text x="130" y="64" font-size="11">surface 1</text><text x="130" y="114" font-size="11">surface 2</text><text x="130" y="194" font-size="11">surface 32</text><text x="130" y="154">...</text></g>
<g stroke="none">
<text x="260" y="40" font-weight="bold">One track: 4096 sectors x 1024 B = 2^12 x 2^10 = 2^22 B</text>
<text x="260" y="72">One cylinder: same track on 32 surfaces = 2^5 x 2^22 = 2^27 B</text>
<text x="260" y="104">Disk: 512 GB = 2^9 x 2^30 = 2^39 B</text>
<text x="260" y="136">Cylinders = tracks per surface = 2^39 / 2^27 = 2^12</text>
<text x="260" y="176" font-weight="bold">Answer: 4096</text>
<text x="260" y="206">2^39 / 2^22 = 131072 counts all tracks of all surfaces together.</text>
</g>
</svg>
