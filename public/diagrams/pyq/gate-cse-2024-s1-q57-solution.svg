<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 355" font-family="sans-serif" font-size="13">
<title>Doubling of processes over the three iterations: 1, 2 and 4 processes fork, giving 2, 4 and 8 prints, 14 in total</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="354" y="50" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="390" y="68" text-anchor="middle" fill="#222" font-size="12">x = 3</text>
<text x="390" y="84" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="194" y="150" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="230" y="168" text-anchor="middle" fill="#222" font-size="12">x = 2</text>
<text x="230" y="184" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="514" y="150" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="550" y="168" text-anchor="middle" fill="#222" font-size="12">x = 2</text>
<text x="550" y="184" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="114" y="250" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="150" y="268" text-anchor="middle" fill="#222" font-size="12">x = 1</text>
<text x="150" y="284" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="274" y="250" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="310" y="268" text-anchor="middle" fill="#222" font-size="12">x = 1</text>
<text x="310" y="284" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="434" y="250" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="470" y="268" text-anchor="middle" fill="#222" font-size="12">x = 1</text>
<text x="470" y="284" text-anchor="middle" fill="#222" font-size="11">forks</text>
<rect x="594" y="250" width="72" height="40" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="630" y="268" text-anchor="middle" fill="#222" font-size="12">x = 1</text>
<text x="630" y="284" text-anchor="middle" fill="#222" font-size="11">forks</text>
<path d="M376,90 L238,150" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M404,90 L542,150" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M216,190 L158,250" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M244,190 L302,250" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M536,190 L478,250" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M564,190 L622,250" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="8" y="66" text-anchor="start" fill="#222" font-size="13" font-weight="bold">x = 3</text>
<text x="892" y="66" text-anchor="end" fill="#222" font-size="12">1 process x 2 prints</text>
<text x="892" y="84" text-anchor="end" fill="#222" font-size="12" font-weight="bold">= 2 prints</text>
<text x="8" y="166" text-anchor="start" fill="#222" font-size="13" font-weight="bold">x = 2</text>
<text x="892" y="166" text-anchor="end" fill="#222" font-size="12">2 processes x 2 prints</text>
<text x="892" y="184" text-anchor="end" fill="#222" font-size="12" font-weight="bold">= 4 prints</text>
<text x="8" y="266" text-anchor="start" fill="#222" font-size="13" font-weight="bold">x = 1</text>
<text x="892" y="266" text-anchor="end" fill="#222" font-size="12">4 processes x 2 prints</text>
<text x="892" y="284" text-anchor="end" fill="#222" font-size="12" font-weight="bold">= 8 prints</text>
<text x="450" y="24" text-anchor="middle" fill="#222" font-size="12">Left arrow: parent after the fork. Right arrow: child. Both print, then continue with x - 1.</text>
<text x="450" y="340" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Prints per iteration: 2 + 4 + 8 = 14. The loop ends when x reaches 0.</text>
</svg>
