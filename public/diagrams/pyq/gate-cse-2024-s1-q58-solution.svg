<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 318" font-family="sans-serif" font-size="13">
<title>Last octet 0 to 255 in 10.1.1.x: R1 owns all, R3 owns 64-127, R2 owns 128-255, R4 owns 192-255</title>
<text x="10" y="60" text-anchor="start" fill="#222" font-size="12">10.1.1.0/24 : R1</text>
<rect x="170.0" y="40" width="602.4" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">10.1.1.64/26 : R3</text>
<rect x="320.6" y="82" width="150.6" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="144" text-anchor="start" fill="#222" font-size="12">10.1.1.128/25 : R2</text>
<rect x="471.2" y="124" width="301.2" height="30" fill="#dde" stroke="#222" stroke-width="2"/>
<text x="10" y="186" text-anchor="start" fill="#222" font-size="12">10.1.1.192/26 : R4</text>
<rect x="621.8" y="166" width="150.6" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="208.8" y1="30" x2="208.8" y2="208" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="208.8" y="224" text-anchor="middle" fill="#222" font-size="12">.16</text>
<line x1="340.6" y1="30" x2="340.6" y2="208" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="340.6" y="224" text-anchor="middle" fill="#222" font-size="12">.72</text>
<line x1="481.8" y1="30" x2="481.8" y2="208" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="481.8" y="224" text-anchor="middle" fill="#222" font-size="12">.132</text>
<line x1="620.6" y1="30" x2="620.6" y2="208" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="620.6" y="224" text-anchor="middle" fill="#222" font-size="12">.191</text>
<line x1="653.5" y1="30" x2="653.5" y2="208" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="653.5" y="224" text-anchor="middle" fill="#222" font-size="12">.205</text>
<text x="170" y="244" text-anchor="start" fill="#222" font-size="12">Last octet of each host</text>
<text x="10" y="268" text-anchor="start" fill="#222" font-size="12">.16 goes R1, .72 goes R3, .132 goes R2, .191 goes R2 (below 192, so R4 misses it), .205 goes R4.</text>
<text x="10" y="288" text-anchor="start" fill="#222" font-size="12">R2 carries .132 and .191: 2 hosts x 20 packets = 40.</text>
</svg>
