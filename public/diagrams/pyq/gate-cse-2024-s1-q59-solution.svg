<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="sans-serif" font-size="13">
<title>A Chomsky normal form derivation tree for a string of length 4 uses 3 binary rules and 4 terminal rules, 7 steps in all</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="250" y="40" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<text x="140" y="110" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">A</text>
<line x1="250" y1="46" x2="140" y2="95" stroke="#222" stroke-width="1.4"/>
<text x="360" y="110" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">B</text>
<line x1="250" y1="46" x2="360" y2="95" stroke="#222" stroke-width="1.4"/>
<text x="80" y="180" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">C</text>
<line x1="140" y1="116" x2="80" y2="165" stroke="#222" stroke-width="1.4"/>
<text x="200" y="180" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">D</text>
<line x1="140" y1="116" x2="200" y2="165" stroke="#222" stroke-width="1.4"/>
<text x="300" y="180" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">E</text>
<line x1="360" y1="116" x2="300" y2="165" stroke="#222" stroke-width="1.4"/>
<text x="420" y="180" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">F</text>
<line x1="360" y1="116" x2="420" y2="165" stroke="#222" stroke-width="1.4"/>
<text x="80" y="250" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">a</text>
<line x1="80" y1="186" x2="80" y2="235" stroke="#222" stroke-width="1.4"/>
<text x="200" y="250" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="200" y1="186" x2="200" y2="235" stroke="#222" stroke-width="1.4"/>
<text x="300" y="250" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">c</text>
<line x1="300" y1="186" x2="300" y2="235" stroke="#222" stroke-width="1.4"/>
<text x="420" y="250" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">c</text>
<line x1="420" y1="186" x2="420" y2="235" stroke="#222" stroke-width="1.4"/>
<text x="268" y="38" text-anchor="start" font-size="12" fill="#222" font-weight="bold">① S → A B</text>
<text x="160" y="108" text-anchor="start" font-size="12" fill="#222" font-weight="bold">② A → C D</text>
<text x="378" y="108" text-anchor="start" font-size="12" fill="#222" font-weight="bold">③ B → E F</text>
<text x="96" y="178" text-anchor="start" font-size="12" fill="#222" font-weight="bold">④ C → a</text>
<text x="214" y="178" text-anchor="start" font-size="12" fill="#222" font-weight="bold">⑤ D → b</text>
<text x="316" y="178" text-anchor="start" font-size="12" fill="#222" font-weight="bold">⑥ E → c</text>
<text x="436" y="178" text-anchor="start" font-size="12" fill="#222" font-weight="bold">⑦ F → c</text>
<line x1="20" y1="290" x2="640" y2="290" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="316" text-anchor="start" font-size="13" fill="#222">Length n = 4:  n − 1 = 3 rules of the form X → YZ  (they join n leaves into one tree)</text>
<text x="20" y="338" text-anchor="start" font-size="13" fill="#222">and n = 4 rules of the form X → a  (one per leaf)</text>
<text x="20" y="366" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Total  2n − 1 = 7 steps for any parse tree shape.   For w = a³⁰ b³⁰ c³⁰:  n = 90,  2·90 − 1 = 179.</text>
<text x="20" y="392" text-anchor="start" font-size="12" fill="#222">The 10 variables and the particular rules do not change the count.</text>
</svg>
