<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="sans-serif" font-size="13">
<title>Q64 worked: with X1 X2 X3 X4 = 1 1 0 0, Q1 is always 1 and Q2 is always 0, so Y equals NOT C</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="170" y="30" width="70" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="205" y="74" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">M1</text>
<line x1="130" y1="56.66666666666667" x2="170" y2="56.66666666666667" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="124" y="60.66666666666667" text-anchor="end" fill="#222" font-size="13" font-weight="normal">X1</text>
<text x="174" y="60.66666666666667" text-anchor="start" fill="#222" font-size="11" font-weight="normal">0</text>
<line x1="130" y1="83.33333333333334" x2="170" y2="83.33333333333334" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="124" y="87.33333333333334" text-anchor="end" fill="#222" font-size="13" font-weight="normal">X2</text>
<text x="174" y="87.33333333333334" text-anchor="start" fill="#222" font-size="11" font-weight="normal">1</text>
<line x1="205" y1="140" x2="205" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="205" y="154" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">A</text>
<rect x="170" y="200" width="70" height="80" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="205" y="244" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">M2</text>
<line x1="130" y1="226.66666666666666" x2="170" y2="226.66666666666666" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="124" y="230.66666666666666" text-anchor="end" fill="#222" font-size="13" font-weight="normal">X3</text>
<text x="174" y="230.66666666666666" text-anchor="start" fill="#222" font-size="11" font-weight="normal">0</text>
<line x1="130" y1="253.33333333333334" x2="170" y2="253.33333333333334" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="124" y="257.33333333333337" text-anchor="end" fill="#222" font-size="13" font-weight="normal">X4</text>
<text x="174" y="257.33333333333337" text-anchor="start" fill="#222" font-size="11" font-weight="normal">1</text>
<line x1="205" y1="310" x2="205" y2="280" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="205" y="324" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">B</text>
<rect x="380" y="110" width="70" height="100" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="415" y="164" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">M3</text>
<text x="386" y="142" text-anchor="start" fill="#222" font-size="11" font-weight="normal">0</text>
<text x="386" y="190" text-anchor="start" fill="#222" font-size="11" font-weight="normal">1</text>
<polyline points="240,70 310,70 310,140 380,140" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="250" y="64" text-anchor="start" fill="#222" font-size="12" font-weight="normal">Q1</text>
<polyline points="240,240 310,240 310,190 380,190" fill="none" stroke="#222" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="250" y="234" text-anchor="start" fill="#222" font-size="12" font-weight="normal">Q2</text>
<line x1="415" y1="240" x2="415" y2="210" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="415" y="254" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">C</text>
<line x1="450" y1="160" x2="520" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="528" y="164" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Y</text>
<text x="245" y="90" text-anchor="start" fill="#222" font-size="12" font-weight="bold">always 1</text>
<text x="245" y="260" text-anchor="start" fill="#222" font-size="12" font-weight="bold">always 0</text>
<text x="458" y="125" text-anchor="start" fill="#222" font-size="12" font-weight="normal">C=0: Q1</text>
<text x="458" y="225" text-anchor="start" fill="#222" font-size="12" font-weight="normal">C=1: Q2</text>
<text x="20" y="370" text-anchor="start" fill="#222" font-size="12" font-weight="bold">X1=1, X2=1 make Q1 = 1; X3=0, X4=0 make Q2 = 0. Y = 1 exactly when C = 0.</text>
<text x="20" y="392" text-anchor="start" fill="#222" font-size="12" font-weight="bold">A and B are free, so C = 0 with 4 choices of (A, B) gives 4 combinations.</text>
</svg>
