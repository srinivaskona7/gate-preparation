<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="sans-serif" font-size="13">
<title>Venn diagram of 10000 students: core branch only 1300, both 500, other branches only 6700, neither 1500; core total 1800 is one quarter of other total 7200</title>
<rect x="20" y="20" width="600" height="340" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="32" y="40" fill="#222" font-size="12">All students: 10,000</text>
<circle cx="230" cy="180" r="110" fill="#c9d6ee" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<circle cx="390" cy="180" r="110" fill="#fbe7a1" fill-opacity="0.6" stroke="#222" stroke-width="2"/>
<text x="230" y="50" text-anchor="middle" fill="#222" font-weight="bold">Like core branch</text>
<text x="230" y="64" text-anchor="middle" fill="#222" font-size="12">total C = 1800</text>
<text x="400" y="50" text-anchor="middle" fill="#222" font-weight="bold">Like other branches</text>
<text x="400" y="64" text-anchor="middle" fill="#222" font-size="12">total O = 7200 = 4C</text>
<text x="170" y="185" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">1300</text>
<text x="170" y="203" text-anchor="middle" fill="#222" font-size="12">core only</text>
<text x="310" y="185" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">500</text>
<text x="310" y="203" text-anchor="middle" fill="#222" font-size="12">both</text>
<text x="450" y="185" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">6700</text>
<text x="450" y="203" text-anchor="middle" fill="#222" font-size="12">other only</text>
<text x="565" y="300" text-anchor="middle" fill="#222" font-size="16" font-weight="bold">1500</text>
<text x="565" y="318" text-anchor="middle" fill="#222" font-size="12">neither</text>
<text x="320" y="354" text-anchor="middle" fill="#222" font-size="12">Union = 10000 - 1500 = 8500 = C + 4C - 500, so 5C = 9000 and C = 1800</text>
</svg>
