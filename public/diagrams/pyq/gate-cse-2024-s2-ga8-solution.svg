<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="sans-serif" font-size="13">
<title>Stacked bars of renewable shares: 2007 Hydro 30 plus Solar 5 plus Wind 5 gives 40 percent; 2023 Hydro 35 plus Solar 20 plus Wind 10 gives 65 percent; the rise of 25 points over 40 is 62.5 percent</title>
<rect x="40" y="170.0" width="100" height="120.0" fill="#fbe7a1" stroke="#222" stroke-width="1.5"/>
<text x="90" y="234.0" text-anchor="middle" fill="#222" font-size="12">Hydro 30</text>
<rect x="40" y="150.0" width="100" height="20.0" fill="#f8cfd4" stroke="#222" stroke-width="1.5"/>
<text x="90" y="164.0" text-anchor="middle" fill="#222" font-size="12">Solar 5</text>
<rect x="40" y="130.0" width="100" height="20.0" fill="#dddddd" stroke="#222" stroke-width="1.5"/>
<text x="90" y="144.0" text-anchor="middle" fill="#222" font-size="12">Wind 5</text>
<text x="90" y="122.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">2007: 40</text>
<rect x="190" y="150.0" width="100" height="140.0" fill="#fbe7a1" stroke="#222" stroke-width="1.5"/>
<text x="240" y="224.0" text-anchor="middle" fill="#222" font-size="12">Hydro 35</text>
<rect x="190" y="70.0" width="100" height="80.0" fill="#f8cfd4" stroke="#222" stroke-width="1.5"/>
<text x="240" y="114.0" text-anchor="middle" fill="#222" font-size="12">Solar 20</text>
<rect x="190" y="30.0" width="100" height="40.0" fill="#dddddd" stroke="#222" stroke-width="1.5"/>
<text x="240" y="54.0" text-anchor="middle" fill="#222" font-size="12">Wind 10</text>
<text x="240" y="22.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">2023: 65</text>
<line x1="140" y1="130.0" x2="190" y2="130.0" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="40" y1="290" x2="290" y2="290" stroke="#222" stroke-width="1"/>
<text x="340" y="130" fill="#222" font-size="14" font-weight="bold">Share of renewables</text>
<text x="340" y="158" fill="#222">2007: 30 + 5 + 5 = 40</text>
<text x="340" y="180" fill="#222">2023: 35 + 20 + 10 = 65</text>
<text x="340" y="208" fill="#222">Rise: 65 - 40 = 25 points</text>
<text x="340" y="234" fill="#222" font-weight="bold">Percentage increase = 25 / 40 = 62.5%</text>
<text x="340" y="256" fill="#222" font-size="12">(measured on the 2007 value, not on 100)</text>
</svg>
