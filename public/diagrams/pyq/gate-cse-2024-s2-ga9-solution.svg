<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="340" height="190" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Three perpendicular cuts split a cube into eight equal cubes</title>
<text x="10" y="20" fill="#222" stroke="none" font-weight="bold">One cut per axis: 2 x 2 x 2 = 8 equal pieces</text><rect x="30" y="40" width="100" height="100" /><line x1="80" y1="40" x2="80" y2="140" stroke-dasharray="6 3"/><text x="80" y="160" fill="#222" stroke="none" text-anchor="middle" font-size="12">cut 1 (vertical)</text><rect x="190" y="40" width="100" height="100" /><line x1="190" y1="90" x2="290" y2="90" stroke-dasharray="6 3"/><text x="240" y="160" fill="#222" stroke="none" text-anchor="middle" font-size="12">cut 2 (the other vertical)</text><text x="240" y="178" fill="#222" stroke="none" text-anchor="middle" font-size="12">cut 3 is horizontal, mid-height</text>
</svg>
