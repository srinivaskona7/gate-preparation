<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 156" font-family="sans-serif" font-size="13">
<title>Sequence of calls: h(20) prints 20, g(10) prints 10, then inside f g(10) prints 10 and h(20) prints 20, giving 20101020</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Arguments evaluated right to left, then f runs: prints 20, 10, 10, 20</text>
<rect x="20" y="50" width="130" height="48" stroke="#222" stroke-width="1.5" fill="none"/><text x="85" y="70" fill="#222" text-anchor="middle" font-size="12">1. evaluate h(20)</text><text x="85" y="86" fill="#222" text-anchor="middle" font-size="12">prints 20</text>
<path d="M150,74 L170,74" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="170" y="50" width="130" height="48" stroke="#222" stroke-width="1.5" fill="none"/><text x="235" y="70" fill="#222" text-anchor="middle" font-size="12">2. evaluate g(10)</text><text x="235" y="86" fill="#222" text-anchor="middle" font-size="12">prints 10</text>
<path d="M300,74 L320,74" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="320" y="50" width="130" height="48" stroke="#222" stroke-width="1.5" fill="none"/><text x="385" y="70" fill="#222" text-anchor="middle" font-size="12">3. call f(10, 20)</text><text x="385" y="86" fill="#222" text-anchor="middle" font-size="12">x = 10, y = 20</text>
<path d="M450,74 L470,74" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="470" y="50" width="130" height="48" stroke="#222" stroke-width="1.5" fill="none"/><text x="535" y="70" fill="#222" text-anchor="middle" font-size="12">4. in f: g(x)</text><text x="535" y="86" fill="#222" text-anchor="middle" font-size="12">prints 10</text>
<path d="M600,74 L620,74" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="620" y="50" width="130" height="48" stroke="#222" stroke-width="1.5" fill="none"/><text x="685" y="70" fill="#222" text-anchor="middle" font-size="12">5. in f: h(y)</text><text x="685" y="86" fill="#222" text-anchor="middle" font-size="12">prints 20</text>
<text x="20" y="130" fill="#222" font-size="12">output tape:</text>
<rect x="110" y="114" width="50" height="26" stroke="#222" stroke-width="1.5" fill="none"/><text x="135" y="131" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">20</text>
<rect x="164" y="114" width="50" height="26" stroke="#222" stroke-width="1.5" fill="none"/><text x="189" y="131" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">10</text>
<rect x="218" y="114" width="50" height="26" stroke="#222" stroke-width="1.5" fill="none"/><text x="243" y="131" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">10</text>
<rect x="272" y="114" width="50" height="26" stroke="#222" stroke-width="1.5" fill="none"/><text x="297" y="131" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">20</text>
<text x="340" y="132" fill="#222" font-weight="bold">= 20101020, option (A)</text>
</svg>
