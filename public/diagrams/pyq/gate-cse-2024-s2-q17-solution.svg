<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" font-family="sans-serif" font-size="13">
<title>Example graph with A squared equal to the identity: two disjoint edges forming a perfect matching on four vertices</title>
<line x1="60" y1="60" x2="160" y2="60" stroke="#222" stroke-width="1.8"/><line x1="260" y1="60" x2="360" y2="60" stroke="#222" stroke-width="1.8"/><circle cx="60" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="64.5" text-anchor="middle" fill="#222" font-size="13">1</text><circle cx="160" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="160" y="64.5" text-anchor="middle" fill="#222" font-size="13">2</text><circle cx="260" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="260" y="64.5" text-anchor="middle" fill="#222" font-size="13">3</text><circle cx="360" cy="60" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="360" y="64.5" text-anchor="middle" fill="#222" font-size="13">4</text><text x="210" y="115" text-anchor="middle" fill="#222" font-size="12">Row i of A has exactly one 1, so (A&#178;)ii = degree = 1.</text><text x="210" y="135" text-anchor="middle" fill="#222" font-size="12">Two vertices never share a neighbour, so (A&#178;)ij = 0 for i &#8800; j.</text><text x="210" y="155" text-anchor="middle" fill="#222" font-size="12">A&#178; = I exactly when every vertex has degree 1: a perfect matching.</text>
</svg>
