<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img">
<title>Owner and weak entity set: double line on the weak side only is forced</title>
<rect x="35.0" y="70.0" width="110" height="40" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="90" y="94.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Owner</text>
<polygon points="280,62.0 340.0,90 280,118.0 220.0,90" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<polygon points="280,66.04 329.2,90 280,113.96 230.8,90" fill="none" stroke="#1f2937" stroke-width="1.4"/>
<text x="280" y="93.85" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Identifies</text>
<rect x="415.0" y="70.0" width="110" height="40" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<rect x="419.0" y="74.0" width="102" height="32" fill="none" stroke="#1f2937" stroke-width="1.4"/>
<text x="470" y="94.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">Weak</text>
<line x1="145" y1="90" x2="220" y2="90" stroke="#1f2937" stroke-width="1.4"/>
<line x1="340" y1="88" x2="415" y2="88" stroke="#1f2937" stroke-width="2.4"/>
<line x1="340" y1="92" x2="415" y2="92" stroke="#1f2937" stroke-width="2.4"/>
<text x="165" y="80" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">1</text>
<text x="385" y="80" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">N</text>
<text x="280" y="150" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">double line = total participation (every weak entity has an owner)</text>
<text x="280" y="172" font-size="11" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">single line = partial participation (an owner may have no weak entities)</text>
<text x="280" y="206" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">The weak side must be total: its key needs the owner key.</text>
</svg>
