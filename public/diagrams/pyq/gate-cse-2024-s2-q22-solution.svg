<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="sans-serif" font-size="13">
<title>The two-state DFA read as a parity counter: left state = even number of 1s, right state = odd number of 1s; accepted strings are 0* 1 (0 + 1 0* 1)*</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="130" cy="90" r="26" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="130" y="94" text-anchor="middle" font-size="10" fill="#222">even</text>
<line x1="70" y1="90" x2="103" y2="90" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="400" cy="90" r="26" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="400" cy="90" r="22" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="400" y="94" text-anchor="middle" font-size="12" fill="#222">odd</text>
<path d="M121,66 C100,30 160,30 139,66" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="130" y="33" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M391,66 C370,30 430,30 409,66" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="400" y="33" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M154.7,81.8 Q265.0,45.0 374.4,81.5" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="264.76282917548735" y="57.3099821002769" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<path d="M375.3,98.2 Q265.0,135.0 155.6,98.5" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="265.23717082451265" y="130.6900178997231" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
<text x="280" y="180" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">First 1 takes even to odd: 0* 1. Then stay on odd with 0,</text>
<text x="280" y="200" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">or leave on 1, loop on 0 and return on 1: 1 0* 1.  Result 0* 1 (0 + 1 0* 1)*</text>
</svg>
