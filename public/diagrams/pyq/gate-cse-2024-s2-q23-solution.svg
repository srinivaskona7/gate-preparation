<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
<title>Frame from X to Y: IP address stays Y, MAC address is the next hop R</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="30" y="70" width="100" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="80" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">X</text>
<rect x="230" y="70" width="100" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="280" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">S (switch)</text>
<rect x="430" y="70" width="100" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">R (router)</text>
<rect x="630" y="70" width="100" height="50" rx="6" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="680" y="100" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Y</text>
<line x1="130" y1="95" x2="230" y2="95" stroke="#1a1a1a" stroke-width="2"/>
<line x1="330" y1="95" x2="430" y2="95" stroke="#1a1a1a" stroke-width="2"/>
<line x1="530" y1="95" x2="630" y2="95" stroke="#1a1a1a" stroke-width="2"/>
<text x="380" y="40" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Frame as it leaves X (same IP packet all the way)</text>
<text x="380" y="160" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Destination IP  = IP of Y   (never changes end to end)</text>
<text x="380" y="184" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Destination MAC = MAC of R  (the next hop on X's own link)</text>
<text x="380" y="216" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">S only forwards at layer 2: it is not an address in the frame.</text>
</svg>
