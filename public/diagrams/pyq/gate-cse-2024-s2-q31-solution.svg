<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="11">
<title>Dependency graph: RAW I1 to I2 on R3, RAW I2 to I3 on R5, WAW I1 to I3 on R3, WAR I2 to I3 on R3, RAW I3 to I4 on R3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="10" y="18" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Dependencies among the four instructions (arrow runs from the earlier to the later instruction)</text><rect x="5" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.2"/><text x="70" y="111" text-anchor="middle" fill="#222" font-size="11">I1: DIV R3,R1,R2</text><rect x="165" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.2"/><text x="230" y="111" text-anchor="middle" fill="#222" font-size="11">I2: SUB R5,R3,R4</text><rect x="325" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.2"/><text x="390" y="111" text-anchor="middle" fill="#222" font-size="11">I3: ADD R3,R5,R6</text><rect x="485" y="90" width="130" height="34" fill="none" stroke="#222" stroke-width="1.2"/><text x="550" y="111" text-anchor="middle" fill="#222" font-size="11">I4: MUL R7,R3,R8</text><path d="M90,90 Q150,13.199999999999989 210,90" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="150" y="47.599999999999994" text-anchor="middle" fill="#222" font-size="10">RAW on R3</text><path d="M250,90 Q310,13.199999999999989 370,90" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="310" y="47.599999999999994" text-anchor="middle" fill="#222" font-size="10">RAW on R5</text><path d="M410,90 Q470,13.199999999999989 530,90" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="470" y="47.599999999999994" text-anchor="middle" fill="#222" font-size="10">RAW on R3</text><path d="M110,124 Q230,264.8 350,124" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="230" y="206.4" text-anchor="middle" fill="#222" font-size="10">WAW on R3 (I1 and I3 both write R3)</text><path d="M270,124 Q327.5,198.13333333333333 385,124" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="327.5" y="173.06666666666666" text-anchor="middle" fill="#222" font-size="10"></text><text x="440" y="160" text-anchor="start" fill="#222" font-size="10">WAR on R3 (I2 reads R3, I3 overwrites it)</text>
</svg>
