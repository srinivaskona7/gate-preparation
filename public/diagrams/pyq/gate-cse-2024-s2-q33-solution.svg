<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" font-family="sans-serif" font-size="13">
<title>The string abcd with its terminator: pointer b moves from index 0 to index 4 and b minus a is 4 for a literal, an array and a char pointer</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">fX("abcd"): b walks from a to the terminator; b - a counts the steps</text>
<rect x="60" y="60" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="90" y="81" fill="#222" text-anchor="middle" font-family="monospace">a</text>
<rect x="120" y="60" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="150" y="81" fill="#222" text-anchor="middle" font-family="monospace">b</text>
<rect x="180" y="60" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="210" y="81" fill="#222" text-anchor="middle" font-family="monospace">c</text>
<rect x="240" y="60" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="270" y="81" fill="#222" text-anchor="middle" font-family="monospace">d</text>
<rect x="300" y="60" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="330" y="81" fill="#222" text-anchor="middle" font-family="monospace">\0</text>
<text x="90" y="112" fill="#222" text-anchor="middle" font-size="11">0</text>
<text x="150" y="112" fill="#222" text-anchor="middle" font-size="11">1</text>
<text x="210" y="112" fill="#222" text-anchor="middle" font-size="11">2</text>
<text x="270" y="112" fill="#222" text-anchor="middle" font-size="11">3</text>
<text x="330" y="112" fill="#222" text-anchor="middle" font-size="11">4</text>
<text x="90" y="50" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">a, b</text>
<text x="330" y="50" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">b stops</text>
<path d="M100,128 L330,128" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="180" y="150" fill="#222" text-anchor="middle" font-size="12">b++ four times: b - a = 4</text>
<text x="20" y="190" fill="#222" font-size="12">Whether the characters live in a literal, in char c[] or behind char *c, *b is never written.</text>
<text x="20" y="208" fill="#222" font-size="12">So A, B and D all return 4. The code compiles: b - a is a valid integer count.</text>
</svg>
