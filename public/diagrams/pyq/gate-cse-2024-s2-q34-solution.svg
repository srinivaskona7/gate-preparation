<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 185" font-family="sans-serif" font-size="13">
<title>Hasse diagram of the partial order P and the five linear extensions of it</title>
<line x1="60" y1="110" x2="60" y2="40" stroke="#222" stroke-width="1.8"/><line x1="150" y1="110" x2="60" y2="40" stroke="#222" stroke-width="1.8"/><line x1="150" y1="110" x2="240" y2="40" stroke="#222" stroke-width="1.8"/><circle cx="60" cy="110" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="114.5" text-anchor="middle" fill="#222" font-size="13">1</text><circle cx="60" cy="40" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="60" y="44.5" text-anchor="middle" fill="#222" font-size="13">2</text><circle cx="150" cy="110" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="150" y="114.5" text-anchor="middle" fill="#222" font-size="13">3</text><circle cx="240" cy="40" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="240" y="44.5" text-anchor="middle" fill="#222" font-size="13">4</text><text x="150" y="150" text-anchor="middle" fill="#222" font-size="12">Hasse diagram of P: 1 &lt; 2, 3 &lt; 2, 3 &lt; 4</text><text x="330" y="40" text-anchor="start" fill="#222" font-size="13">The 5 total orders (smallest first)</text><text x="340" y="66" text-anchor="start" fill="#222" font-size="13">1.  1 3 2 4</text><text x="340" y="88" text-anchor="start" fill="#222" font-size="13">2.  1 3 4 2</text><text x="340" y="110" text-anchor="start" fill="#222" font-size="13">3.  3 1 2 4</text><text x="340" y="132" text-anchor="start" fill="#222" font-size="13">4.  3 1 4 2</text><text x="340" y="154" text-anchor="start" fill="#222" font-size="13">5.  3 4 1 2</text>
