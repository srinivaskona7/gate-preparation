<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 218" font-family="sans-serif" font-size="13">
<title>Array of two doubles with p at a[0] and q at a[1]: q minus p is 1 element, not 8 bytes, and the values differ by 5, so the output is 1,5</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">double a[2] = {20.0, 25.0}: each element is 8 bytes</text>
<rect x="60" y="50" width="160" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="140" y="74" fill="#222" text-anchor="middle" font-weight="bold">a[0] = 20.0</text>
<rect x="220" y="50" width="160" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="300" y="74" fill="#222" text-anchor="middle" font-weight="bold">a[1] = 25.0</text>
<text x="60" y="108" fill="#222" font-size="11">byte 0</text>
<text x="220" y="108" fill="#222" font-size="11">byte 8</text>
<text x="380" y="108" fill="#222" text-anchor="end" font-size="11">byte 16</text>
<text x="140" y="44" fill="#222" text-anchor="middle" font-weight="bold">p</text>
<text x="300" y="44" fill="#222" text-anchor="middle" font-weight="bold">q = p + 1</text>
<path d="M60,128 L220,128" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="140" y="146" fill="#222" text-anchor="middle" font-size="12">8 bytes = 1 element: q - p = 1</text>
<text x="20" y="180" fill="#222" font-size="12">*q - *p = 25.0 - 20.0 = 5.0, converted to int: 5</text>
<text x="20" y="202" fill="#222" font-size="13" font-weight="bold">printf("%d,%d") prints 1,5: option (B)</text>
</svg>
