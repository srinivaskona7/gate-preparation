<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 276" font-family="sans-serif" font-size="13">
<title>Third octet 0 to 3 inside 10.12.x.x: the range 10.12.2.0 to 10.12.3.255 is exactly one /23 block</title>
<text x="10" y="60" text-anchor="start" fill="#222" font-size="12">10.12.2.0/23 : third octet 2-3</text>
<rect x="570.0" y="40" width="400.0" height="30" fill="#dde" stroke="#222" stroke-width="2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">10.12.2.0/24 : octet 2 only</text>
<rect x="570.0" y="82" width="200.0" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="144" text-anchor="start" fill="#222" font-size="12">10.12.0.0/22 : octet 0-3</text>
<rect x="170.0" y="124" width="800.0" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<line x1="270.0" y1="30" x2="270.0" y2="166" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="270.0" y="182" text-anchor="middle" fill="#222" font-size="12">x.0</text>
<line x1="470.0" y1="30" x2="470.0" y2="166" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="470.0" y="182" text-anchor="middle" fill="#222" font-size="12">x.1</text>
<line x1="670.0" y1="30" x2="670.0" y2="166" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="670.0" y="182" text-anchor="middle" fill="#222" font-size="12">x.2</text>
<line x1="870.0" y1="30" x2="870.0" y2="166" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="870.0" y="182" text-anchor="middle" fill="#222" font-size="12">x.3</text>
<text x="170" y="202" text-anchor="start" fill="#222" font-size="12">Third octet value</text>
<text x="10" y="226" text-anchor="start" fill="#222" font-size="12">The range holds 2 x 256 = 512 addresses, so 9 host bits and prefix 32 - 9 = 23.</text>
<text x="10" y="246" text-anchor="start" fill="#222" font-size="12">10.12.2.0/22 is not a valid block: 2 is not a multiple of 4.</text>
</svg>
