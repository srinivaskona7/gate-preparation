<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="sans-serif" font-size="13">
<title>Two BSTs from the set {1, 2, 3}: inserting 2, 1, 3 gives root 2 with children 1 and 3 (preorder 2 1 3, postorder 1 3 2); inserting 1, 2, 3 gives a right chain 1, 2, 3 (preorder 1 2 3, postorder 3 2 1); both have inorder 1 2 3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="160" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">insert 2, 1, 3</text>
<circle cx="160" cy="66" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="160" y="70.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="110" cy="126" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="110" y="130.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="210" cy="126" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="210" y="130.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="149.8" y1="78.3" x2="120.2" y2="113.7" stroke="#222" stroke-width="1.6"/>
<line x1="170.2" y1="78.3" x2="199.8" y2="113.7" stroke="#222" stroke-width="1.6"/>
<text x="100" y="176" text-anchor="start" fill="#222" font-size="12">preorder  2 1 3</text>
<text x="100" y="196" text-anchor="start" fill="#222" font-size="12" font-weight="bold">inorder   1 2 3</text>
<text x="100" y="216" text-anchor="start" fill="#222" font-size="12">postorder 1 3 2</text>
<text x="500" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">insert 1, 2, 3</text>
<circle cx="450" cy="66" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="450" y="70.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="484" cy="106" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="484" y="110.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="518" cy="146" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="518" y="150.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="460.4" y1="78.2" x2="473.6" y2="93.8" stroke="#222" stroke-width="1.6"/>
<line x1="494.4" y1="118.2" x2="507.6" y2="133.8" stroke="#222" stroke-width="1.6"/>
<text x="440" y="176" text-anchor="start" fill="#222" font-size="12">preorder  1 2 3</text>
<text x="440" y="196" text-anchor="start" fill="#222" font-size="12" font-weight="bold">inorder   1 2 3</text>
<text x="440" y="216" text-anchor="start" fill="#222" font-size="12">postorder 3 2 1</text>
<text x="330" y="260" text-anchor="middle" fill="#222" font-size="12">Root, preorder and postorder change with the insertion order; inorder is always the sorted V.</text>
<text x="330" y="282" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Answer: inorder (option A)</text>
</svg>
