<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" font-family="sans-serif" fill="#1f2937"><title>Completed LL(1) parsing table for S to AaAb or BbBa, A to cS or epsilon, B to dS or epsilon</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<text x="105.0" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">a</text>
<text x="215.0" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">b</text>
<text x="325.0" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">c</text>
<text x="435.0" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">d</text>
<text x="545.0" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2937">$</text>
<text x="38" y="57.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1f2937">S</text>
<rect x="50" y="30" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="105.0" y="57.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">S -&gt; AaAb</text>
<rect x="160" y="30" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="215.0" y="57.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">S -&gt; BbBa</text>
<rect x="270" y="30" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="325.0" y="57.0" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; AaAb</text>
<text x="276" y="43" font-size="11" text-anchor="start" fill="#1f2937">(1)</text>
<rect x="380" y="30" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="435.0" y="57.0" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; BbBa</text>
<text x="386" y="43" font-size="11" text-anchor="start" fill="#1f2937">(2)</text>
<rect x="490" y="30" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="38" y="101.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1f2937">A</text>
<rect x="50" y="74" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="105.0" y="101.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">A -&gt; eps</text>
<rect x="160" y="74" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="215.0" y="101.0" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; eps</text>
<text x="166" y="87" font-size="11" text-anchor="start" fill="#1f2937">(3)</text>
<rect x="270" y="74" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="325.0" y="101.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">A -&gt; cS</text>
<rect x="380" y="74" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<rect x="490" y="74" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="38" y="145.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1f2937">B</text>
<rect x="50" y="118" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="105.0" y="145.0" font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1f2937">B -&gt; eps</text>
<text x="56" y="131" font-size="11" text-anchor="start" fill="#1f2937">(4)</text>
<rect x="160" y="118" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="215.0" y="145.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">B -&gt; eps</text>
<rect x="270" y="118" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<rect x="380" y="118" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="435.0" y="145.0" font-size="12" text-anchor="middle" font-family="monospace" fill="#1f2937">B -&gt; dS</text>
<rect x="490" y="118" width="110" height="44" rx="0" fill="none" stroke="#1f2937" stroke-width="0.8"/>
<text x="50" y="188" font-size="12" text-anchor="start" fill="#1f2937">A -&gt; eps goes in Follow(A) = {a, b}.   B -&gt; eps goes in Follow(B) = {a, b}.</text>
<text x="50" y="208" font-size="12" text-anchor="start" fill="#1f2937">(1) c in First(AaAb) via A -&gt; cS.   (2) d in First(BbBa) via B -&gt; dS.</text>
<text x="50" y="228" font-size="12" text-anchor="start" fill="#1f2937">(3) A -&gt; eps at b.   (4) B -&gt; eps at a.   No cell holds two entries.</text>
</svg>
