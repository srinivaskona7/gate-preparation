<text x="370" y="64" text-anchor="middle" font-size="12" fill="#222">3</text>
<circle cx="210" cy="190" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="210" y="194" text-anchor="middle" font-size="12" fill="#222">4</text>
