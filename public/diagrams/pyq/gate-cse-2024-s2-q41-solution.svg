<text x="149.47213595499957" y="106.56230589874906" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">&#949;</text>
<line x1="96.1" y1="133.0" x2="193.0" y2="181.5" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="139.6334368540005" y="171.11509230324907" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">&#949;</text>
<path d="M227.7,56.9 Q290.0,46.0 351.3,56.7" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="289.75374238321103" y="45.4054819312917" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
<path d="M352.3,63.1 Q290.0,74.0 228.7,63.3" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="290.24625761678897" y="82.5945180687083" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0</text>
