<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif" font-size="13">
<title>The NFA split into its two branches from state 1: the top branch gives (00)* and 0(00)*(11)*, the bottom branch gives 1(11)*</title>
