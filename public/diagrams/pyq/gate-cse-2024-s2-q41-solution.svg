<text x="280" y="255" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Top: (00)* ends in state 2 (accept); (00)*0 ends in 3, then &#949; to 5, then (11)*: 0(00)*(11)*</text>
<text x="280" y="277" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">Bottom: 1 reaches 5 (accept), each further 11 returns to 5: 1(11)*  (state 4 does not accept)</text>
