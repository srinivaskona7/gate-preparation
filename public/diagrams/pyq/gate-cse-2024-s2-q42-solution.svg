<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 285" font-family="sans-serif" font-size="13">
<title>Trace of the longest at-most-two-distinct subarray code on 5 5 7 5 9 with P = 1 and Q = len1 + 1</title>
<g fill="#222" font-weight="bold"><text x="30" y="40">X[i]</text><text x="100" y="40">case taken</text><text x="270" y="40">len1</text><text x="330" y="40">len2</text><text x="400" y="40">update</text></g><g fill="#222"><text x="30" y="70">5</text><text x="100" y="70">new value</text><text x="270" y="70">1</text><text x="330" y="70">1</text><text x="400" y="70">len2 = len1+1, len1 = 1</text><text x="30" y="100">5</text><text x="100" y="100">same as previous</text><text x="270" y="100">2</text><text x="330" y="100">2</text><text x="400" y="100">len2++, len1++</text><text x="30" y="130">7</text><text x="100" y="130">new value</text><text x="270" y="130">1</text><text x="330" y="130">3</text><text x="400" y="130">len2 = len1+1 (2+1), len1 = 1</text><text x="30" y="160">5</text><text x="100" y="160">equals second</text><text x="270" y="160">1</text><text x="330" y="160">4</text><text x="400" y="160">len1 = 1 (P), len2++</text><text x="30" y="190">9</text><text x="100" y="190">new value</text><text x="270" y="190">1</text><text x="330" y="190">2</text><text x="400" y="190">len2 = len1+1 (1+1), len1 = 1</text><text x="30" y="245">Array X = 5, 5, 7, 5, 9. Values after each iteration;</text><text x="30" y="267">the longest subarray with at most two distinct values is 5, 7, 5 (length 4).</text></g><path d="M20 50 H650" stroke="#222"/>
</svg>
