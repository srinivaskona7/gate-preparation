<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" role="img">
<title>Three renamed copies of Person need two cross products</title>
<rect x="35.0" y="42.0" width="110" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="90" y="64.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">ρR(Person)</text>
<rect x="245.0" y="42.0" width="110" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="300" y="64.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">ρS(Person)</text>
<rect x="455.0" y="42.0" width="110" height="36" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="510" y="64.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">ρP(Person)</text>
<text x="195" y="66" font-size="20" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">×</text>
<text x="405" y="66" font-size="20" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">×</text>
<text x="310" y="125" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">σ  R.city = S.city = P.city  and  R.pid, S.pid, P.pid pairwise different</text>
<text x="310" y="150" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">then π city: a city survives only if it has three distinct persons</text>
<text x="310" y="195" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">k copies need k-1 cross products: 3 copies, 2 products</text>
</svg>
