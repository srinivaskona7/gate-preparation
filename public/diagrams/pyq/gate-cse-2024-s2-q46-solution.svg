<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="sans-serif" font-size="13">
<title>Two schedules of the threads: if T1 takes s1 first it blocks on s2 holding s1 and deadlocks, if T2 goes first both threads finish</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">T1 gets s1 first: deadlock (option C)</text>
<rect x="20" y="40" width="190" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115.0" y="58.0" text-anchor="middle" fill="#222" font-size="12">T1 wait(s1)</text>
<rect x="210" y="40" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="290.0" y="58.0" text-anchor="middle" fill="#222" font-size="11">s1 = 0</text>
<rect x="20" y="74" width="190" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115.0" y="92.0" text-anchor="middle" fill="#222" font-size="12">T1 x = x+1, print(x)</text>
<rect x="210" y="74" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="290.0" y="92.0" text-anchor="middle" fill="#222" font-size="11">prints 1</text>
<rect x="20" y="108" width="190" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115.0" y="126.0" text-anchor="middle" fill="#222" font-size="12">T1 wait(s2)</text>
<rect x="210" y="108" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="290.0" y="126.0" text-anchor="middle" fill="#222" font-size="11">s2 = 0: T1 blocks, still holds s1</text>
<rect x="20" y="142" width="190" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115.0" y="160.0" text-anchor="middle" fill="#222" font-size="12">T2 wait(s1)</text>
<rect x="210" y="142" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="290.0" y="160.0" text-anchor="middle" fill="#222" font-size="11">s1 = 0: T2 blocks</text>
<rect x="20" y="176" width="190" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="115.0" y="194.0" text-anchor="middle" fill="#222" font-size="12">nobody can run</text>
<rect x="210" y="176" width="160" height="28" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="290.0" y="194.0" text-anchor="middle" fill="#222" font-size="11">deadlock</text>
<text x="400" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">T2 gets s1 first: both finish (option B)</text>
<rect x="400" y="40" width="200" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="58.0" text-anchor="middle" fill="#222" font-size="12">T2 wait(s1)</text>
<rect x="600" y="40" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="680.0" y="58.0" text-anchor="middle" fill="#222" font-size="11">s1 = 0</text>
<rect x="400" y="74" width="200" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="92.0" text-anchor="middle" fill="#222" font-size="12">T2 x = x+1, print(x)</text>
<rect x="600" y="74" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="680.0" y="92.0" text-anchor="middle" fill="#222" font-size="11">prints 1</text>
<rect x="400" y="108" width="200" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="126.0" text-anchor="middle" fill="#222" font-size="12">T2 signal(s2), signal(s1)</text>
<rect x="600" y="108" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="680.0" y="126.0" text-anchor="middle" fill="#222" font-size="11">s2 = 1, s1 = 1</text>
<rect x="400" y="142" width="200" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="160.0" text-anchor="middle" fill="#222" font-size="12">T1 wait(s1), x = x+1, print</text>
<rect x="600" y="142" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="680.0" y="160.0" text-anchor="middle" fill="#222" font-size="11">prints 2</text>
<rect x="400" y="176" width="200" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500.0" y="194.0" text-anchor="middle" fill="#222" font-size="12">T1 wait(s2), signal(s1)</text>
<rect x="600" y="176" width="160" height="28" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="680.0" y="194.0" text-anchor="middle" fill="#222" font-size="11">s2 = 0, passes</text>
<text x="20" y="250" text-anchor="start" fill="#222" font-size="12">A (T1 prints 1, then T2 prints 2) never happens: T1 cannot get past wait(s2) until T2 signals.</text>
<text x="20" y="274" text-anchor="start" fill="#222" font-size="12">D (T2 prints 1, T1 stuck) never happens: T2 signals s2 and s1 before T1 starts.</text>
<text x="20" y="308" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Possible: B and C</text>
</svg>
