<text x="12" y="594" text-anchor="start" fill="#b91c1c" font-size="13">Option A: 100 first. 100 is under 200, 300 and 400; all three must leave S1 without being output,</text>
<text x="12" y="616" text-anchor="start" fill="#b91c1c" font-size="13">and S2 holds only 2. Impossible.</text>
<text x="12" y="644" text-anchor="start" fill="#222" font-size="14" font-weight="bold">Answer: B, C, D.</text>
