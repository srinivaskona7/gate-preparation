<line x1="8" y1="52" x2="692" y2="52" stroke="#6b7280" stroke-width="1"/>
<text x="12" y="73" text-anchor="start" fill="#1d4ed8" font-size="13" font-weight="bold">Option B: output 200 300 400 100</text>
<line x1="8" y1="77" x2="692" y2="77" stroke="#6b7280" stroke-width="0.8"/>
<text x="24" y="95" text-anchor="start" fill="#222" font-size="12">PushToS2</text>
<text x="170" y="95" text-anchor="start" fill="#222" font-size="12">100 200 300</text>
<text x="350" y="95" text-anchor="start" fill="#222" font-size="12">400</text>
<text x="470" y="95" text-anchor="start" fill="#222" font-size="12">-</text>
<text x="24" y="117" text-anchor="start" fill="#222" font-size="12">PushToS2</text>
<text x="170" y="117" text-anchor="start" fill="#222" font-size="12">100 200</text>
<text x="350" y="117" text-anchor="start" fill="#222" font-size="12">400 300</text>
<text x="470" y="117" text-anchor="start" fill="#222" font-size="12">-</text>
