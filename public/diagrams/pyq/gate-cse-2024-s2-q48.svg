<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="sans-serif" font-size="13">
<title>Stack S1 of capacity 4 holds 100, 200, 300, 400 with 400 on top; stack S2 of capacity 2 is empty</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<polyline points="70,40 70,160 140,160 140,40" fill="none" stroke="#222" stroke-width="2"/>
<rect x="70" y="130" width="70" height="30" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="105.0" y="150.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">100</text>
<rect x="70" y="100" width="70" height="30" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="105.0" y="120.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">200</text>
<rect x="70" y="70" width="70" height="30" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="105.0" y="90.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">300</text>
<rect x="70" y="40" width="70" height="30" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="105.0" y="60.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">400</text>
<text x="105.0" y="180" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Stack S1</text>
<text x="165" y="60" text-anchor="start" fill="#1d4ed8" font-size="12">Top</text>
<line x1="160" y1="56" x2="142" y2="56" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="188" y="205" text-anchor="middle" fill="#6b7280" font-size="11">capacity 4</text>
<polyline points="300,100 300,160 370,160 370,100" fill="none" stroke="#222" stroke-width="2"/>
<text x="335.0" y="180" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Stack S2</text>
<text x="335" y="205" text-anchor="middle" fill="#6b7280" font-size="11">capacity 2</text>
<text x="70" y="20" text-anchor="start" fill="#6b7280" font-size="11">PushToS2: S1 to S2.  PushToS1: S2 to S1.  GenerateOutput: pop S1 and output.</text>
</svg>
