<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="sans-serif" font-size="13">
<title>Edge swap argument: replacing edge f of spanning tree T by edge e gives another spanning tree, so all edges of a cycle share the same parity</title>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="13">Cycle with edges e = uv, f = vw, g = wu. Bold edges are in the tree.</text><line x1="50" y1="150" x2="150" y2="150" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="150" y1="150" x2="100" y2="70" stroke="#222" stroke-width="4.5"/><line x1="100" y1="70" x2="50" y2="150" stroke="#222" stroke-width="4.5"/><circle cx="50" cy="150" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="50" y="154.5" text-anchor="middle" fill="#222" font-size="13">u</text><circle cx="150" cy="150" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="150" y="154.5" text-anchor="middle" fill="#222" font-size="13">v</text><circle cx="100" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="100" y="74.5" text-anchor="middle" fill="#222" font-size="13">w</text><text x="100" y="182" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">e</text><text x="148" y="104" text-anchor="start" fill="#222" font-size="14" font-weight="bold">f</text><text x="52" y="104" text-anchor="end" fill="#222" font-size="14" font-weight="bold">g</text><text x="100" y="208" text-anchor="middle" fill="#222" font-size="13">T = {f, g}</text><line x1="350" y1="150" x2="450" y2="150" stroke="#222" stroke-width="4.5"/><line x1="450" y1="150" x2="400" y2="70" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="400" y1="70" x2="350" y2="150" stroke="#222" stroke-width="4.5"/><circle cx="350" cy="150" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="350" y="154.5" text-anchor="middle" fill="#222" font-size="13">u</text><circle cx="450" cy="150" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="450" y="154.5" text-anchor="middle" fill="#222" font-size="13">v</text><circle cx="400" cy="70" r="15" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="400" y="74.5" text-anchor="middle" fill="#222" font-size="13">w</text><text x="400" y="182" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">e</text><text x="448" y="104" text-anchor="start" fill="#222" font-size="14" font-weight="bold">f</text><text x="352" y="104" text-anchor="end" fill="#222" font-size="14" font-weight="bold">g</text><text x="400" y="208" text-anchor="middle" fill="#222" font-size="13">T2 = {e, g}</text><line x1="185" y1="110" x2="300" y2="110" stroke="#222" stroke-width="1.8"/><polygon points="300,104 312,110 300,116" fill="#222"/><text x="248" y="98" text-anchor="middle" fill="#222" font-size="13">-f, +e</text><text x="20" y="238" text-anchor="start" fill="#222" font-size="13">T contains f and g, not e. T2 = T - f + e is also a spanning tree.</text><text x="20" y="260" text-anchor="start" fill="#222" font-size="13">w(T) and w(T2) are both even, so w(e) - w(f) is even:</text><text x="20" y="282" text-anchor="start" fill="#222" font-size="13">e and f have the same parity. Repeat for every pair on the cycle.</text>
</svg>
