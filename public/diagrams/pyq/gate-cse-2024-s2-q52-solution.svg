<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="sans-serif" font-size="13">
<title>Parse tree of the string aacbc in the grammar S -&gt; aS | aSbS | c, with the counts na=2, nb=1, nc=2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="250" y="40" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<text x="190" y="100" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">a</text>
<line x1="250" y1="46" x2="190" y2="85" stroke="#222" stroke-width="1.4"/>
<text x="300" y="100" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="250" y1="46" x2="300" y2="85" stroke="#222" stroke-width="1.4"/>
<text x="110" y="70" text-anchor="middle" font-size="12" fill="#222">S → a S</text>
<text x="190" y="170" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">a</text>
<line x1="300" y1="106" x2="190" y2="155" stroke="#222" stroke-width="1.4"/>
<text x="260" y="170" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="300" y1="106" x2="260" y2="155" stroke="#222" stroke-width="1.4"/>
<text x="330" y="170" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="300" y1="106" x2="330" y2="155" stroke="#222" stroke-width="1.4"/>
<text x="400" y="170" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="300" y1="106" x2="400" y2="155" stroke="#222" stroke-width="1.4"/>
<text x="110" y="135" text-anchor="middle" font-size="12" fill="#222">S → a S b S</text>
<text x="260" y="240" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">c</text>
<line x1="260" y1="176" x2="260" y2="225" stroke="#222" stroke-width="1.4"/>
<text x="400" y="240" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">c</text>
<line x1="400" y1="176" x2="400" y2="225" stroke="#222" stroke-width="1.4"/>
<text x="110" y="205" text-anchor="middle" font-size="12" fill="#222">S → c   (two leaves)</text>
<text x="250" y="280" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">yield  a a c b c :  na = 2,  nb = 1,  nc = 2</text>
<text x="470" y="60" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Count the S nodes:</text>
<text x="470" y="78" text-anchor="start" font-size="12" fill="#222">a leaf rule S → c has 0 S children,</text>
<text x="470" y="94" text-anchor="start" font-size="12" fill="#222">S → aS has 1, S → aSbS has 2.</text>
<text x="470" y="116" text-anchor="start" font-size="12" fill="#222">Leaves = (two-child nodes) + 1,</text>
<text x="470" y="132" text-anchor="start" font-size="12" fill="#222" font-weight="bold">so  nc = nb + 1  in every tree.</text>
<text x="470" y="160" text-anchor="start" font-size="12" fill="#222">Each b comes with its own a,</text>
<text x="470" y="176" text-anchor="start" font-size="12" fill="#222">so  na ≥ nb.  It is not  na &gt; nb:</text>
<text x="470" y="192" text-anchor="start" font-size="12" fill="#222">the string c has na = nb = 0.</text>
<text x="470" y="220" text-anchor="start" font-size="12" fill="#222">nc = 2·nb fails for c:  1 ≠ 0.</text>
<text x="20" y="330" text-anchor="start" font-size="13" fill="#222" font-weight="bold">na ≥ nb = nc − 1  gives  na &gt; nc − 2:  option (B).   nc = nb + 1:  option (C).</text>
</svg>
