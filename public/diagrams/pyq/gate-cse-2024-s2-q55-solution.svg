<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256">
<title>Round trip of 5 microseconds sets the minimum frame time</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="102" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Station A</text>
<rect x="110.0" y="50" width="690.909090909091" height="30" rx="0" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="455.4545454545455" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">A must still be sending at t = 5 us</text>
<text x="102" y="116" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Signal</text>
<rect x="110.0" y="94" width="345.4545454545455" height="30" rx="0" fill="#fbe9a8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="282.72727272727275" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">first bit goes A to B</text>
<rect x="455.4545454545455" y="94" width="345.4545454545455" height="30" rx="0" fill="#cdebc9" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="628.1818181818182" y="114" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">collision comes back</text>
<line x1="110" y1="138" x2="880" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="138" x2="110.0" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<line x1="455.4545454545455" y1="138" x2="455.4545454545455" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="455.4545454545455" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">2.5</text>
<line x1="800.909090909091" y1="138" x2="800.909090909091" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="800.909090909091" y="160" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">5 us</text>
<line x1="800.909090909091" y1="36" x2="800.909090909091" y2="138" stroke="#b00020" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="800.909090909091" y="32" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#b00020">A learns of the collision</text>
<text x="10" y="188" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Worst case: B starts just before A's first bit arrives at 2.5 us; B's collision signal needs 2.5 us more.</text>
<text x="10" y="202" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Minimum frame time = 2 x 500 m / (2 x 10^8 m/s) = 5 us; at 10^8 bit/s that is 500 bits.</text>
</svg>
