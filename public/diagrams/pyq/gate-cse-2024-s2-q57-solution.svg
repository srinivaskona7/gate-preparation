<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" font-family="sans-serif" font-size="13">
<title>The 32-bit format: 5-bit opcode, 3-bit addressing mode, two 4-bit registers, 16-bit scalar</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="#222" font-weight="bold">5 + 3 + 4 + 4 + 16 = 32 bits</text><rect x="20" y="40" width="90" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="65" y="55" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="65" y="67" text-anchor="middle" fill="#222" font-size="10">5 b</text><rect x="110" y="40" width="54" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="137" y="55" text-anchor="middle" fill="#222" font-size="12">mode</text><text x="137" y="67" text-anchor="middle" fill="#222" font-size="10">3 b</text><rect x="164" y="40" width="72" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="200" y="55" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="200" y="67" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="236" y="40" width="72" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="272" y="55" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="272" y="67" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="308" y="40" width="288" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="452" y="55" text-anchor="middle" fill="#222" font-size="12">scalar</text><text x="452" y="67" text-anchor="middle" fill="#222" font-size="10">16 b</text><text x="20" y="105" text-anchor="start" fill="#222" font-size="12">The mode field is separate, so every mode can use all 2^5 = 32 opcode values.</text>
</svg>
