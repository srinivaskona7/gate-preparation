<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" font-family="sans-serif" font-size="13">
<title>Two-colouring of the Q.60 graph: odd-numbered vertices one colour, even-numbered the other, so it is K4,4 with chromatic number 2</title>
<line x1="150" y1="60" x2="250" y2="60" stroke="#222" stroke-width="1.8"/><line x1="250" y1="60" x2="320" y2="115" stroke="#222" stroke-width="1.8"/><line x1="320" y1="115" x2="320" y2="225" stroke="#222" stroke-width="1.8"/><line x1="320" y1="225" x2="250" y2="280" stroke="#222" stroke-width="1.8"/><line x1="250" y1="280" x2="150" y2="280" stroke="#222" stroke-width="1.8"/><line x1="150" y1="280" x2="80" y2="225" stroke="#222" stroke-width="1.8"/><line x1="80" y1="225" x2="80" y2="115" stroke="#222" stroke-width="1.8"/><line x1="80" y1="115" x2="150" y2="60" stroke="#222" stroke-width="1.8"/><line x1="150" y1="60" x2="150" y2="280" stroke="#222" stroke-width="1.8"/><line x1="250" y1="60" x2="250" y2="280" stroke="#222" stroke-width="1.8"/><line x1="80" y1="115" x2="320" y2="115" stroke="#222" stroke-width="1.8"/><line x1="80" y1="225" x2="320" y2="225" stroke="#222" stroke-width="1.8"/><line x1="150" y1="60" x2="320" y2="225" stroke="#222" stroke-width="1.8"/><line x1="250" y1="60" x2="80" y2="225" stroke="#222" stroke-width="1.8"/><line x1="80" y1="115" x2="250" y2="280" stroke="#222" stroke-width="1.8"/><line x1="320" y1="115" x2="150" y2="280" stroke="#222" stroke-width="1.8"/><circle cx="150" cy="60" r="13" fill="#d0d0d0" stroke="#222" stroke-width="1.8"/><text x="150" y="64.5" text-anchor="middle" fill="#222" font-size="13">1</text><circle cx="250" cy="60" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="250" y="64.5" text-anchor="middle" fill="#222" font-size="13">2</text><circle cx="320" cy="115" r="13" fill="#d0d0d0" stroke="#222" stroke-width="1.8"/><text x="320" y="119.5" text-anchor="middle" fill="#222" font-size="13">3</text><circle cx="320" cy="225" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="320" y="229.5" text-anchor="middle" fill="#222" font-size="13">4</text><circle cx="250" cy="280" r="13" fill="#d0d0d0" stroke="#222" stroke-width="1.8"/><text x="250" y="284.5" text-anchor="middle" fill="#222" font-size="13">5</text><circle cx="150" cy="280" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="150" y="284.5" text-anchor="middle" fill="#222" font-size="13">6</text><circle cx="80" cy="225" r="13" fill="#d0d0d0" stroke="#222" stroke-width="1.8"/><text x="80" y="229.5" text-anchor="middle" fill="#222" font-size="13">7</text><circle cx="80" cy="115" r="13" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="80" y="119.5" text-anchor="middle" fill="#222" font-size="13">8</text><text x="200" y="318" text-anchor="middle" fill="#222" font-size="12">Shaded: colour 1 (1, 3, 5, 7).  White: colour 2 (2, 4, 6, 8).</text><text x="200" y="336" text-anchor="middle" fill="#222" font-size="12">Every edge joins a shaded vertex to a white one, so 2 colours suffice.</text>
</svg>
