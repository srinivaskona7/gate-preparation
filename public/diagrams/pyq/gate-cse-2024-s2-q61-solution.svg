<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="sans-serif" font-size="13">
<title>R-type and I-type 32-bit formats: opcode 8 bits, registers 6 bits each, UNUSED 6 bits, immediate 12 bits</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="#222" font-weight="bold">R-type: 8 + 6 + 6 + 6 + 6 = 32</text><rect x="20" y="40" width="144" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="92" y="55" text-anchor="middle" fill="#222" font-size="12">OPCODE</text><text x="92" y="67" text-anchor="middle" fill="#222" font-size="10">8 b</text><rect x="164" y="40" width="108" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="218" y="55" text-anchor="middle" fill="#222" font-size="12">UNUSED</text><text x="218" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="272" y="40" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="326" y="55" text-anchor="middle" fill="#222" font-size="12">DST</text><text x="326" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="380" y="40" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="434" y="55" text-anchor="middle" fill="#222" font-size="12">SRC1</text><text x="434" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="488" y="40" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="542" y="55" text-anchor="middle" fill="#222" font-size="12">SRC2</text><text x="542" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="97" text-anchor="start" fill="#222" font-weight="bold">I-type: 8 + 6 + 6 + 12 = 32</text><rect x="20" y="105" width="144" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="92" y="120" text-anchor="middle" fill="#222" font-size="12">OPCODE</text><text x="92" y="132" text-anchor="middle" fill="#222" font-size="10">8 b</text><rect x="164" y="105" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="218" y="120" text-anchor="middle" fill="#222" font-size="12">DST</text><text x="218" y="132" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="272" y="105" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="326" y="120" text-anchor="middle" fill="#222" font-size="12">SRC</text><text x="326" y="132" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="380" y="105" width="216" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="488" y="120" text-anchor="middle" fill="#222" font-size="12">immediate</text><text x="488" y="132" text-anchor="middle" fill="#222" font-size="10">12 b</text><text x="20" y="170" text-anchor="start" fill="#222" font-size="12">X = 6, Y = 8, Z = 12, so X + 2Y + Z = 6 + 16 + 12 = 34.</text>
</svg>
