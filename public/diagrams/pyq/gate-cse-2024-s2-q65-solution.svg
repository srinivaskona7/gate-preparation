<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif" fill="#1f2937"><title>The 9 LR(0) items in GOTO(I0, S) for the grammar S to SS, Aa, bAc, Bc, bBa</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="250" height="158" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I0 = CLOSURE({S' -&gt; .S})</text>
<line x1="10" y1="34" x2="260" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S' -&gt; .S</text>
<text x="20" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .SS</text>
<text x="20" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .Aa</text>
<text x="20" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .bAc</text>
<text x="20" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .Bc</text>
<text x="20" y="132" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .bBa</text>
<text x="20" y="148" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">A -&gt; .d#</text>
<text x="20" y="164" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">B -&gt; .@</text>
<line x1="265" y1="100" x2="300" y2="100" stroke="#1f2937" stroke-width="1.2" marker-end="url(#ah)"/>
<text x="282" y="92" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2937">S</text>
<rect x="305" y="10" width="245" height="174" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="313" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">GOTO(I0, S): 9 items</text>
<line x1="305" y1="34" x2="550" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="315" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S' -&gt; S.</text>
<text x="315" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; S.S</text>
<text x="315" y="84" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .SS</text>
<text x="315" y="100" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .Aa</text>
<text x="315" y="116" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .bAc</text>
<text x="315" y="132" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .Bc</text>
<text x="315" y="148" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .bBa</text>
<text x="315" y="164" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">A -&gt; .d#</text>
<text x="315" y="180" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">B -&gt; .@</text>
<text x="10" y="200" font-size="12" text-anchor="start" fill="#1f2937">Kernel: S' -&gt; S. and S -&gt; S.S (the dot moved over S).</text>
<text x="10" y="220" font-size="12" text-anchor="start" fill="#1f2937">Closure: dot before S adds all 5 S-items; dot before A, B adds A -&gt; .d#, B -&gt; .@.</text>
<text x="10" y="240" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">2 kernel + 5 + 2 = 9 items.</text>
</svg>
