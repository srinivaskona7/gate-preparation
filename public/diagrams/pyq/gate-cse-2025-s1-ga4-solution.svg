<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" font-family="sans-serif" font-size="13">
<title>Family tree: R is the mother of siblings P and Q; Q is the parent of daughters S and T, so R is grandmother of S, P is uncle of S and T, and Q has two daughters</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="182" y="22" width="56" height="36" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="210" y="45" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">R</text><text x="210" y="82" text-anchor="middle" fill="#222" font-size="11">mother of Q</text><line x1="195" y1="60" x2="120" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><line x1="225" y1="60" x2="300" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><rect x="92" y="120" width="56" height="36" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="120" y="143" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">P</text><rect x="272" y="120" width="56" height="36" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="143" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Q</text><line x1="120" y1="156" x2="120" y2="156" stroke="#222" stroke-width="1.5"/><text x="120" y="180" text-anchor="middle" fill="#222" font-size="11">brother of Q</text><text x="300" y="180" text-anchor="middle" fill="#222" font-size="11">parent of S, T</text><line x1="285" y1="200" x2="230" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><line x1="315" y1="200" x2="370" y2="250" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/><rect x="202" y="250" width="56" height="36" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="230" y="273" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">S</text><rect x="342" y="250" width="56" height="36" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="370" y="273" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">T</text><text x="230" y="310" text-anchor="middle" fill="#222" font-size="11">daughter of Q</text><text x="370" y="310" text-anchor="middle" fill="#222" font-size="11">sister of S</text><line x1="150" y1="138" x2="270" y2="138" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/><text x="210" y="130" text-anchor="middle" fill="#222" font-size="11">siblings</text>
</svg>
