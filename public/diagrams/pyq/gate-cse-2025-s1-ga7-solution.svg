<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" font-family="sans-serif">
<title>ST sits halfway up the height h, so triangle PST is similar to PQR at half scale: area 1 unit out of 4, trapezium 3 units</title>
<polygon points="150,20 20,200 280,200" fill="none" stroke="#222" stroke-width="2"/>
<line x1="85.0" y1="110" x2="215.0" y2="110" stroke="#222" stroke-width="2"/>
<g fill="#222" font-size="14"><text x="145" y="14">P</text><text x="67.0" y="108">S</text><text x="221.0" y="108">T</text><text x="8" y="215">Q</text><text x="285" y="215">R</text></g><polygon points="150,20 85.0,110 215.0,110" fill="#d9d9d9" stroke="#222" stroke-width="2"/>
<line x1="150" y1="20" x2="150" y2="200" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="156" y="68" font-size="12" fill="#222">h/2</text><text x="156" y="160" font-size="12" fill="#222">h/2</text>
<text x="156" y="190" font-size="12" fill="#222">trapezium: 3 units</text><text x="144" y="90" font-size="12" text-anchor="end" fill="#222">PST:</text><text x="144" y="103" font-size="12" text-anchor="end" fill="#222">1 unit</text>
</svg>
