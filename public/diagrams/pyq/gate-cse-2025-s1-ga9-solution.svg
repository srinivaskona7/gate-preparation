<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Unfolded square: four edge triangles, two squares and two L shapes</title>
<rect x="20" y="20" width="200" height="200" /><line x1="20" y1="20" x2="220" y2="220" stroke-dasharray="6 3"/><line x1="220" y1="20" x2="20" y2="220" stroke-dasharray="6 3"/><polygon points="114,33 126,33 120,21" fill="#222"/><polygon points="114,207 126,207 120,219" fill="#222"/><polygon points="33,114 33,126 21,120" fill="#222"/><polygon points="207,114 207,126 219,120" fill="#222"/><rect x="45" y="45" width="14" height="14" fill="#222"/><rect x="181" y="181" width="14" height="14" fill="#222"/><polygon points="180,45 197,45 197,50 186,50 186,62 180,62" fill="#222"/><polygon points="43,180 49,180 49,193 60,193 60,198 43,198" fill="#222"/><text x="240" y="60" fill="#222" stroke="none" font-size="12">Dashed lines: the two creases.</text><text x="240" y="82" fill="#222" stroke="none" font-size="12">Triangles: one per edge midpoint,</text><text x="240" y="100" fill="#222" stroke="none" font-size="12">apex towards the paper edge.</text><text x="240" y="126" fill="#222" stroke="none" font-size="12">Squares: on one diagonal crease.</text><text x="240" y="144" fill="#222" stroke="none" font-size="12">L shapes: on the other crease.</text><text x="240" y="170" fill="#222" stroke="none" font-size="12" font-weight="bold">Pattern matches option (A).</text>
</svg>
