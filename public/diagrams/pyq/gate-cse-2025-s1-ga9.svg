<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 160" width="470" height="160" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>GATE CSE 2025 Set 1 GA 9: square folded twice then cut</title>
<rect x="10" y="20" width="70" height="70" /><text x="45" y="110" fill="#222" stroke="none" text-anchor="middle">(I)</text><rect x="110" y="20" width="70" height="70" /><line x1="110" y1="20" x2="180" y2="90" stroke-dasharray="6 3"/><text x="145" y="110" fill="#222" stroke="none" text-anchor="middle" font-size="11">(II) fold on diagonal</text><polygon points="220,20 290,20 290,90" /><line x1="290" y1="20" x2="255" y2="55" stroke-dasharray="6 3"/><text x="255" y="110" fill="#222" stroke="none" text-anchor="middle" font-size="11">(III) fold on altitude</text><polygon points="330,20 440,20 385,75" /><polygon points="380,22 388,22 384,30" fill="#222"/><polygon points="342,32 354,32 354,44" fill="#222"/><rect x="412" y="30" width="10" height="5" fill="#222"/><text x="385" y="110" fill="#222" stroke="none" text-anchor="middle" font-size="11">(IV) three cuts</text><text x="10" y="132" fill="#222" stroke="none" font-size="12">Cuts in (IV): triangle on the long edge, right triangle on</text><text x="10" y="148" fill="#222" stroke="none" font-size="12">one short edge, bar on the other short edge.</text>
