<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="sans-serif" font-size="13">
<title>Dirty reads: T2 and T3 read Y written by T1 before T1 aborts</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="70" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T1</text><text x="280" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T2</text><text x="470" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">T3</text><rect x="30" y="50" width="80" height="30" fill="#fff" stroke="#222"/><text x="70" y="71" text-anchor="middle" font-size="13" fill="#111">R1(X)</text><rect x="30" y="100" width="80" height="30" fill="#fff" stroke="#222"/><text x="70" y="121" text-anchor="middle" font-size="13" fill="#111">W1(Y)</text><rect x="240" y="50" width="80" height="30" fill="#fff" stroke="#222"/><text x="280" y="71" text-anchor="middle" font-size="13" fill="#111">R2(X)</text><rect x="240" y="100" width="80" height="30" fill="#fff" stroke="#222"/><text x="280" y="121" text-anchor="middle" font-size="13" fill="#111">R2(Y)</text><rect x="430" y="150" width="80" height="30" fill="#fff" stroke="#222"/><text x="470" y="171" text-anchor="middle" font-size="13" fill="#111">R3(Y)</text><rect x="30" y="190" width="80" height="30" fill="#fff" stroke="#222" stroke-dasharray="4 3"/><text x="70" y="211" text-anchor="middle" font-size="13" fill="#111">ABORT(T1)</text><path d="M110,115 L238,115" stroke="#222" stroke-width="1.6" marker-end="url(#ah)" fill="none"/><path d="M100,130 L100,165 L428,165" stroke="#222" stroke-width="1.6" marker-end="url(#ah)" fill="none"/><text x="180" y="108" text-anchor="middle" font-size="12" fill="#111">dirty read of Y</text><text x="270" y="159" text-anchor="middle" font-size="12" fill="#111">dirty read of Y</text><g font-size="11" fill="#555"><text x="22" y="71" text-anchor="end">1</text><text x="22" y="121" text-anchor="end">2</text><text x="326" y="71">3</text><text x="326" y="121">4</text><text x="516" y="171">5</text><text x="22" y="211" text-anchor="end">6</text></g><text x="330" y="192" text-anchor="middle" font-size="12" fill="#111">both read the uncommitted W1(Y): both roll back</text>
</svg>