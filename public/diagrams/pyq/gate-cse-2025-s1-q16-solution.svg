<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="sans-serif" font-size="12">
<title>OSI layers matched to their functions: network routes packets, transport links host to host, data link frames</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="20" y="20" width="200" height="50"/><rect x="20" y="85" width="200" height="50"/><rect x="20" y="150" width="200" height="50"/>
<path d="M220 45 H320" /><path d="M220 110 H320"/><path d="M220 175 H320"/>
<rect x="320" y="20" width="220" height="50"/><rect x="320" y="85" width="220" height="50"/><rect x="320" y="150" width="220" height="50"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="120" y="50">(a) Network layer</text><text x="120" y="115">(b) Transport layer</text><text x="120" y="180">(c) Data link layer</text>
<text x="430" y="50">(I) Packet routing</text><text x="430" y="115">(III) Host to host communication</text><text x="430" y="180">(II) Framing and error handling</text>
