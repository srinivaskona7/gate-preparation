<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" font-family="sans-serif">
<title>Triangle where the minimum spanning tree path is longer than the direct edge</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#222"/></marker></defs>
<line x1="73.01973553930776" y1="130.70018890049445" x2="186.98026446069224" y2="49.29981109950554" stroke="#222" stroke-width="4"/>
<text x="123.02514167537085" y="84.23519834551918" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1</text>
<line x1="213.01973553930776" y1="49.29981109950554" x2="326.98026446069224" y2="130.70018890049445" stroke="#222" stroke-width="4"/>
<text x="276.97485832462917" y="84.23519834551918" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1.5</text>
<line x1="76.0" y1="140.0" x2="324.0" y2="140.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="200.0" y="132.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2</text>
<circle cx="60" cy="140" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="144" text-anchor="middle" font-size="13" fill="#222">u</text>
<circle cx="340" cy="140" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="340" y="144" text-anchor="middle" font-size="13" fill="#222">v</text>
<circle cx="200" cy="40" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="200" y="44" text-anchor="middle" font-size="13" fill="#222">w</text>
<text x="210" y="185" text-anchor="middle" font-size="12" fill="#222">In G: d1(u,v) = 2.  In T (thick): d2(u,v) = 2.5.  So d1 &lt;= d2, not equal.</text>
