<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Derivations in S -&gt; aaB | Abb: the family a a b^n from aaB and the family a^n b b from Abb</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Branch S → aaB, with B → b | bB    (n = 3 shown)</text>
<text x="60" y="62" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">S</text>
<line x1="98" y1="57" x2="152" y2="57" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="190" y="62" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aaB</text>
<line x1="228" y1="57" x2="282" y2="57" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="320" y="62" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aabB</text>
<line x1="358" y1="57" x2="412" y2="57" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="450" y="62" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aabbB</text>
<line x1="488" y1="57" x2="542" y2="57" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="580" y="62" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aabbb</text>
<text x="20" y="90" text-anchor="start" font-size="13" fill="#222">Result: two a, then one or more b: a² bⁿ, n ≥ 1</text>
<line x1="20" y1="112" x2="640" y2="112" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="140" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Branch S → Abb, with A → a | aA    (n = 3 shown)</text>
<text x="60" y="176" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">S</text>
<line x1="98" y1="171" x2="152" y2="171" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="190" y="176" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">Abb</text>
<line x1="228" y1="171" x2="282" y2="171" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="320" y="176" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aAbb</text>
<line x1="358" y1="171" x2="412" y2="171" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="450" y="176" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aaAbb</text>
<line x1="488" y1="171" x2="542" y2="171" stroke="#222" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="580" y="176" text-anchor="middle" font-size="16" fill="#222" font-family="monospace">aaabb</text>
<text x="20" y="204" text-anchor="start" font-size="13" fill="#222">Result: one or more a, then two b: aⁿ b², n ≥ 1</text>
<line x1="20" y1="226" x2="640" y2="226" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="254" text-anchor="start" font-size="13" fill="#222" font-weight="bold">L(G) = { a² bⁿ | n ≥ 1 } ∪ { aⁿ b² | n ≥ 1 }  →  option (A)</text>
<text x="20" y="278" text-anchor="start" font-size="12" fill="#222">The two branches never tie the number of a to the number of b: a b² and a² b are in L(G), a b is not.</text>
<text x="20" y="298" text-anchor="start" font-size="12" fill="#222">aabb is in both branches. That is fine for a union, and it makes G ambiguous, which the question does not ask about.</text>
</svg>
