<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="sans-serif" font-size="13">
<title>Left: BST built from 1, 2, 3, 4 in ascending order is a chain with longest path 3 = n - 1 edges, and finding 4 takes 4 comparisons. Right: BST 2 with children 1 and 3 has inorder 1 2 3 (sorted) but the root 2 is larger than its child 1, so it is not a min-heap</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="60" cy="40" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="60" y="44.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="94" cy="92" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="94" y="96.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="128" cy="144" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="128" y="148.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<circle cx="162" cy="196" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="162" y="200.42" text-anchor="middle" fill="#222" font-size="13">4</text>
<line x1="68.2" y1="52.6" x2="85.8" y2="79.4" stroke="#222" stroke-width="3.4"/>
<line x1="102.2" y1="104.6" x2="119.8" y2="131.4" stroke="#222" stroke-width="3.4"/>
<line x1="136.2" y1="156.6" x2="153.8" y2="183.4" stroke="#222" stroke-width="3.4"/>
<text x="190" y="70" text-anchor="start" fill="#222" font-size="12">insert 1, 2, 3, 4 in order</text>
<text x="190" y="90" text-anchor="start" fill="#222" font-size="12" font-weight="bold">longest path = n - 1 = 3 edges</text>
<text x="190" y="110" text-anchor="start" fill="#222" font-size="12">(A) true</text>
<text x="190" y="146" text-anchor="start" fill="#222" font-size="12">search for 4: 4 comparisons</text>
<text x="190" y="166" text-anchor="start" fill="#222" font-size="12">so search is Theta(n) worst case,</text>
<text x="190" y="186" text-anchor="start" fill="#222" font-size="12">not O(log n)    (C) false</text>
<circle cx="540" cy="50" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="540" y="54.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="500" cy="110" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="500" y="114.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="580" cy="110" r="15" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="580" y="114.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="531.7" y1="62.5" x2="508.3" y2="97.5" stroke="#222" stroke-width="1.6"/>
<line x1="548.3" y1="62.5" x2="571.7" y2="97.5" stroke="#222" stroke-width="1.6"/>
<text x="620" y="52" text-anchor="start" fill="#222" font-size="12" font-weight="bold">inorder 1 2 3</text>
<text x="620" y="70" text-anchor="start" fill="#222" font-size="12">sorted: (B) true</text>
<text x="620" y="112" text-anchor="start" fill="#222" font-size="12">root 2 &gt; child 1</text>
<text x="620" y="130" text-anchor="start" fill="#222" font-size="12">not a min-heap: (D) false</text>
<text x="350" y="252" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">True statements: A and B</text>
</svg>
