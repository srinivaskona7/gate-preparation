<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5">
<title>All four mux settings reach the ALU: register-register, register-immediate, immediate-register, immediate-immediate</title>
<text x="10" y="22" fill="#222" stroke="none" font-weight="bold">Select A</text><text x="130" y="22" fill="#222" stroke="none" font-weight="bold">Select B</text><text x="250" y="22" fill="#222" stroke="none" font-weight="bold">ALU operands</text><text x="420" y="22" fill="#222" stroke="none" font-weight="bold">Option</text>
<path d="M5 30H510"/>
<text x="10" y="58" fill="#222" stroke="none">RA</text><text x="130" y="58" fill="#222" stroke="none">RB</text><text x="250" y="58" fill="#222" stroke="none">two registers</text><text x="420" y="58" fill="#222" stroke="none">(A) true</text>
<text x="10" y="98" fill="#222" stroke="none">RA</text><text x="130" y="98" fill="#222" stroke="none">immediate</text><text x="250" y="98" fill="#222" stroke="none">register + immediate</text><text x="420" y="98" fill="#222" stroke="none">(B) true</text>
<text x="10" y="138" fill="#222" stroke="none">immediate</text><text x="130" y="138" fill="#222" stroke="none">RB</text><text x="250" y="138" fill="#222" stroke="none">immediate + register</text><text x="420" y="138" fill="#222" stroke="none">(B) true</text>
<text x="10" y="178" fill="#222" stroke="none">immediate</text><text x="130" y="178" fill="#222" stroke="none">immediate</text><text x="250" y="178" fill="#222" stroke="none">two immediates</text><text x="420" y="178" fill="#222" stroke="none">(C) true</text>
<text x="10" y="215" fill="#222" stroke="none">(D) says "only register + immediate": false, rows 1 and 4 exist.</text>
</svg>
