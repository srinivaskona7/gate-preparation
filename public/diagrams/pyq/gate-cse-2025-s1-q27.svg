<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="sans-serif" font-size="12" fill="none" stroke="#222" stroke-width="1.5">
<title>Partial data path: RA and RB each feed a multiplexer that can instead pick a 32-bit immediate, then the ALU writes RZ</title>
<rect x="190" y="10" width="90" height="34"/><text x="235" y="32" text-anchor="middle" fill="#222" stroke="none">RA (32 bit)</text>
<rect x="340" y="10" width="90" height="34"/><text x="385" y="32" text-anchor="middle" fill="#222" stroke="none">RB (32 bit)</text>
<text x="10" y="70" fill="#222" stroke="none">immediate value (32 bit)</text>
<text x="450" y="70" fill="#222" stroke="none">immediate value (32 bit)</text>
<path d="M235 44V105M10 80H175V105M385 44V105M450 80H400V105"/>
<path d="M175 105H295L280 135H190Z"/><text x="235" y="124" text-anchor="middle" fill="#222" stroke="none">Mux_A</text>
<path d="M325 105H445L430 135H340Z"/><text x="385" y="124" text-anchor="middle" fill="#222" stroke="none">Mux_B</text>
<text x="10" y="124" fill="#222" stroke="none">Select RA/immediate</text><path d="M140 120H182"/>
<text x="455" y="124" fill="#222" stroke="none">Select RB/immediate</text><path d="M450 120H438"/>
<path d="M235 135V190M385 135V190"/>
<path d="M170 190H450L400 250H220Z"/><text x="310" y="225" text-anchor="middle" fill="#222" stroke="none">ALU</text>
<text x="10" y="215" fill="#222" stroke="none">ALU control</text><path d="M80 211H185"/>
<path d="M310 250V285"/><rect x="265" y="285" width="90" height="34"/><text x="310" y="307" text-anchor="middle" fill="#222" stroke="none">RZ (32 bit)</text>
</svg>
