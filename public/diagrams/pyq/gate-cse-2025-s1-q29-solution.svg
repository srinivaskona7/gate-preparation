<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" font-family="sans-serif" font-size="13">
<title>Each of the 21 I/O calls sends the process to the I/O queue and back to the ready queue, giving 21 entries</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="380" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Every I/O call is one trip: Running, I/O queue, Ready queue</text>
<rect x="40" y="60" width="170" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="125" y="84" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Ready queue</text>
<text x="125" y="102" text-anchor="middle" fill="#222" font-size="12">waits for the CPU</text>
<rect x="295" y="60" width="170" height="56" rx="6" fill="none" stroke="#222" stroke-width="2.2"/>
<text x="380" y="84" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Running</text>
<text x="380" y="102" text-anchor="middle" fill="#222" font-size="12">on the CPU</text>
<rect x="550" y="60" width="170" height="56" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="635" y="84" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">I/O queue</text>
<text x="635" y="102" text-anchor="middle" fill="#222" font-size="12">waits for the device</text>
<path d="M210,80 L295,80" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="252" y="72" text-anchor="middle" fill="#222" font-size="11">dispatch</text>
<path d="M465,80 L550,80" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="507" y="72" text-anchor="middle" fill="#222" font-size="11">I/O request</text>
<path d="M635,116 C635,170 125,170 125,118" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="380" y="168" text-anchor="middle" fill="#222" font-size="12">I/O completes: process enters the Ready queue (counted)</text>
<text x="380" y="206" text-anchor="middle" fill="#222" font-size="12">The process makes 1 + 20 I/O calls: scanf once, printf 20 times. Entries to the Ready queue after the start:</text>
<circle cx="52" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="52" y="248" text-anchor="middle" fill="#222" font-size="11">1</text>
<circle cx="85.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="85.5" y="248" text-anchor="middle" fill="#222" font-size="11">2</text>
<circle cx="119" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="119" y="248" text-anchor="middle" fill="#222" font-size="11">3</text>
<circle cx="152.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="152.5" y="248" text-anchor="middle" fill="#222" font-size="11">4</text>
<circle cx="186" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="186" y="248" text-anchor="middle" fill="#222" font-size="11">5</text>
<circle cx="219.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="219.5" y="248" text-anchor="middle" fill="#222" font-size="11">6</text>
<circle cx="253" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="253" y="248" text-anchor="middle" fill="#222" font-size="11">7</text>
<circle cx="286.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="286.5" y="248" text-anchor="middle" fill="#222" font-size="11">8</text>
<circle cx="320" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="320" y="248" text-anchor="middle" fill="#222" font-size="11">9</text>
<circle cx="353.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="353.5" y="248" text-anchor="middle" fill="#222" font-size="11">10</text>
<circle cx="387" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="387" y="248" text-anchor="middle" fill="#222" font-size="11">11</text>
<circle cx="420.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="420.5" y="248" text-anchor="middle" fill="#222" font-size="11">12</text>
<circle cx="454" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="454" y="248" text-anchor="middle" fill="#222" font-size="11">13</text>
<circle cx="487.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="487.5" y="248" text-anchor="middle" fill="#222" font-size="11">14</text>
<circle cx="521" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="521" y="248" text-anchor="middle" fill="#222" font-size="11">15</text>
<circle cx="554.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="554.5" y="248" text-anchor="middle" fill="#222" font-size="11">16</text>
<circle cx="588" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="588" y="248" text-anchor="middle" fill="#222" font-size="11">17</text>
<circle cx="621.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="621.5" y="248" text-anchor="middle" fill="#222" font-size="11">18</text>
<circle cx="655" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="655" y="248" text-anchor="middle" fill="#222" font-size="11">19</text>
<circle cx="688.5" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="688.5" y="248" text-anchor="middle" fill="#222" font-size="11">20</text>
<circle cx="722" cy="244" r="13" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="722" y="248" text-anchor="middle" fill="#222" font-size="11">21</text>
<text x="52" y="274" text-anchor="middle" fill="#222" font-size="11">scanf</text>
<text x="387" y="274" text-anchor="middle" fill="#222" font-size="11">printf 10</text>
<text x="722" y="274" text-anchor="middle" fill="#222" font-size="11">printf 20</text>
<text x="380" y="306" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">The initial entry (the first time the process is run) is not counted. Total: 21.</text>
</svg>
