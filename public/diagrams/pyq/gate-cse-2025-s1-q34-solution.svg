<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" font-family="sans-serif" font-size="13">
<title>Frames of main and foo: p in foo is a copy of the pointer z, both point to a, and *p = x stores 25 into a, so printf prints 25</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">foo(z, b) copies both arguments, but the copy of z still holds the address of a</text>
<rect x="20" y="36" width="260" height="150" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="30" y="54" fill="#222" font-size="12" font-weight="bold">main frame</text>
<rect x="40" y="70" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="84" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">a</text><text x="75" y="98" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">20 -&gt; 25</text>
<rect x="130" y="70" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="165" y="84" fill="#222" text-anchor="middle" font-size="12">b</text><text x="165" y="98" fill="#222" text-anchor="middle" font-size="12">25</text>
<rect x="40" y="130" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="151" fill="#222" text-anchor="middle">z</text>
<path d="M75,130 L75,106" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="330" y="36" width="250" height="150" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="340" y="54" fill="#222" font-size="12" font-weight="bold">foo frame</text>
<rect x="350" y="130" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="385" y="151" fill="#222" text-anchor="middle">p</text>
<rect x="450" y="130" width="70" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="485" y="151" fill="#222" text-anchor="middle">x = 25</text>
<path d="M385,130 L100,100" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="205" y="160" fill="#222" text-anchor="middle" font-size="11">*p = x stores 25 in a</text>
<text x="20" y="214" fill="#222" font-size="12">p and x are copies of z and b. Writing through p changes the object it points to: a. printf prints a = 25.</text>
</svg>
