<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>Levels of a heap with 32 keys: level 0 has 1 node, level 1 has 2, level 2 has 4, level 3 has 8, level 4 has 16 and level 5 has the single node 32, so the height is 5</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="46" text-anchor="start" fill="#222" font-size="12">level 0</text>
<rect x="100" y="30" width="20" height="24" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="130" y="46" text-anchor="start" fill="#222" font-size="12">indices 1  (1 node)</text>
<text x="20" y="84" text-anchor="start" fill="#222" font-size="12">level 1</text>
<rect x="100" y="68" width="40" height="24" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="150" y="84" text-anchor="start" fill="#222" font-size="12">indices 2 - 3  (2 nodes)</text>
<text x="20" y="122" text-anchor="start" fill="#222" font-size="12">level 2</text>
<rect x="100" y="106" width="80" height="24" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="190" y="122" text-anchor="start" fill="#222" font-size="12">indices 4 - 7  (4 nodes)</text>
<text x="20" y="160" text-anchor="start" fill="#222" font-size="12">level 3</text>
<rect x="100" y="144" width="160" height="24" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="270" y="160" text-anchor="start" fill="#222" font-size="12">indices 8 - 15  (8 nodes)</text>
<text x="20" y="198" text-anchor="start" fill="#222" font-size="12">level 4</text>
<rect x="100" y="182" width="320" height="24" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="430" y="198" text-anchor="start" fill="#222" font-size="12">indices 16 - 31  (16 nodes)</text>
<text x="20" y="236" text-anchor="start" fill="#222" font-size="12">level 5</text>
<rect x="100" y="220" width="20" height="24" rx="0" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="130" y="236" text-anchor="start" fill="#222" font-size="12">indices 32  (1 node)</text>
<text x="20" y="274" text-anchor="start" fill="#222" font-size="12">Levels fill from the top: 1+2+4+8+16 = 31 keys fill levels 0 to 4, the 32nd key starts level 5.</text>
<text x="20" y="292" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Height = deepest level = floor(log2 32) = 5.</text>
</svg>
