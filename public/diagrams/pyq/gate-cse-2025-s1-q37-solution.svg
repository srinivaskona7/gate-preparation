<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" font-family="sans-serif" font-size="13">
<title>The 32-bit ADD format: 6-bit opcode, 6-bit register, 20-bit immediate</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="#222" font-weight="bold">6 + 6 + 20 = 32 bits</text><rect x="20" y="40" width="108" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="74" y="55" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="74" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="128" y="40" width="108" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="182" y="55" text-anchor="middle" fill="#222" font-size="12">register</text><text x="182" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="236" y="40" width="360" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="416" y="55" text-anchor="middle" fill="#222" font-size="12">immediate</text><text x="416" y="67" text-anchor="middle" fill="#222" font-size="10">20 b</text><text x="20" y="100" text-anchor="start" fill="#222" font-size="12">ADD R1, #25 names one register, so the immediate gets 32 - 6 - 6 = 20 bits.</text>
</svg>
