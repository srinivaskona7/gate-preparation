<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 256" font-family="sans-serif" font-size="13">
<title>Gantt chart for two processors: M1 runs P1 then P4, M2 runs P2 then P3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="30" y="24" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Processor M1 (priority P1 &gt; P3 &gt; P2 &gt; P4)</text>
<rect x="30" y="42" width="331.707" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="195.854" y="64" text-anchor="middle" fill="#222" font-size="13">P1</text>
<rect x="361.707" y="42" width="165.854" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="444.634" y="64" text-anchor="middle" fill="#222" font-size="13">P4</text>
<path d="M30,76 L30,83" stroke="#222" stroke-width="1"/>
<text x="30" y="97" text-anchor="middle" fill="#222" font-size="11">0</text>
<path d="M361.707,76 L361.707,83" stroke="#222" stroke-width="1"/>
<text x="361.707" y="97" text-anchor="middle" fill="#222" font-size="11">20</text>
<path d="M527.561,76 L527.561,83" stroke="#222" stroke-width="1"/>
<text x="527.561" y="97" text-anchor="middle" fill="#222" font-size="11">30</text>
<text x="30" y="122" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Processor M2 (priority P2 &gt; P3 &gt; P4 &gt; P1)</text>
<rect x="30" y="140" width="265.366" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="162.683" y="162" text-anchor="middle" fill="#222" font-size="13">P2</text>
<rect x="295.366" y="140" width="414.634" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="502.683" y="162" text-anchor="middle" fill="#222" font-size="13">P3</text>
<path d="M30,174 L30,181" stroke="#222" stroke-width="1"/>
<text x="30" y="195" text-anchor="middle" fill="#222" font-size="11">0</text>
<path d="M295.366,174 L295.366,181" stroke="#222" stroke-width="1"/>
<text x="295.366" y="195" text-anchor="middle" fill="#222" font-size="11">16</text>
<path d="M710,174 L710,181" stroke="#222" stroke-width="1"/>
<text x="710" y="195" text-anchor="middle" fill="#222" font-size="11">41</text>
<text x="30" y="216" text-anchor="start" fill="#222" font-size="12">Waiting time = start time: P1 0, P2 0, P3 16, P4 20</text>
<text x="30" y="233" text-anchor="start" fill="#222" font-size="12">Sum = 36, mean = 9</text>
</svg>
