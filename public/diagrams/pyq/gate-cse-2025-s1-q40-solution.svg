<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" font-family="sans-serif" font-size="13">
<title>Third octet 0 to 255: the /16, /17 and /18 prefixes that could match 109, and the one that wins</title>
<text x="10" y="60" text-anchor="start" fill="#222" font-size="12">145.36.0.0/16 : E1</text>
<rect x="170.0" y="40" width="602.4" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="102" text-anchor="start" fill="#222" font-size="12">145.36.128.0/17 : E2</text>
<rect x="471.2" y="82" width="301.2" height="30" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="10" y="144" text-anchor="start" fill="#222" font-size="12">145.36.64.0/18 : E3</text>
<rect x="320.6" y="124" width="150.6" height="30" fill="#dde" stroke="#222" stroke-width="2"/>
<line x1="427.6" y1="30" x2="427.6" y2="166" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="427.6" y="182" text-anchor="middle" fill="#222" font-size="12">109</text>
<text x="170" y="202" text-anchor="start" fill="#222" font-size="12">Third octet of the destination 145.36.109.70 (shaded block is the longest match)</text>
<text x="10" y="226" text-anchor="start" fill="#222" font-size="12">/17 covers 128 to 255, so 109 is outside it. /16 and /18 both match; /18 is longer, so E3.</text>
</svg>
