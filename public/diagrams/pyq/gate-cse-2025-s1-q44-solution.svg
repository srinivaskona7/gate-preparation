<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif" font-size="13">
<title>Minimal DFA for L2 = strings that start with a, end with a and have length at least 3: five states, accepting state q3</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="70" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="70" y="114" text-anchor="middle" font-size="12" fill="#222">q0</text>
<line x1="18" y1="110" x2="51" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="205" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="205" y="114" text-anchor="middle" font-size="12" fill="#222">q1</text>
<circle cx="340" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="340" y="114" text-anchor="middle" font-size="12" fill="#222">q2</text>
<circle cx="480" cy="110" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="480" cy="110" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="480" y="114" text-anchor="middle" font-size="12" fill="#222">q3</text>
<circle cx="70" cy="240" r="22" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="70" y="244" text-anchor="middle" font-size="10" fill="#222">dead</text>
<line x1="88.0" y1="110.0" x2="186.0" y2="110.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="137.0" y="100.0" text-anchor="middle" font-size="12" fill="#222">a</text>
<line x1="70.0" y1="128.0" x2="70.0" y2="217.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="59.0" y="176.5" text-anchor="middle" font-size="12" fill="#222">b</text>
<line x1="223.0" y1="110.0" x2="321.0" y2="110.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="272.0" y="100.0" text-anchor="middle" font-size="12" fill="#222">a, b</text>
<line x1="358.0" y1="104.0" x2="461.0" y2="104.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="410.0" y="94.0" text-anchor="middle" font-size="12" fill="#222">a</text>
<path d="M466,124 Q410,170 354,124" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="410" y="160" text-anchor="middle" font-size="12" fill="#222">b</text>
<path d="M331,94 C310,58 370,58 349,94" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="340" y="61" text-anchor="middle" font-size="12" fill="#222">b</text>
<path d="M471,94 C450,58 510,58 489,94" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="480" y="61" text-anchor="middle" font-size="12" fill="#222">a</text>
<path d="M61,260 C40,296 100,296 79,260" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="70" y="304" text-anchor="middle" font-size="12" fill="#222">a, b</text>
<text x="320" y="207" text-anchor="middle" font-size="12" fill="#222">q1: just "a"</text>
<text x="320" y="227" text-anchor="middle" font-size="12" fill="#222">q2: starts with a, length 2, or length 3 or more ending in b</text>
<text x="320" y="247" text-anchor="middle" font-size="12" fill="#222">q3: starts and ends with a, length >= 3</text>
<text x="320" y="267" text-anchor="middle" font-size="12" fill="#222">dead: first symbol was b</text>
<text x="320" y="340" text-anchor="middle" font-size="13" fill="#222">L1 is not regular: a b^i a b^j is in L1 exactly when i > j</text>
</svg>
