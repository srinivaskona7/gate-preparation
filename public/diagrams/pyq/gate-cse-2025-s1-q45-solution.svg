<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="sans-serif" font-size="13">
<title>L1 needs three counts at once and fails; L2 nests its arcs, a to the last c and b to the earlier c, and a stack handles it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="13" fill="#222" font-weight="bold">L1 = a^m b^m c^(m+n): string a a b b c c c   (m = 2, n = 1)</text>
<text x="150" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="206" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="262" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="318" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="374" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="430" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="486" y="130" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<path d="M206,108 C206,75.84 262,75.84 262,108" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M150,108 C150,43.67999999999999 318,43.67999999999999 318,108" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="560" y="80" text-anchor="start" font-size="12" fill="#222">a-b arcs use up</text>
<text x="560" y="96" text-anchor="start" font-size="12" fill="#222">the stack</text>
<text x="20" y="162" text-anchor="start" font-size="12" fill="#222">After a^m b^m the stack is empty. The c-block must be longer than m, but m is gone.</text>
<text x="20" y="180" text-anchor="start" font-size="12" fill="#222">Pumping a^p b^p c^(p+1): a pumped part touches at most two of the three blocks, which breaks a = b or c &gt; a.</text>
<line x1="20" y1="204" x2="640" y2="204" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="232" text-anchor="start" font-size="13" fill="#222" font-weight="bold">L2 = a^m b^n c^(m+n): string a b b c c c   (m = 1, n = 2)</text>
<text x="150" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="206" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="262" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="318" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="374" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="430" y="360" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<path d="M262,338 C262,308.52 318,308.52 318,338" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M206,338 C206,279.04 374,279.04 374,338" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M150,338 C150,249.56 430,249.56 430,338" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500" y="290" text-anchor="start" font-size="12" fill="#222">b-c and a-c arcs nest:</text>
<text x="500" y="306" text-anchor="start" font-size="12" fill="#222">a is the outermost</text>
<text x="20" y="404" text-anchor="start" font-size="12" fill="#222">Push one X per a and one per b, pop one X per c. The stack empties exactly when #c = #a + #b.</text>
<text x="20" y="430" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Grammar: S → a S c | a T c,  T → b T c | b c.   L1 is not context-free, L2 is: option (C).</text>
</svg>
