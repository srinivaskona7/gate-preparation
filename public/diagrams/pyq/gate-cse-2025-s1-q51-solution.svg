<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Linked allocation of a 1 MB file in 64 KB blocks: 16 full blocks of 65532 data bytes, a 17th block with 64 data bytes and 65468 bytes unused</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<g fill="none" stroke-width="1.5">
<rect x="10" y="40" width="130" height="40"/><rect x="140" y="40" width="40" height="40"/>
<rect x="220" y="40" width="130" height="40"/><rect x="350" y="40" width="40" height="40"/>
<rect x="470" y="40" width="130" height="40"/><rect x="600" y="40" width="40" height="40"/>
<path d="M180 60 H220" marker-end="url(#a)"/><path d="M390 60 H425" marker-end="url(#a)"/><path d="M455 60 H470" marker-end="url(#a)"/>
<rect x="10" y="150" width="60" height="40" fill="#bbb"/><rect x="70" y="150" width="520" height="40" stroke-dasharray="5 3"/>
<rect x="590" y="150" width="50" height="40"/>
</g>
<g stroke="none" text-anchor="middle">
<text x="75" y="65">block 1 data</text><text x="160" y="65" font-size="11">link 4 B</text>
<text x="285" y="65">block 2 data</text><text x="370" y="65" font-size="11">link 4 B</text>
<text x="440" y="65">...</text>
<text x="535" y="65">block 16 data</text><text x="620" y="65" font-size="11">link 4 B</text>
<text x="40" y="174" font-size="11">64 B data</text>
<text x="330" y="174">unused: 65532 - 64 = 65468 bytes</text><text x="615" y="174" font-size="11">NULL</text>
</g>
<g stroke="none">
<text x="10" y="26" font-weight="bold">16 blocks x 65532 = 1,048,512 B, 64 B short of 1,048,576 B</text>
<text x="100" y="140" font-weight="bold">block 17</text>
<text x="10" y="216">Each block: 65536 - 4 = 65532 data bytes.  Blocks needed = ceil(1,048,576 / 65532) = 17.</text>
<text x="10" y="240" font-weight="bold">Internal fragmentation = 65532 - 64 = 65468 bytes</text>
</g>
</svg>
