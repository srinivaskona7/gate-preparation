<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 564" font-family="sans-serif">
<title>Six basic blocks of the 3-address code in GATE 2025 CS1 Q52</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="80" y="20" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="34" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B1</text>
<text x="95" y="42" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1001: i = 1</text>
<rect x="80" y="68" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="82" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B2</text>
<text x="95" y="90" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1002: j = 1</text>
<rect x="80" y="116" width="450" height="154" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="130" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B3</text>
<text x="95" y="138" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1003: t1 = 10*i</text>
<text x="95" y="158" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1004: t2 = t1+j</text>
<text x="95" y="178" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1005: t3 = 8*t2</text>
<text x="95" y="198" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1006: t4 = t3-88</text>
<text x="95" y="218" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1007: a[t4] = 0.0</text>
<text x="95" y="238" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1008: j = j+1</text>
<text x="95" y="258" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1009: if j &lt;= 10 goto 1003</text>
<rect x="80" y="284" width="450" height="54" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="298" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B4</text>
<text x="95" y="306" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1010: i = i+1</text>
<text x="95" y="326" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1011: if i &lt;= 10 goto 1002</text>
<rect x="80" y="352" width="450" height="34" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="366" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B5</text>
<text x="95" y="374" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1012: i = 1</text>
<rect x="80" y="400" width="450" height="114" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="74" y="414" font-size="12" text-anchor="end" fill="#222" font-weight="bold">B6</text>
<text x="95" y="422" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1013: t5 = i-1</text>
<text x="95" y="442" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1014: t6 = 88*t5</text>
<text x="95" y="462" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1015: a[t6] = 1.0</text>
<text x="95" y="482" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1016: i = i+1</text>
<text x="95" y="502" font-size="13" text-anchor="start" fill="#222" font-family="monospace">1017: if i &lt;= 10 goto 1013</text>
<text x="10" y="540" font-size="12" text-anchor="start" fill="#b3261e">Leaders: 1001 (first), 1002, 1003, 1013 (jump targets),</text>
<text x="10" y="556" font-size="12" text-anchor="start" fill="#b3261e">1010, 1012 (follow a jump). 6 leaders = 6 blocks.</text>
</svg>
