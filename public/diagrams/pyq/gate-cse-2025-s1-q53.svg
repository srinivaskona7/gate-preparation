<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" font-family="sans-serif" font-size="13" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Memory hierarchy: processor, L1 cache, L2 cache and main memory with hit rates and access times</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2937" stroke="none"/></marker></defs>
<rect x="150" y="10" width="120" height="34"/><text x="210" y="32" text-anchor="middle" fill="#1f2937" stroke="none">Processor</text>
<line x1="210" y1="44" x2="210" y2="70" marker-end="url(#a)"/>
<rect x="110" y="70" width="200" height="56"/>
<text x="210" y="92" text-anchor="middle" fill="#1f2937" stroke="none">L1 cache</text>
<text x="210" y="110" text-anchor="middle" fill="#1f2937" stroke="none">hit rate 95%, access time 10 ns</text>
<line x1="210" y1="126" x2="210" y2="152" marker-end="url(#a)"/>
<rect x="40" y="152" width="340" height="68"/>
<text x="210" y="174" text-anchor="middle" fill="#1f2937" stroke="none">L2 cache</text>
<text x="210" y="192" text-anchor="middle" fill="#1f2937" stroke="none">hit rate 85%</text>
<text x="210" y="210" text-anchor="middle" fill="#1f2937" stroke="none">access time incl. L1 miss penalty = 20 ns</text>
<line x1="210" y1="220" x2="210" y2="246" marker-end="url(#a)"/>
<rect x="20" y="246" width="380" height="64"/>
<text x="210" y="269" text-anchor="middle" fill="#1f2937" stroke="none">Main memory</text>
<text x="210" y="290" text-anchor="middle" fill="#1f2937" stroke="none">access time incl. L1 and L2 miss penalty = 200 ns</text>
</svg>
