<rect x="140" y="104" width="212.30933333333334" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="246.2" y="126" text-anchor="middle" fill="#222" font-size="12">4976</text>
<rect x="352.30933333333337" y="104" width="212.30933333333334" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="458.5" y="126" text-anchor="middle" fill="#222" font-size="12">4976</text>
<rect x="564.6186666666667" y="104" width="212.30933333333334" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="670.8" y="126" text-anchor="middle" fill="#222" font-size="12">4976</text>
<rect x="776.9280000000001" y="104" width="34" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="793.9" y="126" text-anchor="middle" fill="#222" font-size="12">72</text>
<text x="10" y="190" text-anchor="start" fill="#222" font-size="12" font-weight="bold">After R2</text>
<rect x="140" y="168" width="126.976" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="203.5" y="190" text-anchor="middle" fill="#222" font-size="12">2976</text>
<rect x="266.976" y="168" width="85.33333333333333" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
