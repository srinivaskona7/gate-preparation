<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 302" font-family="sans-serif" font-size="13">
<title>Fragments of a 15000-byte payload: 4 at Router-1 (MTU 5000), 7 after Router-2 (MTU 3000)</title>
