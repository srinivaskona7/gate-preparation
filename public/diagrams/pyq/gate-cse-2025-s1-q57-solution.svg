<text x="734.3" y="190" text-anchor="middle" fill="#222" font-size="12">2000</text>
<rect x="776.928" y="168" width="34" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="793.9" y="190" text-anchor="middle" fill="#222" font-size="12">72</text>
<text x="10" y="240" text-anchor="start" fill="#222" font-size="12">Data bytes per fragment, headers not drawn. Each fragment adds a 20-byte header.</text>
<text x="10" y="260" text-anchor="start" fill="#222" font-size="12">R1: payload per fragment 5000 - 20 = 4980, rounded down to 4976. R2: 3000 - 20 = 2980, rounded down to 2976.</text>
<text x="10" y="280" text-anchor="start" fill="#222" font-size="12">Count at the destination: 3 x 2 + 1 = 7.</text>
