<rect x="352.3093333333333" y="168" width="126.976" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="415.8" y="190" text-anchor="middle" fill="#222" font-size="12">2976</text>
<rect x="479.2853333333333" y="168" width="85.33333333333333" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="522.0" y="190" text-anchor="middle" fill="#222" font-size="12">2000</text>
<rect x="564.6186666666666" y="168" width="126.976" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
