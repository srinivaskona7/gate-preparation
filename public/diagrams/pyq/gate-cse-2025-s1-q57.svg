<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" font-family="sans-serif" font-size="13">
<title>Source to Router-1 (MTU 5000 bytes) to Router-2 (MTU 3000 bytes) to Destination</title>
<rect x="10" y="50" width="90" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="55" y="75" text-anchor="middle" fill="#222">Source</text>
<rect x="150" y="50" width="150" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="225" y="68" text-anchor="middle" fill="#222" font-size="12">Router-1</text>
<text x="225" y="83" text-anchor="middle" fill="#222" font-size="11">MTU = 5000 bytes</text>
<rect x="350" y="50" width="150" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="425" y="68" text-anchor="middle" fill="#222" font-size="12">Router-2</text>
<text x="425" y="83" text-anchor="middle" fill="#222" font-size="11">MTU = 3000 bytes</text>
<rect x="560" y="50" width="110" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="615" y="75" text-anchor="middle" fill="#222">Destination</text>
<line x1="100" y1="70" x2="150" y2="70" stroke="#222" stroke-width="1.2"/>
<line x1="300" y1="70" x2="350" y2="70" stroke="#222" stroke-width="1.2"/>
<line x1="500" y1="70" x2="560" y2="70" stroke="#222" stroke-width="1.2"/>
<text x="360" y="125" text-anchor="middle" fill="#222" font-size="12">Message: 15000 bytes sent with IPv4; MTU includes the IP header.</text>
</svg>
