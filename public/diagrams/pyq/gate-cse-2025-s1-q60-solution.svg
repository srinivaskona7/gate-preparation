<text x="280.0" y="44.0" text-anchor="middle" fill="#222" font-size="12">0000</text>
<circle cx="368.3883476483184" cy="76.61165235168156" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="368.3883476483184" y="80.61165235168156" text-anchor="middle" fill="#222" font-size="12">1000</text>
<circle cx="405.0" cy="165.0" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="405.0" y="169.0" text-anchor="middle" fill="#222" font-size="12">1100</text>
<circle cx="368.3883476483185" cy="253.38834764831842" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="368.3883476483185" y="257.3883476483184" text-anchor="middle" fill="#222" font-size="12">1110</text>
<circle cx="280.0" cy="290.0" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="280.0" y="294.0" text-anchor="middle" fill="#222" font-size="12">1111</text>
<circle cx="191.61165235168158" cy="253.38834764831847" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="191.61165235168158" y="257.3883476483185" text-anchor="middle" fill="#222" font-size="12">0111</text>
<circle cx="155.0" cy="165.00000000000003" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="155.0" y="169.00000000000003" text-anchor="middle" fill="#222" font-size="12">0011</text>
<circle cx="191.61165235168153" cy="76.61165235168158" r="30" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="191.61165235168153" y="80.61165235168158" text-anchor="middle" fill="#222" font-size="12">0001</text>
<path d="M307.7,51.5 Q324.2,58.3 337.0,63.6" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M379.9,104.3 Q386.7,120.8 392.0,133.6" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M393.5,192.7 Q386.7,209.2 381.4,222.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M340.7,264.9 Q324.2,271.7 311.4,277.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M252.3,278.5 Q235.8,271.7 223.0,266.4" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M180.1,225.7 Q173.3,209.2 168.0,196.4" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M166.5,137.3 Q173.3,120.8 178.6,108.0" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
