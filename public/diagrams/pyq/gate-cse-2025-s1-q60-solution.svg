<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="sans-serif" font-size="13">
<title>The four-bit Johnson counter cycles through eight states Q0Q1Q2Q3 and returns to 0000 after the eighth clock: 0000, 1000, 1100, 1110, 1111, 0111, 0011, 0001</title>
