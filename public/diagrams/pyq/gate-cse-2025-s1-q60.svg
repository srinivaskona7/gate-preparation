<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif" font-size="13">
<title>Four D flip-flops D0 to D3 in a row sharing one clock; Q0 feeds D1, Q1 feeds D2, Q2 feeds D3, and the complement of Q3 feeds D0</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="70" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="92" y="122" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">D0</text>
<polyline points="70,130 81,138 70,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="130" y="90" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="128" y="136" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<line x1="140" y1="90" x2="170" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="155" y="83" text-anchor="middle" fill="#222" font-size="11">Q0</text>
<rect x="170" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="192" y="122" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">D1</text>
<polyline points="170,130 181,138 170,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="230" y="90" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="228" y="136" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<line x1="240" y1="90" x2="270" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="255" y="83" text-anchor="middle" fill="#222" font-size="11">Q1</text>
<rect x="270" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="292" y="122" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">D2</text>
<polyline points="270,130 281,138 270,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="330" y="90" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="328" y="136" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<line x1="340" y1="90" x2="370" y2="90" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="355" y="83" text-anchor="middle" fill="#222" font-size="11">Q2</text>
<rect x="370" y="70" width="70" height="90" rx="0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="392" y="122" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">D3</text>
<polyline points="370,130 381,138 370,146" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="430" y="90" text-anchor="middle" fill="#222" font-size="12">Q</text>
<text x="428" y="136" text-anchor="middle" fill="#222" font-size="12">Q'</text>
<line x1="440" y1="90" x2="470" y2="90" stroke="#222" stroke-width="1.6"/>
<text x="455" y="83" text-anchor="middle" fill="#222" font-size="11">Q3</text>
<line x1="440" y1="136" x2="485" y2="136" stroke="#222" stroke-width="1.6"/>
<polyline points="485,136 485,20 40,20 40,90 70,90" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="450" y="152" text-anchor="start" fill="#222" font-size="11">Q3'</text>
<line x1="440" y1="90" x2="465" y2="90" stroke="#222" stroke-width="1.6"/>
<text x="470" y="94" text-anchor="start" fill="#222" font-size="11">Q3</text>
<line x1="50" y1="200" x2="400" y2="200" stroke="#222" stroke-width="1.6"/>
<polyline points="90,200 90,160" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="190,200 190,160" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="290,200 290,160" fill="none" stroke="#222" stroke-width="1.6"/>
<polyline points="390,200 390,160" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="30" y="205" text-anchor="end" fill="#222" font-size="12">CLK</text>
<text x="260" y="245" text-anchor="middle" fill="#222" font-size="11">D0 takes Q3 complemented; every other D input is the Q of its left neighbour</text>
</svg>
