<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="sans-serif" font-size="13">
<title>Array 0 1 2 2 2 0 0 1 1 split into five runs of equal values; foo counts one per run, so it returns 5</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">foo adds 1 at each cell that differs from the next cell, and returns 1 at the last cell</text>
<rect x="30" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="58" y="71" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<rect x="86" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="114" y="71" fill="#222" text-anchor="middle" font-family="monospace">1</text>
<rect x="142" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="170" y="71" fill="#222" text-anchor="middle" font-family="monospace">2</text>
<rect x="198" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="226" y="71" fill="#222" text-anchor="middle" font-family="monospace">2</text>
<rect x="254" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="282" y="71" fill="#222" text-anchor="middle" font-family="monospace">2</text>
<rect x="310" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="338" y="71" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<rect x="366" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="394" y="71" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<rect x="422" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="450" y="71" fill="#222" text-anchor="middle" font-family="monospace">1</text>
<rect x="478" y="50" width="56" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="506" y="71" fill="#222" text-anchor="middle" font-family="monospace">1</text>
<text x="58" y="100" fill="#222" text-anchor="middle" font-size="10">0</text>
<text x="114" y="100" fill="#222" text-anchor="middle" font-size="10">1</text>
<text x="170" y="100" fill="#222" text-anchor="middle" font-size="10">2</text>
<text x="226" y="100" fill="#222" text-anchor="middle" font-size="10">3</text>
<text x="282" y="100" fill="#222" text-anchor="middle" font-size="10">4</text>
<text x="338" y="100" fill="#222" text-anchor="middle" font-size="10">5</text>
<text x="394" y="100" fill="#222" text-anchor="middle" font-size="10">6</text>
<text x="450" y="100" fill="#222" text-anchor="middle" font-size="10">7</text>
<text x="506" y="100" fill="#222" text-anchor="middle" font-size="10">8</text>
<text x="58" y="130" fill="#222" text-anchor="middle" font-weight="bold">+1</text>
<text x="114" y="130" fill="#222" text-anchor="middle" font-weight="bold">+1</text>
<text x="282" y="130" fill="#222" text-anchor="middle" font-weight="bold">+1</text>
<text x="394" y="130" fill="#222" text-anchor="middle" font-weight="bold">+1</text>
<text x="506" y="130" fill="#222" text-anchor="middle" font-weight="bold">+1</text>
<text x="30" y="152" fill="#222" font-size="12">cells 0, 1, 4, 6 differ from their right neighbour; cell 8 is the base case size == 1</text>
<path d="M33,176 L83,176" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M89,176 L139,176" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M145,176 L307,176" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M313,176 L419,176" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M425,176 L531,176" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="58" y="194" fill="#222" text-anchor="middle" font-size="11">run 1</text>
<text x="114" y="194" fill="#222" text-anchor="middle" font-size="11">run 2</text>
<text x="226" y="194" fill="#222" text-anchor="middle" font-size="11">run 3</text>
<text x="366" y="194" fill="#222" text-anchor="middle" font-size="11">run 4</text>
<text x="478" y="194" fill="#222" text-anchor="middle" font-size="11">run 5</text>
<text x="20" y="224" fill="#222" font-size="13" font-weight="bold">five runs of equal values: 0 | 1 | 2 2 2 | 0 0 | 1 1, so the value printed is 5</text>
</svg>
