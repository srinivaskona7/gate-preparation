<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 206" font-family="sans-serif" font-size="13">
<title>Digits of 14362 with turn values 0, 1, 0, 1, 0: only the second digit 4 and the fourth digit 6 are kept, so newnum ends at 46</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">gate(14362) peels digits from the left; turn alternates 0, 1, 0, 1, 0</text>
<rect x="40" y="50" width="70" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="72" fill="#222" text-anchor="middle">d = 1</text>
<text x="75" y="110" fill="#222" text-anchor="middle" font-size="12">turn = 0</text>
<text x="75" y="130" fill="#222" text-anchor="middle" font-size="12">skipped</text>
<text x="75" y="152" fill="#222" text-anchor="middle" font-size="12">newnum = 0</text>
<path d="M110,68 L130,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="130" y="50" width="70" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="165" y="72" fill="#222" text-anchor="middle" font-weight="bold">d = 4</text>
<text x="165" y="110" fill="#222" text-anchor="middle" font-size="12">turn = 1</text>
<text x="165" y="130" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">kept</text>
<text x="165" y="152" fill="#222" text-anchor="middle" font-size="12">newnum = 4</text>
<path d="M200,68 L220,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="220" y="50" width="70" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="255" y="72" fill="#222" text-anchor="middle">d = 3</text>
<text x="255" y="110" fill="#222" text-anchor="middle" font-size="12">turn = 0</text>
<text x="255" y="130" fill="#222" text-anchor="middle" font-size="12">skipped</text>
<text x="255" y="152" fill="#222" text-anchor="middle" font-size="12">newnum = 4</text>
<path d="M290,68 L310,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="310" y="50" width="70" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="72" fill="#222" text-anchor="middle" font-weight="bold">d = 6</text>
<text x="345" y="110" fill="#222" text-anchor="middle" font-size="12">turn = 1</text>
<text x="345" y="130" fill="#222" text-anchor="middle" font-size="12" font-weight="bold">kept</text>
<text x="345" y="152" fill="#222" text-anchor="middle" font-size="12">newnum = 46</text>
<path d="M380,68 L400,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="400" y="50" width="70" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="435" y="72" fill="#222" text-anchor="middle">d = 2</text>
<text x="435" y="110" fill="#222" text-anchor="middle" font-size="12">turn = 0</text>
<text x="435" y="130" fill="#222" text-anchor="middle" font-size="12">skipped</text>
<text x="435" y="152" fill="#222" text-anchor="middle" font-size="12">newnum = 46</text>
<text x="20" y="190" fill="#222" font-size="13" font-weight="bold">newnum = 10 * 4 + 6 = 46: the 2nd and 4th digits of 14362 are kept, in order.</text>
</svg>
