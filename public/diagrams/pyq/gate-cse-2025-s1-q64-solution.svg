<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" font-family="sans-serif">
<title>Minimum spanning tree edges B-D and A-C, then the cheapest edge across the cut</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#222"/></marker></defs>
<line x1="76.0" y1="50.0" x2="204.0" y2="50.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="140.0" y="42.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">7</text>
<line x1="60.0" y1="66.0" x2="60.0" y2="154.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="68.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">6</text>
<line x1="76.0" y1="170.0" x2="204.0" y2="170.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="140.0" y="162.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">8</text>
<line x1="220.0" y1="66.0" x2="220.0" y2="154.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="248.0" y="114.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">x</text>
<line x1="207.2" y1="59.6" x2="72.8" y2="160.4" stroke="#222" stroke-width="4"/>
<text x="179.2" y="99.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">1</text>
<line x1="72.8" y1="59.6" x2="207.2" y2="160.4" stroke="#222" stroke-width="4"/>
<text x="100.8" y="99.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">3</text>
<circle cx="60" cy="50" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="54" text-anchor="middle" font-size="13" fill="#222">A</text>
<circle cx="220" cy="50" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="220" y="54" text-anchor="middle" font-size="13" fill="#222">B</text>
<circle cx="60" cy="170" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="174" text-anchor="middle" font-size="13" fill="#222">D</text>
<circle cx="220" cy="170" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="220" y="174" text-anchor="middle" font-size="13" fill="#222">C</text>
<text x="290" y="70" text-anchor="start" font-size="12" fill="#222">Thick: B-D (1) and A-C (3) are forced.</text>
<text x="290" y="100" text-anchor="start" font-size="12" fill="#222">Dashed: the four edges across the cut</text>
<text x="290" y="118" text-anchor="start" font-size="12" fill="#222">{B,D} | {A,C}: 7, 6, 8 and x.</text>
<text x="290" y="150" text-anchor="start" font-size="12" fill="#222">B-C is in every MST only if</text>
<text x="290" y="168" text-anchor="start" font-size="12" font-weight="bold" fill="#222">x &lt; 6 (strictly), so x = 5.</text>
</svg>
