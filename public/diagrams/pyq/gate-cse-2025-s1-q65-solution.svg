<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 208" font-family="sans-serif" font-size="13">
<title>Double hashing table of 11 slots: 67 in slot 1, 79 in 2, 25 in 3, 50 in 6, 63 in 8; key 24 probes slots 2, 6 and settles in slot 10</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="24" y="22" text-anchor="start" fill="#222" font-size="12">Table of 11 slots, h1(k) = k mod 11, h2(k) = 1 + (k mod 7), probe i is (h1 + i h2) mod 11</text>
<text x="24" y="42" text-anchor="start" fill="#222" font-size="12">Key 24: h1 = 2, h2 = 1 + 3 = 4. Probes: slot 2 (79), slot 6 (50), slot 10 (free).</text>
<rect x="24" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="47.0" y="107" text-anchor="middle" fill="#222" font-size="11">0</text>
<line x1="24" y1="112" x2="70" y2="112" stroke="#222" stroke-width="0.8"/>
<rect x="70" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="93.0" y="107" text-anchor="middle" fill="#222" font-size="11">1</text>
<line x1="70" y1="112" x2="116" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="93.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">67</text>
<rect x="116" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="139.0" y="107" text-anchor="middle" fill="#222" font-size="11">2</text>
<line x1="116" y1="112" x2="162" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="139.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">79</text>
<rect x="162" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="185.0" y="107" text-anchor="middle" fill="#222" font-size="11">3</text>
<line x1="162" y1="112" x2="208" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="185.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">25</text>
<rect x="208" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="231.0" y="107" text-anchor="middle" fill="#222" font-size="11">4</text>
<line x1="208" y1="112" x2="254" y2="112" stroke="#222" stroke-width="0.8"/>
<rect x="254" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="277.0" y="107" text-anchor="middle" fill="#222" font-size="11">5</text>
<line x1="254" y1="112" x2="300" y2="112" stroke="#222" stroke-width="0.8"/>
<rect x="300" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="323.0" y="107" text-anchor="middle" fill="#222" font-size="11">6</text>
<line x1="300" y1="112" x2="346" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="323.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">50</text>
<rect x="346" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="369.0" y="107" text-anchor="middle" fill="#222" font-size="11">7</text>
<line x1="346" y1="112" x2="392" y2="112" stroke="#222" stroke-width="0.8"/>
<rect x="392" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6"/>
