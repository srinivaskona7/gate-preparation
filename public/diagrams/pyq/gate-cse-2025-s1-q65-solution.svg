<line x1="392" y1="112" x2="438" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="415.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">63</text>
<rect x="438" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="461.0" y="107" text-anchor="middle" fill="#222" font-size="11">9</text>
<line x1="438" y1="112" x2="484" y2="112" stroke="#222" stroke-width="0.8"/>
<rect x="484" y="92" width="46" height="50" fill="none" stroke="#222" stroke-width="2.8"/>
<text x="507.0" y="107" text-anchor="middle" fill="#222" font-size="11">10</text>
<line x1="484" y1="112" x2="530" y2="112" stroke="#222" stroke-width="0.8"/>
<text x="507.0" y="133" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">24</text>
<path d="M145.0,92 Q231.0,58 317.0,92" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="231.0" y="68" text-anchor="middle" fill="#222" font-size="11">probe 1: +4</text>
<path d="M329.0,92 Q415.0,58 501.0,92" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415.0" y="68" text-anchor="middle" fill="#222" font-size="11">probe 2: +4</text>
<text x="24" y="172" text-anchor="start" fill="#222" font-size="12">Before 24: 63, 50, 25, 79 and 67 each found their home slot k mod 11 empty (8, 6, 3, 2, 1).</text>
<text x="24" y="192" text-anchor="start" fill="#222" font-size="12" font-weight="bold">24 is stored at slot 10.</text>
</svg>
