ill="#222">Z1</text><circle cx="60" cy="50" r="17" fill="#fff" stroke="#222" stroke-width="2"/><text x="60" y="55" text-anchor="middle" font-size="14" fill="#222">Z2</text><circle cx="260" cy="50" r="17" fill="#fff" stroke="#222" stroke-width="2"/><text x="260" y="55" text-anchor="middle" font-size="14" fill="#222">Z3</text><circle cx="360" cy="150" r="17" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="155" text-anchor="middle" font-size="14" fill="#222">Z4</text><circle cx="260" cy="230" r="17" fill="#fff" stroke="#222" stroke-width="2"/><text x="260" y="235" text-anchor="middle" font-size="14" fill="#222">Z5</text>
<text x="10" y="272" font-size="12" fill="#222">Thick links Q, R, T, V: 4 bridges for 5 zones, a spanning tree.</text>
