<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" font-family="sans-serif">
<title>Zones as dots and river segments as links between the zones they separate; bridges on Q, R, T, V (thick) connect all five zones with four bridges</title>
