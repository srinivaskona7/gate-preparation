<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 235" width="520" height="235" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Faces of the cube and its three opposite pairs</title>
<text x="10" y="20" fill="#222" stroke="none" font-weight="bold">Reading the net as a cube</text><text x="20" y="50" fill="#222" stroke="none" >front</text><text x="100" y="50" fill="#222" stroke="none" >△ hollow triangle</text><text x="20" y="74" fill="#222" stroke="none" >top</text><text x="100" y="74" fill="#222" stroke="none" >● filled circle</text><text x="20" y="98" fill="#222" stroke="none" >bottom</text><text x="100" y="98" fill="#222" stroke="none" >○ hollow circle</text><text x="20" y="122" fill="#222" stroke="none" >left</text><text x="100" y="122" fill="#222" stroke="none" >blank</text><text x="20" y="146" fill="#222" stroke="none" >right</text><text x="100" y="146" fill="#222" stroke="none" >blank</text><text x="20" y="170" fill="#222" stroke="none" >back</text><text x="100" y="170" fill="#222" stroke="none" >▲ filled triangle</text><text x="260" y="60" fill="#222" stroke="none" font-weight="bold">Opposite pairs</text><text x="260" y="85" fill="#222" stroke="none" >△ and ▲</text><text x="260" y="109" fill="#222" stroke="none" >● and ○</text><text x="260" y="133" fill="#222" stroke="none" >blank and blank</text><text x="10" y="215" fill="#222" stroke="none" font-size="12">The strip blank, △, blank, ▲ wraps round the cube: faces two apart are opposite.</text>
</svg>
