<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="sans-serif" font-size="13">
<title>Full binary tree with 7 nodes: 3 internal nodes with two children each (thick) and 4 leaves (thin), so internal = (n - 1) / 2 = 3 and leaves = internal + 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="204.4" y1="44.5" x2="119.6" y2="97.5" stroke="#222" stroke-width="1.6"/>
<line x1="96.0" y1="118.5" x2="60.0" y2="163.5" stroke="#222" stroke-width="1.6"/>
<line x1="116.0" y1="118.5" x2="152.0" y2="163.5" stroke="#222" stroke-width="1.6"/>
<line x1="231.6" y1="44.5" x2="316.4" y2="97.5" stroke="#222" stroke-width="1.6"/>
<line x1="320.0" y1="118.5" x2="284.0" y2="163.5" stroke="#222" stroke-width="1.6"/>
<line x1="340.0" y1="118.5" x2="376.0" y2="163.5" stroke="#222" stroke-width="1.6"/>
<circle cx="218" cy="36" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="218" y="40.42" text-anchor="middle" fill="#222" font-size="13">a</text>
<circle cx="106" cy="106" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="106" y="110.42" text-anchor="middle" fill="#222" font-size="13">b</text>
<circle cx="50" cy="176" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="180.42" text-anchor="middle" fill="#222" font-size="13">d</text>
<circle cx="162" cy="176" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="162" y="180.42" text-anchor="middle" fill="#222" font-size="13">e</text>
<circle cx="330" cy="106" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="330" y="110.42" text-anchor="middle" fill="#222" font-size="13">c</text>
<circle cx="274" cy="176" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="274" y="180.42" text-anchor="middle" fill="#222" font-size="13">f</text>
<circle cx="386" cy="176" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="386" y="180.42" text-anchor="middle" fill="#222" font-size="13">g</text>
<text x="480" y="70" text-anchor="start" fill="#222" font-size="12">thick: 2 children (3 nodes)</text>
<text x="480" y="92" text-anchor="start" fill="#222" font-size="12">thin: 0 children (4 nodes)</text>
<text x="480" y="128" text-anchor="start" fill="#222" font-size="13" font-weight="bold">n = 7,  n2 = 3,  n0 = 4</text>
<text x="480" y="152" text-anchor="start" fill="#222" font-size="12">edges = n - 1 = 6 = 2 * n2</text>
<text x="480" y="174" text-anchor="start" fill="#222" font-size="12">n2 = (n - 1) / 2   (option B)</text>
<text x="380" y="240" text-anchor="middle" fill="#222" font-size="12">The same count holds for every full binary tree: n is always odd and n2 = (n - 1) / 2.</text>
</svg>
