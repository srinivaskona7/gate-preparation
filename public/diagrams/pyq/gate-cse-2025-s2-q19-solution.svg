<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 304" font-family="sans-serif" font-size="13">
<title>Array of 15 characters before and after stringcopy(a, a+2): cells 0 to 11 hold Hello World!, cells 12 and 13 keep d and !, so the printed string is Hello World!d!</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">a[30] = "@#Hello World!" copied onto itself, 2 cells to the left</text>
<text x="20" y="52" fill="#222" font-size="12">before</text>
<text x="77" y="46" fill="#222" text-anchor="middle" font-size="10">0</text>
<text x="111" y="46" fill="#222" text-anchor="middle" font-size="10">1</text>
<text x="145" y="46" fill="#222" text-anchor="middle" font-size="10">2</text>
<text x="179" y="46" fill="#222" text-anchor="middle" font-size="10">3</text>
<text x="213" y="46" fill="#222" text-anchor="middle" font-size="10">4</text>
<text x="247" y="46" fill="#222" text-anchor="middle" font-size="10">5</text>
<text x="281" y="46" fill="#222" text-anchor="middle" font-size="10">6</text>
<text x="315" y="46" fill="#222" text-anchor="middle" font-size="10">7</text>
<text x="349" y="46" fill="#222" text-anchor="middle" font-size="10">8</text>
<text x="383" y="46" fill="#222" text-anchor="middle" font-size="10">9</text>
<text x="417" y="46" fill="#222" text-anchor="middle" font-size="10">10</text>
<text x="451" y="46" fill="#222" text-anchor="middle" font-size="10">11</text>
<text x="485" y="46" fill="#222" text-anchor="middle" font-size="10">12</text>
<text x="519" y="46" fill="#222" text-anchor="middle" font-size="10">13</text>
<text x="553" y="46" fill="#222" text-anchor="middle" font-size="10">14</text>
<rect x="60" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="77" y="71" fill="#222" text-anchor="middle" font-family="monospace">@</text>
<rect x="94" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="111" y="71" fill="#222" text-anchor="middle" font-family="monospace">#</text>
<rect x="128" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="145" y="71" fill="#222" text-anchor="middle" font-family="monospace">H</text>
<rect x="162" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="179" y="71" fill="#222" text-anchor="middle" font-family="monospace">e</text>
<rect x="196" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="213" y="71" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="230" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="247" y="71" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="264" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="281" y="71" fill="#222" text-anchor="middle" font-family="monospace">o</text>
<rect x="298" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="315" y="71" fill="#222" text-anchor="middle" font-family="monospace"> </text>
<rect x="332" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="349" y="71" fill="#222" text-anchor="middle" font-family="monospace">W</text>
<rect x="366" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="383" y="71" fill="#222" text-anchor="middle" font-family="monospace">o</text>
<rect x="400" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="417" y="71" fill="#222" text-anchor="middle" font-family="monospace">r</text>
<rect x="434" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="451" y="71" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="468" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="485" y="71" fill="#222" text-anchor="middle" font-family="monospace">d</text>
<rect x="502" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="519" y="71" fill="#222" text-anchor="middle" font-family="monospace">!</text>
<rect x="536" y="52" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="553" y="71" fill="#222" text-anchor="middle" font-family="monospace">\0</text>
<text x="77" y="112" fill="#222" text-anchor="middle" font-weight="bold">s</text>
<path d="M77,98 L77,88" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="145" y="112" fill="#222" text-anchor="middle" font-weight="bold">t</text>
<path d="M145,98 L145,88" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<path d="M132,126 L532,126" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M132,126 L132,120" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M532,126 L532,120" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="332" y="144" fill="#222" text-anchor="middle" font-size="12">while (*t): 12 characters, cells 2 to 13, are copied</text>
<path d="M332,150 L264,168" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="20" y="190" fill="#222" font-size="12">after</text>
<text x="77" y="176" fill="#222" text-anchor="middle" font-size="10">0</text>
<text x="111" y="176" fill="#222" text-anchor="middle" font-size="10">1</text>
<text x="145" y="176" fill="#222" text-anchor="middle" font-size="10">2</text>
<text x="179" y="176" fill="#222" text-anchor="middle" font-size="10">3</text>
<text x="213" y="176" fill="#222" text-anchor="middle" font-size="10">4</text>
<text x="247" y="176" fill="#222" text-anchor="middle" font-size="10">5</text>
<text x="281" y="176" fill="#222" text-anchor="middle" font-size="10">6</text>
<text x="315" y="176" fill="#222" text-anchor="middle" font-size="10">7</text>
<text x="349" y="176" fill="#222" text-anchor="middle" font-size="10">8</text>
<text x="383" y="176" fill="#222" text-anchor="middle" font-size="10">9</text>
<text x="417" y="176" fill="#222" text-anchor="middle" font-size="10">10</text>
<text x="451" y="176" fill="#222" text-anchor="middle" font-size="10">11</text>
<text x="485" y="176" fill="#222" text-anchor="middle" font-size="10">12</text>
<text x="519" y="176" fill="#222" text-anchor="middle" font-size="10">13</text>
<text x="553" y="176" fill="#222" text-anchor="middle" font-size="10">14</text>
<rect x="60" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="77" y="201" fill="#222" text-anchor="middle" font-family="monospace">H</text>
<rect x="94" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="111" y="201" fill="#222" text-anchor="middle" font-family="monospace">e</text>
<rect x="128" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="145" y="201" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="162" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="179" y="201" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="196" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="213" y="201" fill="#222" text-anchor="middle" font-family="monospace">o</text>
<rect x="230" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="247" y="201" fill="#222" text-anchor="middle" font-family="monospace"> </text>
<rect x="264" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="281" y="201" fill="#222" text-anchor="middle" font-family="monospace">W</text>
<rect x="298" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="315" y="201" fill="#222" text-anchor="middle" font-family="monospace">o</text>
<rect x="332" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="349" y="201" fill="#222" text-anchor="middle" font-family="monospace">r</text>
<rect x="366" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="383" y="201" fill="#222" text-anchor="middle" font-family="monospace">l</text>
<rect x="400" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="417" y="201" fill="#222" text-anchor="middle" font-family="monospace">d</text>
<rect x="434" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="451" y="201" fill="#222" text-anchor="middle" font-family="monospace">!</text>
<rect x="468" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="485" y="201" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">d</text>
<rect x="502" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="519" y="201" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">!</text>
<rect x="536" y="182" width="34" height="30" stroke="#222" stroke-width="1.5" fill="none"/><text x="553" y="201" fill="#222" text-anchor="middle" font-family="monospace">\0</text>
<text x="264" y="228" fill="#222" text-anchor="middle" font-size="12">cells 0 to 11 now hold "Hello World!"</text>
<text x="502" y="228" fill="#222" text-anchor="middle" font-size="12">cells 12, 13: old "d!"</text>
<text x="502" y="244" fill="#222" text-anchor="middle" font-size="12">never overwritten</text>
<text x="20" y="270" fill="#222" font-size="12">The loop stops when t reaches the terminator at cell 14, and nothing writes a new terminator at cell 12.</text>
<text x="20" y="288" fill="#222" font-size="12" font-weight="bold">The string still ends at cell 14, so printf shows: Hello World!d!   (option D)</text>
</svg>
