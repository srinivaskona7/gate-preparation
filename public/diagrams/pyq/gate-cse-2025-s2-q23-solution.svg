<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 238" font-family="sans-serif" font-size="13">
<title>UDP segment of 7496 bytes split into five 1480-byte fragments and a 96-byte last fragment</title>
<text x="10" y="62" text-anchor="start" fill="#222" font-size="12" font-weight="bold">IP data</text>
<rect x="140" y="40" width="640.0" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="460.0" y="62" text-anchor="middle" fill="#222" font-size="12">7496</text>
<text x="10" y="126" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Fragments</text>
<rect x="140" y="104" width="126.36072572038421" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="203.2" y="126" text-anchor="middle" fill="#222" font-size="12">1480</text>
<rect x="266.3607257203842" y="104" width="126.36072572038421" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="329.5" y="126" text-anchor="middle" fill="#222" font-size="12">1480</text>
<rect x="392.7214514407684" y="104" width="126.36072572038421" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="455.9" y="126" text-anchor="middle" fill="#222" font-size="12">1480</text>
<rect x="519.0821771611527" y="104" width="126.36072572038421" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="582.3" y="126" text-anchor="middle" fill="#222" font-size="12">1480</text>
<rect x="645.4429028815368" y="104" width="126.36072572038421" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="708.6" y="126" text-anchor="middle" fill="#222" font-size="12">1480</text>
<rect x="771.803628601921" y="104" width="34" height="34" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="788.8" y="126" text-anchor="middle" fill="#222" font-size="12">96</text>
<text x="10" y="176" text-anchor="start" fill="#222" font-size="12">IP data = 8-byte UDP header + 7488 payload = 7496 bytes.</text>
<text x="10" y="196" text-anchor="start" fill="#222" font-size="12">Each Ethernet frame carries 1500 - 20 = 1480 data bytes (a multiple of 8).</text>
<text x="10" y="216" text-anchor="start" fill="#222" font-size="12">6 fragments; the last one is 96 data + 20 header = 116 bytes.</text>
</svg>
