<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="sans-serif" font-size="13">
<title>Nested language classes: regular inside deterministic context-free inside context-free inside decidable, with an example of each</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="10" y="10" width="480" height="430" rx="18" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="30" y="36" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Decidable languages</text>
<text x="250" y="418" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">a^n b^n c^n  (decidable, not context-free)</text>
<rect x="40" y="56" width="420" height="340" rx="18" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="60" y="82" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Context-free languages (nondeterministic PDA)</text>
<text x="150" y="110" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">w w^R</text>
<text x="340" y="110" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">{a^n b^n} ∪ {a^n b^2n}</text>
<text x="250" y="130" text-anchor="middle" font-size="12" fill="#222" font-style="italic">context-free, but no DPDA accepts them</text>
<rect x="70" y="150" width="360" height="230" rx="18" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="90" y="174" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Deterministic CFLs (DPDA)</text>
<text x="160" y="204" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">a^n b^n</text>
<text x="330" y="204" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">w c w^R</text>
<text x="250" y="232" text-anchor="middle" font-size="12" fill="#222" font-style="italic">every regular language is inside</text>
<rect x="110" y="260" width="280" height="100" rx="18" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="130" y="284" text-anchor="start" font-size="12" fill="#222" font-weight="bold">Regular languages</text>
<text x="170" y="316" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">a*b*</text>
<text x="330" y="316" text-anchor="middle" font-size="14" fill="#222" font-family="monospace">(a|b)*aa</text>
<text x="250" y="344" text-anchor="middle" font-size="12" fill="#222" font-style="italic">DFA = DPDA that ignores its stack</text>
<text x="505" y="90" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Option (A)</text>
<text x="505" y="108" text-anchor="start" font-size="12" fill="#222">regular lies inside DCFL:</text>
<text x="505" y="124" text-anchor="start" font-size="12" fill="#222">a DPDA accepts it</text>
<text x="505" y="170" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Options (B), (C)</text>
<text x="505" y="188" text-anchor="start" font-size="12" fill="#222">reach CFL minus DCFL,</text>
<text x="505" y="204" text-anchor="start" font-size="12" fill="#222">e.g. w w^R: no DPDA</text>
<text x="505" y="250" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Option (D)</text>
<text x="505" y="268" text-anchor="start" font-size="12" fill="#222">a^n b^n c^n is decidable</text>
<text x="505" y="284" text-anchor="start" font-size="12" fill="#222">but not even a CFL</text>
</svg>
