<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" font-family="sans-serif" font-size="13">
<title>Four decision problems about context-free grammars: only emptiness is decidable</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Problem</text>
<text x="330" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Verdict</text>
<text x="450" y="28" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Reason</text>
<rect x="10" y="42" width="700" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="70" text-anchor="start" fill="#222" font-size="13">(A) Is L(G1) = L(G2)?</text>
<text x="330" y="70" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="62" text-anchor="start" fill="#222" font-size="12">take G2 generating all strings:</text>
<text x="450" y="79" text-anchor="start" fill="#222" font-size="12">this asks if G1 is universal</text>
<rect x="10" y="96" width="700" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="124" text-anchor="start" fill="#222" font-size="13">(B) Is L(G1) intersect L(G2) empty?</text>
<text x="330" y="124" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="116" text-anchor="start" fill="#222" font-size="12">Post correspondence problem</text>
<text x="450" y="133" text-anchor="start" fill="#222" font-size="12">becomes two CFLs that overlap</text>
<rect x="10" y="150" width="700" height="46" rx="4" fill="none" stroke="#222" stroke-width="1.0"/>
<text x="20" y="178" text-anchor="start" fill="#222" font-size="13">(C) Is L(G1) = L(R)?</text>
<text x="330" y="178" text-anchor="start" fill="#222" font-size="13" font-weight="bold">UNDECIDABLE</text>
<text x="450" y="170" text-anchor="start" fill="#222" font-size="12">take R = all strings:</text>
<text x="450" y="187" text-anchor="start" fill="#222" font-size="12">again universality of G1</text>
<rect x="10" y="204" width="700" height="46" rx="4" fill="none" stroke="#222" stroke-width="2.6"/>
<text x="20" y="232" text-anchor="start" fill="#222" font-size="13">(D) Is L(G1) empty?</text>
<text x="330" y="232" text-anchor="start" fill="#222" font-size="13" font-weight="bold">decidable</text>
<text x="450" y="224" text-anchor="start" fill="#222" font-size="12">fixpoint: mark variables that</text>
<text x="450" y="241" text-anchor="start" fill="#222" font-size="12">can produce a terminal string</text>
</svg>
