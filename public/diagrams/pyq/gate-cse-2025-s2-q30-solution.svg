<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="sans-serif" font-size="13">
<title>Closure table for context-free, recursive and regular languages under union, intersection and complement, with the verdict on each option</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="30" y="28" text-anchor="start" font-size="13" fill="#222" font-weight="bold">Class</text>
<text x="230" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Union</text>
<text x="340" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Intersection</text>
<text x="450" y="28" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Complement</text>
<text x="560" y="28" text-anchor="start" font-size="13" fill="#222" font-weight="bold">List I item</text>
<line x1="20" y1="40" x2="640" y2="40" stroke="#222" stroke-width="1.4"/>
<text x="30" y="68" text-anchor="start" font-size="13" fill="#222">Context free</text>
<text x="230" y="68" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="340" y="68" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">NOT closed</text>
<text x="450" y="68" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">NOT closed</text>
<text x="560" y="68" text-anchor="start" font-size="13" fill="#222">(i)</text>
<text x="30" y="100" text-anchor="start" font-size="13" fill="#222">Recursive</text>
<text x="230" y="100" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="340" y="100" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="450" y="100" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="560" y="100" text-anchor="start" font-size="13" fill="#222">(ii)</text>
<text x="30" y="132" text-anchor="start" font-size="13" fill="#222">Regular</text>
<text x="230" y="132" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="340" y="132" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="450" y="132" text-anchor="middle" font-size="13" fill="#222">closed</text>
<text x="560" y="132" text-anchor="start" font-size="13" fill="#222">(iii)</text>
<line x1="20" y1="148" x2="640" y2="148" stroke="#222" stroke-width="1.4"/>
<text x="20" y="172" text-anchor="start" font-size="12" fill="#222">List II: (a) closed under union   (b) not closed under complementation   (c) closed under intersection</text>
<rect x="20" y="190" width="620" height="34" rx="4" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36" y="212" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(A)</text>
<text x="80" y="212" text-anchor="start" font-size="12" fill="#222">(i)-(a) true;  (ii)-(b) FALSE, recursive is closed under complement</text>
<text x="626" y="212" text-anchor="end" font-size="12" fill="#222" font-weight="bold">wrong</text>
<rect x="20" y="232" width="620" height="34" rx="4" fill="none" stroke="#222" stroke-width="2.4"/>
<text x="36" y="254" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(B)</text>
<text x="80" y="254" text-anchor="start" font-size="12" fill="#222">(i)-(b) true;  (ii)-(a) true, (iii)-(c) true</text>
<text x="626" y="254" text-anchor="end" font-size="12" fill="#222" font-weight="bold">CORRECT</text>
<rect x="20" y="274" width="620" height="34" rx="4" fill="none" stroke="#222" stroke-width="2.4"/>
<text x="36" y="296" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(C)</text>
<text x="80" y="296" text-anchor="start" font-size="12" fill="#222">(i)-(b) true;  (ii)-(c) true, (iii)-(a) true</text>
<text x="626" y="296" text-anchor="end" font-size="12" fill="#222" font-weight="bold">CORRECT</text>
<rect x="20" y="316" width="620" height="34" rx="4" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36" y="338" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(D)</text>
<text x="80" y="338" text-anchor="start" font-size="12" fill="#222">(i)-(a) true;  (ii)-(c) true, (iii)-(b) FALSE, regular is closed under complement</text>
<text x="626" y="338" text-anchor="end" font-size="12" fill="#222" font-weight="bold">wrong</text>
</svg>
