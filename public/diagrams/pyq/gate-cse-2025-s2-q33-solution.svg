<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 224" font-family="sans-serif" font-size="13">
<title>Trace of x and y in the do-while loop: (126,105), (21,105), (21,84), (21,63), (21,42), (21,21), then it stops and prints 21, the gcd</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Each pass subtracts the smaller number from the larger: Euclid by subtraction</text>
<rect x="20" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="60" y="78" fill="#222" text-anchor="middle">x = 126</text><text x="60" y="94" fill="#222" text-anchor="middle">y = 105</text>
<path d="M100,82 L120,82" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="120" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="160" y="78" fill="#222" text-anchor="middle">x = 21</text><text x="160" y="94" fill="#222" text-anchor="middle">y = 105</text>
<path d="M200,82 L220,82" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="220" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="260" y="78" fill="#222" text-anchor="middle">x = 21</text><text x="260" y="94" fill="#222" text-anchor="middle">y = 84</text>
<path d="M300,82 L320,82" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="320" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="360" y="78" fill="#222" text-anchor="middle">x = 21</text><text x="360" y="94" fill="#222" text-anchor="middle">y = 63</text>
<path d="M400,82 L420,82" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="420" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="460" y="78" fill="#222" text-anchor="middle">x = 21</text><text x="460" y="94" fill="#222" text-anchor="middle">y = 42</text>
<path d="M500,82 L520,82" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="520" y="60" width="80" height="44" stroke="#222" stroke-width="1.5" fill="none"/><text x="560" y="78" fill="#222" text-anchor="middle" font-weight="bold">x = 21</text><text x="560" y="94" fill="#222" text-anchor="middle" font-weight="bold">y = 21</text>
<text x="110" y="126" fill="#222" text-anchor="middle" font-size="11">x -= y</text>
<text x="210" y="126" fill="#222" text-anchor="middle" font-size="11">y -= x</text>
<text x="310" y="126" fill="#222" text-anchor="middle" font-size="11">y -= x</text>
<text x="410" y="126" fill="#222" text-anchor="middle" font-size="11">y -= x</text>
<text x="510" y="126" fill="#222" text-anchor="middle" font-size="11">y -= x</text>
<text x="20" y="190" fill="#222" font-size="12">x == y after the last pass, the do-while test x != y fails, and the common value 21 is printed.</text>
<text x="20" y="208" fill="#222" font-size="12">21 divides both 126 = 6 x 21 and 105 = 5 x 21, and no larger number does: 21 = gcd(126, 105).</text>
</svg>
