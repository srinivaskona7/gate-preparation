<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="sans-serif" font-size="13">
<title>Waveforms of a 4-bit ripple counter of falling-edge toggle stages over 24 clock periods: each stage toggles on the falling edge of the stage before, so each stage has twice the period of the one before and Q3 has a period of 16 clock periods</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<polyline points="60,70 60,48 70,48 70,70 80,70 80,48 90,48 90,70 100,70 100,48 110,48 110,70 120,70 120,48 130,48 130,70 140,70 140,48 150,48 150,70 160,70 160,48 170,48 170,70 180,70 180,48 190,48 190,70 200,70 200,48 210,48 210,70 220,70 220,48 230,48 230,70 240,70 240,48 250,48 250,70 260,70 260,48 270,48 270,70 280,70 280,48 290,48 290,70 300,70 300,48 310,48 310,70 320,70 320,48 330,48 330,70 340,70 340,48 350,48 350,70 360,70 360,48 370,48 370,70 380,70 380,48 390,48 390,70 400,70 400,48 410,48 410,70 420,70 420,48 430,48 430,70 440,70 440,48 450,48 450,70 460,70 460,48 470,48 470,70 480,70 480,48 490,48 490,70 500,70 500,48 510,48 510,70 520,70 520,48 530,48 530,70 540,70" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="64" text-anchor="end" fill="#222" font-size="13">CLK</text>
<polyline points="60,110 70,110 70,88 90,88 90,110 110,110 110,88 130,88 130,110 150,110 150,88 170,88 170,110 190,110 190,88 210,88 210,110 230,110 230,88 250,88 250,110 270,110 270,88 290,88 290,110 310,110 310,88 330,88 330,110 350,110 350,88 370,88 370,110 390,110 390,88 410,88 410,110 430,110 430,88 450,88 450,110 470,110 470,88 490,88 490,110 510,110 510,88 530,88 530,110 540,110" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="104" text-anchor="end" fill="#222" font-size="13">Q0</text>
<polyline points="60,150 90,150 90,128 130,128 130,150 170,150 170,128 210,128 210,150 250,150 250,128 290,128 290,150 330,150 330,128 370,128 370,150 410,150 410,128 450,128 450,150 490,150 490,128 530,128 530,150 540,150" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="144" text-anchor="end" fill="#222" font-size="13">Q1</text>
<polyline points="60,190 130,190 130,168 210,168 210,190 290,190 290,168 370,168 370,190 450,190 450,168 530,168 530,190 540,190" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="184" text-anchor="end" fill="#222" font-size="13">Q2</text>
<polyline points="60,230 210,230 210,208 370,208 370,230 530,230 530,208 540,208" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="224" text-anchor="end" fill="#222" font-size="13">Q3</text>
<line x1="210" y1="196" x2="210" y2="250" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<line x1="530" y1="196" x2="530" y2="250" stroke="#222" stroke-width="1" stroke-dasharray="5 3"/>
<path d="M212,244 L527,244" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M528,244 L213,244" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="370.0" y="262" text-anchor="middle" fill="#222" font-size="12">one Q3 period = 16 clock periods</text>
<text x="300" y="26" text-anchor="middle" fill="#222" font-size="12">Q3 period = 16 clock periods = 64 microseconds, so one clock period = 4 microseconds</text>
</svg>
