<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 212" width="900" height="212">
<title>Stop-and-wait cycle: 1.5 s sending, 0.2 s waiting</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="102" y="72" font-size="13" text-anchor="end" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Sender</text>
<rect x="110.0" y="50" width="633.3333333333334" height="30" rx="0" fill="#cfe3f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="426.6666666666667" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">transmit 3000 bits = 1.5 s</text>
<rect x="743.3333333333334" y="50" width="84.44444444444443" height="30" rx="0" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="785.5555555555555" y="70" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">wait</text>
<line x1="110" y1="94" x2="880" y2="94" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110.0" y1="94" x2="110.0" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110.0" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">0</text>
<line x1="743.3333333333334" y1="94" x2="743.3333333333334" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="743.3333333333334" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1.5</text>
<line x1="785.5555555555557" y1="94" x2="785.5555555555557" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="785.5555555555557" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1.6</text>
<line x1="827.7777777777777" y1="94" x2="827.7777777777777" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="827.7777777777777" y="116" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">1.7 s</text>
<line x1="827.7777777777777" y1="36" x2="827.7777777777777" y2="94" stroke="#b00020" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="827.7777777777777" y="32" font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#b00020">ACK arrives</text>
<text x="10" y="144" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Last bit reaches receiver at 1.5 + 0.1 = 1.6 s; the ACK (no transmission time) is back at 1.6 + 0.1 = 1.7 s.</text>
<text x="10" y="158" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Utilization = 1.5 / 1.7 = 88.235 % (option A, 88.23)</text>
</svg>
