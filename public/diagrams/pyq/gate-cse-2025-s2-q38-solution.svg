<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" font-size="13">
<title>Meld of two structures of size n: linked list with head and tail pointers needs one pointer change, an array min-heap is concatenated and rebuilt with build-heap in linear time, and a BST is melded by merging the two inorder lists and building a balanced tree in linear time</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="13" font-weight="bold">P  Unsorted doubly linked list</text>
<rect x="30" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="80" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="130" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="250" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="300" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="350" y="40" width="40" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="30" y="84" text-anchor="start" fill="#222" font-size="11">head</text>
<text x="135" y="84" text-anchor="start" fill="#222" font-size="11">tail</text>
<line x1="170.0" y1="53.0" x2="250.0" y2="53.0" stroke="#222" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="215" y="84" text-anchor="middle" fill="#222" font-size="11">tail(A) -&gt; head(B)</text>
<text x="420" y="58" text-anchor="start" fill="#222" font-size="12" font-weight="bold">one pointer update: Theta(1)</text>
<text x="20" y="124" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Q  Min-heap in an array</text>
<rect x="30" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="66" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="102" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="138" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="190" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="226" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="262" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="298" y="138" width="36" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="30" y="180" text-anchor="start" fill="#222" font-size="11">heap A (n)</text>
<text x="190" y="180" text-anchor="start" fill="#222" font-size="11">heap B (n)</text>
<text x="345" y="155" text-anchor="start" fill="#222" font-size="14">-&gt;</text>
<rect x="380" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="408" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="436" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="464" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="492" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="520" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="548" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<rect x="576" y="138" width="28" height="26" rx="0" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="380" y="180" text-anchor="start" fill="#222" font-size="11">concatenate: 2n cells</text>
<text x="620" y="150" text-anchor="start" fill="#222" font-size="12">build-heap</text>
<text x="620" y="166" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Theta(n)</text>
<text x="20" y="228" text-anchor="start" fill="#222" font-size="13" font-weight="bold">R  Binary search tree</text>
<rect x="30" y="244" width="100" height="32" rx="4" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="80" y="264" text-anchor="middle" fill="#222" font-size="12">two BSTs</text>
<rect x="160" y="244" width="110" height="32" rx="4" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="215" y="264" text-anchor="middle" fill="#222" font-size="12">inorder walks</text>
<rect x="300" y="244" width="150" height="32" rx="4" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="375" y="264" text-anchor="middle" fill="#222" font-size="12">merge 2 sorted lists</text>
<rect x="480" y="244" width="150" height="32" rx="4" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="555" y="264" text-anchor="middle" fill="#222" font-size="12">build balanced BST</text>
<line x1="130.0" y1="260.0" x2="160.0" y2="260.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="270.0" y1="260.0" x2="300.0" y2="260.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="450.0" y1="260.0" x2="480.0" y2="260.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="640" y="258" text-anchor="start" fill="#222" font-size="11">each step</text>
<text x="640" y="272" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Theta(n)</text>
<text x="20" y="326" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Answer: P Theta(1),  Q Theta(n),  R Theta(n)   (option A)</text>
<text x="20" y="350" text-anchor="start" fill="#222" font-size="12">Option D (R Theta(n log n)) and B (Q Theta(n log n)) price n separate insertions; the bulk methods above are cheaper.</text>
</svg>
