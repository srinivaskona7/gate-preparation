<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" font-family="sans-serif" fill="#1f2937"><title>Two states of grammar S to Aa, bAc, dc, bda with A to d where SLR(1) conflicts but LR(1) lookaheads separate the reductions</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="330" height="62" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">State after d (from I0)</text>
<line x1="10" y1="34" x2="340" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; d.      [LR(1) lookahead a]</text>
<text x="20" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; d.c      [lookahead $]</text>
<text x="10" y="100" font-size="12" text-anchor="start" fill="#1f2937">Follow(A) = {a, c}: SLR reduces on c, also shifted.</text>
<text x="10" y="118" font-size="12" text-anchor="start" fill="#1f2937">LR(1)/LALR(1): reduce A -&gt; d only on a. No conflict.</text>
<rect x="360" y="10" width="330" height="62" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="368" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">State after b d</text>
<line x1="360" y1="34" x2="690" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="370" y="52" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; d.      [LR(1) lookahead c]</text>
<text x="370" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">S -&gt; bd.a      [lookahead $]</text>
<text x="360" y="100" font-size="12" text-anchor="start" fill="#1f2937">Follow(A) = {a, c}: SLR reduces on a, also shifted.</text>
<text x="360" y="118" font-size="12" text-anchor="start" fill="#1f2937">LR(1)/LALR(1): reduce A -&gt; d only on c. No conflict.</text>
<rect x="10" y="150" width="680" height="120" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="24" y="176" font-size="13" text-anchor="start" fill="#1f2937">The two states have different cores, so LALR merging joins nothing:</text>
<text x="24" y="198" font-size="13" text-anchor="start" fill="#1f2937">LR(1) has 11 states, LALR(1) has 11 states, 0 conflicts in either.</text>
<text x="24" y="220" font-size="13" text-anchor="start" fill="#1f2937">SLR(1) has the 2 conflicts above.</text>
<text x="24" y="248" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">Verdict: LALR(1) but not SLR(1)  (option C).</text>
</svg>
