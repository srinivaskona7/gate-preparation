<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif" font-size="13" fill="#1f2937"><title>A bitonic array rises to a peak then falls; binary search finds the peak, then each side is binary searched</title>
<polyline points="40,200 100,150 160,100 220,60 280,90 340,140 400,190" stroke="#1f2937" fill="none" stroke-width="2"/>
<circle cx="40" cy="200" r="4" stroke="#1f2937" fill="none"/>
<text x="40" y="225" text-anchor="middle" font-size="11">A[1]</text>
<circle cx="100" cy="150" r="4" stroke="#1f2937" fill="none"/>
<text x="100" y="225" text-anchor="middle" font-size="11">A[2]</text>
<circle cx="160" cy="100" r="4" stroke="#1f2937" fill="none"/>
<text x="160" y="225" text-anchor="middle" font-size="11">A[3]</text>
<circle cx="220" cy="60" r="4" stroke="#1f2937" fill="#1f2937"/>
<text x="220" y="225" text-anchor="middle" font-size="11">A[4]</text>
<circle cx="280" cy="90" r="4" stroke="#1f2937" fill="none"/>
<text x="280" y="225" text-anchor="middle" font-size="11">A[5]</text>
<circle cx="340" cy="140" r="4" stroke="#1f2937" fill="none"/>
<text x="340" y="225" text-anchor="middle" font-size="11">A[6]</text>
<circle cx="400" cy="190" r="4" stroke="#1f2937" fill="none"/>
<text x="400" y="225" text-anchor="middle" font-size="11">A[7]</text>
<text x="220" y="45" text-anchor="middle" font-size="12">peak, found in log n probes</text>
<line x1="220" y1="60" x2="220" y2="215" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 3"/>
<text x="120" y="255" text-anchor="middle" font-size="12">rising part: binary search</text>
<text x="330" y="255" text-anchor="middle" font-size="12">falling part: binary search</text>
<text x="40" y="285" text-anchor="start" font-size="12">Probe mid: if A[mid] &lt; A[mid+1] the peak is to the right, else at mid or to the left.</text>
<text x="40" y="305" text-anchor="start" font-size="12">Total about 3 log n comparisons, so Theta(log n).</text>
</svg>
