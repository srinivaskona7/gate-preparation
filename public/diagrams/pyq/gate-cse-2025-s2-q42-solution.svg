<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" font-family="sans-serif" font-size="13">
<title>Hasse diagram of the functions from {1,2} to {0,1} under pointwise order: a four element lattice with 00 at the bottom and 11 at the top</title>
<line x1="150" y1="150" x2="80" y2="90" stroke="#222" stroke-width="1.8"/><line x1="150" y1="150" x2="220" y2="90" stroke="#222" stroke-width="1.8"/><line x1="80" y1="90" x2="150" y2="30" stroke="#222" stroke-width="1.8"/><line x1="220" y1="90" x2="150" y2="30" stroke="#222" stroke-width="1.8"/><circle cx="150" cy="150" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="150" y="154.5" text-anchor="middle" fill="#222" font-size="12">00</text><circle cx="80" cy="90" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="80" y="94.5" text-anchor="middle" fill="#222" font-size="12">01</text><circle cx="220" cy="90" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="220" y="94.5" text-anchor="middle" fill="#222" font-size="12">10</text><circle cx="150" cy="30" r="17" fill="#fff" stroke="#222" stroke-width="1.8"/><text x="150" y="34.5" text-anchor="middle" fill="#222" font-size="12">11</text><text x="300" y="60" text-anchor="start" fill="#222" font-size="13">Hasse diagram for n = 2:</text><text x="300" y="84" text-anchor="start" fill="#222" font-size="13">f = (f(1), f(2)).</text><text x="300" y="108" text-anchor="start" fill="#222" font-size="13">meet = bitwise min,</text><text x="300" y="132" text-anchor="start" fill="#222" font-size="13">join = bitwise max.</text><text x="300" y="156" text-anchor="start" fill="#222" font-size="13">Partial order and lattice;</text><text x="300" y="180" text-anchor="start" fill="#222" font-size="13">01 and 10 are incomparable.</text>
</svg>
