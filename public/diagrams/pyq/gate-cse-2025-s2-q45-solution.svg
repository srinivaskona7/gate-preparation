<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="sans-serif" font-size="13">
<title>A stack of records with keys 5, 3, 7, 2 pushed in that order. Each record keeps below_min, a pointer to the smallest-key record strictly below it; MIN compares the top record with its below_min, and after a pop the new top still holds the right below_min</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="120" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">After push 5, 3, 7, 2</text>
<polyline points="30,50 30,220 180,220 180,50" fill="none" stroke="#222" stroke-width="2"/>
<rect x="30" y="186" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="90" y1="186" x2="90" y2="220" stroke="#222" stroke-width="1.2"/>
<text x="60" y="208" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 5</text>
<text x="135" y="208" text-anchor="middle" fill="#1d4ed8" font-size="11">below: none</text>
<rect x="30" y="152" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="90" y1="152" x2="90" y2="186" stroke="#222" stroke-width="1.2"/>
<text x="60" y="174" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 3</text>
<text x="135" y="174" text-anchor="middle" fill="#1d4ed8" font-size="12">below: 5</text>
<rect x="30" y="118" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="90" y1="118" x2="90" y2="152" stroke="#222" stroke-width="1.2"/>
<text x="60" y="140" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 7</text>
<text x="135" y="140" text-anchor="middle" fill="#1d4ed8" font-size="12">below: 3</text>
<rect x="30" y="84" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="90" y1="84" x2="90" y2="118" stroke="#222" stroke-width="1.2"/>
<text x="60" y="106" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 2</text>
<text x="135" y="106" text-anchor="middle" fill="#1d4ed8" font-size="12">below: 3</text>
<text x="188" y="106" text-anchor="start" fill="#6b7280" font-size="12">top</text>
<text x="120" y="244" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">MIN() = key 2  (2 &lt; below 3)</text>
<text x="470" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">After pop() removes key 2</text>
<polyline points="380,50 380,220 530,220 530,50" fill="none" stroke="#222" stroke-width="2"/>
<rect x="380" y="186" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="440" y1="186" x2="440" y2="220" stroke="#222" stroke-width="1.2"/>
<text x="410" y="208" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 5</text>
<text x="485" y="208" text-anchor="middle" fill="#1d4ed8" font-size="11">below: none</text>
<rect x="380" y="152" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="440" y1="152" x2="440" y2="186" stroke="#222" stroke-width="1.2"/>
<text x="410" y="174" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 3</text>
<text x="485" y="174" text-anchor="middle" fill="#1d4ed8" font-size="12">below: 5</text>
<rect x="380" y="118" width="150" height="34" fill="none" stroke="#222" stroke-width="1.4"/>
<line x1="440" y1="118" x2="440" y2="152" stroke="#222" stroke-width="1.2"/>
<text x="410" y="140" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">key 7</text>
<text x="485" y="140" text-anchor="middle" fill="#1d4ed8" font-size="12">below: 3</text>
<text x="538" y="140" text-anchor="start" fill="#6b7280" font-size="12">top</text>
<text x="470" y="244" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">MIN() = key 3  (below 3 &lt; 7)</text>
<text x="12" y="300" text-anchor="start" fill="#222" font-size="13">Push x: new record gets below_min = smaller of old top and old top.below_min. O(1).</text>
<text x="12" y="322" text-anchor="start" fill="#222" font-size="13">Pop: the record leaves with its own field; the records below already hold the right below_min. O(1).</text>
<text x="12" y="344" text-anchor="start" fill="#b91c1c" font-size="13">A single global min pointer (B) loses the next minimum when key 2 is popped.</text>
</svg>
