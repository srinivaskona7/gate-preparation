<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="sans-serif" font-size="13">
<title>Resource allocation graph of four processes and four single-instance resources with two cycles that both pass through P2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="110" cy="150" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="110" y="154" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="250" y="130" width="40" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="270.0" y="154.0" text-anchor="middle" fill="#222" font-size="12">R2</text>
<circle cx="430" cy="150" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="430" y="154" text-anchor="middle" fill="#222" font-size="12">P2</text>
<rect x="90" y="270" width="40" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="110.0" y="294.0" text-anchor="middle" fill="#222" font-size="12">R1</text>
<circle cx="270" cy="290" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="270" y="294" text-anchor="middle" fill="#222" font-size="12">P3</text>
<rect x="410" y="270" width="40" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="430.0" y="294.0" text-anchor="middle" fill="#222" font-size="12">R3</text>
<rect x="410" y="30" width="40" height="40" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="430.0" y="54.0" text-anchor="middle" fill="#222" font-size="12">R4</text>
<circle cx="270" cy="50" r="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="270" y="54" text-anchor="middle" fill="#222" font-size="12">P4</text>
<line x1="110.0" y1="269.0" x2="110.0" y2="172.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="291.0" y1="150.0" x2="408.0" y2="150.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="409.0" y1="290.0" x2="292.0" y2="290.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="409.0" y1="50.0" x2="292.0" y2="50.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="130.0" y1="150.0" x2="247.0" y2="150.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="430.0" y1="170.0" x2="430.0" y2="267.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="250.0" y1="290.0" x2="133.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="430.0" y1="130.0" x2="430.0" y2="73.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<line x1="270.0" y1="70.0" x2="270.0" y2="127.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="520" y="70" text-anchor="start" fill="#222" font-size="12">solid arrow R to P: assigned</text>
<text x="520" y="90" text-anchor="start" fill="#222" font-size="12">dashed arrow P to R: waiting for</text>
<text x="520" y="130" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Cycle 1: P1 R2 P2 R3 P3 R1</text>
<text x="520" y="150" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Cycle 2: P2 R4 P4 R2</text>
<text x="520" y="190" text-anchor="start" fill="#222" font-size="12">Abort P1 or P3: cycle 2 stays.</text>
<text x="520" y="210" text-anchor="start" fill="#222" font-size="12">Abort P2: both cycles break.</text>
<text x="520" y="230" text-anchor="start" fill="#222" font-size="12">Abort P1 and P4: both break.</text>
<text x="520" y="270" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Correct: C and D</text>
</svg>
