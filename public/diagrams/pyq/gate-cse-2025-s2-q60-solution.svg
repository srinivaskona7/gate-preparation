<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
<title>Six-state DFA on the residues 1 to 6 modulo 7: reading symbol 3 walks the cycle 1, 3, 2, 6, 4, 5; state 2 accepts</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="190" cy="75" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="190" y="79" text-anchor="middle" font-size="12" fill="#222">1</text>
<line x1="138" y1="75" x2="171" y2="75" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="298" cy="138" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="298" y="142" text-anchor="middle" font-size="12" fill="#222">3</text>
<circle cx="298" cy="262" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="298" cy="262" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="298" y="266" text-anchor="middle" font-size="12" fill="#222">2</text>
<circle cx="190" cy="325" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="190" y="329" text-anchor="middle" font-size="12" fill="#222">6</text>
<circle cx="82" cy="263" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="82" y="267" text-anchor="middle" font-size="12" fill="#222">4</text>
<circle cx="82" cy="138" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="82" y="142" text-anchor="middle" font-size="12" fill="#222">5</text>
<line x1="205.5" y1="84.1" x2="281.6" y2="128.4" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="238.02552926878585" y="119.7496323971207" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<line x1="298.0" y1="156.0" x2="298.0" y2="243.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="287.0" y="203.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<line x1="282.5" y1="271.1" x2="206.4" y2="315.4" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="238.88930816968428" y="287.7464965773551" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<line x1="174.4" y1="316.0" x2="98.5" y2="272.5" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="141.9101692525039" y="288.7091496940938" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<line x1="82.0" y1="245.0" x2="82.0" y2="157.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="93.0" y="205.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<line x1="97.5" y1="128.9" x2="173.6" y2="84.6" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="141.11069183031574" y="120.2535034226448" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">3</text>
<text x="450" y="70" text-anchor="start" font-size="13" font-weight="bold" fill="#222">State = product so far mod 7</text>
<text x="450" y="98" text-anchor="start" font-size="13" font-weight="normal" fill="#222">Start: 1 (empty product)</text>
<text x="450" y="121" text-anchor="start" font-size="13" font-weight="normal" fill="#222">Accept: 2</text>
<text x="450" y="160" text-anchor="start" font-size="13" font-weight="normal" fill="#222">Each symbol s moves r to r*s mod 7:</text>
<text x="450" y="183" text-anchor="start" font-size="13" font-weight="normal" fill="#222">s = 1: stay (loop on every state)</text>
<text x="450" y="206" text-anchor="start" font-size="13" font-weight="normal" fill="#222">s = 3: one step along the cycle</text>
<text x="450" y="229" text-anchor="start" font-size="13" font-weight="normal" fill="#222">s = 2 = 3^2: two steps along it</text>
<text x="450" y="252" text-anchor="start" font-size="13" font-weight="normal" fill="#222">s = 4 = 3^4: four steps along it</text>
<text x="450" y="290" text-anchor="start" font-size="13" font-weight="normal" fill="#222">3 generates all of 1..6 mod 7,</text>
<text x="450" y="313" text-anchor="start" font-size="13" font-weight="normal" fill="#222">so every state is reachable and</text>
<text x="450" y="336" text-anchor="start" font-size="13" font-weight="normal" fill="#222">no two states can be merged: 6.</text>
</svg>
