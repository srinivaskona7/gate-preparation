<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="sans-serif" font-size="13">
<title>Array arr before and after (*ptr)++ and ptr++: ptr first at arr[1] with a = 50, then arr[1] is 51 and ptr is at arr[2] = 10, so the output is 50 + 10 + 51 = 111</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">arr[5] = {30, 50, 10}: the last two cells start as 0</text>
<text x="20" y="48" fill="#222" font-size="12" font-weight="bold">after  ptr = &amp;arr[0] + 1;  a = *ptr;</text>
<rect x="40" y="58" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="70" y="79" fill="#222" text-anchor="middle" font-family="monospace">30</text>
<rect x="100" y="58" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="130" y="79" fill="#222" text-anchor="middle" font-family="monospace">50</text>
<rect x="160" y="58" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="190" y="79" fill="#222" text-anchor="middle" font-family="monospace">10</text>
<rect x="220" y="58" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="250" y="79" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<rect x="280" y="58" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="310" y="79" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<text x="70" y="108" fill="#222" text-anchor="middle" font-size="10">0</text>
<text x="130" y="108" fill="#222" text-anchor="middle" font-size="10">1</text>
<text x="190" y="108" fill="#222" text-anchor="middle" font-size="10">2</text>
<text x="250" y="108" fill="#222" text-anchor="middle" font-size="10">3</text>
<text x="310" y="108" fill="#222" text-anchor="middle" font-size="10">4</text>
<text x="130" y="140" fill="#222" text-anchor="middle" font-weight="bold">ptr</text>
<path d="M130,128 L130,114" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="360" y="80" fill="#222" font-size="12">a = 50 (a copy)</text>
<text x="20" y="178" fill="#222" font-size="12" font-weight="bold">after  (*ptr)++;  ptr++;</text>
<rect x="40" y="188" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="70" y="209" fill="#222" text-anchor="middle" font-family="monospace">30</text>
<rect x="100" y="188" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="130" y="209" fill="#222" text-anchor="middle" font-weight="bold" font-family="monospace">51</text>
<rect x="160" y="188" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="190" y="209" fill="#222" text-anchor="middle" font-family="monospace">10</text>
<rect x="220" y="188" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="250" y="209" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<rect x="280" y="188" width="60" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="310" y="209" fill="#222" text-anchor="middle" font-family="monospace">0</text>
<text x="70" y="238" fill="#222" text-anchor="middle" font-size="10">0</text>
<text x="130" y="238" fill="#222" text-anchor="middle" font-size="10">1</text>
<text x="190" y="238" fill="#222" text-anchor="middle" font-size="10">2</text>
<text x="250" y="238" fill="#222" text-anchor="middle" font-size="10">3</text>
<text x="310" y="238" fill="#222" text-anchor="middle" font-size="10">4</text>
<text x="190" y="270" fill="#222" text-anchor="middle" font-weight="bold">ptr</text>
<path d="M190,258 L190,244" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="360" y="200" fill="#222" font-size="12">arr[1] became 51</text>
<text x="360" y="218" fill="#222" font-size="12">*ptr is arr[2] = 10</text>
<text x="20" y="304" fill="#222" font-size="13" font-weight="bold">a + *ptr + arr[1] = 50 + 10 + 51 = 111</text>
</svg>
