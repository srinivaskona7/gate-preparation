<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 206" font-family="sans-serif" font-size="13">
<title>Call chains for n = 1 and n = 2: f(n) = g(2n) = 2n + 10, then g adds 10 again giving 22 and 24, and the sum is 46</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">g(f(n)) for n = 1 and n = 2; g adds 10, f doubles then calls g</text>
<text x="20" y="52" fill="#222" font-weight="bold">n = 1</text>
<rect x="20" y="62" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="83" fill="#222" text-anchor="middle">f(1)</text>
<path d="M75,96 L75,112" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="112" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="75" y="126" fill="#222" text-anchor="middle" font-size="12">g(1*2) = g(2)</text><text x="75" y="140" fill="#222" text-anchor="middle" font-size="12">= 12</text>
<path d="M130,129 L170,129" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="170" y="112" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="225" y="126" fill="#222" text-anchor="middle" font-weight="bold">g(12)</text><text x="225" y="140" fill="#222" text-anchor="middle" font-weight="bold">= 22</text>
<text x="300" y="52" fill="#222" font-weight="bold">n = 2</text>
<rect x="300" y="62" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="355" y="83" fill="#222" text-anchor="middle">f(2)</text>
<path d="M355,96 L355,112" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="300" y="112" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="355" y="126" fill="#222" text-anchor="middle" font-size="12">g(2*2) = g(4)</text><text x="355" y="140" fill="#222" text-anchor="middle" font-size="12">= 14</text>
<path d="M410,129 L450,129" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<rect x="450" y="112" width="110" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="505" y="126" fill="#222" text-anchor="middle" font-weight="bold">g(14)</text><text x="505" y="140" fill="#222" text-anchor="middle" font-weight="bold">= 24</text>
<text x="20" y="190" fill="#222" font-size="13" font-weight="bold">sum = 0 + 22 + 24 = 46. The loop stops at n = 3 because the test is n &lt; 3.</text>
</svg>
