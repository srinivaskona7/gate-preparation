<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="sans-serif" font-size="13" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Unit interval cut at U; the piece holding 0.4 is (0,U) when U above 0.4 and (U,1) when U below 0.4</title>
<g fill="#1f2937" stroke="none">
<text x="30" y="30">Case U &gt; 0.4: the piece holding 0.4 is (0, U), length U</text>
<text x="30" y="140">Case U &lt; 0.4: the piece holding 0.4 is (U, 1), length 1 - U</text>
<text x="20" y="80">0</text><text x="505" y="80">1</text><text x="192" y="96">0.4</text><text x="345" y="96">U</text>
<text x="20" y="190">0</text><text x="505" y="190">1</text><text x="192" y="206">0.4</text><text x="120" y="206">U</text>
<text x="30" y="232">E = 0.42 + 0.32 = 0.74</text>
</g>
