<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" font-family="sans-serif" font-size="13" fill="none" stroke="#222" stroke-width="1.5"><title>Tilings for options A, B, D and the 15-cell counting argument for C</title>
<text x="10" y="18" fill="#222" stroke="none" font-weight="bold">Tilings found (colour = one tile)</text><text x="10" y="45" fill="#222" stroke="none" >(A) two squares</text><rect x="10" y="52" width="40" height="40" fill="#9cc" stroke="#222"/><rect x="50" y="52" width="40" height="40" fill="#9cc" stroke="#222"/><text x="150" y="45" fill="#222" stroke="none" >(B) three bars</text><rect x="150" y="52" width="80" height="20" fill="#fc9" stroke="#222"/><rect x="150" y="72" width="80" height="20" fill="#fc9" stroke="#222"/><rect x="150" y="92" width="80" height="20" fill="#fc9" stroke="#222"/><text x="290" y="45" fill="#222" stroke="none" >(D) five bars</text><rect x="290" y="52" width="20" height="80" fill="#fc9" stroke="#222"/><rect x="310" y="52" width="20" height="80" fill="#fc9" stroke="#222"/><rect x="330" y="52" width="20" height="80" fill="#fc9" stroke="#222"/><rect x="350" y="52" width="20" height="80" fill="#fc9" stroke="#222"/><rect x="370" y="52" width="20" height="80" fill="#fc9" stroke="#222"/><text x="10" y="170" fill="#222" stroke="none" >(C) 5 x 3 = 15 cells</text><rect x="10" y="178" width="20" height="20" fill="#ddd"/><rect x="30" y="178" width="20" height="20" fill="#ddd"/><rect x="50" y="178" width="20" height="20" fill="#ddd"/><rect x="70" y="178" width="20" height="20" fill="#ddd"/><rect x="90" y="178" width="20" height="20" fill="#ddd"/><rect x="10" y="198" width="20" height="20" fill="#ddd"/><rect x="30" y="198" width="20" height="20" fill="#ddd"/><rect x="50" y="198" width="20" height="20" fill="#ddd"/><rect x="70" y="198" width="20" height="20" fill="#ddd"/><rect x="90" y="198" width="20" height="20" fill="#ddd"/><rect x="10" y="218" width="20" height="20" fill="#ddd"/><rect x="30" y="218" width="20" height="20" fill="#ddd"/><rect x="50" y="218" width="20" height="20" fill="#ddd"/><rect x="70" y="218" width="20" height="20" fill="#ddd"/><rect x="90" y="218" width="20" height="20" fill="#ddd"/><rect x="10" y="178" width="100" height="60" stroke="#222"/><text x="130" y="205" fill="#222" stroke="none" >15 is not a multiple of 4: no tiling exists.</text><text x="130" y="225" fill="#222" stroke="none" >Each tile covers exactly 4 cells.</text>
</svg>
