<text x="250" y="190" fill="#222" stroke="none" font-size="12">Option (iv) shows exactly this stack.</text>
<text x="20" y="225" fill="#222" stroke="none" font-size="12">(i) front-right cell is filled: top view would be a full 3 x 3 square.</text>
<text x="20" y="243" fill="#222" stroke="none" font-size="12">(ii) the middle cell of the right column is 2 high, not 1: the L-shaped top face would split.</text>
<text x="20" y="261" fill="#222" stroke="none" font-size="12">(iii) the back middle cell is 3 high like the tower: the top faces would merge into a wide strip.</text>
<text x="20" y="285" fill="#222" stroke="none" font-size="12" font-weight="bold">Only (iv) reproduces both views.</text>
</svg>
