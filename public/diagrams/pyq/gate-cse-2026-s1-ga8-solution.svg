<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" font-family="sans-serif" font-size="13">
<title>H10(S) rises with slope 1 from S = 10; subtracting H20(S) bends it flat at S = 20, giving the plotted N(S)</title>
<line x1="70" y1="230" x2="70" y2="38" stroke="#999" stroke-width="1"/><text x="70" y="248" text-anchor="middle" fill="#222">0</text><line x1="240" y1="230" x2="240" y2="38" stroke="#999" stroke-width="1"/><text x="240" y="248" text-anchor="middle" fill="#222">10</text><line x1="410" y1="230" x2="410" y2="38" stroke="#999" stroke-width="1"/><text x="410" y="248" text-anchor="middle" fill="#222">20</text><line x1="580" y1="230" x2="580" y2="38" stroke="#999" stroke-width="1"/><text x="580" y="248" text-anchor="middle" fill="#222">30</text><line x1="70" y1="230" x2="580" y2="230" stroke="#999" stroke-width="1"/><text x="62" y="234" text-anchor="end" fill="#222">0</text><line x1="70" y1="198" x2="580" y2="198" stroke="#999" stroke-width="1"/><text x="62" y="202" text-anchor="end" fill="#222">2</text><line x1="70" y1="166" x2="580" y2="166" stroke="#999" stroke-width="1"/><text x="62" y="170" text-anchor="end" fill="#222">4</text><line x1="70" y1="134" x2="580" y2="134" stroke="#999" stroke-width="1"/><text x="62" y="138" text-anchor="end" fill="#222">6</text><line x1="70" y1="102" x2="580" y2="102" stroke="#999" stroke-width="1"/><text x="62" y="106" text-anchor="end" fill="#222">8</text><line x1="70" y1="70" x2="580" y2="70" stroke="#999" stroke-width="1"/><text x="62" y="74" text-anchor="end" fill="#222">10</text><line x1="70" y1="38" x2="580" y2="38" stroke="#999" stroke-width="1"/><text x="62" y="42" text-anchor="end" fill="#222">12</text>
<polyline points="70,230 240,230 444,38" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="6 4" transform="translate(0,0)"/>
<polyline points="70,230 410,230 580,70" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="2 3"/>
<polyline points="70,230 240,230 410,70 580,70" fill="none" stroke="#222" stroke-width="3.5"/>
<text x="70" y="28" fill="#222">dashed: H10(S), continues upward past the chart (20 at S = 30)</text>
<text x="70" y="13" fill="#222">dotted: H20(S) (starts rising at S = 20)</text>
<text x="360" y="13" fill="#222">solid: H10(S) - H20(S) = N(S)</text>
</svg>
