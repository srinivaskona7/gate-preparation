<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
<title>Elimination chart for Vesely's best throw: rounds 1, 2, 4, 5 and 6 are struck out and round 3 is left</title>
<text x="20" y="24" fill="#222" font-weight="bold">Which round holds Vesely's best throw?</text>
<rect x="20" y="44" width="76" height="34" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="58" y="66" text-anchor="middle" fill="#222">Round 1</text>
<line x1="24" y1="48" x2="92" y2="74" stroke="#222" stroke-width="1.5"/><line x1="24" y1="74" x2="92" y2="48" stroke="#222" stroke-width="1.5"/>
<text x="110" y="58" fill="#222" font-weight="bold">Struck out</text>
<text x="110" y="73" fill="#222" font-size="12">Clue i: no medal-winning throw by Jakub or Vesely in rounds 1 and 2</text>
<rect x="20" y="90" width="76" height="34" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="58" y="112" text-anchor="middle" fill="#222">Round 2</text>
<line x1="24" y1="94" x2="92" y2="120" stroke="#222" stroke-width="1.5"/><line x1="24" y1="120" x2="92" y2="94" stroke="#222" stroke-width="1.5"/>
<text x="110" y="104" fill="#222" font-weight="bold">Struck out</text>
<text x="110" y="119" fill="#222" font-size="12">Clue i: same reason as round 1</text>
<rect x="20" y="136" width="76" height="34" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
<text x="58" y="158" text-anchor="middle" fill="#222">Round 3</text>
<text x="110" y="150" fill="#222" font-weight="bold">Left</text>
<text x="110" y="165" fill="#222" font-size="12">No clue rules it out: this is Vesely's best throw</text>
<rect x="20" y="182" width="76" height="34" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="58" y="204" text-anchor="middle" fill="#222">Round 4</text>
<line x1="24" y1="186" x2="92" y2="212" stroke="#222" stroke-width="1.5"/><line x1="24" y1="212" x2="92" y2="186" stroke="#222" stroke-width="1.5"/>
<text x="110" y="196" fill="#222" font-weight="bold">Struck out</text>
<text x="110" y="211" fill="#222" font-size="12">Clue iv: Jakub beat Vesely here, so Vesely cannot be second with his best in round 4</text>
<rect x="20" y="228" width="76" height="34" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="58" y="250" text-anchor="middle" fill="#222">Round 5</text>
<line x1="24" y1="232" x2="92" y2="258" stroke="#222" stroke-width="1.5"/><line x1="24" y1="258" x2="92" y2="232" stroke="#222" stroke-width="1.5"/>
<text x="110" y="242" fill="#222" font-weight="bold">Struck out</text>
<text x="110" y="257" fill="#222" font-size="12">Clue iii: no improvement after round 4</text>
<rect x="20" y="274" width="76" height="34" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="58" y="296" text-anchor="middle" fill="#222">Round 6</text>
<line x1="24" y1="278" x2="92" y2="304" stroke="#222" stroke-width="1.5"/><line x1="24" y1="304" x2="92" y2="278" stroke="#222" stroke-width="1.5"/>
<text x="110" y="288" fill="#222" font-weight="bold">Struck out</text>
<text x="110" y="303" fill="#222" font-size="12">Clue ii: the throw was a foul</text>
</svg>
