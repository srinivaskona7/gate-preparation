<text x="470" y="110" text-anchor="start" fill="#222" font-size="12">thin circle = internal node (positions 1 to 5)</text>
<text x="470" y="130" text-anchor="start" fill="#222" font-size="12">(n-1)/2 = 5  internal   (B)</text>
