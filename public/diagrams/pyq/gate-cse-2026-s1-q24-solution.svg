<text x="70.0" y="172" text-anchor="middle" fill="#222" font-size="11">+1</text>
<text x="24" y="218" text-anchor="start" fill="#222" font-size="12">Key 24: home 9 is taken, 10 is taken, wrap to 0 is taken, and 1 is free.</text>
<text x="24" y="238" text-anchor="start" fill="#222" font-size="12">Empty slots at the end: 2, 3, 4, 5, 6 (dashed cells).</text>
