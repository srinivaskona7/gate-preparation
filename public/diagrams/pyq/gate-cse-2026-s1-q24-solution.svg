<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 252" font-family="sans-serif" font-size="13">
<title>Linear probing table of 11 slots: 15 in slot 0, 24 in slot 1, 22 in slot 7, 1 in slot 8, 13 in slot 9, 11 in slot 10; slots 2 to 6 stay empty</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
