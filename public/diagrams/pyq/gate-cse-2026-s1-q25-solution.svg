<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Two different parse trees for the string abb in the grammar S → aSbS | bS | ε</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="165" y="22" text-anchor="middle" font-size="12" fill="#222">Tree 1: S → aSbS, left S → ε, right S → bS → b</text>
<text x="495" y="22" text-anchor="middle" font-size="12" fill="#222">Tree 2: S → aSbS, left S → bS → b, right S → ε</text>
<text x="150" y="54" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<text x="60" y="114" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">a</text>
<line x1="150" y1="60" x2="60" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="120" y="114" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="150" y1="60" x2="120" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="180" y="114" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="150" y1="60" x2="180" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="240" y="114" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="150" y1="60" x2="240" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="120" y="174" text-anchor="middle" font-size="17" fill="#222">ε</text>
<line x1="120" y1="120" x2="120" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="215" y="174" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="240" y1="120" x2="215" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="265" y="174" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="240" y1="120" x2="265" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="265" y="234" text-anchor="middle" font-size="17" fill="#222">ε</text>
<line x1="265" y1="180" x2="265" y2="219" stroke="#222" stroke-width="1.4"/>
<text x="480" y="54" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<text x="390" y="114" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">a</text>
<line x1="480" y1="60" x2="390" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="450" y="114" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="480" y1="60" x2="450" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="510" y="114" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="480" y1="60" x2="510" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="570" y="114" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="480" y1="60" x2="570" y2="99" stroke="#222" stroke-width="1.4"/>
<text x="425" y="174" text-anchor="middle" font-size="17" fill="#222" font-family="monospace">b</text>
<line x1="450" y1="120" x2="425" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="475" y="174" text-anchor="middle" font-size="17" fill="#222" font-weight="bold">S</text>
<line x1="450" y1="120" x2="475" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="475" y="234" text-anchor="middle" font-size="17" fill="#222">ε</text>
<line x1="475" y1="180" x2="475" y2="219" stroke="#222" stroke-width="1.4"/>
<text x="570" y="174" text-anchor="middle" font-size="17" fill="#222">ε</text>
<line x1="570" y1="120" x2="570" y2="159" stroke="#222" stroke-width="1.4"/>
<text x="165" y="280" text-anchor="middle" font-size="13" fill="#222">yield: a · ε · b · b · ε = abb</text>
<text x="495" y="280" text-anchor="middle" font-size="13" fill="#222">yield: a · b · b · ε · ε = abb</text>
<text x="330" y="314" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">Same string, two parse trees, so the grammar is ambiguous</text>
</svg>
