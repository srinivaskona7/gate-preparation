<text x="219.5" y="115.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0, 1</text>
<line x1="288.0" y1="100.0" x2="351.0" y2="100.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="319.5" y="115.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0, 1</text>
<line x1="388.0" y1="100.0" x2="451.0" y2="100.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="419.5" y="115.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0, 1</text>
<line x1="488.0" y1="100.0" x2="551.0" y2="100.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="519.5" y="115.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0, 1</text>
<text x="360" y="185" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Language: the 5th symbol from the right end is 1.</text>
<text x="360" y="208" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">A DFA must remember the last 5 symbols: 2^5 = 32 states, all distinguishable.</text>
<text x="360" y="231" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">Any 6-state NFA gives at most 2^6 = 64 DFA states, so 65 and 128 are impossible.</text>
</svg>
