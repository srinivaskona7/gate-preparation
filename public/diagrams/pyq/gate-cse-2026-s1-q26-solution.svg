<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" font-size="13">
<title>Six-state NFA for strings whose 5th symbol from the right is 1; its minimal DFA has 32 states, below the 2^6 = 64 ceiling</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<circle cx="70" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="70" y="104" text-anchor="middle" font-size="12" fill="#222">q0</text>
<line x1="18" y1="100" x2="51" y2="100" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="170" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="170" y="104" text-anchor="middle" font-size="12" fill="#222">q1</text>
<circle cx="270" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="270" y="104" text-anchor="middle" font-size="12" fill="#222">q2</text>
<circle cx="370" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="370" y="104" text-anchor="middle" font-size="12" fill="#222">q3</text>
<circle cx="470" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="470" y="104" text-anchor="middle" font-size="12" fill="#222">q4</text>
<circle cx="570" cy="100" r="18" fill="none" stroke="#222" stroke-width="1.6"/>
<circle cx="570" cy="100" r="14" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="570" y="104" text-anchor="middle" font-size="12" fill="#222">q5</text>
<path d="M61,84 C40,48 100,48 79,84" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="70" y="51" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">0, 1</text>
<line x1="88.0" y1="100.0" x2="151.0" y2="100.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="119.5" y="115.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#222">1</text>
