<text x="60" y="512" text-anchor="start" fill="#222" font-size="12">Thick circles: 11 internal nodes (2 children each).  Thin circles: 12 leaves.</text>
<text x="60" y="532" text-anchor="start" fill="#222" font-size="12">Nodes = 11 + 12 = 23.  Longest root-to-leaf path = 11 edges.</text>
<text x="60" y="552" text-anchor="start" fill="#222" font-size="12">Every internal node but one spends its second child on a leaf, so the spine is as long as it can be.</text>
