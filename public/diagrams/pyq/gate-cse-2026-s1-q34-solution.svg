<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 244" font-family="sans-serif" font-size="13">
<title>Scope of i in func: the outer parameter i stays 9 while an inner block declares a new i that counts to 10, and printf outside the block prints the outer i, 9</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Two different variables named i live inside func</text>
<rect x="20" y="36" width="480" height="190" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="30" y="54" fill="#222" font-size="12" font-weight="bold">func(int i, int j)   called as func(9, 10)</text>
<rect x="40" y="66" width="120" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="100" y="88" fill="#222" text-anchor="middle" font-weight="bold">outer i = 9</text>
<rect x="180" y="66" width="120" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="240" y="88" fill="#222" text-anchor="middle">j = 10, then 30</text>
<rect x="40" y="116" width="310" height="90" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="50" y="132" fill="#222" font-size="11">block of if (i &lt; j), 9 &lt; 10 is true; its i hides the outer i</text>
<rect x="56" y="142" width="130" height="46" stroke="#222" stroke-width="1.5" fill="none"/><text x="121" y="161.5" fill="#222" text-anchor="middle" font-weight="bold">int i = 0</text><text x="121" y="176.5" fill="#222" text-anchor="middle" font-weight="bold">ends at 10</text>
<text x="200" y="160" fill="#222" font-size="11">while (i &lt; 10): j += 2, i++</text>
<text x="200" y="178" fill="#222" font-size="11">10 passes: j = 10 + 20 = 30</text>
<text x="362" y="160" fill="#222" font-size="11">printf is outside the block:</text>
<text x="362" y="176" fill="#222" font-size="11">it sees the outer i</text>
<text x="362" y="194" fill="#222" font-size="13" font-weight="bold">prints 9</text>
</svg>
