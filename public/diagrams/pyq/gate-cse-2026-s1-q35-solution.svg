<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="sans-serif" font-size="13">
<title>Five processes each hold one unit: with k = 5 nothing is free and all wait, with k = 6 one process gets its second unit and finishes</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">k = 5: every process holds 1 unit, 0 units free</text>
<circle cx="70" cy="66" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="70" y="70" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="54" y="100" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="70.0" y="115.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="70.0" y1="100.0" x2="70.0" y2="92.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="200" cy="66" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="200" y="70" text-anchor="middle" fill="#222" font-size="12">P2</text>
<rect x="184" y="100" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="200.0" y="115.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="200.0" y1="100.0" x2="200.0" y2="92.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="330" cy="66" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="330" y="70" text-anchor="middle" fill="#222" font-size="12">P3</text>
<rect x="314" y="100" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="330.0" y="115.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="330.0" y1="100.0" x2="330.0" y2="92.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="460" cy="66" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="460" y="70" text-anchor="middle" fill="#222" font-size="12">P4</text>
<rect x="444" y="100" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="460.0" y="115.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="460.0" y1="100.0" x2="460.0" y2="92.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="590" cy="66" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="590" y="70" text-anchor="middle" fill="#222" font-size="12">P5</text>
<rect x="574" y="100" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="590.0" y="115.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="590.0" y1="100.0" x2="590.0" y2="92.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="20" y="150" text-anchor="start" fill="#222" font-size="12">All five wait for a 2nd unit that only another waiting process could free: deadlock.</text>
<text x="20" y="184" text-anchor="start" fill="#222" font-size="12" font-weight="bold">k = 6: the same 5 holdings plus 1 free unit</text>
<circle cx="70" cy="226" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="70" y="230" text-anchor="middle" fill="#222" font-size="12">P1</text>
<rect x="54" y="258" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="70.0" y="273.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="70.0" y1="258.0" x2="70.0" y2="252.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="200" cy="226" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="200" y="230" text-anchor="middle" fill="#222" font-size="12">P2</text>
<rect x="184" y="258" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="200.0" y="273.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="200.0" y1="258.0" x2="200.0" y2="252.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="330" cy="226" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="330" y="230" text-anchor="middle" fill="#222" font-size="12">P3</text>
<rect x="314" y="258" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="330.0" y="273.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="330.0" y1="258.0" x2="330.0" y2="252.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="460" cy="226" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="460" y="230" text-anchor="middle" fill="#222" font-size="12">P4</text>
<rect x="444" y="258" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="460.0" y="273.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="460.0" y1="258.0" x2="460.0" y2="252.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<circle cx="590" cy="226" r="24" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="590" y="230" text-anchor="middle" fill="#222" font-size="12">P5</text>
<rect x="574" y="258" width="32" height="22" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="590.0" y="273.0" text-anchor="middle" fill="#222" font-size="12">R</text>
<line x1="590.0" y1="258.0" x2="590.0" y2="252.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="640" y="205" width="60" height="30" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="670.0" y="224.0" text-anchor="middle" fill="#222" font-size="12">free R</text>
<line x1="640.0" y1="220.0" x2="618.0" y2="220.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="20" y="296" text-anchor="start" fill="#222" font-size="11">The free unit goes to one process (P5 here): it holds 2, finishes, returns 2, and the rest follow.</text>
</svg>
