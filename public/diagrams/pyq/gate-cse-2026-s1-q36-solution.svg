<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1f2937"><title>Adding 1.5 x 2^-20 and 1.25 x 2^-22 in IEEE 754</title>
<text x="380" y="24" text-anchor="middle" font-weight="bold">X = 0x35C00000 and Y = 0x34A00000</text>
<text x="380" y="56" text-anchor="middle" >X: sign 0, exponent 01101011 = 107, fraction 1000...0  ->  1.1000 x 2^-20</text>
<text x="380" y="82" text-anchor="middle" >Y: sign 0, exponent 01101001 = 105, fraction 0100...0  ->  1.0100 x 2^-22</text>
<line x1="40" y1="100" x2="720" y2="100" stroke="#1f2937" stroke-width="1.2"/>
<text x="380" y="126" text-anchor="middle" >Shift Y right by 107 - 105 = 2 places so both use 2^-20</text>
<text x="380" y="160" text-anchor="middle">X   1.100000</text>
<text x="380" y="186" text-anchor="middle" >Y   0.010100</text>
<line x1="300" y1="196" x2="460" y2="196" stroke="#1f2937" stroke-width="1.2"/>
<text x="380" y="220" text-anchor="middle" >Z   1.110100  = 1.1101 x 2^-20</text>
<text x="380" y="254" text-anchor="middle" >exponent stays 107 = 01101011; fraction = 1101 0000 ... 0</text>
<text x="380" y="280" text-anchor="middle" >0 | 01101011 | 1101000 0000 0000 0000 0000</text>
<text x="380" y="310" text-anchor="middle" font-weight="bold">0011 0101 1110 1000 0000 ... = 0x35E80000</text>
</svg>