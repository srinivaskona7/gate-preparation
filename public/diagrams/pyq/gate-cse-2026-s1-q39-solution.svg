<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="13">
<title>A three-node list n1, n2, n3 then NULL. Option B stops at the last node and returns 3, 2, 1 up the chain; option C stops at NULL and returns 4, 3, 2, 1 so it counts one too many</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="60" y="40" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="99.6" y1="40" x2="99.6" y2="70" stroke="#222" stroke-width="1.4"/>
<text x="79.8" y="60.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">n1</text>
<circle cx="109.8" cy="55.0" r="2.8" fill="#222"/>
<rect x="210" y="40" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="249.6" y1="40" x2="249.6" y2="70" stroke="#222" stroke-width="1.4"/>
<text x="229.8" y="60.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">n2</text>
<circle cx="259.8" cy="55.0" r="2.8" fill="#222"/>
<rect x="360" y="40" width="60" height="30" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="399.6" y1="40" x2="399.6" y2="70" stroke="#222" stroke-width="1.4"/>
<text x="379.8" y="60.0" text-anchor="middle" fill="#222" font-size="14" font-weight="bold">n3</text>
<circle cx="409.8" cy="55.0" r="2.8" fill="#222"/>
<line x1="109.8" y1="55.0" x2="210" y2="55.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="259.8" y1="55.0" x2="360" y2="55.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="409.8" y1="55.0" x2="454" y2="55.0" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="480" y="60.0" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">NULL</text>
<text x="12" y="28" text-anchor="start" fill="#6b7280" font-size="11">head starts at n1</text>
<text x="10" y="112" text-anchor="start" fill="#222" font-size="13" font-weight="bold">(B)  head-&gt;next == NULL stops at the last node</text>
<text x="90.0" y="138" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">returns 3</text>
<text x="240.0" y="138" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">returns 2</text>
<text x="390.0" y="138" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">returns 1</text>
<text x="480" y="138" text-anchor="middle" fill="#6b7280" font-size="12">not called</text>
<text x="10" y="184" text-anchor="start" fill="#b91c1c" font-size="13" font-weight="bold">(C)  head == NULL stops one call too late</text>
<text x="90.0" y="210" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="bold">returns 4</text>
<text x="240.0" y="210" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="bold">returns 3</text>
<text x="390.0" y="210" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="bold">returns 2</text>
<text x="480" y="210" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="bold">returns 1</text>
</svg>
