<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="sans-serif" font-size="13">
<title>Perfect BST on keys 1 to 15 with root 8: after 8 the second key must be 4 or 12, so the third key can only be 2, 4, 6, 10, 12 or 14 (thick circles); key 5 is a leaf under 6 and 4 and can never be third</title>
