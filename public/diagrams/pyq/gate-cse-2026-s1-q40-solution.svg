<circle cx="94" cy="162" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="94" y="166.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="50" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="230.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="138" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="138" y="230.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<circle cx="270" cy="162" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="270" y="166.42" text-anchor="middle" fill="#222" font-size="13">6</text>
<circle cx="226" cy="226" r="16" fill="none" stroke="#222" stroke-width="3.4" stroke-dasharray="4 3"/>
<text x="226" y="230.42" text-anchor="middle" fill="#222" font-size="13">5</text>
<circle cx="314" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="314" y="230.42" text-anchor="middle" fill="#222" font-size="13">7</text>
<circle cx="534" cy="98" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="534" y="102.42" text-anchor="middle" fill="#222" font-size="13">12</text>
<circle cx="446" cy="162" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="446" y="166.42" text-anchor="middle" fill="#222" font-size="13">10</text>
<circle cx="402" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="402" y="230.42" text-anchor="middle" fill="#222" font-size="13">9</text>
<circle cx="490" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="490" y="230.42" text-anchor="middle" fill="#222" font-size="13">11</text>
<circle cx="622" cy="162" r="16" fill="none" stroke="#222" stroke-width="3.4"/>
<text x="622" y="166.42" text-anchor="middle" fill="#222" font-size="13">14</text>
