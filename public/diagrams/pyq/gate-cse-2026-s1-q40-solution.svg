<line x1="373.0" y1="39.5" x2="519.0" y2="92.5" stroke="#222" stroke-width="1.6"/>
<line x1="521.1" y1="107.4" x2="458.9" y2="152.6" stroke="#222" stroke-width="1.6"/>
<line x1="436.9" y1="175.2" x2="411.1" y2="212.8" stroke="#222" stroke-width="1.6"/>
<line x1="455.1" y1="175.2" x2="480.9" y2="212.8" stroke="#222" stroke-width="1.6"/>
<line x1="546.9" y1="107.4" x2="609.1" y2="152.6" stroke="#222" stroke-width="1.6"/>
<line x1="612.9" y1="175.2" x2="587.1" y2="212.8" stroke="#222" stroke-width="1.6"/>
<line x1="631.1" y1="175.2" x2="656.9" y2="212.8" stroke="#222" stroke-width="1.6"/>
<circle cx="358" cy="34" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="358" y="38.42" text-anchor="middle" fill="#222" font-size="13">8</text>
