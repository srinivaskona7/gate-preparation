<circle cx="666" cy="226" r="16" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="666" y="230.42" text-anchor="middle" fill="#222" font-size="13">15</text>
<text x="40" y="268" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Third key candidates</text>
<text x="40" y="290" text-anchor="start" fill="#222" font-size="12">thick circle: can be the 3rd key</text>
<text x="40" y="310" text-anchor="start" fill="#222" font-size="12">1st key = 8, 2nd key = 4 or 12,</text>
<text x="40" y="330" text-anchor="start" fill="#222" font-size="12">3rd key = a child of those two:</text>
<text x="40" y="350" text-anchor="start" fill="#222" font-size="12">2, 4, 6, 10, 12 or 14</text>
<text x="40" y="370" text-anchor="start" fill="#222" font-size="12">dashed circle 5 needs 8, 4 and 6 first,</text>
<text x="40" y="390" text-anchor="start" fill="#222" font-size="12">so it comes 4th at the earliest</text>
</svg>
