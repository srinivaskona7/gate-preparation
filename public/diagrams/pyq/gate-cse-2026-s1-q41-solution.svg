<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" font-family="sans-serif">
<title>Triangle with weights 5, minus 4 and 10 where d2 of u exceeds d2 of v</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#222"/></marker></defs>
<line x1="74.65851735843502" y1="103.58689865568468" x2="205.34148264156497" y2="46.41310134431532" stroke="#222" stroke-width="1.5"/>
<text x="135.19017399176352" y="68.00611198117373" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">5</text>
<line x1="234.65851735843503" y1="46.41310134431532" x2="365.341482641565" y2="103.58689865568468" stroke="#222" stroke-width="1.5"/>
<text x="304.8098260082365" y="68.00611198117373" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">-4</text>
<line x1="76.0" y1="110.0" x2="364.0" y2="110.0" stroke="#222" stroke-width="1.5"/>
<text x="220.0" y="126.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">10</text>
<circle cx="60" cy="110" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="60" y="114" text-anchor="middle" font-size="13" fill="#222">s</text>
<circle cx="220" cy="40" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="220" y="44" text-anchor="middle" font-size="13" fill="#222">u</text>
<circle cx="380" cy="110" r="16" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="380" y="114" text-anchor="middle" font-size="13" fill="#222">v</text>
<text x="30" y="170" text-anchor="start" font-size="12" fill="#222">k = 1:  d(u) = 5   d(v) = 10</text>
<text x="30" y="188" text-anchor="start" font-size="12" fill="#222">k = 2:  d(u) = 5   d(v) = 1   (s to u to v)</text>
<text x="300" y="170" text-anchor="start" font-size="12" fill="#222">S2 needs d2(u) &lt;= d2(v):</text>
<text x="300" y="188" text-anchor="start" font-size="12" font-weight="bold" fill="#222">5 &lt;= 1 is false</text>
</svg>
