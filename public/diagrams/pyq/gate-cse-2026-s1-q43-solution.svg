<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img">
<title>Join chain for the projection: R.Q equals S.X, output P</title>
<rect x="35.0" y="40.0" width="150" height="60" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="110" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">R(P, Q)</text>
<rect x="415.0" y="40.0" width="150" height="60" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="490" y="74.2" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">S(X, Y)</text>
<line x1="185" y1="70" x2="415" y2="70" stroke="#1f2937" stroke-width="1.4"/>
<text x="300" y="58" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Q = X  (shared v)</text>
<text x="110" y="125" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">u is P</text>
<text x="110" y="142" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">v is Q</text>
<text x="490" y="125" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">v is X</text>
<text x="490" y="142" font-size="12" text-anchor="middle" fill="#1f2937" font-family="Helvetica,Arial,sans-serif">w is Y (free, projected away)</text>
<text x="300" y="200" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Output = Pi_P ( R join on R.Q = S.X  S )</text>
</svg>
