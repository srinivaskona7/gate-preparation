<text x="10" y="144" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">Frame 1 is fully sent at 10 ms, its last bit arrives at 110 ms, the ACK returns at 210 ms.</text>
<text x="10" y="158" font-size="12" text-anchor="start" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">21 frames x 10 ms = 210 ms, so frame 22 can start the instant ACK 1 arrives: no idle time.</text>
