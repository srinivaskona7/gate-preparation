<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif">
<title>Possible and impossible discovery and finish interval orders for a DAG edge u to v</title>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#222"/></marker></defs>
<text x="10" y="24" text-anchor="start" font-size="12" fill="#222">A  d[u]&lt;d[v]&lt;f[v]&lt;f[u]   possible</text>
<rect x="310" y="14" width="190" height="8" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<text x="296" y="23" text-anchor="start" font-size="11" fill="#222">u</text>
<rect x="360" y="28" width="90" height="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="346" y="36" text-anchor="start" font-size="11" fill="#222">v</text>
<text x="10" y="42" text-anchor="start" font-size="11" fill="#222">v nested inside u: tree or forward edge</text>
<text x="10" y="82" text-anchor="start" font-size="12" font-weight="bold" fill="#222">B  d[v]&lt;d[u]&lt;f[u]&lt;f[v]   NEVER</text>
<rect x="360" y="72" width="90" height="8" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<text x="346" y="81" text-anchor="start" font-size="11" fill="#222">u</text>
<rect x="310" y="86" width="190" height="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="296" y="94" text-anchor="start" font-size="11" fill="#222">v</text>
<text x="10" y="100" text-anchor="start" font-size="11" fill="#222">u nested inside v: back edge, needs a cycle</text>
<text x="10" y="140" text-anchor="start" font-size="12" fill="#222">C  d[v]&lt;f[v]&lt;d[u]&lt;f[u]   possible</text>
<rect x="420" y="130" width="80" height="8" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<text x="406" y="139" text-anchor="start" font-size="11" fill="#222">u</text>
<rect x="310" y="144" width="90" height="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="296" y="152" text-anchor="start" font-size="11" fill="#222">v</text>
<text x="10" y="158" text-anchor="start" font-size="11" fill="#222">v finishes before u starts: cross edge</text>
<text x="10" y="198" text-anchor="start" font-size="12" font-weight="bold" fill="#222">D  d[u]&lt;d[v]&lt;f[u]&lt;f[v]   NEVER</text>
<rect x="310" y="188" width="100" height="8" fill="#ccc" stroke="#222" stroke-width="1.5"/>
<text x="296" y="197" text-anchor="start" font-size="11" fill="#222">u</text>
<rect x="360" y="202" width="140" height="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="346" y="210" text-anchor="start" font-size="11" fill="#222">v</text>
<text x="10" y="216" text-anchor="start" font-size="11" fill="#222">intervals overlap: never happens in DFS</text>
</svg>
