<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="sans-serif" font-size="13">
<title>Table of the five productions with the a-minus-b and 2b-minus-a counts of their own terminals</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="30" text-anchor="start" font-size="13" fill="#222" font-weight="bold">production</text>
<text x="250" y="30" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">own a</text>
<text x="330" y="30" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">own b</text>
<text x="410" y="30" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">a − b</text>
<text x="520" y="30" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">2b − a</text>
<line x1="15" y1="42" x2="640" y2="42" stroke="#222" stroke-width="1.4"/>
<text x="20" y="72" text-anchor="start" font-size="14" fill="#222" font-family="monospace">S → a b a A B A b b a</text>
<text x="250" y="72" text-anchor="middle" font-size="14" fill="#222">3</text>
<text x="330" y="72" text-anchor="middle" font-size="14" fill="#222">3</text>
<text x="410" y="72" text-anchor="middle" font-size="14" fill="#222">0</text>
<text x="520" y="72" text-anchor="middle" font-size="14" fill="#222">3</text>
<text x="20" y="106" text-anchor="start" font-size="14" fill="#222" font-family="monospace">A → a a B B A b</text>
<text x="250" y="106" text-anchor="middle" font-size="14" fill="#222">2</text>
<text x="330" y="106" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="410" y="106" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="520" y="106" text-anchor="middle" font-size="14" fill="#222">0</text>
<text x="20" y="140" text-anchor="start" font-size="14" fill="#222" font-family="monospace">A → b B a b a a</text>
<text x="250" y="140" text-anchor="middle" font-size="14" fill="#222">3</text>
<text x="330" y="140" text-anchor="middle" font-size="14" fill="#222">2</text>
<text x="410" y="140" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="520" y="140" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="20" y="174" text-anchor="start" font-size="14" fill="#222" font-family="monospace">B → a B b</text>
<text x="250" y="174" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="330" y="174" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="410" y="174" text-anchor="middle" font-size="14" fill="#222">0</text>
<text x="520" y="174" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="20" y="208" text-anchor="start" font-size="14" fill="#222" font-family="monospace">B → a b</text>
<text x="250" y="208" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="330" y="208" text-anchor="middle" font-size="14" fill="#222">1</text>
<text x="410" y="208" text-anchor="middle" font-size="14" fill="#222">0</text>
<text x="520" y="208" text-anchor="middle" font-size="14" fill="#222">1</text>
<line x1="15" y1="224" x2="640" y2="224" stroke="#222" stroke-width="1.4"/>
<text x="20" y="252" text-anchor="start" font-size="12" fill="#222">Each terminal comes from exactly one production, so n1 − n2 is the sum of the a − b column over the productions used,</text>
<text x="20" y="270" text-anchor="start" font-size="12" fill="#222">and 2·n2 − n1 is the sum of the 2b − a column. No entry in either column is negative: n1 ≥ n2 and n1 ≤ 2·n2.</text>
<text x="20" y="296" text-anchor="start" font-size="12" fill="#222" font-weight="bold">S uses A twice and each A adds at least 1, so n1 − n2 ≥ 2 &gt; 0 and n1 &lt; n2 is impossible.</text>
</svg>
