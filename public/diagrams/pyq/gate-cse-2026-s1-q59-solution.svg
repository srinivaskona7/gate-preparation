<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Head path over tracks 0, 5, 12, 7 costs 17 ms of seek, plus 30 random sectors at 2.01 ms each, total 77.3 ms</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<g fill="none" stroke-width="1.5">
<path d="M30 110 H380"/>
<path d="M30 104 V116 M56 104 V116 M82 104 V116 M108 104 V116 M134 104 V116 M160 104 V116 M186 104 V116 M212 104 V116 M238 104 V116 M264 104 V116 M290 104 V116 M316 104 V116 M342 104 V116"/>
<path d="M30 98 Q95 50 158 98" marker-end="url(#a)"/>
<path d="M164 98 Q253 40 340 98" marker-end="url(#a)"/>
<path d="M338 124 Q275 172 214 124" marker-end="url(#a)"/>
</g>
<g stroke="none" text-anchor="middle">
<text x="30" y="136">0</text><text x="160" y="136">5</text><text x="212" y="100">7</text><text x="342" y="136">12</text>
<text x="94" y="58">5 ms</text><text x="252" y="48">7 ms</text><text x="276" y="172">5 ms</text>
<text x="400" y="70" text-anchor="start" font-size="12">order of visits: 0, 5, 12, 7</text>
<text x="400" y="92" text-anchor="start" font-size="12">tick marks are single tracks</text>
</g>
<g stroke="none">
<text x="10" y="24" font-weight="bold">Seek: 1 ms per track crossed, 5 + 7 + 5 = 17 ms</text>
<text x="10" y="216">One revolution 4 ms; average latency 2 ms; one sector 4 / 400 = 0.01 ms.</text>
<text x="10" y="238">Random sector: 2 + 0.01 = 2.01 ms.  3 tracks x 10 sectors = 30 sectors = 60.3 ms.</text>
<text x="10" y="266" font-weight="bold">Total = 17 + 60.3 = 77.3 ms</text>
</g>
</svg>
