<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 293" font-family="sans-serif" font-size="11">
<title>Bars of EX-stage time for each instruction type against 1 ns clock cycles; extra cycles over one are stalls, total 95</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="10" y="18" text-anchor="start" fill="#222" font-size="12" font-weight="bold">EX time of each instruction type against the 1 ns clock (dashed lines are cycle boundaries)</text><line x1="70" y1="28" x2="70" y2="242" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="170" y1="28" x2="170" y2="242" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="270" y1="28" x2="270" y2="242" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="370" y1="28" x2="370" y2="242" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="470" y1="28" x2="470" y2="242" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/><text x="70" y="256" text-anchor="middle" fill="#222" font-size="10">0 ns</text><text x="170" y="256" text-anchor="middle" fill="#222" font-size="10">1 ns</text><text x="270" y="256" text-anchor="middle" fill="#222" font-size="10">2 ns</text><text x="370" y="256" text-anchor="middle" fill="#222" font-size="10">3 ns</text><text x="470" y="256" text-anchor="middle" fill="#222" font-size="10">4 ns</text><text x="62" y="48" text-anchor="end" fill="#222" font-size="11">LOAD</text><rect x="70" y="34" width="180" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="48" text-anchor="start" fill="#222" font-size="10">1.8 ns: 2 cycles, 1 stall x 15 = 15</text><text x="62" y="78" text-anchor="end" fill="#222" font-size="11">IMUL</text><rect x="70" y="64" width="150" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="78" text-anchor="start" fill="#222" font-size="10">1.5 ns: 2 cycles, 1 stall x 10 = 10</text><text x="62" y="108" text-anchor="end" fill="#222" font-size="11">IDIV</text><rect x="70" y="94" width="250" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="108" text-anchor="start" fill="#222" font-size="10">2.5 ns: 3 cycles, 2 stall x 5 = 10</text><text x="62" y="138" text-anchor="end" fill="#222" font-size="11">FADD</text><rect x="70" y="124" width="170" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="138" text-anchor="start" fill="#222" font-size="10">1.7 ns: 2 cycles, 1 stall x 10 = 10</text><text x="62" y="168" text-anchor="end" fill="#222" font-size="11">FSUB</text><rect x="70" y="154" width="170" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="168" text-anchor="start" fill="#222" font-size="10">1.7 ns: 2 cycles, 1 stall x 5 = 5</text><text x="62" y="198" text-anchor="end" fill="#222" font-size="11">FMUL</text><rect x="70" y="184" width="280" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="198" text-anchor="start" fill="#222" font-size="10">2.8 ns: 3 cycles, 2 stall x 15 = 30</text><text x="62" y="228" text-anchor="end" fill="#222" font-size="11">FDIV</text><rect x="70" y="214" width="320" height="20" fill="#d9d9d9" stroke="#222" stroke-width="1.2"/><text x="500" y="228" text-anchor="start" fill="#222" font-size="10">3.2 ns: 4 cycles, 3 stall x 5 = 15</text><text x="10" y="280" text-anchor="start" fill="#222" font-size="12" font-weight="bold">Total structural stalls = 15 + 10 + 10 + 10 + 5 + 30 + 15 = 95 cycles</text>
</svg>
