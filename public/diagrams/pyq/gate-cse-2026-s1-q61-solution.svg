<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 204" font-family="sans-serif" font-size="13">
<title>Chain 65536, 16, 4, 2, 1 under repeated floor of log base 2, with foo values 5, 4, 3, 2, 1: the smallest n with foo(n) = 5 is 65536</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">foo(n) = 1 + foo(floor(log2 n)); bar(n) = floor(log2 n)</text>
<rect x="20" y="50" width="90" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="65" y="72" fill="#222" text-anchor="middle" font-weight="bold">n = 65536</text>
<text x="65" y="112" fill="#222" text-anchor="middle">foo = 5</text>
<path d="M110,68 L160,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="135" y="60" fill="#222" text-anchor="middle" font-size="11">bar</text>
<rect x="160" y="50" width="90" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="205" y="72" fill="#222" text-anchor="middle" font-weight="bold">n = 16</text>
<text x="205" y="112" fill="#222" text-anchor="middle">foo = 4</text>
<path d="M250,68 L300,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="275" y="60" fill="#222" text-anchor="middle" font-size="11">bar</text>
<rect x="300" y="50" width="90" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="345" y="72" fill="#222" text-anchor="middle" font-weight="bold">n = 4</text>
<text x="345" y="112" fill="#222" text-anchor="middle">foo = 3</text>
<path d="M390,68 L440,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="415" y="60" fill="#222" text-anchor="middle" font-size="11">bar</text>
<rect x="440" y="50" width="90" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="485" y="72" fill="#222" text-anchor="middle" font-weight="bold">n = 2</text>
<text x="485" y="112" fill="#222" text-anchor="middle">foo = 2</text>
<path d="M530,68 L580,68" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="555" y="60" fill="#222" text-anchor="middle" font-size="11">bar</text>
<rect x="580" y="50" width="90" height="36" stroke="#222" stroke-width="1.5" fill="none"/><text x="625" y="72" fill="#222" text-anchor="middle" font-weight="bold">n = 1</text>
<text x="625" y="112" fill="#222" text-anchor="middle">foo = 1</text>
<text x="20" y="150" fill="#222" font-size="12">bar(65536) = 16, bar(16) = 4, bar(4) = 2, bar(2) = 1: four steps down to 1.</text>
<text x="20" y="168" fill="#222" font-size="12">foo(1) = 1 and every step up adds 1, so foo(65536) = 5. Going back, a smaller n would</text>
<text x="20" y="186" fill="#222" font-size="12">need a smaller log at some step: bar(65535) = 15 gives foo(15) = 3, so foo(65535) = 4.</text>
</svg>
