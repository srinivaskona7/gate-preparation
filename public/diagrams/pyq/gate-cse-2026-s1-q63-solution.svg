<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" font-family="sans-serif" font-size="13">
<title>Chain of four processes created by the loop; each prints Hello once, so printf runs 4 times</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="50" width="150" height="190" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="95" y="74" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">P0 (original)</text>
<text x="95" y="94" text-anchor="middle" fill="#222" font-size="13">starts with i = 0</text>
<text x="95" y="124" text-anchor="middle" fill="#222" font-size="12">fork() returns child pid</text>
<text x="95" y="140" text-anchor="middle" fill="#222" font-size="12">not 0, so break</text>
<text x="95" y="156" text-anchor="middle" fill="#222" font-size="12">leaves the loop</text>
<rect x="35" y="190" width="120" height="36" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="95" y="213" text-anchor="middle" fill="#222" font-size="12">printf("Hello!")</text>
<path d="M170,150 L190,150" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="180" y="142" text-anchor="middle" fill="#222" font-size="11">fork</text>
<rect x="190" y="50" width="150" height="190" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="265" y="74" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C1</text>
<text x="265" y="94" text-anchor="middle" fill="#222" font-size="13">forked at i = 0</text>
<text x="265" y="124" text-anchor="middle" fill="#222" font-size="12">fork() returned 0</text>
<text x="265" y="140" text-anchor="middle" fill="#222" font-size="12">continue, i becomes 1</text>
<text x="265" y="156" text-anchor="middle" fill="#222" font-size="12">fork() at i = 1: child C2</text>
<rect x="205" y="190" width="120" height="36" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="265" y="213" text-anchor="middle" fill="#222" font-size="12">printf("Hello!")</text>
<path d="M340,150 L360,150" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="350" y="142" text-anchor="middle" fill="#222" font-size="11">fork</text>
<rect x="360" y="50" width="150" height="190" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="435" y="74" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C2</text>
<text x="435" y="94" text-anchor="middle" fill="#222" font-size="13">forked at i = 1</text>
<text x="435" y="124" text-anchor="middle" fill="#222" font-size="12">fork() returned 0</text>
<text x="435" y="140" text-anchor="middle" fill="#222" font-size="12">continue, i becomes 2</text>
<text x="435" y="156" text-anchor="middle" fill="#222" font-size="12">fork() at i = 2: child C3</text>
<rect x="375" y="190" width="120" height="36" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="435" y="213" text-anchor="middle" fill="#222" font-size="12">printf("Hello!")</text>
<path d="M510,150 L530,150" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="520" y="142" text-anchor="middle" fill="#222" font-size="11">fork</text>
<rect x="530" y="50" width="150" height="190" rx="6" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="605" y="74" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">C3</text>
<text x="605" y="94" text-anchor="middle" fill="#222" font-size="13">forked at i = 2</text>
<text x="605" y="124" text-anchor="middle" fill="#222" font-size="12">fork() returned 0</text>
<text x="605" y="140" text-anchor="middle" fill="#222" font-size="12">continue, i becomes 3</text>
<text x="605" y="156" text-anchor="middle" fill="#222" font-size="12">loop test 3 &lt; 3 fails</text>
<rect x="545" y="190" width="120" height="36" rx="6" fill="none" stroke="#222" stroke-width="2"/>
<text x="605" y="213" text-anchor="middle" fill="#222" font-size="12">printf("Hello!")</text>
<text x="350" y="24" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Each process leaves the loop once and prints once: 4 processes, 4 prints</text>
<text x="350" y="268" text-anchor="middle" fill="#222" font-size="12">Parent breaks at its first fork; only the child continues the loop.</text>
</svg>
