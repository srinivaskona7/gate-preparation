235" text-anchor="middle" fill="#222" font-size="13">15 </text><text x="190" y="235" text-anchor="middle" fill="#222" font-size="13">15 </text><text x="130" y="257" text-anchor="middle" fill="#222" font-size="12">every row and column sums to 15</text><line x1="330" y1="30" x2="330" y2="250" stroke="#222" stroke-width="1.5"/><text x="445" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Missing tiles: option (i)</text><rect x="410" y="40" width="70" height="70" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="421.6666666666667" cy="51.666666666666664" r="5.384615384615385" fill="#fff" stroke="#222" stroke-width="1.2"/><circle cx="445" cy="51.666666666666664" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="468.33333333333337" cy="51.666666666666664" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="421.6666666666667" cy="75" r="5.384615384615385" fill="#fff" stroke="#222" stroke-width="1.2"/><circle cx="445" cy="75" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="468.33333333333337" cy="75" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="421.6666666666667" cy="98.33333333333333" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="445" cy="98.33333333333333" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><circle cx="468.33333333333337" cy="98.33333333333333" r="5.384615384615385" fill="#222" stroke="#222" stroke-width="1.2"/><text x="520" y="82" text-anchor="start" fill="#222" font-size="13">7 filled</text><rect x="410" y="120" width="70" height="70" fill="none" stroke="#222" stroke-width="1.2"/><circle cx="421.6666666666667" cy="131.66666666666666" r="5.384615384615385" fill="#fff" stroke="#222" stroke-width="1.2"/><circle cx="445" cy="131.66666666666666" r="5.384615384615385" fill="#fff" stroke="#222" stroke-width="1.2"/><circle cx="468.33333333333337" cy="131.6