<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="sans-serif" font-size="13">
<title>Counting filled dots turns the tile grid into the magic square 8 1 6, 3 5 7, 4 9 2, which fixes the missing tiles at 7 and 2 dots</title>
