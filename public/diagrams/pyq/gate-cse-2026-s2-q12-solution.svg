<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
<title>Three traversals of a binary tree: inorder visits left subtree, node, right subtree; preorder node, left, right; postorder left, right, node; example tree 1 with children 2 and 3 gives preorder 1 2 3, inorder 2 1 3, postorder 2 3 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="130" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Any node with its two subtrees</text>
<circle cx="130" cy="60" r="24" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="130" y="64.08" text-anchor="middle" fill="#222" font-size="12">node</text>
<path d="M70,130 L35,190 L105,190 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<path d="M190,130 L155,190 L225,190 Z" fill="none" stroke="#222" stroke-width="1.6"/>
<line x1="112.0" y1="78.0" x2="70.0" y2="130.0" stroke="#222" stroke-width="1.6"/>
<line x1="148.0" y1="78.0" x2="190.0" y2="130.0" stroke="#222" stroke-width="1.6"/>
<text x="70" y="208" text-anchor="middle" fill="#222" font-size="12">left</text>
<text x="70" y="222" text-anchor="middle" fill="#222" font-size="12">subtree</text>
<text x="190" y="208" text-anchor="middle" fill="#222" font-size="12">right</text>
<text x="190" y="222" text-anchor="middle" fill="#222" font-size="12">subtree</text>
<text x="400" y="22" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">Visit order of the three walks</text>
<text x="300" y="62" text-anchor="start" fill="#222" font-size="13" font-weight="bold">I  Inorder</text>
<text x="410" y="62" text-anchor="start" fill="#222" font-size="12">left subtree, node, right subtree</text>
<text x="600" y="62" text-anchor="start" fill="#222" font-size="13" font-weight="bold">= L</text>
<text x="300" y="96" text-anchor="start" fill="#222" font-size="13" font-weight="bold">II  Preorder</text>
<text x="410" y="96" text-anchor="start" fill="#222" font-size="12">node, left subtree, right subtree</text>
<text x="600" y="96" text-anchor="start" fill="#222" font-size="13" font-weight="bold">= M</text>
<text x="300" y="130" text-anchor="start" fill="#222" font-size="13" font-weight="bold">III  Postorder</text>
<text x="410" y="130" text-anchor="start" fill="#222" font-size="12">left subtree, right subtree, node</text>
<text x="600" y="130" text-anchor="start" fill="#222" font-size="13" font-weight="bold">= N</text>
<text x="300" y="176" text-anchor="start" fill="#222" font-size="12" font-style="italic">Example tree: 1 with children 2 and 3</text>
<circle cx="370" cy="205" r="14" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="370" y="209.42" text-anchor="middle" fill="#222" font-size="13">1</text>
<circle cx="335" cy="248" r="14" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="335" y="252.42" text-anchor="middle" fill="#222" font-size="13">2</text>
<circle cx="405" cy="248" r="14" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="405" y="252.42" text-anchor="middle" fill="#222" font-size="13">3</text>
<line x1="361.2" y1="215.9" x2="343.8" y2="237.1" stroke="#222" stroke-width="1.6"/>
<line x1="378.8" y1="215.9" x2="396.2" y2="237.1" stroke="#222" stroke-width="1.6"/>
<text x="450" y="203" text-anchor="start" fill="#222" font-size="12">preorder  1 2 3</text>
<text x="450" y="223" text-anchor="start" fill="#222" font-size="12">inorder   2 1 3</text>
<text x="450" y="243" text-anchor="start" fill="#222" font-size="12">postorder 2 3 1</text>
<text x="450" y="276" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Match: I-L, II-M, III-N  (option A)</text>
</svg>
