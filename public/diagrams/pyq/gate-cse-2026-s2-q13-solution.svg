<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="sans-serif" font-size="13">
<title>A Turing machine that decides L: accepts every string of L, rejects every string outside L, and halts on every input</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="100" width="120" height="60" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="80" y="126" text-anchor="middle" fill="#222" font-size="13">input w</text>
<text x="80" y="146" text-anchor="middle" fill="#222" font-size="11">any string of {0,1}*</text>
<line x1="140" y1="130" x2="200" y2="130" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="200" y="95" width="100" height="70" rx="10" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="250" y="135" text-anchor="middle" fill="#222" font-size="18" font-weight="bold">M</text>
<line x1="300" y1="115" x2="380" y2="60" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="300" y="70" text-anchor="middle" fill="#222" font-size="12">w in L</text>
<rect x="380" y="35" width="200" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="480" y="56" text-anchor="middle" fill="#222" font-size="13">halts and accepts</text>
<text x="480" y="74" text-anchor="middle" fill="#222" font-size="11">(every string of L)</text>
<line x1="300" y1="135" x2="380" y2="135" stroke="#222" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="335" y="125" text-anchor="middle" fill="#222" font-size="12">w not in L</text>
<rect x="380" y="110" width="200" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="480" y="131" text-anchor="middle" fill="#222" font-size="13">halts and rejects</text>
<text x="480" y="149" text-anchor="middle" fill="#222" font-size="11">(every string outside L)</text>
<line x1="300" y1="155" x2="380" y2="220" stroke="#222" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="300" y="218" text-anchor="middle" fill="#222" font-size="12">runs for ever</text>
<rect x="380" y="195" width="200" height="50" rx="6" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="480" y="216" text-anchor="middle" fill="#222" font-size="13">looping: not allowed</text>
<text x="480" y="234" text-anchor="middle" fill="#222" font-size="11">for a decider</text>
<line x1="332" y1="180" x2="352" y2="200" stroke="#222" stroke-width="2.4"/>
<line x1="352" y1="180" x2="332" y2="200" stroke="#222" stroke-width="2.4"/>
<text x="300" y="275" text-anchor="middle" fill="#222" font-size="12">(A) forbids looping only: M could still accept a string outside L</text>
<text x="300" y="293" text-anchor="middle" fill="#222" font-size="12">(B) and (C) each constrain only half of the strings</text>
<text x="300" y="313" text-anchor="middle" fill="#222" font-size="12">(D) fixes both halves; with every string either in L or not, M never loops</text>
</svg>
