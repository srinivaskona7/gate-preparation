<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" font-family="sans-serif" font-size="13">
<title>Memory layout of a C program: stack holds locals and return addresses, heap holds malloc blocks, static data holds globals and static variables</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Memory of a running C program (high addresses at the top)</text>
<rect x="20" y="40" width="270" height="52" stroke="#222" stroke-width="1.5" fill="none"/><text x="155" y="62" fill="#222" text-anchor="middle">Stack</text><text x="155" y="78" fill="#222" text-anchor="middle">locals, local arrays, return addresses</text>
<path d="M155,92 L155,114" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="165" y="108" fill="#222" font-size="11">stack grows down</text>
<rect x="20" y="118" width="270" height="28" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="155" y="136" fill="#222" text-anchor="middle" font-size="12">(free space)</text>
<rect x="20" y="172" width="270" height="52" stroke="#222" stroke-width="1.5" fill="none"/><text x="155" y="194" fill="#222" text-anchor="middle">Heap</text><text x="155" y="210" fill="#222" text-anchor="middle">blocks from malloc, calloc, realloc</text>
<rect x="20" y="224" width="270" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="155" y="240" fill="#222" text-anchor="middle">Static / data segment</text><text x="155" y="256" fill="#222" text-anchor="middle">globals and static variables</text>
<rect x="20" y="264" width="270" height="28" stroke="#222" stroke-width="1.5" fill="none"/><text x="155" y="282" fill="#222" text-anchor="middle">Code (instructions)</text>
<text x="330" y="62" fill="#222" font-size="12">(B) int array inside a function</text>
<text x="330" y="80" fill="#222" font-size="12">(D) return address of a function</text>
<path d="M320,60 L290,62" stroke="#222" stroke-width="1.5" fill="none"/>
<path d="M320,78 L290,72" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330" y="198" fill="#222" font-size="12" font-weight="bold">(C) array from malloc()   &lt;-- answer</text>
<path d="M320,194 L290,198" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330" y="245" fill="#222" font-size="12">(A) static variable in a function</text>
<path d="M320,241 L290,244" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="330" y="120" fill="#222" font-size="12">Only malloc-family memory sits in the heap.</text>
</svg>
