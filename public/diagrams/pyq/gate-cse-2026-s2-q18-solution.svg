<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210">
<title>Daisy-chain interrupt priority</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<text x="320" y="20" font-size="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a" font-weight="bold">Daisy chain: the grant signal passes through the devices in order</text>
<g stroke="#1a1a1a" stroke-width="1.5" fill="none">
<rect x="20" y="60" width="90" height="60"/><rect x="190" y="60" width="90" height="60"/><rect x="340" y="60" width="90" height="60"/><rect x="490" y="60" width="90" height="60"/>
<line x1="110" y1="80" x2="188" y2="80" marker-end="url(#ah)"/><line x1="280" y1="80" x2="338" y2="80" marker-end="url(#ah)"/><line x1="430" y1="80" x2="488" y2="80" marker-end="url(#ah)"/>
<path d="M65 120 V160 H535 V120"/></g>
<g font-size="12" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">
<text x="65" y="95" font-weight="bold">CPU</text><text x="65" y="110">sends INTA</text>
<text x="235" y="95" font-weight="bold">Device 1</text><text x="235" y="110">highest priority</text>
<text x="385" y="95" font-weight="bold">Device 2</text><text x="535" y="95" font-weight="bold">Device 3</text>
<text x="150" y="72">INTA</text>
<text x="300" y="180">shared interrupt request line back to the CPU</text>
<text x="320" y="202">The CPU does not poll each device; the first requesting device on the chain answers.</text></g>
</svg>
