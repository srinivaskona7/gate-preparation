<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 248" font-family="sans-serif" font-size="13">
<title>Scopes of the name a: P1 has a file scope and a block scope, P2 and P3 declare a twice in one block, so only P1 compiles</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Which program declares the same name twice in ONE scope?</text>
<text x="110" y="48" fill="#222" text-anchor="middle" font-weight="bold">P1</text>
<rect x="20" y="56" width="180" height="120" stroke="#222" stroke-width="1.5" fill="none"/>
<text x="28" y="74" fill="#222" font-size="11">file scope</text>
<text x="28" y="92" fill="#222" font-family="monospace">int a = 5;</text>
<rect x="32" y="102" width="156" height="64" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="40" y="118" fill="#222" font-size="11">main() block</text>
<text x="40" y="138" fill="#222" font-family="monospace">int a = 7;</text>
<text x="40" y="156" fill="#222" font-size="11">hides the outer a</text>
<text x="110" y="198" fill="#222" text-anchor="middle" font-weight="bold">two scopes: compiles</text>
<text x="310" y="48" fill="#222" text-anchor="middle" font-weight="bold">P2</text>
<rect x="220" y="56" width="180" height="120" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="228" y="74" fill="#222" font-size="11">main() block</text>
<text x="228" y="98" fill="#222" font-family="monospace">int a = 5;</text>
<text x="228" y="122" fill="#222" font-family="monospace">int a = 7;</text>
<text x="228" y="148" fill="#222" font-size="11">same name, same scope</text>
<text x="310" y="198" fill="#222" text-anchor="middle" font-weight="bold">redefinition: error</text>
<text x="510" y="48" fill="#222" text-anchor="middle" font-weight="bold">P3</text>
<rect x="420" y="56" width="180" height="120" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
<text x="428" y="74" fill="#222" font-size="11">main() block</text>
<text x="428" y="98" fill="#222" font-family="monospace">int a = 5;</text>
<text x="428" y="122" fill="#222" font-family="monospace">float a = 7;</text>
<text x="428" y="148" fill="#222" font-size="11">the type differs, the clash stays</text>
<text x="510" y="198" fill="#222" text-anchor="middle" font-weight="bold">conflicting types: error</text>
<text x="300" y="232" fill="#222" text-anchor="middle" font-weight="bold">Only P1 compiles: option (A)</text>
</svg>
