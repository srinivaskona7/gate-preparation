<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="sans-serif" font-size="12">
<title>File crossing three links in series: the 500 kbps link sets the pace, 64 seconds</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="20" y="50" width="70" height="40"/><rect x="250" y="50" width="70" height="40"/><rect x="480" y="50" width="70" height="40"/><rect x="630" y="50" width="70" height="40"/>
<path d="M90 70 H250"/><path d="M320 70 H480" stroke-width="4"/><path d="M550 70 H630"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="55" y="75">Sender</text><text x="285" y="75">Node 1</text><text x="515" y="75">Node 2</text><text x="665" y="75">Receiver</text>
<text x="170" y="42">Link 1: 2 Mbps</text><text x="400" y="42">Link 2: 500 kbps (bottleneck)</text><text x="590" y="42">Link 3: 1 Mbps</text>
<text x="170" y="110">32 Mbit / 2 Mbps = 16 s</text><text x="400" y="110">32 Mbit / 0.5 Mbps = 64 s</text><text x="590" y="110">32 Mbit / 1 Mbps = 32 s</text>
<text x="360" y="160">File = 4 million bytes = 32 million bits</text>
<text x="360" y="185">Bits stream through; the slowest link is busy 64 s, so total = 64 s</text>
<text x="360" y="210">Answer: (B) 64</text>
</g>
</svg>
