<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#1f2937"><title>IEEE 754 fields of 0xC2710000</title>
<text x="380" y="24" text-anchor="middle" font-weight="bold">0xC2710000 = 1100 0010 0111 0001 0000 0000 0000 0000</text>
<rect x="20" y="50" width="60" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" />
<text x="50" y="76" text-anchor="middle" >1</text>
<rect x="80" y="50" width="240" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" />
<text x="200" y="76" text-anchor="middle" >1 0 0 0 0 1 0 0</text>
<rect x="320" y="50" width="420" height="40" fill="none" stroke="#1f2937" stroke-width="1.5" />
<text x="530" y="76" text-anchor="middle" >1 1 1 0 0 0 1 0000 0000 0000 0000</text>
<text x="50" y="112" text-anchor="middle" >sign</text>
<text x="200" y="112" text-anchor="middle" >exponent (8 bits)</text>
<text x="530" y="112" text-anchor="middle" >fraction (23 bits)</text>
<text x="50" y="132" text-anchor="middle" fill="#6b7280">negative</text>
<text x="200" y="132" text-anchor="middle" fill="#6b7280">10000100 = 132</text>
<text x="530" y="132" text-anchor="middle" fill="#6b7280">trailing zeros dropped: 1110001</text>
<text x="380" y="172" text-anchor="middle" font-weight="bold">true exponent = 132 - 127 = 5</text>
<text x="380" y="202" text-anchor="middle" >significand = 1.1110001 (binary), the leading 1 is the hidden bit</text>
<text x="380" y="232" text-anchor="middle" >1.1110001 x 2^5 = 111100.01 (binary)</text>
<text x="380" y="262" text-anchor="middle" >111100 = 60, .01 = 0.25, so magnitude 60.25</text>
<text x="380" y="300" text-anchor="middle" font-weight="bold">sign is 1, so the value is -60.25</text>
</svg>