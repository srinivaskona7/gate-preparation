<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="sans-serif" font-size="13">
<title>Maximal-munch split of the string x1 23mm 78 y 7z zz5 14A 8H AaYcD into 13 tokens</title>
<g fill="none" stroke="#222" stroke-width="1.5">
<rect x="10" y="40" width="44" height="30"/><rect x="62" y="40" width="44" height="30"/><rect x="112" y="40" width="56" height="30"/>
<rect x="190" y="40" width="44" height="30"/><rect x="250" y="40" width="30" height="30"/>
<rect x="302" y="40" width="30" height="30"/><rect x="336" y="40" width="30" height="30"/><rect x="388" y="40" width="56" height="30"/>
<rect x="466" y="40" width="44" height="30"/><rect x="514" y="40" width="30" height="30"/>
<rect x="566" y="40" width="30" height="30"/><rect x="600" y="40" width="30" height="30"/>
<rect x="652" y="40" width="96" height="30"/>
</g>
<g fill="#222" text-anchor="middle">
<text x="32" y="60">x1</text><text x="84" y="60">23</text><text x="140" y="60">mm</text><text x="212" y="60">78</text><text x="265" y="60">y</text>
<text x="317" y="60">7</text><text x="351" y="60">z</text><text x="416" y="60">zz5</text><text x="488" y="60">14</text><text x="529" y="60">A</text>
<text x="581" y="60">8</text><text x="615" y="60">H</text><text x="700" y="60">AaYcD</text>
<text x="32" y="90">id</text><text x="84" y="90">num</text><text x="140" y="90">id</text><text x="212" y="90">num</text><text x="265" y="90">id</text>
<text x="317" y="90">num</text><text x="351" y="90">id</text><text x="416" y="90">id</text><text x="488" y="90">num</text><text x="529" y="90">id</text>
<text x="581" y="90">num</text><text x="615" y="90">id</text><text x="700" y="90">id</text>
<text x="32" y="30">1</text><text x="84" y="30">2</text><text x="140" y="30">3</text><text x="212" y="30">4</text><text x="265" y="30">5</text><text x="317" y="30">6</text><text x="351" y="30">7</text><text x="416" y="30">8</text><text x="488" y="30">9</text><text x="529" y="30">10</text><text x="581" y="30">11</text><text x="615" y="30">12</text><text x="700" y="30">13</text>
</g>
<text x="10" y="130" fill="#222">Blanks (ws) are dropped. A digit run ends where a letter starts: "23mm" is num + id.</text>
<text x="10" y="152" fill="#222">A letter starts an id that swallows every letter and digit after it: "zz5" is one id.</text>
<text x="10" y="174" fill="#222">Total: 13 tokens.</text>
</svg>
