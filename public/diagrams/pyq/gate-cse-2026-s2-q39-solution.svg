<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" font-family="sans-serif" font-size="13">
<title>Evaluation order of B1 (row by row) and B2 (anti-diagonals): inputs are always final, so both are correct</title>
<g stroke="#222" stroke-width="1.5" fill="none"><rect x="40" y="60" width="50" height="40" fill="#ddd"/><rect x="90" y="60" width="50" height="40" fill="#ddd"/><rect x="140" y="60" width="50" height="40" fill="#ddd"/><rect x="190" y="60" width="50" height="40" fill="#ddd"/><rect x="40" y="100" width="50" height="40" fill="#ddd"/><rect x="90" y="100" width="50" height="40"/><rect x="140" y="100" width="50" height="40"/><rect x="190" y="100" width="50" height="40"/><rect x="40" y="140" width="50" height="40" fill="#ddd"/><rect x="90" y="140" width="50" height="40"/><rect x="140" y="140" width="50" height="40"/><rect x="190" y="140" width="50" height="40"/><rect x="40" y="180" width="50" height="40" fill="#ddd"/><rect x="90" y="180" width="50" height="40"/><rect x="140" y="180" width="50" height="40"/><rect x="190" y="180" width="50" height="40"/></g><g fill="#222" text-anchor="middle"><text x="65" y="85">1</text><text x="115" y="85">1</text><text x="165" y="85">1</text><text x="215" y="85">1</text><text x="65" y="125">1</text><text x="115" y="125">1</text><text x="165" y="125">2</text><text x="215" y="125">3</text><text x="65" y="165">1</text><text x="115" y="165">4</text><text x="165" y="165">5</text><text x="215" y="165">6</text><text x="65" y="205">1</text><text x="115" y="205">7</text><text x="165" y="205">8</text><text x="215" y="205">9</text></g><g stroke="#222" stroke-width="1.5" fill="none"><rect x="360" y="60" width="50" height="40" fill="#ddd"/><rect x="410" y="60" width="50" height="40" fill="#ddd"/><rect x="460" y="60" width="50" height="40" fill="#ddd"/><rect x="510" y="60" width="50" height="40" fill="#ddd"/><rect x="360" y="100" width="50" height="40" fill="#ddd"/><rect x="410" y="100" width="50" height="40"/><rect x="460" y="100" width="50" height="40"/><rect x="510" y="100" width="50" height="40"/><rect x="360" y="140" width="50" height="40" fill="#ddd"/><rect x="410" y="140" width="50" height="40"/><rect x="460" y="140" width="50" height="40"/><rect x="510" y="140" width="50" height="40"/><rect x="360" y="180" width="50" height="40" fill="#ddd"/><rect x="410" y="180" width="50" height="40"/><rect x="460" y="180" width="50" height="40"/><rect x="510" y="180" width="50" height="40"/></g><g fill="#222" text-anchor="middle"><text x="385" y="85">1</text><text x="435" y="85">1</text><text x="485" y="85">1</text><text x="535" y="85">1</text><text x="385" y="125">1</text><text x="435" y="125">s=2</text><text x="485" y="125">s=3</text><text x="535" y="125">s=4</text><text x="385" y="165">1</text><text x="435" y="165">s=3</text><text x="485" y="165">s=4</text><text x="535" y="165">s=5</text><text x="385" y="205">1</text><text x="435" y="205">s=4</text><text x="485" y="205">s=5</text><text x="535" y="205">s=6</text></g><g fill="#222"><text x="40" y="40" font-weight="bold">B1: step number, row by row</text><text x="360" y="40" font-weight="bold">B2: pass s that writes the cell</text><text x="40" y="250">T[i][j] needs the cell above (earlier row, or step 0) and the cell to its left (one step before).</text><text x="40" y="272">Shaded cells are the initial value 1. Rows 1..3 and columns 1..3 shown, n = 3.</text><text x="40" y="294">B2: above and left both have i+j = s-1, written in pass s-1, so every input is final. Both algorithms are correct.</text></g>
</svg>
