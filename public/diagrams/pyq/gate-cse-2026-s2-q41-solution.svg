<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="sans-serif" fill="#1f2937"><title>LR(0) states with a shift-reduce conflict in the grammar S to ACB</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs>
<rect x="10" y="10" width="230" height="94" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I0 (start)</text>
<line x1="10" y1="34" x2="240" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S' -&gt; .S</text>
<text x="20" y="68" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; .ACB</text>
<text x="20" y="84" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; .aA</text>
<text x="20" y="100" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; .</text>
<text x="18" y="120" font-size="12" text-anchor="start" fill="#1f2937">ACTION[I0,a]: shift a and reduce</text>
<rect x="260" y="10" width="230" height="78" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="268" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I1 = GOTO(I0, A)</text>
<line x1="260" y1="34" x2="490" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="270" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">S -&gt; A.CB</text>
<text x="270" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">C -&gt; .cC</text>
<text x="270" y="84" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">C -&gt; .</text>
<text x="268" y="104" font-size="12" text-anchor="start" fill="#1f2937">ACTION[I1,c]: shift c and reduce</text>
<rect x="510" y="10" width="230" height="78" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="518" y="28" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I3 = GOTO(I0, a)</text>
<line x1="510" y1="34" x2="740" y2="34" stroke="#1f2937" stroke-width="0.8"/>
<text x="520" y="52" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">A -&gt; a.A</text>
<text x="520" y="68" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; .aA</text>
<text x="520" y="84" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">A -&gt; .</text>
<text x="518" y="104" font-size="12" text-anchor="start" fill="#1f2937">ACTION[I3,a]: shift a and reduce</text>
<rect x="10" y="190" width="230" height="78" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="18" y="208" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I5 = GOTO(I1, c)</text>
<line x1="10" y1="214" x2="240" y2="214" stroke="#1f2937" stroke-width="0.8"/>
<text x="20" y="232" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">C -&gt; c.C</text>
<text x="20" y="248" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">C -&gt; .cC</text>
<text x="20" y="264" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">C -&gt; .</text>
<text x="18" y="284" font-size="12" text-anchor="start" fill="#1f2937">ACTION[I5,c]: shift c and reduce</text>
<rect x="260" y="190" width="230" height="94" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2"/>
<text x="268" y="208" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">I8 = after b</text>
<line x1="260" y1="214" x2="490" y2="214" stroke="#1f2937" stroke-width="0.8"/>
<text x="270" y="232" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">B -&gt; b.</text>
<text x="270" y="248" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">B -&gt; b.B</text>
<text x="270" y="264" font-size="12" text-anchor="start" font-family="monospace" font-weight="bold" fill="#1f2937">B -&gt; .bB</text>
<text x="270" y="280" font-size="12" text-anchor="start" font-family="monospace" fill="#1f2937">B -&gt; .b</text>
<text x="268" y="300" font-size="12" text-anchor="start" fill="#1f2937">ACTION[I8,b]: shift b and reduce</text>
<rect x="510" y="190" width="240" height="100" rx="4" fill="none" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="520" y="212" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2937">5 states, one terminal each</text>
<text x="520" y="232" font-size="13" text-anchor="start" fill="#1f2937">5 shift-reduce conflicts</text>
<text x="520" y="252" font-size="13" text-anchor="start" fill="#1f2937">0 reduce-reduce conflicts</text>
<text x="520" y="272" font-size="12" text-anchor="start" fill="#1f2937">Bold lines clash in the same row.</text>
</svg>
