<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="sans-serif" font-size="13">
<title>Opcode space of the 16-bit format: 2-bit M opcodes, 4-bit R opcodes, 6-bit C opcodes; 4 C opcodes remain</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="32" text-anchor="start" fill="#222" font-weight="bold">M-type: 2 + 4 + 4 + 6 = 16 bits</text><rect x="20" y="40" width="50" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="45" y="55" text-anchor="middle" fill="#222" font-size="12">op</text><text x="45" y="67" text-anchor="middle" fill="#222" font-size="10">2 b</text><rect x="70" y="40" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="120" y="55" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="120" y="67" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="170" y="40" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="220" y="55" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="220" y="67" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="270" y="40" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="345" y="55" text-anchor="middle" fill="#222" font-size="12">imm</text><text x="345" y="67" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="92" text-anchor="start" fill="#222" font-weight="bold">R-type: 4 + 4 + 4 + 4 = 16 bits</text><rect x="20" y="100" width="100" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="70" y="115" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="70" y="127" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="120" y="100" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="170" y="115" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="170" y="127" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="220" y="100" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="270" y="115" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="270" y="127" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="320" y="100" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="370" y="115" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="370" y="127" text-anchor="middle" fill="#222" font-size="10">4 b</text><text x="20" y="152" text-anchor="start" fill="#222" font-weight="bold">C-type: 6 + 4 + 6 = 16 bits</text><rect x="20" y="160" width="150" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="95" y="175" text-anchor="middle" fill="#222" font-size="12">opcode</text><text x="95" y="187" text-anchor="middle" fill="#222" font-size="10">6 b</text><rect x="170" y="160" width="100" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="220" y="175" text-anchor="middle" fill="#222" font-size="12">reg</text><text x="220" y="187" text-anchor="middle" fill="#222" font-size="10">4 b</text><rect x="270" y="160" width="150" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="345" y="175" text-anchor="middle" fill="#222" font-size="12">offset</text><text x="345" y="187" text-anchor="middle" fill="#222" font-size="10">6 b</text><text x="20" y="227" text-anchor="start" fill="#222" font-weight="bold">2-bit codes: 2 used by M, 2 free</text><rect x="20" y="235" width="80" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="60" y="254" text-anchor="middle" fill="#222" font-size="11">00 M</text><rect x="100" y="235" width="80" height="30" fill="#d9d9d9" stroke="#222" stroke-width="1.5"/><text x="140" y="254" text-anchor="middle" fill="#222" font-size="11">01 M</text><rect x="180" y="235" width="80" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="220" y="254" text-anchor="middle" fill="#222" font-size="11">10 free</text><rect x="260" y="235" width="80" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="300" y="254" text-anchor="middle" fill="#222" font-size="11">11 free</text><text x="20" y="292" text-anchor="start" fill="#222" font-weight="bold">The 2 free codes grow to 8 four-bit codes; 7 go to R-type</text><rect x="20" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="51" y="319" text-anchor="middle" fill="#222" font-size="11">1000</text><rect x="82" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="113" y="319" text-anchor="middle" fill="#222" font-size="11">1001</text><rect x="144" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="175" y="319" text-anchor="middle" fill="#222" font-size="11">1010</text><rect x="206" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="237" y="319" text-anchor="middle" fill="#222" font-size="11">1011</text><rect x="268" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="299" y="319" text-anchor="middle" fill="#222" font-size="11">1100</text><rect x="330" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="361" y="319" text-anchor="middle" fill="#222" font-size="11">1101</text><rect x="392" y="300" width="62" height="30" fill="#efefef" stroke="#222" stroke-width="1.5"/><text x="423" y="319" text-anchor="middle" fill="#222" font-size="11">1110</text><rect x="454" y="300" width="62" height="30" fill="none" stroke="#222" stroke-width="1.5"/><text x="485" y="319" text-anchor="middle" fill="#222" font-size="11">1111</text><text x="20" y="355" text-anchor="start" fill="#222" font-size="12">The spare 1111 grows to 111100, 111101, 111110, 111111: 4 six-bit codes for C-type.</text>
</svg>
