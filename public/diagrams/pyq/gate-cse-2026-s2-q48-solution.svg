<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="sans-serif" font-size="13">
<title>Counter trace for constraint A, crossing arcs for constraint B and nested arcs for constraint C</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(A) i + k = j + l : one signed counter, a and c add 1, b and d subtract 1</text>
<text x="20" y="44" text-anchor="start" font-size="12" fill="#222">string a b b c c d  (i=1, j=2, k=2, l=1)</text>
<text x="150" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="210" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="270" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="330" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="390" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="450" y="82" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<text x="60" y="82" text-anchor="middle" font-size="12" fill="#222">letter</text>
<text x="60" y="114" text-anchor="middle" font-size="12" fill="#222">counter</text>
<text x="150" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">+1</text>
<text x="210" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">0</text>
<text x="270" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">-1</text>
<text x="330" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">0</text>
<text x="390" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">+1</text>
<text x="450" y="114" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">0</text>
<text x="60" y="144" text-anchor="middle" font-size="12" fill="#222">stack</text>
<text x="150" y="144" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">A</text>
<text x="210" y="144" text-anchor="middle" font-size="11" fill="#222">(empty)</text>
<text x="270" y="144" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">B</text>
<text x="330" y="144" text-anchor="middle" font-size="11" fill="#222">(empty)</text>
<text x="390" y="144" text-anchor="middle" font-size="15" fill="#222" font-family="monospace">A</text>
<text x="450" y="144" text-anchor="middle" font-size="11" fill="#222">(empty)</text>
<text x="20" y="170" text-anchor="start" font-size="12" fill="#222">The counter ends at 0 exactly when i + k = j + l. Stack symbol A means a positive count, B a negative count.</text>
<line x1="20" y1="186" x2="620" y2="186" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="212" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(B) i = k and j = l : a-c pairs and b-d pairs cross, so one stack cannot serve both</text>
<text x="20" y="232" text-anchor="start" font-size="12" fill="#222">string a a b c c d  (i=2, j=1, k=2, l=1)</text>
<text x="150" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="210" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="270" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="330" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="390" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="450" y="350" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<path d="M210,332 C210,278.4 330,278.4 330,332" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M150,332 C150,238.2 390,238.2 390,332" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M270,332 C270,258.3 450,258.3 450,332" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="500" y="282" text-anchor="start" font-size="12" fill="#222">solid: a-c</text>
<text x="500" y="300" text-anchor="start" font-size="12" fill="#222">dashed: b-d</text>
<text x="500" y="318" text-anchor="start" font-size="12" fill="#222" font-weight="bold">arcs cross</text>
<line x1="20" y1="372" x2="620" y2="372" stroke="#222" stroke-width="1" stroke-dasharray="4 3"/>
<text x="20" y="396" text-anchor="start" font-size="13" fill="#222" font-weight="bold">(C) i = l and j = k : b-c pair sits inside the a-d pairs, nested arcs</text>
<text x="20" y="416" text-anchor="start" font-size="12" fill="#222">string a a b c d d  (i=2, j=1, k=1, l=2)</text>
<text x="150" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="210" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">a</text>
<text x="270" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">b</text>
<text x="330" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">c</text>
<text x="390" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<text x="450" y="520" text-anchor="middle" font-size="18" fill="#222" font-family="monospace">d</text>
<path d="M270,502 C270,472.52 330,472.52 330,502" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M210,502 C210,443.04 390,443.04 390,502" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M150,502 C150,413.56 450,413.56 450,502" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="500" y="460" text-anchor="start" font-size="12" fill="#222" font-weight="bold">arcs nest, no crossing</text>
</svg>
