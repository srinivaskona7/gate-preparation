<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>BST with leaves 20, 40, 60, 80: leaves 20, 40, 60 have successors 30, 50, 70, so keys 25, 45, 65 are inserted as dashed right children of those leaves; leaf 80 has no successor; height grows from 2 to 3 and nodes from 7 to 10</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<line x1="274.7" y1="47.4" x2="161.3" y2="102.6" stroke="#222" stroke-width="1.6"/>
<line x1="132.3" y1="120.0" x2="63.7" y2="170.0" stroke="#222" stroke-width="1.6"/>
<line x1="59.6" y1="194.0" x2="88.4" y2="236.0" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="155.6" y1="124.0" x2="184.4" y2="166.0" stroke="#222" stroke-width="1.6"/>
<line x1="203.6" y1="194.0" x2="232.4" y2="236.0" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="305.3" y1="47.4" x2="418.7" y2="102.6" stroke="#222" stroke-width="1.6"/>
<line x1="420.3" y1="120.0" x2="351.7" y2="170.0" stroke="#222" stroke-width="1.6"/>
<line x1="347.6" y1="194.0" x2="376.4" y2="236.0" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="443.6" y1="124.0" x2="472.4" y2="166.0" stroke="#222" stroke-width="1.6"/>
<circle cx="290" cy="40" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="290" y="44.42" text-anchor="middle" fill="#222" font-size="13">50</text>
<circle cx="146" cy="110" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="146" y="114.42" text-anchor="middle" fill="#222" font-size="13">30</text>
<circle cx="50" cy="180" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="50" y="184.42" text-anchor="middle" fill="#222" font-size="13">20</text>
<circle cx="98" cy="250" r="17" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="98" y="254.42" text-anchor="middle" fill="#222" font-size="13">25</text>
<circle cx="194" cy="180" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="194" y="184.42" text-anchor="middle" fill="#222" font-size="13">40</text>
<circle cx="242" cy="250" r="17" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="242" y="254.42" text-anchor="middle" fill="#222" font-size="13">45</text>
<circle cx="434" cy="110" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="434" y="114.42" text-anchor="middle" fill="#222" font-size="13">70</text>
<circle cx="338" cy="180" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="338" y="184.42" text-anchor="middle" fill="#222" font-size="13">60</text>
<circle cx="386" cy="250" r="17" fill="none" stroke="#222" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="386" y="254.42" text-anchor="middle" fill="#222" font-size="13">65</text>
<circle cx="482" cy="180" r="17" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="482" y="184.42" text-anchor="middle" fill="#222" font-size="13">80</text>
<text x="390" y="300" text-anchor="middle" fill="#222" font-size="12">Solid circles: original BST (7 nodes, height 2).  Dashed circles: the new keys K = {25, 45, 65} (10 nodes, height 3).</text>
<text x="570" y="50" text-anchor="start" fill="#222" font-size="13" font-weight="bold">Successor of each leaf</text>
<text x="570" y="78" text-anchor="start" fill="#222" font-size="12">20 -&gt; 30: new key in (20, 30)</text>
<text x="570" y="100" text-anchor="start" fill="#222" font-size="12">40 -&gt; 50: new key in (40, 50)</text>
<text x="570" y="122" text-anchor="start" fill="#222" font-size="12">60 -&gt; 70: new key in (60, 70)</text>
<text x="570" y="144" text-anchor="start" fill="#222" font-size="12">80 -&gt; none: no key added</text>
<text x="570" y="190" text-anchor="start" fill="#222" font-size="12">Each new key becomes the</text>
<text x="570" y="208" text-anchor="start" fill="#222" font-size="12">RIGHT child of its own leaf.</text>
<text x="570" y="226" text-anchor="start" fill="#222" font-size="12">Height grows by 1 at most;</text>
<text x="570" y="244" text-anchor="start" fill="#222" font-size="12">no duplicates; K may be empty.</text>
</svg>
