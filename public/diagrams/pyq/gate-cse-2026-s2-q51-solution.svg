<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
<title>Three critical sections of lock A run one after another; the dollar sign is printed inside the second, so exactly two stars come before it</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="24" text-anchor="start" fill="#222" font-size="12" font-weight="bold">A is a binary lock (starts at 1): the three Wait(A) ... Signal(A) sections run one after another.</text>
<rect x="30" y="40" width="230" height="86" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="145.0" y="64.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">1st section</text>
<text x="145.0" y="79.5" text-anchor="middle" fill="#222" font-size="12">Wait(A), print *</text>
<text x="145.0" y="94.5" text-anchor="middle" fill="#222" font-size="12">X = 1</text>
<text x="145.0" y="109.5" text-anchor="middle" fill="#222" font-size="12">Signal(A)</text>
<rect x="275" y="40" width="230" height="86" fill="#e6e6e6" stroke="#222" stroke-width="1.5"/>
<text x="390.0" y="64.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">2nd section</text>
<text x="390.0" y="79.5" text-anchor="middle" fill="#222" font-size="12">Wait(A), print *</text>
<text x="390.0" y="94.5" text-anchor="middle" fill="#222" font-size="12">X = 2, so print $</text>
<text x="390.0" y="109.5" text-anchor="middle" fill="#222" font-size="12">Signal(B), Signal(A)</text>
<rect x="520" y="40" width="230" height="86" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="635.0" y="64.5" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">3rd section</text>
<text x="635.0" y="79.5" text-anchor="middle" fill="#222" font-size="12">Wait(A), print *</text>
<text x="635.0" y="94.5" text-anchor="middle" fill="#222" font-size="12">X = 3 (no $)</text>
<text x="635.0" y="109.5" text-anchor="middle" fill="#222" font-size="12">Signal(A)</text>
<line x1="260.0" y1="83.0" x2="275.0" y2="83.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="505.0" y1="83.0" x2="520.0" y2="83.0" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="30" y="146" text-anchor="start" fill="#222" font-size="12">output so far: * * $  (the $ sits inside the 2nd section)</text>
<text x="20" y="182" text-anchor="start" fill="#222" font-size="12" font-weight="bold">B is a gate (starts at 0). It opens at the $. Each process then relays it: Wait(B), print #, Signal(B).</text>
<rect x="30" y="196" width="200" height="46" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="130.0" y="215.5" text-anchor="middle" fill="#222" font-size="12"># of the 1st process</text>
<text x="130.0" y="230.5" text-anchor="middle" fill="#222" font-size="12">any time after the $</text>
<rect x="275" y="196" width="200" height="46" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="375.0" y="215.5" text-anchor="middle" fill="#222" font-size="12"># of the 2nd process</text>
<text x="375.0" y="230.5" text-anchor="middle" fill="#222" font-size="12">any time after the $</text>
<rect x="520" y="196" width="230" height="46" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="635.0" y="215.5" text-anchor="middle" fill="#222" font-size="12"># of the 3rd process</text>
<text x="635.0" y="230.5" text-anchor="middle" fill="#222" font-size="12">only after its own *</text>
<line x1="400.0" y1="150.0" x2="400.0" y2="168.0" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<text x="410" y="162" text-anchor="start" fill="#222" font-size="11">B opens</text>
<text x="20" y="282" text-anchor="start" fill="#222" font-size="12">After the $ the 3rd * and three # remain, with the 3rd * before the 3rd #:</text>
<text x="20" y="304" text-anchor="start" fill="#222" font-size="12">*###, #*##, ##*# are possible (options A, B, C).   ###* and ***$### (option D) are not.</text>
</svg>
