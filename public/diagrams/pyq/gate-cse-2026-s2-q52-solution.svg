<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="sans-serif" font-size="12" fill="none" stroke="#1f2937" stroke-width="1.5">
<title>Cache lines 0xB3 and 0xB2 over the first two rounds of P, Q, R, S: block held after each access and hit or miss</title>
<g fill="#1f2937" stroke="none" text-anchor="middle">
<text x="320" y="18" font-size="13">Direct mapped, 256 lines. Block number = address / 16; line = block mod 256</text>
<text x="55" y="48">access</text><text x="55" y="130">line 0xB3</text><text x="55" y="196">line 0xB2</text>
<text x="55" y="76" font-size="11">result</text>
</g>
<g id="cols" fill="#1f2937" stroke="none" text-anchor="middle">
<text x="130" y="48">P</text><text x="200" y="48">Q</text><text x="270" y="48">R</text><text x="340" y="48">S</text>
<text x="410" y="48">P</text><text x="480" y="48">Q</text><text x="550" y="48">R</text><text x="610" y="48">S</text>
<text x="130" y="76">miss</text><text x="200" y="76">miss</text><text x="270" y="76">hit</text><text x="340" y="76">miss</text>
<text x="410" y="76">miss</text><text x="480" y="76">hit</text><text x="550" y="76">hit</text><text x="610" y="76">miss</text>
</g>
<g>
<rect x="95" y="105" width="70" height="36"/><rect x="165" y="105" width="70" height="36"/><rect x="235" y="105" width="70" height="36"/><rect x="305" y="105" width="70" height="36"/>
<rect x="375" y="105" width="70" height="36"/><rect x="445" y="105" width="70" height="36"/><rect x="515" y="105" width="70" height="36"/><rect x="585" y="105" width="50" height="36"/>
<rect x="95" y="172" width="70" height="36"/><rect x="165" y="172" width="70" height="36"/><rect x="235" y="172" width="70" height="36"/><rect x="305" y="172" width="70" height="36"/>
<rect x="375" y="172" width="70" height="36"/><rect x="445" y="172" width="70" height="36"/><rect x="515" y="172" width="70" height="36"/><rect x="585" y="172" width="50" height="36"/>
</g>
<g fill="#1f2937" stroke="none" text-anchor="middle" font-size="11">
<text x="130" y="127">845B3</text><text x="200" y="127">845B3</text><text x="270" y="127">845B3</text><text x="340" y="127">846B3</text>
<text x="410" y="127">845B3</text><text x="480" y="127">845B3</text><text x="550" y="127">845B3</text><text x="610" y="127">846B3</text>
<text x="130" y="194">empty</text><text x="200" y="194">845B2</text><text x="270" y="194">845B2</text><text x="340" y="194">845B2</text>
<text x="410" y="194">845B2</text><text x="480" y="194">845B2</text><text x="550" y="194">845B2</text><text x="610" y="194">845B2</text>
<text x="320" y="238">P and R share block 845B3 (so R hits after P); S has the same line but another tag, so P and S evict each other.</text>
</g>
</svg>
