<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="sans-serif" font-size="13" fill="#111" stroke="#111">
<title>Linked list of free-block numbers: each 2 KB list block holds 511 block numbers and a 4-byte next pointer, so 2^23 numbers need 16417 list blocks</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#111"/></marker></defs>
<g fill="none" stroke-width="1.5">
<rect x="10" y="40" width="130" height="46"/><rect x="140" y="40" width="40" height="46"/>
<rect x="220" y="40" width="130" height="46"/><rect x="350" y="40" width="40" height="46"/>
<rect x="470" y="40" width="130" height="46"/><rect x="600" y="40" width="40" height="46"/>
<path d="M180 63 H220" marker-end="url(#a)"/><path d="M390 63 H425" marker-end="url(#a)"/><path d="M455 63 H470" marker-end="url(#a)"/>
</g>
<g stroke="none" text-anchor="middle">
<text x="75" y="68">511 numbers</text><text x="160" y="68" font-size="11">next</text>
<text x="285" y="68">511 numbers</text><text x="370" y="68" font-size="11">next</text>
<text x="535" y="68">32 numbers</text><text x="620" y="68" font-size="11">NULL</text>
<text x="75" y="106">list block 1</text><text x="285" y="106">list block 2</text><text x="535" y="106">list block 16417</text>
<text x="440" y="68">...</text>
</g>
<g stroke="none">
<text x="10" y="24" font-weight="bold">A list block: 2048 B = 511 x 4 B numbers + 4 B next pointer</text>
<text x="10" y="150">Disk: 16 GB / 2 KB = 2^34 / 2^11 = 2^23 = 8,388,608 block numbers.</text>
<text x="10" y="172">16416 full blocks hold 511 x 16416 = 8,388,576 numbers, 32 short of 2^23.</text>
<text x="10" y="194">ceil(8,388,608 / 511) = 16417 list blocks (the last one holds 32 numbers).</text>
<text x="10" y="226" font-weight="bold">Answer: 16417</text>
</g>
</svg>
