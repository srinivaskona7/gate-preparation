<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="sans-serif" font-size="13">
<title>Digital circuit of GATE 2026 CS2 Q59: a 2:4 decoder Q feeds a 4-to-1 multiplexer M</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="120" y="70" width="90" height="150" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="165" y="149" text-anchor="middle" fill="#222" font-size="16" font-weight="normal">Q</text>
<text x="160" y="212" text-anchor="middle" fill="#222" font-size="11" font-weight="normal">2:4 decoder</text>
<line x1="60" y1="115" x2="120" y2="115" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="54" y="119" text-anchor="end" fill="#222" font-size="13" font-weight="normal">A</text>
<line x1="60" y1="175" x2="120" y2="175" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="54" y="179" text-anchor="end" fill="#222" font-size="13" font-weight="normal">B</text>
<text x="205" y="94" text-anchor="end" fill="#222" font-size="12" font-weight="normal">D0</text>
<text x="205" y="129" text-anchor="end" fill="#222" font-size="12" font-weight="normal">D1</text>
<text x="205" y="164" text-anchor="end" fill="#222" font-size="12" font-weight="normal">D2</text>
<text x="205" y="199" text-anchor="end" fill="#222" font-size="12" font-weight="normal">D3</text>
<rect x="340" y="70" width="90" height="150" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="385" y="149" text-anchor="middle" fill="#222" font-size="16" font-weight="normal">M</text>
<text x="346" y="94" text-anchor="start" fill="#222" font-size="12" font-weight="normal">0</text>
<text x="346" y="129" text-anchor="start" fill="#222" font-size="12" font-weight="normal">1</text>
<text x="346" y="164" text-anchor="start" fill="#222" font-size="12" font-weight="normal">2</text>
<text x="346" y="199" text-anchor="start" fill="#222" font-size="12" font-weight="normal">3</text>
<line x1="210" y1="90" x2="340" y2="90" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="290" y1="125" x2="340" y2="125" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="284" y="129" text-anchor="end" fill="#222" font-size="13" font-weight="normal">0</text>
<line x1="290" y1="160" x2="340" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="284" y="164" text-anchor="end" fill="#222" font-size="13" font-weight="normal">1</text>
<line x1="210" y1="195" x2="340" y2="195" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="370" y1="40" x2="370" y2="70" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="370" y="34" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">S1</text>
<line x1="405" y1="40" x2="405" y2="70" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="405" y="34" text-anchor="middle" fill="#222" font-size="13" font-weight="normal">S0</text>
<line x1="430" y1="145" x2="500" y2="145" stroke="#222" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="508" y="149" text-anchor="start" fill="#222" font-size="13" font-weight="normal">Y</text>
<text x="20" y="258" text-anchor="start" fill="#222" font-size="12" font-weight="normal">Inputs 0 and 3 of M come from D0 and D3. Inputs 1 and 2 are tied to the constants 0 and 1.</text>
</svg>
