<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" font-family="sans-serif" font-size="13">
<title>Three snapshots of variables a, b, c and pointer ptr: a becomes 20 through ptr, then 11 from b, then c becomes 20 minus 11, which is 9</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Values after the statements that matter (a, b, c are ints)</text>
<text x="20" y="48" fill="#222" font-size="12" font-weight="bold">after  ptr=&amp;a; *ptr=c;</text>
<text x="20" y="64" fill="#222" font-size="11">a gets c through ptr</text>
<rect x="20" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="46" y="101" fill="#222" text-anchor="middle" font-weight="bold">20</text>
<text x="46" y="132" fill="#222" text-anchor="middle" font-size="12">a</text>
<rect x="76" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="102" y="101" fill="#222" text-anchor="middle" font-weight="bold">11</text>
<text x="102" y="132" fill="#222" text-anchor="middle" font-size="12">b</text>
<rect x="132" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="158" y="101" fill="#222" text-anchor="middle" font-weight="bold">20</text>
<text x="158" y="132" fill="#222" text-anchor="middle" font-size="12">c</text>
<rect x="76" y="168" width="52" height="28" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="102" y="186" fill="#222" text-anchor="middle">ptr</text>
<path d="M102,168 L46,140" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="230" y="48" fill="#222" font-size="12" font-weight="bold">after  ptr=&amp;c; a=*(&amp;b);</text>
<text x="230" y="64" fill="#222" font-size="11">a copies b, ptr now at c</text>
<rect x="230" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="256" y="101" fill="#222" text-anchor="middle" font-weight="bold">11</text>
<text x="256" y="132" fill="#222" text-anchor="middle" font-size="12">a</text>
<rect x="286" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="312" y="101" fill="#222" text-anchor="middle" font-weight="bold">11</text>
<text x="312" y="132" fill="#222" text-anchor="middle" font-size="12">b</text>
<rect x="342" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="368" y="101" fill="#222" text-anchor="middle" font-weight="bold">20</text>
<text x="368" y="132" fill="#222" text-anchor="middle" font-size="12">c</text>
<rect x="286" y="168" width="52" height="28" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="312" y="186" fill="#222" text-anchor="middle">ptr</text>
<path d="M312,168 L368,140" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="440" y="48" fill="#222" font-size="12" font-weight="bold">after  c=*ptr-a;</text>
<text x="440" y="64" fill="#222" font-size="11">20 - 11 = 9 stored in c</text>
<rect x="440" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="466" y="101" fill="#222" text-anchor="middle" font-weight="bold">11</text>
<text x="466" y="132" fill="#222" text-anchor="middle" font-size="12">a</text>
<rect x="496" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="522" y="101" fill="#222" text-anchor="middle" font-weight="bold">11</text>
<text x="522" y="132" fill="#222" text-anchor="middle" font-size="12">b</text>
<rect x="552" y="80" width="52" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="578" y="101" fill="#222" text-anchor="middle" font-weight="bold">9</text>
<text x="578" y="132" fill="#222" text-anchor="middle" font-size="12">c</text>
<rect x="496" y="168" width="52" height="28" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="522" y="186" fill="#222" text-anchor="middle">ptr</text>
<path d="M522,168 L578,140" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="310" y="230" fill="#222" text-anchor="middle" font-weight="bold">printf prints c = 9</text>
</svg>
