<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 246" font-family="sans-serif" font-size="13">
<title>Chain of lengths in func: remainder 1 adds one then moves to remainder 0, remainders 0 and 2 shrink the length with no further additions down to 0, so the maximum is 1</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="22" fill="#222" font-weight="bold">Only the length L = end + 1 - start matters; each call changes it</text>
<rect x="20" y="70" width="100" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="70" y="94" fill="#222" text-anchor="middle">L = 3m + 1</text>
<rect x="170" y="70" width="100" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="220" y="94" fill="#222" text-anchor="middle">L = 3m</text>
<rect x="310" y="70" width="100" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="360" y="94" fill="#222" text-anchor="middle">L = 3m - 1</text>
<rect x="450" y="70" width="100" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="500" y="94" fill="#222" text-anchor="middle">L = 3m - 3</text>
<path d="M120,90 L168,90" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="144" y="82" fill="#222" text-anchor="middle" font-size="11">1+  end-1</text>
<path d="M270,90 L308,90" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="289" y="82" fill="#222" text-anchor="middle" font-size="11">start+1</text>
<path d="M410,90 L448,90" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="429" y="82" fill="#222" text-anchor="middle" font-size="11">start+2</text>
<path d="M550,90 L590,90" stroke="#222" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="570" y="82" fill="#222" text-anchor="middle">...</text>
<rect x="590" y="70" width="60" height="40" stroke="#222" stroke-width="1.5" fill="none"/><text x="620" y="86.5" fill="#222" text-anchor="middle" font-size="12">L &lt; 1</text><text x="620" y="101.5" fill="#222" text-anchor="middle" font-size="12">returns 0</text>
<rect x="310" y="150" width="100" height="34" stroke="#222" stroke-width="1.5" fill="none"/><text x="360" y="171" fill="#222" text-anchor="middle">L = 3m + 2</text>
<path d="M360,150 L220,114" stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
<text x="372" y="144" fill="#222" font-size="11">start+2 (L-2)</text>
<text x="20" y="212" fill="#222" font-size="12">From L = 3m the length goes 3m, 3m-1, 3m-3, 3m-4, ... and never reaches a remainder of 1 again,</text>
<text x="20" y="230" fill="#222" font-size="12">so the only +1 comes from a start with L = 3m + 1: its value is 1 + 0 = 1. Maximum = 1.</text>
</svg>
