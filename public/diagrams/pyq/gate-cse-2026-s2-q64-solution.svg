<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="sans-serif" font-size="13">
<title>Strip for one first digit showing f equal to 1 on second digits 2, 3, 6, 7 and four jump points per block</title>
<text x="300" y="24" text-anchor="middle" fill="#222" font-size="13">The strip of numbers 0.d1 d2 ... for one first digit d1 (second digit d2 shown)</text>
<rect x="40" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="64" y="135" text-anchor="middle" fill="#222" font-size="12">d2=0</text>
<text x="64" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<rect x="88" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="112" y="135" text-anchor="middle" fill="#222" font-size="12">d2=1</text>
<text x="112" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<rect x="136" y="110" width="48" height="40" fill="#bbb" stroke="#222" stroke-width="1.2"/>
<text x="160" y="135" text-anchor="middle" fill="#222" font-size="12">d2=2</text>
<text x="160" y="102" text-anchor="middle" fill="#222" font-size="12">f=1</text>
<rect x="184" y="110" width="48" height="40" fill="#bbb" stroke="#222" stroke-width="1.2"/>
<text x="208" y="135" text-anchor="middle" fill="#222" font-size="12">d2=3</text>
<text x="208" y="102" text-anchor="middle" fill="#222" font-size="12">f=1</text>
<rect x="232" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="256" y="135" text-anchor="middle" fill="#222" font-size="12">d2=4</text>
<text x="256" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<rect x="280" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="304" y="135" text-anchor="middle" fill="#222" font-size="12">d2=5</text>
<text x="304" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<rect x="328" y="110" width="48" height="40" fill="#bbb" stroke="#222" stroke-width="1.2"/>
<text x="352" y="135" text-anchor="middle" fill="#222" font-size="12">d2=6</text>
<text x="352" y="102" text-anchor="middle" fill="#222" font-size="12">f=1</text>
<rect x="376" y="110" width="48" height="40" fill="#bbb" stroke="#222" stroke-width="1.2"/>
<text x="400" y="135" text-anchor="middle" fill="#222" font-size="12">d2=7</text>
<text x="400" y="102" text-anchor="middle" fill="#222" font-size="12">f=1</text>
<rect x="424" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="448" y="135" text-anchor="middle" fill="#222" font-size="12">d2=8</text>
<text x="448" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<rect x="472" y="110" width="48" height="40" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="496" y="135" text-anchor="middle" fill="#222" font-size="12">d2=9</text>
<text x="496" y="102" text-anchor="middle" fill="#222" font-size="12">f=0</text>
<line x1="136" y1="106" x2="136" y2="156" stroke="#222" stroke-width="3"/>
<text x="136" y="176" text-anchor="middle" fill="#222" font-size="12">jump</text>
<line x1="232" y1="106" x2="232" y2="156" stroke="#222" stroke-width="3"/>
<text x="232" y="176" text-anchor="middle" fill="#222" font-size="12">jump</text>
<line x1="328" y1="106" x2="328" y2="156" stroke="#222" stroke-width="3"/>
<text x="328" y="176" text-anchor="middle" fill="#222" font-size="12">jump</text>
<line x1="424" y1="106" x2="424" y2="156" stroke="#222" stroke-width="3"/>
<text x="424" y="176" text-anchor="middle" fill="#222" font-size="12">jump</text>
<text x="300" y="210" text-anchor="middle" fill="#222" font-size="12">Four jumps inside every block (at 0.d1 2, 0.d1 4, 0.d1 6, 0.d1 8), none at block ends</text>
<text x="300" y="230" text-anchor="middle" fill="#222" font-size="13">10 first digits x 4 jumps = 40 points of discontinuity</text>
</svg>
